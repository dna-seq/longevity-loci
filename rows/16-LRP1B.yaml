variants:
  - rsid: rs117898573
    gene: ""
    phenotype: LRP1B region, East Asian healthy ageing
    trait_efo_id: EFO_0009762
    effect_allele: T
    effect_size: 2.433
    effect_measure: OR
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one almost everyone has (about 95 in
          100 people of East Asian ancestry, and practically everyone of European ancestry). It is the reference the
          other combinations are compared with. The region, on chromosome 2, lies within the LRP1B gene. The
          finding comes from Singapore Chinese; this version barely exists outside East Asia.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of a rare version of this DNA region (about 5 in 100 people of East Asian ancestry do;
          it is almost never seen in people of European ancestry). In one study of older Singapore Chinese, people
          with this version were more often still free of major disease, pain and disability in their seventies.
          This is early evidence: the study was small, the result only just strong enough to count, it has not been
          confirmed in a separate group of people, and whether it lengthens life is unknown. It may not apply at
          all to people of other ancestries. It is a tendency, not a guarantee.
      - genotype: T/T
        state: protective
        conclusion: >-
          You carry two copies of a rare version of this DNA region (fewer than 1 in 1,000 people of East Asian
          ancestry do). In one study of older Singapore Chinese, each copy of this version went with being more
          often free of major disease, pain and disability in their seventies. This is early evidence: the study
          was small, it has not been confirmed in a separate group of people, and almost no one carries two copies,
          so how they fare was not measured directly. It may not apply at all to people of other ancestries. It is
          a tendency, not a guarantee.
