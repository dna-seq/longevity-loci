# The seed list's locus 16, LRP1B (2q22.1). Curated 2026-11-11, the second run's sixth row. Lead rs117898573 (Chang
# 2022's healthy-ageing GWAS in Singapore Chinese, Table 1), the seed's only rsID here: an intron variant of LRP1B,
# East Asian (T 0.025 in 1000 Genomes EAS), absent from European data (C in all 1,006 EUR chromosomes). Not in
# Timmers 2019's or Zenin 2019's summary statistics, nor in Deelen 2019's (all European; no row at 2:142877484 in
# either percentile file). Open Targets 26.09 does not know the variant; the GWAS Catalog (2026-10-29) holds Chang's
# association alone, and a literature search on the rsID finds no other paper.
locus_id: 16
locus_name: LRP1B
verdict: re-tiered
verdict_reason: >-
  Tier C, down from the seed's single-track B: a genome-wide healthspan result with no co-occurring lifespan study,
  so it cannot score (§4.5 as D16 reads it) and stays in the research view. Chang 2022 compared 1,618 Singapore
  Chinese aged 65 or more who had aged healthily (no major chronic disease, no cognitive impairment, no depression,
  no limitation in daily activities, good physical function and self-rated health, no limiting pain) with 6,221
  survivors who had not. That is a healthspan contrast among the living, not survival: HEALTHSPAN in §4.5. The rare
  T (3 % in the cohort) went with healthy ageing, OR 2.43 per allele, meta P 2.59e-8 (discovery 9.65e-9). The
  replication arm, 129 cases from the same cohort genotyped later, leans the same way at P 0.70 (OR 1.22, CI 0.45 to
  3.29, Cochran's Q P 0.15): uninformative rather than failed, so no replication_failed flag; it is separate
  people the paper keeps apart, independent by D19.1, but it replicates nothing. With lifestyle covariates the meta P weakens to 1.14e-7, below genome-wide. The lifespan side is
  untested, not null: the variant is East Asian (gnomAD East Asian 0.019, 1000 Genomes EAS 0.025) and essentially
  absent in Europeans, so no European lifespan or longevity study holds it, and no East Asian lifespan result for it
  was found. Exceptional survival is untested for the same reason. The context is ancestry-specific (R-ANC-4): it is
  not to be scored outside East Asian ancestry, and without inferred ancestry it belongs in the research view in any
  case. The paper's LRP1B link to earlier healthy-ageing haplotypes is gene-level only: those were European, where
  this variant does not occur, so they are not a replication. Of the seven domains, T goes with no function-limiting
  pain (adjusted P 0.010) and no major chronic disease (0.033), components of the same outcome in the same people;
  the mechanism is filed as general ageing. No gene is named: Open Targets 26.09 has no record of the variant, and
  Chang's study there has one credible set, on chromosome 5, so causal and effector confidence are C4 and E4. The
  protection is a presence: the rare allele goes with healthier ageing. Age of action is unknown.
