# The seed list's locus 147, KIF13B (8p12). Curated 2026-11-16. Lead rs62502826, the seed's only rsID (Deelen 2019's
# 99th percentile suggestive locus): intronic in KIF13B on its MANE Select transcript, GRCh38 8:29,124,778 G/A, GRCh37
# 8:28,982,295, A at 0.137 in gnomAD's non-Finnish Europeans and 0.032 in East Asians, A the discovery's longer-lived
# allele. Open Targets 26.09 has no record of it; the GWAS Catalog (2026-10-29) holds no association.
locus_id: 147
locus_name: KIF13B
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's C: a sub-genome-wide discovery that fails a powered test in its own ancestry outside its
  sample (D26.8; row 136's shape). In Deelen 2019's European meta-analysis (no UK Biobank data) A raises the odds of
  reaching the 99th percentile age, OR 1.23 (1.13–1.33), P 5.6e-7, under genome-wide, I² 14.9 (summary statistics A
  +0.2074, SE 0.0414); the 90th percentile line (P 0.0013) draws on the same cases and is not independent. Deelen's own
  UK Biobank validation of parents past the 99th percentile gives A OR 1.04 (0.90–1.19), P 0.61, unpowered at half the
  discovery's effect for a parent's genotype (power 0.42, heterogeneity P 0.38; derived). Pilling 2017's UK Biobank
  parental scans, outside Deelen's sample, lean A's way but flat (both parents' attained age P 0.17, mothers 0.061,
  fathers 0.74, both parents in the top 10 % 0.45). Carried from Deelen's 99th percentile to Timmers' scale by APOE's
  99th factor (6.22, D30.16) and to Pilling's both-parents scale at Timmers' about 1.97 (D30.16), the discovery expects
  A −0.0169 on Pilling's Martingale against the observed −0.0045 (SE 0.0033): power 1.00, heterogeneity P 0.0081,
  holding down to 0.48 of the effect; by the loci's mean factor, which divides (6.22 × 0.4175, D27.2), −0.0405, power
  1.00, heterogeneity P 3.6e-5 (derived, the discovery's error counted): a D21 red flag under both calibrations,
  `replication_failed`. Timmers 2019's parental lifespan (UK Biobank and LifeGen, which shares cohorts with Deelen, so
  not independent) gives A beta1 +0.0049 (SE 0.0056), P 0.38, and flags the same way (APOE factor power 1.00,
  heterogeneity P 0.0011; mean factor P 9e-6), adding nothing. No independent scoring-class study passes A's way
  (D25.1): Park 2025's own survival is flat (whole cohort P 0.91, men 0.47, women 0.48); FinnGen R11's deaths put A
  with fewer deaths, P 0.024 (one-sided 0.012), but a release line replicates nothing (D29.1). Zenin 2019 flat (A
  earlier, P 0.30); Foote 2025's general factor puts A on the frailer side, flat (P 0.18), its factors 1 to 6 flat (P
  0.10 to 0.88). Wright 2019's AncestryDNA tables list nothing at the lead under their P 0.003 cut (unknown above it);
  the mothers' rs6989058 78 kb away (P 0.0011) tags the lead at r² 0.34 only, and the fathers' rs10097270 246 kb away
  (P 4.3e-5) has no LD pair: neither tests it. The literature search (the rsID with KIF13B and longevity, 2026-11-16; Semantic
  Scholar answered 429, its part unchecked) finds Deelen alone; the rest is KIF13B cell biology. Every
  genotype neutral (D25.2). Exceptional survival 0 (the discovery gives no `+` on a D row, D28.10; Deelen's UK
  Biobank validation flat); lifespan + on FinnGen's release line alone (one-sided 0.012; D34.13, D34.5: a release line
  fills a cell, and FinnGen shares no sample with the discovery), with Timmers, Pilling and Park flat, put to the
  lead; healthspan 0 (Zenin and Foote flat). Mechanism ageing in general (D25.7): intronic in KIF13B, a kinesin;
  nothing recorded ties it to lifespan. Causal C4 and effector E4: no Open Targets record. Descriptive. Age of action
  unknown.
