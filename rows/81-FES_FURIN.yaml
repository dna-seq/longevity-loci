variants:
  - rsid: rs6224
    gene: FES
    phenotype: FES/FURIN region, cardiometabolic disease
    trait_efo_id: EFO_0007796
    effect_allele: G
    effect_size: 0.2507
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/T
        state: neutral
        conclusion: >-
          You carry one copy of each of the two common versions of this DNA region, the most common combination
          (about half of people of European ancestry have it). It is the reference the other combinations are
          compared with, so it neither raises nor lowers your expected lifespan here. The region, on chromosome 15,
          holds the FES and FURIN genes and has been linked to heart and blood-pressure traits. The finding comes
          from people of European ancestry; less is known elsewhere.
      - genotype: G/G
        state: protective
        conclusion: >-
          You carry two copies of the version of this DNA region that goes with longer life (about 28 in 100
          people of European ancestry do). In very large British and European studies each copy went with parents
          living on average about a month and a half longer. The region holds the FES and FURIN genes and has been
          linked to heart and blood-pressure traits; FES is the more likely of the two to matter, but this is not
          proven. The finding is well established; the effect is small and it is a tendency, not a guarantee.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of the version of this DNA region that goes with slightly shorter life (about 22 in
          100 people of European ancestry do). In very large British and European studies each copy went with
          parents living on average about a month and a half less. The region holds the FES and FURIN genes and has been
          linked to heart and blood-pressure traits; FES is the more likely of the two to matter, but this is not
          proven. The finding is well established; the effect is small and it is a tendency, not destiny. Your
          blood pressure, cholesterol and smoking matter more for your heart than this DNA result.
