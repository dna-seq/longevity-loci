    effect_allele: A
    effect_size: 0.082
    effect_measure: beta
    stat_significance: significant
    direction: unknown
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the C version of this DNA position (about 45 in 100 people of European ancestry do).
          It is the reference the other combinations are compared with. The position lies inside TERT, the gene for the
          enzyme that rebuilds telomeres, the protective caps at the ends of chromosomes. Telomere length is a marker
          whose reading only means something against your calendar age, which this report does not have, so this
          result carries no score.
      - genotype: A/C
        state: neutral
        conclusion: >-
          You carry one copy of the A version of this DNA position (about 44 in 100 people of European ancestry do).
          Large studies link it with slightly longer telomeres in white blood cells, under a tenth of the usual spread
          between people. That is a tendency in a marker whose reading only means something against your calendar age,
          which this report does not have, so it carries no score.
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the A version of this DNA position (about 11 in 100 people of European ancestry do).
          Each copy is linked in large studies with slightly longer telomeres in white blood cells. That is a tendency
          in a marker whose reading only means something against your calendar age, which this report does not have,
          so it carries no score.
