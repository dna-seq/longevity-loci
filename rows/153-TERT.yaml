# The seed list's locus 153, TERT (5p15.33): a marker of biological ageing (D32, D36.3), curated on D37.12 with 23
# TERC as the pattern. Curated 2026-11-16. Lead rs7705526, the seed's rsID (Li 2020's first TERT telomere-length
# signal): intronic in TERT's MANE transcript, GRCh38 5:1,285,859, GRCh37 5:1,285,974, multi-allelic C/A/G/T, the row
# meaning C/A; A at 33.1 % in gnomAD's non-Finnish European genomes. A is the longer-telomere allele. Row 30's
# rs2736100 is a partial tag (r² 0.46, CEU), row 133's rs2853677 another (r² 0.21).
locus_id: 153
locus_name: TERT
verdict: kept
verdict_reason: >-
  Tier A on the marker's own evidence (D37.12; the seed gives none), tiered from the seed's study, Li 2020 (D37.11):
  the tier grades the association with leukocyte telomere length, not longevity, and this row is unscored (D32). Li
  2020's meta-analysis (78,592 Europeans of ENGAGE, EPIC-CVD and EPIC-InterAct, no UK Biobank) prints rs7705526 with
  A (EA) at 0.33, β +0.082 SD (SE 0.006), P 5.34e-45. Codd 2021's 472,174 UK Biobank participants print it as one of
  locus 36's conditionally independent sentinels, A1 C at 0.673, β −0.078 (−0.082 to −0.073), P 2.4e-282, N_imp
  451,006, joint estimate −0.053, Europeans the same, and its own credible set holds it at PP 1: A longer, the same
  allele and side. D21's test: Li +0.082 (SE 0.006) against Codd +0.078 for A (SE about 0.0023), heterogeneity P
  0.53, Codd's power at Li's effect 1.00: no red flag. A study of 100k or more, genome-wide, replicated
  independently on the same allele: §4.1's A. Li and Codd hold 133's rs2853677 as a separate conditional signal
  (r² 0.21); 30's rs2736100 tags it partly (r² 0.46). Lifespan look-ups, unscored and read for A, two-sided at 0.05
  (D38.6): Park 2025's own survival has A with more deaths (C −0.0019, SE 0.0007, P 0.007; men 0.029, women 0.096);
  Timmers 2019 A beta1 −0.0043 (SE 0.0043), P 0.32, the same way; Pilling 2017's parents P 0.075 to 0.15; Deelen
  2019 90th P 0.65, 99th P 0.76; FinnGen R11's deaths P 0.64, a database line. Zenin 2019's healthspan has A with the
  earlier end, +0.0194 (SE 0.0053), P 2.2e-4. Foote 2025's deposits hold no line (untested). The literature search
  (the rsID, 2026-11-16) finds telomere-length, lung-cancer and clonal-haematopoiesis GWASs, no test of lifespan.
  Every genotype neutral, each conclusion a tendency of the marker with no colour (D32, D37.12); `direction:
  unknown`. Outcome cells read for A: exceptional survival 0 (Deelen flat); lifespan − (Park two-sided 0.007, A
  with more deaths, the side named, D38.6; Timmers the same way at 0.32); healthspan − (Zenin two-sided 2.2e-4, A
  the earlier end). Mechanism: markers of biological ageing. Pleiotropy `mech:cancer`: A, the longer-telomere allele,
  raises lung adenocarcinoma (OR 1.31, P 9e-96), clonal haematopoiesis (OR 1.27, P 3e-127) and serous borderline
  ovarian cancer (OR 1.38, P 6e-19), as at 30 and 133; no `tradeoff`, the row naming no longevity-favoured allele.
  Causal C1 (PIP 1.00 in the telomere PC1 set and in Li's; PP 1 in Codd's). Effector E2, TERT: locus-to-gene 0.81
  (CLPTM1L 0.05), the variant intronic in TERT. Descriptive. Age of action unknown. The evidence is European.
