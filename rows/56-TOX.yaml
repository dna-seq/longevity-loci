variants:
  - rsid: rs13262617
    gene: ""
    phenotype: TOX region, fathers' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: G
    effect_size: -0.0360
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 93 in 100). It is the reference the other versions are compared with, so it neither raises
          nor lowers your expected lifespan here. The region lies inside the TOX gene on chromosome 8, but nothing
          shows which gene, if any, matters. The finding comes from people of European ancestry; less is known
          elsewhere.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 7 in 100 people of European
          ancestry do). In one large British study it went with fathers living a little longer, though not
          mothers. Other studies, of the very old and of a Finnish population, did not confirm it, so this is a
          single finding, not a settled one, and the effect is small: a tendency, not destiny.
      - genotype: G/G
        state: protective
        conclusion: >-
          You carry two copies of a rare version of this DNA region (about 1 in 800 people of European ancestry
          do). In one large British study each copy went with fathers living a little longer, though not mothers.
          Other studies, of the very old and of a Finnish population, did not confirm it, so this is a single
          finding, not a settled one, and the effect is small: a tendency, not destiny.
