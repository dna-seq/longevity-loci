# The seed list's locus 56, TOX (8q12.1). Curated 2026-11-12. Lead rs13262617 (the seed's lead), from Pilling 2017's
# fathers' analysis. No CEU proxy above r² 0.71 (rs79725344, rs10504278); Wright 2019's fathers' table holds two weaker
# tags (rs13252116 r² 0.57, rs7815098 r² 0.39), named, not counted. Not in Open Targets 26.09.
locus_id: 56
locus_name: TOX
verdict: kept
verdict_reason: >-
  Tier B, as the seed, the default the lead confirmed (D28.2). G, a derived allele of about 4 in 100 European chromosomes and
  absent in East Asians, goes with longer-lived fathers in Pilling 2017's UK Biobank analysis, genome-wide (P 3.1e-8;
  0.82 years per copy in self on Timmers 2019's scale), and in fathers only: mothers P 0.81, both parents 9.6e-3. No
  independent sample replicates it. LifeGen's fathers without UK Biobank lean G's way (0.23 years, one-sided P 0.22),
  on one scale no red flag (power 0.86, heterogeneity P 0.078). Deelen 2019 leans against G at both percentiles (P
  0.25 and 0.18), and FinnGen R11's deaths lean against it too (P 0.54). Whether those are red flags turns on which
  discovery effect is carried to their scales (D25.3), settled by D28.2: a sex-combined sample is tested on the both-parents effect. From a both-parents
  effect, the like of Deelen's and FinnGen's sex-combined samples, 0.029 to 0.042 on Timmers' scale (derived: Timmers'
  pooled UK Biobank and LifeGen estimate 0.0358, SE 0.0113, and Pilling's both-parents P 9.6e-3 at a UK Biobank-only SE
  of 0.0113 to 0.016; Pilling prints no both-parents β), Deelen's 90th flags under APOE's factor only (power 0.84 to
  0.98, heterogeneity P 0.002 to 0.008; the mean factor's power 0.30 to 0.48) and FinnGen under neither (APOE power
  0.42 to 0.66): no red flag, so a single genome-wide study without independent replication, B. The one same-sex
  independent test, LifeGen's fathers, does not flag; a D arises only from carrying a fathers' effect into
  sex-combined samples. From the fathers' 0.0824 the 90th flags under both (mean
  factor power 0.93, heterogeneity P 0.0016 counting the mean's SE), with no independent scoring-class p < 0.05 G's
  way, which would make the row D (D25.1); FinnGen would flag under APOE's only (power 0.99, P 1.6e-4; mean 0.52).
  Wright 2019's AncestryDNA fathers give rs7815098, a tag at r² 0.39 whose minor T (0.09) travels with the lead's G,
  T longer-lived at one-sided about 0.040 after genomic control, and rs13252116 (r² 0.57, minor A) P 0.30 (S9's label
  read as the other allele, the β per the minor allele, anchored by the UK Biobank arm's sign, as at row 39): tags
  this weak are named, not counted (with no flag, D28.2, the question whether one would count against a D falls away). Timmers' pooled summary statistics
  (P 0.0015, both arms G's way) hold UK Biobank, so they co-occur and do not replicate. Zenin 2019's healthspan, in
  the same UK Biobank people, goes against G at P 0.049, one-sided about 0.025 (healthspan scores nothing alone, D22.2,
  so no tier weight); the cell is `−` by D28.3, a one-sided pass against the allele with none for it (the previous
  commit's 0 rejected by the lead). The lead's G is the derived allele: a presence. Open Targets 26.09 holds no
  record of the lead or of its best tags (rs79725344, rs10504278, r² 0.71), by key and by rsID search, so no
  credible set and no gene: C4, E4; Ensembl's VEP places it in an intron of TOX, named as
  the gene the variant lies in, not as the gene acting. Mechanism general ageing, no pleiotropy quoted; age of
  action unknown. A fathers-only signal: sex-specific, male.
