variants:
  - rsid: rs34967069
    gene: ""
    phenotype: HLA-DQA1/DRB1 region, autoimmune disease
    trait_efo_id: EFO_0007796
    effect_allele: T
    effect_size: 0.5613
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 86 in 100). It is the reference the other versions are compared with, so it neither raises
          nor lowers your expected lifespan here. The region, on chromosome 6, holds immune-system genes (the HLA
          genes) that help the body tell its own cells from germs, and it is not yet clear which gene matters. The
          finding comes from people of European ancestry; less is known elsewhere.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 13 in 100 people of European
          ancestry do). The region holds immune-system genes (the HLA genes), and in large British and European
          studies this version went with parents living on average about three months longer, and with staying
          free of major disease a little longer. The region is linked to autoimmune diseases such as rheumatoid
          arthritis, and the effect showed mostly in deaths before age 75. It is a likely finding, not a settled
          one: a large American study saw a similar effect at a nearby marker, but that marker may reflect a
          neighbouring signal, and this exact variant has not been confirmed elsewhere.
          The effect is small and it is a tendency, not a guarantee.
      - genotype: T/T
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA region (fewer than 1 in 100 people of European
          ancestry do). The region holds immune-system genes (the HLA genes), and in large British and European
          studies each copy went with parents living on average about three months longer, and with staying free
          of major disease a little longer. The region is linked to autoimmune diseases such as rheumatoid
          arthritis, and the effect showed mostly in deaths before age 75. It is a likely finding, not a settled
          one: a large American study saw a similar effect at a nearby marker, but that marker may reflect a
          neighbouring signal, and this exact variant has not been confirmed elsewhere,
          and very few people carry two copies. The effect is small and it is a tendency, not a guarantee.
