# The seed list's locus 38, HLA-DQA1 (6p21.32, the HLA class II region between HLA-DRB1 and HLA-DQA1). Curated
# 2026-11-11, the ten-row run's second row; corrected the same day on the lead's review, and at row 103 (the
# AncestryDNA tag is shared with it). Lead rs34967069 (Timmers
# 2019). Joshi 2017's rs34831921 is the same signal (1000 Genomes EUR r² 0.97, Ensembl; no cached LD record yet, RM3).
# Pilling 2017's rs28383322 is a weaker tag (r² about 0.3) and is named only; rs9277988 (Rosoff 2023, mvAge) lies 700
# kb away.
locus_id: 38
locus_name: HLA-DQA1
verdict: kept
verdict_reason: >-
  Tier B, down from the seed's single-track A (§12): genome-wide significant, with no independent replication of its
  own (§4.1's B clause). Timmers 2019 finds rs34967069 at P 4.3e-9 in about one million parents' lives (UK
  Biobank and LifeGen), the rare T allele (7 %) adding 0.56 years per copy. Joshi 2017's rs34831921 (P 4.2e-8) is the
  same signal, 1000 Genomes EUR r² 0.97 with D′ 1 (Ensembl's LD, not yet a cached record), but in a subset of the same
  samples, so it does not replicate it; Pilling 2017's rs28383322 (P 5.3e-11, UK Biobank) is a weaker tag and is named
  only. In AncestryDNA's mothers (Wright 2019, Supplemental Table 8), a sample independent of UK Biobank and LifeGen,
  rs3135006, a tag at r² 0.38 and D′ 1 whose minor T carries the lead's T, lengthens mothers' lives, P 3.3e-4, and
  with UK Biobank reaches P 3.1e-5 with no heterogeneity (P 0.32). But rs3135006 tags row 103's healthspan lead
  rs1049053 more closely (r² 0.80), and rs1049053 lies at r² 0.32 to this lead, so the AncestryDNA result is shared by
  the two rows and cannot be assigned to this signal: it is kept as a study and not counted as this lead's
  replication. The lead itself has no row in an independent sample. At the oldest ages it leans the same way and does not pass: Deelen 2019's 90th and 99th percentiles give OR 1.05 and 1.07 (P 0.26,
  0.24) at the lead, and Timmers 2019's longevity look-up reaches P 0.056 one-sided at CHARGE's tag rs3129720 (the
  same SNP as rs3135006 in effect, CEU r² 1.0). This is consistent with an effect that is largest in midlife and
  fades at the oldest ages (Joshi: larger on parents' deaths at 40-75 than after), and it is no red flag.
  Exceptional survival is 0: Joshi's CHARGE-EU 90+ gives P 0.003 at that tag, but the larger combined longevity
  samples, Timmers 2019's look-up at the tag and Deelen 2019 at the lead, do not pass. Healthspan agrees, in UK
  Biobank: P 1.9e-7 at the lead (Zenin 2019's summary statistics), 2.7e-8 at Joshi's SNP; LD with row 103's stronger
  healthspan lead alone would give a z of about 3.9 at this lead, against 5.2 observed, so part of it may be shared. The locus acts through
  immune disease, not general ageing: Timmers 2019 files it as autoimmune; Joshi finds associations with rheumatoid
  arthritis and Crohn's disease at his SNP, with no direction quoted, and reads the locus as disease susceptibility.
  The region holds other signals: Joshi finds no SNP in strong LD with the lead in CHARGE, and Zenin's healthspan lead
  rs1049053, 43 kb away and common (0.67), is its own row (locus 103). No gene is named (requirements §4.2, §6.2: a
  gene only at E1/E2): Open Targets 26.09 returns neither rsID and holds no lifespan credible set in the region, so
  causal and effector confidence are unassessed (C4, E4; no flag, nothing to cite). The seed's hypothesised
  autoimmune-infection trade-off is not recorded: no cached source tests it.
