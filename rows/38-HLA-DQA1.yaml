# The seed list's locus 38, HLA-DQA1 (6p21.32, the HLA class II region between HLA-DRB1 and HLA-DQA1). Curated
# 2026-11-11, the ten-row run's second row. Lead rs34967069 (Timmers 2019). The seed's other rsIDs are not shown to be
# proxies of it: rs34831921 (Joshi 2017) and rs28383322 (Pilling 2017) have no r² to the lead in any cached source,
# and rs9277988 (Rosoff 2023, mvAge) lies 700 kb away.
locus_id: 38
locus_name: HLA-DQA1
verdict: kept
verdict_reason: >-
  Tier B, down from the seed's single-track A (§12): genome-wide significant, but no independent replication of the
  lead. Timmers 2019 finds rs34967069 at P 4.3e-9 in about one million parents' lives (UK Biobank and LifeGen), the
  rare T allele (7 %) adding 0.56 years per copy. Nearby leads are also genome-wide: Joshi 2017's rs34831921 (P
  4.2e-8, in a subset of the same samples) and Pilling 2017's rs28383322 (P 5.3e-11, UK Biobank). Their LD with the
  lead is not given in any cached source, and their frequencies differ (0.09 and 0.22 against 0.07). The region holds
  many independent signals (Timmers 2019 counts at least 25 at HLA-DQA1), so they are named here, not scored. Outside
  UK Biobank and LifeGen the lead itself is null: Deelen 2019's 90th and 99th percentiles give OR 1.05 and 1.07 (P
  0.26, 0.24), the same side. The replication Joshi reports in CHARGE-EU 90+ (P 0.003) is at rs3129720, r² 0.39 to
  his own lead. In Timmers 2019's longevity look-up the same SNP carries the lead's signal only weakly (discovery P
  0.005) and reaches P 0.056 one-sided. These nulls are underpowered and on the lead's side, so they are no red flag.
  Healthspan agrees, in UK Biobank: P 1.9e-7 at the lead (Zenin 2019's summary statistics), 2.7e-8 at Joshi's SNP.
  The locus acts through immune disease, not general ageing: Timmers 2019 files it as autoimmune; Joshi finds
  rheumatoid arthritis and Crohn's disease at his SNP, with a larger effect on deaths at 40-75 than after. No gene is
  named (requirements §4.2, §6.2: a gene only at E1/E2): Open Targets 26.09 returns neither rsID and holds no lifespan
  credible set in the region, so causal and effector confidence are unassessed (C4, E4; no flag, nothing to cite).
  The seed's hypothesised autoimmune-infection trade-off is not recorded: no cached source tests it.
