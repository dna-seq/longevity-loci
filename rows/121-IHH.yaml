# The seed list's locus 121, IHH (2q35). Curated 2026-11-15. Lead rs149554120, the seed's only rsID (Kolbe 2025's
# exome-wide rare variant): synonymous in IHH (arginine 291 unchanged on the MANE Select transcript), GRCh38
# 2:219,055,570 C/T, GRCh37 2:219,920,292, T the rare allele (0.29 % in gnomAD's non-Finnish European exomes) and the
# discovery's longer-lived side. Open Targets 26.09 holds the variant with no credible set; the GWAS Catalog
# (2026-10-29) holds no association.
locus_id: 121
locus_name: IHH
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's C (D31.11, D26.7's "overfit source"): the discovery, read against the reference, shows
  nothing, and nothing else at the lead passes. Kolbe 2025 sequenced the exomes of 1,245 German long-lived
  individuals and 4,105 younger controls; T was at 0.32 % among the long-lived and 0.10 % among the controls, OR 3.3
  (Haldane-corrected), P 2.4e-6, adjusted 0.036 under the paper's exploratory false-discovery rate of 0.05, its own
  exome-wide call. On 2,490 and 8,210 alleles that is about 8 copies against 8 (the Haldane OR from 8 and 8 is 3.30,
  derived). The controls misfit every matching reference: gnomAD's non-Finnish exomes (0.29 %) expect 23.6 copies in
  them and they show about 8 (Poisson P 2e-4), the non-Finnish genomes, a separately sequenced set of 68,034 alleles
  (their UK Biobank content not read here, so the paper's "mostly British" caveat is not settled), expect 22.4 (P
  4e-4); the long-lived sit at the reference (about 8 against 7.2
  and 6.8, P 0.43 and 0.37, derived). Read against the exomes the long-lived give OR 1.12 (about 8 copies where 7.2 are
  expected, exact Poisson P 0.43, derived), the row's carried figure; the paper's own OR against gnomAD, 1.18, which
  it calls considerably lower than its own, back-solves to 0.271 %, the genomes' frequency, not the exomes' 0.288 %
  (likely genomes-based; a gnomAD v4.0 against v4.1 gap is not ruled out; D34.14). Kolbe chose its hits from about 98,000 rare variants, so a reference OR still carries that
  selection, uncorrected (D34.14). Only the Finns (0.20 % and 0.16 %, a bottlenecked population, P 0.02 and 0.09) or UK Biobank's imputed
  0.15 % (Zenin's and Park's frequency, a dosage, not a sequenced reference) would put the controls near fit. UK Biobank's imputed deposits put T at 0.15 % against gnomAD's sequenced 0.29 %: read as imputation under-calling (D35.6), since Kolbe notes gnomAD's non-Finnish Europeans are mostly British (q12); whether the release Ensembl 116 reads is gnomAD v4, whose exomes are largely UK Biobank's, is not stated in the records read, and neither deposit prints an imputation-quality value (Park's columns, pmid-40021682#q28; Pilling's header, pmid-29227965#q187), so the reading is pending, put to the lead; the deposits' lines here are weak looks. So the
  case-control OR is the controls' deficit and sets nothing (D31.10, D31.11), row 109's shape. With the paper's sex
  ratios (2.7:1 women among the long-lived, 1:1.4 among the controls) the women carry about 1 copy in some 1,820
  long-lived alleles (5.2 expected from gnomAD's exomes, P 0.033) and none in some 3,420 control alleles (9.8
  expected, P 5e-5), the men about 7 in some 670 long-lived alleles (1.9 expected, P 0.004) and 8 in some 4,790
  control alleles (13.8 expected, P 0.07) (approximate, derived): the women sit below the reference in both arms,
  and the men alone would be row 107's shape, long-lived above it; across Kolbe's rows 107, 120, 121, 124, 125 and
  126 about 24 of 35 long-lived copies are in men, who are 27 % of the long-lived (D34.7, D34.14), named, no token. The paper tests no sex subgroup, so the split is
  named, not read, and carries no sex token (D30.15). The gene-based
  synonymous IHH mask (P 5.74e-6) is this variant's signal, lost when it is removed: the same data, not counted. The
  lead's other evidence: the paper's Ashkenazi look-up (515 aged 95 or more, 496 younger controls) has 4 T copies in
  the long-lived and 2 in the controls, OR 1.93, P 0.30, its controls fitting gnomAD's Ashkenazi exomes (2 against
  1.33), so it is read as printed (D31.10 licenses a reference only for misfit controls) and does not pass; read
  against that reference instead the long-lived would give one-sided 0.052 (exomes) or 0.013 (genomes, 3 copies),
  a reading the lead declined at row 120 (Q1, (a): a reference only for misfit controls, never chosen because it
  helps), so the look-up does not pass. The Leiden look-up has 1 copy in 179 long-lived and
  none in 98 controls, where gnomAD expects about 1.0 and 0.6: nothing. FinnGen R11's death endpoint has T with
  slightly fewer deaths (−0.027, SE 0.087, P 0.76), a database line; Park 2025 has T with slightly more deaths
  (+0.0151, SE 0.0102, P 0.14, its allele columns swapped); Zenin 2019's healthspan has T a little earlier (+0.032,
  SE 0.075, P 0.67); the last two read T at UK Biobank's imputed 0.15 %, weakened tests. Deelen 2019, Timmers 2019,
  Pilling 2017 and Foote 2025 hold no line (untested); Wright 2019's three Table 8 lines within 500 kb (mothers,
  417 to 456 kb) cannot be paired, since 1000 Genomes' CEU holds no T copy and no LD look is possible. Timmers'
  strongest line within 500 kb, rs12694456 (202 kb, P 0.0012), and Deelen's (99th 2:220,240,357, 320 kb, P 3.3e-5;
  90th 2:220,400,267, 480 kb, P 4.0e-4) tag it at r² 0.086, 0.093 and 0.009 at most by frequency (derived): nothing
  suggestive. The literature search (the rsID, and IHH with longevity terms; Semantic Scholar answered 429, its part
  unchecked) finds Kolbe alone; Kolbe's five citing papers (Semantic Scholar) test no IHH variant, and the 2026
  bioRxiv functional study by the same groups edits variants in other genes (DEPTOR, RAF1, PHLPP1, NF1, IRS1; read
  from Europe PMC's preprint copy, which the cache cannot hold), none in IHH. Every genotype neutral (D25.2). Outcome cells: exceptional survival 0 (the discovery
  sets nothing; the look-ups do not pass), lifespan 0 (Park and FinnGen flat), healthspan 0 (Zenin flat). Mechanism
  ageing in general (D25.7): the authors cite a report that IHH downregulates mTOR signalling in bone-marrow stem
  cells, a route not tested here; named. Causal C4: Open Targets holds the variant in no credible set. Effector E4:
  the change is synonymous and alters no protein (D31.9). Descriptive. Age of action unknown. The evidence is
  European.
