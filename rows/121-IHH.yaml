variants:
  - rsid: rs149554120
    gene: ""
    phenotype: IHH synonymous, longevity
    trait_efo_id: OBA_VT0005372
    effect_allele: T
    effect_size: 1.12
    effect_measure: OR
    stat_significance: not_significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as nearly everyone does. It is the
          reference the other combinations are compared with. The position lies in the IHH gene on chromosome 2.
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of a rare version of this DNA position (about 6 in 1,000 people of European ancestry do).
          It lies in the IHH gene and does not change the protein the gene makes. One German study found it more often
          among very long-lived people than among its younger controls, but the long-lived carried it about as often as
          the general population does; the difference came from the controls carrying it unusually rarely, so it is not
          counted for or against lifespan.
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of a rare version of this DNA position, which is very unusual; the one study of it found
          no one with two copies. It lies in the IHH gene and does not change the protein the gene makes. The study's
          single-copy finding was not borne out against the general population, so it is not counted for or against
          lifespan.
