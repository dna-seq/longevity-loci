# The seed list's locus 105, NHLRC1 (6p22.3): a marker of biological ageing (D32, D36.3), curated on D37.12 with 23
# TERC as the pattern. Curated 2026-11-16. Lead rs10949481, the seed's rsID (McCartney 2021's epigenetic-clock
# locus): in the 3′ UTR of NHLRC1's MANE transcript, GRCh38 6:18,120,798 A/T, GRCh37 6:18,121,029, T ancestral; T at
# 4.3 % in gnomAD's non-Finnish European genomes. T is the allele with slower intrinsic epigenetic ageing.
locus_id: 105
locus_name: NHLRC1
verdict: kept
verdict_reason: >-
  Tier B on the marker's own evidence (D37.12; the seed gives none): the tier grades the association with intrinsic
  epigenetic age acceleration (IEAA), a DNA methylation clock read against calendar age, not longevity, and this row
  is unscored (D32). McCartney 2021's GWAS meta-analysis of epigenetic clocks names NHLRC1 among its IEAA loci; its
  Table S4 prints the European IEAA line, T (the effect allele, refA) at 0.053, β −1.082 years per T (SE 0.070), P
  4.5e-54, effective n 29,139, in a European analysis of 34,461 (the GWAS Catalog's study record); Open Targets
  fine-maps it there at PIP 0.72. Lu 2018's IEAA GWAS (9,907 people) had the locus already: its 6p22.3 lead
  rs143093668, r² 1.00 with rs10949481 in CEU, T at 0.05, β −1.78 years per T in Europeans, P 1.9e-21, the same side
  (its printed SE 0.10 does not reproduce that P, which implies an SE near 0.19; the printed P is read, D22.3), and
  −1.37 (P 2.4e-5) in its non-Europeans. Five of Lu's eight cohorts (FHS, TwinsUK, BLSA, InCHIANTI, the Lothian Birth
  Cohorts) are among McCartney's, so Lu is not an independent replication (D19.1, D38.13), and neither study reaches
  §4.1's 100k for A: B, a single study without independent replication. Lifespan look-ups, unscored and
  read for T, two-sided at 0.05 (D38.6), all flat: Timmers 2019 A beta1 −0.0065 (SE 0.0090), P 0.47; Pilling 2017's parents P 0.46 to 0.99; Park
  2025's own survival P 0.70 (men 0.43, women 0.75); FinnGen R11's deaths T β +0.037, P 0.081, a database line
  (D29.1); Deelen 2019 90th P 0.56, 99th P 0.23; Zenin 2019 P 0.70; Foote 2025's factors 1, 2, 3, 5 and 6 P 0.16 to
  0.88 (the general factor and factor 4 hold no line). The literature search (the rsID, 2026-11-16) finds nothing
  beyond the clock GWASs. Every genotype neutral, each conclusion a tendency of the marker with no colour (D32,
  D37.12); `direction: unknown`. Outcome cells read for T: exceptional survival 0, lifespan 0, healthspan 0 (each
  flat). Mechanism: markers of biological ageing. No pleiotropy read: the Catalog holds the clock line alone, and Open
  Targets' thiopurine-metabolism sets at the neighbouring TPMT hold it at PIP 0.02 or less. Causal C1 (PIP 0.72 in the
  IEAA set). Effector E3: locus-to-gene puts NHLRC1 at 0.65 but TPMT at 0.55, a rival that passes the threshold itself (D24,
  D38.13), though the variant lies in NHLRC1's 3′ UTR and its expression credible sets at low PIP (no colocalisation
  read). Descriptive. Age of action unknown. The
  anchor is European; Lu's non-European line agrees.
