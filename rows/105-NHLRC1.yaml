variants:
  - rsid: rs10949481
    gene: NHLRC1
    phenotype: NHLRC1 3′ UTR, epigenetic age acceleration
    trait_efo_id: EFO_0022597
    effect_allele: T
    effect_size: -1.08
    effect_measure: beta
    stat_significance: significant
    direction: unknown
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (about 92 in 100 people of European ancestry
          do). It is the reference the other combinations are compared with. The position lies in the NHLRC1 gene on
          chromosome 6. Epigenetic clocks estimate age from chemical marks on DNA; a clock's reading only means
          something against your calendar age, which this report does not have, so this result carries no score.
      - genotype: A/T
        state: neutral
        conclusion: >-
          You carry one copy of the T version of this DNA position (about 8 in 100 people of European ancestry do).
          Large studies link it with an epigenetic clock reading about a year lower than expected for your age,
          compared with people without T. That is a tendency in a marker whose reading only means something against
          your calendar age, which this report does not have, so it carries no score.
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the T version of this DNA position, which is rare (fewer than 1 in 100 people of
          European ancestry). Each copy is linked in large studies with an epigenetic clock reading about a year lower
          than expected for your age, compared with people without T. That is a tendency in a marker whose reading only
          means something against your calendar age, which this report does not have, so it carries no score.
