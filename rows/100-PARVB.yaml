variants:
  - rsid: rs62227724
    gene: ""
    phenotype: PARVB region, mothers' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: C
    effect_size: 0.0921
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 94 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome 22,
          lies in the PARVB gene.
      - genotype: C/G
        state: neutral
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 6 in 100 people of European
          ancestry do). One British study linked it to mothers dying a little earlier, but its own authors doubted the
          result and no independent study has confirmed it, so it is not counted for or against lifespan.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of a rare version of this DNA position (fewer than 1 in 1,000 people of European
          ancestry do). One British study linked it to mothers dying a little earlier, but its own authors doubted the
          result and no independent study has confirmed it, so it is not counted for or against lifespan.
