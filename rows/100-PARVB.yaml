# The seed list's locus 100, PARVB (22q13.31). Curated 2026-11-14. Lead rs62227724, the seed's only rsID (Pilling
# 2016's mothers' age-at-death SNP): intronic in PARVB, GRCh38 22:44,128,027, GRCh37 22:44,523,907, C/G, C ancestral and
# common, G 0.029 in non-Finnish Europeans (0.073 in Finns). Open Targets 26.09 has no record of the variant.
locus_id: 100
locus_name: PARVB
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's B (D28.13), row 60's shape: a hit its own authors set aside, with nothing independent for
  it. Pilling 2016's UK Biobank scan of mothers' age at death (52,776 participants) has the common C with mothers
  dying later, β +0.092 (SE 0.017), P 3.4e-8 (Supplementary Table 2), the only variant genome-wide for mothers there;
  imputation INFO 0.76. The authors chose not to pursue it: it "was of low frequency (3%) and not in a typical “peak”
  expected of robust results" (Results), the doubt row 60's D rests on, an overfit source by its authors' own reading
  (D28.13). Nothing independent stands for it. Pilling 2017's larger UK Biobank scan, which contains Pilling 2016's
  participants, leans C's way (mothers P 0.050, both parents 0.046; fathers 0.55; both parents in the top 10 % 0.88):
  the discovery's own biobank, so not independent. Timmers 2019 (C +0.029, P 0.034) prints "+-": C longer in UK
  Biobank, Pilling's people, and shorter in LifeGen's independent cohorts. Deelen 2019 has no line at the lead and no proxy stands in (Ensembl's
  CEU window holds nothing above r² 0.49), so the one extreme-survival look outside UK Biobank is untested.
  FinnGen R11's death endpoint leans C's way (G more deaths, P 0.15, one-sided 0.076), flat, a database line. Park
  2025's own survival (P 0.90) and Zenin 2019's healthspan (P 0.68) are flat; Foote 2025's readable deposits cover
  the window without the lead (the metabolic factor's returned the header alone). Wright 2019's AncestryDNA is
  untested: its nearest fathers' lines (rs2269606, 268 kb, r² 0.08; rs6006540, 370 kb, no CEU pair) do not tag the
  lead. Rosoff 2023's tables hold no line. The rsID literature search (Semantic Scholar 429, its part unchecked) finds
  only a review. Calibrated by Pilling 2016's own APOE line on the mothers' scale (ε4's rs429358 T +0.0183,
  pmid-27015805#q17; LifeGen's 0.1056, a factor of about 5.8), the discovery's 0.092, about five times ε4's, predicts
  a Timmers β near 0.53 per C against the printed 0.029 (SE 0.014): a flag under APOE's factor by a wide margin, but
  the loci's mean factor is undefined for this phenotype, so whether LifeGen or FinnGen flag it is unknown (D25.3,
  D26.3) and the row carries no replication_failed; the tier rests on the authors' doubt, as at 60. Outcome cells on a D row (D28.10, D30.17): lifespan 0 (the UK
  Biobank looks are the discovery's biobank, LifeGen's arm leans against without its own P), healthspan 0 (Zenin
  flat), exceptional survival untested (D29.4: the overfit discovery tests nothing, Pilling 2017's
  top-10 % look, flat, is the discovery's biobank, and Deelen has neither the lead nor a proxy).
  Mechanism general ageing (D25.7), pleiotropy empty: the GWAS Catalog holds no other trait for the variant.
  Descriptive. Causal C4 and effector E4, no gene named: Open Targets holds no record of the variant, and an overfit
  source sets no level anyway (D28.12); PARVB is named in prose. Every genotype neutral (D25.2); C/C, about 94 in 100
  Europeans, the reference. Age of action unknown. The evidence is European; G is commoner in Finns (0.073), where
  FinnGen's look is flat, so eur_only_evidence.
