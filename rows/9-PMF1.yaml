# The seed list's locus 9, PMF1 (1q22). Curated 2026-11-15. Lead rs2758603, the seed's only rsID (Deelen 2019's
# trans-ethnic 99th-percentile locus): GRCh38 1:156,229,203 T/C, GRCh37 1:156,198,994, C 0.36 in gnomAD's non-Finnish
# Europeans and the discovery's longer-lived allele. Open Targets 26.09 holds it in 127 credible sets, kidney function,
# stroke and CRP among them, none lifespan-class; the GWAS Catalog (2026-10-29) holds Deelen's line and one for height.
locus_id: 9
locus_name: PMF1
verdict: kept
verdict_reason: >-
  Tier C, the seed's: a suggestive discovery (§4.1's C) that no independent study has replicated or contradicted.
  Deelen 2019's trans-ethnic meta-analysis of survival to the 99th percentile against all controls gives C OR 1.12
  (1.02 to 1.22), P 9.8e-7, with heterogeneity across cohorts (I² 57 %, P 0.005), as Table 4 prints them, though
  the interval implies P near 0.01 (z about 2.5): the interval and P may come from different models, unexplained; its European deposits give C +0.102
  at the 99th (P 0.0011) and +0.049 at the 90th (P 0.016), the same cohorts. Timmers 2019's million parents' lives,
  with no UK Biobank in Deelen and at least the Rotterdam Study shared, lean C's way, short of nominal (C +0.0053 per
  self, P 0.19, one-sided 0.093; UK Biobank and LifeGen on opposite sides). Carried to that scale by D25.3's
  calibrations at the 99th percentile, the discovery predicts C +0.016 (APOE's factor) or +0.039 (the loci's mean):
  power 0.99 and 1.00, heterogeneity P 0.084 and 0.0072, a flag under the mean factor only, so none (D25.3). Pilling
  2017's UK Biobank parents lean C's way, flat (P 0.12 to 0.51); Park 2025's own survival C with fewer deaths, flat
  (P 0.34); FinnGen R11's death endpoint has C with fewer deaths at P 0.028 (one-sided 0.014), but a database line
  never replicates (D12, D30.12): named. Wright 2019's AncestryDNA has no line that tags the lead (the nearest, 51 kb,
  at r² 0.15; others not among its 91 CEU variants at r² 0.5, or beyond the window with no CEU pair): untested. Zenin
  2019's healthspan flat (C a little healthier, P 0.37); Foote 2025 one factor nominal (C less multimorbid, P 0.012),
  multivariate; its general and F4 deposits hold no line there (gaps, GRCh37 1:152.9 to 157.1 Mb and 153.5 to
  157.9 Mb), untested; Rosoff 2023 holds no line. Timmers' strongest line
  within 500 kb is P 2.4e-4: nothing suggestive. The literature search (the rsID, and PMF1 with longevity terms;
  Semantic Scholar answered 429) finds Deelen and a stroke-subtype paper that carries the lead among its stroke loci.
  Exceptional survival + (the discovery), lifespan 0 (Timmers one-sided 0.093), healthspan 0. Mechanism ageing in
  general (D25.7); at the lead's own lines in Open Targets' sets C raises eGFR and lowers creatinine, ischaemic stroke
  and CRP, at small posteriors (0.013 to 0.038), the lead's own P not printed: `mech:kidney` and `mech:cvd`, no protection token.
  Causal C4 and effector E4, no gene named: no lifespan-class set holds it; PMF1 is named in prose. Descriptive. Age
  of action unknown. The discovery is trans-ethnic, its European part and every test of it European.
