    direction: protective
    genotypes:
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of each version of this DNA position, the most common combination (about 46 in 100
          people of European ancestry). It is the reference the other combinations are compared with. The position,
          on chromosome 1, lies near the PMF1 gene. The finding comes mostly from people of European ancestry.
      - genotype: C/C
        state: protective
        conclusion: >-
          You carry two copies of the less common version of this DNA position (about 13 in 100 people of European
          ancestry do). One large study found this version a little more often among people who reached the oldest
          one in a hundred of lifespans. No separate study has confirmed it, so this is early evidence, not a settled
          finding: a tendency, not destiny.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of the more common version of this DNA position (about 41 in 100 people of European
          ancestry do). One large study found the other version a little more often among people who reached the
          oldest one in a hundred of lifespans, so two copies of this one sit slightly on the other side. No separate
          study has confirmed it, so this is early evidence, not a settled finding: a tendency, not destiny.
