# The seed list's locus 132, TERT (5p15.33): a marker of biological ageing (D32, D36.3), curated on D37.12 with 23
# TERC as the pattern. Curated 2026-11-16. Lead rs2736099, the seed's rsID (Lu 2018's intrinsic epigenetic age
# acceleration lead at TERT): intronic in TERT's MANE transcript, GRCh38 5:1,287,225 A/G, GRCh37 5:1,287,340, G
# ancestral; A at 34.9 % in gnomAD's non-Finnish European genomes. A is the allele with faster intrinsic epigenetic
# ageing. Row 30's rs2736100 (telomere length) is a partial tag, r² 0.49 in CEU; this row is the region's IEAA signal
# (D38.12, the lead's (a), 2026-11-16).
locus_id: 132
locus_name: TERT
verdict: kept
verdict_reason: >-
  Tier B on the marker's own evidence (D37.12; the seed gives none): the tier grades the association with intrinsic
  epigenetic age acceleration (IEAA), a DNA methylation clock read against calendar age, not longevity, and this row
  is unscored (D32). Lu 2018's IEAA GWAS (9,907 people; its European arm 8,393, q12) has rs2736099 as its 5p15.33 lead: A (the minor allele) at
  0.36, +0.64 years per A in Europeans (SE 0.09), P 4.7e-12, all ancestries +0.63, P 1.3e-12, I² 0 %. Gibson 2019's
  IEAA line has A +0.37, P 9e-10 (the GWAS Catalog's record, its paper and its overlap with Lu unread, named, not
  counted). Fine-mapping places the region's IEAA signal here: Open Targets holds rs2736099 at PIP 0.999 in Lu's set,
  0.997 in Gibson's and 0.68 in McCartney 2021's European IEAA set (which also holds row 133's rs2853677 at PIP 0.31, db-opentargets-26.09#q1344, q1345), while row 30's rs2736100 is in neither Lu's nor
  McCartney's IEAA set. McCartney's own conditional lead at TERT is rs2736100 (A lower IEAA, P 3e-11), so the two
  papers name different SNPs for one IEAA region; at r² 0.49 (D′ 0.93, CEU) Lu's IEAA-raising A travels with
  rs2736100's C, McCartney's IEAA-raising allele, so the two leads mark one IEAA signal on one haplotype, as read from
  the signs (not phased, and no conditional test read). No study of 100k or more: §4.1's B, genome-wide in one study.
  Lifespan look-ups, unscored and read for A, two-sided at 0.05 (D38.6): Timmers 2019 A beta1 +0.0034 (SE 0.0042), P
  0.41; Pilling 2017's parents P 0.34 to 0.61; Park 2025's own survival P 0.96 (men 0.30, women 0.17); Deelen 2019
  90th P 0.25, 99th P 0.31; all flat. FinnGen R11's deaths have G with more deaths, β +0.0169 (SE 0.0079), P 0.032, so
  A with fewer, a database line that fills a cell and lifts nothing (D29.1, D35.1). Zenin 2019's healthspan has G
  with the later end, −0.0126 (SE 0.0052), P 0.015, so A the earlier. Foote 2025's deposits hold no line (untested).
  The literature search (the rsID, 2026-11-16; Semantic Scholar answered 429, its part unchecked) finds the clock
  GWASs and cancer studies, no test of lifespan. Every genotype neutral, each conclusion a tendency of the marker with
  no colour (D32, D37.12); `direction: unknown`. Outcome cells read for A: exceptional survival 0 (Deelen flat);
  lifespan + (FinnGen two-sided 0.032, A with fewer deaths; Timmers, Pilling and Park flat); healthspan − (Zenin two-sided 0.015, A the earlier end). Both filled cells fit row 133's signal carried through LD (r² 0.38, D′ 0.67 in CEU, db-ensembl-116#q1162; 153's rs7705526 r² 0.27, q1163): at r about 0.62, 133's Zenin z of 4.7 and FinnGen z of 2.3 predict about 2.9 and 1.5 here, against 2.4 and 2.1 observed (derived; the alleles' coupling is not phased, so the sides are not checked), so neither cell is shown to be this lead's own. Mechanism: markers of biological ageing. Pleiotropy `mech:cancer`: A raises
  basal cell carcinoma (Choquet, G 0.090 lower, P 1e-23) and clonal haematopoiesis with TET2 mutation (OR 1.43, P
  3e-13), and uterine leiomyomata (Open Targets PIP 1.00), named; no `tradeoff`, the row naming no longevity-favoured
  allele. Causal C1 (PIP 0.999 in Lu's IEAA set). Effector E2, TERT: locus-to-gene 0.73 on McCartney's IEAA set, the
  variant intronic in TERT. Descriptive. Age of action unknown. The evidence is European.
