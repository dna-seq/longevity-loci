    direction: unknown
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the A version of this DNA position (about 12 in 100 people of European ancestry do).
          Studies link each copy of A with an epigenetic clock reading about half a year higher than expected for your
          age, compared with people without A. That is a tendency in a marker whose reading only means something against
          your calendar age, which this report does not have, so it carries no score.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy each of the two versions of this DNA position, the most common combination (about 45 in
          100 people of European ancestry). It is the reference the other combinations are compared with. The position
          lies inside TERT, the gene for the enzyme that rebuilds telomeres. Epigenetic clocks estimate age from chemical
          marks on DNA; a clock's reading only means something against your calendar age, which this report does not
          have, so this result carries no score.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the G version of this DNA position (about 42 in 100 people of European ancestry do).
          Studies link G with an epigenetic clock reading slightly lower than expected for your age, compared with
          people carrying A. That is a tendency in a marker whose reading only means something against your calendar
          age, which this report does not have, so it carries no score.
