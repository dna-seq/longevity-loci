variants:
  - rsid: rs2519093
    gene: ""
    phenotype: ABO region, blood clots, coronary disease
    trait_efo_id: EFO_0007796
    effect_allele: C
    effect_size: 0.2244
    effect_measure: beta
    stat_significance: suggestive
    direction: protective
    negatives: >-
      The longer-life version may slightly raise the chance of stomach ulcers, diverticular disease of the bowel, gout
      and a lumpy thyroid (goitre).
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, in the blood-group gene ABO on chromosome 9
          (about 66 in 100 people of European ancestry do). This is the reference the other combinations are
          compared with: you do not carry the version that goes with a higher chance of blood clots and heart
          disease, though your version may slightly raise the chance of stomach ulcers, bowel diverticula, gout and
          goitre. The finding comes from people of European ancestry; less is known elsewhere.
      - genotype: C/T
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA region, in the blood-group gene ABO on chromosome
          9 (about 30 in 100 people of European ancestry do). It goes with a higher chance of blood clots in the
          veins, somewhat more heart disease and slightly higher LDL cholesterol. In a very large study it also went
          with parents living a few months less, mainly through deaths before about 70; this is early evidence, not
          a settled finding, and the effect is small: a tendency, not destiny. The same version may slightly lower the
          chance of stomach ulcers, gout and some bowel and thyroid conditions.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA region, in the blood-group gene ABO on
          chromosome 9 (about 3 in 100 people of European ancestry do). Each copy goes with a higher chance of blood
          clots in the veins, somewhat more heart disease and slightly higher LDL cholesterol. In a very large study
          each copy also went with parents living a few months less, mainly through deaths before about 70; this is
          early evidence, not a settled finding, and the effect is small: a tendency, not destiny. The same version
          may slightly lower the chance of stomach ulcers, gout and some bowel and thyroid conditions.
