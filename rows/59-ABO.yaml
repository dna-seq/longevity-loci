# The seed list's locus 59, ABO (9q34.2). Curated 2026-11-12. Lead rs2519093 (the seed's only rsID; GRCh38
# 9:133,266,456, GRCh37 9:136,141,870), T/C, an ABO intron variant, C ancestral at 0.815 in Europeans and 0.81 in East
# Asians: Timmers 2019's Table 2 SNP, reported genome-wide only by its Bayesian scan. Nine CEU proxies at r² >= 0.8,
# rs651007 (r² 0.94) the one Timmers' Figure 4 reads. In Timmers 2019's, Zenin 2019's and FinnGen R11's summary
# statistics at the lead, in Deelen 2019's look-up table; not in Wright 2019's tables, nor in Foote 2025's deposits.
locus_id: 59
locus_name: ABO
verdict: re-tiered
verdict_reason: >-
  Tier C, from the seed's B, with no genome-wide result at the locus in any lifespan, longevity or multivariate ageing
  study (R-TIER-4). Put to the lead, since D27.3 named ABO among the loci to be read as row 51 (B), which rested on
  Foote 2025's frailty factor being genome-wide at its lead; here Foote is untested: the general factor's and
  factors 2 to 4's deposits returned no SNP within 90 kb of the lead (factor 3's file the very one read at row 51, so
  there an absence in the deposit, not a lost fetch; the other three files not checked), factors 1, 5 and 6 hold
  neither the lead nor a proxy, and none of Foote's 426 Open Targets sets lies within 3 Mb. The same check is owed
  at IGF2R, POM121C, GBX2/ASB18 and HP, the other loci D27.3 names. The alternative, B on the paper's own call, rests on the Bayes-factor P, which is never the
  study's P (row 6). In Timmers 2019's million parental lives C, about 81 in 100 European chromosomes, adds 0.22 years
  per copy at a conventional P of 6.3e-6 (UK Biobank and LifeGen on the same side): suggestive, and the strongest SNP
  within 300 kb. The paper calls ABO genome-wide (Bayes-factor P 1.9e-8, informed by LDL and coronary disease) and
  replicated, on Figure 4's look-up at rs651007 (r² 0.94) in Deelen 2014 and Broer 2015: one-sided P 0.0215, Alpha
  1.12. Those cohorts are largely Deelen 2019's, which leans C's way at the 90th percentile (OR 1.047, P 0.062,
  one-sided 0.031, nominal) and is flat at the 99th (OR 1.010, P 0.78; its cohorts disagree, heterogeneity P 0.0046);
  counted once. Neither is a red flag (D21, D25.3): the 99th, from Timmers' effect, has power 0.90 and heterogeneity P
  0.026 under APOE's factor but power 0.34 under the mean factor; the 90th has heterogeneity P 0.067 and leans C's
  way. FinnGen's deaths lean C's way (P 0.43, one-sided 0.22; power 0.78 under APOE's factor, heterogeneity P 0.15),
  no flag. Healthspan in Zenin 2019 goes C's way, nominal (P 0.0017; UK Biobank, overlapping the discovery): the
  cell is +. Exceptional survival is 0, as at row 48: one nominal 90th-percentile look, the 99th flat. Zenin's
  own ABO look-up and Fortney 2015's exceptional-longevity scan are at rs514659 (r² 0.42; iGWAS P 2.5e-7, not
  genome-wide), named, not counted. A suggestive scoring-class result with nominal look-ups its way: C, as row 54. The
  mechanism is heart and vessels: T, the derived allele, raises venous thromboembolism (OR 1.40, P 4e-169), coronary
  disease (OR 1.08) and myocardial infarction (OR 1.09) and raises LDL cholesterol, the priors Timmers' scan used;
  association at one haplotype, not a mediator test. The locus is broad besides: blood counts (T lowers haemoglobin
  and white cells), hundreds of plasma proteins, allergy (T raises allergic rhinitis); Timmers counts ABO among
  the cancer-protective lifespan loci that also associate with cardiovascular disease, untested for pleiotropy. A
  trade-off is detected (D18.1) at r² 0.97 proxies phased to C: the longer-life side raises peptic ulcer (β 0.126,
  P 6e-18), diverticular disease (P 1e-14), gout (P 3e-11) and benign nodular goitre (P 1e-10). Age of action is MIDLIFE, DIRECT: Timmers' age moderator passes the paper's own 5 % FDR (P 3.9e-4, Q
  0.0086), the effect largest before 60 in both parents and near nothing at 70 to 90, as the paper says of ABO; the
  mothers' 90-120 band (P 0.0047) runs the other way, one cell of 288, named; the sex moderator does not pass (Q
  0.73). With a trade-off the row is descriptive (D18.2), though LDL, one of Timmers' priors, is a measure a doctor
  takes; T's LDL effect is small (0.056 SD) beside its thrombosis effect, which no listed test reaches. No credible set of a scoring-class study holds the lead or sits at ABO: C4.
  The lead is in 510 other sets (proteins, lipids, blood counts, thrombosis, coronary disease), most giving ABO a
  locus-to-gene about 0.58, but with no longevity set nothing is assessed for the row's claim: E4, no gene named, ABO
  in prose only (as rows 27 and 56). C/C, the commonest genotype (about 66 in 100), is the reference; C is the common
  non-risk allele at a disease locus (PROTECT:ABSENCE_OF_RISK). The evidence is European; T is as common in East
  Asians (0.19), untested there.
