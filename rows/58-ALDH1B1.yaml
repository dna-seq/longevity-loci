# The seed list's locus 58, ALDH1B1 (9p13.2; the seed's genes "ALDH1B1;U8"). Curated 2026-11-12. Lead rs10973748
# (GRCh38 9:38,322,519, GRCh37 9:38,322,516), the seed's only rsID: an intergenic SNP between SHB and ALDH1B1, in the
# non-coding RNA LOC107987065; derived T 0.06 in Europeans, 0.09 in East Asians. Gurinovich 2021's NECS centenarian
# SNP, the top non-APOE line of its Supplement Table 1, as rows 19, 31 and 41. Its CEU r² 1.0 tags rs341466, rs341467
# and rs10973750 are also past 5e-8 in NECS and are named in the notes only. Not in Wright 2019's Supplemental Tables
# 8 and 9 (its nearest lines, rs4388534 and rs4878777, are not tags) nor in Timmers 2019's Figure 2 sheet.
locus_id: 58
locus_name: ALDH1B1
verdict: kept
verdict_reason: >-
  Tier B, the seed's, kept on row 31's ruling (D25.10) and capped there with replication_failed. The lead kept
  B with the flag (D28.6): NECS's twofold control deficit across the haplotype is R-TIER-2's confounding, not row 41's
  disowned genotypes, and R-TIER-2 is lifted by Deelen's 99th percentile (one-sided 0.043), a pass in a sample
  independent of NECS; its flat 90th does not cancel it, the 99th's cases being the more extreme. Gurinovich 2021 compared 1,320 New England
  Centenarian Study centenarians (median age 104) with 2,899 European-ancestry controls (306 NECS referents and 2,593
  from Illumina's control repository, matched by principal components, ages not given), imputed to the HRC panel.
  T, the coded allele, is in 5.87 % of the centenarians' alleles and 3.12 % of the controls', score Z +5.97, P
  2.38e-9, genome-wide at the paper's 5e-8; the locus's three other SNPs past the cut are its CEU r² 1.0 tags. No
  effect size is printed (the GWAS Catalog's "beta 5.969" is the Z); the row enters the crude odds ratio 1.94 per T,
  derived from the printed frequencies (log 0.661, Woolf SE 0.112), as D25.10 asks. The weakness is the controls: T
  is 0.05 to 0.061 in every European file read (1000 Genomes, gnomAD, LifeGen, Deelen, FinnGen, Zenin), which is
  where the centenarians sit, while the controls carry 0.031, 0.55 of gnomAD's. The three tags show the same:
  centenarians at their reference frequencies (0.060 to 0.067 against 0.058 to 0.069), controls at 0.58 to 0.64 of
  gnomAD's. So it is on the haplotype, not one SNP's imputation as at row 31. The association would not appear against
  population frequencies; this is the cohort and batch confounding R-TIER-2 names. The authors do not doubt it,
  and the gap is a factor of two, not the two orders of magnitude at 41, so D26.10's letter does not reach it. The
  Ashkenazi Longevity Genes Project, NECS's own replication (312 cases, 638 controls), prints for the lead T 0.04
  against 0.03, Z 1, P 0.3 (one-sided 0.15): T's way, not nominal, its controls again below gnomAD's
  Ashkenazi 0.044. Its r² 1.0 tags rs341466 and rs341467 give P 0.034 in the LGP (one-sided 0.017), but at twice
  the lead's frequency there, so CEU's r² does not hold in the paper's own calls: named, not counted. Deelen 2019's
  99th percentile, at the lead, leans T's way: log OR +0.142 (SE 0.083), P 0.086, one-sided 0.043, the one nominal
  independent scoring-class look-up (D25.13), and so not D (D25.1). It is thin: the 90th percentile, whose cases
  include the 99th's, is flat (P 0.90), and Deelen holds the LGP, so these are not two independent supports. Deelen
  names no NECS cohort; the controls' overlap is unknown, as at row 31. Against it, three powered nulls (D21). The
  NECS log OR, carried over APOE's factor (9.38, NECS's rs429358 against LifeGen's), expects +0.070 on Timmers'
  scale. LifeGen is flat: +0.0025, P 0.78, power 1.00, heterogeneity P 5e-6, still a flag at half the effect; under
  the loci's mean factor P 3e-8. FinnGen R11 death leans the other way (P 0.77), power 1.00, heterogeneity P 2e-4
  (one conversion, the mean factor cancelling on the way into FinnGen; no flag at half, power 0.70). Deelen's 90th
  is flat against an expected +0.34 (heterogeneity P 1e-5; one conversion likewise). So LifeGen is a red flag under
  both calibrations (D25.3), FinnGen and Deelen's 90th by one conversion each: replication_failed. Zenin 2019's healthspan is flat, T leaning to an earlier end (P 0.65).
  Lifespan 0, healthspan 0, exceptional survival + on NECS and Deelen's 99th. Open Targets 26.09 holds the lead in
  one credible set, NECS's own (PICS, 9 variants, built from the GWAS Catalog's top hit without in-sample LD, the
  study QC-flagged), at posterior probability 0.341, the set's highest: C2. Locus-to-gene gives ALDH1B1 0.476,
  under 0.5, and the set has no colocalisation: assessed, no criterion met, E3, no gene named. The GWAS Catalog
  holds no other trait for the lead or its eight CEU proxies at r² ≥ 0.8, so general ageing; the paper's own serum
  protein signals at the locus are trans and from 224 samples, named in the note only. The protection is a
  presence: the derived, minor T goes with reaching 100. Age of action is unknown.
