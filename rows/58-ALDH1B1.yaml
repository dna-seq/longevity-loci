    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, as about 89 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The region, on chromosome 9,
          lies between genes, and no gene is known to matter here.
      - genotype: G/T
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 11 in 100 people of European ancestry
          do). In one American study, people who reached 100 carried it more often than the comparison group did,
          and a European study of the very oldest leaned the same way. But that comparison group carried it
          unusually rarely, and large studies of parents' lifespans and of deaths found no effect. Treat it as
          uncertain; the effect, if real, is small.
      - genotype: T/T
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 1 in 280 people of European
          ancestry do). In one American study, people who reached 100 carried this version more often than the
          comparison group did, and a European study of the very oldest leaned the same way. But that comparison
          group carried it unusually rarely, and large studies of parents' lifespans and of deaths found no
          effect. Treat it as uncertain; the effect, if real, is small.
