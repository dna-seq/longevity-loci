# The seed list's locus 26, GPR78 (4p16.1). Curated 2026-11-11, the third ten-row run's fourth row. Lead rs7676745
# (4:8,563,820 in GRCh38, 4:8,565,547 in GRCh37; the seed's only rsID), Deelen 2019's one genome-wide locus besides
# APOE. No other seed locus lies near it. Its two rare neighbours in the summary statistics, rs10022617 and
# rs10009267, tag it weakly (r² 0.45 and 0.48) and appear only in the notes.
locus_id: 26
locus_name: GPR78
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's B: a genome-wide longevity result that the larger European tests contradict, the case
  §4.1 files as "explicitly contradicted" (its own examples, USP42 and TMTC2, are published longevity SNPs Timmers
  2019 found no association for at their published effects). In Deelen 2019's European meta-analysis the rare A
  (4 % in Europeans) lowers the odds of reaching the 90th percentile age, OR 0.67, P 4.3e-8, with no heterogeneity
  across cohorts (I² 0). That rests on fewer people than the study's totals: six cohorts, several of them
  long-lived-family or centenarian studies, have no data for it, and the summary statistics give an effective N of
  8,023. The planned replication could not type it, and the authors ask for replication in independent cohorts. The
  trans-ethnic version, the GWAS Catalog's record, is P 1.7e-7, and A is absent in East Asians, so it adds nothing
  on this variant. Deelen's own validation in UK Biobank, which the discovery does not include, does not replicate
  it. Parents reaching the 90th percentile age give OR 0.98 (0.92–1.06), P 0.67, and the authors state they had
  power even at half the effect. At the discovery's β −0.41 (SE 0.074) against the replication's SE of about 0.036,
  one-sided power is about 1.00. The two estimates differ at heterogeneity z −4.7 (P about 3e-6) at the full effect,
  or z −3.5 (P about 0.0004) at half the effect for a parent's genotype. Under either scaling that is D21's red flag.
  Timmers 2019's million parental lives put A on the longer-lived side (P 0.25), the same summary statistic as
  Deelen's parental-lifespan line. Both rare neighbours, whose minor alleles ride with A by frequency and r², also
  lean longer-lived (P 0.30 each). Nothing leans the discovery's way, which is D22.3's condition for D, not C. The
  alternative is B on §4.1's letter (one genome-wide study, no independent replication), with the 71/67 rule's cap.
  That is put to the lead. Row 103's C came from its healthspan-only anchor (D17.1), which does not apply here.
  Healthspan is null (Zenin 2019, P 0.64) and lifespan null. Exceptional survival is filed 0: the discovery's 90th
  percentile result is contradicted by the powered parental 90th percentile test, and the 99th percentile summary
  statistics have no row for the lead or its neighbours. No other trait is recorded for the variant (Phenoscanner,
  per the authors, and the GWAS Catalog). The mechanism is unknown, filed as general ageing as row 10 is. GPR78's
  function is largely unknown. Open Targets 26.09 has no record of the variant and no lifespan-class set holding
  it, so causal and effector confidence are C4 and E4, and no gene is named (§4.2). The locus keeps the seed's
  label. Age of action is unknown.
