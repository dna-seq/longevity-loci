# The seed list's locus 26, GPR78 (4p16.1). Curated 2026-11-11, the third ten-row run's fourth row. Lead rs7676745
# (4:8,563,820 in GRCh38, 4:8,565,547 in GRCh37; the seed's only rsID), Deelen 2019's one genome-wide locus besides
# APOE. No other seed locus lies near it. Its two rare neighbours in the summary statistics, rs10022617 and
# rs10009267, tag it weakly (r² 0.45 and 0.48) and appear only in the notes. The variant's OR 1.49 per G is 1/0.67,
# the inverse of Deelen's printed OR per A (β 0.4076 gives 1.50), harmonised to the lifespan-raising allele (§6.2).
locus_id: 26
locus_name: GPR78
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's B: a genome-wide longevity result that the larger European tests contradict, which §4.1
  files as "explicitly contradicted". Its own examples have this shape. USP42 and TMTC2 are Sebastiani 2017's
  genome-wide longevity SNPs, and Timmers 2019's parental lifespan data do not support them at their published
  effects (there they lean the same way, P 0.27 and 0.11; here the validation is flat or opposite). In Deelen
  2019's European meta-analysis the rare A (4 % in Europeans) lowers the odds of reaching the 90th percentile age,
  OR 0.67, P 4.3e-8, with no heterogeneity across cohorts (I² 0). That rests on fewer people than the study's
  totals: six cohorts, several of them long-lived-family or centenarian studies, have no data for it, and the
  summary statistics give an effective N of 8,023. The planned replication could not type it, and the authors ask
  for replication in independent cohorts. The trans-ethnic version, the GWAS Catalog's record, is P 1.7e-7, and A
  is absent in East Asians, so it adds nothing on this variant. A literature search on the rsID (2026-11-11, recorded in Deelen's note; Semantic Scholar unchecked) finds no later
  genotyped test of it, by title and abstract, only reuses of Deelen's summary statistics. Deelen's own validation in UK Biobank, which the discovery does not include,
  does not replicate it. Parents reaching the 90th percentile age give OR 0.98 (0.92–1.06), P 0.67, and the
  authors state they had power even at half the effect. At the discovery's β −0.41 (SE 0.074) against the
  replication's SE of about 0.036, one-sided power is about 1.00. The two estimates differ at heterogeneity z −4.7
  (P about 3e-6) at the full effect, or z −3.5 (P about 0.0004) at half the effect for a parent's genotype. Under
  either scaling that is D21's red flag. Timmers 2019's parental lifespan data, 635,383 lives at this SNP, put A on the longer-lived side (P 0.25), the same summary statistic as Deelen's parental-lifespan line. Both rare neighbours, whose minor
  alleles ride with A by frequency and r², also lean longer-lived (P 0.30 each). So the tests are flat or opposite: Deelen's parental 90th percentile (OR 0.98) and Zenin's healthspan
  (β +0.0058 per A) lean the discovery's way, flatly; LifeGen and the two neighbours lean opposite. D25.1 settles the
  tier: a tested genome-wide discovery that fails a powered test in its own ancestry, with no independent
  scoring-class p < 0.05 its way, is D, as §4.1's USP42 and TMTC2; §4.1's B is a hit nobody tested, and the 71/67
  rule is a ceiling, not a floor. The authors' caveat stands, that the parental phenotypes give smaller effects and
  the imputation panels differ, "which could have influenced the outcome", but imputation noise widens the SE and
  does not pull the estimate to 1, and A's frequency matches in every look-up (0.04 to 0.05, against 0.044 in 1000
  Genomes Europeans). The info 0.89 is LifeGen's meta-analysis info; the UK Biobank parental line's is unknown.
  Healthspan is null (Zenin 2019, P 0.64) and lifespan null. Exceptional survival is filed 0: the discovery's 90th
  percentile result is contradicted by the powered parental 90th percentile test, and the 99th percentile summary
  statistics have no row for the lead or its neighbours. No other trait is recorded for the variant (Phenoscanner,
  per the authors, and the GWAS Catalog). The mechanism is unknown, filed as general ageing as row 10 is. GPR78's
  function is largely unknown. Open Targets 26.09 has no record of the variant and no lifespan-class set holding
  it, so causal and effector confidence are C4 and E4, and no gene is named (§4.2). The locus keeps the seed's
  label. Age of action is unknown.
