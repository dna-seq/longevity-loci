variants:
  - rsid: rs7676745
    gene: ""
    phenotype: GPR78 region, survival to old age
    trait_efo_id: OBA_VT0005372
    effect_allele: G
    effect_size: 1.49
    effect_measure: OR
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 91 in 100). It is the reference the other combinations are compared with. The region, on
          chromosome 4, lies near the GPR78 gene, whose job is largely unknown. A link between this region and
          long life was reported once and has not held up in larger studies.
      - genotype: A/G
        state: risk
        conclusion: >-
          You carry one copy of a rare version of this DNA region (about 8 in 100 people of European ancestry do;
          it is almost absent in East Asian people). In one study of very old people this version was a little less
          common among those who reached about 90. Larger studies of parents' lifespans did not confirm it, so
          the link is not supported: it is most likely chance. It says nothing reliable about your own lifespan.
      - genotype: A/A
        state: risk
        conclusion: >-
          You carry two copies of a rare version of this DNA region (about 2 in 1,000 people of European ancestry
          do). In one study of very old people this version was less common among those who reached about 90.
          Larger studies of parents' lifespans did not confirm it, so the link is not supported: it is most likely
          chance. It says nothing reliable about your own lifespan.
