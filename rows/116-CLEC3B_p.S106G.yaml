# The seed list's locus 116, CLEC3B (p.S106G) (3p21.31). Curated 2026-11-15. Lead rs13963, the seed's only rsID
# (Tanisawa 2017's exome-wide longevity variant in Japanese, replicated in Chinese): missense in CLEC3B (tetranectin),
# GRCh38 3:45,035,631, GRCh37 3:45,077,123, G/A in the row's meaning (Ensembl lists G/A/C/T); G, glycine, the
# reference base and the discovery's longer-lived allele, 0.14 in East Asians (0.23 in Japanese) and 0.62 in Europeans.
# Open Targets 26.09 holds it in 21 expression and splicing QTL sets, none lifespan-class; the GWAS Catalog
# (2026-10-29) holds no association.
locus_id: 116
locus_name: CLEC3B (p.S106G)
verdict: kept
verdict_reason: >-
  Tier C, the seed's: a sub-genome-wide East Asian discovery (R-TIER-4) replicated once in an independent East Asian
  sample, which keeps it off D where 113 and 119, with no independent own-ancestry pass, went to D on D22.3, while the
  powered European tests fail, so `replication_failed` (row 130's shape: D25.1's independent pass, D25.13). Tanisawa
  2017's Japanese exome-chip study (530 centenarians and nonagenarians in two cohorts against 4,312 younger controls)
  gives G OR 1.50 (1.28 to 1.74), P 2.33e-7, under its exome-wide line of 1.99e-6 and above 5e-8 (D17.3, as row 107
  read an exome-wide P), with the two cohorts agreeing (OR 1.45 and 1.70, heterogeneity P 0.42). Its Chinese
  replication, 447 aged 95 to 110 against 505 aged 15 to 79, all from Hainan (ethnicity not named), gives G 0.103
  against 0.066, OR 1.51 (1.05 to 2.17), P 0.027, one-sided 0.013, outside the Japanese P; the paper's meta-analysis,
  1.87e-8, holds the replication inside it, so it is not read as a genome-wide discovery (B would count the Chinese
  sample twice). Frequencies (D31.10): the Japanese controls (0.193) sit near Japanese references (HapMap JPT 0.221,
  an Inabe sample 0.200, 1000 Genomes JPT 0.226 on 104 people). The Chinese controls (0.066) match the paper's
  reference, HapMap's northern Han (0.073 on 82 people; 1000 Genomes CHB 0.073, P 0.41), but Hainan is southern, and
  every southern reference puts the controls short and the cases at it, row 109's shape: Southern Han 0.100 (P 3.2e-4
  on the point value), Dai 0.118, Kinh 0.187; counting each reference's sampling error (about 100 people) the
  controls' P is 0.14, 0.04 and 1e-4, and read against the Southern Han the cases give OR 1.03, P 0.90 (derived). So
  the replication rests on which reference fits Hainan: read as printed, on the paper's own, and put to the lead, the
  tier and the exceptional-survival `+` both on it (if it falls, D31.11 sets it aside and no independent pass
  remains). Europe, at the lead itself (G 0.62 there): Deelen 2019's 90th percentile G +0.024 (SE 0.020), P 0.23, and
  99th +0.043 (SE 0.031), P 0.16, leaning G's way but failing the discovery's size: against the Japanese log OR 0.405
  (SE 0.078) power 1.00, heterogeneity P 2.2e-6 (90th) and 1.7e-5 (99th; at half the effect 4.2e-5 and 0.0014,
  derived). Timmers 2019 flat, G −0.0016 per self (SE 0.0039), P 0.69. Carried there by D25.3's 99th-percentile
  calibrations, the discovery predicts G +0.065 (APOE's factor) or +0.156 (the loci's mean): power 1.00, heterogeneity
  P 4.1e-7 and 2.2e-7 (at a quarter of the effect 3.7e-4 and 1.7e-6), a D21 red flag under both, `replication_failed`.
  Neither Deelen's lean (one-sided 0.08, 0.11) nor FinnGen R11's death endpoint (G with fewer deaths, one-sided 0.035,
  a database line, D29.1) is a pass; with Foote's general factor (below) nothing European runs against G, which is
  close to row 18's lean (D22.3) and is the row's ground should the Chinese replication fall, put to the lead with it.
  Park 2025's own survival flat (P 0.78, UK Biobank); Pilling 2017 flat (P 0.41 to 0.95); Zenin 2019 flat (P 0.89).
  Kolicheski 2020 (abstract; the PMC copy could not be fetched) finds no association with ageing free of neurological
  disease in 1,483 Europeans (P 0.89), its design and power unread. Foote 2025 holds no line at the lead; at rs6441877
  (r² 1.00 in CEU) the general frailty factor puts G less frail, P 0.0076 (one-sided 0.004, Q P 0.74), the other
  factors flat and factor 4's deposit holding none of the lead's eleven r² 1.00 partners. Wright 2019's four lines 185
  to 390 kb away are not the lead's partners (r² 0.05 at most): AncestryDNA untested. The literature search (the rsID,
  and CLEC3B with longevity terms; Semantic Scholar answered 429, its part unchecked) finds Tanisawa and Kolicheski,
  with reviews of tetranectin and Torres 2021's passing mention; none of Tanisawa's 17 citing papers re-tests the
  variant. Tanisawa's survival analysis of Cohort 2's autopsy cases is the discovery's people (q9), cited, not
  entered. Outcome cells: exceptional survival + (the Chinese replication, one-sided 0.013; Deelen against nothing at
  0.05); lifespan 0 (Timmers, Park flat; FinnGen a database line); healthspan + (Foote's general factor at an r² 1.00
  proxy, D31.4; Zenin flat). Context `ancestry_specific:eas`: the claim holds in East Asians, and the European tests
  of lifespan and of the very old at the variant itself do not carry it (the European frailty factor leans G's way).
  Mechanism ageing in general (D25.7): the paper proposes tetranectin's roles in bone mineralisation and cancer,
  named, no route shown. Causal C4: no lifespan-class set; effector E1, CLEC3B, by §4.2's coding clause (a missense
  change, glycine to serine at residue 106). Descriptive. Age of action unknown (the paper's reading that it acts only
  past 95 rests on Cohort 2's own people). How the genotypes read to a European, for whom G is the majority allele, is
  put to the lead as D7's question.
