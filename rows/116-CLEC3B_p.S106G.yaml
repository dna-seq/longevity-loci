variants:
  - rsid: rs13963
    locus: {chrom: "3", start: 45035631, ref: G, cites: [db-ensembl-116#q785, db-finngen-r11#q90]}  # rs13963 is multi-allelic in Ensembl (G/A/C/T); the row means G>A, the alleles Tanisawa types
    gene: CLEC3B
    phenotype: CLEC3B p.S106G, extreme longevity, East Asian
    trait_efo_id: OBA_VT0005372
    effect_allele: G
    effect_size: 1.50
    effect_measure: OR
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the serine version of this DNA position in the CLEC3B gene, as about 74 in 100 people
          of East Asian ancestry and 14 in 100 of European ancestry do. It is the reference the other combinations are
          compared with.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of the glycine version of this position in the CLEC3B gene, which changes one building
          block of the protein tetranectin (about 24 in 100 people of East Asian ancestry and 47 in 100 of European
          ancestry carry one). In Japanese and Chinese studies, people who reached 95 or 100 carried it a little more
          often. Large European studies of lifespan and of the very old found no such link, so this is early evidence that may hold only in East Asian
          ancestry: a slight tendency at most, not destiny.
      - genotype: G/G
        state: protective
        conclusion: >-
          You carry two copies of the glycine version of this position in the CLEC3B gene (about 2 in 100 people of
          East Asian ancestry and 38 in 100 of European ancestry do). In Japanese and Chinese studies, people who
          reached 95 or 100 carried this version a little more often. Large European studies found no such link, so
          this is early evidence that may hold only in East Asian ancestry: a slight tendency at most, not destiny.
