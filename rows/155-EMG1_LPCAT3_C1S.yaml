# The seed list's locus 155, EMG1/LPCAT3/C1S (12p13.31). Curated 2026-11-16. Lead rs79159347, the seed's only rsID (Hoque
# 2026's Super Seniors GWAS): intronic in C1S, GRCh38 12:7,019,858 G/A, GRCh37 12:7,127,162, A at 6.55 % in gnomAD's
# non-Finnish European genomes and 0.08 % in East Asians, A the discovery's healthy-ageing allele. Open Targets 26.09
# holds it in 17 sets (LPCAT3 brain QTLs, phosphatidylcholine and apolipoprotein A levels, plateletcrit), none
# lifespan-class; the GWAS Catalog (2026-10-29) holds no association.
locus_id: 155
locus_name: EMG1/LPCAT3/C1S
verdict: kept
verdict_reason: >-
  Tier C, the seed's: a sub-genome-wide healthspan discovery in one sample (R-TIER-4), with a co-occurring lifespan
  study (D16) and no tested contradiction that sets a flag. Hoque 2026 compared 597 Super Seniors (85 or over, free of
  cancer, cardiovascular disease, diabetes, dementia and major pulmonary disease) with 420 mid-life population
  controls in British Columbia: A, the effect allele, OR 3.61 per A, P 2.24e-7, the paper's strongest locus and
  suggestive only (no variant reached genome-wide significance). An OR of 3.6 for a 6.5 % allele in about 1,000 people
  carries a large winner's curse, named. Timmers 2019's parental lifespan, outside that sample, has A with longer-lived
  parents, beta1 +0.0195 (SE 0.0080), P 0.015, one-sided 0.007: the co-occurring lifespan study D16 asks, the same
  allele and direction; Pilling 2017's UK Biobank parents agree (both parents' attained age P 0.013, both in the top
  10 % P 0.025; mothers 0.091, fathers 0.13), inside Timmers' pool. Deelen 2019 goes against: the 99th percentile A
  −0.150 (SE 0.071), P 0.034, one-sided 0.017 against, the 90th −0.061, P 0.14. Carried from the Super Seniors' scale
  by the paper's own APOE line (rs429358 OR 0.64 there, 0.52 in Deelen's 99th; a factor of 1.47), the discovery
  expects A +1.88 in Deelen's 99th: power 1.00, heterogeneity P 4e-8 (derived), the gap the winner's curse would make.
  That is one calibration, APOE's; no mean factor exists on this scale, so whether it is a red flag is unknown and the
  row carries no `replication_failed` (D26.3); were it a flag, Timmers' independent pass would keep the row off D
  (D25.1). Park 2025's own survival flat (A P 0.61); FinnGen R11's deaths flat (P 0.82), a database line; Zenin 2019
  flat (P 0.90); Foote 2025's general factor flat (P 0.52), its factor 5 (poorer cognition) with A on the frailer side
  at P 0.014, factors 1 to 4 and 6 flat. The literature search (the rsID, 2026-11-16; Semantic Scholar 429, unchecked) finds Hoque alone. Genotypes: G/G
  the reference, A carriers protective, as weak early evidence. Exceptional survival − (Deelen's 99th, one-sided 0.017
  against, and nothing in that class for; D28.3); lifespan + (Timmers, P 0.015; Pilling agrees); healthspan 0, mixed
  (the discovery for, Foote's factor 5 against; D26.6). Mechanism ageing in general (D25.7): the authors point to the
  locus's links with red-cell fatty acids, lipid homeostasis and insulin resistance, and A is a GTEx eQTL of LPCAT3
  (higher in skeletal muscle, lower in the cerebellum), with no colocalisation (PP.H4 at most 0.14); named, no token.
  Causal C4 and effector E4: no lifespan-class credible set. Descriptive. Age of action unknown. The evidence is
  European.
