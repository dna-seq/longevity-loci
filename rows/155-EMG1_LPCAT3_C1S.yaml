variants:
  - rsid: rs79159347
    gene: ""
    phenotype: C1S intron (EMG1/LPCAT3/C1S), healthy ageing
    trait_efo_id: OBA_VT0005372
    effect_allele: A
    effect_size: 3.61
    effect_measure: OR
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (about 87 in 100 people of European ancestry
          do). It is the reference the other combinations are compared with. The position lies in a cluster of genes
          on chromosome 12, inside C1S, near LPCAT3, which handles fats in cell membranes.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 12 in 100 people of European ancestry
          do). One Canadian study found it more often among people who reached 85 free of major diseases, and a large
          study of parents' lifespans found it with slightly longer-lived parents; a European study of the very oldest
          found it slightly less often. This is weak, early evidence: a possible tendency, not destiny.
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA position (fewer than 1 in 100 people of European
          ancestry do). The studies counted copies one at a time, so nothing separate is known about two; the single-copy
          evidence is weak and mixed.
