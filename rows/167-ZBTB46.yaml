variants:
  - rsid: rs6062322
    locus: {chrom: "20", start: 63810246, ref: A, cites: [db-ensembl-116#q1195]}
    gene: ZBTB46
    phenotype: ZBTB46 intron, multivariate healthy ageing (mvAge)
    trait_efo_id: EFO_0007796
    effect_allele: T
    effect_size: 0.00708049186358
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (about 65 in 100 people of European ancestry
          do). It is the reference the other combinations are compared with. The position lies inside the ZBTB46 gene
          on chromosome 20, and what it does there is not known. The finding comes from people of European ancestry;
          less is known elsewhere.
      - genotype: A/T
        state: protective
        conclusion: >-
          You carry one copy of the T version of this DNA position (about 31 in 100 people of European ancestry do).
          In a very large combined study of healthy ageing, this version went with ageing a little better, and in
          related studies with a slightly longer healthy life and longer-lived parents. It is a likely finding, not a
          settled one: it has not been confirmed in a separate group of people. The effect is small and it is a
          tendency, not a guarantee.
      - genotype: T/T
        state: protective
        conclusion: >-
          You carry two copies of the T version of this DNA position (about 4 in 100 people of European ancestry do).
          In a very large combined study of healthy ageing, this version went with ageing a little better, per copy,
          and in related studies with a slightly longer healthy life and longer-lived parents. It is a likely finding, not
          a settled one: it has not been confirmed in a separate group of people. The effect is small and it is a
          tendency, not a guarantee.
