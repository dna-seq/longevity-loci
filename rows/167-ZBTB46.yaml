# A second, independent signal at the seed's locus 99, CHRNA4 (20q13.33), its own row under D25.6 and D39.14. Curated
# 2026-11-16. Lead rs6062322, the seed's second rsID at 99 (Rosoff 2023's novel mvAge lead): intronic in ZBTB46, GRCh38
# 20:63,810,246 A/T (a multi-allelic site, A/C/T, the row meaning A/T), GRCh37 20:62,441,599; T at 19.5 % in gnomAD's
# non-Finnish European genomes. 455 kb from row 99's lead rs2273500, r² 0.000 in 1000 Genomes EUR. T is the healthier allele.
locus_id: 167
locus_name: ZBTB46
second_signal_of: 99
verdict: kept
verdict_reason: >-
  Tier B (D16, D18.3): genome-wide in Rosoff 2023's mvAge, A −0.0071 (SE 0.0013), P 3.3e-8, a novel lead (positive is
  healthier, frailty reverse coded), with Timmers 2019's parental lifespan co-occurring at nominal (T beta1 +0.0130, P
  0.010); no independent replication, since mvAge pools UK Biobank and LifeGen and every lifespan look-up but FinnGen sits
  inside it. Independence (D39.14, D39.15): no article prints a conditional and no set in Open Targets holds both; from
  1000 Genomes' phased EUR haplotypes T and row 99's longer-life T have r −0.018 (r² 0.000), so conditioning on 99's
  lead leaves mvAge's z of 5.52 where it is, and lifts it for any lead z on the same side; Rosoff's tables print no line
  at rs2273500, and only a lead z below −4 against its lifespan side would pull it under 5e-8 (derived). Look-ups read
  for T: Pilling 2017 both parents T longer, P 0.0083 (fathers 0.15, mothers 0.49), the top 10 % flat (0.13); Park
  2025's own survival T fewer deaths, P 0.0056 (men 0.0071, women 0.26), UK Biobank inside; Deelen 2019 passes nothing (90th 0.56, 99th 0.13, T's way), its flag unknown, its power
  not read (D40.5); FinnGen R11's deaths flat (P 0.56), a database line. Outcome cells read for T: lifespan + (Timmers, Pilling, Park). The 1 Mb window was read for stronger lifespan lines (D30.18,
  D40.5): Timmers holds 340, row 99's lead rs2273500 the strongest (P 2.2e-7), and within 500 kb only rs73143584, 4 kb
  away (P 6.5e-4, A longer), has r² 0.01 or more with this SNP (0.067; T with its A, r +0.278); conditioned stepwise
  on rs2273500 and rs73143584, Timmers' line keeps z 1.72 (one-sided 0.042) and Pilling's both parents 1.96 (0.025)
  (derived), so the co-occurring lifespan study is the locus's own and B holds (D16, D17.1, D30.2); exceptional survival 0 (Deelen, Pilling's top 10 %); healthspan + (Zenin 2019, T the later end, P 2.6e-4); Foote 2025 gives 0 (D40.5): F3 P 8.5e-8 and F6 P 2.0e-5 T less
  frail, but F5 the other way, one-sided 0.028, F1 and F2 flat, the general factor's deposit no line. Mechanism general ageing (D30.7, D30.9, D40.5): Open Targets' type 2 diabetes, HbA1c, systolic pressure and
  coronary sets hold this SNP at PIP 0.023, 0.0089, 0.0058 and 0.0063, it leads none, and the βs they print are each
  set lead's, not its own, so no metabolic route is shown through it and no side of it is read there. It leads
  red-cell volume sets (mean corpuscular volume, β per T +0.038, P 8.3e-28, PIP 0.997; four more MCV and MCH sets at
  0.87 to 0.996): `mech:blood_count`, no `tradeoff` read; ZBTB46 expression sets named. Causal C4 (D39.12: none of Open Targets' 24 sets is mvAge's or a lifespan class's;
  Rosoff's Supplementary Table 10 sets it in neither SuSiE's nor FINEMAP's credible set, its PIPs 0.46 and 0.29). Effector E4: intronic in
  ZBTB46, with ZBTB46 expression sets in Open Targets, but no set of the row's phenotype and no colocalisation read.
  The literature search (the rsID, 2026-11-16; Semantic Scholar answered 429, its part unchecked) finds Rosoff and Zhao
  2024 (PMID 39421797), a Mendelian randomization of diabetes on vitiligo whose abstract does not name the variant; named,
  no side read. Descriptive. Age of action unknown. The evidence is European.
