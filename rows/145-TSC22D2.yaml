variants:
  - rsid: rs59633341
    gene: TSC22D2
    phenotype: TSC22D2 region, mosaic Y loss
    trait_efo_id: EFO_0007783
    effect_allele: A
    effect_size: 1.24
    effect_measure: OR
    stat_significance: significant
    direction: unknown
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the shorter A version of this DNA position (about 2 in 100 people of European
          ancestry do). In men, large studies link each copy of A with a higher chance, by about a quarter, that some
          blood cells have lost the Y chromosome, a change that becomes more common with age. That is a tendency in a
          marker whose reading only means something against your calendar age, which this report does not have, so it
          carries no score. Women have no Y chromosome, so it says nothing for them.
      - genotype: A/AT
        state: neutral
        conclusion: >-
          You carry one copy of the shorter A version of this DNA position (about 26 in 100 people of European
          ancestry do). In men, large studies link it with a higher chance, by about a quarter, that some blood cells
          have lost the Y chromosome, a change that becomes more common with age. That is a tendency in a marker whose
          reading only means something against your calendar age, which this report does not have, so it carries no
          score. Women have no Y chromosome, so it says nothing for them.
      - genotype: AT/AT
        state: neutral
        conclusion: >-
          You carry two copies of the common, longer version of this DNA position (about 72 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. The position lies between genes
          on chromosome 3, near TSC22D2. Loss of the Y chromosome from some blood cells, seen in men as they age, is a
          marker whose reading only means something against your calendar age, which this report does not have, so this
          result carries no score.
