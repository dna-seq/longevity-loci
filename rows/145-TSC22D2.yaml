# The seed list's locus 145, TSC22D2 (3q25.1): a marker of biological ageing (D32, D36.3), curated on D37.12 with 23
# TERC as the pattern. Curated 2026-11-16. Lead rs59633341, the seed's rsID (Wright 2017's mosaic loss of chromosome Y
# locus): a one-base indel in an intron of the lncRNA LINC01214, between genes, TSC22D2 the nearest labelled gene; VCF
# alleles A/AT at GRCh38 3:150,301,093 (Open Targets, FinnGen; Ensembl's T/TT at 150,301,094, the same insertion in a T
# run), GRCh37 3:150,018,880. The short allele A at 15.1 % in gnomAD's non-Finnish European genomes. A is the allele
# with more loss of Y.
locus_id: 145
locus_name: TSC22D2
verdict: kept
verdict_reason: >-
  Tier A on the marker's own evidence (D37.12; the seed gives none): the tier grades the association with mosaic loss
  of chromosome Y (LOY) in blood, a marker of ageing found in men only, not longevity, and this row is unscored (D32).
  The seed's study, Wright 2017, measures LOY as mLRR-Y in 67,034 UK Biobank men and prints rs59633341 with A, the
  mLRR-Y lowering allele, at 0.16: UK Biobank −0.004 (raw mLRR-Y), P 2.6e-18; EPIC-Norfolk −0.009, P 7.5e-7; deCODE
  −0.007 (log2 Y copy number), P 1.1e-5; overall P 4.1e-28. Thompson 2019 calls LOY as yes or no in 205,011 UK
  Biobank men (Wright's men among them) and prints it with A the risk allele at 0.163, OR 1.24 (1.22 to 1.27), P
  6.6e-112, replicated on the same side in 653,019 men of 23andMe (matched β −0.0056, P 1.5e-82), deCODE (P 2.8e-8)
  and 95,380 Japanese men of Biobank Japan (P 1.5e-18). The row tiers from Thompson, the study of 100k or more, with
  23andMe and Biobank Japan its independent replications: §4.1's A. D21's test where the units match: Wright's UK
  Biobank −0.004 against EPIC-Norfolk −0.009 (the replication the larger, no shrinkage, D39.1) and 23andMe −0.0056;
  Wright's SEs are not printed, so no heterogeneity P; no red flag. deCODE is in both papers, counted once. Lifespan
  look-ups, unscored and read for A, two-sided at 0.05 (D38.6): Park 2025's own survival P 0.41 (men 0.053, women
  0.30); Deelen 2019 90th P 0.60, 99th P 0.44; FinnGen R11's deaths P 0.24, a database line; all flat. Timmers 2019,
  Pilling 2017, Zenin 2019 and Foote 2025 hold no line for this indel (by rsID and by GRCh37 3:150,018,880 and
  150,018,881): untested. The literature search (the rsID, 2026-11-16; Semantic Scholar answered 429, its part
  unchecked) finds the two LOY GWASs and a review, no test of lifespan. Every genotype neutral, each conclusion a
  tendency of the marker with no colour (D32, D37.12); `direction: unknown`. Outcome cells read for A: exceptional
  survival 0 (Deelen flat); lifespan 0 (Park and FinnGen flat); healthspan untested (no deposit holds it). Context:
  the trait exists only in men, said here; no `sex_specific` token, since no test of a difference between the sexes
  exists or can (D16; Thompson's women P 0.99 is a negative control). Mechanism: markers of biological ageing.
  Pleiotropy `mech:cancer`: A raises clonal haematopoiesis of indeterminate potential (Open Targets, AT −0.010, PIP
  0.25) and the variant sits in a myeloproliferative neoplasm set (PIP 0.15, no beta), named; no `tradeoff`, the row
  naming no longevity-favoured allele. Causal C2 (PIP 0.47 in Wright's set; 0.06 in Terao 2019's Biobank Japan set).
  Effector E3: locus-to-gene TSC22D2 0.33 (EIF2A 0.18) on Wright's set and 0.43 on Terao's, no gene at 0.5 and the
  variant in no gene's coding or regulatory annotation read. Descriptive. Age of action unknown. The evidence is
  mostly European, Biobank Japan agreeing.
