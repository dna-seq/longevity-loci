variants:
  - rsid: rs7742789
    gene: ""
    phenotype: ZNF318 region, blood pressure and kidneys
    trait_efo_id: EFO_0007796
    effect_allele: C
    effect_size: 0.006
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA region (about 48 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. The region, on chromosome 6,
          near the ZNF318 and ABCC10 genes, is linked to blood pressure, the heart and the kidneys. The finding
          comes from people of European ancestry; less is known elsewhere.
      - genotype: C/T
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 43 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, this version went with slightly less healthy ageing, and parents of carriers lived
          a little less long. The same version goes with slightly higher blood pressure and somewhat more heart
          failure, heart disease, irregular heartbeat and kidney disease. Blood pressure is something a doctor can
          measure and treat, so regular checks are the part within reach. It is a likely finding, not a settled
          one. The effect is small and it is a tendency, not destiny.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 10 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, each copy went with slightly less healthy ageing, and parents of carriers lived a
          little less long. The same version goes with slightly higher blood pressure and somewhat more heart
          failure, heart disease, irregular heartbeat and kidney disease. Blood pressure is something a doctor can
          measure and treat, so regular checks are the part within reach. It is a likely finding, not a settled
          one. The effect is small and it is a tendency, not destiny.
