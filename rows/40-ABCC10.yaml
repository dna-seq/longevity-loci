# The seed list's locus 40, ABCC10 (6p21.1). Curated 2026-11-11. Lead rs7742789 (Rosoff 2023's mvAge, Table 1), the
# seed's only rsID here: intergenic, 8.6 kb from ZNF318 (Rosoff's gene), the catalog mapping it to ABCC10 and ZNF318.
# Wright 2019's Supplemental Table 9 holds one SNP on the lead's haplotype (rs1214759, r² 0.84, D′ 1). Open Targets
# 26.09: 172 credible sets hold the lead, none of a lifespan-class study; it leads 34, mostly kidney function, blood
# pressure, heart disease and serum magnesium. The GWAS Catalog (2026-10-29) holds 19 associations for it and 111
# for its 15 proxies at r² ≥ 0.8, none for lifespan or longevity.
locus_id: 40
locus_name: ABCC10
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: a genome-wide multivariate result with a co-occurring lifespan study (§4.5 as D16 reads
  it), with an independent nominal replication; a multivariate result does not meet tier A's first criterion
  (D18.3), whatever its replication. Genome-wide significant only in Rosoff 2023's mvAge, the common factor behind
  healthspan, frailty, exceptional longevity, parental lifespan and epigenetic age (P 3.3e-8, C raising the factor,
  so T, at about 31 % in Europeans, is on the less healthy side); Rosoff lists it as novel, and its Q test (P 0.41) finds
  no sign the SNP acts off the common factor. Timmers 2019's million parents' lives are the co-occurring lifespan
  study: T shortens life at P 1.2e-7, just short of genome-wide, UK Biobank and LifeGen on the same side. Healthspan
  agrees nominally: T ends healthspan earlier in Zenin 2019's UK Biobank (P 0.0052 raw, about 0.0065 after the
  deposit's genomic-control factor, derived), and frailty leans the same way (P 0.026). Exceptional survival is +:
  Deelen 2019's 99th percentile favours C (T β −0.082, P 0.012, one-sided about 0.006); the 90th does not reach even
  one-sided (P 0.22). All of these are inputs to mvAge, the same samples. Outside them, Wright 2019's AncestryDNA
  fathers replicate at rs1214759, 7 kb away on the lead's haplotype (r² 0.84, D′ 1): its A, which travels with T,
  shortens fathers' lives at raw P 0.0051 (one-sided 0.0026), and after Wright's genomic control (λ 1.182) at
  two-sided 0.010, one-sided 0.005 (derived), so it holds either way. The counted allele is A, as Table 8 prints it
  for the same SNP in fathers born 1886-1918 (genomic-control P 6.2e-4, the same customers, one signal, D17.1); the
  UK Biobank arm's sign agrees with Timmers' A (P 1.7e-6), heterogeneity P 0.96. The mothers' table holds no line in
  LD with the lead. FinnGen's death endpoint is null (T β −0.0018, P 0.83, a slight lean the other way): within
  FinnGen, APOE's factor would predict T +0.022 (power about 0.86, heterogeneity P about 0.009), so it flags under
  that calibration; the second, a mean over leads that hold up within FinnGen (D25.12), is not computed, so whether
  it is a red flag is unknown (D25.3). It cannot make the row D: AncestryDNA's independent replication stands
  (D25.1), and B is the cap either way. Mechanism: ageing in general (D25.7). The
  lead leads 34 Open Targets sets. Per T it lowers cystatin C (P 6e-45, a one-variant set, PIP 0.998) and
  creatinine and raises eGFR (P 1e-51, PIP 0.994), so T goes with better filtration; yet T raises acute renal
  failure, systolic blood pressure and pulse pressure, heart failure (P 8e-16), ischaemic heart disease, atrial
  fibrillation and clonal haematopoiesis with a DNMT3A mutation (P 2e-9), and lowers serum magnesium (P 2e-35). Three
  chronic kidney disease sets (MVP) hold the lead behind neighbours whose minor alleles travel with T (r² 0.76 to
  0.85, derived): impaired renal function, renal hyperparathyroidism and anaemia of kidney disease all rise on T's
  haplotype. The catalog's proxies add stroke, hypertension, testosterone and urate, named only (their ancestry not
  checked; some are Japanese). Blood pressure and the heart are the commonest thread, kidney traits as strong, and no
  one route is shown to carry the lifespan effect, so no single system is named. No trade-off is found (D18.1): the
  longer-life C has lower eGFR and higher cystatin C and creatinine on blood tests, but the kidney's own disease
  endpoints, acute and chronic, run with T, so the lower eGFR is not shown to be harm; C is on the lower-risk side
  for blood pressure, heart failure, ischaemic heart disease and atrial fibrillation. (Row 39's reading, a risk
  biomarker carried by the longer-life allele, would make it a trade-off; put to the lead.) Actionability is
  preventable, as at row 27: blood pressure is a measure a doctor takes, and the effect on it is read at the lead
  itself. Causal confidence C4 and effector E4: no credible set of a lifespan-class
  study holds the lead (mvAge's 26 sets in Open Targets include none on 6p21.1), so neither is read; locus-to-gene on
  the trait sets favours TJAP1 or CRIP3, ZNF318 at most 0.42, named only. C/C is the reference: the most common
  genotype at gnomAD's non-Finnish European frequency (T 0.31: C/C about 48 in 100, C/T 43, T/T 10), as in every large
  sample read here (LifeGen, Deelen, FinnGen, CEU: T 0.29 to 0.32); 1000 Genomes EUR's pooled 0.35 alone would put
  C/T first, by 45 to 43. PROTECT:ABSENCE_OF_RISK: C is the common allele at a heart and kidney disease locus, and T
  the risk version. Age of action is unknown: no cached source gives this locus's own age bands.
