variants:
  - rsid: rs10197246
    gene: ""
    phenotype: CASP8 region, cancer-free healthspan
    trait_efo_id: EFO_0009762
    effect_allele: C
    effect_size: -0.033
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 52 in 100). It is the reference the other combinations are compared with. The region, on
          chromosome 2, lies within the FLACC1 gene, beside CASP8, and it is not yet clear which gene
          matters. The finding comes from people of European ancestry; less is known elsewhere.
      - genotype: C/T
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 40 in 100 people of European
          ancestry do). In a very large British study, confirmed in a second group, this version went with a
          slightly earlier first major disease, and the difference was all in cancer; other studies link this
          version to skin cancer above all. It did not clearly shorten life itself. The effect is small and it is
          a tendency, not a verdict.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 8 in 100 people of European
          ancestry do). In a very large British study, confirmed in a second group, each copy went with a slightly
          earlier first major disease, and the difference was all in cancer; other studies link this version to
          skin cancer above all. It did not clearly shorten life itself. The effect is small and it is a
          tendency, not a verdict.
