# The seed list's locus 17, CASP8 (2q33.1; the seed's genes "CASP8;FLACC1"). Curated 2026-11-11, the second run's
# seventh row. Lead rs10197246 (Zenin 2019's healthspan SNP, Table 2; the paper names it by its nearest gene
# ALS2CR12, FLACC1's former symbol), the seed's only rsID here: an intron variant (of FLACC1's transcripts and some of CASP8's), C 0.72 in Europeans.
# In Timmers 2019's and Deelen 2019's summary statistics at the lead itself; Wright 2019's S8 has two SNPs within
# 0.12 Mb (rs3754935, rs1009276), neither a tag (minor alleles 5 to 7 % against the lead's 29 %).
locus_id: 17
locus_name: CASP8
verdict: re-tiered
verdict_reason: >-
  Tier C, down from the seed's B: a genome-wide and replicated healthspan result with no co-occurring lifespan
  study, so it cannot score (§4.5 as D16 reads it) and stays in the research view. In 300,447 British UK Biobank
  participants the common C delays the end of healthspan (Zenin 2019, β −0.033 on the log hazard, P 3.67e-9 after
  genomic control), and the paper's replication in 96,313 other UK Biobank participants, unrelated to them, holds it
  (β −0.035, P 2.4e-4, under its 0.05/12 threshold). The healthspan signal is cancer's alone: tested against each
  component, C lowers the cancer hazard (P 9.8e-18) and nothing else (all but cancer P 0.97). Lifespan is filed 0:
  Zenin's own parents'-death meta-analysis is null (P 0.80), own death is null (0.67), and Timmers 2019's summary
  statistics lean the same way at P 0.066, short of the p < 0.05 that D16 asks. Exceptional survival is 0: Deelen 2019's
  90th and 99th percentiles are null (P 0.39, 0.66, opposite leanings). Wright 2019's AncestryDNA mothers (rs3754935,
  85 kb, genomic-control P 4.2e-4) and fathers (rs1009276, 118 kb, P 2.8e-3) have nominal SNPs nearby, but neither
  can tag the lead (their minor alleles, 5 to 7 % in Europeans, cap r² with a 29 % allele near 0.19; Ensembl returns
  no pair at its 0.05 floor), so they are not this locus's lifespan signal. The variant is one of the strongest
  common skin-melanoma signals in other studies (T the risk allele, P 9e-39) and leads Open Targets' sets for all
  cancers and breast cancer in FinnGen; Zenin's healthspan set colocalises with basal-cell carcinoma, facial ageing
  and many other skin-cancer and keratosis studies, and with breast cancer, so the mechanism is filed as skin and sun
  with mech:cancer (Zenin's own cancer outcome is not split by site). Dementia (P 0.014 the other way, one of nine uncorrected component tests) is not read as a
  trade-off. Causal C2: the lead tops an 11-variant SuSiE set at PIP 0.13. Effector E3, no gene named: FLACC1 has the
  locus-to-gene score (0.56) and seven eQTL colocalisations, which meets E1 on the letter, while CASP8 colocalises
  in 217 QTL sets and holds the lead's own strongest QTL (a CASP8 transcript, P 1e-63); two genes each meet a
  criterion, and Zenin's credible set holds a CASP8 missense variant. The protection is the absence of the risk allele T (the common C protects). Age of action is unknown.
