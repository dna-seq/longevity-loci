# The seed list's locus 73, KL (KL-VS, F352V). Curated 2026-11-12. Lead rs9536314 (GRCh38 13:33,054,001, GRCh37
# 13:33,628,138, T/A/G), the F352V change of KLOTHO's KL-VS haplotype, whose other coding change C370S is rs9527025
# (r² 1.0 in Europeans). G, the V352 allele, is about 0.16 to 0.19 in Europeans, 0.20 in Africans and absent in East
# Asians. A candidate-gene locus from v1 (v1 holds rs9536314 and rs9527025, both from Arking 2002).
locus_id: 73
locus_name: KL (KL-VS
verdict: kept
verdict_reason: >-
  Tier C, as the seed: a candidate-gene association replicated only in small or same-group samples (§4.1's C), its
  claim a genotype model, not an allele. Arking 2002 named KL-VS (six variants in complete LD, F352V and C370S) and
  found its homozygotes underrepresented among the elderly of three populations (Bohemian Czechs, Baltimore
  Caucasians and African-Americans; combined OR 2.59, P < 0.0023), with V352 cutting secreted klotho 6-fold in
  transfected cells. The same group's 2005 paper, in 525 Ashkenazi Jews, reports a heterozygote advantage: combined
  with the Czech data an OR of 1.57 (1.23 to 1.98) for 5-year survival, and among probands aged 95 or more a Cox HR
  for death of 2.15 (1.18 to 3.91) for wild-type and 4.49 for VS homozygotes, against heterozygotes. Independent
  samples: Invidia 2010 (1,089 Italians aged 19 to 109) found heterozygotes enriched among the elderly but not among
  centenarians; de Vries 2017 (Aberdeen Birth Cohort 1936) found heterozygotes with shorter survival, which its
  authors call unexpected. Three meta-analyses call KL-VS significant (Di Bona 2014 for healthy ageing, Revelas 2018
  for survival to 85, Zhu 2019 for longevity), but none of their abstracts gives a pooled effect or a genetic model
  (only the abstracts were read), and Zhu's "the F allele played a protective role" is a per-allele claim, not a
  heterozygote advantage, so they are not counted as one agreeing result. Every large look is per-allele and flat:
  LifeGen G −0.0061 (P 0.24, n 638,891), Deelen's 90th percentile G +0.024 (P 0.37) and 99th +0.026 (P 0.53), FinnGen
  R11 death G with more deaths (P 0.53, a database line), Park 2025 G with more deaths (P 0.49, columns swapped), Zenin's
  healthspan G earlier (P 0.081 raw, 0.089 after genomic control). An additive test reads a heterozygote contrast only
  in part: weighting genotypes at G 0.16, the per-allele slope is 0.68 of the heterozygote log OR plus 0.16 of the
  homozygote's. Under Arking's full model (heterozygote 1.57, homozygote 1/2.59) the expected Deelen 90th log OR is
  +0.154 (SE 0.097 from the discovery's intervals), power 1.00 but heterogeneity P 0.19 (99th: 0.98, 0.22); a flag
  appears only under models Arking does not state (homozygotes as wild type, P 0.0011). That conversion is the
  curator's, from odds ratios of different designs, so the red flag is unknown and no token is set (D28.1, D26.3), and
  D25.1's "explicitly contradicted" is not met. No study has tested the heterozygote contrast at scale. Mechanism
  `legacy_candidate`: a v1 candidate row (R-LEGACY-1); nothing large shows what would carry it. Arking 2005 reports
  HDL cholesterol, systolic pressure and stroke by genotype in the same small sample; Belloy 2020 (20,928 case-control
  participants, Northwestern Europeans aged 60 or more) reports heterozygosity with less Alzheimer disease only in
  APOE4 carriers (OR 0.75, P 7.4e-7), and Shibata 2025 finds no effect of heterozygosity on cognition or brain volume
  in UK Biobank (312,524), whatever the APOE genotype. Pleiotropy `nonadditive` and `context:apoe4`. The GWAS Catalog
  holds no association for rs9536314, and Open Targets places it only in a single-cell KL eQTL set at PIP 0.012, so
  C4. The variant is a missense change in KL, so E1 and gene KL. Mouse: klotho mutants age early and die young,
  overexpression extends life (GenAge), against a human heterozygote advantage: `animal:genage_mouse` and
  `animal_dir:nonmonotone`, the requirements' own example (R-ANIMAL-4). `legacy_longevitymap` (R-LEGACY-1): genotypes
  neutral, the heterozygote claim said in the conclusions. Age of action unknown (Invidia's and de Vries' readings of
  an age window are hypotheses).
