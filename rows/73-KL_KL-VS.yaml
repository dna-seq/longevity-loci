variants:
  - rsid: rs9536314
    gene: KL
    phenotype: KL-VS and survival to old age
    trait_efo_id: OBA_VT0005372
    effect_allele: G
    effect_size: 2.59
    effect_measure: OR
    stat_significance: nominal
    direction: contested
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry no copy of KL-VS, a version of the KLOTHO gene (about 66 in 100 people of European ancestry and
          all people of East Asian ancestry have this). Small studies compared other combinations with this one: some
          found people with one copy of KL-VS more common among the elderly, and one found them with shorter survival.
          Large genetic studies of lifespan found no sign of the version either way. It says nothing about your own
          lifespan.
      - genotype: G/T
        state: neutral
        conclusion: >-
          You carry one copy of KL-VS, a version of the KLOTHO gene that changes the klotho protein (about 31 in 100
          people of European ancestry do; it is absent in East Asian ancestry). Small studies reported people with one
          copy more common among the elderly and longer-lived in very old age, and one later study found the opposite.
          A large Alzheimer study saw less Alzheimer disease in people with one copy who also carry APOE4, but a large
          UK study found no effect on memory and thinking. Large genetic studies of lifespan found no sign of KL-VS.
          It says nothing firm about your own lifespan.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of KL-VS, a version of the KLOTHO gene (about 3 in 100 people of European ancestry do).
          Small studies, mostly from one research group, reported people with two copies less common among the
          elderly. Large genetic studies of lifespan found no sign of KL-VS, though they were not designed to compare
          two copies with one. It says nothing firm about your own lifespan.
