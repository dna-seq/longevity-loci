# The seed list's locus 98, NOL4L (20q11.21). Curated 2026-11-14. Lead rs159428, the seed's only rsID (Zenin 2019's
# healthspan SNP, also Rosoff 2023's mvAge lead): intronic in NOL4L, GRCh38 20:32,511,508, GRCh37 20:31,099,311, T/C,
# C ancestral, T 0.46 in non-Finnish Europeans and the healthier allele.
locus_id: 98
locus_name: NOL4L
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's B (D25.1), row 86's shape: a genome-wide healthspan discovery that fails its own powered
  replication in its own ancestry, with no independent scoring-class study at p < 0.05 its way. Zenin 2019, in
  300,447 British UK Biobank participants: C ends healthspan earlier, β +0.028 (SE 0.0049) on the log hazard, P
  2.4e-8 after genomic control, in both cancer and non-cancer outcomes. The paper's replication in 96,313 other UK
  Biobank participants goes the other way: the first cohort, the other Europeans, C −0.0070 (SE 0.0091), P 0.44; the
  five-cohort meta C −0.0047, P 0.58. Healthspan against healthspan on one scale: one-sided power 0.92, heterogeneity
  P 7.1e-4 (the meta 0.95, P 9.7e-4): D21's red flag, `replication_failed`. Nothing independent passes. Every
  lifespan look on T's side is UK Biobank, Zenin's own biobank, so co-occurring, not independent: Zenin's own
  participants' death (C more, P 0.0054) and parents' death (P 0.027), Pilling 2017's fathers (T longer, P 6.4e-4)
  and both parents (P 0.0077), Timmers 2019 (T longer, P 0.0074, "++", UK Biobank inside; no LifeGen-only line at
  the lead), Park 2025's own survival (T fewer deaths, P 0.044, its allele columns swapped). Deelen 2019, outside UK
  Biobank, is flat (90th P 0.71, 99th 0.25 the other way), its flag unknown for a healthspan discovery (D27.9).
  FinnGen R11's death endpoint, outside UK Biobank, has T with fewer deaths, P 0.011 (one-sided 0.0055), but a
  database release line never replicates and so is not D25.1's independent pass (D12, D30.12); named. Wright 2019's
  AncestryDNA has no line at the lead; its fathers' line at rs293566 (1.4 kb, r² 0.46 in CEU) leans T's way (raw P
  0.014), a weak tag, named, not counted. Rosoff 2023's mvAge is genome-wide at the lead (T, P 6e-10) but pools
  healthspan and UK Biobank parental lifespan, multivariate (D18.3, D22.2), and replicates nothing. Whether the
  FinnGen pass and the UK Biobank lifespan looks should keep the row at B with `replication_failed` is put to the
  lead; D is written, as 86. Outcome cells on a D row (D28.10): healthspan 0, the contradicted discovery giving no +;
  lifespan 0 (the UK Biobank looks are the discovery's biobank, and nothing independent gives + or −); exceptional
  survival 0 (Deelen flat). Mechanism general ageing (D25.7), pleiotropy empty; the lead's other associations are
  cognition, education and lipoprotein-subclass lipids, named. Descriptive. Causal C4 and effector E4, no gene named:
  Zenin's healthspan has no credible set in Open Targets, and Rosoff's mvAge PICS set (lead posterior 0.48,
  locus-to-gene under 0.06 for every gene) is multivariate, a set the tier does not rest on (D17.2); NOL4L is named in
  prose. Every genotype neutral (D25.2); C/T, about half of Europeans, the reference. Age of action unknown. The
  evidence is European.
