    effect_size: -0.0278
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of each version of this DNA position, as about half of people of European ancestry do.
          It is the reference the other combinations are compared with. The position, on chromosome 20, lies in the
          NOL4L gene, whose role here is not known.
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the T version of this DNA position (about 1 in 5 people of European ancestry do).
          A very large British study found it a little later in life before major disease began, but the same study's
          check in other people did not confirm it, so it is not counted for or against healthy lifespan.
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the C version of this DNA position (about 3 in 10 people of European ancestry do).
          A very large British study found major disease beginning a little earlier with it, but the same study's
          check in other people did not confirm it, so it is not counted for or against healthy lifespan.
