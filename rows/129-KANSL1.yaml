    gene: MAPT
    phenotype: MAPT/KANSL1 inversion, brain age gap
    trait_efo_id: EFO_0010602
    effect_allele: A
    effect_size: 0.44592484
    effect_measure: beta
    stat_significance: significant
    direction: unknown
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the A version of this DNA position (about 5 in 100 people of European ancestry do).
          It marks a long stretch of chromosome 17 that sits in the reverse orientation. Large studies link each copy
          of A with a brain that looks about half a year older on MRI scans than expected for its age. That is a
          tendency in a marker whose reading only means something against your calendar age, which this report does
          not have, so it carries no score.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy of the A version of this DNA position (about 34 in 100 people of European ancestry do).
          It marks a long stretch of chromosome 17, around the MAPT gene, that sits in the reverse orientation. Large
          studies link it with a brain that looks about half a year older on MRI scans than expected for its age. That
          is a tendency in a marker whose reading only means something against your calendar age, which this report
          does not have, so it carries no score.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (about 61 in 100 people of European ancestry
          do). It is the reference the other combinations are compared with. The position lies inside MAPT, the gene
          for the tau protein, in a region of chromosome 17 that comes in two orientations. Brain age, estimated from
          MRI scans, is a marker whose reading only means something against your calendar age, which this report does
          not have, so this result carries no score.
