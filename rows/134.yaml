  - rsid: rs2860197
    gene: FGFR2
    phenotype: FGFR2 region, healthspan
    trait_efo_id: EFO_0009762
    effect_allele: A
    effect_size: -0.0291739
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of the more common version of this DNA position (about 37 in 100 people of European
          ancestry do). It lies in the FGFR2 gene, a gene known for its link to breast cancer. In a very large
          British study each copy went with staying free of major age-related diseases a little longer, mostly
          through less cancer, and parents of carriers lived very slightly longer. Repeat studies elsewhere did not
          confirm the healthspan link, so this is a likely finding, not a settled one: a tendency, not destiny.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy of each version of this DNA position, the most common combination (about 48 in 100
          people of European ancestry). It is the reference the other combinations are compared with. The position
          lies in the FGFR2 gene, a gene known for its link to breast cancer. The finding comes from people of
          European ancestry.
      - genotype: G/G
        state: risk
        conclusion: >-
          You carry two copies of the less common version of this DNA position (about 15 in 100 people of European
          ancestry do). It lies in the FGFR2 gene, a gene known for its link to breast cancer. In a very large British
          study each copy went with major age-related diseases, mostly cancer, arriving a little earlier. Repeat
          studies elsewhere did not confirm the healthspan link, so this is a likely finding, not a settled one: a
          tendency, not destiny.
