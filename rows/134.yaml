# The seed list's locus 134, unnamed (10q26.13, FGFR2). Curated 2026-11-14. Lead rs2860197, the seed's only rsID
# (Zenin 2019's healthspan SNP): an intron of FGFR2, GRCh38 10:121,591,788 G/A, GRCh37 10:123,351,302, A the common
# allele (0.61 in gnomAD's non-Finnish Europeans) and the healthier, longer-lived side. Open Targets 26.09 holds it in
# 45 credible sets, mostly breast cancer, and one lifespan-class set, Zenin's healthspan; the GWAS Catalog (2026-10-29)
# holds nothing under this rsID.
locus_id: 134
locus_name: ""
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's B (D25.1), row 98's shape (D30.17): a genome-wide healthspan discovery that fails its own
  powered replication in its own ancestry, with no independent scoring-class study at p < 0.05 its way. Zenin 2019,
  in 300,447 British UK Biobank participants: A delays the end of healthspan, −0.029 on the hazard (SE 0.0050), P
  5.0e-9, 1.2e-8 after genomic control. Its five replication cohorts, outside UK Biobank, are flat (meta-analysis A
  −0.0065, SE 0.0086, P 0.45): healthspan against healthspan on one scale, one-sided power 0.96 and heterogeneity P
  0.023, D21's red flag (the paper's 0.66 is another calculation), `replication_failed`. Every lifespan look on A's
  side is UK Biobank, the discovery's own biobank, so co-occurring, not independent: Timmers 2019 (A +0.0074 per
  self, P 0.062, one-sided 0.031, "++", its LifeGen arm alone unprinted: Figure 2's source data, the only LifeGen-without-UK-Biobank lines, holds none at the lead or FGFR2, so outside UK Biobank Timmers is unknown here, D31.3), Pilling 2017's mothers (P 0.0065) and both
  parents (0.073), Park 2025's own survival (A fewer deaths, P 0.11); within Zenin's own line the participants' death
  (P 0.87) and parents' death (0.61) are flat. Outside UK Biobank: Deelen 2019's 90th percentile flat (P 0.96), the
  99th A's way (P 0.13, one-sided 0.065); FinnGen R11's death endpoint flat (P 0.78), a database line. Wright 2019's
  AncestryDNA lines in the window (FGFR2's rs2981428 and three more at 22 to 34 kb; others at 300 to 480 kb) tag
  nothing (none in the lead's CEU window at r² 0.3, rs2243609 at 0.09, the rest with no CEU pair), and Table 9's
  rs17102287 (r² 0.35) is a weak tag and a Table 9 line, named: AncestryDNA untested. Foote 2025's factors lean A's way
  on two (unhealthy lifestyle P 0.049, disability 0.0069), multivariate; its general and F4 deposits read back
  incomplete (the general factor's window ends at 123,058,176, short of the lead), unread; Rosoff 2023 holds no line. The literature
  search (Europe PMC, OpenAlex, PubMed, Crossref, preprints; Semantic Scholar answered 429, its part unchecked) finds
  Zenin alone among lifespan studies. Outcome cells on a D row (D28.10, D30.17): no + from a study that shares the
  discovery's sample, so healthspan 0 and lifespan 0; nothing gives −; exceptional survival 0 (Deelen flat). Every
  genotype neutral (D25.2). Mechanism ageing in general (D25.7), pleiotropy empty: the healthspan signal is a cancer
  signal (Zenin's cancer component, A −0.044, P 1.6e-11), the locus breast cancer's FGFR2 locus, where the lead's own
  lines have A lowering breast cancer, and A raises atrial fibrillation (P 9.2e-15 at the lead); named. Causal C2: the
  healthspan set holds the lead at posterior 0.18. Effector E3, no gene named: locus-to-gene names FGFR2 (0.89), but
  the set's one colocalisation is a WDR11 transcript-usage QTL (H4 0.99); FGFR2 is named in prose. Descriptive. Age of
  action unknown. The evidence is European.
