    gene: ""
    phenotype: FGFR2 region, healthspan
    trait_efo_id: EFO_0009762
    effect_allele: A
    effect_size: -0.0291739
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA position (about 37 in 100 people of European
          ancestry do). It lies in the FGFR2 gene, a gene known for its link to breast cancer. One large British
          study linked this position to staying free of major diseases a little longer, but repeat studies elsewhere
          did not confirm it, so it is not counted for or against healthspan or lifespan.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy of each version of this DNA position, the most common combination (about 48 in 100
          people of European ancestry). It is the reference the other combinations are compared with. It lies in the
          FGFR2 gene, a gene known for its link to breast cancer. One large British study linked this position to
          healthspan, but repeat studies did not confirm it, so it is not counted for or against.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the less common version of this DNA position (about 15 in 100 people of European
          ancestry do). It lies in the FGFR2 gene, a gene known for its link to breast cancer. One large British study
          linked this version to major diseases arriving a little earlier, but repeat studies elsewhere did not
          confirm it, so it is not counted for or against healthspan or lifespan.
