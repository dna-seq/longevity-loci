# The seed list's locus 134, unnamed (10q26.13, FGFR2). Curated 2026-11-14. Lead rs2860197, the seed's only rsID
# (Zenin 2019's healthspan SNP): an intron of FGFR2, GRCh38 10:121,591,788 G/A, GRCh37 10:123,351,302, A the common
# allele (0.61 in gnomAD's non-Finnish Europeans) and the healthier, longer-lived side. Open Targets 26.09 holds it in
# 45 credible sets, mostly breast cancer, and one lifespan-class set, Zenin's healthspan; the GWAS Catalog (2026-10-29)
# holds nothing under this rsID.
locus_id: 134
locus_name: ""
verdict: kept
verdict_reason: >-
  Tier B, the seed's, with `replication_failed`: row 103's shape under D30.3. Zenin 2019's healthspan GWAS in UK
  Biobank is genome-wide at the lead: A delays the end of healthspan (−0.029 on the hazard, P 5.0e-9; 1.2e-8 after
  genomic control). Its own five replication cohorts are flat (meta-analysis A −0.0065, SE 0.0086, P 0.45): at the
  discovery's effect one-sided power 0.96 and heterogeneity P 0.023, a D21 red flag on D21's own definition (the
  paper's power, 0.66, is a different calculation, as at 103). D25.1 would make that D, but the row has a lifespan
  signal of its own (D30.3, D16): Timmers 2019's million parents' lives give A +0.0074 per self, P 0.062, one-sided
  0.031, "++" in UK Biobank and LifeGen, the co-occurring lifespan study; Pilling 2017's mothers lean the same way (P
  0.0065), both parents 0.073, fathers flat, UK Biobank. So B, a single genome-wide study with its replication failed.
  Elsewhere: Deelen 2019's 90th percentile flat (P 0.96), the 99th A's way (P 0.13, one-sided 0.065); FinnGen R11's
  death endpoint A's way, flat (P 0.78); Park 2025's own survival A with fewer deaths (P 0.11), UK Biobank. Wright
  2019's FGFR2 lines (mothers at rs2981428 and three more, 22 to 34 kb) are not in the lead's CEU window at r² 0.3, and
  Table 9's rs17102287 (r² 0.35) is a weak tag and a Table 9 line, named, not counted: AncestryDNA untested. Foote
  2025's factors lean A's way on two (unhealthy lifestyle P 0.049, disability 0.0069), multivariate, named; Rosoff 2023
  holds no line. Timmers' strongest line within 500 kb is P 0.0016: nothing suggestive. The literature search finds no
  other longevity test of the lead. Healthspan + (the discovery), lifespan + (Timmers, one-sided 0.031), exceptional
  survival 0 (Deelen flat). The healthspan signal is a cancer signal: in Zenin's components A lowers cancer (P
  1.6e-11) and barely anything else (all but cancer P 0.042), and the locus is breast cancer's FGFR2 locus (about 26 of
  Open Targets' 45 sets, their signs mixed across catalog-derived studies, so the direction is read from Zenin's own
  component). Mechanism ageing in general, as row 13 files a cancer-led locus, with `mech:cancer`; protection is the
  absence of risk, the common A cancer's lower-risk allele (D30.6). Causal C2: the healthspan set holds the lead at
  posterior 0.18. Effector E2, FGFR2: locus-to-gene 0.89 in that set, no colocalisation read. Descriptive. Age of
  action unknown: Timmers' age bands do not include the lead. The evidence is European.
