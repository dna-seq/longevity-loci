variants:
  - rsid: rs12830425
    gene: ""
    phenotype: FGD6 region, heart disease, ageing
    trait_efo_id: EFO_0007796
    effect_allele: G
    effect_size: 0.0318
    effect_measure: beta
    stat_significance: significant
    direction: protective
    negatives: >-
      The longer-life version, G, is tied by Timmers 2020 to more age-related macular degeneration, an eye disease;
      none of the credible sets holding it is for macular degeneration. How this weighs against the longer life is
      not measured.
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the usual version of this DNA region, as about 86 in 100 people of European
          ancestry do. It is the reference the less common version is compared with. The region, on chromosome 12,
          lies inside the gene FGD6, near other genes; which one matters is not known. The finding comes from people
          of European ancestry; less is known elsewhere.
      - genotype: G/T
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 14 in 100 people of European ancestry
          do). In very large European studies that combined healthy years, parents' lifespan and reaching old age,
          this version went with slightly healthier ageing and longer-lived parents, and with less heart disease. It
          has also been linked to more age-related macular degeneration, an eye disease. A large American study of
          fathers did not see the lifespan effect, so treat it as likely but unsettled; the effect is small.
      - genotype: G/G
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 6 in 1,000 people of European
          ancestry do). In very large European studies each copy went with slightly healthier ageing and
          longer-lived parents, and with less heart disease; people with two copies were not studied on their own.
          It has also been linked to more age-related macular degeneration, an eye disease. A large American study
          of fathers did not see the lifespan effect, so treat it as likely but unsettled; the effect is small.
