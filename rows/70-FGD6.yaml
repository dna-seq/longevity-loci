# The seed list's locus 70, FGD6 (12q22). Curated 2026-11-12. Lead rs12830425 (the seed's only rsID; GRCh38
# 12:95,187,042, GRCh37 12:95,580,818), intronic in FGD6, T/G, G at 0.074 in non-Finnish Europeans and 0.25 in East
# Asians: Timmers 2020's multivariate FGD6 locus (Table 1). In Timmers 2019's, Zenin 2019's, Deelen 2019's, FinnGen
# R11's and Park 2025's summary statistics at the lead itself; in Wright 2019's fathers' table through rs11107904
# (r² 0.88), and a weaker tag rs4128507 (r² 0.29). Model-organism support from Bou Sleiman 2022 (mouse QTL, worm RNAi).
locus_id: 70
locus_name: FGD6
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: a genome-wide multivariate result with a co-occurring lifespan study (§4.5 as D16 reads
  it); a multivariate result does not meet tier A's first criterion (D18.3), and a red flag (below) would cap it at B
  too. Row 27's shape. Genome-wide only in Timmers 2020's test of healthspan, parental lifespan and 90th-percentile
  longevity (P_MANOVA 8e-9; G favourable in all three columns, P 3e-6, 2e-5, 0.03); no input is genome-wide alone,
  and the authors ask for replication in independent cohorts (q6, q9, q10). Rosoff 2023's mvAge holds no lead here: its
  best SNP in the FGD6 window, rs11107928 (r² 0.98), reaches z 5.03 (P about 5e-7). Timmers 2019's parents' lives are
  the co-occurring lifespan study: G longer, P 1.8e-5, UK Biobank and LifeGen on the same side. The inputs agree:
  Zenin's healthspan G later (P 2.8e-6, about 5.0e-6 after the 1.053 genomic control, D26.1) and Deelen's 90th
  percentile G (P 0.031, one-sided 0.016; the 99th one-sided 0.034), none of them a replication. Outside the inputs:
  FinnGen R11's any-death endpoint puts G on the fewer-deaths side, flat (P 0.28, one-sided 0.14; a database line,
  D29.1); Park 2025's own survival puts G with fewer deaths (P 0.04, one-sided 0.019; columns swapped, as at APOE),
  UK Biobank's people, not independent. The one independent sample with a line is AncestryDNA's fathers in Wright
  2019, at rs11107904 (r² 0.88, D′ 0.95, its minor C with the lead's G; the counted allele C, not the printed A, by
  the UK Biobank arm's sign against Timmers' C, as at rows 40 and 69): flat, β +0.0026 (SE 0.0049), one-sided P 0.30,
  against Wright's UK Biobank fathers' +0.0176 (P 3e-5) on the same scale, heterogeneity P 0.035 as Wright prints it
  (0.020 from the two arms, 0.033 with both SEs inflated by λ 1.182; derived). AncestryDNA's one-sided power for the
  UK arm's β at its SE is 0.975 (0.95 after λ): a red flag by D21 (power ≥ 0.8, heterogeneity P < 0.05, both errors
  counted, D29.6), so `replication_failed`. It is fathers against fathers, the sex's own effect (D28.2); Table 9
  has no mothers' line near the locus, which is no null (q6), and Timmers 2020 leaves the sex difference open (q31).
  The printed A is no allele of rs11107904 (T/C): T's complement, a strand flip as well as the other allele's label.
  Row 27 read this same test the other way (heterogeneity P 0.43, no
  flag). The flag needs at least about 0.87 of the UK arm's β (0.93 after λ), heterogeneity binding: a thin margin.
  No conversion is needed (D28.1 does not bite): both arms are Wright's, on one printed scale. The option, put to the
  lead: the UK Biobank fathers' arm is not the multivariate discovery's own effect (D27.9), so the flag is unknown
  (D26.3) and no token is set; the tier is B either way. The weaker tag rs4128507 (r² 0.29, D′ 1, 3 kb away) splits
  the same way more sharply (UK arm P 2.8e-7, AncestryDNA 0.95, heterogeneity P 0.0027), named only. The rsID literature
  search found Timmers 2020 and Bou Sleiman 2022 and nothing else (Semantic Scholar answered, with none).
  Mechanism: heart and vessels. The Timmers set colocalises with coronary artery disease (H4 0.95, GCST005194), and
  its 36 colocalisations with other GWAS are coronary disease, platelet counts, angina and pulse pressure; phased through the set leads' minor alleles, which ride with G (r² 0.65 to 0.98), G lowers coronary
  artery disease (P 2.5e-10), myocardial infarction (P 2.3e-12) and angina (P 6.5e-13), and Timmers 2020 says the
  life-extending allele near FGD6 goes with less cardiovascular disease. That is shared signal at one haplotype, not a
  mediator test; it is row 51's reading. G also raises platelet count (P 3.8e-16; the maximum-count set, GCST90476296,
  colocalises at H4 0.97) and white-cell count: pleiotropy mech:cvd and mech:blood_count. A trade-off is quoted (D18.1): Timmers 2020 finds the
  life-extending SNP near FGD6 with more macular degeneration (q24, the quote that made row 43 `tradeoff`), so the row
  is descriptive (D18.2), whatever the coronary link suggests. Causal confidence C3: the lead is in the one
  lifespan-class set, Timmers 2020's PICS set of 77 variants, at a posterior of 0.058, under 0.1 (§4.2; the tier
  rests on that study, so D25.5 and D28.5 do not bar it). Effector E3, no gene named, by D24: of the set's 13 cis-QTL
  colocalisations at H4 ≥ 0.8 (a query naming the QTL types), FGD6 holds 8 (adipose, aorta, fibroblasts, lung) and
  VEZT 4 (fibroblasts, adipose), a rival with more than a tenth (NDUFA12 1); locus-to-gene passes for no gene (NR2C1
  0.32, VEZT 0.26, FGD6 0.20). FGD6 leads, and is the papers' candidate, with directions that disagree: Timmers 2020's SMR puts lower FGD6 expression (adipose, artery) with the
  better side, and Rosoff's TWAS puts higher predicted FGD6 expression with the healthier mvAge side (z +4.9, P
  9.8e-7, colocalisation PP4 0.98, on a sub-genome-wide mvAge signal, so it sets no level, D28.5). Animal support,
  which never moves a tier or a weight (R-ANIMAL-1): in UM-HET3 mice Fgd6 is one of eleven genes tied at the top score
  in the late male lifespan QTLs (Vezt is another), and knocking down its worm ortholog tag-77 by
  RNAi shortened life about 14 % (P 0.0019); `animal:mouse_qtl` and `animal:worm_rnai`. No `animal_dir`: the human
  direction of FGD6 expression is itself in dispute, and a knockdown says nothing of which allele protects
  (R-ANIMAL-3). No `model_organism` study entry: none of §4.5's phenotype classes fits a mouse or a worm, so one is put
  to the lead rather than borrowed. PROTECT:PRESENCE: the longer-life G is the minor, derived allele (T ancestral);
  T/T is the reference, about 86 in 100 Europeans. Age of action is unknown: Timmers 2020's fading with parental age
  is collective (q2, q11), and the sex difference is unsettled (q31). The evidence is European; G is 0.25 in East
  Asians, untested there.
