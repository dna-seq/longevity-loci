# The seed list's locus 5, FPGT / TNNI3K (1p31.1). Curated 2026-11-11, the ten-row run's seventh row. Lead
# rs146254978 (Pilling 2017, Table 2, a rare variant of the parents' age-at-death analysis), the seed's only rsID
# here. Wright 2019's tables hold one clumped SNP within 0.5 Mb, rs10789398 (1:75018421, mothers, P about 1e-3),
# with no cached LD to the lead: not read. Open Targets 26.09 does not know rs146254978 (no variant, no credible
# set); the GWAS Catalog (2026-10-29) holds Pilling's association alone.
locus_id: 5
locus_name: FPGT / TNNI3K
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: genome-wide significant in one study, with no independent replication (§4.1's
  single-study clause). The one genome-wide result is Pilling 2017's analysis of parents' age at death in the
  208,118 UK Biobank participants whose parents had both died: P 4.6e-8, just under the threshold, in a rare
  variant (2 %) the authors call a candidate for follow-up. Its rarer allele, C, goes with older parents at death:
  that analysis sums the z-scored ages at death, so a positive β is a longer life (the methods; checked at BEND3, the
  other variant found only there, whose sign Timmers 2019 confirms), and T's β is −0.0692. The weaknesses stay in
  this text, not in the tier: the main analysis of the same people (parents' attained age, the living included)
  gives only P 0.021; mothers are null (P 0.43) and fathers carry it (P 3.0e-4); Timmers 2019's larger parental
  lifespan meta-analysis agrees in direction in both UK Biobank and LifeGen but only at P 0.037 (imputation info
  0.83), and it contains the same UK Biobank parents, so it is not a replication. Healthspan is null on the same
  side (Zenin 2019, P 0.40). Exceptional survival is untested: Pilling's both-parents-in-the-top-10 % analysis gives
  P 1.9e-3 with no direction in the text (its supplementary workbook is not reachable by script), and Deelen 2019's
  longevity meta-analysis has no result for the variant. The protection is a presence: the rare allele raises
  lifespan. The mechanism is filed as general ageing because nothing assesses one: Open Targets 26.09 has no record
  of the variant, so no fine-mapping (causal C4) and no locus-to-gene score (effector E4, no flag, nothing to cite;
  `gene` empty), and the GWAS Catalog records no other trait for it. That is unassessed, not an absence of disease
  links: TNNI3K's cardiac role is not evidence at this SNP. Pleiotropy is not assessed. Age of action is unknown.
