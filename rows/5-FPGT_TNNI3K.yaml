variants:
  - rsid: rs146254978
    gene: ""
    phenotype: FPGT/TNNI3K region, parental lifespan
    trait_efo_id: EFO_0007796
    effect_allele: T
    effect_size: -0.0692
    effect_measure: beta
    stat_significance: significant
    direction: risk
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one almost everyone of European
          ancestry has (about 96 in 100). It is the reference the other combinations are compared with. The region,
          on chromosome 1, lies within the FPGT and TNNI3K genes, and it is not known which gene matters. The finding
          comes from people of European ancestry; less is known elsewhere.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of a rare version of this DNA region (about 4 in 100 people of European ancestry do).
          In a very large British study, people with this version tended to have parents who died at older ages. It
          is a likely finding, not a settled one: it was seen in one analysis of one study, only just strong enough
          to count, and has not been confirmed in a separate group of people. It is a tendency, not a guarantee.
      - genotype: C/C
        state: protective
        conclusion: >-
          You carry two copies of a rare version of this DNA region (about 4 in 10,000 people of European ancestry
          do). In a very large British study, each copy of this version went with parents who died at older ages.
          It is a likely finding, not a settled one: it was seen in one analysis of one study, only just strong
          enough to count, and has not been confirmed in a separate group of people. Almost no one carries two
          copies, so how they fare was not measured directly. It is a tendency, not a guarantee.
