variants:
  - rsid: rs4691895
    gene: NAF1
    phenotype: NAF1 downstream, leukocyte telomere length
    trait_efo_id: OBA_0003784
    effect_allele: C
    effect_size: 0.058
    effect_measure: beta
    stat_significance: significant
    direction: unknown
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common C version of this DNA position (about 59 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. The position lies just past
          NAF1, a gene that helps build telomerase, the enzyme that rebuilds telomeres, the protective caps at the ends
          of chromosomes. Telomere length is a marker whose reading only means something against your calendar age,
          which this report does not have, so this result carries no score.
      - genotype: C/G
        state: neutral
        conclusion: >-
          You carry one copy of the G version of this DNA position (about 35 in 100 people of European ancestry do).
          Large studies link it with slightly shorter telomeres in white blood cells, about a seventeenth of the usual
          spread between people. That is a tendency in a marker whose reading only means something against your
          calendar age, which this report does not have, so it carries no score.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the G version of this DNA position (about 5 in 100 people of European ancestry do).
          Each copy is linked in large studies with slightly shorter telomeres in white blood cells. That is a
          tendency in a marker whose reading only means something against your calendar age, which this report does
          not have, so it carries no score.
