# The seed list's locus 143, NAF1 (4q32.2): a marker of biological ageing (D32, D36.3), curated on D37.12 with 23
# TERC as the pattern. Curated 2026-11-16. Lead rs4691895, the seed's rsID (Li 2020's NAF1 telomere-length lead): 1.6
# kb downstream of NAF1's MANE transcript and a benign missense (L368V) on another NAF1 transcript, GRCh38
# 4:163,127,047 G/C, GRCh37 4:164,048,199, C ancestral; C at 77.0 % in gnomAD's non-Finnish European genomes. C is
# the longer-telomere allele.
locus_id: 143
locus_name: NAF1
verdict: kept
verdict_reason: >-
  Tier A on the marker's own evidence (D37.12; the seed gives none): the tier grades the association with leukocyte
  telomere length, not longevity, and this row is unscored (D32). Li 2020's meta-analysis (78,592 Europeans of
  ENGAGE, EPIC-CVD and EPIC-InterAct, no UK Biobank) prints rs4691895 with C (EA) at 0.78, β +0.058 SD (SE 0.006), P
  1.58e-21. Codd 2021's 472,174 UK Biobank participants print the NAF1 locus at its sentinel rs4435700, A1 C at
  0.235, β −0.054 (−0.058 to −0.049), P 2.2e-112, N_imp 459,000, Europeans the same; rs4691895 sits in that locus's
  credible set (PP 0.11) and is in LD with the sentinel at r² 0.97 (D′ 1.00, CEU), the minor alleles travelling
  together (rs4691895 G 0.23, rs4435700 C 0.235), so Codd's shorter C is Li's G: the same side. D21's test: Li
  +0.058 (SE 0.006) against Codd −0.054 at the sentinel (SE about 0.0023), heterogeneity P 0.53, Li's power at
  Codd's effect 1.00: no red flag. A study of 100k or more, genome-wide, with an independent replication on the same
  allele: §4.1's A, the lead inside Codd's set (D38.5). Keener 2024's line (C +0.053, P 8e-53, the GWAS Catalog's
  record, its sample unread) agrees, named, not counted. Lifespan look-ups, unscored and read for C, two-sided at
  0.05 (D38.6): Timmers 2019 C beta1 −0.0065 (SE 0.0046), P 0.16; Pilling 2017's parents P 0.28 to 0.96; Park
  2025's own survival P 0.59 (men 0.73, women 0.19); Deelen 2019 90th P 0.77, 99th P 0.44; FinnGen R11's deaths P
  0.96, a database line; all flat. Zenin 2019's healthspan has C with the earlier end, +0.0131 (SE 0.0058), P 0.024;
  Foote 2025's poorer-cognition factor has C the frailer (G −0.0060, SE 0.0029, P 0.040), its general factor and
  factors 1 to 4 and 6 flat (P 0.21 to 0.82). The literature search (the rsID, 2026-11-16) finds the
  telomere-length GWASs, no test of lifespan. Every genotype neutral, each conclusion a tendency of the marker with
  no colour (D32, D37.12); `direction: unknown`. Outcome cells read for C: exceptional survival 0 (Deelen flat);
  lifespan 0 (Timmers, Pilling, Park and FinnGen flat); healthspan − (Zenin two-sided 0.024, C the earlier end;
  Foote's factor 5 the same side at 0.040; the side named, D38.6). Mechanism: markers of biological ageing; NAF1
  assembles the H/ACA ribonucleoproteins that include telomerase's RNA. No disease pleiotropy: the Catalog holds
  only telomere lines. Causal C2 (PP 0.11 in Codd 2021's own set; Open Targets' telomere sets hold it at PIP 0.05 to
  0.06). Effector E2, NAF1: locus-to-gene 0.82 on the telomere PC1 set (MARCHF1 0.09; 0.45 on Li's set); the
  missense is on a non-MANE transcript at PIP 0.11, so not E1. Descriptive. Age of action unknown. The evidence is
  European.
