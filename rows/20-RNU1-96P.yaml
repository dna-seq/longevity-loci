variants:
  - rsid: rs2643826
    gene: SLC4A7
    phenotype: SLC4A7 region, blood pressure, ageing
    trait_efo_id: EFO_0007796
    effect_allele: C
    effect_size: 0.0063
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA region (about 31 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. The region, on chromosome 3,
          lies near the SLC4A7 gene and is linked to blood pressure. A blood pressure reading your doctor can take shows your actual level, which matters far more
          than this DNA result. The finding comes from people of European ancestry; less is known elsewhere.
      - genotype: C/T
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 49 in 100 people of European
          ancestry do, the most common combination). In very large European studies that combined healthspan,
          long life and other measures of ageing, this version went with slightly less healthy ageing, and parents
          of carriers lived a little less long. The same version goes with slightly higher blood pressure. It is a
          likely finding, not a settled one: it has not yet been confirmed in a separate group of people. The
          effect is small and it is a tendency, not destiny. A blood pressure reading your doctor can take shows
          your actual level, which matters far more than this DNA result.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 20 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, long life and other measures of
          ageing, each copy went with slightly less healthy ageing, and parents of carriers lived a little less
          long. The same version goes with slightly higher blood pressure. It is a likely finding, not a settled
          one: it has not yet been confirmed in a separate group of people. The effect is small and it is a
          tendency, not destiny. A blood pressure reading your doctor can take shows your actual level, which
          matters far more than this DNA result.
