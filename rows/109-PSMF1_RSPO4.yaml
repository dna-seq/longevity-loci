# The seed list's locus 109, PSMF1/RSPO4 (20p13). Curated 2026-11-15. Lead rs113181552, the seed's only rsID
# (Beccacece 2026's Calabrian suggestive locus): an intron variant near RSPO4 and PSMF1, GRCh38 20:1,051,463 G/T,
# GRCh37 20:1,032,106, T at 1.35 % in the Calabrian sample and 4.3 % in gnomAD's non-Finnish genomes, the discovery's
# longer-lived allele. Open Targets 26.09 has no record of the variant under either allele order; the GWAS Catalog
# (2026-10-29) holds Beccacece's line alone.
locus_id: 109
locus_name: PSMF1/RSPO4
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's C: read against the reference, as D31.10 reads a discovery whose controls misfit it, the
  discovery shows no enrichment, and nothing independent passes. Beccacece 2026's exploratory GWAS of 705 Calabrians
  (299 long-lived cases and 406 younger controls from the ECHA and GEHA cohorts, a mixed model) gives T +2.241 (OR
  9.40), P 2.45e-6, one of its 22 suggestive loci, with T at 1.35 % across the sample. Every other sample has T near 3
  to 4 %: SICS 2.9 %, Deelen 4 %, Timmers 4.1 %, gnomAD's non-Finnish genomes 4.3 %. Solved from the OR and the counts,
  the controls carry about 2.5 copies in 812 alleles (0.3 %) where SICS's frequency expects about 23.5 (Poisson P 2e-8),
  and the cases about 16.5 copies in 598 (2.8 %) where it expects 17.3 (derived): the signal is the controls' deficit,
  and the long-lived sit at the reference. So the case-control Beta is named, not read (D31.10). The SICS replication
  (T −0.265, P 0.56) and Timmers' parents (T −0.0233 per self, P 0.028, "--") were tested against that Beta (SICS power
  1.00, heterogeneity P 1.4e-4, at half the effect power 0.79, the flag lapsing; Timmers flagged under every D25.3
  factor, the case ages unread); with the Beta unread, those flags have nothing to test and `replication_failed` is
  not carried, put to the lead. Deelen 2019's 90th percentile leans T's way (+0.191, SE 0.062, P 0.0021; 99th P 0.27),
  but Deelen holds GEHA Italy and the Calabrian sample comes from GEHA and ECHA, and neither paper separates them, so
  it is not independent (D19.1's last clause; as 130's CEPH): named, not counted, put to the lead. Pilling 2017's
  parents lean against T (both parents P 0.06, fathers 0.056), inside Timmers; FinnGen R11 flat (P 0.55), a database
  line; Park 2025 flat (P 0.79); Zenin 2019 flat; Foote 2025 holds no line; Wright 2019's four Table 8 lines 230 to 350
  kb away have no CEU pair with the lead and none is among its CEU variants at r² 0.5: AncestryDNA untested. Timmers'
  strongest line within 500 kb is P 2.8e-4. The literature search (the rsID, and PSMF1 or RSPO4 with longevity terms;
  Semantic Scholar 429) finds Beccacece alone. The abstract's intronic variant "confirmed by meta-analysis" is not
  this one: the paper's eQTL sheet holds no line for it (Table S1 annotates it intergenic, nearest RSPO4). Every
  genotype neutral (D25.2); outcome cells 0 (D28.10); the variant's direction unknown. Mechanism ageing in general
  (D25.7): PSMF1 is the seed's name for the locus, RSPO4 the paper's nearest gene; nothing recorded at the variant.
  Causal C4 and effector E4: no Open Targets record either way. Descriptive. Age of action unknown. The evidence is
  European.
