# The seed list's locus 109, PSMF1/RSPO4 (20p13). Curated 2026-11-15. Lead rs113181552, the seed's only rsID
# (Beccacece 2026's Calabrian suggestive locus): an intron variant near RSPO4 and PSMF1, GRCh38 20:1,051,463 G/T,
# GRCh37 20:1,032,106, T at 1.35 % in the Calabrian sample and 4.3 % in gnomAD's non-Finnish genomes, the discovery's
# longer-lived allele. Open Targets 26.09 has no record of the variant under either allele order; the GWAS Catalog
# (2026-10-29) holds Beccacece's line alone.
locus_id: 109
locus_name: PSMF1/RSPO4
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's C: a suggestive discovery that its own replication reverses at power (D25.1, D30.11), row
  62's shape, from the same paper. Beccacece 2026's exploratory GWAS of 705 Calabrians, long-lived cases against
  younger controls from the ECHA and GEHA cohorts in a mixed model, gives T +2.241 (OR 9.40; SE 0.476 from the P), P
  2.45e-6, one of its 22 suggestive loci; the unrelated subset agrees (OR 10.5, P 0.0053). Its SICS replication has T
  at 2.9 % with Beta −0.265, P 0.56, the opposite sign: one-sided power 1.00, heterogeneity P 1.4e-4, at half the
  effect 0.007, a D21 red flag. Timmers 2019's million parents' lives go the other way, nominally: T −0.0233 per self
  (SE 0.0106), P 0.028, "--"; carried there by D25.3's calibrations (the cases' ages unread, so the 99th and the 90th
  factors both), the discovery predicts +0.36 to +1.11, heterogeneity P 6.7e-7 to 1.5e-6, a red flag under every one.
  Nothing independent passes. Deelen 2019's 90th percentile leans T's way (+0.191, SE 0.062, P 0.0021, one-sided
  0.001; 99th P 0.27), but Deelen holds GEHA Italy and the Calabrian sample comes from GEHA and ECHA, so it is not
  independent as far as shown (as 130's CEPH): named, not counted; on the discovery's scale it is also twelve times
  smaller (heterogeneity P 1.9e-5). Pilling 2017's parents lean against T (both parents P 0.06, fathers 0.056; mothers
  and the top 10 % flat), inside Timmers; FinnGen R11's death endpoint flat (P 0.55), a database line; Park 2025's own
  survival flat (P 0.79); Zenin 2019's healthspan flat; Foote 2025 holds no line; Wright 2019's four Table 8 lines 230 to 350
  kb away tag nothing (Ensembl lists no CEU variant at r² 0.5 with the lead): AncestryDNA untested. Timmers' strongest line
  within 500 kb is P 2.8e-4: nothing suggestive. The literature search (the rsID, and PSMF1 or RSPO4 with longevity
  terms; Semantic Scholar answered 429, its part unchecked) finds Beccacece alone. Every genotype neutral (D25.2); outcome cells 0 (D28.10). Mechanism ageing in general (D25.7): the paper
  names PSMF1, a proteasome inhibitor, and RSPO4 as the nearest genes; the abstract's proteasome-related variant
  confirmed by meta-analysis is not shown to be this one. Causal C4 and effector E4: no Open Targets record either
  way. Descriptive. Age of action unknown. The evidence is European; the Calabrian frequency is a third of the
  non-Finnish reference.
