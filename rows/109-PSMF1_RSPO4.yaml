    effect_size: 0.1909
    effect_measure: beta
    stat_significance: nominal
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 92 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position lies near the PSMF1
          and RSPO4 genes on chromosome 20. One small Italian study linked the other version to reaching old age, but
          its own repeat study and a much larger study of a million parents' lives did not confirm it, so it is not
          counted for or against lifespan.
      - genotype: G/T
        state: neutral
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 8 in 100 people of European ancestry
          do). One small Italian study found it more often among long-lived people, but its own repeat study and a much
          larger study of a million parents' lives did not confirm it, so it is not counted for or against lifespan.
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 2 in 1,000 people of European
          ancestry do). One small Italian study found the version more often among long-lived people, but its own
          repeat study and a much larger study did not confirm it, so it is not counted for or against lifespan.
