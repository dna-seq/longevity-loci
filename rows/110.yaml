    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 92 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position lies between genes on
          chromosome 2. One study of long-lived people linked the other version to reaching old age, but its own checks
          and a much larger study of a million parents' lives did not confirm it, so it is not counted for or against
          lifespan.
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 8 in 100 people of European ancestry
          do). One study of long-lived people found it more often among them, but its own checks and a much larger study
          of a million parents' lives did not confirm it, so it is not counted for or against lifespan.
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 2 in 1,000 people of European
          ancestry do). One study of long-lived people found the version more often among them, but larger studies did
          not confirm it, so it is not counted for or against lifespan.
