# The seed list's locus 110, unnamed (2p21). Curated 2026-11-15. Lead rs116362179, the seed's only rsID (Deelen 2019's
# European 90th-percentile locus): intergenic, GRCh38 2:53,153,619 C/T, GRCh37 2:53,380,757, T 0.041 in gnomAD's
# non-Finnish Europeans and the discovery's longer-lived allele. Open Targets 26.09 has no record of the variant under
# either allele order; the GWAS Catalog (2026-10-29) holds no association.
locus_id: 110
locus_name: ""
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's C: a suggestive discovery that fails powered tests (D30.11, a fortiori of D25.1), row 1's
  shape. Deelen 2019's European meta-analysis of survival to the 90th percentile against all controls gives T (0.05)
  OR 1.34 (1.20 to 1.50), P 4.9e-7, I² 0 (Table 2); its deposit T +0.292 (SE 0.058), the 99th +0.290 (SE 0.095), P
  0.0021, the same cohorts' oldest; T's 0.05 agrees with gnomAD's 0.041. Deelen's own UK Biobank validations at the 90th
  are flat: parental longevity OR 1.01 (0.94 to 1.08), P 0.78; parental lifespan OR 1.00 (0.98 to 1.02), P 0.70; on the
  discovery's odds scale both powered (1.00) and in disagreement (heterogeneity P 3.3e-5 and 7.1e-7, derived), inside
  the parents Timmers pools. Timmers 2019's million parents' lives are flat and lean the other way: T −0.0039 per self
  (SE 0.0101), P 0.70, "--". Carried there by D25.3's two calibrations the discovery predicts T +0.060 (APOE's factor)
  or +0.145 (the loci's mean): power 1.00 under both, heterogeneity P 4e-5 and 1.1e-6 (at half the effect 0.0036 and
  1.4e-5), a D21 red flag under both. Nothing independent passes: FinnGen R11's death endpoint has T with fewer deaths,
  flat (P 0.20), a database line; Park 2025's own survival has T with more deaths (P 0.0075), against, UK Biobank;
  Pilling 2017 flat in every column (P 0.54 to 0.99); Zenin 2019's healthspan flat (P 0.31); Foote 2025 holds no line.
  Wright 2019's AncestryDNA lines near it, Table 8's rs785311 (351 kb, no CEU pair) and Table 9's rs10202079 (133 kb,
  inside the lead's window, where Ensembl lists no CEU variant at r² 0.5), tag nothing: untested. Timmers' strongest
  line within 500 kb is a rare variant at P 2.4e-4: nothing suggestive. The literature search (the rsID; Semantic
  Scholar answered 429, its part unchecked) finds Deelen and a German polygenic-score study, read only in its abstract,
  which reports scores, not single variants. Every genotype neutral (D25.2); outcome cells 0 (D28.10). Mechanism
  ageing in general (D25.7): intergenic, nothing recorded at the variant. Causal C4 and effector E4: no Open Targets
  record either way. Descriptive. Age of action unknown. The discovery and every test of it are European.
