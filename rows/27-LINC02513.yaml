variants:
  - rsid: rs17499404
    gene: ""
    phenotype: LINC02513 region, blood pressure, ageing
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: 0.0056
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of a version of this DNA region that about 30 in 100 people of European ancestry
          carry twice. The region, on chromosome 4, lies near a stretch of DNA that makes no protein (LINC02513) and is
          linked to blood pressure. In very large European studies that combined healthspan, long life and other
          measures of ageing, each copy of this version went with slightly healthier ageing, and parents of carriers
          lived a little longer. The same version goes with slightly lower blood pressure. It is a likely finding,
          not a settled one: it has not yet been confirmed in a separate group of people. The effect is small and it
          is a tendency, not destiny. A blood pressure reading your doctor can take shows your actual level, which
          matters far more than this DNA result.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy each of the two common versions of this DNA region, the most common combination (about
          50 in 100 people of European ancestry). It is the reference the other combinations are compared with. The
          region, on chromosome 4, lies near a stretch of DNA that makes no protein (LINC02513) and is linked to blood
          pressure and to healthy ageing. A blood pressure reading your doctor can take shows your actual level,
          which matters far more than this DNA result.
      - genotype: G/G
        state: risk
        conclusion: >-
          You carry two copies of a version of this DNA region that about 21 in 100 people of European ancestry
          carry twice. In very large European studies that combined healthspan, long life and other measures of
          ageing, each copy of this version went with slightly less healthy ageing, and parents of carriers lived a
          little less long. The same version goes with slightly higher blood pressure. It is a likely finding, not a
          settled one: it has not yet been confirmed in a separate group of people. The effect is small and it is a
          tendency, not destiny. A blood pressure reading your doctor can take shows your actual level, which
          matters far more than this DNA result.
