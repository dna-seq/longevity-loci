# The seed list's locus 27, LINC02513 (4p14). Curated 2026-11-11, the third ten-row run's fifth row. Lead rs17499404
# (4:38,383,858 in GRCh38, 4:38,385,479 in GRCh37; the seed's only rsID), G/A, A at 0.545 in Europeans and 0.42 in
# East Asians. Timmers 2020's multivariate LINC02513 locus (Table 1) and a novel lead of Rosoff 2023's mvAge
# (Supplementary Tables 6 and 7); in Timmers 2019's, Zenin 2019's and Deelen 2019's summary statistics at the lead
# itself; in Wright 2019's fathers' table through rs2291433 (r² 0.996). The blood-pressure SNPs rs2291435 (r² 0.996)
# and rs13104866 (r² 0.80) are the same signal and appear only in the notes.
locus_id: 27
locus_name: LINC02513
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: a genome-wide multivariate result with a co-occurring lifespan study (§4.5 as D16
  reads it), and no independent replication; a multivariate result does not meet tier A's first criterion (D18.3).
  The shape is row 20's. Genome-wide only in two multivariate analyses that share their inputs: Timmers 2020's test
  of healthspan, parental lifespan and 90th-percentile longevity (P 4e-8, A on the longer-lived side in all three
  columns) and Rosoff 2023's mvAge (G lowers the factor, P 3.6e-8, so A raises it; Rosoff lists it as novel).
  Timmers 2020 says no input reached genome-wide significance here alone, calls the locus near the threshold, and
  asks for replication in independent cohorts. Timmers 2019's million parents' lives are the co-occurring lifespan
  study: A lengthens life at P 0.0016, nominal, UK Biobank and LifeGen on the same side. The one test outside both
  analyses' inputs is AncestryDNA's fathers in Wright 2019, at rs2291433 (r² 0.996, its G with the lead's A): the
  same side, raw P 0.099, not significant, and in line with UK Biobank's arm (heterogeneity P 0.43), so no red flag.
  Four nearby SNPs in the same table are stronger in AncestryDNA (rs12646716, rs1487624, rs11732737, rs7668402, raw
  P down to 7e-4) but tag the lead only weakly (r² 0.29 to 0.40), so none stands for it.
  Healthspan agrees: A delays the end of healthspan in Zenin 2019 (P 7.3e-4, an input of both analyses). Foote
  2025's frailty multimorbidity factor is genome-wide at rs2291433 (P 3e-15, the lead's allele less frail), but that
  factor is defined partly by high mean arterial pressure, its set colocalises with blood pressure, and it draws on UK
  Biobank, so it is the blood-pressure signal again rather than separate healthspan evidence; healthspan-class
  in any case (D23), it cannot lift a lifespan tier (D17.1). Exceptional survival is +: Deelen 2019's
  summary statistics favour A at the 90th (P 1.3e-5) and the 99th percentile (P 3.8e-5, a subset of the 90th's
  cases), both inputs of the multivariate analyses, so neither replicates them.
  Mechanism: heart and vessels, through blood pressure. In Shi 2024's sets led by the variant itself A lowers
  systolic (P 7e-18) and diastolic pressure (P 1e-12), and the locus's other sets are almost all blood pressure and
  hypertension; Timmers 2020 says the life-extending allele near LINC02513 goes with less cardiovascular disease.
  That is association on one variant, not a mediator test. The locus also moves the share of lymphocytes in blood
  (P 4e-111; A raises it, phased through the set's lead rs6812640, r² 0.996), in a set that colocalises with blood
  pressure at H4 0.99, so the two are one signal; Timmers 2020
  finds ten trans genes in blood (LEF1, CCR7 and others, T-cell genes) raised by the life-extending allele and calls
  the region a possible regulator of age-related transcription. Which of these carries the effect on life is not
  known. Actionability is preventable: blood pressure is a measure a doctor takes, and the effect is cached at the
  lead. No trade-off is found (D18.1): A is on the lower-risk side for blood pressure and hypertension; it raises the
  lymphocyte share, which no cached source ties to harm. Causal and effector confidence are
  C4 and E4: no credible set of a lifespan-class study holds the variant in Open Targets 26.09, mvAge's and Timmers
  2020's own studies there have no set on 4p14, and no gene is named (§4.2). Locus-to-gene on Shi's systolic set led
  by the variant (PIP 0.080) and on the frailty and lymphocyte sets favours KLF3 (0.75 to 0.76), and Timmers 2020
  finds no cis gene. Whether Foote's frailty set, healthspan-class under D23, should count under the set rule (it
  would give a causal level from the lead's PIP 0.043 and KLF3 as effector) is put to the lead; C4/E4 meanwhile. A/G, the most common genotype, is
  the reference (§6.2), with no PROTECT token, the split too even (as at 21 and 24). Age of action is unknown:
  Timmers 2020's fading with parental age is collective across nine loci and not confirmed for any one. The evidence
  is European; A is common in East Asians too (0.42), untested there.
