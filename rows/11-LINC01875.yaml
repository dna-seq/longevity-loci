# The seed list's locus 11, LINC01875 (2p25.3, the TMEM18 obesity locus). Curated 2026-11-11, the second ten-row run's
# first row. Lead rs6744653 (the seed's lead, Timmers 2019's Table 2); the seed's second rsID, rs66906321 (1.5 kb away,
# r² 0.89, db-ensembl-116#q28), is Rosoff 2023's mvAge SNP and the stronger of the two in Timmers 2019's summary
# statistics, read as a proxy. Wright 2019's Supplemental Tables 8 and 9 hold three clumped SNPs within 30 kb:
# rs2867105 (r² 0.86 to the lead) read as a proxy; rs4640417 (r² 0.11) and rs10153797 (LD not returned by Ensembl)
# named, not scored. Open Targets 26.09 has no lifespan set holding either seed SNP; the GWAS Catalog (2026-10-29)
# holds one association for rs6744653 and nine for rs66906321.
locus_id: 11
locus_name: LINC01875
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it. Nothing at the lead itself is genome-wide: in Timmers 2019's million parental lives A,
  the minor allele (17 % in Europeans), adds 0.28 years per copy at a conventional P of 5.8e-8 (both arms on the same
  side); the paper calls TMEM18 genome-wide only through its BMI-informed Bayesian scan, whose P (7.0e-10) is not
  counted here. Its close proxy rs66906321 (r² 0.89, T riding with A) reaches 2.3e-8 in the same study's summary
  statistics, past both 5e-8 and the paper's own 2.5e-8, though the paper does not list it and its Methods give no
  filter that explains why; Rosoff 2023's mvAge, which pools the same parents, puts T on the healthier-ageing side at
  4e-8 (GWAS Catalog record; the paper's text does not list the SNP). The one independent sample replicates at a third
  SNP: in Wright 2019's AncestryDNA fathers rs2867105 (r² 0.86 to the lead, 0.77 to rs66906321; its minor allele
  riding with A, derived) goes with longer life (genomic-control P 2.2e-3, born 1886-1940; 6.2e-4, born 1886-1918),
  the mothers on the same side (P 0.058), with no heterogeneity against UK Biobank (P 0.18, 0.61). A's first condition
  fails (§4.1, D17.3, D18.3): at the lead, Timmers' own call is 5.8e-8 (the paper's P, not a summary-statistics proxy
  it never reports), and mvAge is a multivariate result, not one of the lifespan, longevity, parental-lifespan or
  healthspan phenotypes A names. B's clause for a replicated locus whose reported SNP is a tag fits besides: every
  genome-wide and replicating value sits at a proxy rather than the lead, no lifespan credible set exists to place the
  lead, the paper's own reading puts the locus below genome-wide in the conventional test, and the longevity look-ups
  are null on the same side (Timmers 2019's replication in Deelen 2014 and Broer 2015, P 0.41; Deelen 2019's 90th and
  99th percentiles, P 0.21 and 0.061). Healthspan is null (Zenin 2019, P 0.48 at the lead). Two other AncestryDNA SNPs
  lie within 30 kb. rs4640417 (r² 0.11 to the lead, D′ 1.00) carries the lead's A wholly on its own common A (derived
  from the frequencies), and its G shortens mothers' and fathers' lives (P 8.7e-5 and 5.5e-4): the same side, too
  weakly tied to the lead to count as a proxy. rs10153797 (fathers, P 9.2e-4) is unknown: Ensembl returned no LD with
  the lead, so its side is not read. The mechanism is metabolism, through body weight: Timmers 2019 names BMI as the
  risk factor, the catalog's extreme-obesity record has the common C raising obesity (OR 1.25), so T, the lifespan
  side, lowers it, and the lead sits in 510 credible sets in Open Targets: of the 100 read, about half are of body
  size and fat, the rest smoking, blood pressure, lipids, type 2 diabetes and joint disease among them. A trade-off is
  detected (D18.1): the same T, the lifespan side, lowers heel bone density (P 5e-10), and low bone density is an
  established risk factor for osteoporosis and fracture. The cancer record states an allele but no direction; four
  records (BMI, weight, waist, body fat) state no allele. As a trade-off the locus is descriptive, not modifiable
  through weight (§4.2, D18.2). Causal confidence is C4 (no set of the eight lifespan, healthspan, longevity and
  current-age studies holds either seed SNP); with no longevity set there is no locus-to-gene score, so effector E4
  and no gene named (§4.2), though the paper and the catalog map the region to TMEM18. The protection is a presence,
  the minor A. Age of action is mid-life, from age bands (DIRECT_WEAK): in Timmers 2019's Figure 5 source data the
  effect is gone at 80-90 in both parents (mothers 0.065 at 60-70, 0.050 at 70-80, 0.008 at 80-90; fathers 0.030,
  0.021, −0.0005), mothers' 80-90 band below their 60-80 mean at z 2.53 and fathers' at 1.38, though the age moderator
  does not pass (P 0.20); the sex moderator is nominal (P 0.015) and fails the paper's 5 % FDR (Q 0.28), so no
  sex_specific.
