variants:
  - rsid: rs6744653
    gene: ""
    phenotype: TMEM18 region, body weight
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: 0.2772
    effect_measure: beta
    stat_significance: suggestive
    direction: protective
    negatives: >-
      The longer-life version may also lower bone density a little (measured at the heel), and low bone density
      raises the risk of osteoporosis and fractures.
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 69 in 100). It is the reference the other combinations are compared with. The region, on
          chromosome 2, is linked to body weight; which gene in it matters is not known. The finding comes from
          people of European ancestry; less is known elsewhere.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 28 in 100 people of European
          ancestry do). In very large British, European and American studies, people with this version tended to
          have parents who lived a month or two longer. The same version goes with a lower chance of obesity, and may go with slightly lower bone density. It is a
          likely finding, not a settled one: studies of people reaching very old age did not clearly confirm it.
          The effect is small and it is a tendency, not destiny.
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 3 in 100 people of European
          ancestry do). In very large British, European and American studies, each copy went with parents living a
          month or two longer. The same version goes with a lower chance of obesity, and may go with slightly lower bone density. It is a likely finding, not a
          settled one: studies of people reaching very old age did not clearly confirm it. The effect is small and
          it is a tendency, not destiny.
