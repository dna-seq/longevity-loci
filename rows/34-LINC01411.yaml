    genotypes:
      - genotype: AT/AT
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA position, as about 45 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome 5,
          lies between genes. One study of long-lived people linked this position to reaching very old age, but its
          own checks and a much larger study of a million parents' lives did not confirm it, so it is not counted for
          or against lifespan.
      - genotype: A/AT
        state: neutral
        conclusion: >-
          You carry one copy of a shorter version of this DNA position (about 44 in 100 people of European ancestry
          do). One study of long-lived people linked this position to reaching very old age, but its own checks and a
          much larger study of a million parents' lives did not confirm it, so it is not counted for or against
          lifespan.
