# The seed list's locus 34, LINC01411 (5q35.2). Curated 2026-11-15. Lead rs138762279, the seed's only rsID (Deelen
# 2019's European 99th-percentile locus): a single-T deletion between LINC01411 and NSG2, GRCh38 5:174,283,195 T/-,
# GRCh37 5:173,710,197, Deelen's AT/A; which allele Deelen's printed AT is cannot be settled from its frequencies (the
# deletion 0.33 in gnomAD's non-Finnish Europeans; Deelen's discovery AT 0.16, its UK Biobank AT 0.34, Park's AT 0.66). Open Targets 26.09 has no record of the variant under either allele order;
# the GWAS Catalog (2026-10-29) holds Deelen's longevity association alone.
locus_id: 34
locus_name: LINC01411
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's C: a suggestive discovery that fails powered tests (D30.11, a fortiori of D25.1), rows 1 and
  22's shape, on an indel whose printed alleles do not hold. Deelen 2019's European meta-analysis of survival to the
  99th percentile against all controls gives AT OR 0.79 (0.72 to 0.86), P 1.2e-7, I² 0 (Table 2); trans-ethnic the
  same at P 2.2e-7; its deposit codes the deletion at 0.84, +0.241 (SE 0.045). The deletion is 0.33 in gnomAD's
  non-Finnish Europeans and 0.31 in 1000 Genomes EUR; Park 2025's UK Biobank file has AT at 0.66; Deelen's own UK
  Biobank validation prints AT at 0.34, the deletion's population frequency, not AT's. So which allele Deelen's AT is
  is unknown: reading (i), as printed, the deletion is the longer-lived allele; reading (ii), the labels swapped, AT
  is. The discovery cohorts' 0.84 (or 0.16) matches neither allele, consistent with poor imputation of the indel.
  Under either reading the discovery fails. Deelen's Table 3, UK Biobank's parents at the indel itself, per
  offspring allele against half the discovery's effect (−0.118): AT +0.049 (SE 0.053), power 0.72, heterogeneity P
  0.0039 as printed, 0.23 with Table 3's labels swapped (derived): short of D21's power, no flag either way. Within the same 99th-percentile file the best proxy, rs11952522 (r² 0.75 in CEU, its minor
  T with the minor deletion, the opposite phase capping r² near 0.17), gives T +0.053 (SE 0.036), P 0.14, where the
  indel's line, scaled to the proxy by r 0.87 (the row's own step), expects about +0.21 (heterogeneity P 0.003,
  derived). Timmers 2019 has no line at the indel; at rs11952522 (D29.3) flat, T +0.0028 per self, P 0.53; carried by
  D25.3's 99th calibrations and r, the discovery predicts ±0.034 (APOE's factor) or ±0.080 (the loci's mean): power
  1.00, heterogeneity P 6.5e-5 and 8.8e-7 under reading (i) (at half the effect 0.0098 and 2e-5), stronger under (ii):
  a D21 red flag either way, `replication_failed`. What passes depends on the reading. Under (i) nothing does: FinnGen
  R11 at the proxy T with slightly fewer deaths (P 0.24), a database line; Park's own survival the deletion with
  slightly more deaths (P 0.24); Zenin 2019's healthspan at the proxy T, the deletion's side, with an earlier end (P
  0.016), against. Under (ii) Zenin's line is the discovery's way, one-sided 0.008, the participants' own healthspan in
  UK Biobank, outside the parents Timmers pools, but a healthspan result replicates nothing on its own (D22.2; 130
  moved on Park's own deaths, a lifespan line): named, and the row is D under either reading. Pilling 2017's four deposits hold neither the indel nor its proxies, and no
  line in chr5 173.0 to 175.0 Mb; Wright 2019's AncestryDNA has no line within 500 kb: untested. Foote 2025 flat at
  the proxy (P 0.079 to 0.82), its general, F3 and F4 deposits in gaps there, untested; Rosoff 2023 holds no line.
  Timmers' strongest line within 500 kb is rs1905655, 303 kb away, P 2.4e-6, with no CEU pair to the lead or the proxy
  in Ensembl: named, a separate signal as far as shown. The literature search (the rsID, and NSG2 or LINC01411 with
  longevity terms; Semantic Scholar answered 429, its part unchecked) finds Deelen alone. Every genotype neutral
  (D25.2); outcome cells 0 (D28.10). The variant's direction is unknown (FORMATS). Mechanism ageing in general (D25.7):
  intergenic, between a long non-coding RNA and NSG2, nothing recorded at the variant. Causal C4 and effector E4: no
  Open Targets record either way. Descriptive. Age of action unknown. The discovery and every test of it are European.
