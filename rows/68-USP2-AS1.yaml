variants:
  - rsid: rs139137459
    gene: ""
    phenotype: USP2-AS1 region, parents' exceptional survival
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: 0.0906
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the usual version of this DNA region, as about 99 in 100 people of European
          ancestry do. It is the reference the rare version is compared with. The region, on chromosome 11, lies
          inside a non-coding gene, USP2-AS1, near the gene USP2; which gene matters, if any, is not known. The
          finding comes from people of European ancestry; less is known elsewhere.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of a rare version of this DNA region (fewer than 1 in 100 people of European ancestry
          do). In one large British study, people carrying it were more likely to have both parents live into
          their late eighties or nineties. The authors themselves called the result less certain, because the
          version is rare and it did not show up when parents' ages were analysed in other ways, and no other
          study has confirmed it. Treat it as an unconfirmed early finding.
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of a rare version of this DNA region, which is very uncommon (roughly 1 in 70,000
          people of European ancestry). In one large British study, each copy went with a higher chance of both
          parents living into their late eighties or nineties; nobody with two copies was studied on their own.
          The authors called the result less certain, and no other study has confirmed it. Treat it as an
          unconfirmed early finding.
