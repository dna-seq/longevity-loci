# The seed list's locus 68, USP2-AS1 (11q23.3). Curated 2026-11-12. Lead rs139137459 (the seed's only rsID), an
# intron of the lncRNA USP2-AS1 near USP2, A 0.4 % in non-Finnish Europeans and absent in East Asians, from Pilling
# 2017's analysis of both parents reaching the top 10 % of survival. Timmers 2019 tests the locus at rs151091095,
# 20 kb away, a weaker tag (r² at most about 0.47 by frequency), named, not scored.
locus_id: 68
locus_name: USP2-AS1
verdict: kept
verdict_reason: >-
  Tier B, the seed's. Genome-wide in one analysis of one study: Pilling 2017's binary GWAS of both parents
  reaching the top 10 % of survival in UK Biobank (7,182 participants whose mothers reached 90 and fathers 87,
  against 79,767 whose parents both died before 80), where the rare A raises the chance (G's β −0.0906 on the case
  indicator, P 2.7e-8; the GWAS Catalog's 3e-8 and its only association for the lead). The paper says it "just
  reached significance", was not significant in the continuous analyses (parents' attained age P 5.3e-3, its
  direction not printed), and that p < 5e-8 may not be rigorous enough for so rare a variant (q35, q36): a single
  genome-wide study, B by §4.1, with the authors' caveat carried. Nothing independent replicates it, and nothing
  powered contradicts it. Outside UK Biobank, FinnGen R11's any-death endpoint puts A on the fewer-deaths side, flat
  (P 0.75, one-sided 0.37, named from the database line); Timmers 2019 tests the locus in LifeGen without UK
  Biobank only at rs151091095, whose rare G rides with A (D′ 1 where seen, r² at most about 0.47 by frequency): G
  1.27 years longer, one-sided P 0.104, the same side, not nominal, at a tag the sheet's caption calls an r² > 0.95
  proxy and the frequencies say is not. The lead has no line in LifeGen's file, in Deelen 2019's percentile files
  or in Open Targets, and is too rare for Wright 2019's AncestryDNA tables (cut at 3e-3, pmid-31484785#q6): untested
  there. Within UK Biobank's own participants the two other looks split: Zenin 2019's healthspan puts A later (P
  0.021, one-sided 0.011), and Park 2025's own survival puts A with more deaths than expected (P 0.053, two-sided;
  the deposit's allele columns swapped, as at APOE). Neither is independent of the discovery's people; Park's lean
  is the participants' own deaths against their parents' longevity, short of nominal. No red flag can be scored:
  the discovery's β is on a binary case scale for parents with no published conversion to FinnGen's or Park's
  scale (D28.1), so it is unknown and sets no token (D26.3). No credible set and no QTL record: C4, E4, no gene;
  USP2-AS1 is the gene the variant sits in, USP2 the gene the paper names nearby, neither shown to act. General
  ageing, no other trait known; descriptive. The protection is a presence, the rare A (G ancestral); carriers are
  about 8 in 1,000 Europeans. Age of action unknown. Lifespan is 0: the participants' own survival leans against A
  and FinnGen is flat, while the parents' continuous P has no printed direction (D26.2 reads a cell one-sided).
