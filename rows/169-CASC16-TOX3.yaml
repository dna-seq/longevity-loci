  - rsid: rs4784227
    locus: {chrom: "16", start: 52565276, ref: C, cites: [db-ensembl-116#q1205]}
    gene: CASC16
    phenotype: CASC16–TOX3 region, healthspan
    trait_efo_id: EFO_0009762
    effect_allele: C
    effect_size: -0.032
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: protective
        conclusion: >-
          You carry two copies of the common C version of this DNA position (about 57 in 100 people of European
          ancestry do). In a very large British study, people with this version stayed free of major disease a little
          longer, per copy, mostly through fewer cancers; the same version goes with a lower risk of breast cancer. It
          is a likely finding, not a settled one: it has not been confirmed in a separate group of people. The effect is
          small and it is a tendency, not a guarantee.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of the common C version of this DNA position (about 37 in 100 people of European ancestry
          do). In a very large British study, people with this version stayed free of major disease a little longer,
          mostly through fewer cancers; the same version goes with a lower risk of breast cancer. It is a likely
          finding, not a settled one: it has not been confirmed in a separate group of people. The effect is small and
          it is a tendency, not a guarantee.
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the T version of this DNA position (about 6 in 100 people of European ancestry do).
          It is the reference the other combinations are compared with. The position lies between the CASC16 and TOX3
          genes on chromosome 16, a region known for breast cancer risk. The finding comes from people of European
          ancestry; less is known elsewhere.
