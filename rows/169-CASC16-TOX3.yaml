    trait_efo_id: EFO_0009762
    effect_allele: T
    effect_size: 0.032
    effect_measure: beta
    stat_significance: significant
    direction: risk
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common C version of this DNA position (about 57 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. The position lies between the
          CASC16 and TOX3 genes on chromosome 16, a region known for breast cancer risk. The finding comes from people
          of European ancestry; less is known elsewhere.
      - genotype: C/T
        state: risk
        conclusion: >-
          You carry one copy of the T version of this DNA position (about 37 in 100 people of European ancestry do). In
          a very large British study, people with this version developed a first major disease, mostly a cancer, a
          little earlier; the same version goes with a higher risk of breast cancer. It is an early finding: it was not
          seen in studies of how long people or their parents lived. The effect is small and it is a tendency, not
          destiny.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of the T version of this DNA position (about 6 in 100 people of European ancestry do).
          In a very large British study, people with this version developed a first major disease, mostly a cancer, a
          little earlier, per copy; the same version goes with a higher risk of breast cancer. It is an early finding:
          it was not seen in studies of how long people or their parents lived. The effect is small and it is a
          tendency, not destiny.
