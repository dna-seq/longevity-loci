# A second signal at the seed's locus 82, CASC16 (16q12.1), its own row under D25.6 and D39.14. Curated 2026-11-16.
# Lead rs4784227, the seed's second rsID at 82 (Zenin 2019's healthspan SNP, the TOX3/CASC16 breast-cancer variant):
# intronic, GRCh38 16:52,565,276 C/T (a multi-allelic site, C/A/T, the row meaning C/T), GRCh37 16:52,599,188, C
# ancestral; T at 24.2 % in gnomAD's non-Finnish European genomes. 28 kb from row 82's lead rs4783780, r² 0.330 in 1000
# Genomes EUR, its C with the lead's A. C is the healthier allele.
locus_id: 169
locus_name: CASC16-TOX3
second_signal_of: 82
verdict: kept
verdict_reason: >-
  Tier B (D39.18): genome-wide in one study, Zenin 2019's UK Biobank healthspan, T the earlier end, β +0.032, P
  3.02e-8 after genomic control (Table 2; 1.3e-8 before), cancer its only component that passes (P 2.2e-10). Zenin's
  own replication half, also UK Biobank, is short of nominal (β 0.018, P 0.078), and no sample outside UK Biobank
  passes once 82's lead is accounted for: a single unreplicated study. Independence (D39.14, D39.18): in Zenin's
  healthspan rs4784227 is the stronger line (Z 5.69 against 82's lead's 4.79 in the same file), so it is read at its
  marginal there; conditioned on it, 82's lead falls to 1.86 (derived), as row 82's prose says. The signals' own sets
  differ: Timmers 2020's set at 82's lead colocalises with none of rs4784227's breast-cancer sets (row 82). From 1000
  Genomes' phased EUR haplotypes C travels with the lead's longer-lived A (r +0.575, r² 0.330). Where 82's lead is the
  stronger line, rs4784227 is conditioned on it (D39.18): Timmers 2019's pooled parents C longer at the marginal (P
  0.029) but 0.12 after (P 0.91); Pilling 2017's both parents P 0.0058 (mothers 0.0038, fathers 0.55), 1.16 after (P
  0.25); Deelen 2019's 90th C's way, P 0.030 (99th 0.28), 0.72 after (P 0.47); FinnGen R11's deaths C fewer, P 0.042,
  0.54 after (P 0.59) (all derived; FinnGen at the EUR r, Finnish LD unread). Park 2025's own survival is flat (P 0.84;
  men 0.39, women 0.16). Outcome cells read for C: healthspan + (Zenin); lifespan 0 and exceptional survival 0, every
  lifespan and longevity line the lead's shadow once conditioned (Pilling's top 10 % flat, P 0.13). Mechanism general
  ageing, as cancer carries the healthspan signal: T raises breast cancer (Open Targets' set, β +0.23, P 9.5e-47, PIP
  0.87) and systolic blood pressure (+0.011, P 1.2e-9), so `mech:cancer` and `mech:cvd`, the healthier allele C the
  lower on each, no `tradeoff`; more breast-cancer, pressure and brain-imaging sets named. A healthspan signal carried
  by breast cancer likely sits in women, but no sex-split line is read, so no token. Causal C4 (D39.12: none of Open
  Targets' 83 sets is of the row's phenotype, and Zenin sets none). Effector E4: intronic between CASC16 and TOX3, with a
  TOX3 splicing set in Open Targets; no set of the row's phenotype, no colocalisation read. The literature search (the
  rsID with lifespan, longevity, healthspan or mortality, 2026-11-16; Semantic Scholar answered 429, its part
  unchecked) finds breast-cancer studies: Xu 2022's meta-analysis (PMID 36042591; T against C, OR 1.24, in its
  abstract), and Sun 2020 (PMID 31655495), a northwest Chinese case-control study whose abstract puts T with lymph-node
  metastasis; named, abstract only, the same side as the Open Targets set, no lifespan claim. Descriptive. Age of action
  unknown. The evidence is European.
