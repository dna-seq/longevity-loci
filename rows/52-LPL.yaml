# The seed list's locus 52, LPL (8p21.3). Curated 2026-11-11. Lead rs268 (the seed's lead), LPL's missense variant
# Asn318Ser in Ensembl's numbering (GRCh38 8:19,956,018 A/G, GRCh37 8:19,813,529), G the rare allele (0.019 in non-Finnish
# Europeans, absent in East Asians), Rosoff 2023's novel mvAge lead. The seed's second rsID, rs15285 (LPL's 3′ UTR,
# 11 kb away, T 0.29), is a separate signal: allele frequencies cap r² below 0.05, Ensembl returns no pair, and
# Aragam 2022's coronary disease fine-mapping puts the two in separate sets. It is Wright 2019's genome-wide fathers'
# locus; named in prose here and sent to the scout's queue as a candidate row (D25.6, as 37's rs3131621). Open
# Targets 26.09: 507 credible sets hold rs268, none of a scoring class; the GWAS Catalog (2026-10-29) holds 101
# associations for it. Timmers 2019, Zenin 2019, Deelen 2019 and FinnGen R11's death endpoint read at both SNPs.
locus_id: 52
locus_name: LPL
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: genome-wide only in a multivariate result, with a co-occurring lifespan study (D16,
  D18.3), and not replicated outside its inputs. Rosoff 2023's mvAge is genome-wide at rs268, A (the common allele)
  on the healthier-ageing side, β +0.024 (SE 0.0044), P 3.4e-8, novel, heterogeneity across its five inputs Q P 0.87
  (Table 1, Supplementary Tables 6 and 7). Its inputs all lean to A: Timmers 2019's million parents' lives, A longer,
  P 5.5e-6 (suggestive, the strongest SNP within 300 kb, nothing there genome-wide), the co-occurring lifespan study;
  Zenin 2019's healthspan, A healthier, P 0.0015; frailty (reverse coded) P 0.0026, read only in Rosoff's table, so
  named. Nothing replicates and nothing contradicts: Deelen 2019, itself an mvAge input (its numbers are Rosoff's exceptional longevity column), is flat (90th percentile P 0.75,
  99th 0.83). Calibrated from Timmers' β as row 25 is (D25.3), the 90th percentile is a flag under APOE's factor
  (expected OR 1.37 per A, power 0.99, heterogeneity P 0.006 with both SEs) and none under the loci's mean factor
  (OR 1.14, power 0.50, P 0.21): one calibration only, so no D21 red flag. And FinnGen's death endpoint leans to A (G β +0.015, SE 0.025, one-sided 0.27): under APOE's
  within-FinnGen factor the expected size gives power 0.84 but heterogeneity P 0.080 with both SEs, under Figure 4's
  mean factor power 0.29, P 0.63, so no D21 red flag. The seed's second rsID, rs15285, is another signal (r² below
  0.05 from the two frequencies; Aragam's coronary disease study fine-maps rs268 alone in one set at PIP 0.996
  and rs15285 in a separate 25-variant set). It carries the locus's only lifespan-class genome-wide result: Wright
  2019's fathers' meta-analysis, P 8.5e-10, T longer-lived (AncestryDNA P 2.4e-5 inside the pooled P, UK Biobank
  1.2e-7); Timmers P 3.5e-5, Deelen's 90th one-sided 0.065, FinnGen one-sided 0.16 lean the same way, none
  replicates. Its evidence is not this row's: by D25.6 it goes to the scout's queue, and the row's cells rest on rs268
  alone. Healthspan + (Zenin, nominal), lifespan + (Timmers, P 5.5e-6), exceptional survival 0 (Deelen flat, a
  test that under APOE's calibration should have seen the effect and under the mean factor had even odds). Mechanism heart and vessels: G raises triglycerides (P 6e-166),
  lowers HDL cholesterol (P 7e-220) and raises coronary disease (A's OR 0.876, P 4e-11, Aragam 2022); Wright reads LPL as acting through cardiovascular
  disease, said of rs15285's signal and not cited here. Broad: blood-cell measures (haematocrit, cell width, platelets),
  liver-fat disease, statin use, apolipoproteins. No trade-off: none of the 101 Catalog records puts a harm on A's
  side. Descriptive: the measure it moves, triglycerides, is not one of §4.2's tests (LDL, Lp(a), blood pressure,
  HbA1c), and the row does not stretch `act_test:ldl` to it (D27.5; a triglyceride test waits for a design pass). Causal C1: rs268 is a missense variant
  and the lead of mvAge's own fine-mapping, SuSiE posterior 0.957 (FINEMAP 0.654), the scoring-class set the tier
  rests on; Open Targets has no mvAge set here, so C1 rests on the paper's own fine-mapping alone, a first for these
  rows (the lipid and coronary disease sets at PIP near 1 are not scoring class, D17.2). Effector E1, LPL: the variant changes LPL's protein, asparagine 318 to serine (VEP; SIFT and PolyPhen call it
  tolerated and benign, so the effect is read from the association data), §4.2's coding clause; L2G agrees (0.99) in the lipid and coronary disease sets. Triglycerides are the mediator Rosoff names for rs268 (its MR with LPL-locus instruments). A/A, about 96 in 100
  Europeans, is the reference; G is the risk allele at a disease locus (coronary disease), so `PROTECT:ABSENCE_OF_RISK` (D26.5). Age of
  action unknown: no moderator or age-band result at LPL is cached. The evidence and the variant are European (G
  absent in East Asians, 0.003 in Africans).
