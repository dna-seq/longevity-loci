variants:
  - rsid: rs268
    gene: LPL
    phenotype: LPL Asn318Ser, triglycerides, coronary disease
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: 0.0244
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the usual version of this spot in the gene LPL on chromosome 8, as about 96 in 100
          people of European ancestry do. LPL makes an enzyme that clears fat (triglycerides) from the blood. This is
          the reference the other combinations are compared with: you do not carry the rarer version that changes the
          enzyme and goes with higher blood fats and more heart disease.
      - genotype: A/G
        state: risk
        conclusion: >-
          You carry one copy of a rarer version of this spot in the gene LPL on chromosome 8 (about 4 in 100 people of
          European ancestry do). It changes one building block of the LPL enzyme, which clears fat (triglycerides)
          from the blood, and it goes with higher triglycerides, lower "good" HDL cholesterol and a somewhat higher
          chance of coronary heart disease. In very large European studies it also went with slightly less healthy
          ageing and parents living a little less long. It is a likely finding, not a settled one, and the effect is
          small: a tendency, not destiny. The finding comes from people of European ancestry; this version is
          almost absent elsewhere.
      - genotype: G/G
        state: risk
        conclusion: >-
          You carry two copies of a rare version of this spot in the gene LPL on chromosome 8 (about 3 in 10,000
          people of European ancestry do). It changes one building block of the LPL enzyme, which clears fat
          (triglycerides) from the blood; each copy goes with higher triglycerides, lower "good" HDL cholesterol and
          a somewhat higher chance of coronary heart disease. In very large European studies each copy also went
          with slightly less healthy ageing and parents living a little less long. Too few people carry two copies
          to say what two copies do beyond that. It is a likely finding, not a settled one: a tendency, not
          destiny.
