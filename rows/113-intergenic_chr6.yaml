# The seed list's locus 113, "intergenic chr6" (6p25.1). Curated 2026-11-15. Lead rs12189947, the seed's only rsID
# (Hsieh 2026's Taiwanese suggestive locus at 90 and over): intronic in a lncRNA, GRCh38 6:4,330,371 G/A, GRCh37
# 6:4,330,605, A 0.21 to 0.22 in East Asians and Europeans alike, the discovery's shorter-lived allele (G the seed's
# pro allele). Open Targets 26.09 holds it in three monocyte and macrophage expression-QTL sets of a novel lncRNA, none
# lifespan-class; the GWAS Catalog (2026-10-29) holds no association.
locus_id: 113
locus_name: intergenic chr6
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's C: a sub-genome-wide East Asian discovery that powered European samples tagging the same
  haplotype contradict (D22.3, as row 72; D21's red flag under both of D25.3's calibrations). Hsieh 2026 compared 922
  Taiwanese hospital patients who died at 90 or over with 871 who died at 65 to 75 at the same hospital: A (0.201) OR
  0.63 per A, P 8.7e-6, under the paper's suggestive line of 1e-5. Solved from the OR and the counts, the controls
  carry A at about 0.24 and the long-lived at about 0.165, against 0.206 to 0.223 in East Asian references (derived;
  the line prints five of its six reference cells, which one is missing unsettled): the controls sit a little high (P
  6e-4 against gnomAD's East Asians, 0.11 against 1000 Genomes'), and the long-lived well below either. Read against
  the references (D31.10) the long-lived alone give A OR 0.76 or 0.69, P 1.6e-5 or 2.6e-9, so the signal is theirs,
  and every test below fails at that size too (derived). Its validation cohort, 844 people aged 85 and over from a
  second hospital analysed the same way, gives OR 0.517 at 90 and over, P 1e-4, the same direction. The paper does not
  say who its controls were, but Fig. 2 sets both cohorts' case groups against controls aged 65 to 75, and the
  validation cohort holds only people aged 85 and over, so its controls are not its own; most likely they are the
  discovery's, unstated, and the validation is not counted as an independent replication (D19.1; put to the lead).
  Pooled with the discovery it would reach P 5.9e-9 (derived), row 72's genome-wide shape, still D under D22.3. The
  Europeans tag the same block: rs9392582, rs9405724 and rs4959941 sit at r² 0.94 to 0.97 with the lead in CEU
  (nineteen partners there) and 1.00 in CHB, no CHB partner at r² 0.8 is missing from CEU's list, and A has the same
  frequency. Deelen 2019, at the lead itself (its A at 0.17, a little under the 0.21 elsewhere): 90th percentile A
  +0.044 (SE 0.028), P 0.11; 99th +0.106 (SE 0.044), P 0.016, A longer-lived, one-sided 0.008 against; set against the
  discovery's log OR (−0.462, SE 0.104) heterogeneity P 2.5e-6 and 4.7e-7, power 1.00 (derived). Timmers 2019 holds no
  line at the lead; at rs9392582 (r² 0.97, T with A) flat, T −0.0014 per self (SE 0.0048), P 0.76. Carried there by
  D25.3's 90th-percentile calibrations and r, the discovery predicts A −0.094 (APOE's factor) or −0.225 (the loci's
  mean): power 1.00, heterogeneity P 1.9e-5 and 1.1e-5 (at half the effect 8.5e-5 and 1.6e-5; from the reference read,
  OR 0.76, 8.3e-5 and 2.5e-5), a D21 red flag under both, `replication_failed`. The calibration is approximate here:
  Hsieh's contrast is dying at 90 or over against dying at 65 to 75, not Deelen's 90th percentile against all
  controls, and short-lived controls inflate the OR; the flag holds down to 0.15 of the APOE-calibrated effect (power
  0.90, heterogeneity P 0.027) and to 0.1 under the mean factor (P 0.0024, derived). Outside Timmers: Park 2025's own
  survival has A with fewer deaths, P 0.07, one-sided 0.035 against (columns swapped, as at APOE; UK Biobank); FinnGen
  R11's death endpoint A with slightly more deaths, flat (P 0.64), a database line; Pilling 2017 flat at rs9392582 (P
  0.56 to 0.80, inside Timmers); Zenin 2019's healthspan flat, A a little healthier (P 0.32); Foote 2025 flat at
  rs9392582 (P 0.17 to 0.86). Wright 2019's one line within 500 kb, rs7767658 (390 kb), has no CEU pair: AncestryDNA
  untested. Timmers' strongest line within 500 kb is P 0.0020, Deelen's 0.0013: nothing suggestive. The literature
  search finds nothing: the rsID in every source (Semantic Scholar answered 429, its part unchecked), and Taiwanese
  and Han Chinese longevity GWAS since 2025; Hsieh is found by its PMID. One paper cites Hsieh, a Finnish polygenic
  lifespan score, with no single-variant test. The claim is Taiwanese and its replication there not independent; the
  European null is on the same haplotype at the same frequency, so the row is D, not ancestry-specific, and the
  ancestry is named here, not as a context token (D30.15); how Taiwanese loci are shown waits on D7. Every genotype
  neutral (D25.2). Exceptional survival − (D28.3, D28.10: Deelen's 99th one-sided 0.008 against, and a D row's
  discovery gives no +); lifespan − (Park one-sided 0.035 against, nothing for); healthspan 0. Mechanism ageing in
  general (D25.7): intronic in a lncRNA, A raising a nearby novel lncRNA's expression in stimulated monocytes, named,
  no route shown; the nearest protein-coding gene, ECI2, lies about 195 kb away. Causal C4 and effector E4: no
  lifespan-class set. Descriptive. Age of action unknown.
