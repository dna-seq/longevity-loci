variants:
  - rsid: rs12189947
    gene: ""
    phenotype: 6p25.1 intergenic lncRNA, longevity, Taiwanese
    trait_efo_id: OBA_VT0005372
    effect_allele: G
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 6 in 10 people of East Asian or
          European ancestry do. It is the reference the other combinations are compared with. The position lies
          between genes on chromosome 6. One Taiwanese study linked the other version to dying younger, but large
          European studies of the same stretch of DNA found no such link, and one leaned the other way, so it is not
          counted for or against lifespan.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 1 in 3 people of East Asian or
          European ancestry do). One Taiwanese study found it less often among people who lived past 90, but large
          European studies did not confirm it, and one leaned the other way, so it is not counted for or against
          lifespan.
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 5 in 100 people of East Asian or
          European ancestry do). One Taiwanese study found the version less often among people who lived past 90, but
          large European studies did not confirm it, so it is not counted for or against lifespan.
