# The seed list's locus 140, FLCN (17p11.2). Curated 2026-11-16. Lead rs41419545, the seed's only rsID (Kolbe 2025's
# German exome study): missense in FLCN, alanine 445 to threonine on the MANE Select transcript ENST00000285071
# (NM_144997.7), GRCh38 17:17,215,284 C/T (multi-allelic, C/A/G/T), GRCh37 17:17,118,598. T, the rare allele, is at
# 0.318 % in gnomAD's non-Finnish European exomes and 0.334 % in its genomes, and is the discovery's longer-lived side.
# Open Targets 26.09 has no credible set at it; the GWAS Catalog (2026-10-29) holds no association.
locus_id: 140
locus_name: FLCN
verdict: kept
verdict_reason: >-
  Tier C, the seed's: a sub-genome-wide discovery in one sample, old against young (R-TIER-2, R-TIER-4), unreplicated
  (§4.1's C). Kolbe 2025 sequenced the exomes of 1,245 German long-lived individuals (past the 95th age-at-death
  percentile of their birth cohort) and 4,105 younger controls; T was at 0.72 % among the long-lived and 0.17 % among
  the controls, OR 4.2 (Haldane-corrected), P 1.9e-6, FDR-adjusted 0.036 under the paper's exploratory false-discovery
  rate of 0.05, its own exome-wide call, not a genome-wide one (D31.13). On 2,490 and 8,210 alleles that is about 18
  copies against 14. The controls sit well under the reference D31.13 fixes, gnomAD's non-Finnish European exomes
  (0.318 %: 26.1 expected, 14 seen, Fisher's exact on both counts one-sided P 0.0074, D37.1, db-ensembl-116#q1150 to q1155), as Kolbe's pooled controls do (D34.7), so the row reads the long-lived
  against the reference, as 107: 18 copies where 7.9 are expected, OR 2.28, Fisher one-sided P 0.0014 (derived), the
  paper's own OR against gnomAD (2.28), which back-solves to the exomes' frequency (0.318 %); against the genomes (8.3
  expected) OR 2.18, P 0.0030 (Poisson 0.0024 before). The printed 4.2 is named, not read. Kolbe chose its hits from about 98,000 rare
  variants, so a reference OR still carries that selection, uncorrected (D34.14). The authors note gnomAD's
  non-Finnish Europeans are mostly British. By the printed percentages and the long-lived's 2.7:1 women to men, about
  8 copies in 336 men (2.1 expected from gnomAD, P 0.0016) and 10 in 909 women (5.8 expected, P 0.069) (derived): the
  men's share (8 of 18) is above their 27 % of the long-lived, as across Kolbe's rows (D34.7, D34.14), named, no
  token. The gene-based FLCN mask is this variant's signal (q23). Look-ups in the paper go the same way, short of
  nominal: the Ashkenazi sample 3 long-lived copies against none (OR 6.76, P 0.178, read as printed, as row 120's Q1
  (a) settled), and the Leiden sample 2 against none, no test printed. Park 2025's UK Biobank own-survival deposits
  hold it (each with its columns swapped): the whole cohort puts T with more deaths, +0.0153 (SE 0.0098), P 0.12,
  one-sided 0.059 against; the men flat (P 0.53); the women against, +0.0377 (SE 0.0116), P 0.0011, the two sexes differing at P 0.018 on the residual's scale and
  about 0.004 on a common hazard scale (the residual's β scales with the sex's cumulative hazard, about 1.71 times
  higher in men here; derived), a stratum picked after the fact, named, no token (D35.5). The two studies' sex
  patterns agree: Kolbe's men carry the excess (above), and Park's men lean T's way (P 0.53) while its women go
  against. Carried to
  Park's scale by Kolbe's own APOE line (ε4 OR 0.45 against Park's ε4 β 0.0129, D31.12), the reference read expects
  −0.0133 (power 0.39, heterogeneity P 0.0064) and the printed OR 4.2 expects −0.0232 (power 0.76, heterogeneity P
  6.8e-4), and on the women's own excess (10 against 5.8) the women's line has power 0.19 (heterogeneity P 2.4e-4)
  (all derived): stated figures only, since a Park test calibrated from APOE alone flags nothing at any power
  (D31.13). UK Biobank's imputed deposits put T at 0.18 % (Park's and Pilling's lines; Kolbe's controls 0.17 %) against gnomAD's sequenced 0.32 %: read as imputation under-calling (D35.6), since Kolbe notes gnomAD's non-Finnish Europeans are mostly British (q12); gnomAD v4's own release names 416,555 UK Biobank exomes among its 730,947 (db-gnomad-4#q1, q2), and Ensembl 116's
  non-Finnish European exome total, derived from its allele counts, is about 556,000 people, so UK Biobank's exomes
  are most of that group (up to 75 %; how many fall outside it is not printed), and the deposits impute largely the
  same people the reference sequenced: under-calling, stated (D35.6). Neither deposit prints an imputation-quality
  value (Park's columns, pmid-40021682#q28; Pilling's header, pmid-29227965#q187); the deposits' lines here are weak
  looks, and D34.7's premise stands. D35.6 can be shown, not only assumed: gnomAD v4's genomes are v3.1.2's,
  released before UK Biobank entered and kept apart from the exomes (db-gnomad-4#q3, q4), and give T 0.334 % (db-ensembl-116#q902);
  if the quarter of the non-Finnish European exomes outside UK Biobank sat at that, UK Biobank's own sequenced
  frequency backs out at about 0.31 %, while the imputed 0.18 % would need the rest at about 0.73 %, twice the
  genomes (derived). The imputed 0.18 % is one measurement, not two (Park and Pilling use the same UK Biobank
  genotypes), and the strongest counter-fact is named: Kolbe's sequenced German controls sit at 0.17 %. Whether that
  is under-calling or the imputation prior pulling toward the panel, it is an artefact of imputation either way. FinnGen R11's deaths put T with fewer deaths, flat (P 0.83; T at 0.08 % in Finns), a database line (D29.1); Pilling 2017's four
  parental scans flat (P 0.56 to 0.91); Timmers 2019, Zenin 2019, Foote 2025 and Deelen 2019 hold no line at it
  (untested), Deelen's strongest window lines (the 90th's 17:17,103,590 at 0.03, P 0.0089; the 99th's 17:17,325,902
  at 0.31, P 0.0012) too common to tag it; Wright 2019's strongest line within 500 kb, the current-age scan's
  rs4985696 115 kb away (P 1.9e-4), is common and cannot tag it, and nothing is listed at the lead under its P 0.003
  cut (unknown above it). The literature search (the rsID with FLCN and longevity, 2026-11-16;
  Semantic Scholar and the preprint index answered 429, their part unchecked) finds Kolbe alone on the variant, and
  Gharbi 2013 (PMID 23566034), where losing folliculin lengthens a worm's life, an animal result, named, not carried. Exceptional survival +
  (the reference read, P 0.0014, D34.7); lifespan 0 (Park's whole cohort leans against at one-sided 0.059, short of
  D28.3's 0.05; FinnGen and Pilling flat; Park's women against at P 0.0011, a sex stratum, named, D35.5); healthspan untested (no Zenin or Foote line). Mechanism ageing in general (D25.7): the authors propose that
  FLCN, which with SIK3 positively regulates mTORC1, carries a protein change that may lower mTORC1 signalling;
  nothing recorded at the variant. Causal C4: no Open Targets set. Effector E1, FLCN, by §4.2's coding clause on the
  MANE transcript (A445T; SIFT tolerated, PolyPhen benign, CADD 2.0). Descriptive. Age of action unknown. The
  evidence is European.
