variants:
  - rsid: rs41419545
    locus: {chrom: "17", start: 17215284, ref: C, cites: [db-ensembl-116#q900]}  # rs41419545 is multi-allelic (C/A/G/T); the row means C>T
    gene: FLCN
    phenotype: FLCN A445T, longevity
    trait_efo_id: OBA_VT0005372
    effect_allele: T
    effect_size: 2.28
    effect_measure: OR
    stat_significance: nominal
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as nearly everyone does. It is the
          reference the other combinations are compared with. The position lies in the FLCN gene on chromosome 17.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of a rare version of this DNA position (about 1 in 160 people of European ancestry carry
          it). It changes one building block of the FLCN protein, which helps control a cell-growth signal linked to
          ageing. One German study found it about twice as often among very long-lived people as the wider European
          population would lead one to expect. It has not been confirmed, and a large UK study did not see it with
          longer lives, so this is weak, early evidence: a possible tendency, not destiny.
      - genotype: T/T
        state: protective
        conclusion: >-
          You carry two copies of a rare version of this DNA position, which is very unusual; the one study of it found
          no one with two copies. One German study found single copies more often among very long-lived people, a
          finding not yet confirmed, so nothing can be said about two copies.
