# The seed list's locus 160, STN1/OBFC1 (10q24.33): a marker of biological ageing (D32, D36.3), curated on D37.12 with
# 23 TERC as the pattern. Curated 2026-11-16. Lead rs9419958, the seed's rsID (Li 2020's STN1 telomere-length lead):
# intronic in STN1's MANE transcript, GRCh38 10:103,916,188, GRCh37 10:105,675,946, multi-allelic T/A/C/G, the row
# meaning C/T; T at 14.2 % in gnomAD's non-Finnish European genomes. T is the longer-telomere allele.
locus_id: 160
locus_name: STN1/OBFC1
verdict: kept
verdict_reason: >-
  Tier A on the marker's own evidence (D37.12; the seed gives none), tiered from the seed's study, Li 2020 (D37.11,
  D39.1): the tier grades the association with leukocyte telomere length, not longevity, and this row is unscored
  (D32). Li 2020's meta-analysis (78,592 Europeans of ENGAGE, EPIC-CVD and EPIC-InterAct, no UK Biobank) prints
  rs9419958 with C (EA) at 0.86, β −0.064 SD (SE 0.007), P 5.05e-19: T longer. Codd 2021's 472,174 UK Biobank
  participants print it as locus 67's second conditionally independent sentinel (beside rs10748858, r² 0.08), A1 T
  at 0.139, marginal β +0.081 (0.075 to 0.087), P 2.6e-167, N_imp 463,885, joint +0.068, Europeans the same: the same
  allele and side, an independent genome-wide replication. D21's test, marginal against marginal: Li +0.064 for T
  (SE 0.007) against Codd +0.081 (SE about 0.0031), heterogeneity P 0.026, Codd's power at Li's effect 1.00. The
  replication is the larger, so §4.1's "replication with a much smaller effect" does not apply: a discovery smaller
  than its replication is no shrinkage (D39.1). §4.1's A. Mangino 2012's line (T +0.083, P 9e-11, the GWAS Catalog's
  record, its sample unread) agrees, named, not counted. Lifespan look-ups, unscored and read for T, two-sided at
  0.05 (D38.6): Timmers 2019 T beta1 −0.0060 (SE 0.0057), P 0.29; Pilling 2017's parents P 0.061 to 0.97; Park 2025's
  own survival P 0.17 (men 0.85; women T with more deaths, P 0.019, a stratum, D38.8); Deelen 2019 90th P 0.69,
  99th P 0.49; FinnGen R11's deaths P 0.89, a database line; all flat. Zenin 2019's healthspan has T with the
  earlier end (C −0.0308, SE 0.0073, P 2.1e-5). Foote 2025's deposits hold no line (untested). The literature search
  (the rsID, 2026-11-16) finds the telomere-length and cancer GWASs, no test of lifespan. Every genotype neutral,
  each conclusion a tendency of the marker with no colour (D32, D37.12); `direction: unknown`. Outcome cells read for
  T: exceptional survival 0 (Deelen flat); lifespan 0 (Timmers, Pilling, Park and FinnGen flat; Park's women a
  stratum); healthspan − (Zenin two-sided 2.1e-5, T the earlier end, the side named, D38.6). Mechanism: markers of
  biological ageing; STN1 is part of the CST complex that fills in the telomere's lagging strand. Pleiotropy
  `mech:cancer`: T, the longer-telomere allele, raises thyroid cancer (Open Targets, C −0.20, P 1.7e-28) and basal
  cell carcinoma (C OR 0.938, P 4e-10), and uterine fibroids (T OR 1.1, P 1e-16), named; no `tradeoff`, the row
  naming no longevity-favoured allele. Causal C2 (PP 0.43 in Codd 2021's set; PIP 0.39 in the telomere PC1 set and
  0.36 in Li's). Effector E2, STN1: locus-to-gene 0.89 on the PC1 set (SH3PXD2A 0.05) and 0.87 on Li's, the variant
  intronic in STN1. Descriptive. Age of action unknown. The evidence is European.
