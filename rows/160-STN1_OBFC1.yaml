    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common C version of this DNA position (about 74 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. The position lies inside STN1, a
          gene for a protein that helps copy and cap the telomeres, the protective ends of chromosomes. Telomere length
          is a marker whose reading only means something against your calendar age, which this report does not have,
          so this result carries no score.
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of the T version of this DNA position (about 24 in 100 people of European ancestry do).
          Large studies link it with slightly longer telomeres in white blood cells, under a tenth of the usual spread
          between people. That is a tendency in a marker whose reading only means something against your calendar age,
          which this report does not have, so it carries no score.
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the T version of this DNA position (about 2 in 100 people of European ancestry do).
          Each copy is linked in large studies with slightly longer telomeres in white blood cells. That is a tendency
          in a marker whose reading only means something against your calendar age, which this report does not have,
          so it carries no score.
