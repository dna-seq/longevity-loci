  - rsid: rs117082375
    locus: {chrom: "7", start: 14117491, ref: A, cites: [db-ensembl-116#q943]}  # A is the reference and the longer-lived allele
    gene: ""
    phenotype: 7p21.1 intergenic, longevity, Taiwanese
    trait_efo_id: OBA_VT0005372
    effect_allele: A
    effect_size: 1.80
    effect_measure: OR
    stat_significance: nominal
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (nearly everyone of European ancestry, and
          about 97 in 100 people of East Asian ancestry, do). It is the reference the other combinations are compared
          with. The position lies between genes on chromosome 7.
      - genotype: A/T
        state: risk
        conclusion: >-
          You carry one copy of a version of this DNA position found mainly in people of East Asian ancestry (about 3
          in 100 carry it, and almost no one elsewhere). One Taiwanese study found it less often among people who
          lived past 85, in one hospital; its check at a second hospital is unclear, and it has not been confirmed
          independently. This is weak, early evidence: a possible tendency, not destiny.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of a version of this DNA position found mainly in people of East Asian ancestry, which
          is very unusual. One Taiwanese study found single copies less often among people who lived past 85, a
          finding not yet confirmed, so nothing can be said about two copies.
