# The seed list's locus 48, IL6 (7p15.3). Curated 2026-11-11. Lead rs2069837 (GRCh38 7:22,728,408, GRCh37
# 7:22,768,027, A/G, an IL6 intron; the seed's only rsID), Zeng 2016's Han Chinese centenarian SNP (Table 1). G is
# about 0.14 to 0.17 in East Asians and 0.07 to 0.09 in Europeans. No other seed locus lies near it; row 8 (IL6R) is
# the receptor's gene on chromosome 1.
locus_id: 48
locus_name: IL6
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's B, on §4.1's "overfit source" (D26.14, as rows 41 and 44), and §4.1 names IL6 among its
  explicitly contradicted examples. Zeng 2016 compared 2,178 Han Chinese centenarians (mean age 102.7) of the CLHLS
  with 2,299 middle-aged controls (mean 48.4) in a southern and a northern dataset: G was in 0.053 of the
  centenarians' alleles and 0.095 of the controls', OR 0.61 per G, P 1.8e-9 combined (south P 6.0e-3, north 1.0e-6;
  the regions' meta-analysis 4.05e-8), so A is the longer-life allele. The genotype calls behind it are in doubt.
  Zeng's southern controls carry G at 0.033 where 1000 Genomes' southern Han (CHS) carry 0.143 and the paper itself
  gives 0.14 for Asians; the northern controls' 0.134 is close to northern Han's 0.160. Liu 2021, the same group,
  says the SNP failed its quality control in their later CLHLS analysis and remarks on its low frequency there
  (0.075 against 0.179). The authors' own QC rejecting the call makes the discovery an overfit source (D26.14), so
  no later look is weighed as replicating it. The larger independent looks mostly lean the other way or are flat.
  Timmers 2019 carried Zeng's effect to the parental scale with the APOE calibration (A +0.0716, SE 0.0119) and found
  A at −0.0074 (SE 0.0076), one-sided P 0.84; that is a D21 red flag under both of D25.3's calibrations (APOE's
  factor: power about 1.00, heterogeneity P 2e-8; the loci's mean factor 0.4175: expected 0.030, power 0.99,
  heterogeneity P 1.0e-3, derived), so `replication_failed`. Zeng's own Supplementary Table 3 puts the EU longevity
  consortium at P 0.90 with G more frequent among the long-lived, and NECS at OR 0.88, P 0.25. FinnGen's death
  endpoint has G with fewer deaths (P 0.23), and Zenin 2019's healthspan G with a later end (P 0.081 raw, 0.090
  after its genomic control). One look leans Zeng's way: Deelen 2019's European 90th percentile, A OR about 1.08, P
  0.038 two-sided (one-sided 0.019; the 99th P 0.30, same side). Its cohorts are European only and include the EU
  consortium that is flat in Zeng's table. With the discovery an overfit source it replicates nothing (D26.14): named,
  not counted, as row 41's LifeGen lean. Deelen's trans-ethnic analyses reach genome-wide at the lead only by adding
  CLHLS, and the authors say East Asians drive it; the GWAS Catalog's Deelen records and Open Targets' 99th-percentile
  set are those results. Outcome cells: lifespan 0 (Timmers, FinnGen), healthspan 0 (Zenin, two-sided P 0.090
  after genomic control; one-sided on G's side it would be about 0.045, but D26.2 reads a cell one-sided only in the
  discovery's direction), exceptional survival 0 (Deelen's 90th named, not counted; 99th and the EU consortium flat).
  Pleiotropy is real but carries no trade-off at tier D (D26.14): G protects against critical COVID-19 in Chinese
  patients (Gong 2022, OR 0.49, P 4.6e-16) and lowers IL-6 expression in a reporter assay and in serum, so A is the
  higher-IL-6, higher-risk allele there; the lead is also genome-wide for Takayasu arteritis (Renauer 2015, OR 2.07),
  whose risk allele the sources held here do not name. No longevity effect is shown to run through IL-6, so the
  mechanism is filed as general ageing (D25.7). Context `ancestry_specific:eas`: the claim is Han Chinese, as Zeng
  says and R-ANC-4 lists. Open Targets 26.09: the lead tops both lifespan-class credible sets, Zeng's (PIP 0.55) and
  Deelen's trans-ethnic 99th (PIP 0.99), so causal C1 by the letter; both rest on CLHLS's genotypes, so it is the
  fine-mapping of the doubted call. L2G names IL6 (0.91, 0.88), but the one cis colocalisation at H4 ≥ 0.8 is
  IL6-AS1's visceral-adipose eQTL (0.85; IL6's own transcript-usage QTL 0.74): under D24 the rival holds every
  colocalisation, so E3 and no gene named. Age of action is unknown. Genotypes neutral (D25.2).
