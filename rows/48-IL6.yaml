variants:
  - rsid: rs2069837
    gene: ""
    phenotype: IL6 region, reaching 100, Chinese
    trait_efo_id: OBA_VT0005372
    effect_allele: A
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, inside the IL6 gene on chromosome 7 (about
          74 in 100 people of East Asian ancestry and 83 in 100 of European ancestry have this). It is the reference
          the other combinations are compared with. A Chinese study of people who reached 100 reported this version
          as more common among them, but its genotype calls were later doubted by the same research group, and
          larger studies did not confirm it. It says nothing about your own lifespan.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy of a version of this DNA region, inside the IL6 gene, that about 24 in 100 people of
          East Asian ancestry and 16 in 100 of European ancestry carry. A Chinese study reported it as less common
          among people who reached 100, but the same research group later doubted its genotype calls, and larger
          studies did not confirm a link with lifespan. It says nothing about your own lifespan.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of a version of this DNA region, inside the IL6 gene (about 2 in 100 people of East
          Asian ancestry and 1 in 100 of European ancestry do). A Chinese study reported it as less common among
          people who reached 100, but the same research group later doubted its genotype calls, and larger studies
          did not confirm a link with lifespan. It says nothing about your own lifespan.
