variants:
  - rsid: rs147730555
    gene: SIK3
    phenotype: SIK3 M800T, longevity
    trait_efo_id: OBA_VT0005372
    effect_allele: G
    effect_size: 21.00
    effect_measure: OR
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as nearly everyone does. It is the
          reference the other combinations are compared with. The position lies in the SIK3 gene on chromosome 11.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of a very rare version of this DNA position (about 2 in 10,000 people of European
          ancestry do). It changes one building block of the SIK3 protein, which helps steer how cells sense nutrients.
          One German study found it about six times among 1,245 very long-lived people, many times what the wider
          European population would lead one to expect; a smaller
          Ashkenazi Jewish study leaned the same way without a clear difference. It rests on a handful of carriers and
          has not been confirmed, so this is weak, early evidence: a possible tendency, not destiny.
      - genotype: G/G
        state: protective
        conclusion: >-
          You carry two copies of a very rare version of this DNA position, which is extremely unusual; the one study
          of it found no one with two copies. It changes one building block of the SIK3 protein. One German study found
          single copies a few times among very long-lived people, a finding not yet confirmed, so nothing can be said
          about two copies.
