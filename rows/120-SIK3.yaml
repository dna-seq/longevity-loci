# The seed list's locus 120, SIK3 (11q23.3). Curated 2026-11-15. Lead rs147730555, the seed's only rsID (Kolbe
# 2025's exome-wide rare variant): missense in SIK3, methionine to threonine at residue 800 of the MANE Select
# transcript (752 on ENST00000375300), GRCh38 11:116,861,300 A/G,
# GRCh37 11:116,732,016, G the rare allele (0.01 % in gnomAD's non-Finnish European exomes) and the discovery's
# longer-lived side. Open Targets 26.09 has no record of the variant under either allele order; the GWAS Catalog
# (2026-10-29) holds no association.
locus_id: 120
locus_name: SIK3
verdict: kept
verdict_reason: >-
  Tier C, the seed's: a sub-genome-wide discovery in one sample, old against young (R-TIER-2), unreplicated (§4.1's
  C). Kolbe 2025 sequenced the exomes of 1,245 German long-lived individuals (past the 95th age-at-death percentile
  of their birth cohort) and 4,105 younger controls; G was at 0.24 % among the long-lived and in no control, OR 43.0
  (Haldane-corrected), P 1.6e-6, adjusted 0.034 under the paper's exploratory false-discovery rate of 0.05, its own
  exome-wide call, not a genome-wide one (R-TIER-4, D31.13). On 2,490 and 8,210 alleles that is about 6 copies against none (the
  Haldane OR from 6 and 0 is 42.96, derived). Unlike row 107, the controls fit the reference: gnomAD's non-Finnish
  exomes (0.0107 %) expect 0.88 copies in them and they show none (Fisher's exact on both counts, one-sided P 0.42), while the long-lived show about
  6 where 0.27 are expected (P 4.5e-7; against gnomAD's genomes, 0.025 %, 0.14 and 1.2e-4, derived; Fisher's exact on both counts throughout, D37.1, db-ensembl-116#q1126 to q1133). Yet Kolbe's controls pooled over rows 120, 124 and 125 show 1 copy where 8.3 are expected (Fisher on the three variants' summed counts P 0.0029, Poisson 0.0024 before, derived), so
  by D34.7 every rare row of the paper is read against the reference, as 107: the long-lived's about 6 copies
  against 0.27 expected give OR 22.6 (Fisher one-sided P 4.5e-7, derived), and the paper's own OR against gnomAD is
  21.00, with its caveat that gnomAD's non-Finnish Europeans are mostly British; the printed 43.0 is named, not read. Kolbe chose its hits from about 98,000 rare variants, so a reference OR still carries that selection, uncorrected (D34.14). By the printed percentages and the long-lived's 2.7:1 women to men, about 3 copies in 336 men (0.07 expected from gnomAD, P 6.1e-5) and 3 in
  909 women (0.19 expected, P 0.0011), no control copy in either sex (derived): men's share is above their 27 % of the long-lived, as across
  Kolbe's rows (about 24 of 35 copies, D34.7), named, no token. The paper removed variants whose allele fraction fell outside the 1st to 99th percentile to limit
  clonal-haematopoiesis calls, but prints no allele fraction for this one. The exomes are blood-derived; SIK3 is
  among the newer clonal-haematopoiesis genes in blood (Bernstein 2024), but the selection shown there is for
  truncating mutations, and this is one missense base recurring in unrelated people; the somatic share is untested,
  and clonal haematopoiesis is no flag (D31.13). The variant's spread across populations (Ashkenazi above non-Finnish above Finnish, absent
  from African and Asian exomes) fits an inherited variant; the younger controls of the look-up below average 83
  years, an age where clonal haematopoiesis is common, so their copy shows nothing either way. One look-up exists: the paper's Ashkenazi
  sample (515 aged 95 or more, 496 younger controls) has 2 G copies in the long-lived and 1 in the controls, OR
  1.93, P 0.79, the same direction and no pass. Conditional on its 3 copies the look-up can never reach 0.05: even 3
  of 3 in the long-lived gives one-sided 0.13, so its power is nil and it sets no red flag and no
  `replication_failed` (against the read size, OR 21, P 0.126; at the printed 43, 0.064, derived). Read instead against gnomAD's Ashkenazi frequency, the long-lived would expect 6.8 copies
  (exomes, 0.031 %) or 18.7 (genomes, 0.087 %) at OR 21 and show 2 (Fisher's exact on both counts, D37.1: P 0.090 and 0.021; Poisson 0.034 and under 0.001 before, which treated gnomAD's 8 and 3 Ashkenazi copies as exact), and at the discovery's lower bound (OR 8.3) P 0.52 and 0.15 (the discovery's 6 copies span 2.2 to 13.1, derived); which
  reading the lead declined (row 120's Q1, (a)). The same reference also fits the look-up's controls (1 copy against 0.31, P 0.29) and puts its long-lived above it, short of nominal (2 against 0.32, Fisher one-sided P 0.055, Poisson 0.042 before; against the genomes 0.32, derived): read on the reference, the look-up neither passes at nominal P nor reaches the discovery's size, so D31.10
  gives no ground to prefer that reading for the look-up, whose own controls fit (D34.7 concerns the German
  controls). The Leiden
  look-up lists IHH and FLCN, no SIK3 copy among 179 long-lived, where 0.86 are expected (P of none 0.42, derived):
  uninformative, and the paper does not say whether an absent variant is no copies or uncalled. At 0.01 % the variant is
  absent from every large sample read here: Deelen 2019, Timmers 2019, Pilling 2017, Zenin 2019, FinnGen R11, Park
  2025 and Foote 2025 hold no line, and Wright 2019's one line within 500 kb (rs524467, 202 kb, G 0.17 in CEU) cannot
  tag it, so every test is untested, not negative. Timmers' strongest line within 500 kb, rs964184 (83 kb, P 1.5e-4),
  and Deelen's (90th 11:116,665,120, 67 kb, EAF 0.01, P 4.6e-4; 99th 11:117,214,617, 483 kb, EAF 0.98, P 2.3e-4)
  cannot tag it either (r² at most 0.0007, 0.011 and 0.005 by frequency, derived). No LD look is possible for a 0.01 % variant in 1000 Genomes' 99 CEU samples. The literature
  search (the rsID, and SIK3 with longevity terms; Semantic Scholar answered 429 three times, its part unchecked) finds
  Kolbe alone among lifespan studies; of the papers citing Kolbe, a 2026 bioRxiv functional study of rare
  mTOR-pathway variants by the same groups edits variants in other genes (DEPTOR, RAF1, PHLPP1, NF1, IRS1; read from
  Europe PMC's preprint copy, which the cache cannot hold), none in SIK3. Exceptional survival + (the reference read, P
  3.9e-7, D34.7), lifespan untested, healthspan untested. Mechanism ageing in general (D25.7): the
  authors hypothesise that the change lowers mTORC1 signalling, SIK3 being one of its positive regulators, a route not
  tested here; named. Causal C4: no Open Targets record. Effector E1, SIK3, by §4.2's coding clause (a missense
  change, M800T on the MANE Select transcript ENST00000445177; SIFT deleterious with low confidence, PolyPhen
  benign, CADD 19.45).
  Descriptive. Age of action unknown. The evidence is European (German; the Ashkenazi look-up leans the same way).
