variants:
  - rsid: rs2730486
    gene: ""
    phenotype: NUAK1 intron, longevity, Taiwanese
    trait_efo_id: OBA_VT0005372
    effect_allele: C
    effect_size: 1.20
    effect_measure: OR
    stat_significance: nominal
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA position in people of European ancestry (about
          61 in 100 do; about 32 in 100 of East Asian ancestry). It is the reference the other combinations are
          compared with. The position lies inside the NUAK1 gene on chromosome 12. One Taiwanese study linked this
          version to living past 90, but a large European study of long-lived people found no clear difference, so it
          is not counted for or against lifespan.
      - genotype: C/G
        state: neutral
        conclusion: >-
          You carry one copy of each version of this DNA position (about 34 in 100 people of European ancestry and 49
          in 100 of East Asian ancestry do). One Taiwanese study found the G version less often among people who lived
          past 90, but a large European study of long-lived people did not bear that out, so it is not counted for or
          against lifespan.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the G version of this DNA position (about 5 in 100 people of European ancestry and
          19 in 100 of East Asian ancestry do). One Taiwanese study found it less often among people who lived past
          90, but a large European study of long-lived people did not bear that out, so it is not counted for or
          against lifespan.
