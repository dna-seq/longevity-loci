# The seed list's locus 131, NUAK1 (12q23.3). Curated 2026-11-16. Lead rs2730486, the seed's only rsID (Hsieh 2026's
# 90-and-over Taiwanese locus): intronic in NUAK1, GRCh38 12:106,083,386 C/G, GRCh37 12:106,477,164, G at 0.43 in
# gnomAD's East Asian genomes and 0.22 in the non-Finnish, G the discovery's shorter-lived allele and C the
# longer-lived. Open Targets 26.09 holds it only in a GTEx muscle eQTL set for NUAK1; the GWAS Catalog (2026-10-29)
# holds no association.
locus_id: 131
locus_name: NUAK1
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's C: a sub-genome-wide East Asian discovery that Deelen 2019 contradicts on the same scale at
  the variant itself (D31.13's Hsieh bullet, D26.11, D22.3; rows 113 and 122's shape). Hsieh 2026 compared 922
  Taiwanese hospital patients who died at 90 or over with 871 who died at 65 to 75 at the same hospital: G (0.436,
  pooled) OR 0.66 per G, P 1.7e-6, under the paper's suggestive line of 1e-5 (log OR per C +0.416, SE 0.087 from its
  P, derived). Solved from the OR and the counts (per Alt, the pooled frequency, as rows 113 and 119 read the
  tables), the controls carry G at about 0.488 and the long-lived at about 0.387. Against gnomAD's East Asian genomes
  (0.430, the reference D31.13 fixes) the controls misfit (z 4.2, P 2.4e-5 with its error; against 1000 Genomes EAS
  P 0.0095; Taiwan Biobank's printed 0.456 sits between), so D31.10 reads the discovery against the reference: the
  long-lived give C +0.182 per allele (SE 0.055), P 0.001 (derived), above it, so something is left to read (D31.11
  not reached). One branch differs: against the southern Han CHS (0.429, 210 alleles) the controls fit (P 0.098) and
  the long-lived read +0.174, P 0.24, D31.11's shape, which would also make the row D; gnomAD's East Asians are the
  reference, and the branch is named. Its validation cohort gives OR 0.659, P 0.002, the same direction, but its
  controls are the discovery's age band and not its own (Fig. 2), so it is not an independent replication (D19.1).
  Deelen 2019 tests the variant itself (C at 0.78): 90th percentile +0.0295 (SE 0.0231), P 0.20, and 99th +0.0338 (SE
  0.0361), P 0.35, leaning C's way but flat; against Hsieh's read on the same scale, two log odds of long-lived
  status, heterogeneity P 0.011 and 0.025, power 1.00, holding down to 0.60 and 0.81 of the read effect (against the
  printed effect, 1.7e-5 and 4.9e-5; derived): a D21 red flag, `replication_failed`. No independent genome-wide pass
  in Deelen's own ancestry and class outweighs it (D34.1). Hsieh's 90-and-over APOE line is a powered null of
  Hsieh's sample (ε4 OR 0.96, P 0.82; D34.2), so no conversion to a lifespan scale is its own, and the Timmers and
  Park tests are approximate and set no flag (D31.13): Timmers 2019 has C at beta1 −0.0033 (SE 0.0047), P 0.48, a hair
  the other way; Park 2025 C −0.0008 on the Martingale residual (its columns swapped), P 0.31; FinnGen R11's deaths G
  −0.0039, P 0.67, a database line (D29.1); all flat. Zenin 2019 flat (P 0.54), so healthspan 0. Foote 2025's factor 2
  puts C on the frailer side (P 0.017) and factors 1, 3, 5 and 6 the same side, flat; a D row's Foote factor scores
  nothing (multivariate), named. Pilling 2017's four parental scans are flat (P 0.31 to 0.97). The literature search
  (the rsID; Semantic Scholar answered 429, its part unchecked) finds nothing; Hsieh is found by its PMID, and its one
  citing paper is a Finnish polygenic lifespan score, with no single-variant test. The ancestry is named here, not as
  a context token (D30.15). Every genotype neutral (D25.2). Exceptional survival 0 (Deelen leans C's way, short of
  nominal, and a D row's discovery gives no +, D28.10); lifespan 0 (Timmers and Park flat); healthspan 0 (Zenin
  flat). Mechanism ageing in general (D25.7): intronic in NUAK1, where G lowers NUAK1 expression in GTEx muscle
  (beta −0.15, P 1.0e-5, PIP 0.019), a non-scoring set, named. Causal C4 and effector E4: no lifespan-class credible
  set. Descriptive. Age of action unknown.
