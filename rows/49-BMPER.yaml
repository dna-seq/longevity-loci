variants:
  - rsid: rs17169634
    gene: BMPER
    phenotype: BMPER region, reaching 90, Chinese
    trait_efo_id: OBA_VT0005372
    effect_allele: G
    effect_size: 0.308
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, inside the BMPER gene on chromosome 7
          (about 82 in 100 people of East Asian ancestry and 81 in 100 of European ancestry have this). It is the
          reference the other combinations are compared with. A Chinese study reported the other version as more
          common among people who reached 90, but a second Chinese sample and large European studies did not
          support it. It says nothing about your own lifespan.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy of a less common version of this DNA region, inside the BMPER gene (about 17 in 100
          people of East Asian ancestry and 18 in 100 of European ancestry do). A Chinese study reported it as more
          common among people who reached 90, but a second Chinese sample leaned the other way and large European
          studies of the very old found it slightly less common. It says nothing about your own lifespan.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of a less common version of this DNA region, inside the BMPER gene (about 1 in 100
          people of East Asian or European ancestry do). A Chinese study reported it as more common among people
          who reached 90, but a second Chinese sample leaned the other way and large European studies of the very
          old found it slightly less common. It says nothing about your own lifespan.
