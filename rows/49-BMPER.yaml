# The seed list's locus 49, BMPER (7p14.3). Curated 2026-11-11. Lead rs17169634 (GRCh38 7:34,054,385, GRCh37
# 7:34,093,997, A/G, a BMPER intron; the seed's only rsID), Liu 2021's top longevity SNP in Chinese (Table 1). G is
# about 0.10 in East Asians (0.06 in southern, 0.12 in northern Han) and 0.08 to 0.10 in Europeans. In Timmers 2019's,
# Deelen 2019's, Zenin 2019's and FinnGen R11's summary statistics at the lead itself. Liu's supplementary tables
# (the chip's SNP list S1 to S3, the survival results S16) are not read.
locus_id: 49
locus_name: BMPER
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's B, on D22.3: a genome-wide discovery in one ancestry that the European look-ups contradict, with
  its proxies on the other side too, a powered test on the same scale raising D21's red flag, and no independent
  scoring-class study p < 0.05 its way. D25.1 (a failed test in the discovery's own ancestry) does not apply: Liu's
  dataset 2 sits inside its own pooled P and contradicts it no more than it replicates it (D27.1). Liu 2021 compared Chinese of the CLHLS survey aged 90 or more
  (4,662) with controls under 75 (3,828) in dataset 1, typed on a custom chip, and centenarians (1,105) with controls
  under 65 (1,450) in dataset 2, the group's earlier genome-wide array less its overlap with dataset 1. G, the minor
  allele, goes with reaching old age in dataset 1 (β 0.370 on the log odds, OR 1.45, P 3.9e-18), and the
  meta-analysis gives β 0.308, P 7.9e-15, the paper's top signal. The pooled P is dataset 1's alone: dataset 2 goes the
  other way (β −0.097, SE 0.109, P 0.38) though it had power 0.88 at the meta β to show G's side (heterogeneity
  between the two P about 6.7e-5, derived). Dataset 2 sits inside the pooled P, so the row does not rest on it (D25.9
  says such an arm replicates nothing, D27.1 that it contradicts nothing); the split is recorded as heterogeneity
  inside the discovery, which bars A by §4.1's last criterion on its own (D27.1). Liu's own survival analysis (Cox; G carriers living longer, the paper's survival rates 28.3 % GG, 16.8 % GA, 11.3 %
  AA, "survival HR" 1.25, P 1.45e-10) is dataset 1's people and chip again, so it replicates nothing either (D25.9),
  and it is cited here, not entered as a study, so it cannot read as an own-survival `+`.
  Outside China every look is flat or against G, though G is as common in Europe (0.098) as in East Asia (0.096).
  Deelen 2019, on the same log-odds scale, puts A ahead at both percentiles: the 99th A +0.120 (SE 0.056), P 0.033,
  the value Liu quotes as nominal "in the opposite direction", and the 90th A +0.049, P 0.17. Against Liu's +0.308 per
  G the 99th gives heterogeneity P about 6e-10 (about 7e-5 at half Liu's β), one-sided power about 1.00 (derived): a
  red flag with no scale to convert. Timmers 2019's parental lifespan is flat (A +0.0015, P 0.84; G's side one-sided
  0.58); carried to that scale with Liu's own APOE factor (Liu's rs2075650 G −0.293 over Timmers' 0.0822, 3.56) Liu's
  β expects G +0.086 (SE 0.019), power 0.996, heterogeneity P 1.2e-5, and with the loci's mean factor +0.207 (SE
  0.065), power 0.93, P 0.0015: a red flag under both of D25.3's calibrations, so `replication_failed`. The lead's 16
  CEU proxies (all r² 1.0) do not lean Liu's way: all 14 that Timmers holds sit on A's side (P 0.57 to 0.80), and so
  do Deelen's (the 99th P 0.022 to 0.12). FinnGen's death endpoint leans to G (one-sided 0.16) and Zenin 2019's
  healthspan is flat (P 0.87): no independent p < 0.05 on G's side. Not 48's ground (D26.14): no sentence of Liu's
  doubts the call, and G's frequency in Liu's samples is printed nowhere read here (Table 1, the GWAS Catalog), so
  whether dataset 1's genotypes are sound is unknown, said not assumed; the paper's cross-array check removed SNPs
  whose calls disagreed in the 2,054 people typed on both, which tests calls, not associations. Outcome cells:
  lifespan 0 (Timmers, FinnGen), healthspan 0 (Zenin), exceptional survival 0 (Deelen's two percentiles on A's side;
  Liu's own survival analysis is the discovery's people). No trade-off at tier D: in dataset 1, G goes with less
  arthritis (P 3.8e-6) and prostate cancer (P 0.0063), and Biobank Japan links the locus to the same and to BMI,
  direction not given; Liu cites an Alzheimer's report (Nelson 2014, P 1e-7, allele unnamed in the Catalog). No
  longevity effect is shown to run through any of them, so the mechanism is general ageing (D25.7). Context
  `ancestry_specific:eas`: the claim is in Chinese only, and the European looks contradict it. Open Targets 26.09:
  Liu's set (PICS, from the curated top hit, no in-sample LD) holds the lead at PIP 0.109, the top of about 25
  members, so causal C2 by §4.2's letter; L2G names BMPER at 0.93 and all four colocalisations are BMPER eQTLs in
  cerebellum at H4 0.98, so effector E1 BMPER. Age of action is unknown. Genotypes neutral (D25.2).
