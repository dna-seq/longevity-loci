# The seed list's locus 63, TCF7L2 (10q25.2). Curated 2026-11-12. Lead rs35198068, the seed's lead, a T/C in a TCF7L2
# intron at GRCh38 10:112,995,025 (GRCh37 114,754,784); C is the minor allele in Europeans (0.32) and the type 2
# diabetes risk allele, and it tags rs7903146, the best-known TCF7L2 diabetes variant, at r² 1.00 in CEU. The seed's
# other rsID here, rs34872471 (Zenin 2019's Table 2 SNP, track D), is the same signal (r² 0.98, D14). Entered by
# tracks B, G and H from Rosoff 2023's mvAge; the locus was first genome-wide in Zenin 2019's healthspan GWAS. The
# seed's Zhao 2024 (cardiometabolic multimorbidity, PMID 38409652) is read through the GWAS Catalog only: its abstract
# names no SNP.
locus_id: 63
locus_name: TCF7L2
verdict: kept
verdict_reason: >-
  Tier B, the seed's, kept: genome-wide for healthspan with a co-occurring lifespan study (D16), replicated outside UK
  Biobank only at a far smaller effect than any printed calibration expects, and A's "no red-flag heterogeneity"
  unknown (D25.12). The criteria as read: (1) genome-wide for healthspan in 300,447 British UK Biobank participants:
  T, the common allele (0.68 in Europeans), delays the end of healthspan (Zenin 2019, T β −0.061 per copy on the log
  hazard, P 4.2e-30 at the lead; at rs34872471, r² 0.98, P 9.7e-29 after genomic control, the paper's call, D17.3).
  Zenin's replication in 96,000 other UK Biobank participants (P 2.9e-11) is healthspan replicating healthspan in one
  biobank and counts nothing toward A (D25.11). By component the signal is diabetes's: diabetes P 7e-156, all
  diseases but cancer 1e-46, own death flat (P 0.72), MI and cancer nominal. (2) The co-occurring lifespan study
  (D16, one-sided as D25.13): Zenin's own parents'-death meta-analysis, T lowering the parents' hazard (C +0.004, SE
  0.002, P 0.095, one-sided 0.048), in the same people; LifeGen's parental lifespan leans T's way and does not pass
  (beta1 +0.0060, one-sided 0.079), and Park 2025's UK Biobank own survival is flat (P 0.93). (3) Outside UK Biobank,
  FinnGen R11's any-death endpoint gives C log OR +0.0195 for death (SE 0.0093, P 0.035; T one-sided 0.017), a
  database look-up named here, not a study entry; Deelen 2019's 90th and 99th percentiles lean T's way and do not pass
  (log OR +0.026 and +0.018 per T, one-sided 0.11 and 0.29). (4) No red flag cannot be shown: every independent test
  is on another scale than Zenin's healthspan hazard, and the one printed calibration, APOE's (Zenin's ε4 β 0.0137,
  P 0.041, against its effect in each look-up; D25.3), expects about 37 times Zenin's effect at Deelen's 90th (log OR
  2.3, observed 0.026: power 1.00, heterogeneity P far below 1e-10) and about 7.6 times in FinnGen (log OR 0.47 for C,
  observed 0.0195, about 4 % of it). No mean factor exists for healthspan against these phenotypes, so whether
  Deelen's null is a red flag is unknown and the row carries no `replication_failed` (D26.3), and the FinnGen pass is
  §4.1's "replication with a much smaller effect" under the only calibration there is; either way B (D25.12: unknown
  is not "no red flag"). That ε4 barely moves healthspan makes APOE's factor a poor yardstick for a diabetes locus,
  which the row states rather than corrects (D28.1). Rosoff 2023's mvAge (T, P 5.4e-16; not novel, its healthspan
  input's) and Timmers 2020's multivariate scan (P 4e-28) pool these same samples; mvAge's Q test (P 9.3e-13) says the
  SNP reaches the inputs through a pathway of its own, here diabetes. Outcome: healthspan + (Zenin), lifespan + (the
  parents' death and FinnGen, one-sided), exceptional survival 0 (Deelen). Mechanism metabolism, with mech:t2d: C is
  the type 2 diabetes risk allele (P 3e-41), and the healthspan signal is diabetes's by Zenin's components. Broad:
  T also lowers chronic kidney disease (P 5e-28) and diabetic eye disease, and blood pressure runs both ways (T raises
  diastolic, C systolic). A trade-off: T raises body mass index (P 4e-89) and obesity (PheCode 278.1, P 3e-23), the
  known TCF7L2 pattern, so descriptive (D18.2, §4.2: trade-off loci get no actionability label). Causal C2: Zenin's
  own SuSiE-inf healthspan set (Open Targets 26.09) holds the lead at PIP 0.445, rs34872471 at 0.432 and rs7903146 at
  0.123; the multivariate PICS sets (Timmers 2020, PIP 0.47; mvAge, 0.33) are named, not counted (D25.5, D27.6).
  Effector E2, TCF7L2: locus-to-gene 0.91 on the healthspan set, with no QTL colocalisation of it, so not E1. The
  protection is the absence of the risk allele: C raises diabetes, and T, which most people carry, is the reference.
  Evidence is European; C is 0.30 in Africans and South Asians and 0.02 in East Asians, where the longevity effect is
  untested: eur_only_evidence. Age of action unknown.
