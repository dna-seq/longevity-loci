# The seed list's locus 63, TCF7L2 (10q25.2). Curated 2026-11-12. Lead rs35198068, the seed's lead, a T/C in a TCF7L2
# intron at GRCh38 10:112,995,025 (GRCh37 114,754,784); C is the minor allele in Europeans (0.32) and the type 2
# diabetes risk allele, and it tags rs7903146, the best-known TCF7L2 diabetes variant, at r² 1.00 in CEU. The seed's
# other rsID here, rs34872471 (Zenin 2019's Table 2 SNP, track D), is the same signal (r² 0.98, D14). Entered by
# tracks B, G and H from Rosoff 2023's mvAge; the locus was first genome-wide in Zenin 2019's healthspan GWAS. The
# seed's Zhao 2024 (cardiometabolic multimorbidity, PMID 38409652) is read through the GWAS Catalog only: its abstract
# names no SNP.
locus_id: 63
locus_name: TCF7L2
verdict: kept
verdict_reason: >-
  Tier B, the seed's, kept (D29.1): genome-wide for healthspan with a co-occurring lifespan study (D16), and A out of
  reach because the discovery's red flag, scaled from its own healthspan effect (D27.9), is unknown (D28.1, D25.12)
  and a curator-read database line replicates nothing (D12). The criteria as read: (1) genome-wide for healthspan in
  300,447 British UK Biobank participants:
  T, the common allele (0.68 in Europeans), delays the end of healthspan (Zenin 2019, T β −0.061 per copy on the log
  hazard, P 4.2e-30 at the lead; at rs34872471, r² 0.98, P 9.7e-29 after genomic control, the paper's call, D17.3).
  Zenin's replication in about 96,000 other UK Biobank participants, checked for no kinship with the discovery (P
  2.9e-11, under the paper's 0.05/12), is healthspan replicating healthspan in one biobank and counts nothing toward
  A (D25.11). By component the signal is diabetes's: diabetes P 7e-156, all
  diseases but cancer 1e-46, own death flat (P 0.72), MI and cancer nominal. (2) The co-occurring lifespan study
  (D16, one-sided as D25.13): Zenin's own parents'-death meta-analysis, T lowering the parents' hazard (C +0.004, SE
  0.002, printed P 0.0952, one-sided 0.048), in the same people, read as printed (D29.5). B over C rests on this one
  cell: the rounded β and SE would give 0.046, and the P is uncorrected, so a genomic-control λ of 1.029 or more
  would push it past 0.05. LifeGen's parental lifespan, which holds those parents, leans T's way and does not pass
  (beta1 +0.0060, one-sided 0.079), and Park 2025's UK Biobank own survival is flat (P 0.93). (3) Outside UK
  Biobank, FinnGen R11's any-death endpoint gives C log OR +0.0195 for death (SE 0.0093, P 0.035; T one-sided
  0.017), a database line that may weigh against a row but never lifts one (D29.1); Deelen 2019's 90th and 99th
  percentiles lean T's way and do not pass (log OR +0.026 and +0.018 per T, one-sided 0.11 and 0.29). Garagnani
  2013's Italian centenarians, at rs7903146 (r² 1.00 to the lead): its T, the diabetes risk allele and the lead's C,
  is in 31.4 % of 229 centenarians' alleles against 37 % of 558 middle-aged non-diabetic controls', a crude OR of
  0.78 per T, one-sided P 0.017 (derived from the printed frequencies, D29.5, as at 31; the paper prints no such
  test), so the lead's T is commoner among centenarians; its overlap with Deelen's GEHA Italian arm is unknown, so
  it sets exceptional survival and lifts no tier. Beekman 2010's Table S5, a Leiden 85-plus look-up of GWAS disease
  alleles that may be independent of Deelen and is the one route to A that D29.1 leaves open, could not be reached
  (the publisher answers 403 to fetch-supp and to the plugin's fetch_supplementary, PubMed Central 404, and Europe
  PMC's supplementary-files endpoint answered with something other than a zip, contents unknown): unknown, not absent. CHARGE's
  longevity GWAS is unchecked (the search was refused, 429), not absent. (4) The red flag, from Zenin's own effect
  (D27.9): no source prints a healthspan-to-lifespan calibration; the curator's ratio of APOE's lines (Zenin's ε4
  β 0.0137, SE 0.0067, two standard errors from zero, against ε4 in each look-up) would put Deelen's 90th at about
  37 times Zenin's effect and FinnGen at about 7.6 times, a conversion of the curator's own, so the flag is unknown
  (D28.1, D26.3) and A's last criterion with it (D25.12); no `replication_failed`. Calibrating from LifeGen's
  effect, as row 35 did, is rejected (D27.9, D29.1); for the record, LifeGen's T +0.0060 under Timmers' factors
  expects log OR 0.029 at Deelen's 90th by APOE's (4.84; power 0.39) and 0.012 by the mean (× 0.4175; power 0.14),
  heterogeneity P 0.93 and 0.54 counting both estimates' errors (D29.6). Rosoff 2023's mvAge (T, P 5.4e-16; not
  novel, its healthspan input's) and Timmers 2020's multivariate scan (P 4e-28) pool these same samples; mvAge's Q
  test (P 9.3e-13) says the SNP reaches the inputs through a pathway of its own, here diabetes. Outcome: healthspan
  + (Zenin), lifespan + (the parents' death, one-sided; FinnGen leans the same way), exceptional survival + (Garagnani,
  one-sided; Deelen leans the same way). Mechanism metabolism, with mech:t2d: C is
  the type 2 diabetes risk allele (P 3e-41), and the healthspan signal is diabetes's by Zenin's components. Broad:
  T also lowers chronic kidney disease (P 5e-28) and diabetic eye disease, and blood pressure runs both ways (T raises
  diastolic, C systolic). A trade-off: T raises body mass index (P 4e-89) and obesity (PheCode 278.1, P 3e-23), the known TCF7L2 pattern, and, in sets read past the first page, localized osteoarthrosis (P 7.5e-9) and obstructive sleep apnoea (P 1.2e-9), while C raises nephropathy and peripheral vascular disease (all 845 sets read; He 2016's two age-related-disease sets, the lead at posterior 0.05 and 0.03 with no β, named, not counted), so descriptive (D18.2, §4.2: trade-off loci get no actionability label). The net direction
  is resolved, so the states are not neutral (§6.2, as row 57): every lifespan look-up, which weighs the diabetes
  and the weight together, leans to T, two of them past one-sided 0.05. Causal C2: Zenin's
  own SuSiE-inf healthspan set (Open Targets 26.09) holds the lead at PIP 0.445, rs34872471 at 0.432 and rs7903146 at
  0.123; the multivariate PICS sets (Timmers 2020, PIP 0.47; mvAge, 0.33) are named, not counted (D25.5, D27.6).
  Effector E2, TCF7L2: locus-to-gene 0.91 on the healthspan set, with no QTL colocalisation of it, so not E1. The
  protection is the absence of the risk allele: C raises diabetes, and T, which most people carry, is the reference.
  Evidence is European; C is 0.30 in Africans and South Asians and 0.02 in East Asians, where the longevity effect is
  untested: eur_only_evidence. Age of action unknown.
