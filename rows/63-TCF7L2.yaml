variants:
  - rsid: rs35198068
    gene: TCF7L2
    phenotype: TCF7L2 intron, healthspan via diabetes
    trait_efo_id: EFO_0009762
    effect_allele: T
    effect_size: -0.061
    effect_measure: beta
    stat_significance: significant
    direction: protective
    negatives: >-
      The longer-life version, T, goes with less type 2 diabetes but with a somewhat higher body weight and more
      obesity, slightly higher diastolic blood pressure, and slightly more joint osteoarthritis and sleep apnoea.
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 47 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome 10,
          lies inside the TCF7L2 gene, one of the best-known genetic links to type 2 diabetes; your version is the
          one that does not raise that risk. It also goes with a slightly higher body weight. The finding comes from
          people of European ancestry; less is known elsewhere.
      - genotype: C/T
        state: risk
        conclusion: >-
          You carry one copy of a version of this DNA position that raises the risk of type 2 diabetes (about 43 in
          100 people of European ancestry do). In a large British study, people with this version tended to reach
          their first major age-related disease somewhat earlier, mostly through diabetes, and studies of lifespan
          lean the same way, more weakly. The same version goes with a slightly lower body weight. It is a likely
          finding, not a settled one. Your blood sugar, which a standard blood test shows, matters more than this
          DNA result. It is a tendency, not destiny.
      - genotype: C/C
        state: risk
        conclusion: >-
          You carry two copies of a version of this DNA position that raises the risk of type 2 diabetes (about 1
          in 10 people of European ancestry do). In a large British study, each copy went with reaching the first
          major age-related disease somewhat earlier, mostly through diabetes, and studies of lifespan lean the same
          way, more weakly. The same version goes with a slightly lower body weight. It is a likely finding, not a
          settled one. Your blood sugar, which a standard blood test shows, matters more than this DNA result. It is
          a tendency, not destiny.
