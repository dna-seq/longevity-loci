variants:
  - rsid: rs1421085
    gene: FTO
    phenotype: FTO, body weight, parents' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: T
    stat_significance: significant
    direction: protective
    negatives: >-
      The longer-life version, T, also goes with slightly higher LDL cholesterol and a slightly higher risk of one
      common type of breast cancer, though with less heart disease and diabetes.
    genotypes:
      - genotype: T/T
        state: protective
        conclusion: >-
          You carry two copies of the version of this DNA position that goes with lower body weight (about 32 in 100
          people of European ancestry do). In large studies parents of carriers lived a little longer, and a separate
          American study saw the same in fathers; it also goes with less diabetes and heart disease. No single study
          found it beyond doubt for lifespan, though a large combined analysis of frailty did, so this is a likely finding, not a settled one. The effect is small and it is a
          tendency, not destiny.
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of each version of this DNA position (about 49 in 100 people of European ancestry do,
          the most common combination). It is the reference the other combinations are compared with. The position,
          on chromosome 16, lies inside the FTO gene, the best-known gene for body weight. The finding comes from
          people of European ancestry; less is known elsewhere.
      - genotype: C/C
        state: risk
        conclusion: >-
          You carry two copies of the version of this DNA position that goes with higher body weight (about 19 in
          100 people of European ancestry do). In large studies parents of carriers lived a little less long, and it
          also goes with more diabetes, heart disease and frailty. No single study found it beyond doubt for
          lifespan, though a large combined analysis of frailty did, so this is a likely finding, not a settled one. The effect is small
          and it is a tendency, not destiny.
