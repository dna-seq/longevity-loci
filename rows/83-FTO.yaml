# The seed list's locus 83, FTO (16q12.2). Curated 2026-11-13. Lead rs1421085, the seed's only rsID (entered by the
# pleiotropy track alone, as the body-mass variant through which BMI's effect on lifespan is read): an intron variant
# of FTO, T/C, C the higher-BMI allele (0.43 in Europeans), T the longer-lived side. Wright 2019's AncestryDNA tables
# hold rs10852521, 4 kb away, at r² 0.65 (CEU) and 0.70 (GBR). Open Targets 26.09: 1,701 credible sets hold the lead,
# none of a lifespan study.
locus_id: 83
locus_name: FTO
verdict: kept
verdict_reason: >-
  Tier C, as the seed has it, row 8's shape: nothing at the variant reaches genome-wide significance for any lifespan
  or healthspan phenotype, and §4.1's R-TIER-4 keeps an MR-only result out of A and B. The seed's ground is Joshi
  2017's Mendelian randomisation (one BMI unit about 7 months of life), a polygenic instrument over many BMI loci, not
  a per-variant result here. The variant's own lifespan evidence is nominal and points one way. Timmers 2019's
  million parents' lives: T longer-lived, P 3.9e-4, UK Biobank and LifeGen both on that side (Pilling's UK Biobank
  fathers P 0.011, both parents 0.081). AncestryDNA, outside UK Biobank and LifeGen: Wright 2019's Supplemental Table
  8, which filters on the AncestryDNA arm's own P (so the line passes on its own, D29.18), has rs10852521 (r² 0.65 in
  CEU, 0.70 in GBR, D′ 1, its T with the lead's T, phased in CEU where the other phase would give r² 0.94) with T and
  longer-lived fathers, genomic-control P 3.6e-5 (born 1886-1918) and 5.7e-4 (1886-1940), and T commoner among older
  customers (P 8.3e-5, viability, confirmation only). Wright's two tables print that one β under complementary labels
  (Table 8's A, Table 9's G); Pilling's fathers' deposit, which Table 9's UK arm copies with C's sign, fixes it: both
  read T longer. Deelen 2019 leans T's way at both percentiles, one-sided 0.037 (90th) and 0.041 (99th). Zenin 2019's
  healthspan leans T's way short of nominal (P 0.061 after its genomic control); Park 2025's own survival is flat on
  T's side (P 0.14, its allele columns swapped, as the frequencies show); FinnGen R11's death endpoint leans against
  (C with slightly fewer deaths, P 0.25). B's first condition (genome-wide) fails, the nominal results agree in two
  independent samples, and nothing contradicts them, so not D. Lifespan +, exceptional survival + (Deelen one-sided),
  healthspan 0. Mechanism metabolism, through body weight: the lead tops BMI sets (posterior up to 0.85, C raising
  BMI at P 2.4e-277), and C goes with more diabetes (P 1.5e-97), ischaemic heart disease (P 3.6e-16), higher HbA1c,
  glucose, CRP and blood pressure. One record runs the other way: C lowers LDL cholesterol (inverse-normal β −0.021,
  P 9.8e-43), so the longer-lived T raises it slightly. LDL is an established risk factor, which D18.1 counts as
  quoted harm: tradeoff, and with it actionability descriptive, not modifiable through weight (D18.2); put to the lead
  beside modifiable (weight), on the ground that T's lower heart disease outweighs the LDL record. Pleiotropy
  mech:adiposity, broad, tradeoff. Causal C4 and effector E4, no gene named: no credible set of a lifespan-class study
  holds the lead (none of eleven longevity studies queried), as row 69; FTO, in whose intron it sits, is named in
  prose. C is the minor allele at 43 %, so T/C, the commonest genotype, is the reference (§6.2): T/T protective, C/C
  risk, as row 8 states its nominal variant. Age of action unknown. The evidence is European.
