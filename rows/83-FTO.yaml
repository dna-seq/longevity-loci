# The seed list's locus 83, FTO (16q12.2). Curated 2026-11-13. Lead rs1421085, the seed's only rsID (entered by the
# pleiotropy track alone, as the body-mass variant through which BMI's effect on lifespan is read): an intron variant
# of FTO, T/C, C the higher-BMI allele (0.43 in Europeans), T the longer-lived side. Wright 2019's AncestryDNA tables
# hold rs10852521, 4 kb away, at r² 0.65 (CEU) and 0.70 (GBR). Open Targets 26.09: 1,701 credible sets hold the lead,
# two of them Foote 2025's frailty factors (led by rs11642015, r² 1.00).
locus_id: 83
locus_name: FTO
verdict: re-tiered
verdict_reason: >-
  Tier B, up from the seed's C (put to the lead, with C the alternative), row 51's shape: a genome-wide multivariate
  result with a co-occurring lifespan study (§4.5 as D16 reads it; D18.3, D27.3). Foote 2025's frailty factors are
  genome-wide at the locus: multimorbidity (factor 3) P 2.0e-17 and disability (factor 6) P 3.0e-14, both at
  rs11642015, 1.5 kb away and in complete LD with the lead (r² 1.00, D′ 1.00 in CEU and GBR), its C the lead's T, the
  less frail; Foote's deposits hold no line at the lead itself (all seven fetched), so the proxy stands in (D29.3), and
  both of Foote's Open Targets sets here are led by it. A Genomic SEM factor is multivariate (D27.3) and scores at B
  beside a co-occurring lifespan study (D18.3), here Timmers 2019 (T P 3.9e-4), so B; not A, which a multivariate
  result cannot open. The first reading of this row (C, by R-TIER-4) missed Foote's sets on the 200 of 1,701 sets
  first read. Nothing univariate is genome-wide: Timmers' window holds nothing suggestive (its strongest line P 3.0e-4,
  the lead 3.9e-4, the locus's lifespan peak), and Timmers' risk-factor-informed Bayesian scan (Table 2) does not list
  it (D28.7). The seed's ground is Joshi
  2017's Mendelian randomisation (one BMI unit about 7 months of life), a polygenic instrument over many BMI loci, not
  a per-variant result here. The variant's own lifespan evidence is nominal and points one way. Timmers 2019's
  million parents' lives: T longer-lived, P 3.9e-4, UK Biobank and LifeGen both on that side (Pilling's UK Biobank
  fathers P 0.011, both parents 0.081). AncestryDNA, outside UK Biobank and LifeGen: Wright 2019's Supplemental Table
  8, which filters on the AncestryDNA arm's own P (so the line passes on its own, D29.18), has rs10852521 (r² 0.65 in
  CEU, 0.70 in GBR, D′ 1, its T with the lead's T, phased in CEU where the other phase would give r² 0.94) with T and
  longer-lived fathers, genomic-control P 3.6e-5 (born 1886-1918) and 5.7e-4 (1886-1940), and T commoner among older
  customers (P 8.3e-5, viability, confirmation only). Wright's two tables print that one β under different labels, each the
  complement of the allele it counts (Table 8's A for T, in lifespan orientation; Table 9's G for C, on Pilling's
  scale); Pilling's fathers' deposit, which Table 9's UK arm copies with C's sign, fixes it: both read T longer. A
  weaker AncestryDNA line, rs7190492 (r² 0.44 in CEU), is in both tables too. Deelen 2019 leans T's way, one-sided 0.037 at
  the 90th percentile (0.041 at the 99th, a subset of the same cases, so one look-up). Zenin 2019's
  healthspan leans T's way short of nominal (P 0.061 after its genomic control); Park 2025's own survival is flat on
  T's side (P 0.14, its allele columns swapped, as the frequencies show); FinnGen R11's death endpoint leans against
  (C with slightly fewer deaths, P 0.25). None of these lifts B to A (a multivariate result cannot open A,
  D18.3), and nothing contradicts the locus, so not D. Lifespan +, exceptional survival + (Deelen's one look-up,
  one-sided), healthspan + on Foote's frailty factors, read for the healthspan cell as at row 51 (Zenin 2019's
  healthspan leans the same way, P 0.061). Mechanism metabolism, through body weight: the lead tops BMI sets (posterior up to 0.85, C raising
  BMI at P 2.4e-277), and C goes with more diabetes (P 1.5e-97), ischaemic heart disease (P 3.6e-16), higher HbA1c,
  glucose, CRP and blood pressure. Read over all 1,701 of its sets (it tops 380), two
  things run the other way: about 40 lipid sets in which C lowers LDL, total cholesterol and the IDL and very-small-VLDL
  fractions (LDL inverse-normal β −0.021, P 9.8e-43), and a breast-cancer set (luminal A, C −0.020, P 2.1e-15). So the
  longer-lived T raises LDL slightly and breast cancer slightly. A disease and an established risk factor, quoted:
  D18.1's tradeoff, and with it actionability descriptive, not modifiable through weight (D18.2). Put to the lead
  beside modifiable (weight), on the ground that T has less ischaemic heart disease at the same variant. Of 21
  body-weight sets the lead tops, two run against the rest; a bone-density set prints no β. Pleiotropy
  mech:adiposity, broad, tradeoff. Causal C3: in Foote's factor 3 set, led by rs11642015, the lead sits at posterior 0.039 of 70.
  Effector E2, FTO: locus-to-gene 0.986 on that set, with no cis-QTL colocalisation (its two are trans pQTLs). C is the minor allele at 43 %, so T/C, the commonest genotype, is the reference (§6.2): T/T protective, C/C
  risk, as row 8 states its nominal variant. Age of action unknown. The evidence is European.
