    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the usual version of this DNA position, as about 98 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome 10,
          lies inside a gene that does not make a protein (LINC00865), and which gene it might affect, if any, is not
          known. A link between this position and long life was reported once and did not hold up when checked.
      - genotype: G/T
        state: neutral
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 2 in 100 people of European
          ancestry do). One small study of long-lived people from Calabria reported it as more common among them,
          but the same paper's second study leaned the other way, and large studies elsewhere found no link. It says nothing about your own lifespan.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 1 in 10,000 people of European
          ancestry do). One small study of long-lived people from Calabria reported this version as more common
          among them, but the same paper's second study leaned the other way, and large studies elsewhere
          found no link. It says nothing about your own lifespan.
