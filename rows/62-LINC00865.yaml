# The seed list's locus 62, LINC00865 (10q23.1). Curated 2026-11-12. Lead rs11186068, the seed's only rsID, a T/G in
# a LINC00865 intron at GRCh38 10:90,207,407 (GRCh37 91,967,164); G is derived and rare in Europe (0.92 % in gnomAD's
# non-Finnish Europeans, 0.49 % in Finns) but 3.3 % in the Calabrian discovery sample, cases and controls together
# (about 6 % and 1.2 %, derived from the OR), and about 9 % in East Asians and Africans. Entered by tracks A, B and E from Beccacece 2026's exploratory Calabrian GWAS (GCST90726611), its one
# genome-wide hit; locus 109 (PSMF1/RSPO4) is the same paper's. Read from the abstract and the journal's supplementary
# tables: the main text is not open, and the CC BY preprint could not be fetched (pmid-42176242, the note's head).
locus_id: 62
locus_name: LINC00865
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's C (D25.1): a genome-wide discovery that fails a powered test in its own ancestry, with no
  independent scoring-class study at p < 0.05 its way. Beccacece 2026 compared 299 long-lived Calabrians with 406
  younger controls (ECHA and GEHA cohorts) in a mixed model for relatedness: G was more common among the long-lived,
  Beta +1.728 per copy (OR 5.63; SE 0.31, derived), P 2.87e-8, the study's only genome-wide locus among 22
  suggestive ones; in the 315 unrelated people G keeps its direction, OR 4.73, P 0.006. The authors call the
  findings preliminary and the study exploratory, and say most of their loci did not replicate in external
  datasets. Their own replication, in the SICS cohort (Table S6; its ancestry and design inferred from the acronym
  as the Southern Italian Centenarian Study, which no quote states; G at 1.8 % there, a European frequency), gives G the opposite sign,
  Beta −0.910, P 0.10. On one scale (Beta against Beta, so no calibration under D25.3), at SICS's standard error (0.555,
  backed out of its P), the discovery's effect gives one-sided power 0.93 and heterogeneity P 3e-5 (both derived), a
  red flag under D21, so `replication_failed`; on the unrelated subset's estimate it is power 0.87, P 0.002. The
  flag is fragile: 80 % power needs a log OR of 1.38, 80 % of the discovery's, and at half its effect power falls to
  0.46. SICS's size, design and any overlap with the Calabrian sample are unread (the main text is not open); it is
  read as independent on the abstract's "external datasets" and on Table S6 setting the cohorts side by side. The
  abstract's "external datasets" is plural and names a meta-analysis, so the unread text may hold another look-up
  of the lead; the one variant it calls confirmed is intronic, while the authors annotate rs11186068 as intergenic
  and Table S7 lists no eQTL for it. Among the studies read, none leans G's way at p < 0.05: LifeGen's parental lifespan G +0.027 (P 0.26, one-sided 0.13, both
  arms the same sign), Park 2025's UK Biobank own survival G −0.0041 on the Martingale residual, fewer deaths (P
  0.29, one-sided 0.15; the deposit's columns swapped as at 13 and 61), against FinnGen R11's any-death endpoint,
  G log OR +0.051 for death (P 0.38), and Deelen 2019's 90th percentile, G −0.088 (P 0.53); Deelen's 99th file has
  no line for the lead or any of its 20 CEU proxies (r² ≥ 0.75; the r² 1.0 tags rest on a few copies). The proxies
  agree with the lead: Deelen's 90th holds five, each leaning against G, none nominal (best P 0.20); FinnGen holds
  all 20, each with G's partner on the side of more deaths (best P 0.21); LifeGen's 20 lean G's way, the best at
  one-sided 0.093 (pmid-31413261#q165, db-finngen-r11#q44, pmid-30642433#q283). One weaker tag, rs74904474 (r² 0.50
  in 1000 Genomes Tuscans, outside the paper's r² ≥ 0.6 list), leans G's way in LifeGen at P 0.0063 (one-sided
  0.003, "++", info 0.86, its frequency varying about twentyfold across cohorts; pmid-30642433#q282), but LifeGen
  tests the lead itself and that line is flat, so the proxy does not stand in for it (D29.3): named, not counted. G is rare in Europe (0.9 %), so these look-ups are far less precise than their sizes
  suggest. Zenin 2019's healthspan leans G's way, P 0.51. Outcome: lifespan 0, healthspan 0, exceptional survival 0
  (D28.10: a D row's discovery gives no `+`); the 0 is close, SICS leaning against G at one-sided 0.0506. The GWAS Catalog holds Beccacece's association alone, mapped to
  LINC00865, so mechanism general ageing and no pleiotropy. Open Targets 26.09 holds no record of the variant (no
  credible set, no locus-to-gene): causal C4, effector E4, no gene; the intron names the locus, not an effector.
  Descriptive. Every test is European, and G, about 9 % in East Asians and Africans, is untested there:
  eur_only_evidence. APOE ε4 and FOXO3 showed nothing in this sample (ε4 OR 0.66, P 0.12). Age of action unknown: the
  case and control ages are not read. A D row carries no protection token and every genotype is neutral.
