  - rsid: rs35705950
    locus: {chrom: "11", start: 1219991, ref: G, cites: [db-ensembl-116#q894]}  # rs35705950 is multi-allelic (G/A/T); the row means G>T
    gene: ""
    phenotype: MUC5B promoter variant, lifespan
    trait_efo_id: OBA_VT0005372
    effect_allele: G
    effect_size: -0.00509
    effect_measure: beta
    stat_significance: suggestive
    direction: protective
    negatives: >-
      The more common version, G, which goes with the longer life here, is the one linked to more severe COVID-19 needing
      hospital care in large studies.
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (about 79 in 100 people of European ancestry
          do). It is the reference the other combinations are compared with. The position lies just before the MUC5B
          gene on chromosome 11, which makes mucus in the airways.
      - genotype: G/T
        state: risk
        conclusion: >-
          You carry one copy of the T version of this DNA position (about 20 in 100 people of European ancestry do). T
          raises the activity of MUC5B, a gene that makes airway mucus, and is a well-known risk version for a lung
          scarring disease, idiopathic pulmonary fibrosis. A large UK study found T slightly more often among men who
          died earlier, a finding just short of the usual bar for certainty, and a Finnish study found it with more
          deaths too. This is weak, early evidence: a possible tendency, not destiny.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of the T version of this DNA position (about 1 in 100 people of European ancestry do). T
          raises the activity of MUC5B, a gene that makes airway mucus, and is a well-known risk version for a lung
          scarring disease, idiopathic pulmonary fibrosis. A large UK study found T slightly more often among men who
          died earlier, a finding just short of the usual bar for certainty, and a Finnish study found it with more
          deaths too. The studies counted copies one at a time, so nothing separate is known about two. This is weak, early evidence: a possible tendency, not
          destiny.
