# The seed list's locus 138, MUC5B/MUC5AC (11p15.5). Curated 2026-11-16. Lead rs35705950, the seed's only rsID (Park
# 2025's men's own-survival scan): GRCh38 11:1,219,991, multi-allelic G/A/T, GRCh37 11:1,241,221; the row means G>T.
# On MUC5B's MANE Select transcript T is 3,075 bases upstream, in the promoter region. T is at 0.110 in gnomAD's
# non-Finnish European genomes, 0.115 in the Finnish and 0.007 in the East Asian; T is the discovery's shorter-lived
# allele. Open Targets 26.09 holds it in 67 credible sets, none of a lifespan-class study; the GWAS Catalog
# (2026-10-29) holds Park's men's line and many lung and blood-count associations.
locus_id: 138
locus_name: MUC5B/MUC5AC
verdict: kept
verdict_reason: >-
  Tier C, the seed's: a sub-genome-wide discovery (R-TIER-4), however its look-ups read. Park 2025's own-survival GWAS
  in UK Biobank calls the line borderline and in males: the men's deposit (180,970 men) gives T β +0.00955 on the
  Martingale residual (SE 0.00177, more deaths), P 6.6e-8, short of the paper's 5e-8; the whole cohort +0.00509 (SE
  0.00106), P 1.3e-6; the women +0.00131 (SE 0.00124), P 0.29 (each deposit's columns swapped, as in all three files).
  The two sexes differ at P 1.4e-4, both errors counted (derived). The authors' own look-up in FinnGen's "Death"
  (both sexes, N 453,733, outside UK Biobank) puts T with more deaths, β +0.034, which they call a significant
  association (Supplementary Table 2 prints P 6.0 with its exponent lost in extraction; the release's 0.006 fixes it,
  one-sided 0.003); under APOE's Park-to-FinnGen factor (8.1) the whole cohort
  expects +0.041 (the whole cohort's effect for a sex-combined sample, D28.2), against which FinnGen's +0.034
  agrees (heterogeneity P 0.64, derived). That is an independent
  nominal pass in the discovery's direction; it does not lift a sub-genome-wide hit past C (R-TIER-4). Timmers 2019's
  parental lifespan agrees, T beta1 −0.0232 (SE 0.0066), P 4.6e-4, and Pilling 2017's parents too (both parents'
  attained age P 0.015; fathers P 0.0035, mothers 0.18; both parents in the top 10 %, T fewer, P 0.017), but both
  are UK Biobank's parents and not independent of a UK Biobank discovery (D31.3); no LifeGen-only or per-sex
  LifeGen file is deposited. Deelen 2019 (no UK Biobank data) leans the other way at both percentiles, flat: T
  +0.0587 (SE 0.0516), P 0.26 at the 90th, +0.139 (SE 0.088), P 0.12 at the 99th. Carried by APOE's own ratio of
  Deelen's ε4 log OR to Park's ε4 β (−39.6 at the 90th, −50.7 at the 99th), the whole cohort's +0.00509 expects
  −0.20 and −0.26: power 0.99 and 0.90, heterogeneity P 9e-5 and 1.2e-4 counting the discovery's error (derived). That is D25.3's APOE calibration, here from Park's scale (the arithmetic D31.12 uses toward
  it); the second calibration, a mean over loci on Park's scale (D25.12), cannot be computed, so whether Deelen is a
  red flag is unknown and the row carries no `replication_failed` (D26.3, as 13). Even a flag would not make it D:
  FinnGen's independent pass in the discovery's direction stands (D25.1, as 130). Zenin 2019 flat (T β −0.0066, P 0.39). Foote 2025's deposits hold no line at the
  lead (untested). Wright 2019's AncestryDNA tables list nothing at the lead under their P 0.003 cut (unknown above
  it); their strongest line within 500 kb, the fathers' rs10082701 416 kb away (P 5.6e-6), does not tag it (Ensembl's pairwise LD answers an empty list for the two in CEU, r² under its 0.05 floor). The literature search (the rsID with lifespan, longevity, mortality or survival, 2026-11-16;
  Semantic Scholar answered 429, its part unchecked) finds no other population lifespan test; its survival papers are
  within patients with pulmonary fibrosis (Peljto 2013, PMID 23695349, where T carriers survived longer after
  diagnosis; a 2026 Brazilian cohort with no difference), a different question, named, not read. `sex_specific:m` by D29.16: Park's men against women differ (P 1.4e-4) from the deposits; named
  beside it, Pilling's fathers against mothers do not (P 0.27), but that contrasts the parents' sexes on the
  per-parent scale, which no source converts to Park's own-survival scale, so it cannot exclude Park's difference;
  FinnGen's both-sexes pass is consistent with a men's effect (D35.2). Genotypes: G/G the reference, T carriers risk, as weak early evidence; the variant is carried on G, the
  longer-lived allele (§6.2), and `PROTECT:ABSENCE_OF_RISK`: G is the common non-risk allele at a genome-wide
  disease locus, idiopathic pulmonary fibrosis (D26.5, D30.6). Exceptional survival 0 (Deelen flat, leaning against);
  lifespan + (FinnGen, the paper's look-up, independent, one-sided 0.003; Timmers agrees, UK Biobank shared);
  healthspan 0 (Zenin flat). Mechanism smoking and lungs: T is the established idiopathic pulmonary fibrosis risk
  allele (Open Targets' fibrosis set at PIP 1, T β +1.25, P 8e-100) and raises MUC5B expression in lung (GTEx v10, PIP
  1.00), as the authors note; `mech:lung`, and `mech:blood_count` (T raises white-cell count, a set at PIP 1.00, β +0.048). `tradeoff` (D18.1): G, the
  longer-lived allele, is the side with more severe COVID-19 (T OR 0.89 for hospitalisation and 0.86 for critical
  illness, P 4e-14 each, the GWAS Catalog's lines with T named; Open Targets' hospitalisation sets at PIP 1.00 agree;
  a 'severity' line whose effect allele the catalogue prints as '?' is set aside). The 67 Open Targets sets, read
  whole: lung disease, COVID-19, blood counts, creatinine and bicarbonate, and lung QTLs of MUC5B, none a
  lifespan-class study. Causal
  C4 and effector E4: no lifespan-class credible set. Descriptive. Age of action unknown. The evidence is European.
