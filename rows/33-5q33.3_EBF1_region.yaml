variants:
  - rsid: rs2149954
    gene: ""
    phenotype: 5q33.3 region, reaching 90
    trait_efo_id: OBA_VT0005372
    effect_allele: T
    effect_size: 1.10
    effect_measure: OR
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA region, as about 4 in 10 people of European
          ancestry do. It is the reference the other combinations are compared with. The region, on chromosome 5,
          lies between genes, and which gene it acts through is not known.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of a version of this DNA region that about half of people of European ancestry carry
          once. In a large European study, people who reached 90 carried it slightly more often than younger
          people did, and a study of more than half a million people's parents found they lived a little longer, by a smaller
          amount than first reported. The same version goes with lower blood pressure and fewer deaths from stroke, though
          that does not seem to explain all of the effect. It is a small tendency, not a guarantee.
      - genotype: T/T
        state: protective
        conclusion: >-
          You carry two copies of a version of this DNA region (about 1 in 8 people of European ancestry do). In a
          large European study, each copy went with a slightly higher chance of reaching 90, and a study of more than
          half a million people's parents found each copy went with a little longer life, by a smaller amount than first
          reported. The same version goes with lower blood pressure and fewer deaths from stroke, though that does not seem to
          explain all of the effect. It is a small tendency, not a guarantee.
