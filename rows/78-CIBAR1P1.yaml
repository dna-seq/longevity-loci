# The seed list's locus 78, CIBAR1P1 (15q15.1; the seed's genes CIBAR1P1 and INO80). Curated 2026-11-13. Lead
# rs28455998 (Rosoff 2023's mvAge, Supplementary Tables 6, 7 and 10), the seed's only rsID: intergenic, 22 kb from
# INO80, an A/T SNP with T at 0.50 in Europeans (0.59 in CEU), T the healthier-ageing side. Atkins 2021's frailty locus
# sits 13 kb away at rs3959554 (r² 0.71 in CEU, 0.77 in GBR). Open Targets 26.09: 143 credible sets hold the lead, none
# of an ageing or lifespan study; the GWAS Catalog (2026-10-29) holds mvAge and renin-angiotensin medication use there.
locus_id: 78
locus_name: CIBAR1P1
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it, rows 24 and 69's shape: a genome-wide multivariate result with a co-occurring lifespan
  study (§4.5 as D16 reads it); a multivariate result does not meet tier A's first criterion (D18.3), so B is the cap
  unless an independent replication meets it, and none does. Rosoff 2023's mvAge, the common factor behind healthspan,
  frailty, exceptional longevity, parental lifespan and epigenetic age, is genome-wide at rs28455998: T on the
  healthier-ageing side, β +0.0057 (SE 0.0010), P 1.87e-8, heterogeneity Q P 0.15; Rosoff's own fine-mapping gives it a
  posterior of 0.034. Timmers 2019's million parents' lives are the co-occurring lifespan study: T
  longer-lived, P 0.0094, UK Biobank and LifeGen on the same side; an input of mvAge, not a replication. The lead is an
  A/T SNP near 50 %, so its strand is read from non-palindromic neighbours, and phase from CEU, where the frequencies
  decide it (in GBR and pooled Europeans both phases fit). Rosoff calls the locus known through frailty: Atkins 2021's
  frailty index (UK Biobank and TwinGene, n 175,226) is genome-wide at rs3959554, A less frail, P 1.7e-8, and the
  lead's T rides with that A (r² 0.71, D′ 1 in CEU; the other phase caps r² near 0.34). At the lead itself Rosoff's
  look-up gives frailty P 2.0e-7, short of genome-wide, so frailty anchors nothing at the lead (D29.3, D29.17, D30.8), and A would
  in any case need an independent replication in a scoring class (D22.2, D23). None passes. Deelen 2019's 90th and
  99th percentiles lean T's way, short of nominal (one-sided 0.056 and 0.073; the 90th is mvAge's own input), and
  rs3959554's opposite signs there confirm the strand. Wright 2019's AncestryDNA fathers, outside mvAge's inputs, hold
  three representative SNPs of the signal in Supplemental Table 9 (each UK arm Pilling's fathers' line digit for
  digit, which fixes the allele), and none of the three counts under D30.1: with each AncestryDNA arm at z = 0, the
  meta of the printed arms, deflated as the printed meta is (factors 1.17 to 1.20), is P 0.034 at rs11855102, 0.14 at
  rs1678750 and 0.13 at rs1869907, all above the table's 2.5e-3, so each line was selected by its own AncestryDNA arm
  (derived). Named: rs11855102's AncestryDNA arm puts T (with the lead's T) on the longer-lived side at raw one-sided
  0.043, about 0.057 after the fathers' genomic control (λ 1.182); rs1678750 (r² 0.98, raw P 0.0052) and rs1869907
  (r² 0.90, raw P 0.0017) lean the same way more strongly. FinnGen R11's
  death endpoint leans against (T β +0.0058 on the log odds of death, P 0.45) and Park 2025's own survival is flat
  (P 0.90 at the lead, 0.86 at rs3959554, under its swapped allele columns). The red flag is unknown (D29.11, D30.8): D21 scales from the discovery's own effect, and mvAge's has no conversion
  to these scales. Scaled from Timmers instead, Deelen's 90th is powered only under APOE's factor (0.81) and agrees
  with the expectation (heterogeneity P 0.50; under the mean factor power 0.28), the 99th is not powered, AncestryDNA
  at rs11855102 (power 0.83 against the UK arm) agrees with it (heterogeneity P 0.50), and FinnGen's scale conversion
  is printed nowhere (D28.1). Healthspan +: frailty suggestive at
  the lead (genome-wide at the proxy), and Zenin 2019's healthspan at the lead, T delaying its end at P 0.0024 after the 1.053 genomic
  control (D26.1), both UK Biobank and mvAge inputs. Lifespan + on Timmers. Exceptional survival 0: Deelen leans T's
  way at neither percentile nominally. Mechanism: ageing in general (D25.7). The lead tops one credible set, a GWAS of
  renin-angiotensin medication use (PICS, P 1e-9, posterior 0.034), A raising it, so the longer-lived T goes with less
  use of these blood-pressure drugs; at rs3959554, whose A the lead's T rides with, A lowers coronary artery disease
  (OR 0.97, P 7e-9) and coronary atherosclerosis sets give G the higher risk. The other 141 sets at the locus, mostly
  blood pressure and hypertension, also eGFR, height, blood counts, white-matter imaging and lung function, are led
  by other variants, the lead at a posterior of 0.03 or less, and are not read for direction. The longer-life T is on
  the lower-risk side of what is phased, so no trade-off (D18.1); nothing shows the effect runs through blood
  pressure, so pleiotropy mech:cvd and broad, actionability descriptive. Causal C4 and effector E4, no gene named: no
  credible set of a lifespan-class study holds the lead (none of the 143 is of an ageing, frailty or lifespan study);
  INO80, 22 kb away, is the nearest gene, with a null TWAS in Rosoff (P 0.11), named only. T is at about 50 % in
  Europeans, so A/T, the commonest genotype, is the reference (§6.2): T/T protective, A/A risk, no PROTECT token, as
  row 24. Age of action unknown. The evidence is European.
