variants:
  - rsid: rs28455998
    gene: ""
    phenotype: INO80 region (15q15.1), healthier ageing
    trait_efo_id: EFO_0007796
    effect_allele: T
    effect_size: 0.0057
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: risk
        conclusion: >-
          You carry two copies of one of two common versions of this DNA position (about 25 in 100 people of
          European ancestry do). In very large European studies that combined healthspan, frailty, long life and
          biological age into one measure, each copy went with slightly less healthy ageing, and parents of carriers
          lived a little less long. The same stretch of DNA goes with slightly more coronary heart disease and more
          use of blood-pressure medicines in other studies. It is a likely finding, not a settled one: it rests on
          one combined analysis, and separate groups of people mostly leaned the same way without confirming it. The
          effect is small and it is a tendency, not destiny.
      - genotype: A/T
        state: neutral
        conclusion: >-
          You carry one copy of each common version of this DNA position (about 50 in 100 people of European
          ancestry do, the most common combination). It is the reference the other combinations are compared with.
          The position, on chromosome 15, lies between genes, near INO80. The finding comes from people of European
          ancestry; less is known elsewhere.
      - genotype: T/T
        state: protective
        conclusion: >-
          You carry two copies of one of two common versions of this DNA position (about 25 in 100 people of
          European ancestry do). In very large European studies that combined healthspan, frailty, long life and
          biological age into one measure, each copy went with slightly healthier ageing and less frailty, and
          parents of carriers lived a little longer. The same stretch of DNA goes with slightly less coronary heart
          disease and less use of blood-pressure medicines in other studies. It is a likely finding, not a settled
          one: it rests on one combined analysis, and separate groups of people mostly leaned the same way without
          confirming it. The effect is small and it is a tendency, not destiny.
