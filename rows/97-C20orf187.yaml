    genotypes:
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of each version of this DNA position, as about half of people of European ancestry do.
          It is the reference the other combinations are compared with. The position, on chromosome 20, lies near
          genes whose role here is not known.
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the T version of this DNA position (about 1 in 3 people of European ancestry do).
          A very large British study found the fathers of people with T lived a little longer, but a similarly large
          American study did not find it, so it is not counted for or against lifespan.
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the C version of this DNA position (about 1 in 6 people of European ancestry do).
          A very large British study found the fathers of people with C lived a little shorter lives, but a similarly
          large American study did not find it, so it is not counted for or against lifespan.
