# The seed list's locus 97, C20orf187 (20p12.2). Curated 2026-11-14. Lead rs6108784, the seed's only rsID (Pilling
# 2017's fathers-only SNP): upstream of LINC02871 (the paper's C20orf187), GRCh38 20:10,983,718, GRCh37 20:10,964,366,
# T/C, C ancestral, T 0.59 in non-Finnish Europeans and the longer-lived fathers' allele.
locus_id: 97
locus_name: C20orf187
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's B (D25.1): a genome-wide discovery that fails a powered test in its own ancestry, with no
  independent scoring-class study at p < 0.05 its way. Pilling 2017's GWAS of UK Biobank participants' fathers'
  attained age puts T with longer-lived fathers, β −0.0143 (SE 0.0022) on the Martingale residual, P 1.2e-10,
  genome-wide in a stratum (D19.2); mothers flat (P 0.78; fathers against mothers heterogeneity P 1.3e-5), both
  parents 7.7e-4, top 1 % 0.057. Wright 2019 tests it in AncestryDNA's 309,383 fathers, outside UK Biobank, at
  rs6077996 (8.5 kb away, r² 0.92 and D′ 1.00 in CEU; its UK arm is Pilling's fathers' line digit for digit, so its A
  rides with the lead's T): the AncestryDNA arm is flat the other way, A +0.0009 (SE 0.0026), raw P 0.72, against the
  UK arm's −0.0132 (SE 0.0022), heterogeneity P 1.9e-4 printed (4.5e-5 with both errors), one-sided power 1.00 on
  one scale with no conversion: a D21 red flag, and `replication_failed`. Wright's Table 3 lists the locus as "Not
  Replicated", and the authors offer that such loci may not affect parental lifespan. No independent look passes:
  LifeGen's fathers without UK Biobank (Timmers 2019's Figure 2 source data, sample b) lean T's way, one-sided 0.15
  (power 0.91, heterogeneity P 0.083, short of a flag); Deelen 2019 leans against (90th P 0.81, 99th 0.43), a flag
  under APOE's factor only from Pilling's both-parents effect (D28.2), so none (D25.3); FinnGen R11's death endpoint
  T's way, one-sided 0.18, no flag on the per-self scale (power 0.74; D30.12), a database line that sets nothing
  either way. Within UK Biobank, Timmers 2019's pooled parents (T longer, P 8.1e-5, "++", UK Biobank inside) and
  Park 2025's own survival (flat, P 0.81, its allele columns swapped) are not independent of the discovery. So D, as
  89 and 26. Outcome cells on a D row (D28.10): lifespan 0, the contradicted discovery and Timmers, which holds it,
  giving no +, and no look gives p < 0.05 against T; exceptional survival 0 (Pilling's top 1 % and Deelen flat);
  healthspan 0: Zenin 2019 flat (T later, one-sided 0.093), and Foote 2025's disability factor has T less frail at P
  0.009, one factor of the five readable, multivariate and unreplicated, named only. Mechanism general ageing, as on
  every D row (D25.7); pleiotropy empty, no longer-life allele left to weigh it against: Pilling's fathers' set (Open
  Targets SuSiE-inf, the lead at posterior 0.70) colocalises with 31 GWAS sets, blood pressure and bone density with
  C on the shorter-lived side, and the GWAS Catalog holds C raising blood pressure as a metabolic-syndrome component
  (OR 1.07, P 2e-8), named. Descriptive. Causal C1 by §4.2's threshold (posterior 0.70). Effector E3, no gene named:
  locus-to-gene is under 0.5 for every gene (JAG1 0.49), and the set's 46 QTL colocalisations split between LINC02871
  (29) and the unnamed ENSG00000270777 (17), a rival holding over a tenth (D24). Every genotype neutral (D25.2); C/T,
  about 48 in 100 Europeans, the reference. Age of action unknown. The evidence is European (UK Biobank, AncestryDNA's
  European-ancestry group, LifeGen, Deelen, FinnGen).
