variants:
  - rsid: rs646776
    gene: ""
    phenotype: LDL cholesterol and heart disease
    trait_efo_id: EFO_0007796
    effect_allele: C
    effect_size: 0.2234
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 61 in 100). It is the reference the other versions are compared with, so it neither raises
          nor lowers your expected lifespan here. The region, on chromosome 1, acts on genes in the liver that
          help set LDL cholesterol, the "bad" cholesterol. A standard cholesterol test your doctor
          can order shows your actual LDL level, which matters far more than this DNA result. The finding comes
          from people of European ancestry; less is known elsewhere.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 34 in 100 people of European
          ancestry do). This version goes with lower LDL cholesterol, the "bad" cholesterol, and in large British
          and American studies its carriers had parents who lived on average a little over a month longer, most
          likely through less heart disease. Another large study did not see the effect, so it is a likely finding
          rather than a settled one; the effect is small, a tendency, not a guarantee.
          A standard cholesterol test your doctor can order shows your actual LDL level, which matters far more than this DNA result.
      - genotype: C/C
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 5 in 100 people of European
          ancestry do). This version goes with lower LDL cholesterol, the "bad" cholesterol, and in large British
          and American studies each copy went with parents living on average a little over a month longer, most
          likely through less heart disease. Another large study did not see the effect, so it is a likely finding
          rather than a settled one; the effect is small, a tendency, not a guarantee.
          A standard cholesterol test your doctor can order shows your actual LDL level, which matters far more than this DNA result.
