# The seed list's locus 6, CELSR2 (1p13.3, the CELSR2/PSRC1/SORT1 lipid locus). Curated 2026-11-11, the ten-row run's
# first row. Lead rs646776 (the seed's; McDaid 2017's Bayesian scan, not in this corpus): rs602633 (Pilling 2017),
# rs4970836 (Timmers 2019) and rs599839 (Wright 2019) share its credible set and appear only as proxies on their studies.
locus_id: 6
locus_name: CELSR2
verdict: kept
verdict_reason: >-
  Tier B, down from the seed's single-track A (§12), on red-flag heterogeneity, row 53's shape. Genome-wide
  significant for parents' attained age in UK Biobank (Pilling 2017, rs602633, P 2.7e-8; fathers 3.6e-9), and
  replicated in AncestryDNA, the mostly American sample outside UK Biobank, with the same allele: fathers P 1.7e-3
  and mothers P 7.5e-3, with no heterogeneity against the UK Biobank arm (P 0.19 and 0.78), the fathers'
  meta-analysis reaching P 4.4e-9 (Wright 2019). But in LifeGen with UK Biobank's lives removed, the other sample
  independent of the discovery, Pilling's rs602633 is flat (Timmers 2019's Figure 2 source data: T +0.0002, SE
  0.0096, against the discovery's +0.0296, SE 0.0053; one-sided P 0.49), at power about 0.92 and heterogeneity P
  about 0.0075 (derived). That comparison is not on one scale as the previous text said: Timmers' sheet prints
  Pilling's effect carried over by APOE's factor. The lead's derivation (D28.9) takes LifeGen out of Timmers' own
  pooled β (Figure 4, 0.0218, SE 0.0047, pmid-30642433#q273), which leaves UK Biobank at 0.0285 on Timmers' scale, and the flag holds there (power
  0.91, heterogeneity P 0.010). It needs at least 0.81 of the discovery's effect to hold; AncestryDNA's independent
  arms run at 0.63 (fathers) and 1.15 (mothers) of UK Biobank's, so a smaller true effect would undo it on the
  fathers' ratio. No winner's-curse shrinkage is applied: D21 calibrates from the discovery's effect. A powered
  failure, then, which caps the row at B (§4.1, D21) and carries
  `replication_failed` (D25.13), though AncestryDNA replicates (the 67/71 rule). This row was written before that sheet
  was first read (for row 71); the D27.9 sweep found it. The two arms pooled give about P 1.1e-6, which is why Timmers 2019's million
  lives give only 1.4e-6 by the conventional test (genome-wide only in its lipid-informed Bayesian scan, a B ground by
  D28.7 that the row, B on other grounds, does not need). Deelen 2019's 90th and 99th percentiles are null (P 0.16 to 0.52, all on the lifespan-raising
  side); calibrated from Pilling's effect (D27.9) they flag under APOE's factor (power 1.00 and 0.99, heterogeneity
  P 0.0007 and 0.007) and not under the loci's mean factor (power 0.83, P 0.18; 0.50, P 0.33), so no flag there
  (D25.3); healthspan is nominal (Zenin 2019's
  summary statistics, P 1.2e-4). The lifespan-raising allele is the rarer one, which lowers LDL cholesterol, so the
  protection is a presence. The lead is the seed's rs646776 rather than a study's reported SNP: it sits in Pilling's
  fathers' credible set at PIP 0.11 (the reported SNPs at 0.05 to 0.07) and at r² 0.94 to Wright's lead. Effector E3,
  no gene named (D24): SORT1 (0.99) and CELSR2 (0.97) both pass locus-to-gene and both colocalise with cis QTLs, and
  PSRC1 holds the most cis colocalisations (56 of 114; CELSR2 38, SORT1 16); the expression analysis of Timmers 2019
  names PSRC1. Age of action is unknown: Timmers 2019's age bands at rs4970836 (r² 0.90 with the lead, D′ 0.97) are
  lowest at 80-90 in both parents, but mothers' rise from 60-70 to 70-80 first and the age moderator is null (P 0.24),
  so they show no class (Figure 5 source data). Timmers 2019's figure source data labels rs4970836's alleles the other
  way round from its table; the table, the frequencies and the biology agree, and are followed. All four seed rsIDs
  are one signal here.
