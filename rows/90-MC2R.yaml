variants:
  - rsid: rs28926173
    gene: ""
    phenotype: MC2R region, parents' longevity
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: 0.0264
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 91 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome 18,
          lies in the MC2R gene, the receptor for the stress hormone signal ACTH. The finding comes from people of
          European ancestry; less is known elsewhere.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of a rarer version of this DNA position (about 9 in 100 people of European ancestry do).
          In a very large British study, people carrying it were somewhat more likely to have both parents reach the
          oldest tenth of lifespans, and their parents lived a little longer. No separate study has confirmed it, so
          this is a likely finding, not a settled one. The effect is small and it is a tendency, not destiny.
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of a rare version of this DNA position (about 2 in 1,000 people of European ancestry
          do). In a very large British study each copy went with a somewhat higher chance of both parents reaching the
          oldest tenth of lifespans. Too few people carry two copies to say what two copies do beyond that. No separate
          study has confirmed it, so this is a likely finding, not a settled one: a tendency, not destiny.
