# The seed list's locus 90, MC2R (18p11.21). Curated 2026-11-13. Lead rs28926173, the seed's only rsID (Pilling
# 2017's top-10 % lead): an intron of MC2R, GRCh38 18:13,886,720 G/A, GRCh37 18:13,886,719, A the rare allele (0.048
# in non-Finnish Europeans) and the longer-lived side. Open Targets 26.09 has no record of the variant; the GWAS
# Catalog (2026-10-29) holds Pilling's two parental-longevity associations.
locus_id: 90
locus_name: MC2R
verdict: kept
verdict_reason: >-
  Tier B, the seed's; row 68's shape. Genome-wide in one analysis of one study: Pilling 2017's binary GWAS of both
  parents reaching the top 10 % of survival in UK Biobank (7,182 participants whose mothers reached 90 and fathers 87,
  against 79,767 whose parents both died before 80), where the rare A raises the chance (G's β −0.0264 on the case
  indicator, P 2.3e-8; "just reached significance", 15.7 % more likely), with parents' attained age at P 6.4e-6 (A
  longer, the deposit), age at death 2.4e-5, mothers 2.4e-4 and fathers 0.025 in the same people. A single genome-wide study, B by §4.1. Nothing independent replicates it and nothing powered contradicts it: Timmers 2019 tests the lead itself in LifeGen with UK Biobank removed (Figure 2 source data), A +0.038 (SE 0.023), the same side at one-sided P 0.052, not nominal; on the sheet's own scale its one-sided power at the discovery's β is 0.64 and heterogeneity P 0.73, so no red flag there. Within UK Biobank the rest agrees: Timmers 2019's million parents' lives, A longer, P
  3.9e-5, "++" in UK Biobank and LifeGen, but holding Pilling's parents, so not independent; Park 2025's own survival,
  A with fewer deaths, P 0.022 (its allele columns swapped), the same participants; nothing within 1 Mb in Timmers
  passes 3.8e-5. Outside it: Deelen 2019's 90th percentile leans against A, flat (P 0.34, one-sided 0.17 against), the
  99th flat (P 0.87); FinnGen R11's death endpoint flat (P 0.85). Wright 2019's AncestryDNA has no line at the lead and
  none Ensembl links to it (its nearest lines, 300 to 500 kb away, have no CEU LD pair to the lead), so AncestryDNA is
  untested; Foote 2025's frailty deposits and Rosoff 2023's mvAge tables hold no line. Against Deelen and FinnGen the red flag is unknown: the discovery's β is on a binary case scale for parents with no published conversion to their scales (D28.1, D26.3). The rsID literature search (Europe PMC, OpenAlex, PubMed, Crossref, preprints; Semantic Scholar answered 429, so its part is unchecked) finds no other lifespan study of the lead. Exceptional survival + (Pilling's top-10 % analysis, the discovery), lifespan + (Pilling's attained
  age and Timmers, nominal, the same biobank), healthspan 0 (Zenin 2019, A later, P 0.28). Mechanism ageing in
  general: MC2R encodes the ACTH receptor of the adrenal cortex, named, with no set or test showing the effect runs
  through it; pleiotropy empty (no other association at the lead), descriptive. Causal C4 and effector E4, no gene
  named: Open Targets has no record of the variant, so no credible set, locus-to-gene or colocalisation; MC2R is named
  in prose. G/G, about 91 in 100 Europeans, is the reference (§6.2); A/G and A/A protective, PROTECT:PRESENCE. Age of
  action unknown. The evidence is European (UK Biobank).
