# The seed list's locus 85, DHODH (16q22.2; the seed's genes DHODH and HP). Curated 2026-11-13. Lead rs12924886,
# the seed's only rsID (Timmers 2019's HP lead, Table 1): an intron variant of a lncRNA between TXNL4B and HP, A/T, A
# the common allele (0.81 in Europeans) and the longer-lived side. Open Targets 26.09 holds it in 945 sets; it tops
# Timmers' own parental-lifespan set and 14 lipid sets.
locus_id: 85
locus_name: DHODH
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: genome-wide in one study with no independent replication (§4.1). Timmers 2019's million
  parents' lives, the conventional analysis: A, the common allele, adds 0.28 years of life per copy, P 1.4e-8, past
  the paper's own 2.5e-8, UK Biobank and LifeGen on the same side; one of the five loci first found there. Row 12's
  shape, without row 12's replication. Outside UK Biobank and LifeGen nothing passes: Deelen 2019's 90th and 99th
  percentiles put A on the shorter-lived side, flat (P 0.79, 0.50); Wright 2019's AncestryDNA has no line at the lead,
  and its two Table 9 SNPs nearby (rs9928413 in the mothers, r² 0.53 in CEU; rs17604662 in the fathers, 0.48), each
  counted under D29.18 (UK arms P 6.9e-4 and 9.6e-4), share their UK arms' signs at P 0.18 and 0.17, no pass on either
  allele's reading, at proxies too weak to carry the lead (Table 8's rs2303220 has no LD Ensembl reports); FinnGen R11's death endpoint leans A's way, flat (P 0.69). No red flag
  (D21, D25.3): calibrated from Timmers' β (A +0.0280), Deelen's 90th would flag under APOE's factor (power 1.00,
  heterogeneity P 4e-5) but under the mean factor its power is 0.72, short of 0.8 (heterogeneity P 0.020; it would reach 0.8 at about
  1.12 times Timmers' effect); the 99th the same (0.95 and P 5e-4; 0.40); a flag under one calibration only is
  none. Timmers 2022's survival look-ups, Timmers 2020 and Rosoff 2023 hold no line for the lead. So B, not D, and no
  `replication_failed`; Deelen's lean against is said here. In UK Biobank the rest agrees or is flat: Pilling's both
  parents A P 2.8e-4 (inside Timmers), Park 2025's own survival flat (P 0.87, its allele columns swapped, as the
  frequencies show), Zenin 2019's healthspan A later, flat (P 0.14 after genomic control). Foote 2025's frailty factors
  are not genome-wide at the lead (the multimorbidity factor A less frail, P 0.026; limited social support 0.0039; the
  general factor's and factor 4's deposits hold no line in the window, Q-filtered as at row 59); Foote's nearest set,
  multimorbidity at rs7187129 (P 1.7e-10), is 214 kb away with no European LD to the lead. So D27.3's assumption that
  Foote reaches HP does not hold, as at row 59. Lifespan +, healthspan + (Foote's factors at the lead put A less frail, multimorbidity P 0.026 and limited social support P 0.0039, read for the healthspan cell as at rows 51 and 83; Zenin leans the same way), exceptional survival 0 (Deelen leans against,
  not significantly, so not − under D28.3). Neither sex nor age moderates the effect in Timmers' Figure 5 (P 0.11,
  0.91); the bands peak in fathers at 60-70 and mothers at 70-80, the rest flat, so no age class. Mechanism heart and vessels, through lipids and coronary disease: Timmers files the locus as
  cardiometabolic; of the 21 sets the lead tops 14 are lipid, alt T raising LDL cholesterol (P 2e-117), non-HDL
  cholesterol, apolipoprotein B, triglycerides and mixed hyperlipidaemia, so the longer-lived A lowers them; and a
  coronary-artery-disease set holds the lead (posterior 0.13), led by rs34042070 (r² 0.96 to 1.00), whose G rides with
  T and raises coronary disease (β +0.040, P 1.3e-14). So A goes with lower lipids and less coronary disease; the
  other sets the lead tops are GALNT2 and plasma glycans, albumin and two eQTLs, and no harm is tied to A (D18.1).
  A lowers LDL cholesterol and coronary disease, so preventable with `act_test:ldl` (an LDL test, a doctor's), as rows 6 and 93; an association, not a mediator test. Pleiotropy mech:lipids and mech:cvd. Causal C2: the
  lead tops Timmers' PICS set at posterior 0.243 of seven. Effector E3, no gene named (D24): locus-to-gene gives HP
  0.965 and HPR 0.705, both past 0.5, and the set's cis-QTL colocalisations are HP 58, HPR 55, TXNL4B 21 and DHODH 9;
  HP is named in prose. A is the common allele at 81 %, so A/A is the reference (§6.2): A/T and T/T risk,
  PROTECT:ABSENCE_OF_RISK, as row 79. Age of action unknown. The evidence is European.
