variants:
  - rsid: rs12924886
    gene: ""
    phenotype: HP/HPR region, cholesterol, parents' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: 0.02797694
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 65 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome 16,
          lies near the haptoglobin genes (HP and HPR). The finding comes from people of European ancestry; less is
          known elsewhere.
      - genotype: A/T
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 31 in 100 people of European
          ancestry do). In a very large study of a million parents' lifespans, each copy went with parents living a
          few months less, and it goes with slightly higher LDL cholesterol. No separate study has confirmed the
          lifespan link, and a study of people who reached old age did not see it, so this is a likely finding, not a
          settled one. The effect is small and it is a tendency, not destiny.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 4 in 100 people of European
          ancestry do). In a very large study of a million parents' lifespans, each copy went with parents living a
          few months less, and it goes with slightly higher LDL cholesterol. No separate study has confirmed the
          lifespan link, and a study of people who reached old age did not see it, so this is a likely finding, not a
          settled one. The effect is small and it is a tendency, not destiny.
