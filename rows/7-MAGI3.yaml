# The seed list's locus 7, MAGI3 (1p13.2, the PTPN22 region). Curated 2026-11-11, the ten-row run's eighth row. Lead
# rs1230666 (Timmers 2019, Table 1), the seed's only rsID here. Wright 2019's mothers' meta-analysis holds clumped SNPs
# within 0.5 Mb (the nearest rs2153977, 1:114080071, 93 kb away), with no cached LD to the lead: not read. Open
# Targets 26.09: Timmers 2019's and Rosoff 2023's credible sets, both led by rs1230666; the GWAS Catalog (2026-10-29)
# holds 14 associations for it.
locus_id: 7
locus_name: MAGI3
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: genome-wide significant in one study, with no independent replication (§4.1's
  single-study clause). Timmers 2019 found the locus in about one million parental lives from UK Biobank and LifeGen:
  P 6.4e-9 (past its own 2.5e-8 threshold), G, the common allele (85 %), adding 0.32 years per copy, both arms on the
  same side. Being new there, it has no LifeGen-only result to stand as a replication. The later genome-wide results
  contain the same parents: Timmers 2020's multivariate analysis (P 2e-9; the GWAS Catalog names G as the effect
  allele but no cached source gives an effect size, so no direction is read) and Rosoff 2023's mvAge (P 2e-11 in the GWAS Catalog, G on the
  healthier-ageing side; the paper names rs1230666 among its strongest fine-mapped loci). Outside them nothing
  passes: the longevity look-up of Timmers 2019's Figure 4 gives P 0.45 (one-sided), and Deelen 2019's 90th and 99th
  percentiles OR 1.04 per G (P 0.19 and 0.36), all on the same side; Wright 2019's AncestryDNA arm has no row for the
  lead. Healthspan agrees, nominally: G delays the end of healthspan in Zenin 2019 (P 6.7e-4), in UK Biobank. The
  mechanism is filed as immune and inflammation: Timmers 2019 classes the locus as autoimmune and puts its lifespan
  effect down to protection from autoimmune disease through a nearby variant it calls missense, rs6679677 (r² above
  0.6), and at the lead itself the GWAS Catalog has the minor A raising Hashimoto thyroiditis (P 2e-72) and thyroid
  peroxidase antibodies. The same A raises coronary disease and heart failure, and G lowers breast cancer: no
  trade-off is detected among the records whose allele is stated and consistent, but it is not ruled out, since one
  myocardial infarction record contradicts itself (G named, A's frequency) and two (another myocardial infarction,
  and Hodgkin's lymphoma at OR 0.81) state no allele. In Open Targets 26.09 rs1230666 holds PIP 0.64 in Timmers
  2019's credible set (PICS) and 0.86 in mvAge's: causal:C1 by the threshold, though PICS weighs members by their LD
  with the lead, and rs2476601 and rs6679677 sit in the same set at r² 0.68 and 0.67 (PIP 0.02), so the autoimmune
  haplotype the paper names is not excluded. The top locus-to-gene score is PHTF1 at 0.42, below 0.5; on the two sets PHTF1
  holds 18 of the 20 cis-QTL colocalisations at H4 ≥ 0.8 and RHOC 2, exactly the tenth D24 counts as a rival, so
  effector E3, at the edge, and no gene is named. The protection is the absence of the risk allele: A shortens life and G is the common one. Age of action
  is unknown: Timmers 2019's age bands do not single out this locus, and no cached source gives its own.
