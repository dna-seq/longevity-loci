variants:
  - rsid: rs1230666
    gene: ""
    phenotype: MAGI3/PTPN22 region, autoimmune disease
    trait_efo_id: EFO_0007796
    effect_allele: G
    effect_size: 0.3224
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 73 in 100). It is the reference the other combinations are compared with. The region, on
          chromosome 1, is linked to autoimmune conditions such as thyroid disease; which gene in it matters is not
          known. The finding comes from people of European ancestry; less is known elsewhere.
      - genotype: A/G
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 25 in 100 people of European
          ancestry do). In very large British and European studies, people with this version tended to have parents
          who lived a month or two less. The same version is linked to a higher chance of autoimmune thyroid disease
          and of heart disease. It is a likely finding, not a settled one: it has not yet been confirmed in a
          separate group of people. The effect is small and it is a tendency, not destiny.
      - genotype: A/A
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 2 in 100 people of European
          ancestry do). In very large British and European studies, each copy went with parents living a month or two
          less. The same version is linked to a higher chance of autoimmune thyroid disease and of heart disease. It
          is a likely finding, not a settled one: it has not yet been confirmed in a separate group of people. The
          effect is small and it is a tendency, not destiny.
