# The seed list's locus 149, CREB3L3 (19p13.3): a marker of biological ageing (D32, D36.3), curated on D37.12 with 23
# TERC as the pattern. Curated 2026-11-16. Lead rs73538174, the seed's rsID (McCartney 2021's African American PhenoAge
# locus): 62 bp upstream of CREB3L3's MANE transcript, GRCh38 19:4,153,569 A/G, GRCh37 19:4,153,566, A ancestral; G at
# 19.1 % in gnomAD's African/African American genomes and 0.04 % in the non-Finnish Europeans. A is the allele with
# slower PhenoAge.
locus_id: 149
locus_name: CREB3L3
verdict: kept
verdict_reason: >-
  Tier B on the marker's own evidence (D37.12; the seed gives none): the tier grades the association with PhenoAge
  acceleration, a DNA methylation clock read against calendar age, not longevity, and this row is unscored (D32).
  McCartney 2021's GWAS of epigenetic clocks in 34,710 Europeans and 6,195 African Americans finds rs73538174 in the
  African American analysis alone: its Table S4 prints A, the effect allele (the legend's refA), at 0.82, PhenoAge
  acceleration 3.25 years lower per A (SE 0.18), P 5.6e-69, effective n 4,480 in five cohorts, I² 0 %, every cohort
  with data the same way; the joint estimate −2.85. The GWAS Catalog's record (A 3.2457 decrease, P 6e-69) is the same
  line. Genome-wide in one sample, unreplicated in a sample of its own (none found): §4.1's B. G is all but absent in
  Europeans, so the European deposits hold no line: Deelen 2019, Timmers 2019, Pilling 2017, Zenin 2019, Foote 2025
  and FinnGen R11 (by rsID and GRCh37 19:4,153,566): untested. Park 2025's white British survival deposit holds it,
  flat: A −0.0075 (SE 0.032), P 0.82 (men 0.69, women 0.99), from about 180 carriers of G. The literature search (the
  rsID and the gene with the clock, 2026-11-16; Semantic Scholar answered 429, its part unchecked) finds no paper on
  this variant beyond McCartney's. Every genotype neutral, each conclusion a tendency of the marker with no colour
  (D32, D37.12); `direction: unknown`. Outcome cells read for A: lifespan 0 (Park flat, few carriers); healthspan and
  exceptional survival untested. Mechanism: markers of biological ageing; CREB3L3 is a liver transcription factor of
  fat metabolism (the author). Pleiotropy `mech:lipids`: G lowers HDL cholesterol (Open Targets, Verma 2024's 113,085
  people, PIP 0.90), named; no `tradeoff`, the row naming no longevity-favoured allele. Causal C1 (PIP 0.92 in
  McCartney's PhenoAge set). Effector E3, CREB3L3: locus-to-gene 0.43, the only gene listed (0.47 on the HDL set), the
  variant just upstream of CREB3L3 and in its brain expression set at PIP 0.95, G with lower expression (no
  colocalisation read), so under E2's bar. Descriptive. Age of action unknown. The evidence is African American, as
  `ancestry_specific:afr`.
