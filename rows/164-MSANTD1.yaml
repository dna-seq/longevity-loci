# A third, independent signal at the seed's locus 25, HTT (4p16.3), its own row under D25.6 and D39.14. Curated
# 2026-11-16. Lead rs114298671, one of the seed's rsIDs at 25: between genes, 8 kb from MSANTD1, GRCh38 4:3,280,142
# G/A, GRCh37 4:3,281,869; A at 12.8 % in gnomAD's non-Finnish European genomes. r² 0.056 to rs16843836, mvAge's lead for
# row 25's HTT signal, and 0.018 to rs16843603 (row 163). G is mvAge's healthier allele and the longer-life allele.
locus_id: 164
locus_name: MSANTD1
second_signal_of: 25
verdict: kept
verdict_reason: >-
  Tier C (D39.15): genome-wide only at the marginal; conditioned on row 25's signal in the coupling the phase gives,
  it is sub-genome-wide and short of suggestive (R-TIER-4). Rosoff 2023's mvAge puts G at +0.0089 (SE 0.0016), P 1.6e-8
  marginal, so G raises the factor (the Catalog the same), a lead SNP of its locus 11, new to the Catalog in Rosoff,
  beside rs16843836, the HTT signal's mvAge lead. Independence (D39.14, D39.15): no article prints a conditional
  analysis, and Open Targets places rs114298671 in no mvAge or lifespan-class set. From 1000 Genomes' phased EUR
  haplotypes (the population list q1174; over 1,006 haplotypes G on 883, rs16843836's A on 311, both on 309; with
  rs16843603's C on 307, both on 290; derived from the cached genotype files), G travels with rs16843836's healthier A
  (r +0.24, r² 0.056) and with rs16843603's C (r +0.14, r² 0.018), so stepwise on the two stronger lines its
  conditional z from Rosoff's z values is 3.69, P 2.3e-4 (derived, D39.18, D40.6). This row and 163 are independent
  of each other (each survives the other at 4.85 and 5.53, derived): it survives conditioning, so no tag of 25's lead or of 163's, but its independent part is
  sub-genome-wide. The two share a tag, rs71597207, in Rosoff's clumps, which the joint conditional takes in. Row 25's
  lead rs61348208 has no mvAge z printed, so rs16843836 stands in for it. Lifespan look-ups, all inside UK Biobank or
  mvAge's inputs, lean G's way: Timmers 2019 A beta1 −0.0245 (SE 0.0059), P 3.5e-5, "--", so G longer; Pilling 2017
  both parents P 0.005, mothers 2.5e-5, fathers 0.12, the top 10 % 0.0058; Park 2025's own survival flat (P 0.25; men
  0.55, women 0.26); Deelen 2019 flat, G's way (90th P 0.27, 99th 0.50). Outside them FinnGen R11's deaths are flat
  (P 0.58), a database line; no independent sample passes. Outcome cells read for G, on the marginal look-ups:
  lifespan + (Timmers, Pilling; Park flat); exceptional survival + (Pilling's top 10 % both-parents line, P 0.0058,
  D31.8; Deelen flat); healthspan + (Zenin 2019 G the later end, P 0.028; Foote 2025's factors 2 and 3 G less frail,
  P 0.012 and 7.4e-4, none against; the general factor and F4 hold no line). Mechanism general ageing, as the mvAge
  rows. Pleiotropy `mech:adiposity`: A raises body fat percentage, waist and high blood pressure (Open Targets, β per
  A), BMI sets named, so G, the longer-life allele, lowers them: no `tradeoff`. The Catalog's multiple long-term
  conditions line prints no allele, named. Causal C4 and effector E4: no mvAge or lifespan-class set in Open Targets
  holds it, and Rosoff's fine-mapping of locus 11 sets none of its leads (q87); MSANTD1 names the region, not an effector. The literature search (the rsID, 2026-11-16; Semantic Scholar answered 429, its part unchecked) finds Rosoff alone. Descriptive. Age of action unknown. The evidence is
  European.
