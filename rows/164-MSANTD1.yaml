variants:
  - rsid: rs114298671
    locus: {chrom: "4", start: 3280142, ref: G, cites: [db-ensembl-116#q1180]}
    gene: ""
    phenotype: MSANTD1 region, ageing
    trait_efo_id: EFO_0007796
    effect_allele: G
    effect_size: 0.00886760197706
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry have
          (about 76 in 100). It is the reference the other combinations are compared with. The region, on chromosome
          4, lies between genes, and what it does is not known. The finding comes from people of European ancestry;
          less is known elsewhere.
      - genotype: A/G
        state: risk
        conclusion: >-
          You carry one copy of the less common A version of this DNA region (about 22 in 100 people of European
          ancestry do). In a very large European study that combined healthspan, long life and other measures of
          ageing, this version went with slightly less healthy ageing, and parents of carriers lived a little less
          long. It is an early finding: part of it is shared with nearby signals, and what is left has not reached
          the usual bar on its own. The effect is small and it is a tendency, not destiny.
      - genotype: A/A
        state: risk
        conclusion: >-
          You carry two copies of the less common A version of this DNA region (about 2 in 100 people of European
          ancestry do). In a very large European study that combined healthspan, long life and other measures of
          ageing, each copy went with slightly less healthy ageing, and parents of carriers lived a little less long.
          It is an early finding: part of it is shared with nearby signals, and what is left has not reached the usual
          bar on its own. The effect is small and it is a tendency, not destiny.
