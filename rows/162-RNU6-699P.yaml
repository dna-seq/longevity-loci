variants:
  - rsid: rs13141210
    locus: {chrom: "4", start: 67025923, ref: C, cites: [db-ensembl-116#q1169]}
    gene: ""
    phenotype: RNU6-699P region, ageing
    trait_efo_id: EFO_0007796
    effect_allele: T
    effect_size: 0.005833901
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the slightly more common version of this DNA region (about 26 in 100 people of
          European ancestry do). It is the reference the other combinations are compared with. The region, on
          chromosome 4, lies between genes, and what it does is not known. The finding comes from people of European
          ancestry; less is known elsewhere.
      - genotype: C/T
        state: risk
        conclusion: >-
          You carry one copy of the C version of this DNA region (about 50 in 100 people of European ancestry do).
          In a very large European study that combined healthspan, long life and other measures of ageing, this
          version went with slightly less healthy ageing, and parents of carriers lived a little less long. It is an early finding: part of it is shared with a nearby signal, and what is left has not reached the usual bar on its own. What the region does is not known.
          The effect is small and it is a tendency, not destiny.
      - genotype: C/C
        state: risk
        conclusion: >-
          You carry two copies of the C version of this DNA region (about 24 in 100 people of European ancestry do).
          In a very large European study that combined healthspan, long life and other measures of ageing, each copy
          went with slightly less healthy ageing, and parents of carriers lived a little less long. It is an early finding: part of it is shared with a nearby signal, and what is left has not reached the usual bar on its own. What the region does is not known. The
          effect is small and it is a tendency, not destiny.
