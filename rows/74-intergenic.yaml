variants:
  - rsid: rs61949650
    gene: ""
    phenotype: 13q21 gene desert, mothers' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: C
    effect_size: -0.0251
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 88 in 100). It is the reference the other combinations are compared with, so it neither raises
          nor lowers your expected lifespan here. The region, on chromosome 13, lies far from any known gene, and
          what it does is not known. The finding comes from people of European ancestry, and from mothers; less is
          known elsewhere.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 12 in 100 people of European
          ancestry do). In a very large British study it went with mothers living a little longer, though not
          fathers. A separate European study saw the same in mothers, more weakly, and so did a study of people who
          reached the oldest ages, but a large American study did not see it, leaning the other way. It is a possible finding, not a
          settled one, and the effect is small. The region lies far from any known gene, and what it does is not
          known.
      - genotype: C/C
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 4 in 1,000 people of European
          ancestry do). In a very large British study each copy went with mothers living a little longer, though not
          fathers. A separate European study saw the same in mothers, more weakly, and so did a study of people who
          reached the oldest ages, but a large American study did not see it, leaning the other way. Few people carry two copies, so how
          they fare was not measured directly. It is a possible finding, not a settled one, and the effect is small.
