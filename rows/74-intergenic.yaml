# The seed list's locus 74, named "(intergenic)" by the seed, at 13q21.31. Curated 2026-11-12. Lead rs61949650, the seed's only rsID
# here (Pilling 2017's mothers' lead, in a gene desert between LINC00355 and LGMNP1; VEP intergenic). C, the minor
# allele at 0.063 in Europeans, goes with longer-lived mothers. Wright 2019's mothers' SNP rs12586026, 3.9 kb away, is
# at r² 1.0 in CEU and stands in for the lead in AncestryDNA.
locus_id: 74
locus_name: "(intergenic)"
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it, with `replication_failed`. Genome-wide in Pilling 2017's mothers only (UK Biobank, P
  2.9e-8; both parents 4.2e-5, fathers 0.67): C, the minor allele (0.063 in Europeans), goes with longer-lived
  mothers. Two European samples outside UK Biobank agree nominally, one-sided in the discovery's direction (D25.13),
  though not wholly apart from each other (LifeGen and Deelen share at least Rotterdam, row 25); one pass is enough
  for D25.1. LifeGen's
  mothers with UK Biobank's lives removed give C 0.40 years of life per copy against 0.65 at discovery, one-sided P
  0.046 (Timmers 2019's Figure 2 source data, sample b). Deelen 2019's 99th percentile gives C OR 1.13, P 0.041,
  one-sided 0.020 (derived); its 90th is flat on the same side (P 0.64). One fails with power. AncestryDNA's mothers
  (Wright 2019) at rs12586026 (r² 1.0, D′ 1.0) put C on the shorter-lived side, β −0.0061 (SE 0.0055), P 0.26,
  against UK Biobank's mothers' +0.0242 in the same table (P 8e-8, Pilling's result). Wright did not test Pilling's
  lead as such (three of the six UK Biobank maternal loci entered its meta-analysis, and Table 3 lists none here), so
  the reading at the neighbour is the curator's. Heterogeneity P 7.4e-5 as Wright
  prints it, and the AncestryDNA arm's one-sided power against the UK arm's effect is about 1.00 (0.72 at half the
  effect; derived). Both arms are on one scale in one table, so no conversion arises (D25.3 does not apply) and the
  heterogeneity P is the source's. That is D21's red flag, so `replication_failed` (D25.13, D26.11, as rows 18 and
  31). It bars A. It does not make D: D25.1 needs no independent scoring-class study to pass, and two do, each
  independent of the UK mothers whatever they share with each other (D29.15). Deelen raises no flag. Against the discovery's effect in its both-parents form
  (D27.9, D28.2), backed out of Pilling's P 4.2e-5 at a both-parents SE of 0.0083 on Timmers' scale (the mothers'
  0.0117 of q301 over √2; derived), C about +0.034, the 90th percentile flags under the APOE factor only (power 1.00,
  heterogeneity P 0.008; the mean factor power 0.56, P 0.22). That is a flag under one calibration, so none
  (D25.3); from Timmers' pooled +0.030 (q302) the same (mean factor power 0.48). The 99th lies on the discovery's
  side (power 0.86 under the APOE factor, borrowed from the 90th's ε4 line, and 0.31 under the mean). The rest is
  flat and leans against. FinnGen r11's any-death endpoint has C β +0.020 (SE
  0.017, P 0.22), C with slightly more deaths. Park 2025's UK Biobank own-survival deposit (its allele columns
  swapped, as at APOE) has C with more deaths, P 0.38. Zenin 2019's healthspan has C toward an earlier end, P 0.19
  after its genomic control,
  in Pilling's own sample. None is significant, so no cell reads against. The effect is the mothers'. Timmers'
  moderator model makes it smaller in fathers (male −0.048, P 0.006), though not past the legend's 5 % FDR (Q 0.13).
  Mothers' effects are of one size from 60 to 90 (0.063, 0.078 and 0.065 a decade, P 0.037 to 0.0009); fathers'
  are about zero in every band; there is no age dependence (P 0.77). Pilling's own deposits test the difference
  directly (D29.16): mothers T β +0.0251 (SE 0.0045) against fathers +0.0021 (SE 0.0045), heterogeneity P 3.0e-4
  with both errors counted (D29.6; derived), so sex_specific:f. LIFELONG, weakly. No disease is known at the locus. The GWAS Catalog holds
  Pilling's line alone; Open Targets 26.09's three sets at the variant are gut-microbial and food-liking GWAS. So the
  mechanism is general_ageing, pleiotropy is empty, and the token is PROTECT:PRESENCE (the minor C protects, as row
  5). No longevity credible set holds the variant and no gene is named: C4, E4, no gene (§4.2, §6.2). The genotype
  shares are 1000 Genomes Europeans' at C 0.063 (88, 12 and 0.4 in 100; gnomAD's non-Finnish Europeans 0.064).
