# The seed list's locus 99, CHRNA4 (20q13.33). Curated 2026-11-14. Lead rs2273500 (Pilling 2017's fathers-only SNP), a
# splice acceptor in a nonsense-mediated-decay transcript of CHRNA4 (the nicotinic receptor α4 subunit), GRCh38
# 20:63,355,597, GRCh37 20:61,986,949, T/C, C ancestral, T 0.85 in non-Finnish Europeans and the longer-lived allele.
# The seed's other rsID, rs6062322 (Rosoff 2023's mvAge lead, 455 kb away, no CEU LD pair to the lead), is another
# signal: named, not scored.
locus_id: 99
locus_name: CHRNA4
verdict: kept
verdict_reason: >-
  Tier B, the seed's: a single genome-wide study without independent replication, as at 95. Pilling 2017's UK Biobank
  fathers' attained age puts T with longer-lived fathers, β −0.0176 (SE 0.0031), P 1.5e-8, genome-wide in a stratum
  (D19.2); both parents 4.4e-7, mothers 0.0038 the same way (fathers against mothers heterogeneity P 0.052, so no sex
  token, D29.16), age at death 0.089, top 10 % 0.18. No independent study replicates it and none powered contradicts
  it: LifeGen's fathers without UK Biobank (Timmers 2019's Figure 2 source data, sample b) lean T's way, one-sided
  0.27, power 0.68, no flag (D21); Deelen 2019 leans against (90th P 0.65, 99th 0.38), a flag under APOE's factor
  only from Pilling's both-parents effect (D28.2), so none (D25.3), and a smoking locus fades with age (row 80);
  Wright 2019's AncestryDNA is untested (its one fathers' line in the window, rs4809300, 79 kb away, does not tag the
  lead). FinnGen R11's death endpoint, outside UK Biobank, is genome-wide on T's side (C more deaths, P 5.9e-9), but a
  database release line never replicates (D12, D30.12): named. Within UK Biobank it co-occurs: Timmers 2019's parents
  (T longer, P 2.2e-7, "++"), Park 2025's own survival (T fewer deaths, P 5.5e-5, its allele columns swapped), and
  Foote 2025's unhealthy-lifestyle frailty factor (T less frail, P 1.2e-10, multivariate, D27.3; its Q P 1.6e-7
  says the lead's effects do not run through the factor alone, likely the smoking indicator), with T less frail in
  every readable factor (disability P 0.0057, multimorbidity 0.018). Lifespan + (the discovery, Timmers), healthspan +
  (Foote's genome-wide factor beside Timmers' co-occurring lifespan, D16, as 91; Zenin 2019 flat, P 0.88),
  exceptional survival 0 (Deelen against, flat; Pilling's top 10 % flat). It acts through smoking: the lead's other
  associations are smoking's, with C raising cigarettes per day (P 3e-64), nicotine dependence (8e-9) and COPD (2e-9),
  so T, the longer-lived allele, goes with less smoking and less COPD, and Pilling names it a nicotine-dependence locus.
  Smoking runs with the lifespan effect here (unlike 95, D30.13): smoking_lungs, mech:smoking and context:smoking,
  modifiable, act_behaviour:smoking (row 80's shape). No trade-off: no harm quoted on T's side.
  PROTECT:ABSENCE_OF_RISK: T is the common non-risk allele at a genome-wide COPD locus (D30.6). Causal C4 and effector
  E4, no gene named: no lifespan-class credible set holds the lead (Pilling's fathers' study has none here); Foote's
  unhealthy-lifestyle set does (posterior 0.83, locus-to-gene CHRNA4 0.93), but a multivariate set the tier does not
  rest on sets no causal confidence (D17.2), and the splice acceptor sits in a nonsense-mediated-decay transcript, not
  the canonical protein, so no coding call; CHRNA4 is named in prose. The rsID literature search (all six sources answered)
  finds no other lifespan study of the lead: Hancock 2015 discovered it for nicotine dependence (a splice acceptor
  lowering CHRNA4 expression), the rest are smoking genetics and Mendelian randomisation. T/T, about 72 in 100 Europeans, is the reference (§6.2); C/T and C/C risk. Age of action unknown:
  Timmers' age bands do not include the lead. The evidence is European.
