variants:
  - rsid: rs2273500
    gene: ""
    phenotype: CHRNA4 region, fathers' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: T
    effect_size: -0.0176
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 72 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome 20,
          lies in CHRNA4, a gene for a nicotine receptor in the brain.
      - genotype: C/T
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 26 in 100 people of European
          ancestry do). It goes with smoking more cigarettes among smokers, with more chronic lung disease, and in a
          very large British study with fathers living a little shorter lives. No separate study has confirmed the
          lifespan link. The effect works through smoking: not smoking removes most of it.
      - genotype: C/C
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 2 in 100 people of European
          ancestry do). It goes with smoking more cigarettes among smokers, with more chronic lung disease, and in a
          very large British study each copy went with fathers living a little shorter lives. No separate study has
          confirmed the lifespan link. The effect works through smoking: not smoking removes most of it.
