    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA region, as about half of people of European
          ancestry do. It is the reference the other combinations are compared with. The region, on chromosome 5,
          lies between genes, and no gene is known to matter here.
      - genotype: C/A
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 4 in 10 people of European ancestry
          do). In one American study, people who reached 100 carried it more often than other people did, and a
          European study of the very oldest leaned the same way. A study of more than half a million parents' lifespans found no
          effect. It is early evidence, not a verdict.
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 1 in 12 people of European ancestry
          do). In one American study, people who reached 100 carried this version more often than other people did,
          and a European study of the very oldest leaned the same way. A study of more than half a million parents' lifespans found
          no effect. It is early evidence, not a verdict.
