# The seed list's locus 31, LINC02064 (5p13.3; the seed's genes "LINC02064;UBL5P1"). Curated 2026-11-11, the third
# ten-row run's eighth row (seed 30, TERT, waits on D4 as 23 does). Lead rs649357 (GRCh38 5:29,426,329, GRCh37
# 5:29,426,436), the seed's only rsID: an intergenic, triallelic (A/C/T) site, A 0.29 in Europeans and the major
# allele (0.67) in East Asians. Gurinovich 2021's NECS centenarian SNP (Supplement Table 1), as row 19. Its proxies
# rs694966 (r² 1.0), rs631778 (r² 1.0) and rs983077 (r² 0.99) carry the look-ups where the lead imputes poorly or is
# missing; they appear only in the notes and the studies' proxy_rsid.
locus_id: 31
locus_name: LINC02064
verdict: re-tiered
verdict_reason: >-
  Tier C, down from the seed's B: a centenarian case-control result whose one replication cannot yet be shown
  independent, against a powered null in a million parental lives. R-TIER-2 caps it at C. Gurinovich 2021 compared
  1,320 New England Centenarian Study centenarians (median age 104) with 2,899 controls of European ancestry, imputed
  to the HRC panel. C, the coded allele, is in 57.9 % of the centenarians' alleles and 63.9 % of the controls', score
  Z −5.50, P 3.78e-8, so A goes with reaching 100 (crude odds ratio about 1.29 per A, derived from the frequencies,
  not printed). The table lists every SNP at P < 5e-8 and holds this one alone, just past the cut. Its 15 proxies at
  r² ≥ 0.99 would sit at or just above it, so their absence says little. The Ashkenazi replication the abstract
  names is not printed for this SNP. Deelen 2019's European meta-analysis, which names no NECS among its cohorts, puts
  the lead's A side on the long-lived side at the 99th percentile age: rs694966 (r² 1.0, G with A) OR about 1.10, P
  0.0119, effective N 4,154; rs983077 (r² 0.99) P 0.0116. The 90th percentile, which contains those cases, leans the
  same way (P 0.17). That would be §4.1's nominal replication, with a much smaller effect (log OR 0.10 against 0.25,
  heterogeneity z about 2.6). But Deelen holds the Longevity Gene Project and LLFS, and where NECS's controls came
  from is in Gurinovich's unread main text. Whether the two share controls is unknown (D19.1), so R-TIER-2's
  "unreplicated" is not shown lifted, and the row stays at C; B is the alternative, put to the lead. Timmers 2019's
  parental lifespan is flat on the whole haplotype: at the lead P 0.75 (info 0.82), at rs983077 (info 0.995) A beta
  −0.0015, SE 0.0042, P 0.73, at rs631778 P 0.82, the lead's side if anything shorter-lived. Converted with APOE as
  the benchmark, as Timmers does (NECS's rs429358 against LifeGen's, factor about 9.4, derived from crude odds
  ratios), NECS predicts about +0.027 on Timmers' scale. One-sided power is about 1.00 at that effect and 0.95 at
  half; heterogeneity P is about 1e-5, or 0.002 at half. That is D21's red flag. It is not tier D: D22.3 keeps a
  flat European look-up out of D when the locus's proxies lean the discovery's way, and Deelen's 99th percentile
  does. The lead's own imputed frequency is off: A 0.36 in NECS's controls, 0.39 in LifeGen and 0.40 in UK Biobank's
  healthspan file, against 0.29 to 0.31 in 1000 Genomes, gnomAD and every well-imputed proxy, which is the confounding
  R-TIER-2 names. Zenin 2019's healthspan is null at the lead and its proxies (P 0.86 to 0.97). Lifespan is filed 0,
  healthspan 0, exceptional survival + on NECS and Deelen. The evidence is European. Mechanism general ageing: the
  GWAS Catalog records no other trait for the lead or any of its 56 proxies at r² ≥ 0.8, and Open Targets 26.09 has
  no record of the lead or its two r² 1.0 proxies. So causal C4 and effector E4, no gene named (LINC02064 is a
  long non-coding RNA, nearest by position only). The protection is a presence: the minor A goes with reaching 100.
  Age of action is unknown; the signal shows at the oldest ages and not in parental lifespan, which fits a late
  effect but does not show one.
