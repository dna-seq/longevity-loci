# The seed list's locus 31, LINC02064 (5p13.3; the seed's genes "LINC02064;UBL5P1"). Curated 2026-11-11, the third
# ten-row run's eighth row (seed 30, TERT, waits on D4 as 23 does). Lead rs649357 (GRCh38 5:29,426,329, GRCh37
# 5:29,426,436), the seed's only rsID: an intergenic, triallelic (A/C/T) site, A 0.29 in Europeans and the major
# allele (0.67) in East Asians. Gurinovich 2021's NECS centenarian SNP (Supplement Table 1), as row 19. Its proxies
# rs694966 (r² 1.0), rs631778 (r² 1.0) and rs983077 (r² 0.99) carry the look-ups where the lead imputes poorly or is
# missing; they appear only in the notes and the studies' proxy_rsid.
locus_id: 31
locus_name: LINC02064
verdict: re-tiered
verdict_reason: >-
  Tier C, down from the seed's B, held there while B is put to the lead. By D25.1 the row would be B, capped by a
  powered null (D21): a genome-wide centenarian result replicated nominally in a European sample independent as far
  as both papers show, against a flat parental-lifespan look-up that is a red flag under both of Timmers'
  calibrations (D25.3). Two things hold it at C. §6.3 asks a study supporting B for an effect size, and NECS prints
  none (only a crude odds ratio derived from its frequencies, below); and `check rows` lifts R-TIER-2 only on a second
  genome-wide study, not on D22.2's nominal scoring-class replication. Gurinovich 2021 compared 1,320 New England Centenarian Study
  centenarians (median age 104) with 2,899 controls of European ancestry, imputed to the HRC panel. The controls are
  306 NECS referents, unrelated people whose parents died before the median age of their birth cohort, and 2,593
  controls from Illumina's repository of samples used as controls in many GWASs, matched to NECS's ancestry by
  principal components; their ages and the studies they came from are not given. C, the coded allele, is in 57.9 %
  of the centenarians' alleles and 63.9 % of the controls', score Z −5.50, P 3.78e-8, so A goes with reaching 100
  (crude odds ratio about 1.29 per A, derived from the frequencies, not printed), past the paper's 5e-8 threshold.
  Supplement Table 1 lists all 33 SNPs past it, and this one stands alone, just past the cut (|Z| 5.45). Its proxies
  at r² ≥ 0.99 are not listed, which is weak evidence that the signal rests on the lead's own imputed calls: the lead
  is only 0.05 Z past the cut, in-sample noise between r² 0.99 proxies is about 0.1 Z, and strand-ambiguous SNPs were
  removed before the analysis. The lead's imputed frequency is off (A 0.36 in NECS's controls, 0.39 in LifeGen, 0.40
  in UK Biobank's healthspan file, against 0.29 to 0.31 in 1000 Genomes and gnomAD; Deelen's rs694966 G 0.26), the
  confounding R-TIER-2 names, which the replication lifts. The Ashkenazi Longevity Genes Project, NECS's own
  replication cohort (312 cases, 638 controls), prints no value for this SNP. Deelen 2019's European meta-analysis
  puts the lead's A side on the long-lived side at the 99th percentile age: rs694966 (r² 1.0, its G with A; Deelen's
  5:29427172, rs694966's GRCh37 position) OR about 1.10, P 0.0119, effective N 4,154; rs983077 (r² 0.99) P 0.0116.
  The 90th percentile, which contains those cases, leans the same way (P 0.17). That is §4.1's nominal replication,
  with a smaller effect (log OR 0.10 against 0.25, heterogeneity z about 2.6), which is §4.1's B clause, never a reason
  for D (D25.1). It is independent as far as both papers show (D19.1): Deelen's cohort list and its cohort supplement
  name neither NECS nor Illumina's control repository, and Gurinovich names none of Deelen's cohorts besides the LGP,
  which is NECS's replication, not its discovery. Two things stay unknown: which studies Illumina's repository
  controls came from, and whether any member of the Long Life Family Study, which Deelen holds and which enrolled in
  Boston among other centres, is also an NECS participant. Timmers 2019's parental lifespan is flat on the
  haplotype: at the lead P 0.75 (info 0.82, n 519,511), at rs983077 (info 0.995, n 640,189) A beta −0.0015, SE 0.0042,
  P 0.73, at rs631778 P 0.82, the lead's side if anything shorter-lived. With APOE as the benchmark, as Timmers does
  (NECS's rs429358 against LifeGen's, factor about 9.4, derived from crude odds ratios), NECS predicts about +0.027 on
  Timmers' scale: one-sided power about 1.00 (0.95 at half the effect), heterogeneity P about 1e-5 (0.002 at half).
  With the loci's mean factor (0.42 of APOE's) it predicts about +0.065: power about 1.00, heterogeneity P about 1e-7
  (3e-6 at half). A red flag under both (D21, D25.3), which would cap the row at B; it is not D, because an independent
  scoring-class study gives p < 0.05 the discovery's way (D25.1). Zenin 2019's healthspan is null at the lead and its
  proxies (P 0.86 to 0.97). Lifespan is filed 0, healthspan 0, exceptional survival + on NECS and Deelen. The
  evidence is European. Mechanism general ageing: the GWAS Catalog records no other trait for the lead or any of its
  56 proxies at r² ≥ 0.8, and Open Targets 26.09 has no record of the lead or its two r² 1.0 proxies. So causal C4
  and effector E4, no gene named (LINC02064 is a long non-coding RNA, nearest by position only). The protection is a
  presence: the minor A goes with reaching 100. Age of action is unknown; the signal shows at the oldest ages and not
  in parental lifespan, which fits a late effect but does not show one.
