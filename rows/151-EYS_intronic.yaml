variants:
  - rsid: rs75571981
    gene: ""
    phenotype: EYS intron, longevity, Japanese
    trait_efo_id: OBA_VT0005372
    effect_allele: C
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as nearly everyone does. It is the
          reference the other combinations are compared with. The position lies inside the EYS gene on chromosome 6.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of a version of this DNA position found mainly in people of Japanese ancestry (about 8 in
          100 Japanese people carry it, and almost no one elsewhere). One Japanese study, not yet peer-reviewed, found
          it more often among people who lived past 100, but not among healthy people in their late 80s, and it has
          not been confirmed elsewhere. This is weak, early evidence: a possible tendency, not destiny.
      - genotype: C/C
        state: protective
        conclusion: >-
          You carry two copies of a version of this DNA position found mainly in people of Japanese ancestry, which is
          unusual. One Japanese study, not yet peer-reviewed, found it more often among people who lived past 100, a
          finding not yet confirmed, so nothing can be said about two copies.
