# The seed list's locus 151, EYS (intronic) (6q12). Curated 2026-11-16. Lead rs75571981, the seed's only rsID (Sasaki's
# Japanese centenarian GWAS, a preprint): intronic in EYS on its MANE Select transcript (NM_001142800.2), GRCh38
# 6:63,910,997 T/C, C the minor allele (4.3 % in 1000 Genomes JPT, 1.0 % in gnomAD's East Asian genomes, absent in
# Europeans), C the discovery's longer-lived side (its frequency rises in the centenarians). Open Targets 26.09 has no
# record of it; the GWAS Catalog (2026-10-29) holds no association.
locus_id: 151
locus_name: EYS (intronic)
verdict: re-tiered
verdict_reason: >-
  Tier C, from the seed's B: a preprint-only finding (§4.1's C), from one centenarian sample against population
  controls, unreplicated (R-TIER-2). Sasaki's Japanese centenarian GWAS (Research Square, revised 2025, not
  peer-reviewed; 964 centenarians, 173 of them past 110, against 7,306 Japanese controls, an N-weighted meta-analysis
  of whole genomes and imputed arrays) names two genome-wide loci, APOE and EYS, lead rs75571981. The text prints no
  P, effect size or allele frequency for it; they sit in a supplementary table not reached (Research Square's
  supplement has no URL pattern the tools know, and Europe PMC's text omits it), so the discovery is genome-wide by the
  authors' statement only, its size unknown, and no reference check (D31.10) or calibration can run. Within the same
  preprint the signal does not carry: the variant's frequency rises in the centenarians but not in 1,026 healthy agers
  aged 85 to 89 against the same controls, and in those agers' follow-up the Cox models of lifespan and disability-free
  survival find APOE4 and sex significant, not the EYS allele (its figures are in a figure, unread). The authors
  report it absent in Korean samples. C is all but absent outside Japan (1.0 % in gnomAD's East Asians, none in
  Europeans), so no other sample read here tests it: untested, not negative. The literature search (the rsID with EYS
  and centenarians, 2026-11-16; Semantic Scholar answered 429, its part unchecked) finds the two versions of the
  preprint (2024, 2025) alone. Exceptional survival + on the preprint's genome-wide statement (preprint, named; no
  size); lifespan 0 (the healthy agers' Cox model, EYS not significant, D34.5, its figure unread); healthspan 0
  (disability-free survival, the same model). Mechanism ageing in general (D25.7): intronic, with no expression or
  predicted regulatory effect known (the authors). Causal C4 and effector E4: no Open Targets record. Descriptive.
  Age of action unknown. The ancestry is Japanese, as `ancestry_specific:eas`.
