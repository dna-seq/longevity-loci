# The seed list's locus 151, EYS (intronic) (6q12). Curated 2026-11-16. Lead rs75571981, the seed's only rsID (Sasaki's
# Japanese centenarian GWAS, a preprint): intronic in EYS on its MANE Select transcript (NM_001142800.2), GRCh38
# 6:63,910,997 T/C, C the minor allele (4.3 % in 1000 Genomes JPT, 1.0 % in gnomAD's East Asian genomes, absent in
# Europeans), C the discovery's longer-lived side (its frequency rises in the centenarians). Open Targets 26.09 has no
# record of it; the GWAS Catalog (2026-10-29) holds no association.
locus_id: 151
locus_name: EYS (intronic)
verdict: re-tiered
verdict_reason: >-
  Tier C, from the seed's B: a preprint-only finding (§4.1's C), from one centenarian sample against population
  controls, unreplicated (R-TIER-2). Sasaki's Japanese centenarian GWAS (Research Square, revised 2025, not
  peer-reviewed; 964 centenarians, 173 of them past 110, against 7,306 Japanese controls, an N-weighted meta-analysis
  of whole genomes and imputed arrays) names two genome-wide loci, APOE and EYS, lead rs75571981. Its Supplementary Table 2
  (Europe PMC's supplement bundle, cached) prints the line: C in 125 of 1,928 centenarian alleles (6.48 %) against 785
  of 14,612 control alleles (5.37 %), meta Z 5.52, P 3.48e-8, the genome-wide call read as printed (D17.3, D29.5). That
  call exists only in the adjusted, N-weighted meta-analysis (sex and 20 principal components); the table's own arms
  are flat (whole genomes, 524 against 3,340, OR 1.146, P 0.32; arrays, 440 against 3,966, OR 1.302, P 0.066), and on
  the pooled counts the crude allelic OR is 1.22, Fisher's exact P 0.049 (derived, D37.1): nominal at best. That
  dependence on adjustment, centenarians (median 106, 85 % women) against Tohoku Medical Megabank controls (median 45, 65 % women), is the
  cohort confounding R-TIER-2 exists for, made visible (D37.9). The reference check runs (D31.13): gnomAD has no
  Japanese group, so the nearest panel is 1000 Genomes JPT (9 of 208 alleles, with its sampling error); the controls
  fit it (Fisher P 0.64) and the centenarians sit above it at one-sided 0.14, so D31.10 is not met and the discovery
  is read as printed, as at 118; ToMMo 38KJPN (5.45 %) is the controls' own project's panel, so a fit against it is
  near-circular, named only. Within the same
  preprint the signal does not carry: the variant's frequency rises in the centenarians but not in 1,026 healthy agers
  aged 85 to 89 against the same controls, and in those agers' follow-up the Cox models of lifespan and disability-free
  survival find APOE4 and sex significant, not the EYS allele (Fig. 6c and d, regularised Cox models, read off the
  figure by eye, approximate: lifespan HR about 1.07, 0.94 to 1.21, disability-free survival about 1.02, 0.92 to 1.12,
  both crossing 1). The authors
  report it absent in Korean samples. C is all but absent outside Japan (1.0 % in gnomAD's East Asians, none in
  Europeans), so no other sample read here tests it: untested, not negative. The literature search (the rsID with EYS
  and centenarians, 2026-11-16; Semantic Scholar answered 429, its part unchecked) finds the two versions of the
  preprint (2024, 2025) alone. Exceptional survival + on the preprint's genome-wide meta-analysis (preprint, named; the
  crude arms flat); lifespan 0 (the healthy agers' Cox model, HR about 1.07, flat,
  D34.5); healthspan 0 (disability-free survival, the same model, HR about 1.02). Mechanism ageing in general (D25.7): intronic, with no expression or
  predicted regulatory effect known (the authors). Causal C4 and effector E4: no Open Targets record. Descriptive.
  Age of action unknown. The ancestry is Japanese, as `ancestry_specific:eas`.
