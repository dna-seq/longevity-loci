variants:
  - rsid: rs3768321
    gene: ""
    phenotype: PABPC4 region, multivariate healthy ageing
    trait_efo_id: EFO_0007796
    effect_allele: G
    effect_size: 0.0079
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 64 in 100). It is the reference the other combinations are compared with. The region, on
          chromosome 1, lies near the PABPC4 gene, and it is not yet clear which gene matters. The finding comes
          from people of European ancestry; less is known elsewhere.
      - genotype: G/T
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 32 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, this version went with slightly less healthy ageing; the region is also linked to
          blood fats, blood sugar and body shape. This is early evidence: it showed only in the combined measure,
          and on its own it did not clearly shorten life. The effect is small and it is a tendency, not a
          verdict.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 4 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, each copy went with slightly less healthy ageing; the region is also linked to
          blood fats, blood sugar and body shape. This is early evidence: it showed only in the combined measure,
          and on its own it did not clearly shorten life. The effect is small and it is a tendency, not a
          verdict.
