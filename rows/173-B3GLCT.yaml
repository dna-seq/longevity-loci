    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as almost everyone of European ancestry
          does (about 986 in 1,000). It is the reference the other combinations are compared with. The position lies
          in the B3GLCT gene on chromosome 13. The finding comes from people of European ancestry; less is known
          elsewhere.
      - genotype: G/T
        state: protective
        conclusion: >-
          You carry one copy of a rare G version of this DNA position (about 14 in 1,000 people of European ancestry
          do). In one very large British study, mothers of people with this version lived somewhat longer; fathers
          showed no such link. No other study has been able to check it, and for a version this rare the authors
          themselves call the result less certain. It is a single early finding and a tendency, not a guarantee.
      - genotype: G/G
        state: protective
        conclusion: >-
          You carry two copies of a rare G version of this DNA position, which is very uncommon (fewer than 1 in
          10,000 people of European ancestry). In one very large British study, mothers of people with one copy lived
          somewhat longer; fathers showed no such link, and no one with two copies was studied separately. No other
          study has been able to check it. It is a single early finding and a tendency, not a guarantee.
