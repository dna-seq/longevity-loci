# A locus outside the seed list, from the scout's GWAS Catalog entry (the 2015–2026 backfill, D41), its own row under
# the next free id. Curated 2026-11-18. The Catalog's chr13:31871514 line (Pilling 2017's mothers, no rsID) is
# rs1043332229: intronic in B3GLCT (formerly B3GALTL), GRCh38 13:31,297,377 T/G, GRCh37 13:31,871,514, T ancestral, at
# the end of a poly-T run; G at 0.70 % in gnomAD's non-Finnish European genomes. 1.18 Mb from row 73's KL-VS (GRCh38),
# a separate locus. G, the rare allele, is the one the discovery puts with longer life.
locus_id: 173
locus_name: B3GLCT
verdict: kept
verdict_reason: >-
  Tier B by §4.1's single-study clause, as rows 68 and 74 (Pilling 2017's rare and mothers-only hits): genome-wide in one
  analysis of one study and untested elsewhere. Pilling 2017's mothers' attained age (UK Biobank) puts G with longer-lived
  mothers, T's β +0.0979 (SE 0.0180) on the Martingale residual, P 4.7e-8 (pmid-29227965 q322, q324), one of the three
  loci found only for mothers (q323). The other analyses of the same participants: both parents T +0.0635, P 5.6e-4
  (q325), G's way; fathers flat, G a little shorter (P 0.34, q327); top 10 % flat (P 0.70, q326). The paper's own caveat
  is carried: for variants this rare (0.5 %), P < 5e-8 may not be rigorous enough (q36); imputation quality is not
  printed for it. No
  sample outside UK Biobank holds it: no line in Timmers 2019's LifeGen file, Deelen 2019's percentiles, FinnGen R11,
  Zenin 2019, Foote 2025's deposits or Wright 2019's AncestryDNA tables (which print only representatives below P 3e-3,
  pmid-31484785 q6), and no Open Targets record (db-opentargets-26.09 q1585): untested, not null. Park 2025's own
  survival, in UK Biobank's participants, is flat (P 0.98; women G a little more deaths, P 0.28, q244 to q246), not
  independent of the discovery's genotypes. No red flag can be scored (nothing outside the discovery tests it). 
  `sex_specific:f` (D29.16, D29.20, D43.4): the mothers' T +0.0979 (SE 0.0180, q324) against the fathers' −0.0172 (SE
  0.0179, q327) differ at z 4.53, P 5.8e-6, both errors counted, and at P 0.009 at half the mothers' effect (derived),
  as row 74 from the same paper's deposits; no independent other-sex sample passes (D31.5).
  The GWAS Catalog's line (db-gwascatalog-2026.10.29 q831 to q833) gives T's β as an "increase" under parental
  longevity, but on Pilling's scale positive is a shorter life. Outcome cells read for G: lifespan + (the discovery
  itself, D28.10, as row 68); exceptional survival 0 (Pilling's top 10 %, flat); healthspan untested (no line in Zenin
  or Foote). Mechanism ageing in general: B3GLCT glycosylates thrombospondin-repeat proteins, but no trait is known at
  the variant and no route is shown; descriptive. Causal C4, effector E4: no credible set, no QTL record. The literature
  search (the rsID, 2026-11-18) found nothing in the four services that answered; OpenAlex and Semantic Scholar answered
  429, their part unchecked. Carriers are about 14 in 1,000 Europeans. Age of action unknown. The evidence is European.
