variants:
  - rsid: rs142158911
    gene: LDLR
    phenotype: LDL cholesterol and heart disease
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: 0.3550
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 77 in 100). It is the reference the other versions are compared with, so it neither raises
          nor lowers your expected lifespan here. The region sits in the LDL receptor gene, which clears LDL
          cholesterol, the "bad" cholesterol, from the blood. A standard cholesterol test your doctor can order
          shows your actual LDL level, which matters far more than this DNA result. The finding comes from people
          of European ancestry; less is known elsewhere.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 21 in 100 people of European
          ancestry do). This region is linked to LDL cholesterol, the "bad" cholesterol, and in very large studies
          the carriers of this version had parents who lived on average about two months longer, most likely
          through less heart disease. The finding is well established, but the effect is small and it is a tendency, not a
          guarantee. A standard cholesterol test your doctor can order shows your actual LDL level, which matters
          far more than this DNA result.
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 1 or 2 in 100 people of
          European ancestry do). This region is linked to LDL cholesterol, the "bad" cholesterol, and in very large
          studies each copy of this version went with parents living on average about two months longer, most
          likely through less heart disease. The finding is well established, but the effect is small and it is a
          tendency, not a guarantee. A standard cholesterol test your doctor can order shows your actual LDL
          level, which matters far more than this DNA result.
