# The seed list's locus 93, LDLR (19p13.2). Curated 2026-11-10, the first row of the five-row pilot. Lead rs142158911
# (Timmers 2019); rs6511720, the lead of Timmers 2020, Pilling 2017 and Wright 2019, is the same signal (r² 0.96 in
# Open Targets' credible set) and appears only as a proxy on the studies that reported it.
locus_id: 93
locus_name: LDLR
verdict: kept
verdict_reason: >-
  Tier A confirmed. Genome-wide significant for parental lifespan in about one million lives (Timmers 2019, P 8.1e-9,
  a locus first found there) and replicated outside UK Biobank and LifeGen in AncestryDNA's fathers, a mostly American
  sample (Wright 2019, P 6.8e-5, the LDL-lowering allele on the longer-lived side), where the AncestryDNA-UK Biobank
  meta-analysis also passes genome-wide significance (P 2.7e-9). Nominal at the 90th percentile in Deelen 2019's data
  and for healthspan (Timmers 2020, P 0.002 and 0.04), both with the same allele on the longer-lived side; Deelen's
  discovery cohorts hold no UK Biobank data, though whether they overlap LifeGen's is not stated. Caveats: Pilling
  2017 (UK Biobank) only reaches P 1.8e-6; Wright's AncestryDNA mothers replicate only read one-sided (P 0.062,
  one-sided 0.031, D25.13, 0.038 after Wright's genomic control; same allele and sign). Fine-mapping is diffuse: about fifty variants share the credible set, none with PIP
  above 0.04. The seed's other rsID here, rs6511720, is that set's member at r² 0.96 and a proxy on three studies.
  Timmers 2019's Figure 5 source data neither show nor refute the mid-life reading: fathers' effect fades at 80-90
  (0.051, 0.049, then 0.011) while mothers' is about zero from 60 to 90 (−0.003, 0.007, 0.029), and the age moderator
  is null (P 0.72).
