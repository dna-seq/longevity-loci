# The seed list's locus 107, SLC16A6 (17q24.2). Curated 2026-11-15. Lead rs112262188, the seed's only rsID (Kolbe
# 2025's exome-wide rare variant): synonymous in SLC16A6, GRCh38 17:68,271,344 G/C, GRCh37 17:66,267,485, C the rare
# allele (0.09 % in gnomAD's non-Finnish European exomes) and the discovery's longer-lived side. Open Targets 26.09 has
# no record of the variant under either allele order; the GWAS Catalog (2026-10-29) holds no association.
locus_id: 107
locus_name: SLC16A6
verdict: kept
verdict_reason: >-
  Tier C, the seed's: a sub-genome-wide discovery in one sample, old against young (R-TIER-2), that no other study has
  tested (§4.1's C). Kolbe 2025 sequenced the exomes of 1,245 German long-lived individuals and 4,105 younger controls;
  C was at 0.20 % among the long-lived and 0.01 % among the controls, OR 12.1 (Haldane-corrected), P 9.8e-7, adjusted
  0.025 under the paper's exploratory false-discovery rate of 0.05, its own exome-wide call, not a genome-wide one
  (R-TIER-4, D31.13), and R-TIER-2 caps a single old-against-young sample at C either way. On 2,490 and 8,210
  alleles that is about five copies against about one, and the controls sit well below gnomAD's non-Finnish 0.09 %, so
  the paper's own odds ratio against that reference, 2.36, is the steadier size: the controls' 8,210 alleles expect
  about 7 copies and show about 1 (Fisher's exact on both counts, one-sided P 0.0072), the long-lived 2,490 about 2.1 and show about 5 (P 0.066), so the
  signal is mostly the controls' deficit, and most long-lived copies are in men (0.60 %), the women at 0.06 %, about
  1 copy against 1.56 expected from the population's 0.09 % (derived; the split is never tested, so no sex token,
  D29.16, D31.13); across Kolbe's rows 107, 120, 121, 124, 125 and 126 about 24 of 35 long-lived copies are in
  men, who are 27 % of the long-lived (D34.7, D34.14), named, no token. The reference is fixed as gnomAD's non-Finnish exomes, the exome study's matching assay (D31.13);
  against the non-Finnish genomes (0.075 %) the controls would give P 0.015, near D30.10's cut of 0.01, and the
  long-lived one-sided 0.041 (derived): the reading is fragile, and said so. The authors note that the OR against
  gnomAD is considerably lower than their own and that gnomAD's non-Finnish Europeans are mostly British, unlike
  their cohort; they do not disown the call, so it is not an overfit source by the rule's own cases (rows 41, 44, 48,
  60, each disowned by its authors or their filter); so, by D31.10, the case-control OR (12.1, P 9.8e-7) is named, not read: the
  row reads the long-lived against gnomAD NFE, the paper's own OR 2.36, which the paper tests no further and which Fisher's exact test on both counts puts at one-sided P 0.066 (derived; D37.1, db-ensembl-116#q1122 to q1125), not a pass. Kolbe chose its hits from about 98,000 rare variants, so a reference OR still carries that selection, uncorrected (D34.14). No replication exists: the authors say
  none of comparable size is available, their Ashkenazi look-up holds three of the seven variants, not this one, and
  their Leiden look-up lists none at SLC16A6. At 0.06 % the variant is absent from every large sample read here:
  Deelen 2019, Timmers 2019, Pilling 2017, Zenin 2019, FinnGen R11, Park 2025 (below its 0.1 % filter) and Foote 2025
  hold no line, and Wright 2019's one line within 500 kb (rs12453858, 392 kb) is common and cannot tag it, so every
  test is untested, not negative. Timmers' strongest line within 500 kb, rs11867618 (392 kb, 13 %, P 5.0e-6), cannot tag
  it either (r² at most 0.006 by frequency): a separate signal. No LD look is possible for a 0.09 % variant in 1000
  Genomes' 99 CEU samples. The literature search (the rsID, and SLC16A6 with longevity terms; Semantic Scholar 429)
  finds Kolbe alone, and of the papers citing Kolbe only a 2026 bioRxiv functional study of rare mTOR-pathway variants
  by the same groups, no sample test of this one. Exceptional survival 0 (D31.10: the
  read comparison, against gnomAD, does not pass; the case-control one rests on the misfit controls), lifespan untested,
  healthspan untested. Mechanism ageing in general (D25.7): the authors tie SLC16A6
  to the intestinal excretion of ketone bodies, which they link to longevity through fasting, a route not tested here;
  named. Causal C4: no Open Targets record. Effector E4, the gene named in prose: the change is synonymous, so it alters
  no protein (D31.9, D31.10). Every genotype neutral: the read effect, one-sided 0.066, is not significant (D31.13). Descriptive.
  Age of action unknown. The evidence is European (German).
