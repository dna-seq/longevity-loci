# The seed list's locus 107, SLC16A6 (17q24.2). Curated 2026-11-15. Lead rs112262188, the seed's only rsID (Kolbe
# 2025's exome-wide rare variant): synonymous in SLC16A6, GRCh38 17:68,271,344 G/C, GRCh37 17:66,267,485, C the rare
# allele (0.09 % in gnomAD's non-Finnish European exomes) and the discovery's longer-lived side. Open Targets 26.09 has
# no record of the variant under either allele order; the GWAS Catalog (2026-10-29) holds no association.
locus_id: 107
locus_name: SLC16A6
verdict: kept
verdict_reason: >-
  Tier C, the seed's: a sub-genome-wide discovery in one sample, old against young (R-TIER-2), that no other study has
  tested (§4.1's C). Kolbe 2025 sequenced the exomes of 1,245 German long-lived individuals and 4,105 younger controls;
  C was at 0.20 % among the long-lived and 0.01 % among the controls, OR 12.1 (Haldane-corrected), P 9.8e-7, adjusted
  0.025 under the paper's exploratory false-discovery rate of 0.05, below no genome-wide threshold. On 2,490 and 8,210
  alleles that is about five copies against about one, and the controls sit well below gnomAD's non-Finnish 0.09 %, so
  the paper's own odds ratio against that reference, 2.36, is the steadier size. The authors report it without doubt,
  so it is not an overfit source by the rule's own cases (rows 41, 44, 48, 60). No replication exists: the authors say
  none of comparable size is available, their Ashkenazi look-up holds three of the seven variants, not this one, and
  their Leiden look-up lists none at SLC16A6. At 0.06 % the variant is absent from every large sample read here:
  Deelen 2019, Timmers 2019, Pilling 2017, Zenin 2019, FinnGen R11, Park 2025 (below its 0.1 % filter) and Foote 2025
  hold no line, and Wright 2019 and Rosoff 2023 none, so every test is untested, not negative. Exceptional survival +
  (the discovery), lifespan untested, healthspan untested. Mechanism ageing in general (D25.7): the authors tie SLC16A6
  to the intestinal excretion of ketone bodies, which they link to longevity through fasting, a route not tested here;
  named. Causal C4: no Open Targets record. Effector E4, the gene named in prose: the change is synonymous, so it alters
  no protein, and §4.2's coding clause is read as a protein change (D31.9's reading at 99); put to the lead. Descriptive.
  Age of action unknown. The evidence is European (German).
