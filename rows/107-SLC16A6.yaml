    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as nearly everyone of European ancestry
          does. It is the reference the other combinations are compared with. The position lies in the SLC16A6 gene on
          chromosome 17.
      - genotype: C/G
        state: protective
        conclusion: >-
          You carry one copy of a rare version of this DNA position (about 2 in 1,000 people of European ancestry do).
          It lies in the SLC16A6 gene and does not change the protein the gene makes. One German study found it a few
          times among very long-lived people and almost never among younger people. It rests on a handful of carriers
          and has not been checked elsewhere, so this is early evidence, not a settled finding: a tendency, not destiny.
      - genotype: C/C
        state: protective
        conclusion: >-
          You carry two copies of a rare version of this DNA position, which is very unusual; the one study of it found
          no one with two copies. It lies in the SLC16A6 gene and does not change the protein the gene makes. One German
          study found single copies a few times among very long-lived people, early evidence that has not been checked
          elsewhere, so nothing can be said about two copies.
