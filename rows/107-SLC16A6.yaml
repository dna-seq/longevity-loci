variants:
  - rsid: rs112262188
    gene: ""
    phenotype: SLC16A6 synonymous, longevity
    trait_efo_id: OBA_VT0005372
    effect_allele: C
    effect_size: 2.36
    effect_measure: OR
    stat_significance: not_significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as nearly everyone of European ancestry
          does. It is the reference the other combinations are compared with. The position lies in the SLC16A6 gene on
          chromosome 17.
      - genotype: C/G
        state: neutral
        conclusion: >-
          You carry one copy of a rare version of this DNA position (about 2 in 1,000 people of European ancestry do).
          It lies in the SLC16A6 gene and does not change the protein the gene makes. One German study found it a few
          times among very long-lived people, a little more often than in the general population, but the difference
          rests on a handful of carriers, is not clear, and has not been checked elsewhere, so it is not counted for or
          against lifespan.
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of a rare version of this DNA position, which is very unusual; the one study of it found
          no one with two copies. It lies in the SLC16A6 gene and does not change the protein the gene makes. One German
          study found single copies a few times among very long-lived people, a difference that is not clear and has
          not been checked elsewhere, so nothing can be said about two copies, and it is not counted for or against
          lifespan.
