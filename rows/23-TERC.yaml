    effect_size: -0.097
    effect_measure: beta
    stat_significance: significant
    direction: unknown
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA position (about 57 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. The position lies near TERC, the
          RNA part of telomerase, the enzyme that rebuilds telomeres, the protective caps at the ends of chromosomes.
          Telomere length is a marker whose reading only means something against your calendar age, which this report
          does not have, so this result carries no score.
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of the T version of this DNA position (about 37 in 100 people of European ancestry do).
          Large studies link each copy of T with slightly shorter telomeres in white blood cells, about a tenth of the
          usual spread between people. That is a tendency in a marker whose reading only means something against your
          calendar age, which this report does not have, so it carries no score.
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the T version of this DNA position (about 6 in 100 people of European ancestry do).
          Large studies link each copy of T with slightly shorter telomeres in white blood cells, about a tenth of the
          usual spread between people per copy. That is a tendency in a marker whose reading only means something
          against your calendar age, which this report does not have, so it carries no score.
