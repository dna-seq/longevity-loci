# The seed list's locus 23, TERC (3q26.2), with locus 104 (LRRC34/TERC) folded in: a marker of biological ageing
# (D32, D36.3), curated on D37.12. Curated 2026-11-16. Lead rs10936599, the seed's rsID for 23 (104 names
# rs10936600, r² 1.00 and D' 1.00 in CEU): GRCh38 3:169,774,313, GRCh37 3:169,492,101, multi-allelic C/G/T, the row
# meaning C/T; C ancestral; T at 24.5 % in gnomAD's non-Finnish European genomes, 56.5 % in East Asians, 6.6 % in
# Africans; C>T synonymous in MYNN (His6His), near TERC, the telomerase RNA. T is the shorter-telomere allele.
locus_id: 23
locus_name: TERC
also_loci: [104]
verdict: kept
verdict_reason: >-
  Tier B, the seed's, on the marker's own evidence (D37.12): the tier grades the association with leukocyte
  telomere length, not longevity, and this row is unscored (D32). Codd 2013's genome-wide meta-analysis of mean
  leukocyte telomere length in 37,669 Europeans of the ENGAGE cohorts puts T with shorter telomeres, β −0.097 SD per T
  (SE 0.008), P 2.54e-31, its strongest locus. Taub 2022's whole-genome sequences of 109,122 TOPMed participants (US
  cohorts of European, African, Hispanic/Latino and Asian ancestry, outside ENGAGE) replicate TERC genome-wide: its
  sentinel rs12637184, r² 1.00 with rs10936599 in CEU, P 1.3e-96 pooled and 1.0e-50 in Europeans, −59.8 bp per
  counted allele, with no heterogeneity across ancestries (Cochran's Q P 0.51); the GWAS Catalog records rs10936599
  itself in that study at P 8e-95 (cited on the tier, no study entry, since its allele is not printed). Taub prints no counted allele (the Catalog records none either), only that its 59
  sentinels' effect sizes are highly consistent with the earlier qPCR GWASs, TERC among them. §4.1's A, with the
  marker in place of lifespan, needs a study of 100k or more replicated on the same allele and side (§6.3 asks the
  study's effect allele); Taub's allele is unprinted, so its side at rs10936599 is inferred, not read, and the row is
  B: genome-wide (Codd), with the one independent replication's allele unknown. A on Taub's consistency statement is
  put to the lead. Li 2020 (up to 78,592 Europeans) has the seed's locus 104 at rs10936600,
  T −0.086 SD per T, P 7.2e-51, the same signal (r² 1.00 in CEU), but most of its ENGAGE samples were Codd's, so it
  adds no independent test; 104 is folded in here (D14). Lifespan look-ups, unscored and read for T: Timmers 2019
  T beta1 +0.0085 (SE 0.0045), P 0.057, one-sided 0.029 with longer-lived parents; Park 2025's own survival flat (P
  0.73; men 0.94, women 0.69; its columns swapped); FinnGen R11's deaths have T with more deaths, flat (β +0.0077,
  P 0.35), a database line (D29.1); Deelen 2019 flat (90th T −0.021, P 0.34; 99th +0.015, P 0.67); Zenin 2019's
  healthspan has T with the lower hazard, P 0.0032; Pilling 2017's four parental scans (by rsID and by position) and
  Foote 2025's deposits hold no line (untested). The literature search (the rsID, 2026-11-16; Semantic Scholar
  answered 429, its part unchecked) finds candidate-gene studies of bladder and colorectal cancer, COPD and
  depression, and telomere-length instrument papers, none a test of this variant on lifespan. Every genotype
  neutral, each conclusion a tendency of the marker with no colour (D32, D37.12); `direction: unknown`, since the row
  claims no longevity direction. Outcome cells read for T: exceptional survival 0 (Deelen flat); lifespan + (Timmers,
  one-sided 0.029); healthspan + (Zenin, P 0.0032). Mechanism: markers of biological ageing. Pleiotropy
  `mech:cancer`: C, the longer-telomere allele, raises bladder cancer (OR 1.08, P 1e-14), multiple myeloma (1.16, P
  3e-8), chronic lymphocytic leukaemia (1.26, P 2e-9), colorectal cancer (1.04, P 3e-8; Codd's own search too) and
  cutaneous melanoma (P 8e-19), as Codd notes for colorectal cancer and multiple sclerosis; no `tradeoff`, since the
  row names no longevity-favoured allele. Causal C2: in Codd's telomere-length credible set at PIP 0.115 (Li's at
  0.053, nine others 0.009 to 0.067; Open Targets 26.09, both pages read). Effector E3, ambiguous: locus-to-gene
  gives ACTRT3 0.51 on Codd's set but 0.39 on Li's, and it scores protein-coding genes only, so TERC, the gene the
  papers name, is never scored; C>T is synonymous in MYNN, not E1. Descriptive. Age of action unknown. The evidence
  is European and, through TOPMed, multi-ancestry; T's frequency differs widely between ancestries (6.6 % to 56.5 %).
