# The seed list's locus 23, TERC (3q26.2), with locus 104 (LRRC34/TERC) folded in: a marker of biological ageing
# (D32, D36.3), curated on D37.12. Curated 2026-11-16. Lead rs10936599, the seed's rsID for 23 (104 names
# rs10936600, r² 1.00 and D' 1.00 in CEU): GRCh38 3:169,774,313, GRCh37 3:169,492,101, multi-allelic C/G/T, the row
# meaning C/T; C ancestral; T at 24.5 % in gnomAD's non-Finnish European genomes, 56.5 % in East Asians, 6.6 % in
# Africans; C>T synonymous in MYNN (His6His), near TERC, the telomerase RNA. T is the shorter-telomere allele.
locus_id: 23
locus_name: TERC
also_loci: [104]
verdict: kept
verdict_reason: >-
  Tier A on the marker's own evidence (D37.12; the seed B; B until D38.5, 2026-11-16): the tier grades the
  association with leukocyte telomere length, not longevity, and this row is unscored (D32). Codd 2013's genome-wide
  meta-analysis of mean leukocyte telomere length in 37,669 Europeans of the ENGAGE cohorts puts T with shorter
  telomeres, β −0.097 SD per T (SE 0.008), P 2.54e-31, its strongest locus. Codd 2021 measured telomere length in
  472,174 UK Biobank participants, outside ENGAGE (log-transformed, Z-standardized): its Supplementary Table 1 prints
  the TERC sentinel rs2293607 with A1 (the effect allele) T at 0.758, β +0.094 (0.090 to 0.099), P < 1.0e-314, N_imp
  464,283, Europeans alone the same. rs2293607 is r² 1.00, D′ 1.00 with rs10936599 in CEU, and opposite coupling at
  these frequencies would cap r² near 0.1, so rs2293607-C, the shorter allele, travels with rs10936599-T: the same
  allele and side as Codd 2013. D21's test: Codd 2013 −0.097 (SE 0.008) against Codd 2021 −0.094 (SE 0.0023), both in
  SD units, heterogeneity P 0.72, Codd 2013's power at Codd 2021's effect 1.00: no red flag, no shrinkage. A study of
  100k or more, genome-wide, replicated independently on the same allele: §4.1's A. The lead is inside Codd 2021's
  locus-28 credible set as Open Targets reads it (C2 below), so §4.1's tag clause does not apply (D38.5); Codd's own
  95 % set prints rs2293607 (PP 0.89) and Taub's sentinel rs12637184 (0.09), and rs10936599 appears in no sheet, which
  may be a multi-allelic site never analysed, named. Taub 2022's whole-genome sequences of 109,122 TOPMed participants
  (outside ENGAGE) replicate TERC genome-wide too: its sentinel rs12637184, r² 1.00 with rs10936599 in CEU, P 1.3e-96
  pooled and 1.0e-50 in Europeans, with no heterogeneity across ancestries (Cochran's Q P 0.51); the GWAS Catalog
  records rs10936599 itself in that study at P 8e-95. Taub prints a minor allele count (47,452 of 218,244 alleles) but
  no counted allele, so it is cited on the tier with no study entry (§6.3). Li 2020 (up to 78,592 Europeans) has the
  seed's locus 104 at rs10936600, T −0.086 SD per T, P 7.2e-51, the same signal (r² 1.00 in CEU), but most of its
  ENGAGE samples were Codd 2013's, so it
  adds no independent test; 104 is folded in here (D14). Lifespan look-ups, unscored and read for T, two-sided at
  0.05 (D38.6): Timmers 2019 T beta1 +0.0085 (SE 0.0045), P 0.057, T's way and short of 0.05; Park 2025's own survival flat (P
  0.73; men 0.94, women 0.69; its columns swapped); FinnGen R11's deaths have T with more deaths, flat (β +0.0077,
  P 0.35), a database line (D29.1); Deelen 2019 flat (90th T −0.021, P 0.34; 99th +0.015, P 0.67); Zenin 2019's
  healthspan has T with the lower hazard, P 0.0032; Pilling 2017's four parental scans (by rsID and by position) and
  Foote 2025's deposits hold no line (untested). The literature search (the rsID, 2026-11-16; Semantic Scholar
  answered 429, its part unchecked) finds candidate-gene studies of bladder and colorectal cancer, COPD and
  depression, and telomere-length instrument papers, none a test of this variant on lifespan. Every genotype
  neutral, each conclusion a tendency of the marker with no colour (D32, D37.12); `direction: unknown`, since the row
  claims no longevity direction. Outcome cells read for T: exceptional survival 0 (Deelen flat); lifespan 0 (Timmers
  two-sided 0.057, Park, FinnGen and the rest flat; D38.6); healthspan + (Zenin, two-sided 0.0032, T the side with the
  lower hazard). Mechanism: markers of biological ageing. Pleiotropy
  `mech:cancer`: C, the longer-telomere allele, raises bladder cancer (OR 1.08, P 1e-14), multiple myeloma (1.16, P
  3e-8), chronic lymphocytic leukaemia (1.26, P 2e-9), colorectal cancer (1.04, P 3e-8; Codd's own search too) and
  cutaneous melanoma (P 8e-19), as Codd notes for colorectal cancer and multiple sclerosis; no `tradeoff`, since the
  row names no longevity-favoured allele. Causal C2: in Codd's telomere-length credible set at PIP 0.115 (Li's at
  0.053; Open Targets 26.09, both pages read). Effector E3, ambiguous: locus-to-gene
  gives ACTRT3 0.51 on Codd's set but 0.39 on Li's, and it scores protein-coding genes only, so TERC, the gene the
  papers name, is never scored; C>T is synonymous in MYNN, not E1. Descriptive. Age of action unknown. The evidence
  is European (ENGAGE and UK Biobank) and, through TOPMed, multi-ancestry; T's frequency differs widely between ancestries (6.6 % to 56.5 %).
