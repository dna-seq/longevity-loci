    stat_significance: nominal
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as nearly everyone does. It is the
          reference the other combinations are compared with. The position lies in a stretch of DNA on chromosome 1
          that makes no protein.
      - genotype: C/G
        state: protective
        conclusion: >-
          You carry one copy of a rare version of this DNA position, found in about 2 in 100 people of East Asian
          ancestry and almost never in people of European ancestry. One Taiwanese study found it more often among
          people who lived to 95 than in the wider East Asian population; it has not been confirmed in an independent
          sample, so this is weak, early evidence, and it applies to East Asian ancestry: a possible tendency, not
          destiny.
      - genotype: G/G
        state: protective
        conclusion: >-
          You carry two copies of a rare version of this DNA position, which is very unusual. One Taiwanese study found
          single copies more often among people who lived to 95; nothing is known about two copies, and the finding has
          not been confirmed, so it is weak, early evidence.
