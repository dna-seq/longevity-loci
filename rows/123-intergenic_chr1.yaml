# The seed list's locus 123, intergenic chr1 (1q31.1). Curated 2026-11-15. Lead rs184517867, the seed's only rsID (Hsieh
# 2026's 95-and-over Taiwanese locus): intronic in a lncRNA, GRCh38 1:188,090,337 C/G (multi-allelic, C/G/T), GRCh37
# 1:188,059,468, G the rare allele (1.2 % in gnomAD's East Asian genomes, absent in Europeans) and the discovery's
# longer-lived side. Open Targets 26.09 has no record under either allele order; the GWAS Catalog (2026-10-29) holds no
# association.
locus_id: 123
locus_name: intergenic chr1
verdict: kept
verdict_reason: >-
  Tier C, the seed's: a sub-genome-wide discovery in one old-against-young sample (R-TIER-2, R-TIER-4), with no
  same-scale contradiction and nothing independent passing (D31.13's Hsieh bullet). Hsieh 2026 compared 248 Taiwanese
  hospital patients who died at 95 or over with 873 who died at 65 to 75 at the same hospital: G (0.012, pooled) OR
  9.96 per G, P 5.65e-6, under the paper's suggestive line of 1e-5. Solved from the OR and the counts (per Alt, the
  pooled frequency, as rows 113 and 119 read the tables), the controls carry G at about 0.0041 (about 7 copies in 1,746
  alleles) and the long-lived at about 0.040 (about 20 in 496). Against gnomAD's East Asian genomes (0.0123, the
  reference D31.13 fixes) the controls misfit (21.4 copies expected, P 0.003 by a normal test counting the reference's
  sampling error; Fisher's exact 0.0021), so D31.10 reads the
  discovery against the reference: the long-lived alone give OR 3.32 (log 1.20, SE 0.26), Wald P 4.8e-6, Fisher's exact two-sided
  2.3e-5 (derived), nominal by D31.5's band, not suggestive, above
  it, so something is left to read and the source is not overfit (D31.11 not reached; row 107's shape, with a firmer
  read). The solve takes the covariate-adjusted OR as allelic; across its 95 % interval (3.7 to 27, from its P) the
  controls run from about 13 copies (P 0.11 against gnomAD, a fit, read as printed) to about 3 (P 1e-4), and the
  long-lived from about 14 to 24 copies, above the reference throughout (read OR 2.3, P 0.0066, to 4.0, P 1.5e-8,
  derived). Taiwan Biobank's printed 0.011 agrees (controls P 0.006 on the point value, cases OR 3.7). One branch
  differs: against the southern Han CHS (7 of 210, 0.033) with its sampling error the controls misfit (P 2.5e-6 by the same normal test; Fisher's exact 2.6e-4) and the
  long-lived sit at it (OR 1.20, P 0.69, derived), D31.11's shape, which would make the row D; the reference D31.13
  fixes is gnomAD's East Asians, and the branch is named. The paper removed variants under MAF 1 %; G's pooled 0.012
  sits just above. Its validation cohort gives OR 7.17, P 0.032, the same direction, but its
  controls are not its own (Fig. 2), so it is not an independent replication (D19.1). G is absent in gnomAD's
  non-Finnish and Finnish genomes, so no European sample can test it: Deelen 2019, Timmers 2019, Pilling 2017, Zenin
  2019, FinnGen R11, Park 2025 and Foote 2025 hold no line, and Wright 2019's four current-age lines 36 to 191 kb away
  cannot tag it; untested, not negative. Hsieh's 95-and-over APOE line (ε4 OR 0.63, P 0.12, Table S6) is unpowered;
  no lifespan conversion is needed here. The literature search (the rsID; Semantic Scholar
  answered 429, its part unchecked) finds nothing; Hsieh is found by its PMID, and its one citing paper is a Finnish
  polygenic lifespan score, with no single-variant test. Exceptional survival + (the reference read, exact P 2.3e-5, a
  derived test: the paper prints no comparison with gnomAD, which D31.10's letter asks for);
  lifespan untested; healthspan untested. Context `ancestry_specific:eas`: the variant is East Asian (and South Asian at
  0.35 %), absent in Europeans, and the claim is Taiwanese. Mechanism ageing in general (D25.7): intronic in a lncRNA,
  nothing recorded at the variant. Causal C4 and effector E4: no Open Targets record. Descriptive. Age of action
  unknown.
