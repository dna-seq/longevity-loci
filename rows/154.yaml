          of reaching very old age, but the same study's check in UK Biobank found no difference, so it is not counted
          for or against lifespan.
      - genotype: G/T
        state: neutral
        conclusion: >-
          You carry one copy of each of two common versions of this DNA position (about 50 in 100 people of European
          ancestry do). One European study found the T version more often among people who reached very old age, but
          its own check in a larger group found no difference, so it is not counted for or against lifespan.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the G version of this DNA position (about 23 in 100 people of European ancestry do).
          It is the reference the other combinations are compared with. One European study found it less often among
          people who reached very old age, but its own check in a larger group found no difference, so it is not
          counted for or against lifespan.
