variants:
  - rsid: rs75526165
    gene: ""
    phenotype: 9p23 intergenic, longevity, Taiwanese
    trait_efo_id: OBA_VT0005372
    effect_allele: T
    effect_size: 1.13
    effect_measure: OR
    stat_significance: not_significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (nearly everyone of European ancestry, and
          about 79 in 100 people of East Asian ancestry, do). It is the reference the other combinations are compared
          with. The position lies between genes on chromosome 9. One Taiwanese study linked the other version to a
          shorter life, but its comparison group carried that version unusually often, and against the wider East
          Asian population the very old did not differ, so it is not counted for or against lifespan.
      - genotype: A/T
        state: neutral
        conclusion: >-
          You carry one copy of a version of this DNA position that is common in people of East Asian ancestry (about
          19 in 100 carry one copy) and very rare elsewhere. One Taiwanese study found it less often among people who
          lived past 85, but its comparison group carried it unusually often, and against the wider East Asian
          population the very old did not differ, so it is not counted for or against lifespan.
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of a version of this DNA position that is common in people of East Asian ancestry
          (about 1 in 100 carry two copies) and very rare elsewhere. One Taiwanese study found it less often among
          people who lived past 85, but its comparison group carried it unusually often, and against the wider East
          Asian population the very old did not differ, so it is not counted for or against lifespan.
