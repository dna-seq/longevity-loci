# The seed list's locus 150, intergenic chr9 (9p23). Curated 2026-11-16. Lead rs75526165, the seed's only rsID (Hsieh
# 2026's 85-and-over Taiwanese locus): GRCh38 9:13,549,784 T/A, intronic in an unnamed lncRNA (ENSG00000226197), A at
# 0.109 in gnomAD's East Asian genomes and 0.0002 in the non-Finnish Europeans, A the discovery's shorter-lived allele and
# T the longer-lived. Open Targets 26.09 has no record of it; the GWAS Catalog (2026-10-29) holds no association.
locus_id: 150
locus_name: intergenic chr9
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's C: a discovery whose controls misfit the reference and whose long-lived, read against it,
  show nothing, an overfit source (D31.10, D31.11; row 121's shape), with no other evidence at the lead. Hsieh 2026
  compared 1,595 Taiwanese hospital patients who died at 85 or over with 880 who died at 65 to 75 at the same
  hospital: A (0.119, pooled) OR 0.58 per A, P 1.9e-7, under the paper's suggestive line of 1e-5. Solved from the OR
  and the counts (per Alt, the pooled frequency, as rows 113 and 119 read the tables), the controls carry A at about
  0.157 and the long-lived at about 0.098 (derived). Against gnomAD's East Asian genomes (0.1088, 561 of 5,156
  alleles), the reference D31.13 fixes, the controls misfit: about 277 copies where 191.5 are expected, P 1.6e-8 by a
  normal test with the reference's own error, Fisher's exact 1.4e-7 (derived). So the discovery is read against the reference (D31.10): the long-lived show
  about 312 copies where 347 are expected, OR 0.89 (T 1.13), P 0.12, one-sided 0.059 (Fisher's exact 0.11; derived),
  nothing there: the case-control OR is the controls' excess and sets nothing (D31.11). Across Hsieh's OR interval
  (0.47 to 0.71, from its P) the read runs from OR 0.81, P 0.0061, to 0.97, P 0.68 (derived): nominal only at the
  interval's edge. Two branches are named, not read: against
  1000 Genomes CHS (0.133, 210 alleles, with its error) the controls fit (P 0.33) and the long-lived sit lower (P
  0.14), D31.11's shape as 123 and 131 name it; against Taiwan Biobank's printed 0.116, taken as exact, the controls
  misfit too (P 6e-8) and the long-lived sit lower at P 0.0013 (derived), the table's own population, not D31.13's fixed reference. That branch is 123's shape (C, exceptional `+`), and
  D31.13's Hsieh bullet gives C to a Hsieh row with no same-scale contradiction and nothing passing; 150 departs
  from it because D31.10 reads the discovery against the fixed reference first, and there it shows nothing (D31.11).
  Taking Taiwan's figure because gnomAD gave nothing would be the second-reference
  choice D31.13 bars, so the row is D (D31.11, D31.13, as written; the lead, 2026-11-16). The validation cohort (85 and over at a second hospital) gives OR 0.504, P 0.0002, but its controls are not its own (Fig. 2; the cohort is 844 people aged 85 and over, q5), so it is not
  independent (D19.1); which controls it used is not printed, so its long-lived cannot be read against the reference. A is all but absent in Europeans (0.02 %), so no European sample tests it: Deelen 2019, Timmers 2019, Park 2025 (all three files), FinnGen R11, Pilling 2017, Zenin 2019 and Foote 2025
  were each looked up at the variant (2026-11-16, GRCh37 9:13,549,783) and hold no line: untested, not negative. Hsieh's APOE line in its
  older groups is null (D31.13), so no calibration is the paper's own. The literature search (the rsID, 2026-11-16;
  Semantic Scholar answered 429, its part unchecked) finds nothing, Hsieh included, which is found by its
  PMID. Every genotype neutral (D25.2). Exceptional
  survival 0 (the read against the reference fails, D31.10); lifespan untested; healthspan untested. The ancestry is
  named here, not as a context token (D30.15). Mechanism ageing in general (D25.7): intronic in an unnamed lncRNA,
  nothing recorded at the variant. Causal C4 and effector E4: no Open Targets record. Descriptive. Age of action
  unknown.
