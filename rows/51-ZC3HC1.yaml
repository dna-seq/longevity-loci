variants:
  - rsid: rs56179563
    gene: ZC3HC1
    phenotype: ZC3HC1 region, coronary disease, blood pressure
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: 0.2107
    effect_measure: beta
    stat_significance: suggestive
    direction: protective
    negatives: >-
      The longer-life version may slightly raise the chance of a slipped disc in the lower back (lumbar disc
      herniation).
    genotypes:
      - genotype: G/G
        state: risk
        conclusion: >-
          You carry two copies of the more common version of this DNA region, in the gene ZC3HC1 on chromosome 7
          (about 38 in 100 people of European ancestry do). In very large British, European and American studies,
          this version went with parents living slightly shorter lives, with a somewhat higher chance of heart
          disease and higher blood pressure, and fewer people reaching very old age. The effect is small: a few
          months of life at most, and a tendency, not destiny. It is a likely finding, not a settled one. The
          finding comes from people of European ancestry; less is known elsewhere.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy of each version of this DNA region, in the gene ZC3HC1 on chromosome 7. This is the
          most common combination in people of European ancestry (about 47 in 100), and it is the reference the
          other combinations are compared with. The region is linked to heart disease and blood pressure. The
          finding comes from people of European ancestry; less is known elsewhere.
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of the less common version of this DNA region, in the gene ZC3HC1 on chromosome 7
          (about 15 in 100 people of European ancestry do). In very large British, European and American studies,
          each copy went with parents living a few months longer, a lower chance of heart disease, lower blood
          pressure, and more people reaching very old age. The same version may slightly raise the chance of a
          slipped disc in the lower back. It is a likely finding, not a settled one, and the effect is small: a
          tendency, not destiny.
