variants:
  - rsid: rs2395029
    gene: ""
    phenotype: HLA-B*57:01 tag, reaching 100
    trait_efo_id: OBA_VT0005372
    effect_allele: G
    effect_size: 0.68
    effect_measure: OR
    stat_significance: nominal
    direction: risk
    negatives: >-
      The longer-life version, T, is also the one with less natural control of HIV if infected; the other version, G,
      marks the HLA-B*57:01 type that holds HIV in check.
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 93 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position lies in the HLA
          region of chromosome 6, which shapes how the immune system recognises infections. The finding comes from
          people of European ancestry.
      - genotype: G/T
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 7 in 100 people of European
          ancestry do). It marks an immune-system type, HLA-B*57:01, which one group of researchers found a little
          less often among people who reached 100 than among younger people. Much larger studies of parents'
          lifespans did not show a clear difference, so this is early evidence, not a settled finding. The same
          type helps the body hold HIV in check.
      - genotype: G/G
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 1 in 1,000 people of European
          ancestry do). It marks an immune-system type, HLA-B*57:01, which one group of researchers found a little
          less often among people who reached 100 than among younger people; too few people carry two copies to say
          more. Much larger studies of parents' lifespans did not show a clear difference, so this is early
          evidence, not a settled finding. The same type helps the body hold HIV in check.
