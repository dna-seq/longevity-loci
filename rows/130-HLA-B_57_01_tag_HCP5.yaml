# The seed list's locus 130, HLA-B*57:01 tag (HCP5) (6p21.33). Curated 2026-11-14. Lead rs2395029, the seed's only
# rsID: a non-coding exon of HCP5, GRCh38 6:31,464,003 T/G, GRCh37 6:31,431,780, G the rare allele (0.037 in gnomAD's
# non-Finnish Europeans) and the tag of HLA-B*57:01; T, the common allele, the longer-lived side. Open Targets 26.09
# has no record of the variant under either allele order; the GWAS Catalog (2026-10-29) holds eight associations, HIV-1
# control, AIDS progression, psoriasis and drug-induced liver injury among them, none for lifespan.
locus_id: 130
locus_name: HLA-B*57:01 tag (HCP5)
verdict: re-tiered
verdict_reason: >-
  Tier C, from the seed's B: a candidate-gene association replicated only in same-group samples (§4.1's C), capped
  there by R-TIER-2 in any case, and nothing near genome-wide. Rahmouni 2025 chose HLA-B*57:01 from its authors' HIV
  work and tested its tag in 2,597 European centenarians against 9,973 younger controls, one comparison per country:
  G is rarer among centenarians in all four (French OR 0.65, P 0.01; German 0.76, P 0.15; Danish 0.75, P 0.32; Italian
  0.57, P 0.05), fixed-effects OR 0.68, P 0.0003. All four comparisons are one group's, old against young, with the
  Danish cases imputed and their controls genotyped; the controls' G (0.029 to 0.039) runs at or below gnomAD's 0.037.
  Nothing independent replicates it and nothing countable contradicts it. Deelen 2019's 99th percentile, on the
  discovery's own odds scale, is flat and leans the other way (G slightly more common among the long-lived, P 0.75),
  at one-sided power 0.95 and heterogeneity P 0.008, which would be a D21 red flag; but Deelen's cohorts include the
  same CEPH French and Danish centenarians, so it is named, not counted (its 90th flat too, P 0.87). Timmers 2019's
  million parents' lives are flat (T +0.0055 per self, SE 0.0105, P 0.60); no published conversion carries a
  centenarian odds ratio to that scale (D26.3), though the 90th percentile's APOE factor would predict −0.080 for G
  per self and the loci's mean factor −0.19, both far from what was seen: stated, and put to the lead. FinnGen R11's
  death endpoint leans against the discovery (G fewer deaths, P 0.37), a database line; Park 2025's own survival T
  with fewer deaths (P 0.09). Pilling 2017's UK Biobank mothers favour T (P 0.026), fathers lean the other way (P
  0.19), both parents flat (P 0.57), top 10 % flat (P 0.61). Zenin 2019's healthspan flat (G earlier, P 0.40). The
  HLA class I region has lifespan lines of its own (Timmers' rs9267123 at 3.2e-7, 4 kb away; Wright's fathers' meta
  genome-wide at rs3131621, 6 kb), all common, none able by frequency to tag a 4 % allele (r² at most 0.47; derived):
  AncestryDNA is untested at the lead, and those signals are not this one. Foote 2025's frailty deposits and Rosoff
  2023's mvAge tables hold no line at it. The literature search (Europe PMC, OpenAlex, PubMed, Crossref, preprints;
  Semantic Scholar answered 429) finds no other longevity test. Exceptional survival + (the discovery itself), lifespan
  + (Pilling's mothers, one-sided 0.013; Timmers flat), healthspan 0. Mechanism immune and inflammation: G tags
  HLA-B*57:01, which controls HIV-1 (OR 5.3, P 1e-25) and slows AIDS progression, and which the authors tie to impaired
  MICA/MICB and natural-killer function. The trade-off is detected: T, the longer-lived allele, is the one with less
  natural control of HIV. The catalog's psoriasis association prints its allele as C (another strand's name, left
  unharmonised) and the liver-injury one none, so neither is read as a direction. No protection token: no disease
  association at the locus states T as its non-risk allele on this strand. Causal C4 and effector E4: no Open Targets
  record. Descriptive (a trade-off locus, §4.2). Age of action unknown. The evidence is European.
