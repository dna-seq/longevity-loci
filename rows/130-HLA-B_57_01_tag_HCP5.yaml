# The seed list's locus 130, HLA-B*57:01 tag (HCP5) (6p21.33). Curated 2026-11-14. Lead rs2395029, the seed's only
# rsID: a non-coding exon of HCP5, GRCh38 6:31,464,003 T/G, GRCh37 6:31,431,780, G the rare allele (0.037 in gnomAD's
# non-Finnish Europeans) and the tag of HLA-B*57:01; T, the common allele, the longer-lived side. Open Targets 26.09
# has no record of the variant under either allele order; the GWAS Catalog (2026-10-29) holds eight associations, HIV-1
# control, AIDS progression, psoriasis and drug-induced liver injury among them, none for lifespan.
locus_id: 130
locus_name: HLA-B*57:01 tag (HCP5)
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's B: a sub-genome-wide candidate-gene discovery that fails a powered test in its own ancestry
  (D30.11, a fortiori of D25.1). Rahmouni 2025 chose HLA-B*57:01 from its authors' HIV work and tested its tag in 2,597
  European centenarians against 9,973 younger controls, one comparison per country: G is rarer among centenarians in
  all four (French OR 0.65, P 0.01; German 0.76, P 0.15; Danish 0.75, P 0.32; Italian 0.57, P 0.05), fixed-effects OR
  0.68 (0.55 to 0.84), P 0.0003; one group's samples, old against young (R-TIER-2), the Danish cases imputed and their
  controls genotyped, the French controls' G (0.029) below gnomAD's non-Finnish 0.037. Timmers 2019's million parents'
  lives, outside those samples, are flat (G −0.0055 per self, SE 0.0105, P 0.60). Carried to that scale by D25.3's two
  calibrations at the 99th percentile (Deelen's APOE line over Timmers': factor 6.22; the loci's mean, 2.60), the
  discovery predicts G −0.062 and −0.149 per self: one-sided power 1.00 under both, heterogeneity P 0.0054 and
  0.00086 (at the 90th's factors 0.0026 and 0.00067; at half the effect 0.061 and 0.0032), a D21 red flag under both.
  No independent scoring-class study gives p < 0.05 the discovery's way: Pilling 2017's UK Biobank mothers favour T (P
  0.026) but sit inside Timmers, the failing sample (D30.11), and both parents (P 0.57), fathers (0.19, the other way)
  and the top 10 % (0.61) are flat; FinnGen R11's death endpoint leans against (G fewer deaths, P 0.37), a database
  line; Park 2025's own survival favours T (fewer deaths, P 0.09), UK Biobank again. Deelen 2019's 99th percentile, on
  the discovery's own odds scale, is flat and leans the other way (P 0.75; power 0.95, heterogeneity P 0.008), but its
  cohorts include CEPH's French and Danish centenarians (as row 89 found), so it is named, not counted; its 90th flat
  (P 0.87). Zenin 2019's healthspan flat (P 0.40). The HLA class I region's own lifespan lines (Timmers' rs9267123,
  3.2e-7, 4 kb away; Wright's fathers' meta genome-wide at rs3131621, 6 kb) are common and cannot tag a 4 % allele (r²
  at most 0.47 by frequency, derived): not this signal. None of the lead's 185 CEU proxies at r² 0.5 or more is in
  Wright's or Rosoff's tables; Foote 2025 holds 34, at rs41561016 (r² 1.00) mixed (F5 C less frail, P 0.0066; F6
  more disabled, P 0.0009), multivariate, scored nothing; its general, F3 and F4 windows came back empty, unread. The
  literature search (Europe PMC, OpenAlex, PubMed, Crossref, preprints; Semantic Scholar answered 429) finds no other
  longevity test. Every genotype neutral (D25.2); outcome cells 0 (D28.10): the contradicted discovery gives no +, and
  nothing independent gives one-sided P < 0.05 either way. Mechanism ageing in general, as on every D row (D25.7):
  G tags HLA-B*57:01, which controls HIV-1 (OR 5.3, P 1e-25) and which the authors tie to impaired MICA/MICB and
  natural-killer function; psoriasis (OR 4.1, its allele G by frequency) and flucloxacillin liver injury are its other
  records. Named; pleiotropy empty, since no longer-life allele is left to weigh them against. Causal C4 and effector
  E4: no Open Targets record either way. Descriptive. The evidence is European.
