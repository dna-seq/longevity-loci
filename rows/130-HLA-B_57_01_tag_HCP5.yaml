variants:
  - rsid: rs2395029
    gene: ""
    phenotype: HLA-B*57:01 tag, reaching 100
    trait_efo_id: OBA_VT0005372
    effect_allele: G
    effect_size: 0.68
    effect_measure: OR
    stat_significance: nominal
    direction: risk
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 93 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position lies in the HLA
          region of chromosome 6, which shapes how the immune system recognises infections. One study linked this
          position to reaching 100, but a much larger study of parents' lifespans did not confirm it, so it is not
          counted for or against lifespan.
      - genotype: G/T
        state: neutral
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 7 in 100 people of European
          ancestry do). It marks an immune-system type, HLA-B*57:01, which helps the body hold HIV in check. One
          group of researchers found it a little less often among people who reached 100, but a much larger study of
          about a million parents' lives found no such difference, so it is not counted for or against lifespan.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 1 in 1,000 people of European
          ancestry do). It marks an immune-system type, HLA-B*57:01, which helps the body hold HIV in check. One
          group of researchers found it a little less often among people who reached 100, but a much larger study of
          about a million parents' lives found no such difference, so it is not counted for or against lifespan.
