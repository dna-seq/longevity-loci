# The seed list's locus 66, TYR (11q14.3). Curated 2026-11-12. Lead rs1126809 (Zenin 2019's healthspan SNP, Table 2),
# the seed's only rsID here: TYR's R402Q missense change, G/A at GRCh38 11:89,284,793 (GRCh37 89,017,961), A the
# derived allele (0.28 in non-Finnish Europeans, 0.16 in Finns, almost absent in East Asians and Africans). In
# Zenin's, Timmers 2019's, Deelen 2019's, Park 2025's and FinnGen R11's summary statistics at the lead itself, and in
# Rosoff 2023's mvAge tables. Wright 2019's Supplemental Table 8 holds three fathers' SNPs within 0.25 Mb, weak tags
# (CEU r² 0.25 to 0.35), named, not scored.
locus_id: 66
locus_name: TYR
verdict: kept
verdict_reason: >-
  Tier B, the seed's, kept (D29.1, as row 63): genome-wide for healthspan with a co-occurring lifespan study (D16),
  and no scoring-class replication outside UK Biobank (D22.2), so not A. The criteria as read: (1) genome-wide for
  healthspan in 300,447 British UK Biobank participants: A, TYR's Gln402 allele, brings the end of healthspan
  earlier (Zenin 2019, β +0.040 per A on the log hazard, P 2.35e-13 after genomic control, the paper's call, D17.3).
  Zenin's replication in 96,313 other UK Biobank participants, unrelated to them, goes the same way, short of the
  paper's 0.05/12 (β +0.017, P 0.076, one-sided 0.038, at replication power 0.89; the paper's own 99.5 % bound on the
  expected P is 0.125). The replicated effect is under half the discovery's (heterogeneity P about 0.039 counting
  both errors, derived, D29.6): a smaller effect replicating, §4.1's B, not a failing sample, so no
  `replication_failed` (D25.13). Healthspan replicating healthspan in one biobank counts nothing toward A (D25.11). By component A raises cancer (P 2.6e-16) and, more weakly, the other diseases
  together (P 5.6e-4; stroke 0.011, diabetes 0.028) and own death (P 0.0012); the paper reads it as acting on both.
  (2) The co-occurring lifespan studies (D16), all in UK Biobank's people: Zenin's parents'-death meta-analysis (A
  +0.006, P 0.021, G one-sided 0.010) and own death (above), and Park 2025's own survival in 393,833 participants (G
  fewer deaths, P 0.0047, one-sided 0.0024; the deposit's allele columns swapped, as at APOE). Timmers 2019's million
  parental lives lean G's way and do not pass (P 0.15, one-sided 0.076), UK Biobank on G's side and LifeGen on A's.
  (3) Outside UK Biobank no look-up replicates and two lean the other way: FinnGen R11's any-death endpoint is flat
  (A log OR −0.0026, SE 0.0097, P 0.79; a database line, which never lifts a row, D29.1), and Deelen 2019's 90th and
  99th percentiles put A on the longer-lived side (log OR +0.032, SE 0.022, P 0.15; +0.010, P 0.78). AncestryDNA
  (Wright 2019) has no line at the lead, whose tables stop at P 3e-3 and hold clumped representatives, so untested,
  not null; three fathers' SNPs within 0.25 Mb tag it weakly (CEU r² 0.25 to 0.35), their direction not read, named,
  not scored. A literature search on the rsID found no further lifespan or longevity study (Semantic Scholar
  unchecked, HTTP 429). (4) The red flag, scaled from Zenin's own healthspan effect (D27.9), is unknown: no source
  prints a healthspan-to-lifespan calibration (D28.1, as at 63). The smallest factor on Zenin's β (0.0398 per A) at
  which a look would flag (one-sided power 0.8, heterogeneity P under 0.05; derived): FinnGen about 0.61, Deelen's
  90th about 1.40. The curator's ratios of APOE's lines from Zenin's scale (7.6 and 37, pmid-30729179#q89), which
  the row does not use (D28.1), would pass both; so the flag turns entirely on the calibration, and nothing
  contradicts at nominal level. Rosoff 2023's mvAge (G, P 6.9e-9; not novel, its healthspan input's) and Timmers 2020's multivariate
  scan (P 8e-13) pool these same samples; mvAge's Q test (P 2.1e-6) says the SNP reaches its inputs through a pathway
  of its own, and its frailty input agrees with healthspan (A frailer, P 2.8e-4) while its longevity input is
  Deelen's lean. Outcome: healthspan + (Zenin), lifespan + (UK Biobank's own and parents' deaths and Park; Timmers
  and FinnGen do not pass), exceptional survival 0 (Deelen leans against, not past nominal). Mechanism skin and sun,
  with mech:cancer: A is one of the best-known pigmentation and skin-cancer alleles (G lowers melanoma, P 5e-87, basal
  and squamous cell carcinoma and actinic keratosis; A raises a low tan response, P 2e-172), and Zenin's healthspan
  signal is mostly cancer, though not cancer alone; the route of the lifespan effect is not shown (D25.7). Broad: G
  also lowers dry macular degeneration (P 7e-12; the paper names macular degeneration) and age-related hearing
  impairment (A OR 1.05, P 2e-21). A trade-off by D18.1's letter: G, the longer-life allele, raises vitiligo (OR 1.50
  per G, P 1e-43) and, in one multi-trait analysis, primary open-angle glaucoma (P 7e-9). So descriptive (D18.2,
  §4.2: trade-off loci get no actionability label), against D25.11's "skin_sun rows are modifiable", which was set at
  17 and 35, neither a trade-off: put to the lead, default descriptive. Causal C1: coding with PIP at least 0.2
  (§4.2), the lead first in Zenin's 11-variant SuSiE-inf healthspan set at PIP 0.208, at the edge; the multivariate
  PICS sets (Timmers 2020, 0.28; mvAge, 0.14) are named, not counted (D25.5). Effector E1, TYR: the lead is TYR's
  missense change (R402Q, PolyPhen probably damaging; §4.2's coding clause), and locus-to-gene gives TYR 0.83, the
  only gene listed. The set's two cis QTL colocalisations are one NOX4 transcript-usage QTL in artery (aorta H4 0.98;
  tibial 0.78, under the cut), which D24 would make a rival by count for a non-coding lead; the coding clause is read
  as deciding, put to the lead with E1 as default. The protection is the absence of the risk allele: A, the minor
  allele, raises the hazard, and G, which most people carry, is the reference. Evidence is European; A is 0.13 in
  admixed Americans, 0.05 in South Asians and almost absent in East Asians and Africans: eur_only_evidence. Age of
  action unknown.
