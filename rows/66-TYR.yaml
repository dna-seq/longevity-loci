variants:
  - rsid: rs1126809
    gene: TYR
    phenotype: TYR R402Q, healthspan (mostly cancer)
    trait_efo_id: EFO_0009762
    effect_allele: A
    effect_size: 0.0398
    effect_measure: beta
    stat_significance: significant
    direction: risk
    negatives: >-
      The longer-life version, G, goes with less skin cancer but with more vitiligo, a loss of skin colour in patches,
      and in one analysis with slightly more glaucoma.
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA letter, the one most people of European ancestry
          have (about 52 in 100). It is the reference the other combinations are compared with. The letter sits in
          the TYR gene, which makes the pigment of skin, hair and eyes. This version goes with a higher chance of
          vitiligo, patchy loss of skin colour, which is uncommon. The finding comes mostly from people of European ancestry;
          less is known elsewhere.
      - genotype: A/G
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA letter in the TYR pigment gene (about 40 in 100
          people of European ancestry do). It goes with paler, sun-sensitive skin and more skin cancer, including
          melanoma. In a very large British study it went with a slightly earlier first major disease, mostly
          cancer, but other studies of long life do not clearly confirm an effect on lifespan. The effect is small;
          it is a tendency, not a verdict.
      - genotype: A/A
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA letter in the TYR pigment gene (about 8 in 100
          people of European ancestry do). It goes with paler, sun-sensitive skin and more skin cancer, including
          melanoma. In a very large British study each copy went with a slightly earlier first major disease, mostly
          cancer, but other studies of long life do not clearly confirm an effect on lifespan. The effect is small;
          it is a tendency, not a verdict.
