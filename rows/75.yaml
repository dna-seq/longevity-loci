variants:
  - rsid: rs35257605
    gene: ""
    phenotype: KLF12 region (13q22.1), own survival
    trait_efo_id: OBA_VT0005372
    effect_allele: CTT
    effect_size: -0.0031
    effect_measure: beta
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the shorter, more common forms of a short repeated stretch of DNA here (about 36 in
          100 people of European ancestry carry no copy of the longer form). The stretch, on chromosome 13, lies near
          the KLF12 gene. A large British study's published data hint at a very small link with survival, but the
          authors did not report it, it fell short of the usual bar, and no separate study confirmed it. It says
          nothing about your own lifespan.
      - genotype: C/CTT
        state: neutral
        conclusion: >-
          You carry one copy of a slightly longer form of a short repeated stretch of DNA here (about 48 in 100
          people of European ancestry do). A large British study's published data hint that this form goes with
          very slightly better survival, but the authors did not report it, it fell short of the usual bar, and
          other studies did not clearly see it. It says nothing about your own lifespan.
      - genotype: CTT/CTT
        state: neutral
        conclusion: >-
          You carry two copies of a slightly longer form of a short repeated stretch of DNA here (about 16 in 100
          people of European ancestry do). A large British study's published data hint that this form goes with
          very slightly better survival, but the authors did not report it, it fell short of the usual bar, and
          other studies did not clearly see it. It says nothing about your own lifespan.
  - rsid: rs116257533
    gene: ""
    phenotype: KLF12 region (13q22.1), own survival
    trait_efo_id: OBA_VT0005372
    effect_allele: G
    effect_size: -0.432
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, the one almost everyone of European
          ancestry has, and about 88 in 100 people of African ancestry. It is the reference the other combinations
          are compared with. The position, on chromosome 13, lies near the KLF12 gene.
      - genotype: G/T
        state: neutral
        conclusion: >-
          You carry one copy of a version of this DNA position that about 12 in 100 people of African ancestry carry
          and fewer than 1 in 1,000 people of European ancestry. A large British study's published data hint that
          the few European carriers in it died somewhat earlier, but the study's authors did not count it as a
          finding, it rests on a few dozen people, and no other study could check it. Nothing was studied in people
          of African ancestry. It says nothing about your own lifespan.
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of a version of this DNA position (about 4 in 1,000 people of African ancestry do;
          it is almost never seen in people of European ancestry). A large British study's published data hint that
          carriers of one copy died somewhat earlier, but the authors did not count it as a finding, it rests on a
          few dozen people, and no one with two copies was studied. Nothing was studied in people of African
          ancestry. It says nothing about your own lifespan.
