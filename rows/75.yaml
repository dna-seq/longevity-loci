# The seed list's locus 75, unnamed (13q22.1; the seed's gene and name columns empty, KLF12 its l2g_top for both
# rsIDs). Curated 2026-11-12. Lead rs35257605 as the seed has it, a poly-T repeat (13 T the reference, 11 to 17 T;
# the seed's C/CTT is the 15-T allele, 0.40 in Europeans) in KLF12's region; the seed's second rsID rs116257533 (G/T,
# T an African-ancestry allele) lies 108 kb away. Both entered by the methodology track from Open Targets'
# fine-mapping of Park 2025's deposits (GCST90551884, GCST90551886), with no tier vote. Park's paper names neither and
# never mentions KLF12; the GWAS Catalog holds no association for either.
locus_id: 75
locus_name: ""
verdict: re-tiered
verdict_reason: >-
  Tier D, "overfit source" (D26.7, which ruled that 75 is read as row 44); the seed gave none. The locus's only
  genome-wide evidence is a line in Park 2025's deposited summary statistics that the paper does not report.
  rs116257533's T, the minor allele, is at about 4.8 in 100,000 in the whole-cohort deposit (under its swapped
  allele columns, row 36). That is some 38 copies among 393,833 people (derived), about 21 times below the paper's
  own MAF 0.1 % filter. The line reads P 4.3e-9, with each T going with a Martingale residual 0.43 higher (more
  deaths), about 33 times APOE ε4's per-allele effect. A second variant 860 bp away, rs78594190, passes at the same
  frequency (P 5e-9), its G an African-ancestry allele in complete LD with T in Yoruba (r² 1.0). T is an African-ancestry allele (0.064 in 1000 Genomes Africans, 0.00018 in gnomAD's non-Finnish
  Europeans), so this is a rare African haplotype carried by a few dozen of the cohort's European-ancestry
  participants, as at row 44. Open Targets fine-maps the whole cohort to a set at P 4.5e-9 (PIP 0.54), and the
  second sex scan (the women, a subset, no replication) to one at P 6.6e-11. Both sets are QC-flagged and built
  without in-sample LD.
  The seed's lead is not that line. rs35257605, a common poly-T repeat, sits in a separate whole-cohort set at P
  4.9e-6 (PIP 0.070). In the deposit the 15-T allele that the seed writes as CTT goes with fewer deaths (13 T, C,
  more: β +0.0031, SE 0.00068, P 5.4e-6). Four common SNPs within 16 kb sit at the same frequency and P. That is a
  suggestive deposit line at a variant Park's filter admits, one the paper does not report. Nothing outside UK
  Biobank supports it. LifeGen holds no line for the repeat. At Park's neighbour rs9573270, LifeGen leans Park's way
  (T shorter-lived, P 0.0061, rs7987604 the same), but its UK Biobank part is the parents of Park's people, so it
  co-occurs with Park and does not replicate it (row 36's reading). Zenin 2019's healthspan, in the same UK Biobank
  sample, leans Park's way too at rs9573270 (P 0.25), flat. Deelen 2019 leans the other way at rs9573270 (90th percentile P 0.18, 99th 0.46). FinnGen r11's death
  endpoint, matched to the repeat by position and alleles, has CTT with slightly more deaths (P 0.26). Ensembl
  returns no LD for the repeat, so the neighbours' r² to it is unknown: they are read for direction only, and no
  power is computed. Zenin holds neither of the seed's rsIDs.
  Read on its own the repeat would be C, suggestive and unreplicated. The locus as the seed entered it rests on the
  excluded rare line, so it stays D (put to the lead: D26.7 assumed 75's lead was row 44's kind, and it is not).
  Both rsIDs are the seed's own at this locus, so both stay in the row; D25.6's scout queue is for a second signal
  with no seed id. Every genotype is neutral (D25.2). The genotype shares are 1000 Genomes' (the 15-T allele 0.40 in
  Europeans; rs116257533's T 0.064 in Africans). Lifespan is 0: the repeat's one valid test leans for, and a D row loses its +
  (D28.10). Healthspan and exceptional survival are untested: neither rsID has a line in Zenin or Deelen, and the
  neighbours' r² to the repeat is unknown.
  Causal C4 and effector E4, with no gene named (D28.12, as row 44): no longevity set holds either variant, and both
  sets rest on a line the row does not read as genome-wide. On them, in prose only, KLF12 is the candidate by
  locus-to-gene (0.68 and 0.74 in the seed). Mechanism general ageing, descriptive, age of action unknown.
