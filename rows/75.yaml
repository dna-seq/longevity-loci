    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the shorter, more common forms of a short repeated stretch of DNA here (about 36 in
          100 people of European ancestry carry no copy of the longer form). The stretch, on chromosome 13, lies near
          the KLF12 gene. A large British study's published data hint at a very small link with survival, but the
          authors did not report it, it fell short of the usual bar, and no separate study confirmed it. It says
          nothing about your own lifespan.
      - genotype: C/CTT
        state: neutral
        conclusion: >-
          You carry one copy of a slightly longer form of a short repeated stretch of DNA here (about 48 in 100
          people of European ancestry do). A large British study's published data hint that this form goes with
          very slightly better survival, but the authors did not report it, it fell short of the usual bar, and
          other studies did not clearly see it. It says nothing about your own lifespan.
      - genotype: CTT/CTT
        state: neutral
        conclusion: >-
          You carry two copies of a slightly longer form of a short repeated stretch of DNA here (about 16 in 100
          people of European ancestry do). A large British study's published data hint that this form goes with
          very slightly better survival, but the authors did not report it, it fell short of the usual bar, and
          other studies did not clearly see it. It says nothing about your own lifespan.
