# The seed list's locus 75, unnamed (13q22.1; the seed's gene and name columns empty, KLF12 its l2g_top for both
# rsIDs). Curated 2026-11-12. Lead rs35257605 as the seed has it, a poly-T repeat (13 T the reference, 11 to 17 T;
# the seed's C/CTT is the 15-T allele, 0.40 in Europeans) in KLF12's region; the seed's second rsID rs116257533 (G/T,
# T an African-ancestry allele) lies 108 kb away. Both entered by the methodology track from Open Targets'
# fine-mapping of Park 2025's deposits (GCST90551884, GCST90551886), with no tier vote. Park's paper names neither and
# never mentions KLF12; the GWAS Catalog holds no association for either.
locus_id: 75
locus_name: ""
verdict: re-tiered
verdict_reason: >-
  Tier C on the seed's lead, a suggestive line (D29.17: a row is tiered on its lead's own evidence); the seed gave
  none. rs35257605, a common poly-T repeat (the 15-T allele the seed writes as CTT is 0.40 in 1000 Genomes
  Europeans), is a line in Park 2025's whole-cohort deposit that the paper does not report: the 15-T allele with fewer
  deaths (13 T, C, more: β +0.0031, SE 0.00068, P 5.4e-6), in its own Open Targets set (P 4.9e-6, PIP 0.070,
  QC-flagged, no in-sample LD). Four common SNPs within 16 kb sit at the same frequency and P. A variant Park's
  filter admits, below 5e-8: suggestive. Nothing outside UK Biobank replicates it and nothing contradicts it.
  LifeGen holds no line for the repeat; at Park's neighbour rs9573270 it leans Park's way (T shorter-lived, P 0.0061,
  rs7987604 the same), but its UK Biobank part is the parents of Park's people, so it co-occurs and does not
  replicate (row 36's reading). Zenin 2019's healthspan, in the same sample, leans Park's way too (P 0.25). Deelen
  2019 leans the other way at rs9573270 (90th percentile P 0.18, 99th 0.46), and FinnGen r11's death endpoint,
  matched to the repeat by position and alleles, has the 15-T allele with slightly more deaths (P 0.26), both flat.
  Ensembl returns no LD for the repeat, so the neighbours' r² to it is unknown: they are read for direction only, and
  no power is computed. Unreplicated and uncontradicted, so C.
  The locus's genome-wide line is the seed's second rsID, rs116257533, and it sets nothing (D26.7, D28.12, D29.17;
  named here, kept out of the variants and studies). Its T, an African-ancestry allele (0.064 in 1000 Genomes
  Africans, 0.00018 in gnomAD's non-Finnish Europeans), is at about 4.8 in 100,000 in Park's deposit (under its
  swapped allele columns, row 36): some 38 copies among 393,833 people (derived), about 21 times below the paper's
  own MAF 0.1 % filter, P 4.3e-9, each T with a Martingale residual 0.43 higher (about 33 times APOE ε4's effect).
  rs78594190, 860 bp away, passes with it at the same frequency, its G in complete LD with T in Yoruba (r² 1.0): one
  rare African haplotype in a few dozen European-ancestry participants, row 44's overfit source. Its Open Targets
  sets (whole cohort P 4.5e-9, PIP 0.54; the women, a subset, 6.6e-11) rest on that line.
  Every genotype is neutral: a suggestive line is no claim on a person (§4.1's C carries no weight), and the
  genotype shares are 1000 Genomes'. Lifespan is + on Park's suggestive line, the one test of the lead (D29.17).
  Healthspan and exceptional survival are untested: the repeat has no line in Zenin or Deelen, and the neighbours'
  r² to it is unknown. Causal C4 and effector E4, no gene named: no longevity set holds the repeat, and its own set
  is sub-genome-wide (D28.5: a set on a signal the row does not read as genome-wide sets no level); KLF12 is the candidate by the
  seed's locus-to-gene (0.68), in prose only. Mechanism general ageing, descriptive, age of action unknown.
