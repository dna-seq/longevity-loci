# The seed list's locus 156, intergenic chr3 (3q11.2). Curated 2026-11-16. Lead rs79645902, the seed's only rsID (Hsieh
# 2026's 90-and-over Taiwanese locus): intergenic, GRCh38 3:96,542,656 A/G, GRCh37 3:96,261,500, A the reference and
# ancestral allele, G at 10.4 % in gnomAD's East Asian genomes and 0.06 % in the non-Finnish Europeans, G the
# discovery's shorter-lived allele and A the longer-lived. Open Targets 26.09 has no record of it; the GWAS Catalog
# (2026-10-29) holds no association.
locus_id: 156
locus_name: intergenic chr3
verdict: kept
verdict_reason: >-
  Tier C, the seed's: a sub-genome-wide East Asian discovery in one hospital's old-against-young sample (R-TIER-2,
  R-TIER-4), with no same-scale contradiction and nothing independent passing (D31.13's Hsieh bullet; rows 123 and
  152's shape). Hsieh 2026 compared 922 Taiwanese hospital patients who died at 90 or over with 871 who died at 65 to
  75 at the same hospital: G (0.10, pooled) OR 0.52 per G, P 5.82e-6, under the paper's suggestive line of 1e-5.
  Solved from the OR and the counts (per Alt, the pooled frequency, as rows 113 and 119 read the tables), the controls
  carry G at about 0.130 (226 copies in 1,742 alleles) and the long-lived at about 0.072 (133 in 1,844). Against
  gnomAD's East Asian genomes (10.4 %, 533 of 5,126 alleles, the reference D31.13 fixes and D37.2 keeps) the controls
  misfit (181 copies expected, Fisher's exact on both counts P 0.0035, D37.1), so D31.10 reads the discovery against
  the reference: the long-lived alone give OR 0.67 per G (A 1.49), Fisher's exact P 4.7e-5 (a normal test 7e-5;
  derived), nominal, not suggestive, below the reference, so something is left to read and the source is not overfit
  (D31.11 not reached). The misfit does not survive the printed pooled frequency's rounding: at 0.095 the controls fit
  (Fisher P 0.026), and the discovery would be read as printed (OR 1.92 per A); at 0.105 they misfit (P 3e-4). So
  "named, not read" holds at the printed value with that caveat; the tier is C and exceptional survival + on every
  reading (the long-lived against the reference P 4e-6 to 4e-4). The solve takes the covariate-adjusted OR as allelic;
  across its 95 % interval (0.39 to 0.69, from its P) the controls run from a misfit (Fisher P 3e-5) to a fit (P 0.13,
  read as printed), and the long-lived stay below the reference throughout (P 1e-8 to 0.014; all derived). The other
  references are named branches, each call stated (D37.2), and agree on the long-lived: 1000 Genomes EAS (108 of
  1,008) has the controls fit (P 0.09), so read as printed, C, and the long-lived below (OR 0.65, P 0.0015); the
  southern Han CHS (26 of 210) the controls fit (P 0.91), C, the long-lived below (OR 0.55, P 0.013); Taiwan Biobank's
  printed 0.125 (no count, so no exact test) the controls fit (normal, P 0.55), C, the long-lived well below (OR
  0.54). None moves the tier. Its validation
  cohort gives OR 0.599, P 0.029, the same direction, but its controls are not its own (Fig. 2), so it is not an
  independent replication (D19.1). G is all but absent in Europeans (0.06 %): Deelen 2019, Timmers 2019, Park 2025
  (all three files), Pilling 2017, Zenin 2019 and Foote 2025 were each looked up at the variant (2026-11-16) and hold
  no line, untested, not negative; FinnGen R11's deaths hold it (G at 0.74 % in Finns), β +0.019 (SE 0.044), more
  deaths, the discovery's way, P 0.67, flat, a database line (D29.1) short of power. Hsieh's 90-and-over APOE line is
  a powered null of its sample (D34.2), so no calibration is the paper's own. The literature search (the rsID,
  2026-11-16; Semantic Scholar and the preprint index answered 429, their part unchecked) finds nothing, Hsieh
  included, which is found by its PMID. Genotypes: A/A the reference, G carriers risk, as weak early evidence.
  Exceptional survival + (the reference read, Fisher P 4.7e-5, a derived test); lifespan 0 (FinnGen's flat line, short of
  power; D34.5); healthspan untested. Mechanism ageing in general (D25.7): intergenic, nothing recorded at the
  variant. Causal C4 and effector E4: no Open Targets record. Descriptive. Age of action unknown. The evidence is
  Taiwanese, as `ancestry_specific:eas`.
