    trait_efo_id: OBA_VT0005372
    effect_allele: A
    effect_size: 1.49
    effect_measure: OR
    stat_significance: nominal
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (nearly everyone of European ancestry, and
          about 80 in 100 people of East Asian ancestry, do). It is the reference the other combinations are compared
          with. The position lies between genes on chromosome 3.
      - genotype: A/G
        state: risk
        conclusion: >-
          You carry one copy of a version of this DNA position found mainly in people of East Asian ancestry (about 19
          in 100 carry it, and almost no one elsewhere). One Taiwanese study found it less often among people who
          lived past 90, in one hospital, and it has not been confirmed in an independent sample. This is weak, early
          evidence: a possible tendency, not destiny.
      - genotype: G/G
        state: risk
        conclusion: >-
          You carry two copies of a version of this DNA position found mainly in people of East Asian ancestry (about 1
          in 100 of them do). One Taiwanese study found single copies less often among people who lived past 90, a
          finding not yet confirmed, so nothing separate can be said about two copies.
