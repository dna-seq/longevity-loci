variants:
  - rsid: rs34459993
    gene: ""
    phenotype: 5q32 intergenic, longevity, Taiwanese
    trait_efo_id: OBA_VT0005372
    effect_allele: T
    effect_size: 2.63
    effect_measure: OR
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA position (about 64 in 100 people of European
          ancestry and 65 in 100 of East Asian ancestry do). It is the reference the other combinations are compared
          with. The position lies between genes on chromosome 5. One Taiwanese study linked this version to living
          past 95, but a large European study of long-lived people found no difference, so it is not counted for or
          against lifespan.
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of each version of this DNA position (about 32 in 100 people of European ancestry and 31
          in 100 of East Asian ancestry do). One Taiwanese study found the C version less often among people who
          lived past 95, but a large European study of long-lived people did not bear that out, so it is not counted
          for or against lifespan.
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the C version of this DNA position (about 4 in 100 people of European or East Asian
          ancestry do). One Taiwanese study found it less often among people who lived past 95, but a large European
          study of long-lived people did not bear that out, so it is not counted for or against lifespan.
