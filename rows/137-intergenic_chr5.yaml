# The seed list's locus 137, intergenic chr5 (5q32). Curated 2026-11-15. Lead rs34459993, the seed's only rsID (Hsieh
# 2026's 95-and-over Taiwanese locus): intergenic, GRCh38 5:147,120,800 T/C, GRCh37 5:146,500,363, C at 0.19 in gnomAD's
# East Asian genomes and 0.20 in the non-Finnish, C the discovery's shorter-lived allele and T the longer-lived. Open
# Targets 26.09 holds it only in a GTEx aorta transcript-usage QTL set of LARS1; the GWAS Catalog (2026-10-29) holds no
# association.
locus_id: 137
locus_name: intergenic chr5
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's C: a sub-genome-wide East Asian discovery that Deelen 2019 contradicts on the same scale at
  the variant itself (D31.13's Hsieh bullet, D26.11, D26.8; rows 122 and 131's shape). Hsieh 2026 compared 248
  Taiwanese hospital patients who died at 95 or over with 873 who died at 65 to 75 at the same hospital: C (0.181,
  pooled) OR 0.38 per C, P 2.2e-6, under the paper's suggestive line of 1e-5 (T log OR +0.968, SE 0.204 from its P,
  derived). Solved from the OR and the counts (per Alt, the pooled frequency, as rows 113 and 119 read the tables),
  the controls carry C at about 0.207 and the long-lived at about 0.090; against gnomAD's East Asian genomes (0.194,
  the reference D31.13 fixes) the controls fit (P 0.25 with its error), and across Hsieh's OR interval too (P 0.07 to 0.76), so the discovery is
  read as printed (D31.10 not met); against Taiwan Biobank's printed 0.184, taken as exact, they differ at P 0.014,
  above D31.13's 0.01 line (derived). Its validation cohort gives OR 0.584, P 0.047, the same direction,
  but its controls are not its own (Fig. 2), so it is not an independent replication (D19.1). Deelen 2019 tests the
  variant itself (T at 0.80): 90th percentile +0.0150 (SE 0.0254), P 0.55, and 99th −0.0064 (SE 0.0413), P 0.88, flat
  both ways; against Hsieh's log OR on the same scale, two log odds of long-lived status, heterogeneity P 3.8e-6 and
  3.0e-6, power 1.00, holding down to 0.08 and 0.11 of Hsieh's effect (derived): a D21 red flag, `replication_failed`,
  with no independent genome-wide pass in Deelen's ancestry to outweigh it (D34.1). Hsieh's 95-and-over APOE line is
  ε4 OR 0.63, P 0.12 (Table S6), unpowered, so no conversion to a lifespan scale is its own and the Timmers and Park
  tests are approximate and set no flag (D31.13): Timmers 2019 has T at beta1 +0.0049 (SE 0.0048), P 0.31, T's way,
  flat; Park 2025 T −0.0003 on the Martingale residual (its columns swapped), fewer deaths, P 0.67; FinnGen R11's
  deaths C +0.0029, P 0.80, a database line (D29.1); Pilling 2017's four parental scans flat (P 0.56 to 0.94). Zenin
  2019 flat (P 0.78). Foote 2025's factor 5 (poorer cognition) puts T, the longer-lived allele, on the frailer side
  (P 0.0087), and its factors 1 to 4 and 6 the same side, flat: healthspan − (D31.4, D34.13: D28.10 bars only the
  discovery from giving +). D22.3 does not spare it (D34.9): the looks split, those leaning T's way short of nominal (one-sided: Deelen's 90th
  0.28, Timmers 0.16, Park 0.33, FinnGen 0.40, Zenin 0.39) and Foote's factor 5 nominally against T (P 0.0087), as
  D34.9 read 131's. Wright 2019 lists nothing at the lead under its tables' P 0.003 cut (unknown above it), and
  its one line within 500 kb, the AncestryDNA fathers' rs10068414 198 kb away (P 3.4e-4), does not tag the lead (r²
  under 0.05). The literature search (the rsID, 2026-11-15; Semantic Scholar answered 429, its part unchecked) finds
  nothing; Hsieh is found by its PMID, and its one citing paper is a Finnish polygenic lifespan score, with no
  single-variant test. The ancestry is named here, not as a context token (D30.15). Every genotype neutral (D25.2).
  Exceptional survival 0 (Deelen flat, and a D row's discovery gives no +, D28.10); lifespan 0 (Timmers and Park
  flat); healthspan − (Foote's factor 5, T frailer, P
  0.0087; Zenin flat). Mechanism ageing in general (D25.7): intergenic, the variant only in a LARS1
  transcript-usage QTL set at PIP 0.024, membership only, named. Causal C4 and effector E4: no lifespan-class credible
  set. Descriptive. Age of action unknown.
