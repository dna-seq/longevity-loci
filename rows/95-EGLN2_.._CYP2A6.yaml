# The seed list's locus 95, EGLN2 .. CYP2A6 (19q13.2). Curated 2026-11-14. Lead rs12461964, the seed's only rsID
# (Pilling 2017's fathers-only SNP): intronic in EGLN2, 8 kb from CYP2A6; GRCh38
# 19:40,835,324, GRCh37 19:41,341,229, A/G, A 0.507 in non-Finnish Europeans and the longer-lived fathers' allele.
locus_id: 95
locus_name: EGLN2 .. CYP2A6
verdict: kept
verdict_reason: >-
  Tier B, the seed's: a single genome-wide study without independent replication, sex-specific to fathers. Pilling
  2017's GWAS of UK Biobank participants' fathers' attained age (415,311 people in the GWAS Catalog) puts A with
  longer-lived fathers, β −0.0126 (SE 0.0022) on the Martingale residual, P 8.2e-9, under the paper's per-GWAS 5e-8,
  so genome-wide in a stratum (D19.2), with B's caveat that Pilling ran five GWAS uncorrected. The other analyses of
  the same parents: both parents 1.8e-4, mothers 0.48 (A −0.0016), top 10 % 0.15, top 1 % 0.78. Fathers against
  mothers, heterogeneity P 3.6e-4 with both errors (D29.16): sex_specific:m. Nothing independent replicates it, and
  nothing powered contradicts it. Timmers 2019's LifeGen fathers without UK Biobank (Figure 2 source data, sample b)
  lean A's way, flat (one-sided 0.38): power 0.67 at the discovery's effect on the sheet's scale, heterogeneity P
  0.094, no flag (D21). Deelen 2019 leans A's way at both percentiles (90th one-sided 0.21, 99th 0.19); carried over
  by D25.3, it flags under APOE's factor (power 1.00, heterogeneity P 2.3e-4 from the fathers' effect, 0.025 from the
  both-parents form) and not under the loci's mean factor (power 0.83, P 0.10; 0.54, P 0.40), so no flag. FinnGen
  R11's death endpoint, independent of both, leans against A (G with fewer deaths, P 0.29, one-sided 0.14 against).
  Tested on Pilling's both-parents effect (D28.2) carried to Timmers' Figure 2 sheet by Pilling's own ratio (+0.0192
  per A, a per-self scale), it is a D21 flag: power 0.82, heterogeneity P 0.0028; on the per-parent scale (half, the
  scale rows 45 and 94 compared FinnGen on) power 0.36, P 0.026, no flag. Were it a flag, D25.1's letter would make
  the row D (no independent p < 0.05 for A); but a database release line only ever withholds A (D25.12, D27.1), so B
  is held, and which scale an own-death endpoint compares on, and whether a FinnGen flag can make D, are put to the
  lead. Wright 2019's
  AncestryDNA is untested: its fathers' lines in the window (rs4001941, rs4609955, 85 to 92 kb away) do not tag the
  lead (r² 0.11 or no pair in CEU). Within UK Biobank the rest co-occurs: Timmers 2019's million parents' lives, A
  longer, P 0.0071, "++" (UK Biobank inside); Park 2025's own survival, A with fewer deaths, P 0.0084 (its allele
  columns swapped), the same participants. Lifespan + (the discovery, Timmers), exceptional survival 0 (Pilling's top
  10 % and 1 %, Deelen, flat), healthspan 0 (Zenin, P 0.73; Foote's four readable factors flat). The rsID literature
  search (all six sources answered) finds no other lifespan study of the lead: Hu 2022 uses it as an instrument for
  paternal longevity, the rest are CYP2A6 pharmacology. Two routes, neither shown to carry it alone (D17.7, as row 29): mechanism general ageing, descriptive. Pilling's
  fathers' set (Open Targets SuSiE-inf, the lead at posterior 0.545) colocalises (H4 0.75 to 0.999) with 124 GWAS
  sets: 20 of lung disease and function (respiratory failure, COPD, emphysema, chronic airway obstruction, pneumonia,
  lung cancers), 11 of them signed and all with G on the shorter-lived side, 9 unsigned; 73 of lipids and fatty acids
  (24 signed with G, raising LDL and apolipoprotein B, 4 against, 45 unsigned); 4 of smoking, where A raises cotinine
  and years smoked (GWAS Catalog P 1e-12); coffee, kidney function and other sets besides. The GWAS Catalog has A
  lowering respiratory failure (P 2e-21) and chronic bronchitis (3e-15). The lung route may be smoking's (the
  colocalising smoking sets, CYP2A6 the effector below), but the longer-lived A smokes for longer, which leaves `modifiable`
  through smoking (row 80's label) unshown, and whether more years smoked makes A a trade-off (D18.1) is put to the
  lead with the mechanism; LDL runs with A's longer life, no harm quoted on its side. Pleiotropy mech:smoking and
  mech:lipids. Causal C1: the lead's posterior 0.545 in the fathers' set. Effector E2 CYP2A6: two CYP2A6 splicing QTLs
  colocalise with the set (H4 ≥ 0.8); the set has no locus-to-gene rows, so not E1; no rival gene colocalises (D24).
  A/G, about half of Europeans, is the reference (§6.2); A/A protective, G/G risk. No PROTECT token: A is at 0.51,
  neither the common non-risk allele nor a rare protective one. Age of action unknown. The evidence is European.
