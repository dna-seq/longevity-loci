variants:
  - rsid: rs12461964
    gene: CYP2A6
    phenotype: CYP2A6 region, fathers' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: -0.0126
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy of each version of this DNA position, as about half of people of European ancestry do.
          It is the reference the other combinations are compared with. The position, on chromosome 19, lies next to
          CYP2A6, a gene for a liver enzyme.
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of the A version of this DNA position (about 1 in 4 people of European ancestry do).
          In a very large British study the fathers of people with A lived a little longer, and A goes with less
          chronic lung disease. No separate study has confirmed the lifespan link, and the effect is small: not
          smoking matters far more than this position.
      - genotype: G/G
        state: risk
        conclusion: >-
          You carry two copies of the G version of this DNA position (about 1 in 4 people of European ancestry do).
          In a very large British study the fathers of people with G lived a little shorter lives, and G goes with
          more chronic lung disease. No separate study has confirmed the lifespan link, and the effect is small: not
          smoking matters far more than this position.
