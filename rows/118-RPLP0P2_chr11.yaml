# The seed list's locus 118, RPLP0P2 (chr11) (11q12.2). Curated 2026-11-15. Lead rs145265196, the seed's only rsID
# (Bae 2022's rare suggestive variant): intronic in the RPLP0P2 lncRNA, GRCh38 11:61,633,890 T/G, GRCh37
# 11:61,401,362; G, the discovery's longer-lived allele, 0.13 % in gnomAD's non-Finnish Europeans and far commoner in
# Middle Eastern, African and South Asian genomes. Open Targets 26.09 has no record of the variant under either allele
# order; the GWAS Catalog (2026-10-29) holds no association.
locus_id: 118
locus_name: RPLP0P2 (chr11)
verdict: kept
verdict_reason: >-
  Tier C, the seed's: a sub-genome-wide discovery in one old-against-young sample (R-TIER-2, R-TIER-4), unreplicated
  and, a rare variant, tested once at power 0.78 (Park, flat, no flag, on a line under Park's own filter), the other
  large samples holding no line. Bae 2022 pooled four centenarian studies (NECS,
  LLFS, LGP, SICS; 2,304 cases past the 99th percentile of their birth cohort and 5,879 controls, some from an
  Illumina repository matched by principal components): G at 0.0067 in the cases and 0.0015 in the controls, β 1.74
  (SE 0.347) on the log odds, P 6.3e-7, the lead of a peak of 25 rare SNPs; the lead is imputed, and its dosages match
  4,241 whole genomes (r 0.999), so the call is sound. Frequencies (D31.10): the pooled controls fit gnomAD's
  non-Finnish Europeans (0.0013) and TopMed, gnomAD and ALFA's 0.001 to 0.002, so the signal is the cases' and the
  discovery is read as printed. The paper's own split by ancestry has every group the same way (Southern Italian 0.012
  against 0.0023, Ashkenazi 0.012 against 0.0024, Danish 0.005 against 0.0022, central European 0.004 against 0.0008),
  with the group sizes unprinted; if the groups track the studies, the Ashkenazi and Southern Italian cases hold about
  10 of the cases' 31 or so copies, the highest frequencies but not most of the signal. Against references near each
  group, the Ashkenazi controls sit under gnomAD's Ashkenazi genomes (0.0066) and the Southern Italian under 1000
  Genomes' Iberians (0.0093 on 2 copies; Tuscans none), and G is 0.024 to 0.032 in Middle Eastern, African and South
  Asian genomes, so a little residual ancestry in cases or controls moves it far more than the gap: named, not
  testable without the group sizes (unknown). Its replications are unpowered: UK Biobank's fathers −0.022 (SE 0.041),
  P 0.59, and mothers +0.025 (SE 0.044), P 0.57, where Bae's own APOE line (0.84 in the discovery, 0.020 and 0.019 in
  the parents) carries G's 1.74 to about +0.04, power 0.27 and 0.22 (derived); UKB+LifeGen, which is Timmers 2019's
  data, drops variants under 0.5 %. Park 2025's own survival has G with more deaths, P 0.39 (one-sided 0.19 against);
  carried by the same APOE ratio (Park's rs429358 T −0.0129; D31.12) G expects about −0.027, power 0.78,
  heterogeneity P 0.003 (derived): short of D21's power, and a calibration from APOE alone sets no flag (D31.13);
  across the 95 % interval of Bae's APOE β (0.71 to 0.97) the power runs from 0.89 to 0.68 (derived). G is 0.095 % in
  Park's cohort, under Park's own MAF filter of 0.1 %, so the line is named, not read (D26.7, D29.17, D31.13), and the
  D31.12 test is stated as resting on a filtered line. Pilling 2017's top-10 % deposit flat (P 0.48), its other three holding no line. Deelen 2019, FinnGen R11
  (G absent in Finns), Zenin 2019 and Foote 2025 hold no line, and Wright 2019's two common lines within 500 kb cannot
  tag a 0.13 % variant: untested, not negative, and no LD look is possible for a variant this rare in 1000 Genomes'
  CEU (as 107). Timmers' strongest line within 500 kb is P 2.2e-4, Deelen's 8.7e-5: nothing suggestive. The literature
  search (the rsID; Semantic Scholar answered 429 and the preprint index timed out, their parts unchecked) and RPLP0P2
  with longevity terms find Bae and an editorial; of Bae's 18 citing papers none re-tests the variant (the same
  group's Calabrian GWAS among them). Outcome cells: exceptional survival + (the discovery, the row's only test),
  lifespan 0 (Bae's UK Biobank parents flat, unpowered; Park's filtered line named, not read), healthspan untested. Mechanism ageing in general
  (D25.7): intronic in a pseudogene's lncRNA, nothing recorded at the variant. Causal C4 and effector E4: no Open
  Targets record. Descriptive. Age of action unknown. The evidence is European, with the highest frequencies in its
  Ashkenazi and Southern Italian cases.
