# The seed list's locus 118, RPLP0P2 (chr11) (11q12.2). Curated 2026-11-15. Lead rs145265196, the seed's only rsID
# (Bae 2022's rare suggestive variant): intronic in the RPLP0P2 lncRNA, GRCh38 11:61,633,890 T/G, GRCh37
# 11:61,401,362; G, the discovery's longer-lived allele, 0.13 % in gnomAD's non-Finnish Europeans and far commoner in
# Middle Eastern, African and South Asian genomes. Open Targets 26.09 has no record of the variant under either allele
# order; the GWAS Catalog (2026-10-29) holds no association.
locus_id: 118
locus_name: RPLP0P2 (chr11)
verdict: kept
verdict_reason: >-
  Tier C, the seed's: a sub-genome-wide discovery in one old-against-young sample (R-TIER-2, R-TIER-4), unreplicated
  and, a rare variant, untested by every powered sample read here. Bae 2022 pooled four centenarian studies (NECS,
  LLFS, LGP, SICS; 2,304 cases past the 99th percentile of their birth cohort and 5,879 controls, some from an Illumina
  repository matched by principal components): G at 0.0067 in the cases and 0.0015 in the controls, β 1.74 (SE 0.347)
  on the log odds, P 6.3e-7, one of 25 rare SNPs in the peak. Frequencies (D31.10): the pooled controls fit gnomAD's
  non-Finnish Europeans (0.0013) and TopMed, gnomAD and ALFA's 0.001 to 0.002, so the signal is the cases' and the
  discovery is read as printed. The paper's own split by ancestry has every group the same way (Southern Italian
  0.012 against 0.0023, Ashkenazi 0.012 against 0.0024, Danish 0.005 against 0.0022, central European 0.004 against
  0.0008), with the group sizes unprinted; G is 0.0066 in gnomAD's Ashkenazi genomes, above those Ashkenazi controls,
  and 0.024 to 0.032 in Middle Eastern, African and South Asian genomes, so a little residual ancestry in cases or
  controls moves it far more than the gap: named, not tested (unknown). Its replications are unpowered: UK Biobank's
  mothers −0.022 (SE 0.041), P 0.59, and fathers +0.025 (SE 0.044), P 0.57, where Bae's own APOE line (0.84 in the
  discovery, 0.020 and 0.019 in the parents) carries G's 1.74 to about +0.04, power about 0.17 (derived); UKB+LifeGen
  and Timmers 2019 drop variants under 0.5 %. Park 2025's own survival has G with more deaths, P 0.39 (one-sided 0.19
  against); carried by the same APOE ratio (Park's rs429358 0.0129) G expects about −0.027, power 0.78, heterogeneity
  P 0.003 (derived): short of D21's power, no flag. Pilling 2017's top-10 % deposit flat (P 0.48), its other three
  holding no line. Deelen 2019, FinnGen R11 (G absent in Finns), Zenin 2019 and Foote 2025 hold no line, and Wright
  2019's two common lines within 500 kb cannot tag a 0.13 % variant: untested, not negative. The literature search
  (the rsID; Semantic Scholar answered 429 and the preprint index timed out, their parts unchecked) finds Bae and an
  editorial; Bae's citing papers could not be listed (Semantic Scholar 429). Outcome cells: exceptional survival +
  (the discovery, the row's only test), lifespan 0 (Park and UK Biobank's parents flat, unpowered), healthspan
  untested. Mechanism ageing in general (D25.7): intronic in a pseudogene's lncRNA, nothing recorded at the variant.
  Causal C4 and effector E4: no Open Targets record. Descriptive. Age of action unknown. The evidence is European,
  with Ashkenazi and Southern Italian samples carrying most of the signal.
