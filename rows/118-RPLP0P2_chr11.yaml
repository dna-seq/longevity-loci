variants:
  - rsid: rs145265196
    gene: ""
    phenotype: RPLP0P2 intronic rare variant, extreme longevity
    trait_efo_id: OBA_VT0005372
    effect_allele: G
    effect_size: 1.74
    effect_measure: beta
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as nearly everyone of European ancestry
          does. It is the reference the other combinations are compared with. The position lies in a non-coding stretch
          on chromosome 11.
      - genotype: G/T
        state: protective
        conclusion: >-
          You carry one copy of a rare version of this DNA position (about 1 in 400 people of European ancestry do, and
          more people of Middle Eastern, African or South Asian ancestry). One combined study of people who lived past
          about 100 found it several times more often among them, mostly in Ashkenazi Jewish and Southern Italian
          families, but it rests on a few dozen carriers, has not been confirmed, and the larger studies could not test
          it, so this is weak, early evidence: a slight tendency at most, not destiny.
      - genotype: G/G
        state: protective
        conclusion: >-
          You carry two copies of a rare version of this DNA position, which is very unusual. One combined study of
          people who lived past about 100 found single copies more often among them, a finding not yet confirmed, so
          nothing firm can be said about two copies.
