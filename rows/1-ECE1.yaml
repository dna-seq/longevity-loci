    effect_size: 1.11
    effect_measure: OR
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of one version of this DNA position (about 28 in 100 people of European ancestry do).
          It lies near the ECE1 gene on chromosome 1. One large study of long-lived people linked this version to
          reaching old age, but a much larger study of a million parents' lives did not confirm it, so it is not
          counted for or against lifespan.
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of each version of this DNA position, the most common combination (about 50 in 100
          people of European ancestry). It is the reference the other combinations are compared with. One study
          linked this position to reaching old age, but a much larger one did not confirm it, so it is not counted
          for or against lifespan.
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the other version of this DNA position (about 22 in 100 people of European ancestry
          do). It lies near the ECE1 gene on chromosome 1. One large study of long-lived people found it a little less
          often among them, but a much larger study did not confirm it, so it is not counted for or against lifespan.
