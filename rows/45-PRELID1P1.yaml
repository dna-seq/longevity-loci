    stat_significance: suggestive
    direction: protective
    negatives: >-
      The longer-life version goes with slightly lower bone density in children.
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, the one most people of European ancestry
          have (about 57 in 100). It is the reference the other combinations are compared with. The position, on
          chromosome 6, lies inside a gene's intron, and no gene is known to matter here.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of a version of this DNA position that about 36 in 100 people of European ancestry carry.
          In one large study of very old people (Deelen 2019) it was a little more common among those who reached
          about 90, but not by enough to count as a firm finding, and a much larger study of parents' lifespans
          found at most a far smaller effect. The same version goes with slightly lower bone density in children.
          It is early evidence, not a verdict.
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of a version of this DNA position (about 6 in 100 people of European ancestry do).
          In one large study of very old people (Deelen 2019) it was a little more common among those who reached
          about 90, but not by enough to count as a firm finding, and a much larger study of parents' lifespans
          found at most a far smaller effect. The same version goes with slightly lower bone density in children.
          It is early evidence, not a verdict.
