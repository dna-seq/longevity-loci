# The seed list's locus 45, PRELID1P1 (6q22.32; the seed's genes PRELID1P1 and RPS4XP9, two pseudogenes). Curated
# 2026-11-11. Lead rs1262476 (GRCh38 6:126,665,850; GRCh37 6:126,986,996, the position Deelen, LifeGen and Zenin
# print), the seed's only rsID, from Deelen 2019's trans-ethnic 90th percentile table, with a tier C vote. The
# GRCh38 reference is A, which is also the minor allele in Europeans (0.24) and the longer-life one; G is ancestral.
# Open Targets keys it as 6_126665850_A_G and FinnGen prints G as alt, so their betas are per G. A literature search
# on the rsID (2026-11-11) finds only Deelen 2019 and Kemp 2014's paediatric bone density GWAS (Europe PMC, OpenAlex;
# PubMed, Crossref and the preprint index 0; Semantic Scholar rate-limited, unchecked). No other seed locus lies
# within 1 Mb (seed positions 125.5 to 128 Mb read).
locus_id: 45
locus_name: PRELID1P1
verdict: kept
verdict_reason: >-
  Tier C kept: a suggestive longevity association never genome-wide, whose one powered test found a much smaller
  effect. In Deelen 2019's trans-ethnic meta-analysis of the 90th percentile age against all controls, A raises the
  odds of reaching it, OR 1.12 (1.07–1.17), P 9.8e-7, with no heterogeneity (I² 0). Table 4 lists every locus at
  P ≤ 1e-6, and the authors find no new genome-wide locus in it besides APOE and IL6. The European discovery alone
  is weaker and not even suggestive: 90th percentile A β +0.091 (OR about 1.10), P 5.1e-5; 99th +0.129, P 3.4e-4,
  its cases a subset of the 90th's. So the tier rests on the trans-ethnic line alone, which adds CLHLS's 2,178 East
  Asian and CHS's 177 African American cases (about 17 % of 13,617) to the Europeans. Its interval gives an SE of
  about 0.023 on a log OR of 0.113, against the European file's 0.0225 on 0.091: the added cases, among whom A is
  rarer (2 in 100 in East Asians), raise the estimate by a quarter with no gain in precision, unreconciled; the
  catalog holds no deposit for it. §4.1's C ("suggestive, p < 1e-5"); R-TIER-4 keeps a sub-genome-wide hit off A
  and B. `eur_only_evidence` stays: every test of the variant is European but the anchor, five sixths of whose cases
  are, and A is too rare in East Asians to carry signal there. Nothing replicates it. Timmers 2019's LifeGen parental lifespan (635,243 lives, UK Biobank and 26 cohorts,
  some shared with Deelen) leans A's way, β +0.0060 (SE 0.0044), P 0.18, one-sided 0.088. Against Deelen's European
  90th effect carried to that scale (D21 under both of D25.3's calibrations), the test is powered and the two
  estimates differ: by APOE's factor the expected β is +0.019, one-sided power 0.996, heterogeneity P 0.044; by the
  loci's mean factor +0.045, power 1.00, P 0.0011. A red flag under both, so `replication_failed`, as at row 31. The
  effect may be real and smaller (a suggestive discovery's estimate is inflated by its selection), or absent.
  FinnGen r11's death endpoint leans the same way (per A −0.0099 on the log hazard, P 0.28, one-sided 0.14), a flag
  under the mean factor only (power 1.00, heterogeneity P 0.015) and not under APOE's (power 0.65, P 0.39), so no
  flag there. Zenin 2019's healthspan is null, A's side healthier flatly (P 0.61). Not D: D25.1's "explicitly
  contradicted" is for a genome-wide discovery, and every test leans A's way. D is the alternative, put to the lead:
  the flag turns on a heterogeneity P of 0.044 under APOE's factor, and the European line alone is not suggestive.
  A trade-off is quoted (D18.1): Kemp 2014's paediatric upper-limb bone density, about 9,400 children, has G raising
  it (β +0.104, P 3e-9), so A, the longer-life allele, goes with lower bone density in childhood; Open Targets puts
  the lead first in that set (PIP 0.25). That low childhood bone density leads to adult harm is not quoted, and the
  adult femur-neck set's lead (61 kb away) is not phased with A: `tradeoff` is the default, none the alternative,
  put to the lead. It also leads a set of Rao 2022's
  ADHD, autism or intelligence scan (PIP 0.24, P 9e-9), no allele stated, so no direction; and it sits at low PIP
  (0.03 to 0.15) in sets of body fat, BMI, adult femur-neck bone density, sitting height and amlodipine
  prescriptions led by other variants 60 kb away, whose phase with A is unread: named, not counted. As a trade-off
  the locus is descriptive. Open Targets 26.09 holds eleven sets with the lead and none of lifespan, longevity,
  healthspan or survival: causal C4 and effector E4, no gene (D24); CENPW leads L2G in most of the other sets.
  Mechanism general ageing (D25.7), age of action unknown. Outcome: exceptional survival + (Deelen's 90th and 99th,
  the discovery itself); lifespan 0 (LifeGen and FinnGen not significant); healthspan 0 (Zenin). A/G and A/A are
  protective as early evidence, the reference G/G (about 57 in 100 Europeans).
