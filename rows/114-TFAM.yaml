# The seed list's locus 114, TFAM (10q21.1): a marker of biological ageing (D32, D36.3), curated on D37.12 with 23
# TERC as the pattern. Curated 2026-11-16. Lead rs12247015, the seed's rsID (Gupta 2023's mtDNA copy-number locus):
# 91 bp upstream of TFAM's MANE transcript, GRCh38 10:58,385,319, GRCh37 10:60,145,079, A/G (T a trace), A ancestral;
# A at 57.5 % in gnomAD's non-Finnish European genomes. A is the lower-copy-number allele.
locus_id: 114
locus_name: TFAM
verdict: kept
verdict_reason: >-
  Tier A on the marker's own evidence (D37.12; the seed gives D), the first marker row at A: the tier grades the
  association with mitochondrial DNA copy number in blood, not longevity, and this row is unscored (D32). Gupta 2023
  measured copy number from UK Biobank's whole genomes; its adjusted copy-number GWAS is UK Biobank's 163,372 people of
  six ancestry groups (Supplementary Table 1, All of Us not in it), and its Table 2 prints rs12247015 with A, the
  reference allele, at 0.582, β −0.0744 SD (SE 0.0036), P 7.7e-96, heterogeneity P 0.43, fine-mapped at PIP 1 (Table
  3). The table's legend names AF_Allele2 the reference allele's frequency, so the β (SAIGE's, per Allele2) is per A;
  Koller 2024's table and Chong 2022's Catalog line (G higher, P 1e-55, the same UK Biobank people) agree. Koller 2024
  replicates it outside UK Biobank: qPCR copy number in GCKD, CHRIS and AugUR, 16,130 Europeans, Table S11 a −0.0376
  (SE 0.0106), P 0.0004, A lower, its Effect per Allele1 (checked on Koller's own lead, rs4895440, against its text).
  Zaidi 2023 replicates it again in the Penn Medicine BioBank's 22,068 Europeans (exome-derived copy number, no UK
  Biobank): one of three Longchamps variants replicating at 0.05/110, P 1.14e-5, Table S3 A −0.0389 (the text's
  unsigned "βAallele=0.039" read by the table's signed line). Both papers print Longchamps 2022's estimate (UK Biobank
  with CHARGE, −0.0422) beside their own on one scale: Koller 0.89 times it, heterogeneity P 0.67 (power 0.98); Zaidi
  0.92 times, P 0.68 (power 1.00); no shrinkage (D21). Koller's 0.5 SD equivalence test shows nothing about effect
  size and is not used (D38.2); its text's 1e-55 for Longchamps' TFAM P is Chong's figure, Table S11 printing 4.4e-89.
  Genome-wide in a study of 100k or more, replicated independently twice on the same allele: §4.1's A (D38.3).
  Guyatt 2019's TFAM replication is another SNP, named, not counted. Lifespan look-ups, unscored and read for A, all flat: Timmers 2019 A beta1 +0.0017
  (SE 0.0039), P 0.66; Pilling 2017's parents P 0.24 to 0.80; Park 2025's own survival P 0.35 (men 0.55, women 0.42);
  FinnGen R11's deaths P 0.47, a database line; Deelen 2019 90th P 0.75, 99th P 0.81; Zenin 2019 P 0.42. Foote 2025's
  factor 1 (A −0.0042, P 0.030) and factor 6 (A −0.0068, P 0.0033) put A on the less frail side, the general factor
  leaning the same way (P 0.14), factors 2 to 5 flat (P 0.40 to 0.97), none the other way. The literature search (the
  rsID, 2026-11-16; Semantic Scholar answered 429, its part unchecked) finds the copy-number GWASs and Mendelian
  randomisation studies that use the locus as an instrument, no test of lifespan. Every genotype neutral, each
  conclusion a tendency of the marker with no colour (D32, D37.12); `direction: unknown`. Outcome cells read for A:
  exceptional survival 0 (Deelen flat); lifespan 0 (Timmers, Pilling, Park and FinnGen flat); healthspan + (Foote's
  factors 1 and 6, two-sided 0.030 and 0.0033, A the less frail, D38.6, D37.4; Zenin flat). Mechanism: markers of biological ageing;
  TFAM packages and replicates mitochondrial DNA. No pleiotropy: the Catalog holds the copy-number lines alone. Causal
  C1 (PIP 1.00 in Gupta's set, 0.96 in Chong's). Effector E2, TFAM: locus-to-gene 0.63 (IPMK 0.07), the variant
  upstream of TFAM and in TFAM's expression credible sets across GTEx tissues at PIP up to 1.00, G with lower
  expression (no colocalisation read; that G gives more copies with less TFAM expression is unexplained). Descriptive. Age of action unknown. The evidence is mostly European.
