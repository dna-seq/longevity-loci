variants:
  - rsid: rs12247015
    locus: {chrom: "10", start: 58385319, ref: A, cites: [db-ensembl-116#q1030]}  # rs12247015 is multi-allelic (A/G/T); the row means A and G
    gene: TFAM
    phenotype: TFAM upstream, mtDNA copy number
    trait_efo_id: EFO_0006312
    effect_allele: A
    effect_size: -0.07441
    effect_measure: beta
    stat_significance: significant
    direction: unknown
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the A version of this DNA position (about 33 in 100 people of European ancestry do).
          Large studies link each copy of A with slightly fewer copies of mitochondrial DNA in blood cells, under a
          tenth of the usual spread between people per copy. That is a tendency in a marker whose reading only means
          something against your calendar age, which this report does not have, so it carries no score.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy each of the two common versions of this DNA position, the most common combination (about
          49 in 100 people of European ancestry). It is the reference the other combinations are compared with. The
          position sits just before TFAM, the gene that packages and copies the DNA of the cell's power stations, the
          mitochondria. Their DNA copy number in blood is a marker whose reading only means something against your
          calendar age, which this report does not have, so it carries no score.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the G version of this DNA position (about 18 in 100 people of European ancestry do).
          Large studies link each copy of G with slightly more copies of mitochondrial DNA in blood cells. That is a
          tendency in a marker whose reading only means something against your calendar age, which this report does
          not have, so it carries no score.
