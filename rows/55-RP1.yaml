# The seed list's locus 55, RP1 (8q12.1). Curated 2026-11-12. Lead rs35262860 (the seed's only rsID), an insertion of
# CT in an intron of RP1 (db-ensembl-116#q379, q386, q387): VCF G/GCT at GRCh38 8:54,566,349, as FinnGen writes it; Deelen 2019
# prints GCT/G at GRCh37 8:55,478,909; Ensembl CT/CTCT at 54,566,350. The insertion is derived, 0.38 in Europeans and
# 0.02 in East Asians. LifeGen and Zenin have no line for the insertion and are read at rs13279568 (r² 1.0, D′ 1.0 in
# CEU; A phased with GCT by Deelen's own file, pmid-31413261#q148). A literature search on the rsID (2026-11-12) finds
# only Deelen 2019 (Europe PMC; PubMed, Crossref, OpenAlex and the preprint index 0; Semantic Scholar rate-limited,
# unchecked). Wright 2019's Supplemental Tables 8 and 9 hold no line within 100 kb (GRCh37 8:55.375-55.58 Mb), nor
# Timmers 2019's Figure 2 sheet.
locus_id: 55
locus_name: RP1
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's C (D26.8, row 45's shape): a suggestive longevity association, never genome-wide, that
  fails powered tests in its own ancestry, with no independent scoring-class study at p < 0.05 its way. In Deelen
  2019's European meta-analysis, which holds no UK Biobank data, the insertion GCT (0.39) raises the odds of reaching
  the 90th percentile age, OR 1.11 (1.07–1.15), P 3.9e-7, I² 0 (Table 2, which lists every variant at P ≤ 1e-6); the
  trans-ethnic version is P 5.6e-7, the GWAS Catalog's one record for it. The 99th percentile leans the same way (P
  1.2e-4), but its cases are a subset of the 90th's, so it does not replicate. Deelen's own validation in UK Biobank's
  parental longevity set (19,742 cases) goes the other way: OR 0.97 (0.94–0.99), P 0.021, and the authors call the
  set powered even at half the effect. On one scale, against the summary statistics' per-insertion 0.1028 (SE
  0.0203), the test has power 1.00 and heterogeneity P 4e-8 at the full effect, power 0.99 and P 9e-7 at half the
  effect for a parent's genotype (derived; Table 2's interval gives smaller P still): a red flag with no calibration
  needed (D25.3, as row 26). LifeGen's parental lifespan, at the perfect
  proxy rs13279568, puts the insertion's side shorter-lived (P 0.20, one-sided 0.90 in the discovery's direction),
  a red flag under both of D25.3's calibrations (APOE's factor: expected +0.021, power 1.00, heterogeneity P 5e-6;
  the loci's mean factor: +0.051, power 1.00, P 2e-7, or 4e-4 counting the mean's SE). It rests mostly on UK Biobank,
  as the Table 3 line does, so the two are one sample on two phenotypes, not two tests. FinnGen r11's death endpoint,
  with no UK Biobank (overlap with Deelen's Finnish cohort Vitality 90+ unknown, which would favour agreement), is flat (β +0.0003 per insertion, P 0.97), a red flag under both (APOE's
  factor: power 0.84, heterogeneity P 0.018; mean factor: power 1.00, P 7e-5, or 0.003 with the mean's SE). Zenin
  2019's healthspan leans the insertion's way at the proxy (P 0.20, one-sided 0.099), not nominal. So no independent
  scoring-class study replicates it, and two independent samples fail it, powered (UK Biobank, in Table 3 and within
  LifeGen, and FinnGen): D. The effect may be real and smaller (a
  suggestive estimate is inflated by its selection), or absent. Exceptional survival is `−` (D28.3, the lead's ruling;
  the previous commits' 0, after row 26, rejected): Deelen's own UK Biobank parental 90th percentile validation, outside
  its meta-analyses and so independent, goes against the insertion at P 0.021; the discovery's own 90th percentile
  (P 3.9e-7) gives no `+`, a D row standing on no study (D28.10, the lead's ruling). Lifespan 0
  (LifeGen and FinnGen not significant), healthspan 0. No other trait is recorded for the variant (GWAS Catalog), and
  Open Targets 26.09 has no record of it or of its proxy, so causal and effector confidence are C4 and E4 and no gene
  is named; the locus keeps the seed's label, RP1, whose intron holds it (Ensembl's VEP). Mechanism unknown, filed as general
  ageing as row 26. Age of action unknown. Every test is European but the trans-ethnic line, where the insertion is
  too rare in East Asians (0.02) to carry signal.
