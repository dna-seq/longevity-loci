variants:
  - rsid: rs35262860
    gene: ""
    phenotype: RP1 region, survival to old age
    trait_efo_id: OBA_VT0005372
    effect_allele: GCT
    effect_size: 1.11
    effect_measure: OR
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the commoner version of this DNA position (about 38 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. The position, on chromosome 8,
          lies inside the RP1 gene, but nothing shows that this or any nearby gene matters for lifespan.
      - genotype: G/GCT
        state: neutral
        conclusion: >-
          You carry one copy of a version of this DNA position with two extra DNA letters, which about 47 in 100
          people of European ancestry carry. In one large study of very old people (Deelen 2019) it was a little more
          common among those who reached about 90, but not by enough to count as a firm finding, and larger studies
          of parents' lifespans and of deaths in Finland did not support it. It says nothing about your own lifespan.
      - genotype: GCT/GCT
        state: neutral
        conclusion: >-
          You carry two copies of a version of this DNA position with two extra DNA letters (about 14 in 100 people of
          European ancestry do). In one large study of very old people (Deelen 2019) it was a little more common
          among those who reached about 90, but not by enough to count as a firm finding, and larger studies of
          parents' lifespans and of deaths in Finland did not support it. It says nothing about your own lifespan.
