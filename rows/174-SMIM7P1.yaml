variants:
  - rsid: rs10198124
    locus: {chrom: "2", start: 35216373, ref: G, cites: [db-ensembl-116#q1245]}
    gene: ""
    phenotype: 2p22.3 region, African fathers' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: T
    effect_size: 0.82
    effect_measure: HR
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/T
        state: neutral
        conclusion: >-
          You carry one copy of each of the two common versions of this DNA position, the most common combination
          (about half of people of European ancestry, and of African ancestry, have it). It is the reference the other
          combinations are compared with. The position lies on chromosome 2 between genes, in a stretch linked to body
          weight.
      - genotype: T/T
        state: protective
        conclusion: >-
          You carry two copies of the T version of this DNA position (about 3 in 10 people of European ancestry, and
          nearer 4 in 10 of African ancestry). In a study of people of African ancestry, fathers of carriers of this
          version lived longer, and much larger studies of people of European ancestry lean the same way but with a far
          smaller effect. In Europeans the same version goes with slightly less body fat. It is an early finding and a
          tendency, not a guarantee.
      - genotype: G/G
        state: risk
        conclusion: >-
          You carry two copies of the G version of this DNA position (about 2 in 10 people of European ancestry, and
          about 15 in 100 of African ancestry). In a study of people of African ancestry, fathers of carriers of this
          version lived less long, and much larger studies of people of European ancestry lean the same way but with a
          far smaller effect. In Europeans the same version goes with slightly more body fat. It is an early finding and
          a tendency, not destiny.
