# A locus outside the seed list, from the scout's GWAS Catalog entry (the 2015–2026 backfill, D41), its own row under
# the next free id. Curated 2026-11-18. Lead rs10198124, Joshi 2017's African-ancestry fathers' signal: intergenic at
# 2p22.3, downstream of the SMIM7P1 pseudogene, GRCh38 2:35,216,373 G/T, GRCh37 2:35,441,439, G ancestral; G at 43.8 %
# in gnomAD's non-Finnish European genomes, 0.39 in Joshi's African cohorts. T is the allele the discovery puts with
# longer life (G with more deaths).
locus_id: 174
locus_name: SMIM7P1
verdict: kept
verdict_reason: >-
  Tier B by §4.1's single-study clause, as rows 128 and 149 (one genome-wide sample of African ancestry, unreplicated in
  a sample of its own): Joshi 2017's African-ancestry fathers (9,359 lives, nine cohorts) put G with death, HR 1.22 (SE
  0.0354), P 1.66e-8, the same direction in every cohort (pmid-29030599 q19); the both-parents analysis held no signal.
  No other African sample is read. In Joshi's Europeans the SNP is null at that size (fathers HR 1.01, SE 0.007, P 0.21;
  mothers P 0.77, q20); a cross-ancestry null is not a contradiction (D22.3), so it raises no flag. The larger European
  samples since lean G's way at a far smaller effect: Timmers 2019's parents T longer, P 0.0039 (one-sided 0.002, q435);
  Park 2025's own survival G more deaths, P 0.0035 (one-sided 0.0018, q247); Pilling 2017's both parents P 0.086 and top
  10 % P 0.058 (one-sided 0.043 and 0.029, q328, q329); Deelen 2019's 99th T toward it, P 0.058 (one-sided 0.029, q383);
  FinnGen R11's deaths flat (P 0.31, q138) (derived one-sided). They are European and about a twentieth of the African
  effect, at an adiposity locus (below), so the row reads them as cross-ancestry support for the direction, not as the
  replication of the African effect that §4.1's A asks. `sex_specific:m`: in Africans the fathers' log HR differs from
  the mothers' (0.97, SE 0.038) at z 4.42, P 1e-5 (derived from the printed errors, D29.16); in Europeans the parents
  do not differ (Pilling's mothers and fathers alike). `ancestry_specific:afr`: the genome-wide effect is African;
  Europeans carry at most a small one. Outcome cells read for T: lifespan + (Timmers, Park, Pilling's both parents);
  exceptional survival + (Deelen's 99th, Pilling's top 10 %); healthspan + (D31.4: Foote 2025's general factor has G
  frailer, P 0.0098, F4 metabolic P 2.7e-6, F5 P 0.047, none the other way, q239 to q245; Zenin 2019 flat, P 0.75, q198).
  Mechanism metabolism: in Open Targets' 26 sets, nearly all adiposity, T lowers waist circumference (P 1.1e-9), body
  mass index and leg fat mass (db-opentargets-26.09 q1586 to q1592), and Foote's metabolic factor is its strongest
  frailty line, so `mech:adiposity`, the longer-life allele the leaner; it leads none (PIP at most 0.013), so this is
  the locus's European biology, not shown for the African signal. Causal C4 (D39.12). Effector E4: intergenic, no QTL
  or colocalisation read for the row's phenotype. The literature search (the rsID, 2026-11-18; Semantic Scholar answered 429, its part
  unchecked) finds Joshi 2017 and a review of accelerated ageing and race (Noren Hooten 2021, PMID 34883202), named, not
  read.
  Descriptive. Age of action unknown.
