variants:
  - rsid: rs4268748
    gene: ""
    phenotype: DEF8/MC1R region, healthspan (cancer)
    trait_efo_id: EFO_0009762
    effect_allele: C
    effect_size: 0.0381
    effect_measure: beta
    stat_significance: significant
    direction: risk
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 53 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome 16,
          lies in DEF8 near MC1R, a gene known for skin and hair colour. A link between this position and healthy
          lifespan was reported once and did not hold up when the same team checked it.
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 40 in 100 people of European
          ancestry do). One large study (Zenin 2019) reported this version with an earlier first major disease,
          mostly cancer, but the same team's check in another large group did not find it, and studies of lifespan
          found no link. It says nothing about your own healthy lifespan. The same version is known for a higher
          risk of some sun-related skin conditions, which is separate from this finding.
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 8 in 100 people of European
          ancestry do). One large study (Zenin 2019) reported this version with an earlier first major disease,
          mostly cancer, but the same team's check in another large group did not find it, and studies of lifespan
          found no link. It says nothing about your own healthy lifespan. The same version is known for a higher
          risk of some sun-related skin conditions, which is separate from this finding.
