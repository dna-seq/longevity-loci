# The seed list's locus 86, DEF8 (16q24.3; the seed's genes "DEF8; DEF8 (MC1R region)"). Curated 2026-11-13. Lead
# rs4268748 (Zenin 2019's healthspan SNP, Table 2, nearest gene MC1R in its supplement), the seed's only rsID: an intron
# variant of DEF8, T/C at GRCh38 16:89,960,104 (GRCh37 90,026,512), C 0.275 in non-Finnish Europeans. In Zenin's,
# Timmers 2019's, Pilling 2017's, Deelen 2019's, Park 2025's and FinnGen R11's summary statistics at the lead itself.
# Wright 2019's tables hold no parent's-lifespan line within 200 kb, only viability SNPs, weak tags.
locus_id: 86
locus_name: DEF8
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's B: a genome-wide healthspan discovery that failed its own replication, powered, in its own
  ancestry, with nothing in a scoring class on its side (D25.1), row 26's shape. In 300,447 British UK Biobank
  participants C, the minor allele, brings the end of healthspan earlier (Zenin 2019, β +0.038 per C on the log hazard,
  P 1.55e-12 after genomic control), a signal that is cancer's alone (cancer P 1.9e-22, all diseases but cancer P
  0.73). The paper's replication in 96,313 other UK Biobank participants, unrelated to them, is flat: β +0.004, SE
  0.009, P 0.62, against the paper's own expected P of 7.4e-5 and its 99.5 % bound of 0.17 (replication power 0.86 at
  its 0.05/12); so the locus is not among Zenin's five replicated. The first replication cohort, the 81,099 other
  Europeans, is flat on its own (β +0.004, SE 0.0099, P 0.69). Healthspan against healthspan on one scale needs no
  conversion (D25.3 does not arise): at the discovery's β and the European cohort's SE one-sided power is 0.99 and the
  two estimates differ at heterogeneity P 0.0023 (the pooled replication: 0.994, P 0.0014; derived, both errors
  counted, D29.6), D21's red flag on either. A replication does not have to be in a scoring class to contradict: D22.2
  says what lifts a row, D25.1 what tests it (as at 26, where Deelen's own validation decided). And nothing in a scoring
  class gives P < 0.05 the discovery's way (one-sided for T, the healthier allele): Timmers 2019's million parental
  lives put T on the shorter-lived side (P 0.37, UK Biobank and LifeGen both; one-sided 0.82), Pilling 2017's UK
  Biobank parents too (P 0.50), Park 2025's own survival in UK Biobank leans T shorter-lived (P 0.084, its allele
  columns swapped, as the frequencies show), Deelen 2019's 90th and 99th percentiles put T a shade less common among
  the long-lived (P 0.88, 0.58), FinnGen R11's death endpoint is flat (P 0.78), and Zenin's own parents' death (P 0.51)
  and own death (C fewer deaths, P 0.66) are flat. So D16 has no co-occurring lifespan study either: even without the
  failed replication the locus would be C. Wright 2019's AncestryDNA has no parent's-lifespan line near it; its
  viability SNPs nearby (rs4785759 and rs9939542, CEU r² 0.39 and 0.52, genomic-control P 0.002 to 0.003) confirm,
  never replicate (D23), and tag the lead weakly: named, not scored. Timmers 2020's multivariate ageing scan reaches P
  7e-12 at the lead, and the lead tops its set (posterior 0.82), but it pools Zenin's healthspan with UK Biobank's
  parental lifespan and longevity, and a multivariate result replicates nothing (D22.2) and scores only beside a
  lifespan study (D18.3), which there is not; Rosoff 2023's mvAge lists no lead on chromosome 16, and Foote 2025's
  frailty factors hold no credible set at the lead. Outcome cells on a D row (D28.10): healthspan 0, the contradicted
  discovery giving no +; lifespan 0 and exceptional survival 0, every look flat. Mechanism ageing in general, as on
  every D row: no effect is left to route (D25.7). The variant is one of the MC1R region's pigmentation and skin
  signals (C raises squamous cell carcinoma, OR 1.33, P 2e-44, and actinic keratosis, OR 1.25, P 2e-61; T raises
  vitiligo, OR 1.41, P 3e-33), which is the seed's pleiotropy track (skin cancer and vitiligo, a trade-off); with no
  longer-life allele left there is no trade-off to file, so pleiotropy is empty and the skin traits are said here.
  Descriptive. Causal C2: the lead tops Zenin's four-variant SuSiE-inf healthspan set at posterior 0.379, the set the
  row stands on, as 49's D kept Liu's. Effector E3, no gene named (D24): locus-to-gene gives DEF8 0.896, and the set's
  six cis QTL colocalisations are DEF8 four, RPL13 one and SPG7 one, each rival a sixth, over D24's tenth; DEF8 and
  MC1R are named in prose. Every genotype neutral (D25.2); T/T, the commonest, the reference. The evidence is European.
  Age of action unknown. Row 103 (HLA-DQB1, C under D17.1) has this shape at lower power (about 0.8, heterogeneity P
  about 0.02) and predates D25.1; put to the lead.
