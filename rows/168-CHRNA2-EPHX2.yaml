# A second signal at the seed's locus 53, EPHX2 (8p21.1), its own row under D25.6 and D39.14. Curated 2026-11-16.
# Lead rs11780471, the second rsID named in row 53 (Wright 2019's fathers' meta): 3.6 kb upstream of EPHX2, at the
# CHRNA2 smoking and lung-cancer locus, GRCh38 8:27,487,202 G/A, GRCh37 8:27,344,719, G ancestral; A at 6.4 % in
# gnomAD's non-Finnish European genomes. 97 kb from row 53's lead rs7844965, r² 0.150 in 1000 Genomes EUR, the two
# longer-life alleles together. A is the longer-life allele.
locus_id: 168
locus_name: CHRNA2-EPHX2
second_signal_of: 53
verdict: kept
verdict_reason: >-
  Tier C at most (D39.15, D39.17, R-TIER-4), and only just: genome-wide at the marginal in Wright 2019's AncestryDNA–UK
  Biobank fathers' meta (P 3.2e-8; AncestryDNA P 1.8e-5, UK Biobank 1.6e-5, heterogeneity P 0.68), but conditioned on
  row 53's lead in the coupling the phase gives, the independent part is nominal, not suggestive. From 1000 Genomes'
  phased EUR haplotypes A travels with rs7844965's longer-life A (r +0.387, r² 0.150); with the lead's own line in the
  same meta (P 5.8e-10, both arms quoted) the meta's z 5.53 conditions to 3.39 (P 7e-4), AncestryDNA's arm to 2.79 (P
  0.005) and UK Biobank's to 2.51 (P 0.012); in Pilling 2017's both parents 3.84 to 1.78 (P 0.08); in Timmers 2019's
  pooled parents 4.73 to 2.87 (P 0.004) (all derived). No tag of 53's lead (D39.14): the lead's own lifespan sets in
  Open Targets, Pilling's (seven members) and Wright's fathers' (four), do not hold rs11780471, and none of
  rs11780471's 11 sets is a lifespan set; something survives conditioning in both of Wright's arms. FinnGen R11's
  deaths, outside both, put A with fewer deaths at P 0.011, but conditioned on 53's lead there (EUR r, Finnish LD
  unread) 1.82, P 0.07 (derived): a one-sided pass, but a database line lifts nothing (D29.1). FinnGen's two lines,
  2.56 here against the lead's 2.27, are a tie under D40.3, so the order does not reverse there. The reverse matters for row 53:
  53's lead given rs11780471 conditions to z 4.40 in Wright's meta and 4.57 in Pilling's both parents (derived), and
  row 53 is told so in its prose. Look-ups read for A: Pilling's fathers +0.0194 for G (P 1.6e-5, Wright's UK Biobank
  arm digit for digit), mothers P 0.0061, the top 10 % flat (0.45); Timmers A longer, P 2.3e-6, "++"; Deelen 2019 A's
  way, flat (90th 0.33, 99th 0.10); Park 2025's own survival flat (P 0.24). Outcome cells read for A: lifespan +
  (Wright, Pilling, Timmers, FinnGen); exceptional survival 0 (Deelen's 90th one-sided 0.17, its 99th 0.052; Pilling's top 10 % flat);
  healthspan 0 (D31.13: Zenin 2019 flat, P 0.79; Foote 2025's general factor favours A, one-sided 0.034, its F2
  opposes, one-sided 0.006, the rest flat).
  Mechanism smoking and lungs: A lowers smoking initiation (Saunders 2022, P 5e-110; Liu 2019, P 2e-13) and lung
  cancer (McKay 2017, P 2e-8, G the risk allele), so `mech:smoking` and `mech:cancer`, the longer-life allele the
  healthier on each, no `tradeoff`. Causal C4 (D39.12: none of Open Targets' 11 sets is of the row's phenotype, and no
  article sets it). Effector E4: upstream of EPHX2, with splicing sets for CHRNA2 (cerebellum) and EPHX2 in Open
  Targets, none of the row's phenotype. The literature search (the rsID, 2026-11-16; Semantic Scholar answered 429,
  its part unchecked) finds McKay 2017 (PMID 28604730), the lung-cancer GWAS behind the Catalog's line, and smoking
  Mendelian randomizations and lung-cancer reviews whose abstracts do not name the variant; named, nothing more read.
  Descriptive. Age of action unknown. The evidence is European.
