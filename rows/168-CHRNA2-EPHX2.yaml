    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: -0.0193807
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (about 88 in 100 people of European ancestry
          do). It is the reference the other combinations are compared with. The position lies on chromosome 8 near
          the EPHX2 gene, in a stretch known for its link with smoking. The finding comes from people of European
          ancestry; less is known elsewhere.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of the less common A version of this DNA position (about 12 in 100 people of European
          ancestry do). In very large British and American studies, fathers of people with this version lived a little
          longer. The same version goes with being less likely to take up smoking and a lower risk of lung cancer. It
          is an early finding: much of it is shared with a nearby signal, and what is left is weak. The effect is
          small and it is a tendency, not a guarantee.
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of the less common A version of this DNA position (fewer than 1 in 100 people of
          European ancestry do). In very large British and American studies, fathers of people with this version lived
          a little longer, per copy. The same version goes with being less likely to take up smoking and a lower risk
          of lung cancer. It is an early finding: much of it is shared with a nearby signal, and what is left is weak.
          The effect is small and it is a tendency, not a guarantee.
