# The seed list's locus 37, named HCP5 by the seed after its second rsID (6p21.33, the MHC class I region between
# PSORS1C3 and MICA/MICB). Curated 2026-11-11. Lead rs3130507 (Pilling 2017's mothers, PSORS1C3). The seed's other
# rsID, rs3131621 (Pilling's fathers, MICA … MICB, 278 kb away), is a separate signal and goes to the scout's queue
# (D25.6). Wright 2019's PSORS1C3 lead rs1265159 (r² 0.83) and rs3130467 (r² 0.95) are tags of this lead.
locus_id: 37
locus_name: HCP5
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it (D25.13: a replication's P is one-sided, in the discovery's direction). Genome-wide in
  Pilling 2017's mothers only (UK Biobank, P 2.1e-10; fathers P 0.24; both parents 3.5e-6): G, the common allele
  (0.72), goes with longer-lived mothers. Two samples independent of UK Biobank replicate it nominally at a smaller
  effect. LifeGen's mothers with UK Biobank's lives removed give G 0.29 years against 0.40 at discovery, one-sided P
  0.048 (Timmers 2019's Figure 2 source data, whose criterion is a one-sided P below 0.05; about 0.096 two-sided),
  and Timmers' abstract lists PSORS1C3 among the loci it validates. AncestryDNA's mothers (Wright 2019) give a
  quarter to a half of the effect: at rs3130467 (r² 0.95, D′ 1) β −0.0067 against UK Biobank's −0.0137, two-sided P
  0.073, about 0.037 one-sided (derived); at Wright's PSORS1C3 lead rs1265159 (r² 0.83) P 0.34, and Wright lists the
  locus as not replicated. With AncestryDNA's power about 0.97 (derived) and heterogeneity P 0.040 at rs3130467 as
  Wright prints it (METAL; 0.11 from the two arms' betas; at rs1265159 0.003 printed, 0.015 derived), this is
  requirements §4.1's replication with a much smaller effect, B, not a failing sample, so no replication_failed
  (D25.13). Read two-sided, neither sample would pass and D25.1 would make the row D; D25.13 settles the reading.
  FinnGen r11's any-death endpoint leans the same way (G toward less death,
  β −0.014, SE 0.010, P 0.16), not significant. At the oldest ages Deelen 2019 is flat at the 90th percentile (OR
  1.006, P 0.84) and leans the other way at the 99th (OR 0.950, P 0.27); against LifeGen's joint beta (G +0.018, P
  7.5e-5) the 90th percentile flags under the APOE factor only (power 0.89, heterogeneity P 0.031; the mean factor
  0.33, 0.34) and the 99th under neither on power (0.60, 0.20), so no flag (D25.3), and exceptional survival is 0.
  Healthspan agrees nominally in UK Biobank, Pilling's own sample (Zenin 2019: G later end of healthspan, P 0.033
  after genomic control). The effect is the mothers': Timmers 2019's moderator model finds it sex-specific (male
  moderator −0.038, P 7.3e-5, FDR 0.0017) and not age-dependent (P 0.24); mothers' effects are of one size from 60 to
  90 (0.048 at 60-70, 0.031 at 80-90), fathers' about zero below 90 and opposite past it (−0.17, P 0.031, 1,853
  deaths); sex_specific:f. Pleiotropy is autoimmune: at the tag rs1265159, idiopathic membranous nephropathy in a
  European sample (Stanescu 2011, risk T, OR 2.42, P 4e-37), its risk T travelling with the lead's shorter-lived A
  (derived from D′ 1, r² 0.83 and the frequencies), so the same side, no trade-off. Of the lead's 71 proxies at r² ≥
  0.8 in CEU, 14 have GWAS Catalog records: immune-protein levels, sarcoidosis, HIV set-point viral load, HDL
  cholesterol, waist-to-hip ratio, and psoriasis at six, all in samples that are not European or whose ancestry is
  not reported, so no psoriasis link is read. Nothing shows the lifespan effect runs through immunity, so the
  mechanism is general_ageing (D25.7, D25.13; immune_inflammation rejected, no route shown). No gene is named
  (requirements §4.2, §6.2): Open Targets 26.09 resolves neither of the seed's rsIDs (no variant under either allele
  order, nothing by search), so causal and effector confidence are unassessed (C4, E4; no flag, nothing to cite). The
  seed's other rsID, rs3131621 (MICA … MICB, the source of the seed's name), is a separate signal: Pilling's fathers'
  lead (P 3.6e-8; mothers 3.5e-5), its A longer-lived, 278 kb away; both SNPs are in the CEU panel and Ensembl's
  pairwise endpoint, which answers pairs megabases apart, returns no pair, which reads as r² below its 0.05 floor. It
  has the stronger case, replicated in AncestryDNA's fathers (P 7.7e-4; meta-analysis 8.9e-9, Table 3 "Replicated"),
  and the Catalog also lists rheumatoid arthritis or inflammatory bowel disease there (P 2e-13). Under D25.6 it goes
  to the scout's queue as a candidate row and is kept out of this row's axes and studies.
