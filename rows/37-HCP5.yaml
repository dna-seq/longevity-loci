variants:
  - rsid: rs3130507
    gene: ""
    phenotype: MHC class I region, mothers' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: G
    effect_size: -0.0155
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 52 in 100). It is the reference the other versions are compared with, so it neither raises
          nor lowers your expected lifespan here. The region, on chromosome 6, lies among immune-system genes (the
          HLA region), and it is not yet clear which gene matters. The finding
          comes from people of European ancestry, and from mothers; less is known elsewhere.
      - genotype: A/G
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 40 in 100 people of European
          ancestry do). In a large British study it went with mothers living a little less long, though not
          fathers, and with slightly worse odds of staying free of major disease. A separate European study saw the
          same in mothers, only weakly, and a large American study did not clearly see it. It is a likely finding,
          not a settled one, and the effect is small. The region holds immune-system genes, and the same stretch of
          DNA is linked to an immune kidney disease; which gene matters is not known.
      - genotype: A/A
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 8 in 100 people of European
          ancestry do). In a large British study each copy went with mothers living a little less long, though not
          fathers, and with slightly worse odds of staying free of major disease. A separate European study saw the
          same in mothers, only weakly, and a large American study did not clearly see it. It is a likely finding,
          not a settled one, and the effect is small. The region holds immune-system genes, and the same stretch of
          DNA is linked to an immune kidney disease; which gene matters is not known.
