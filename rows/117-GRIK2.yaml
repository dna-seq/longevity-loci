# The seed list's locus 117, GRIK2 (6q16.3). Curated 2026-11-16. Lead rs1416280, the seed's only rsID (Broer 2015's
# CHARGE longevity locus): intergenic between GRIK2 and the R3HDM2P2 pseudogene, GRCh38 6:102,438,768, GRCh37
# 6:102,886,643, multi-allelic (C/G/T), the row meaning C/G; C at 74.9 % in gnomAD's non-Finnish European genomes, C the
# discovery's longer-lived allele. C/G is palindromic, so the strand, and with it the allele call, rests on the
# frequency alone (C 0.75 in Broer's line as Deelen 2019 reprints it, against gnomAD's 0.749). Open Targets 26.09 has no record of it; the GWAS Catalog (2026-10-29) holds Broer's
# line alone.
locus_id: 117
locus_name: GRIK2
verdict: re-tiered
verdict_reason: >-
  Tier D, from no seed tier: a sub-genome-wide discovery that fails a powered test in its own ancestry outside its
  sample (D26.8, D21; row 136's shape). Broer 2015 meta-analysed 6,036 Europeans aged 90 or over against 3,757 who died
  between 55 and 80 in the CHARGE cohorts: a suggestive association near GRIK2, OR 1.24 (1.15–1.34) per C, P 5.09e-8,
  just short of the genome-wide line, and the paper names no new genome-wide locus. The full text is not cached
  (Europe PMC answered 500 and OUP's PDF 403; PMC's per-table page answered but `loci fetch-supp` renders no text from
  it, 2026-11-16), but two cached articles print Broer's line: Deelen 2019's Supplementary Data 1 (rs1416280, EA C, N
  6,036/3,757, OR 1.24, P 5.09e-8, EAF 0.745) and Zenin 2019's Supplementary Data 15 (EA C, 1.24, P 5.1e-8). The
  allele, C, the risk allele of longevity, and so the flag's direction, rest on an article's table (D12, D39.6), as
  the GWAS Catalog's record (C at 0.75, 1.15 to 1.34) also has it. Deelen 2019 holds the variant (C +0.031,
  SE 0.022, P 0.16 at the 90th percentile; +0.006, P 0.86 at the 99th), C's way and flat, but its meta-analyses hold most
  of Broer's CHARGE cohorts, so it is not an independent test (D19). Timmers 2019's parental lifespan, outside that
  sample, has C with shorter-lived parents, beta1 −0.0071 (SE 0.0045), P 0.12. Carried to Timmers' scale (D25.3) by
  Deelen's 90th percentile calibrations, the nearest to Broer's 90-and-over design, the discovery expects C +0.044 by
  APOE's factor (4.84) and +0.106 by the loci's mean factor: power 1.00 under both, heterogeneity P 2.5e-8 and 1e-8,
  and at half the effect, the discovery's SE kept, P 0.0015 and 0.0023 at power 0.999 and 1.00 (derived): a D21 red
  flag under both calibrations (D26.3), `replication_failed`. The APOE factor is borrowed and approximate (Broer's text
  gives APOE only at another SNP, so no same-SNP factor), but the flag does not depend on it: power stays at 0.8 or
  more and heterogeneity under 0.05 for any factor up to about 19, 3.9 times Deelen's 4.84 (derived; power binds there). No independent scoring-class study passes C's way (D25.1):
  FinnGen R11's deaths have C with fewer deaths, flat (G β +0.0092, P 0.23, a database line); Park 2025's own survival
  flat (P 0.92; men 0.86, women 0.94); Pilling 2017's parents, inside Timmers' pool, all against C and flat (P 0.28 to
  0.47). Zenin 2019's healthspan puts G with the later end of healthspan, P 0.058, one-sided 0.029 against C. Foote
  2025's deposits hold no line (untested). The literature search (the rsID with GRIK2, 2026-11-16) finds Broer alone.
  Every genotype neutral (D25.2). Exceptional survival 0 (Deelen flat and not independent; a D row's discovery gives no
  +, D28.10); lifespan 0 (Timmers one-sided 0.058 against, short of 0.05; Park and FinnGen flat); healthspan − (Zenin,
  one-sided 0.029 against, nothing for; D28.3). Mechanism ageing in general (D25.7): intergenic, near GRIK2, a
  glutamate receptor gene; nothing recorded at the variant. Causal C4 and effector E4: no Open Targets record.
  Descriptive. Age of action unknown. The evidence is European.
