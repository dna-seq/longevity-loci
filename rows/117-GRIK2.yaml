      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (about 56 in 100 people of European ancestry
          do). The position lies between genes on chromosome 6, near GRIK2. One large study of people who reached 90
          found this version slightly more often, but a larger study of parents' lifespans did not bear that out, so it
          is not counted for or against lifespan.
      - genotype: C/G
        state: neutral
        conclusion: >-
          You carry one copy of each version of this DNA position (about 38 in 100 people of European ancestry do). One
          study of people who reached 90 favoured the C version, but a larger study of parents' lifespans did not bear
          that out, so it is not counted for or against lifespan.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the less common version of this DNA position (about 6 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. One study of people who reached 90
          found it slightly less often, but a larger study of parents' lifespans did not bear that out, so it is not
          counted for or against lifespan.
