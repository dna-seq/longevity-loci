variants:
  - rsid: rs2613508
    gene: NEGR1
    phenotype: NEGR1 region, multivariate healthy ageing
    trait_efo_id: EFO_0007796
    effect_allele: C
    effect_size: 0.0077
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 67 in 100). It is the reference the other combinations are compared with. The region, on
          chromosome 1, lies near the NEGR1 gene, which is linked to body weight. The finding comes from people of
          European ancestry; less is known elsewhere.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 30 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, this version went with slightly healthier ageing, and parents of carriers lived a
          little longer. The region, near the NEGR1 gene, is linked to body weight: this version goes with a
          slightly lower BMI. It is a likely finding, not a settled one: it has not yet been confirmed in a
          separate group of people. The effect is small and it is a tendency, not a guarantee.
      - genotype: C/C
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 3 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, each copy went with slightly healthier ageing, and parents of carriers lived a
          little longer. The region, near the NEGR1 gene, is linked to body weight: this version goes with a
          slightly lower BMI. It is a likely finding, not a settled one: it has not yet been confirmed in a
          separate group of people. The effect is small and it is a tendency, not a guarantee.
