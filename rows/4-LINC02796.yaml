# The seed list's locus 4, LINC02796 (1p31.1, the NEGR1 obesity locus). Curated 2026-11-11, the ten-row run's sixth
# row. Lead rs2613508 (Rosoff 2023's mvAge, Table 1), the seed's only rsID here. Wright 2019's Supplemental Tables 8
# and 9 hold no clumped SNP within 0.5 Mb of it, and Deelen 2019's Supplementary Data 1 has no row for it. Open
# Targets 26.09: mvAge's credible set, led by rs2613508, and the BMI set its lead shares a haplotype with.
locus_id: 4
locus_name: LINC02796
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: a genome-wide multivariate result with a co-occurring lifespan study (§4.5 as D16 reads
  it), and no independent replication (§4.1's single-study clause). Genome-wide significant only in Rosoff 2023's
  mvAge, a multivariate factor behind healthspan, frailty, exceptional longevity, parental lifespan and epigenetic
  age (P 7.8e-9, the minor C on the healthier-ageing side); Rosoff lists it as novel, more than 1 Mb from every locus
  of the five input studies, so none of them reached genome-wide significance here alone. Timmers 2022's
  aging-GIP1, another multivariate scan over overlapping inputs, is genome-wide at rs2815748 (P 7e-10; r² 0.99 in
  1000 Genomes EUR, its G with the lead's C at the same frequency), its fine-mapped set holding both SNPs (PIP 0.10
  and 0.078): cited, not scored, and no lift past B (D18.3). Timmers 2019's million
  parents' lives are the co-occurring lifespan study: C lengthens life at P 5.3e-4, UK Biobank and LifeGen on the
  same side. Healthspan agrees at the same level: C delays the end of healthspan in Zenin 2019's UK Biobank (P
  3.3e-4). Both are inputs to mvAge, the same samples. Outside them the
  locus was tested once and did not pass: Timmers 2022's look-up in FinnGen and Biobank Japan's own survival gives G,
  with the lead's C, 0.205 years per copy, one-sided P 0.078 (Bonferroni 1.0). G is rare in East Asians (0.029 in
  1000 Genomes JPT; the table's Biobank Japan column prints 0.20, which does not match), so the test is mostly
  Finnish, Japan carrying about 30 % of its information (estimated from the FinnGen-only rows' size and SE, not
  printed), and its SE (0.145) is about twice that of the common leads: at the 0.21 years of the three strongest
  leads, one-sided power is about 0.4. Same side, underpowered, no red flag (D21). No independent replication
  passes, and both genome-wide results are multivariate: B. Its Q test (P 0.60) finds no sign that the SNP acts off the common factor. Exceptional survival is +: in
  Deelen 2019's summary statistics C raises the odds of reaching the 90th percentile (P 0.036; 99th P 0.052, same
  side), again an input of mvAge and not a replication. The mechanism is filed as metabolism,
  through body weight: the locus is NEGR1's long-known obesity signal, and Rosoff's GWAS Catalog list runs from BMI,
  childhood and extreme obesity and waist-to-hip ratio to triglycerides and type 2 diabetes, with smoking
  initiation, insomnia and neuroticism beside them. In Open Targets 26.09 rs2613508 sits on one haplotype with the
  BMI lead rs1993709 (r² 0.99), its T allele with the BMI-raising G (phase derived from frequencies), so the
  allele that ages worse is the one that raises BMI; that is association on one haplotype, not a mediator test. In
  mvAge's own credible set (PICS) rs2613508 leads 75 members, all at PIP 0.05 or less (causal:C3); the top
  locus-to-gene score is NEGR1 at 0.56, as on the BMI set (0.74), and NEGR1 is the only gene whose expression
  colocalises with the signal (six cis QTL sets, H4 ≥ 0.8): effector:E1, NEGR1 named (§6.2).
  Actionability is modifiable through weight (§4.2's label line, D18.2): the locus acts through body weight, with
  no LATE age of action shown and no trade-off detected, the two cases §4.2 leaves descriptive. The trade-off was
  looked for (D18.1) in the GWAS Catalog's nine records at rs2613508 and its BMI lead rs1993709: the longer-life
  side lowers BMI, waist-hip ratio and fibromyalgia and is not the early-onset obesity risk allele; four records
  (neuroticism among them) state no allele, so none detected is not none. Age of action is
  unknown: no cached source gives this locus's own age bands.
