  - rsid: rs16843603
    locus: {chrom: "4", start: 2926850, ref: T, cites: [db-ensembl-116#q1177]}
    gene: ADD1
    phenotype: ADD1 intron, ageing
    trait_efo_id: EFO_0007796
    effect_allele: C
    effect_size: 0.007050574
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA position (about 51 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. The position lies inside the
          ADD1 gene on chromosome 4, and what it does there is not known. The finding comes from people of European
          ancestry; less is known elsewhere.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of the C version of this DNA position (about 41 in 100 people of European ancestry do).
          In a very large European study that combined healthspan, long life and other measures of ageing, this
          version went with slightly healthier ageing, and parents of carriers lived a little longer. It is an early
          finding: part of it is shared with a nearby signal, and what is left has not reached the usual bar on its
          own. The effect is small and it is a tendency, not a guarantee.
      - genotype: C/C
        state: protective
        conclusion: >-
          You carry two copies of the C version of this DNA position (about 8 in 100 people of European ancestry do).
          In a very large European study that combined healthspan, long life and other measures of ageing, each copy
          went with slightly healthier ageing, and parents of carriers lived a little longer. It is an early finding:
          part of it is shared with a nearby signal, and what is left has not reached the usual bar on its own. The
          effect is small and it is a tendency, not a guarantee.
