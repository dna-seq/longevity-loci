# A second, independent signal at the seed's locus 25, HTT (4p16.3), its own row under D25.6 and D39.14. Curated
# 2026-11-16. Lead rs16843603, one of the seed's rsIDs at 25: in an ADD1 intron, GRCh38 4:2,926,850 T/C, GRCh37
# 4:2,928,577, C ancestral; C at 28.6 % in gnomAD's non-Finnish European genomes. r² 0.055 to rs16843836, mvAge's lead
# for row 25's HTT signal. C is mvAge's healthier allele and the longer-life allele.
locus_id: 163
locus_name: ADD1
second_signal_of: 25
verdict: kept
verdict_reason: >-
  Tier C (D39.15): genome-wide only at the marginal, which part of row 25's signal carries; conditioned on that
  signal in the coupling the phase gives, it is suggestive, not genome-wide (R-TIER-4). Rosoff 2023's mvAge puts T at
  −0.0071 (SE 0.0011), P 4.2e-10 marginal, so C raises the factor (the Catalog the same), a lead SNP of its locus 11
  beside rs16843836, the HTT signal's mvAge lead (r² 0.70 to row 25's lead), whose own fine-mapping holds it alone.
  Independence (D39.14, D39.15): no article prints a conditional analysis, and Open Targets places rs16843603 in no
  mvAge or lifespan-class set. From 1000 Genomes' phased EUR haplotypes, C travels with rs16843836's healthier A (r
  +0.23, r² 0.055), so the conditional z from Rosoff's z values is 4.70 given rs16843836 (P 2.6e-6, suggestive) and
  4.38 given it and rs114298671, row 164 (P 1.2e-5) (derived): it survives conditioning, so no tag of 25's lead, but
  its independent part is sub-genome-wide. Row 25's lead rs61348208 has no mvAge z printed, so rs16843836 stands in
  for it. Lifespan look-ups, all inside UK Biobank or mvAge's inputs, lean C's way: Timmers 2019 C longer, beta1
  +0.0222 (SE 0.0043), P 2.6e-7, "--" for T in both arms; Pilling 2017 both parents P 0.0041, mothers 0.0054, fathers
  5.2e-4, the top 10 % 9.6e-6; Park 2025's own survival C fewer deaths, P 0.00043 (men 0.00021, women 0.29); Deelen
  2019, an mvAge input, 90th one-sided 0.033, 99th 0.038. Outside them FinnGen R11's deaths lean C's way, one-sided
  0.15, a database line; no independent sample passes. Outcome cells read for C, on the marginal look-ups (25's share
  not taken out of them): lifespan + (Timmers, Pilling, Park); exceptional survival + (Pilling's top 10 % both-parents
  line, P 9.6e-6, D31.8; Deelen one-sided 0.033); healthspan + (Zenin 2019 C the later end, P 0.034; Foote 2025's
  factors 2, 3 and 5 C less frail, P 4.2e-4, 2.2e-4, 0.0023, none against; the general factor and F4 hold no line).
  Mechanism general ageing, as the mvAge rows. Pleiotropy `mech:lung` and `broad`: C raises FEV1 and lowers COPD, and
  goes with longer education (Open Targets, β per C), smoking, lipid, calcium and liver-enzyme sets named; each read
  on the healthy side, so no `tradeoff`. Causal C4 and effector E4: no mvAge or lifespan-class set in Open Targets
  holds it, and Rosoff's own fine-mapping of locus 11 picks rs16843836; ADD1 is the host gene, not an effector call.
  The literature search (the rsID, 2026-11-16; Semantic Scholar answered 429, its part unchecked) finds a 2008 thesis on salt-sensitive hypertension in Black sibships, no PMID, and no test of ageing or lifespan; Rosoff names the SNP only in its supplement. Descriptive. Age of action unknown. The evidence is
  European.
