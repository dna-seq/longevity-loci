# The seed list's locus 82, CASC16 (16q12.1; the seed's genes TOX3 and CASC16). Curated 2026-11-13. Lead rs4783780,
# the seed's lead (Timmers 2020's multivariate TOX3 SNP): an intron variant of TOX3, A/C, A at 0.51 in Europeans and
# the longer-lived side. The seed's second rsID, rs4784227 (Zenin 2019's healthspan SNP, the breast-cancer variant
# near CASC16), lies 28 kb away at r² 0.33 (CEU): another signal, named in the reason and not a variant here.
locus_id: 82
locus_name: CASC16
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it, row 27's shape: a genome-wide multivariate result with a co-occurring lifespan study
  (§4.5 as D16 reads it); a multivariate result does not meet tier A's first criterion (D18.3). Timmers 2020's
  MANOVA of healthspan, parental lifespan and Deelen's 90th percentile is genome-wide at rs4783780 (P 1e-8), A
  favourable in all three columns (healthspan P 2e-6, lifespan 3e-4, longevity 6e-3), no column genome-wide alone.
  Timmers 2019's million parents' lives are the co-occurring lifespan study: A longer-lived, P 3.0e-4, UK Biobank and
  LifeGen on the same side. Nothing univariate is genome-wide at the lead, so A is out of reach whatever replicates.
  Outside the multivariate's inputs, FinnGen R11's death endpoint agrees (A with fewer deaths, P 0.0058), a database
  line that lifts nothing (D29.1); Park 2025's own survival is flat on A's side (P 0.37; its allele columns swapped,
  read from UK Biobank's own frequency of A and from rs4784227's unambiguous line in the same file); Wright 2019's
  tables hold no SNP near the lead. No red flag: nothing outside the inputs fails with power, and FinnGen's scale is
  printed nowhere (D28.1). Healthspan +: Zenin 2019, A delaying the end of healthspan, P 3.0e-6 after its genomic
  control (an input). Exceptional survival +: Deelen's 90th favours A (P 0.0059), its 99th leans the same way (P
  0.20); the 90th is the multivariate's own input, so it sets the cell and replicates nothing (row 27). Lifespan +.
  The seed's second rsID, rs4784227 28 kb away, is the TOX3/CASC16 breast-cancer variant (r² 0.33 and D′ 0.95 in CEU,
  its T riding with the lead's C): Zenin's healthspan is genome-wide there (T earlier, P 3.0e-8 after genomic control,
  cancer its only component, P 2.2e-10; parents' death P 0.10), with T shorter-lived in Timmers 2019 (P 0.029), Deelen's
  90th (P 0.030) and FinnGen (P 0.042). Read as a shadow of the lead (r about 0.58), those lifespan Zs are what the
  lead's signal alone would put there or a little more (Timmers 2.18 against 2.09 expected, Deelen 2.17 against 1.59,
  Pilling 2.76 against 1.81; derived), while the lead's own (3.62, 2.75) are far above rs4784227's shadow (1.26, 1.25):
  the lifespan evidence belongs to the lead, and rs4784227's cannot be told apart from it. The two are separate
  signals: Timmers 2020's set colocalises with none of rs4784227's breast-cancer sets. So rs4784227 is named here and
  not tiered; whether it should lead the row instead (A on Zenin's healthspan with Deelen's 90th) is put to the lead.
  Mechanism metabolism, through body weight: Timmers 2020's set at the lead colocalises (H4 0.83 to 0.97) mostly with
  body-mass and fat-mass sets, also brain morphology, systolic pressure, type 2 diabetes (0.90) and gallstones; the
  lead's own BMI set and the GWAS Catalog's BMI record put A on the lower side (P 6.5e-9, 3e-9). So the longer-lived A
  goes with lower weight; no harm is tied to A (D18.1: the breast-cancer risk allele rides with C), and the label is
  modifiable through weight (D18.2), association on one signal, not a mediator test. Pleiotropy mech:adiposity and
  broad. Causal C3: the lead tops Timmers 2020's PICS set at posterior 0.043 of 40 members. Effector E3, no gene named
  (D24): locus-to-gene gives TOX3 0.886, but the set's only cis-QTL colocalisations are an RBL2 transcript in
  monocytes (H4 0.97) and LINC03064 in testis (0.88), none of TOX3, so a rival holds half of them; TOX3, in whose
  introns the lead sits, is named in prose. No sexual dimorphism at the lead (Timmers 2020). A is at 51 % in
  Europeans, so A/C, the commonest genotype, is the reference (§6.2): A/A protective, C/C risk, no PROTECT token, as
  row 24. Age of action unknown. The evidence is European.
