variants:
  - rsid: rs4783780
    gene: ""
    phenotype: TOX3 region, body weight, healthy ageing
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: 0.014
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of one of two common versions of this DNA position (about 27 in 100 people of
          European ancestry do). In very large European studies that combined healthspan, parents' lifespan and
          reaching old age, each copy went with slightly healthier ageing and parents who lived a little longer,
          and a separate Finnish study saw slightly fewer deaths. The same version goes with slightly lower body
          weight, so keeping a healthy weight is the part within reach. It is a likely finding, not a settled one:
          it rests on one combined analysis. The effect is small and it is a tendency, not destiny.
      - genotype: A/C
        state: neutral
        conclusion: >-
          You carry one copy of each common version of this DNA position (about 50 in 100 people of European
          ancestry do, the most common combination). It is the reference the other combinations are compared with.
          The position, on chromosome 16, lies inside the TOX3 gene. The finding comes from people of European
          ancestry; less is known elsewhere.
      - genotype: C/C
        state: risk
        conclusion: >-
          You carry two copies of one of two common versions of this DNA position (about 23 in 100 people of
          European ancestry do). In very large European studies that combined healthspan, parents' lifespan and
          reaching old age, each copy went with slightly less healthy ageing and parents who lived a little less
          long. The same version goes with slightly higher body weight, so keeping a healthy weight is the part
          within reach. It is a likely finding, not a settled one: it rests on one combined analysis. The effect is
          small and it is a tendency, not destiny.
