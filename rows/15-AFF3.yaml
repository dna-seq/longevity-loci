variants:
  - rsid: rs78438918
    gene: ""
    phenotype: AFF3 region, multivariate healthy ageing
    trait_efo_id: EFO_0007796
    effect_allele: G
    effect_size: 0.0078
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 70 in 100). It is the reference the other combinations are compared with. The region, on
          chromosome 2, lies inside the AFF3 gene. The finding comes from people of European ancestry; less is
          known elsewhere.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 28 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, this version went with slightly healthier ageing, and parents of carriers lived a
          little longer. The same version goes with a slightly stronger grip. It is a likely finding, not a
          settled one: it rests on one combined analysis, with only weak support from a separate group of people.
          The effect is small and it is a tendency, not a guarantee.
      - genotype: G/G
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 3 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, each copy went with slightly healthier ageing, and parents of carriers lived a
          little longer. The same version goes with a slightly stronger grip. It is a likely finding, not a
          settled one: it rests on one combined analysis, with only weak support from a separate group of people.
          The effect is small and it is a tendency, not a guarantee.
