# The seed list's locus 15, AFF3 (2q11.2). Curated 2026-11-11, the second run's fifth row. Lead rs78438918 (Rosoff
# 2023's mvAge, Table 1), the seed's only rsID here: an intron variant of AFF3. Wright 2019's Supplemental Table 9
# holds two fathers' SNPs on the lead's haplotype (rs13032879, r² 0.76; rs4851244, r² 0.73); its mothers' SNPs within
# 0.5 Mb (rs7567996, and S8's rs2309814) have no LD to the lead that Ensembl returns: unknown, not read. Open Targets
# 26.09: 19 credible sets hold the lead, mvAge's among them; the GWAS Catalog (2026-10-29) holds Rosoff's alone.
locus_id: 15
locus_name: AFF3
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: a genome-wide multivariate result with a co-occurring lifespan study (§4.5 as D16
  reads it); a multivariate result does not meet tier A's first criterion (D18.3), whatever its replication.
  Genome-wide significant only in Rosoff 2023's mvAge, the common factor behind healthspan, frailty, exceptional
  longevity, parental lifespan and epigenetic age (P 1.1e-8, A lowering the factor, so G, the minor allele at 17 %
  in Europeans, is on the healthier-ageing side); Rosoff lists it as novel, more than 1 Mb from every locus of the
  five input studies. Timmers 2019's million parents' lives are the co-occurring lifespan study: G lengthens life
  at P 2.0e-4, nominal, UK Biobank and LifeGen on the same side. Healthspan agrees nominally: G delays the end of
  healthspan in Zenin 2019's UK Biobank (P 0.0027). Exceptional survival is 0: Deelen 2019's summary statistics lean
  to G at the 90th (P 0.67) and 99th percentiles (P 0.25) and pass at neither. All three are inputs to mvAge, the
  same samples. Outside them, Wright 2019's AncestryDNA fathers support the signal at rs13032879, 27 kb away, on the
  lead's haplotype (r² 0.76) and inside mvAge's own credible set: its minor T, which travels with G, lengthens
  fathers' lives at raw P 0.0068; the genomic-control P, Wright's own call, is not printed (the SNP is not in the
  per-cohort table, so it is above 0.003 there). The allele the beta counts is derived from the UK Biobank arm's
  sign, not printed. rs4851244 (r² 0.73) agrees at raw P 0.039; one signal, scored once (D17.1). The mothers' results at
  the tags are not printed; the mothers' SNPs nearest the lead (rs2309814, 0.26 Mb, genomic-control P 3.7e-4 in those
  born 1886-1918; rs7567996, 0.4 Mb) have no LD to it that Ensembl returns (EUR, CEU, floor off): unknown, not read. Timmers 2022's aging-GIP1 AFF3 lead rs7609078
  (P 3e-10) is another signal (r² 0.07 EUR, 0.12 EAS to the lead; its set of 14 does not hold it), and its
  own-survival look-up runs against aging-GIP1 (one-sided P 0.86): neither is read into this row. The Q test (P 0.81) finds no sign that the SNP acts off the common factor. Mechanism:
  ageing in general. The lead's 19 credible sets hold no disease: mvAge, two hand-grip-strength sets the lead leads (G
  with a stronger grip, P 3e-9 and 5e-9) and a third led by a neighbour, a waist-hip ratio set led by a neighbour whose phase is not read, a fatty-acid ratio,
  and thirteen expression or splicing sets, ten of them AFF3's (G raises AFF3 in the cerebellum, P 3e-17). Rosoff
  reads it as a cognition locus, through the GWAS Catalog's records at the lead or its LD partners; the catalog
  holds none at the lead itself. Association on one haplotype, not a mediator test. Actionability is descriptive.
  The trade-off was looked for (D18.1) in the catalog's one record and the 19 sets: no harm on the G side;
  sets led by neighbours that do not hold the lead are not read, so none detected is not none. Causal confidence C2: rs78438918 leads mvAge's credible set (PICS) at PIP 0.26 among 44
  members, the next at 0.061, the grip set the same (0.28). Effector E3, no gene named (D24): AFF3 passes
  locus-to-gene (0.90 on the mvAge set) and holds 18 of the set's 24 cis-QTL colocalisations at H4 ≥ 0.8, but an
  unnamed neighbouring gene (ENSG00000230393) holds the other 6, more than a tenth, so the call is ambiguous. The protection is the presence of the minor G.
  Age of action is unknown: no cached source gives this locus's own age bands.
