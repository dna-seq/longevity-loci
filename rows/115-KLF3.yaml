# The seed list's locus 115, KLF3 (4p14): a marker of biological ageing (D32, D36.3, D37.3), curated on D37.12 with 23
# TERC as the pattern. Curated 2026-11-16. Lead rs13132853, the seed's rsID (Jawinski 2025's 4p14 brain-age-gap locus):
# intronic in KLF3's MANE transcript, GRCh38 4:38,678,394, GRCh37 4:38,680,015, multi-allelic A/G/T, the row meaning A/G;
# A at 66.5 % in gnomAD's non-Finnish European genomes. A is the allele with the younger-looking brain.
locus_id: 115
locus_name: KLF3
verdict: kept
verdict_reason: >-
  Tier B on the marker's own evidence (D37.12; the seed gives none): the tier grades the association with the brain
  age gap, MRI-predicted brain age minus calendar age, not longevity, and this row is unscored (D32, D37.3). Jawinski
  2025 discovers the locus in 32,634 White British UK Biobank participants (G +0.272 years, SE 0.027, P 2.6e-24, grey
  and white matter) and replicates it in 22,256 Europeans outside the discovery (G +0.242, SE 0.033, P 4.0e-13; the table's "Het p" of 0.27, df 1, sits in the replication's columns beside a two-sign "++", and its legend does not say what it compares, likely the replication's two cohorts; discovery against replication recomputes to P 0.47, derived): the same allele and side, the replication a little smaller and inside the discovery's
  interval, so no D21 flag. Its European meta-analysis prints A at 0.634, −0.260 years (SE 0.021), P 9.3e-36, N
  54,890. Two other brain-age GWASs in the GWAS Catalog put G on the older side (Zhao, G +0.189, P 1e-14; Leonardsen,
  G +0.23, P 2e-18), named, not counted: both are UK Biobank studies by their abstracts, so not independent of
  Jawinski's discovery, their papers unread. Genome-wide and
  replicated, but no study reaches §4.1's 100k: B. Lifespan look-ups, unscored and read for A, two-sided at 0.05
  (D38.6): Timmers 2019 A beta1 +0.0010 (SE 0.0041), P 0.80; Pilling 2017's both parents P 0.31, mothers 0.62, fathers
  0.6, and its top 10 % A with more long-lived parents, +0.0042 (SE 0.0021), P 0.043; Park 2025's own survival P 0.65
  (men 0.48, women 0.85); FinnGen R11's deaths G +0.0152 (SE 0.0076), P 0.046, so A with fewer, a database line;
  Deelen 2019 90th P 0.32, 99th P 0.32; Zenin 2019's healthspan P 0.14. Foote 2025's factors point both ways: the
  general factor has A frailer (+0.0044, P 1.7e-5) and factor 5 A with poorer cognition (P 0.039), while factor 2
  (unhealthy lifestyle, P 0.046) and factor 3 (multimorbidity, P 0.012) have A the less; factors 1 and 6 flat, factor
  4 no line. The literature search (the rsID, 2026-11-16; OpenAlex and Semantic Scholar answered 429, their part
  unchecked) finds the three brain-age GWASs (Jawinski, Zhao 2025, Leonardsen 2023), no test of lifespan. Every
  genotype neutral, each conclusion a tendency of the marker with no colour (D32, D37.12); `direction: unknown`.
  Outcome cells read for A: exceptional survival + (Pilling's top 10 % both-parents line, A with more long-lived parents, two-sided 0.043, filed as 68 and 90 file it, D31.8, D39.13; Deelen flat); lifespan + (FinnGen two-sided 0.046 alone, A with fewer deaths, a database line that fills a cell; Timmers, Park and Pilling's parents flat); healthspan 0 (Zenin flat, Foote's factors
  both ways at nominal P, each named). Mechanism: markers of biological ageing. Pleiotropy `mech:adiposity`: A raises
  body mass index (P 4e-13) and body fat percentage (P 1e-8), and it lowers grip strength (P 9e-9), named; no
  `tradeoff`, the row naming no longevity-favoured allele. Causal C2 (D39.12: Open Targets' white-matter set, PIP 0.36; Jawinski's SBayesRC set holds it alone at PIP 1.00, one fine-mapping method of three, named). Effector E3, KLF3: locus-to-gene 0.47, the only gene, the variant
  intronic in KLF3; Jawinski prioritises KLF3-AS1. Colocalisations were not read. Descriptive. Age of action unknown. The evidence is European.
