        conclusion: >-
          You carry two copies of the A version of this DNA position (about 44 in 100 people of European ancestry do).
          Large studies link each copy of A with a brain that looks about a quarter of a year younger on MRI scans than
          expected for its age. That is a tendency in a marker whose reading only means something against your calendar
          age, which this report does not have, so it carries no score.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy each of the two versions of this DNA position, the most common combination (about 45 in
          100 people of European ancestry). It is the reference the other combinations are compared with. The position
          lies inside KLF3, a gene that controls other genes. Brain age, estimated from MRI scans, is a marker whose
          reading only means something against your calendar age, which this report does not have, so this result
          carries no score.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the G version of this DNA position (about 11 in 100 people of European ancestry do).
          Large studies link each copy of G with a brain that looks about a quarter of a year older on MRI scans than
          expected for its age. That is a tendency in a marker whose reading only means something against your calendar
          age, which this report does not have, so it carries no score.
