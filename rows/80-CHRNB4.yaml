# The seed list's locus 80, named CHRNB4 by the seed; the papers call it CHRNA3/5 (15q25.1, the nicotinic receptor
# cluster CHRNA5-CHRNA3-CHRNB4 with HYKK and PSMA4). Curated 2026-11-10, the pilot's second row. Lead rs8042849
# (Timmers 2019, Joshi 2017); rs931794 (Wright 2019), rs1317286 (Pilling 2017) and rs9788721 (Joshi's CHARGE proxy)
# sit in its credible set and appear only as proxies on the studies that reported them.
locus_id: 80
locus_name: CHRNB4
verdict: kept
verdict_reason: >-
  Tier A confirmed. Genome-wide significant for parental lifespan in about one million lives (Timmers 2019, P 1.6e-26)
  and in each parental-lifespan GWAS since Joshi 2017; replicated at genome-wide significance outside UK Biobank and
  LifeGen in AncestryDNA's fathers (Wright 2019, P 3.2e-9, the same side). It acts through smoking: every
  association the lead has is with smoking behaviour, lung cancer and COPD. The effect is mainly on deaths before
  75 (HR 1.08 per allele at 40-75 against 1.03 after, Joshi 2017; declining after 60, Timmers 2019), and survival
  to very old age does not replicate: CHARGE-EU 90+ P 0.95 (Joshi 2017), and Deelen 2019's 90th and 99th
  percentiles P 0.40 and 0.58 (its supplement, read, not quoted; CHRNA3/5 is absent from its list of nominal
  parental-lifespan loci). Only both parents reaching the top 10% of survival is significant, in UK Biobank (Pilling
  2017, P 4.0e-9), so exceptional survival is 0. No smoking-stratified estimate was read, so how much of the
  effect remains in people who never smoked is not known here. No gene is named (requirements §4.2, §6.2: a gene
  only at E1/E2): locus-to-gene is below 0.5 for every gene (CHRNA5 0.29, PSMA4 0.13, CHRNA3 0.08).
  Pilling 2017's second signal in the region (rs578776) is not scored. Healthspan: no estimate read (Zenin 2019's GWAS has no credible set here, and its look-up of
  lifespan variants does not hold this lead), so untested, not null. The seed's other rsIDs: rs931794, rs9788721,
  rs10519203 (r² 0.95), rs1317286 and rs16969968 (CHRNA5 D398N, r² 0.87) are in the lead's credible set, the same
  signal; rs578776 is Pilling's second signal; rs11852372, rs2036527, rs4887072 and rs11633223 were not placed.
