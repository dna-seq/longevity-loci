# The seed list's locus 80, named CHRNB4 by the seed; the papers call it CHRNA3/5 (15q25.1, the nicotinic receptor
# cluster CHRNA5-CHRNA3-CHRNB4 with HYKK and PSMA4). Curated 2026-11-10, the pilot's second row. Lead rs8042849
# (Timmers 2019, Joshi 2017); rs931794 (Wright 2019), rs1317286 (Pilling 2017) and rs9788721 (Joshi's CHARGE proxy)
# sit in its credible set and appear only as proxies on the studies that reported them.
locus_id: 80
locus_name: CHRNB4
verdict: re-tiered
verdict_reason: >-
  Tier B, from the seed's A, on the 71/67 rule's cap (D21, D25.3), swept 2026-11-12. Genome-wide significant for
  parental lifespan in about one million lives (Timmers 2019, P 1.6e-26) and in each parental-lifespan GWAS since
  Joshi 2017; replicated outside UK Biobank and LifeGen in AncestryDNA's fathers (Wright 2019, P 5.2e-8 after the
  paper's genomic control, D26.1, significant at its Bonferroni line by Table 1's mark; 3.2e-9 uncorrected; the same
  side), so not D (D25.1). But Deelen 2019's survival to
  the 90th percentile, a sample with no UK Biobank and no AncestryDNA, is flat where it was powered: T β +0.0178
  (SE 0.0212), one-sided P 0.20. From Timmers' β (0.0437 per T) the expected log odds is 0.211 under APOE's factor
  (power 1.00, heterogeneity P 3e-11) and 0.088 under the loci's mean factor (power 0.99, heterogeneity P 0.002, 0.02 counting
  the mean's own SE): a red flag under both calibrations, so `replication_failed`, row 6's shape. It holds for Wright's AncestryDNA effect
  (0.041 per allele: mean factor power 0.99, heterogeneity P 0.01, 0.04 with the mean's SE) and for any discovery
  effect above about 0.037 (with the mean's SE),
  so taking LifeGen's Rotterdam overlap out of Timmers' β does not lift it; Joshi's HR 1.046 (log 0.045) sits at
  Timmers' size. The 99th percentile leans the other way (T β −0.0191, SE 0.0343) and flags too (mean factor power
  0.82, heterogeneity P 0.002), its APOE factor borrowed from the 90th's ε4 line, so it is stated and the token rests
  on the 90th. Timmers 2019's own look-up in the earlier longevity sample is flat as well (Alpha 0.05, SE 0.27,
  against the mean 0.42), a sample overlapping Deelen's, named only. The case for A, which the lead rejected (D28.9):
  the effect fades with age (below), and Figure 5's 80-90 band (fathers 0.0398, mothers 0.0212, pooled 0.030; the twelve bands
  average 0.053, so the figure is on Timmers' in-self scale) under the mean factor expects 0.060, power 0.88 and
  heterogeneity P 0.12 (0.17 with the mean's SE), no flag (APOE's still flags, P 0.006). That band is the hazard at
  80 to 90, while Deelen's cases are defined by cumulative survival to the percentile, so it is the reading most
  favourable to A. The flag's reason, as the lead read it (D28.9): Deelen's 90th percentile tests cumulative survival
  against early deaths, a phenotype that carries smoking liability (Deelen's genetic correlation with cigarettes per
  day −0.49, SE 0.13, pmid-31413261#q155); the loci's mean factor, 0.4175, is the mean over 18 loci that already pools midlife loci, CHRNA3/5
  among them, and leaving CHRNA3/5 out makes the flag stronger; the 18 loci show no spread in the factor (Q 9.0 on
  17 degrees of freedom). So the flag is no calibration artefact, and §4.1's "no red-flag heterogeneity" bars A
  whether the effect fades with age or not. D25.3 says the mean understates a late locus and APOE overstates a
  midlife one, and both are applied as written. It acts through smoking: every association
  the lead has is with smoking behaviour, lung cancer and COPD. The effect is mainly on deaths before 75 (HR 1.08 per
  allele at 40-75 against 1.03 after, Joshi 2017; declining after 60, Timmers 2019), and survival to very old age does
  not replicate: CHARGE-EU 90+ P 0.95 (Joshi 2017; no effect printed, so its calibration is unknown), and Deelen
  2019's 90th and 99th percentiles P 0.40 and 0.58 (above). Only both parents
  reaching the top 10% of survival is significant, in UK Biobank (Pilling 2017, P 4.0e-9), so exceptional survival is
  0. No smoking-stratified estimate was read, so how much of the effect remains in people who never smoked is not
  known here. No gene is named (requirements §4.2, §6.2: a gene only at E1/E2): on Timmers 2019's set locus-to-gene is
  below 0.5 for every gene (CHRNA5 0.29, PSMA4 0.13, CHRNA3 0.08), though CHRNA5 passes on Pilling 2017's
  combined-parents set (0.75), and all five lifespan-class sets colocalise with cis QTLs of PSMA4 (14 to 16 at H4 ≥
  0.8) and CHRNA5 (14) alike, ambiguous under D24. Pilling 2017's second signal in the region (rs578776) is not
  scored. Healthspan: no estimate read (Zenin 2019's GWAS has no credible set here, and its look-up of lifespan
  variants does not hold this lead), so untested, not null. The seed's other rsIDs: rs931794, rs9788721, rs10519203
  (r² 0.95), rs1317286 and rs16969968 (CHRNA5 D398N, r² 0.87) are in the lead's credible set, the same signal;
  rs578776 is Pilling's second signal; rs11852372, rs2036527, rs4887072 and rs11633223 were not placed. Timmers 2019's
  Figure 5 source data show the fade directly: age moderates the effect at P 2.1e-4, FDR Q 0.0048, passing 5 % FDR,
  fathers 0.084 at 50-60 falling to 0.040 at 80-90 and mothers 0.054 at 60-70 to 0.021 at 80-90; the sex moderator is
  nominal (P 0.013) and fails FDR (Q 0.27), so no sex_specific.
