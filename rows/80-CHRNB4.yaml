variants:
  - rsid: rs8042849
    gene: ""
    phenotype: Smoking quantity, lung cancer and COPD
    trait_efo_id: EFO_0007796
    effect_allele: T
    effect_size: 0.4368
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the most common version of this DNA region (about 41 in 100 people of European
          ancestry do). It is the reference the other versions are compared with, so it neither raises nor lowers
          your expected lifespan here. The region holds genes for the brain's nicotine receptors and is linked to
          nicotine dependence. Whether you smoke matters far more for your health than this DNA result. The finding comes from people of European ancestry; less is known elsewhere.
      - genotype: C/T
        state: risk
        conclusion: >-
          You carry one copy of a version of this DNA region that about 46 in 100 people of European ancestry
          carry. The region holds the brain's nicotine receptor genes and is linked to nicotine dependence, lung
          cancer and lung disease, and in very large studies this version's carriers had parents who lived on
          average about two and a half months less, mostly through deaths before 75. The finding is well established for that
          span, but a study of people who reached the oldest ages did not see it. It is a tendency, not destiny. Whether you smoke matters far more than this DNA result; not smoking, or
          stopping, is what counts.
      - genotype: C/C
        state: risk
        conclusion: >-
          You carry two copies of a version of this DNA region that about 13 in 100 people of European ancestry
          have. The region holds the brain's nicotine receptor genes and is linked to nicotine dependence, lung
          cancer and lung disease, and in very large studies each copy of this version went with parents living
          on average about two and a half months less, mostly through deaths before 75. The finding is well established for
          that span, but a study of people who reached the oldest ages did not see it. It is a tendency, not destiny. Whether you smoke matters far more than this DNA result; not smoking, or
          stopping, is what counts.
