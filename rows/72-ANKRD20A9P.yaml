    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, on chromosome 13 near the inactive gene copy
          ANKRD20A9P (about 82 in 100 people of East Asian ancestry and 64 in 100 of European ancestry have this). It
          is the reference the other combinations are compared with. A Chinese study of people who reached 100
          reported this version as more common among them, but a large European study found no sign of it, and the
          same research group later could not use this DNA position. It says nothing about your own lifespan.
      - genotype: C/G
        state: neutral
        conclusion: >-
          You carry one copy of a version of this DNA region, near the inactive gene copy ANKRD20A9P, that about 17
          in 100 people of East Asian ancestry and 32 in 100 of European ancestry carry. A Chinese study reported it
          as less common among people who reached 100, but a large European study found no sign of it, and the same
          research group later could not use this DNA position. It says nothing about your own lifespan.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of a version of this DNA region, near the inactive gene copy ANKRD20A9P (about 1 in
          100 people of East Asian ancestry and 4 in 100 of European ancestry do). A Chinese study reported it as less
          common among people who reached 100, but a large European study found no sign of it, and the same research
          group later could not use this DNA position. It says nothing about your own lifespan.
