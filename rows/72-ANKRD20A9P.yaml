# The seed list's locus 72, ANKRD20A9P (13q11). Curated 2026-11-12. Lead rs2440012 (the seed's only rsID; GRCh38
# 13:18,865,983, GRCh37 13:19,440,123, C/A/G, intronic in the pseudogene ANKRD20A9P), Zeng 2016's second Han Chinese
# centenarian locus (Table 1), the paper of row 48. G is about 0.10 in East Asians and 0.20 in Europeans. Timmers
# 2019 reads it through rs113946246 (r² 0.945 in Europeans, 0.989 in East Asians).
locus_id: 72
locus_name: ANKRD20A9P
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's B: a cross-ancestry null that is flat in Europeans with no proxy leaning the discovery's way
  (D22.3, as §4.1's own IL6 example and row 49), carrying D21's red flag under both of D25.3's calibrations. Zeng 2016
  compared 2,178 Han Chinese centenarians (mean age 102.7) of the CLHLS with 2,299 middle-aged controls (mean 48.4) in
  a southern and a northern dataset: G was in 0.054 of the centenarians' alleles and 0.084 of the controls', OR 0.60
  per G, P 3.7e-8 combined (south 1.4e-6, north 2.3e-3; the regions' meta-analysis 4.9e-8), so C is the longer-life
  allele. Both P values sit just under 5e-8 with λ 1.022 left unapplied. Liu 2021, the same group, says the SNP
  failed its later quality control, and separately remarks that G was overrepresented in Zeng's data against "Asians in
  dbSNP (G = 0)". The reference frequency depends on the source: ALFA has samples with no G and gives Europeans 0.098,
  as Liu says, where 1000 Genomes gives 0.20, and East Asians 0.095 (CHS 0.10, CHB 0.068), close to Zeng's controls
  (0.092 south, 0.079 north), unlike row 48's IL6 SNP. A site whose frequency differs by source fits a failed call.
  The variant is tri-allelic, which Liu offers for its absence from Deelen 2019. Timmers 2019 tested
  Zeng's locus at rs113946246, whose T rides with C (T 0.82 in LifeGen, C 0.80 in 1000 Genomes Europeans). It carried
  Zeng's effect to the parental scale by the APOE calibration (T +0.0735, SE 0.0134) and found +0.0008 (SE 0.0055),
  one-sided P 0.44. Derived under D25.3: at APOE's factor, power 1.00 and heterogeneity P 4.9e-7; at the loci's mean
  factor 0.4175, expected 0.176 (SE 0.052), power 1.00 and heterogeneity P 7.3e-4. That is a red flag under both
  (D21), so `replication_failed`, and it holds down to about 0.2 of the APOE-calibrated effect (power 0.85,
  heterogeneity P 0.023). The other tags in LifeGen are as flat (rs2440021, rs1937748, rs1822375, P 0.91 to 0.98); a
  LifeGen-only line at the lead itself (no UK Biobank, info 0.69) puts C +0.0059 (SE 0.020), P 0.77. Outside Timmers:
  FinnGen R11's death endpoint has G on the fewer-deaths side, flat (P 0.76; a database line, D29.1); Park 2025's own
  survival has C with fewer deaths, flat (P 0.30, one-sided 0.15; columns swapped, as at APOE; UK Biobank's people);
  Zenin's healthspan G earlier, flat (P 0.38 raw, 0.39 after genomic control; one-sided 0.19 raw on C's side), and
  Zenin's parental-lifespan look-up G longer, flat (P 0.65). Exceptional survival in Europeans is untested: Zeng's own
  Supplementary Table 3 has NA for the EU consortium and NECS, Deelen's Supplementary Data 1 leaves the line blank,
  and Deelen's 90th and 99th percentile files hold no line at the lead or its four LifeGen tags; their lines within
  15 kb are at SNPs outside the lead's 168 European partners at r² ≥ 0.5. Liu 2021's QC failure is a second line, not
  the ground: its reference-frequency leg depends on the source, unlike row 48's (D26.14 not applied; the lead's
  call, 2026-11-12). Mechanism general ageing (D25.7): no trait other than longevity is recorded at the lead (the GWAS
  Catalog holds only Zeng's line), and nothing is known to run through the pseudogene. No pleiotropy. Context
  `ancestry_specific:eas`: the claim is Han Chinese, tested in Chinese regions only. Open Targets 26.09 has no record
  for the variant, and Zeng's study holds only IL6's credible set, so C4 and E4 with no gene. Age of action unknown.
  Genotypes neutral (D25.2). The rsID literature search found Zeng 2016, Liu 2021 and nothing else.
