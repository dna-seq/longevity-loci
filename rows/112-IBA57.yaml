# The seed list's locus 112, IBA57 (1q42.13): a marker of biological ageing (D32, D36.3), curated on D37.12 with 23
# TERC as the pattern. Curated 2026-11-16. Lead rs117530284, the seed's rsID (Lin 2022's Taiwanese GrimAge locus): in
# the 3′ UTR of IBA57's MANE transcript, GRCh38 1:228,176,631, GRCh37 1:228,364,332, multi-allelic G/A/T, the row
# meaning G/A; A at 2.2 % in gnomAD's East Asian genomes and 0.009 % in the non-Finnish Europeans. A is the allele with
# faster GrimAge.
locus_id: 112
locus_name: IBA57
verdict: kept
verdict_reason: >-
  Tier B on the marker's own evidence (D37.12; the seed gives none; C until D38.4, 2026-11-16): the tier grades the
  association with GrimAge acceleration, a DNA methylation clock read against calendar age, not longevity, and this
  row is unscored (D32). Lin 2022 ran a GWAS of epigenetic clocks in 2,309 Taiwan Biobank participants, with a
  'prioritized subset analysis' to boost power, and names rs117530284 a new GrimAge locus: each A adds 1.59 years of
  GrimAge acceleration (1.07 to 2.11), adjusted for sex, BMI, smoking, drinking, exercise, education and ancestry. The
  abstract prints no P, but its 95 % interval gives SE 0.265, z 6.01, two-sided P 1.8e-9: the article's own figure,
  derived and said so (D38.4), agreeing with the GWAS Catalog's 2e-9 (A at 0.024); the full text was not reached (no
  PMC copy; OUP's PDF answered 403, 2026-11-16). A prioritized subset tests fewer variants, so 1.8e-9 is genome-wide by
  any count: B, one study, unreplicated. It is a small sample with a rare allele and a power-boosting method, so the
  effect carries a winner's curse, named; a 2025 Korean clock GWAS (1,962 people) found by the literature search does
  not name it in its abstract (its lines unread). A is all but absent in Europeans (0.009 %), so no European sample
  tests it: Deelen 2019, Timmers 2019, Pilling 2017, Park 2025, Zenin 2019, Foote 2025 and FinnGen R11 were each looked
  up (2026-11-16, by rsID and GRCh37 1:228,364,332) and hold no line: untested. Every genotype neutral, each conclusion
  a tendency of the marker with no colour (D32, D37.12); `direction: unknown`. Outcome cells: untested throughout.
  Mechanism: markers of biological ageing; IBA57 makes a mitochondrial iron-sulphur cluster assembly protein (the
  author). No pleiotropy in the Catalog, which holds this line alone. Causal C2 (PIP 0.30 in Lin's GrimAge set).
  Effector E3: locus-to-gene's top is IBA57 at 0.11, the variant in its 3′ UTR. Descriptive. Age of action unknown.
  The evidence is Taiwanese, as `ancestry_specific:eas`.
