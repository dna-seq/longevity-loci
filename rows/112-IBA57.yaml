    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as nearly everyone of European ancestry
          and about 96 in 100 people of East Asian ancestry do. It is the reference the other combinations are
          compared with. The position lies in the IBA57 gene on chromosome 1. Epigenetic clocks estimate age from
          chemical marks on DNA; a clock's reading only means something against your calendar age, which this report
          does not have, so this result carries no score.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy of a version of this DNA position found mainly in people of East Asian ancestry (about 4 in
          100 carry it, and almost no one elsewhere). One Taiwanese study linked it with a GrimAge epigenetic clock
          reading about one and a half years older than calendar age, on average, in one modest study. That is a
          tendency in a marker whose reading only means something against your calendar age, which this report does
          not have, so it carries no score.
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of a version of this DNA position found mainly in people of East Asian ancestry, which
          is very unusual. One Taiwanese study linked each copy with an older-reading GrimAge epigenetic clock. That is
          a tendency in a marker whose reading only means something against your calendar age, which this report does
          not have, so it carries no score.
