variants:
  - rsid: rs4755737
    gene: ""
    phenotype: HSD17B12 region, survival to older age
    trait_efo_id: OBA_VT0005372
    effect_allele: A
    effect_size: 0.01207
    effect_measure: beta
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the older, ancestral version of this DNA region (about 29 in 100 people of
          European ancestry do). It is the reference the other combinations are compared with. The region, on
          chromosome 11, holds the HSD17B12 gene among others; which gene matters is not known. The finding comes from people of European ancestry; less is known elsewhere.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of the A version of this DNA region (about half of people of European ancestry do).
          In one large study of genealogy-site customers, the A version was a little more common among older
          people, and several other studies lean the same way, with slightly fewer deaths in a Finnish study and
          slightly longer-lived parents in a much larger one, but none of them clearly confirms it. This is early
          evidence. The effect, if real, is small: a tendency, not destiny.
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of the A version of this DNA region (about 21 in 100 people of European ancestry
          do). In one large study of genealogy-site customers, each copy was a little more common among older
          people, and several other studies lean the same way, with slightly fewer deaths in a Finnish study and
          slightly longer-lived parents in a much larger one, but none of them clearly confirms it. This is early
          evidence. The effect, if real, is small: a tendency, not destiny.
