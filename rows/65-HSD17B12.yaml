# The seed list's locus 65, HSD17B12 (11p11.2). Curated 2026-11-12. Lead rs4755737 (the seed's lead), an HSD17B12
# intron, from Wright 2019's GWAS of AncestryDNA customers' own current age (Supplemental Table 8), as at rows 10 and
# 54, not the parental-lifespan meta-analysis the seed names: the lead has no line in Supplemental Table 9, which holds
# clumped representatives only (pmid-31484785#q6), so its absence there is not a null. The seed's
# second rsID, rs4755202 (172 kb away, a MIR670HG intron), is the same age-GWAS peak weakly tagged (r² 0.53, D′ 0.75
# in CEU, phase not printed; db-ensembl-116#q476): named, not scored. Not in Timmers 2019's Figure 2 sheet.
locus_id: 65
locus_name: HSD17B12
verdict: re-tiered
verdict_reason: >-
  Tier C, from the seed's B. The region's strongest result is Wright 2019's GWAS of the current age of 482,068
  AncestryDNA customers (VIABILITY_AF, confirmation only under §4.5, so it cannot carry A or B alone, D23). There A,
  the derived allele (0.46 in non-Finnish Europeans), is commoner among older customers, and it is suggestive, not
  genome-wide, at the P the paper uses for its own call (D17.3, D26.1, D29.7): Supplementary Table 6 marks
  significance on the genomic-control P after Bonferroni correction, and MAP2K6 passes there only narrowly (PUC
  2.39e-8, PGC 9.84e-8); genomic control (λ 1.374) gives the lead 4.8e-7 against the paper's Bonferroni line of 9.3e-8; uncorrected it is 3.6e-9, the GWAS Catalog's "Longevity" record
  of 4e-9 and the GWAS Catalog's only association for the lead. The paper names only APOE and MAP2K6 from this
  analysis. The seed reads the study as a parental-lifespan meta-analysis with UK Biobank: the lead has no line in
  it, whose table holds clumped representatives only; the seed's second rsID, rs4755202, has one, nominal in fathers (meta P 3.7e-4, its UK Biobank arm P 0.025) at r² 0.53
  to the lead, named, not scored. Every independent look-up at the lead leans A's way, none past nominal: FinnGen
  R11's any-death endpoint (A with fewer deaths, P 0.039, one-sided 0.019; outside AncestryDNA and UK Biobank,
  named from the database line), Park 2025's own survival in 393,833 UK Biobank participants (A with fewer deaths
  than expected, P 0.012, one-sided 0.006; the deposit's allele columns swapped, as at APOE), Timmers 2019's million parental lives (P 0.095, one-sided 0.047), Deelen 2019's
  90th and 99th percentiles (one-sided 0.028 and 0.043) and Zenin 2019's healthspan (P 0.0153 after its genomic
  control of 1.053, one-sided 0.0077; raw 0.013, D26.1).
  The same customers' mothers also go A's way (genomic control P 0.0022; their fathers' P is above the table's 3e-3
  cut, not printed), but those are the age GWAS's genotypes, not a replication. The independent looks are three
  sample families, not six: UK Biobank (Timmers, Park and Zenin share it), FinnGen, and Deelen's cohorts (which
  share at least the Rotterdam Study with LifeGen; the 99th percentile's cases sit inside the 90th's). A suggestive
  confirmation-class result with consistent nominal support in those three: C, as rows 10 and 54, not B (R-TIER-4, no genome-wide scoring-class anchor), not D (nothing contradicts
  it). Open Targets 26.09 holds the lead in one credible set of the eight studies, Wright's age study's (PICS, 69
  variants), where its posterior probability, the set's highest, is 0.124. That set is built at the uncorrected
  4e-9 the row does not read as genome-wide, so it sets no causal or effector level (D28.5): C4, E4, no gene named.
  On that set, in prose only: locus-to-gene gives HSD17B12 0.454 (the seed's HSD17B12:0.45), ALKBH3 0.268; of its
  24 QTL colocalisations at H4 ≥ 0.8, HSD17B12 holds 17 (expression and splicing) and the unnamed ENSG00000246250 5,
  a rival by D24's tenth, so the call would be E3 even if the set counted. The set colocalises (H4 above 0.9) with
  diastolic and systolic blood pressure, hypertension, sleep duration, red cell distribution width and the linoleic
  acid fraction, and at 0.84 with body mass index (under the cut, no token); every one of those sets is led by
  another variant (the lead leads only Wright's set and one splicing set), so their betas give A no direction:
  shared signal, not a mediator, so the mechanism is general ageing with blood-pressure, sleep, blood-count and
  lipid pleiotropy, and no trade-off is filed. The protection is a presence, the
  derived A. Age of action is unknown. A is 0.68 in East Asians, untested there. Unchecked: a region-wide GWAS
  Catalog scan (its old API retired, v2 timed out), and Park's deposit beyond the two seed rsIDs.
