# The seed list's locus 152, intergenic chr17 (GWAS Catalog maps ANKFN1/RPL39P33) (17q22). Curated 2026-11-16. Lead
# rs75737809, the seed's only rsID (Hsieh 2026's 85-and-over and 90-and-over Taiwanese locus): intergenic, GRCh38
# 17:56,544,129 T/A, A at 3.2 % in gnomAD's East Asian genomes and 0.003 % in the non-Finnish Europeans, A the
# discovery's shorter-lived allele and T the longer-lived. Open Targets 26.09 has no record of it; the GWAS Catalog
# (2026-10-29) holds Hsieh's two lines.
locus_id: 152
locus_name: intergenic chr17 (GWAS Catalog maps ANKFN1/RPL39P33)
verdict: kept
verdict_reason: >-
  Tier C, the seed's: a sub-genome-wide East Asian discovery in one hospital's old-against-young sample (R-TIER-2,
  R-TIER-4), with no same-scale contradiction and nothing independent passing (D31.13's Hsieh bullet). Hsieh 2026
  compared Taiwanese hospital patients who died at 85 or over (1,595) or 90 or over (922) with 880 who died at 65 to 75
  at the same hospital: A (pooled 0.023 and 0.026) OR 0.32 per A, P 2.85e-6, and 0.28, P 4.9e-6, under the paper's
  suggestive line of 1e-5. Solved per Alt from the OR and the counts, the shared controls carry A at about 0.0405
  (85 and over) and 0.0410 (90 and over), matching each other and the paper's printed 1000 Genomes column (0.040; Ensembl's
  1000 Genomes EAS is 0.0357, 36 of 1,008, both named), and the long-lived
  at about 0.013 and 0.012 (derived). Against gnomAD's East Asian genomes (3.23 %, 167 of 5,174 alleles), the
  reference D31.13 fixes and D37.2 keeps, the controls fit (about 71 copies against 56.8, Fisher's exact on both counts
  P 0.11, D37.1; 90 and over P 0.096; across the pooled frequency's rounding, 0.0225 to 0.0235, P 0.07 to 0.15), so
  the discovery is read as printed (D31.10 not met), and read against the reference the long-lived sit well below it
  too (about 42 to 43 copies against 103, OR 0.40 per A, Fisher P 2e-8 to 3e-8; derived). Across Hsieh's OR interval
  (0.20 to 0.52, from its P) the controls misfit at the low edge (83 copies, Fisher P 0.0048), which would read the
  discovery against the reference, where the long-lived still sit far below (P 4e-12), and fit at the high edge (P
  0.88): C on every reading. The other references are named branches, each call stated (D37.2): against 1000 Genomes
  EAS the controls fit (P 0.61) and the long-lived sit below (Fisher P 2.5e-5): C; against 1000 Genomes CHS (5 of 210)
  the controls fit (P 0.34), so it is read as printed, C, though the long-lived are not below it there (OR 0.56, P
  0.22), the one branch leaning toward D31.11's shape (all derived). Its validation cohort (85 and over at a second hospital) gives OR 0.179, P 1.1e-7,
  and 0.062, P 6.3e-11, the same direction, but its controls are not its own (Fig. 2), so it is not an independent
  replication (D19.1). A is all but absent in Europeans (0.003 %), so no European sample tests it: Deelen 2019,
  Timmers 2019, Park 2025 (all three files), FinnGen R11, Pilling 2017, Zenin 2019 and Foote 2025 were each looked up
  at the variant (2026-11-16, GRCh37 17:54,621,490) and hold no line: untested, not negative. Hsieh's APOE line in its
  older groups is null (D31.13), so no calibration is the paper's own. The literature search (the rsID, 2026-11-16;
  Semantic Scholar answered 429, its part unchecked) finds nothing, Hsieh included, which is found by its PMID.
  Genotypes: T/T the reference, A carriers risk, as weak early evidence. Exceptional survival + (the discovery read
  as printed, with the reference read agreeing; a C row's one sample); lifespan untested; healthspan untested.
  Mechanism ageing in general (D25.7): intergenic, nothing recorded at the variant. Causal C4 and effector E4: no
  Open Targets record. Descriptive. Age of action unknown. The evidence is Taiwanese, as `ancestry_specific:eas`.
