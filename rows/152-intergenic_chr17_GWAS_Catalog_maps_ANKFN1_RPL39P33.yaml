variants:
  - rsid: rs75737809
    gene: ""
    phenotype: 17q22 intergenic, longevity, Taiwanese
    trait_efo_id: OBA_VT0005372
    effect_allele: T
    effect_size: 3.13
    effect_measure: OR
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (nearly everyone of European ancestry, and
          about 94 in 100 people of East Asian ancestry, do). It is the reference the other combinations are compared
          with. The position lies between genes on chromosome 17.
      - genotype: A/T
        state: risk
        conclusion: >-
          You carry one copy of a version of this DNA position found mainly in people of East Asian ancestry (about 6
          in 100 carry it, and almost no one elsewhere). One Taiwanese study found it less often among people who
          lived past 85 or 90, in one hospital, and it has not been confirmed in an independent sample. This is weak,
          early evidence: a possible tendency, not destiny.
      - genotype: A/A
        state: risk
        conclusion: >-
          You carry two copies of a version of this DNA position found mainly in people of East Asian ancestry, which
          is very unusual. One Taiwanese study found single copies less often among people who lived past 85, a
          finding not yet confirmed, so nothing can be said about two copies.
