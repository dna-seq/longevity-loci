variants:
  - rsid: rs61905747
    gene: USP28
    phenotype: ZW10/USP28 region, cancer and ageing
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: -0.0160
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 67 in 100). It is the reference the other versions are compared with, so it neither raises
          nor lowers your expected lifespan here. The region, on chromosome 11, holds several genes and it is not
          yet clear which one matters. The finding comes from people of European ancestry; less is known
          elsewhere.
      - genotype: A/C
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 29 in 100 people of European
          ancestry do). In British and European studies it went with parents living a little less long and with
          slightly worse odds of staying free of major disease, possibly through cancer, but a large American
          study did not see the effect. It is a likely finding, not a settled one, and the effect is small. The gene
          most likely involved is USP28, though that is not settled.
      - genotype: C/C
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 3 in 100 people of European
          ancestry do). In British and European studies each copy went with parents living a little less long and
          with slightly worse odds of staying free of major disease, possibly through cancer, but a large American
          study did not see the effect. It is a likely finding, not a settled one, and the effect is small. The gene
          most likely involved is USP28, though that is not settled.
