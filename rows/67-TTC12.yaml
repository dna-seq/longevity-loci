# The seed list's locus 67, named TTC12 by the seed; the papers call it ZW10 (11q23.2, the ZW10/USP28/TTC12/ANKK1
# block). Curated 2026-11-10, the pilot's fifth and last row. Lead rs61905747 (Pilling 2017, Timmers 2020);
# rs17613838 (Wright 2019) is the same signal and appears only as a proxy on its study.
locus_id: 67
locus_name: TTC12
verdict: kept
verdict_reason: >-
  Tier B, down from the seed's A. Genome-wide significant only in Pilling 2017's fathers (UK Biobank, P 5.5e-9) and in
  Timmers 2020's multivariate test, which pools data that each fall short alone (parental lifespan P 2e-6 in
  Timmers 2019's million lives, healthspan P 2e-6, the 90th percentile P 0.01). Replicated in LifeGen's fathers
  (Timmers 2019, no value in the text) and nominal at Deelen 2019's 90th percentile, both outside UK Biobank; but null
  in AncestryDNA's fathers (Wright 2019, P 0.81, heterogeneity P 3e-4 against UK Biobank), whose authors list it as
  not replicated. One genome-wide study, a single-sex one, with mixed replication: §4.1's B. Timmers 2019 counts it
  among the cancer-protective loci whose protective allele also lengthens life, so no trade-off is recorded. The
  effector is unclear: L2G is low for every gene (CLDN25 0.35, ZW10 0.20) and Timmers 2020's expression analysis
  names USP28, ANKK1 and TTC12.
