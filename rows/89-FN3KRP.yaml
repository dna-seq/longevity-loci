variants:
  - rsid: rs1046896
    gene: ""
    phenotype: FN3KRP region, HbA1c, longevity
    trait_efo_id: OBA_VT0005372
    effect_allele: C
    effect_size: 1.28
    effect_measure: OR
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 47 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome 17,
          lies in the FN3KRP gene, which helps repair sugar-damaged proteins. One study linked this position to
          reaching very old age, but larger and repeat studies did not confirm it, so it is not counted for or
          against lifespan.
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 43 in 100 people of European
          ancestry do). One study found it less often in very old people, but repeat studies in other European groups
          and much larger studies did not confirm it, so it is not counted for or against lifespan. The same version
          goes with slightly higher HbA1c, a blood sugar marker.
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 10 in 100 people of European
          ancestry do). One study found it less often in very old people, but repeat studies in other European groups
          and much larger studies did not confirm it, so it is not counted for or against lifespan. The same version
          goes with slightly higher HbA1c, a blood sugar marker.
