# The seed list's locus 89, FN3KRP (17q25.3). Curated 2026-11-13. Lead rs1046896, the seed's only rsID (Torres 2021's
# exome-chip longevity SNP): FN3KRP's 3′ UTR, GRCh38 17:82,727,657 C/T, GRCh37 17:80,685,533, T the minor allele (0.32
# in non-Finnish Europeans), C the paper's longevity allele. Open Targets 26.09 holds it in 113 credible sets, none of a
# lifespan-class study; the GWAS Catalog (2026-10-29) holds eight associations, seven of them HbA1c.
locus_id: 89
locus_name: FN3KRP
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's C: a sub-genome-wide discovery that fails a powered test in its own ancestry (D26.8, a
  fortiori of D25.1). Torres 2021's exome-chip study of 1,212 German long-lived people (94 to 110 years) against 6,762
  younger controls finds T less common among the long-lived (OR 0.78, 0.71-0.86, P 7.4e-7): exome-wide significant on its chip (the authors' call; their gene-based threshold is 3.4e-6), not genome-wide, so C is the longevity allele. The paper's own replications, in Europeans, go flat or the
  other way: French (1,264 long-lived, 1,830 controls) OR 1.06, P 0.25; Danish (1,002 and 738) OR 1.00, P 0.99; the
  three-study meta-analysis OR 0.94, P 0.55, with heterogeneity Q P 1.0e-4, I² 89 %, "did not replicate". On the
  discovery's own case-control scale (no conversion), the French test has one-sided power 0.996 and heterogeneity P
  4.8e-5, the Danish 0.92 and 0.009: D21 red flags. Against the matching reference (D30.10, D30.18: gnomAD's
  non-Finnish Europeans, T 0.317), the French controls misfit (T 0.347, P about 2e-4), so the French sample is named
  and not counted; the Danish controls fit (T 0.288, P about 0.015, above D30.10's 0.01), and D rests on the Danish
  sample alone. No independent scoring-class study gives P < 0.05 for C: Timmers
  2019's million parents' lives lean the other way (T longer, P 0.16, one-sided 0.078 against C), Pilling's parents
  (P 0.65), Park 2025's own survival (P 0.73, its allele columns swapped), FinnGen R11's death endpoint (P 0.95),
  Zenin 2019's healthspan (C's way, P 0.24) are flat, and so is Deelen 2019 (90th and 99th percentiles P 0.74, 0.36, the 99th T's way), whose cohorts include CEPH's French and Danish samples, so it is not independent of Torres' replications; Wright 2019's AncestryDNA tables hold no parental line within 500 kb, only a viability line 236 kb away (rs9747676, r² 0.14 in CEU), which confirms and never replicates (D23); Rosoff 2023's mvAge tables hold no line; nothing within 1 Mb in Timmers reaches 10⁻⁵, and Foote 2025's frailty deposits hold no line at the lead.
  The seed's C was the suggestive single study; tested and contradicted, it is D. Outcome cells on a D row (D28.10):
  exceptional survival 0, the contradicted discovery giving no +, and no study gives one-sided P < 0.05 against C
  (D28.3); lifespan 0 (Timmers one-sided 0.078 against C, short of 0.05); healthspan 0. Mechanism ageing in general,
  as on every D row (D25.7). The locus is an HbA1c locus: the lead tops five HbA1c credible sets, T raising HbA1c (P
  3e-115, posterior up to 0.49, locus-to-gene FN3KRP 0.87), and FN3KRP deglycates proteins, which the authors offer as
  the mechanism; C raises FN3KRP expression in blood (Torres) and other tissues. Named; pleiotropy empty, since no
  longer-life allele is left to weigh it against. Descriptive. Causal C4 and effector E4, no gene named: no
  lifespan-class credible set holds the lead; FN3KRP is named in prose, and FN3K beside it (one HbA1c set's locus-to-gene names FN3K, and the lead tops expression QTL sets for FN3K, ENSG00000167363). Every genotype neutral (D25.2); C/C, the
  commonest, the reference. The evidence is European.
