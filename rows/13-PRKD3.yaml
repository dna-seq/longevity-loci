# The seed list's locus 13, PRKD3 (2p22.2). Curated 2026-11-11, the second run's third row. Lead rs577106756 (Park
# 2025, men's own-survival GWAS in UK Biobank), the seed's only rsID here: a 0.1 % intron variant. Timmers 2019's
# summary statistics and Deelen 2019's Supplementary Data 1 hold no row for it (untested there, not null); Wright
# 2019's tables hold one clumped SNP within 0.5 Mb, rs17497197 in the fathers (about 0.3 Mb away), with no cached LD
# to the lead: not read. Ensembl's LD window returns nothing (two copies of A in 1000 Genomes EUR): no tag is known.
# Open Targets 26.09 holds Park's men's study with one credible set, at APOE, and does not know the variant; the GWAS
# Catalog (2026-10-29) holds Park's association alone.
locus_id: 13
locus_name: PRKD3
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it, on §4.1's single-study clause, and a fragile B. Genome-wide significant in one study
  only: Park 2025's own-survival GWAS of UK Biobank's 180,970 men (21,059 of them dead), where rs577106756's A goes
  with reduced lifespan (β 0.09 on the Martingale residual, which rises with death; P 3.2e-8, past the paper's own
  5.0e-8). That threshold is applied to each of three GWAS (whole cohort, men, women) without correction for running
  three, and the variant sits at the analysis's frequency floor (MAF 0.1 %, imputed). In the whole cohort only APOE
  and ZSCAN23 pass, so PRKD3 is a men-only result; the women's estimate is not stated. The authors say the study has
  no independent external replication. Their own look-up in FinnGen's "Death" (both sexes, N 453,733) gives P 0.55
  with β −0.07 for A, on a scale where positive is more death: it leans the other way. That is a non-replication,
  not a red flag: FinnGen's outcome is binary and both sexes, and its power for a 0.1 % variant is not stated (the
  71/67 rule needs a powered one). Nothing else tests it: Timmers 2019's summary statistics and Deelen 2019's
  look-ups have no row for the variant (untested, not null), and no tag is known. Healthspan is 0: Zenin 2019's
  summary statistics give P 0.97 at the variant, though with a standard error of 0.07 at this frequency the test
  says almost nothing. Exceptional survival is untested. Mechanism: filed as general ageing, since the one disease
  link is the authors' PheWAS in the same UK Biobank people, oropharyngeal cancer as the primary cause of death (P
  4.5e-8, OR 1.04 for A) and self-reported stomach cancer (P 6.1e-7): the paper's statement, cited as mech:cancer,
  and drawn from the same deaths that make the lifespan signal, so not an independent trait. Open Targets 26.09
  holds Park's men's GWAS with a single credible set, at APOE, and has no record of rs577106756: no fine-mapping
  (causal:C4) and no locus-to-gene score (effector E4, no flag, `gene` empty); the variant lies in a PRKD3 intron,
  which names the locus and not an effector. Actionability is descriptive. The protection is the absence of the risk
  allele: A is rare and shortens life; G, which nearly everyone carries, is the reference. Context: men only, and
  European. Age of action is unknown.
