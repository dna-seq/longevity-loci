variants:
  - rsid: rs577106756
    gene: ""
    phenotype: PRKD3 intron, lifespan in men
    trait_efo_id: OBA_VT0005372
    effect_allele: G
    effect_size: -0.09
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the usual version of this DNA position, the one nearly everyone of European
          ancestry has (more than 99 in 100). It is the reference the other combinations are compared with. The
          position, on chromosome 2, lies inside the PRKD3 gene. The finding comes from men of European ancestry;
          less is known elsewhere.
      - genotype: A/G
        state: risk
        conclusion: >-
          You carry one copy of a rare version of this DNA position (about 1 in 300 people of European ancestry
          do). In one large British study, men with this version tended to die somewhat earlier; it was not seen in
          women, and a Finnish study did not confirm it. It is a possible finding, not a settled one: it rests on a
          single study and has not been confirmed in a separate group of people. It is a tendency, not destiny.
      - genotype: A/A
        state: risk
        conclusion: >-
          You carry two copies of a rare version of this DNA position. This is extremely uncommon (a few people in a
          million), and no study has looked at people with two copies. In one large British study, men with one copy
          tended to die somewhat earlier; it was not seen in women, and a Finnish study did not confirm it. What two
          copies mean is not known. It is a tendency, not destiny.
