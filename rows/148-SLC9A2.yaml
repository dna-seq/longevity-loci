    gene: ""
    phenotype: SLC9A2 intron, longevity
    trait_efo_id: OBA_VT0005372
    effect_allele: A
    effect_size: 1.84
    effect_measure: OR
    stat_significance: significant
    direction: protective
    negatives: >-
      In a large UK study this rare version came with more lymphoid leukaemia and some head and neck cancers, a
      screen of many conditions at once, not a confirmed finding.
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as nearly everyone does. It is the
          reference the other combinations are compared with. The position lies inside the SLC9A2 gene on chromosome 2.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of a rare version of this DNA position (about 1 in 100 people of European ancestry carry
          it). One study of long-lived American and Danish families found it more often among family members who
          reached extreme old age, but it clusters in a few families and has not been confirmed in another sample.
          The same version may come with a higher risk of some cancers. This is weak, early evidence: a possible
          tendency, not destiny.
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of a rare version of this DNA position, which is very unusual. One study of long-lived
          families found single copies more often among those who reached extreme old age, a finding not yet
          confirmed, so nothing can be said about two copies.
