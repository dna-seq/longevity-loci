# The seed list's locus 148, SLC9A2 (2q12.1). Curated 2026-11-16. Lead rs6543176, the seed's only rsID (Gurinovich
# 2025's Long Life Family Study whole-genome scan): intronic in SLC9A2 on its MANE Select transcript, GRCh38
# 2:102,665,501, GRCh37 2:103,281,960, A/G with A the reference, ancestral and rare allele (0.525 % in gnomAD's
# non-Finnish European genomes, 0.04 % in the Finnish), A the discovery's longer-lived side. Open Targets 26.09 has no
# record of it; the GWAS Catalog (2026-10-29) holds no association.
locus_id: 148
locus_name: SLC9A2
verdict: kept
verdict_reason: >-
  Tier C, the seed's: genome-wide in one centenarian sample against spouses and others who died younger, unreplicated
  (R-TIER-2, as 118's design; §4.1's B needs a sample that clears that cap). Gurinovich 2025 sequenced the Long Life
  Family Study: 568 extreme-longevity cases (past the age fewer than 1 % of their sex and birth cohort reach) and 908
  controls, spouses and others who died before it, in a mixed-effects model with the full relationship matrix; A
  reaches genome-wide significance, −log10 P 8.3 (about 5e-9), at MAF 0.01 in the cases against gnomAD's 0.006, read
  as printed (D17.3, D29.5, D37.8). The
  paper prints no effect size or control frequency, so D31.10's control check cannot run (unknown). Against gnomAD's
  non-Finnish European genomes (0.525 %, the reference D31.13 fixes for a whole-genome study) the cases' printed
  0.01 is about 11 copies in 1,136 alleles where 6.0 are expected (357 of 68,013), OR 1.84, Fisher's exact on both
  counts P 0.059, one-sided 0.043 (D37.1; a Poisson one-sided 0.041 before); the printed MAF is rounded, and with
  the text's "1.7 times" gnomAD it lies about 0.009 to 0.011, 10 to 13 copies, where the read runs from Fisher P 0.10
  to 0.011 (derived). The printed P and that read do not meet: no allele count the printed MAF allows reaches −log10
  P 8.3 (one-sided Fisher against the 1,816 control alleles: 11 copies against none 2.7e-5, even 17 against none 8e-8;
  11 against 9, the controls at gnomAD's level, 0.10; derived), named as a derived bound; the printed P is read as
  printed, not set aside on it (D37.8). The carriers cluster in 24 of the
  study's 587 families, so the copies are not independent. Replication failed for want of a usable line: the New
  England Centenarian Study's imputation fell under Rsq 0.7 and UK Biobank's parental-longevity GWAS does not hold
  it. With no printed effect size, no look-up can be calibrated, so no flag can be computed (unknown, no token,
  D26.3). The deposits that hold it lean A's way or sit flat: Park 2025's own survival has A with fewer deaths, −0.0077
  (SE 0.0057), P 0.16, one-sided 0.08 (men P 0.53, women 0.14; A at 0.55 %, the deposit's columns swapped); Pilling
  2017's parental scans flat (both parents' attained age A longer, P 0.5; mothers 0.4, fathers 0.92, top 10 % 1.0);
  FinnGen R11's deaths have A with more deaths, flat (P 0.65; A at 0.07 % in Finns), a database line (D29.1).
  Deelen 2019, Timmers 2019, Zenin 2019 and Foote 2025 hold no line (untested). The literature search (the rsID with
  SLC9A2, extreme longevity and whole genomes, 2026-11-16) finds Gurinovich alone and its 2022 conference abstract.
  Exceptional survival + (the discovery, genome-wide; R-TIER-2 caps the tier, not the cell); lifespan 0 (Park and
  Pilling flat); healthspan untested. Mechanism ageing in general (D25.7): intronic in SLC9A2, a sodium-hydrogen
  exchanger; the authors tie A to higher serine levels and less hypertension (LLFS HR 0.62, P 0.08; UK Biobank OR
  0.92, P 0.13), neither nominal. Pleiotropy `mech:cancer` and `tradeoff` (D18.1): the paper's UK Biobank PheWAS, signs
  recoded to A, puts A with lymphoid leukaemia (OR 9.03, P 1.6e-4) and with head and neck cancers at nominal P, which
  passes a Bonferroni over the 119 cancer phenotypes searched (0.05/119 = 4.2e-4), not genome-wide, on a few carriers
  among 578 cases, which its title calls an increased risk for cancer. Causal C4 and effector E4: no
  Open Targets record. Descriptive. Age of action unknown. The evidence is European (the study's participants are of
  European descent).
