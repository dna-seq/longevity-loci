# The seed list's locus 19, HMGB3P12 (3p24.1; the seed's genes "HMGB3P12; VENTXP4", the paper's LINC00692;LRRC3B).
# Curated 2026-11-11, the second run's ninth row. Lead rs78043944, the seed's only rsID here: an intergenic variant,
# rare in Europeans by gnomAD (A 0.0069) but 0.14 by 1000 Genomes. Gurinovich 2021's NECS centenarian SNP (Supplement
# Table 1); the main text is not open, its supplements are read. In Timmers 2019's and Zenin 2019's summary statistics;
# absent from Deelen 2019's files and from Wright 2019's S8 and S9.
locus_id: 19
locus_name: HMGB3P12
verdict: re-tiered
verdict_reason: >-
  Tier C, down from the seed's B: an unreplicated centenarian case-control comparison, which R-TIER-2 caps at C (the
  controls' ages are in the unread main text, so the rule is applied on the design). Gurinovich 2021 compared 1,320
  New England Centenarian Study centenarians (median age 104) with 2,899 controls, all of European ancestry by the GWAS
  Catalog's study record, imputed to the HRC panel. A, the rare allele, is in 2.35 % of the centenarians' alleles and 0.65 % of the
  controls': score Z +5.88, P 4.22e-9, genome-wide (Supplement Table 1). The paper reports a score test Z, not an
  effect size: the GWAS Catalog's "beta 5.8755" is that Z, as is Open Targets' copy, and the crude odds ratio from the
  two frequencies, about 3.7, is unadjusted and derived here. The abstract says the genetic associations were
  replicated in an Ashkenazi Jewish GWAS of 480 centenarians, but not which SNPs; the main text is not open, and
  rs78043944 is not among the 56 SNPs whose Ashkenazi results Supplement Table 2 prints. A is about 0.2 % in Ashkenazi
  Jews by gnomAD, so that cohort could barely test it. Replication is unknown, not failed. The variant's frequency is
  itself in doubt, which is the confounding R-TIER-2 names: gnomAD Europeans 0.0069, NECS controls 0.0065 and UK
  Biobank 0.0054 agree, while 1000 Genomes gives 0.14, and Timmers 2019's cohorts range from 0.005 to 0.13 (imputation
  info 0.89), so a reference panel decides how common A looks. A is also common in Africans (gnomAD 0.26) and rare
  in Europeans, so a small difference in ancestry between cases and controls would shift it on its own. No other
  study supports it. Timmers' parental lifespan is null (P 0.62, A on the shorter side), a null weakened by that
  frequency spread. Zenin 2019's
  healthspan is null (P 0.71). Deelen 2019's longevity files do not hold the variant. Lifespan is filed 0, healthspan
  0, exceptional survival + on the paper's own result. The evidence is European. Mechanism general ageing:
  nothing assesses one, since the GWAS Catalog holds no other trait for the variant and Open Targets no other set.
  Causal C1 by §4.2's threshold, but with little meaning: the one set is Gurinovich's own, a PICS set built from
  the reported top hit, and a rare variant with no LD partners makes a one-variant set at posterior 1 by
  construction. Effector E3, no gene named: L2G's top gene is LRRC3B at 0.43, below 0.5, with no colocalisation,
  and the sources name different nearest genes (LINC00692 and LRRC3B in the paper, HMGB3P12 and VENTXP4 in the
  catalog). The protection is a presence: the rare A goes with reaching 100. Age of action is unknown.
