variants:
  - rsid: rs78043944
    gene: ""
    phenotype: HMGB3P12/LRRC3B region, reaching 100
    trait_efo_id: OBA_VT0005372
    effect_allele: A
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one almost everyone of European
          ancestry has (about 98 or 99 in 100). It is the reference the other combinations are compared with. The
          region, on chromosome 3, lies between genes, and no gene is known to matter here.
      - genotype: G/A
        state: protective
        conclusion: >-
          You carry one copy of a rare version of this DNA region (about 1 in 100 people of European ancestry do).
          In one American study, people who reached 100 carried it more often than other people did. It has not been
          confirmed in another group, and how common it really is differs between reference databases. It is early
          evidence, not a verdict.
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of a very rare version of this DNA region (far fewer than 1 in 1,000 people of
          European ancestry do). In one American study, people who reached 100 carried this version more often than
          other people did. It has not been confirmed in another group, and no one with two copies was studied on
          their own. It is early evidence, not a verdict.
