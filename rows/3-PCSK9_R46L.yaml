# The seed list's locus 3, PCSK9 R46L (1p32.3). Curated 2026-11-14. Lead rs11591147, the seed's only rsID: PCSK9's
# Arg46Leu, GRCh38 1:55,039,974 G/T, GRCh37 1:55,505,647, T the rare allele (0.016 in gnomAD's non-Finnish Europeans,
# 0.044 in Finns) and the 46L, the loss-of-function, LDL-lowering side. Open Targets 26.09 holds it in 1,659 credible
# sets, lipid and cardiometabolic, none of the nine lifespan-class studies; the GWAS Catalog (2026-10-29) holds 823
# associations, none for lifespan, longevity or death.
locus_id: 3
locus_name: PCSK9 R46L
verdict: re-tiered
verdict_reason: >-
  Tier C, from the seed's B, row 8 IL6R's shape (D30.4): nothing at this variant reaches genome-wide or suggestive
  significance in any lifespan-class study, and the seed's B rested on drug-target Mendelian randomization, which
  R-TIER-4 keeps out of A and B (R-RARE-2's "never above tier B" is met a fortiori). The lifespan results at the
  variant itself are nominal and point one way: in Timmers 2019's million parents' lives T, the 46L, goes with longer
  life, +0.048 per copy in self (SE 0.015), P 0.0019, the same side in UK Biobank and LifeGen; in Pilling 2017's
  UK Biobank parents T goes with longer attained age (both parents P 0.035, fathers 0.0027, mothers flat at 0.78) and
  raises the chance of both parents reaching the top 10 % of survival (P 0.036); in Zenin 2019 T delays the end of
  healthspan (P 0.0039). All of these are UK Biobank or hold it. Outside it the variant is untested at any power:
  Deelen 2019's 90th percentile leans T's way (P 0.17, one-sided 0.087; 99th flat, P 0.92), with one-sided power 0.67
  under APOE's calibration factor and 0.22 under the loci's mean factor, heterogeneity P 0.54 and 0.64; FinnGen R11's
  death endpoint leans T's way (P 0.64, power 0.77, heterogeneity P 0.13), a database line; Park 2025's own survival T
  with fewer deaths (P 0.13, its allele columns swapped), the same biobank. Wright 2019's AncestryDNA tables hold no
  line that tags the variant (the nearest, rs17111652, r² 0.07 in CEU), so AncestryDNA is untested; Foote 2025's
  frailty deposits hold no line at it. Nothing contradicts: D's clauses do not fit, and C keeps the variant in the
  research view with no weight. Two genetic studies of PCSK9 bear on it as annotation, neither a per-allele R46L
  result. Rosoff 2023's drug-target MR finds genetically proxied PCSK9 inhibition beneficial for its multivariate
  ageing factor (P 1.6e-6, 20 cis instruments). Benn 2019's allele score of four PCSK9 variants, R46L among them,
  in 109,566 Danes and UK Biobank, lowers cardiovascular death but not all-cause death (RR 1.01, 0.94 to 1.08 per
  0.5 mmol/l lower LDL); scaled to R46L's 0.40 mmol/l, 0.95 to 1.06 per allele, which reaches Timmers' 0.953 at its
  edge and so does not exclude it (derived). Lacaze 2021 finds T carriers among 13,131 healthy Australians over 70
  without coronary disease with 12 % lower LDL; its prevalence column is a carrier share, not an allele frequency,
  and it tests no enrichment, so it is named only. The literature search (Europe PMC, OpenAlex, PubMed, Crossref,
  preprints, Semantic Scholar) finds no other survival test of the variant. Exceptional survival + (Pilling's top 10
  %, nominal), lifespan + (Timmers, Pilling), healthspan + (Zenin): one-way and nominal, all within UK Biobank.
  Mechanism heart and vessels: T lowers LDL cholesterol (G +0.43 on LDL, P 4e-295) and coronary atherosclerosis (G
  the risk allele, P 6e-29), the LDL route stated as `mediator:EFO_0004611`; the catalog's one diabetes record (a
  factor analysis, P 8e-11) states no allele, so a trade-off is not shown and is left open. Causal C4: no
  lifespan-class credible set holds it (D17.2). Effector E1 PCSK9: the variant is missense in PCSK9 (Arg46Leu), and
  every lipid set's locus-to-gene names PCSK9 (0.94 in the first). The protection is a presence, the rare T. Not a
  treatment indication (R-VOICE-4): a standard cholesterol test shows the actual LDL level. Age of action unknown:
  Timmers' age bands do not include the variant, and the requirements' MIDLIFE was inferred from coronary risk. The
  evidence is European.
