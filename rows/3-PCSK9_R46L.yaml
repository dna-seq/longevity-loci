variants:
  - rsid: rs11591147
    gene: PCSK9
    phenotype: PCSK9 R46L, LDL cholesterol
    trait_efo_id: EFO_0007796
    effect_allele: T
    effect_size: 0.04771378
    effect_measure: beta
    stat_significance: nominal
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, in the PCSK9 gene, as about 97 in 100
          people of European ancestry do. PCSK9 controls how much LDL cholesterol, the "bad" cholesterol, the liver
          clears from the blood. This is the reference the other combinations are compared with. A standard
          cholesterol test your doctor can order shows your actual LDL level, which matters far more than this DNA
          result. The finding comes from people of European ancestry; less is known elsewhere.
      - genotype: G/T
        state: protective
        conclusion: >-
          You carry one copy of a rarer version of the PCSK9 gene (about 3 in 100 people of European ancestry do)
          that makes the protein work less and lowers LDL cholesterol, the "bad" cholesterol, by about a tenth. In
          large studies it went with less heart disease and, weakly, with parents who lived a little longer. This is
          early evidence, not a settled finding, and the difference is small: a tendency, not destiny. A standard
          cholesterol test your doctor can order shows your actual LDL level, which matters far more than this DNA
          result. It says nothing about whether any medicine is right for you.
      - genotype: T/T
        state: protective
        conclusion: >-
          You carry two copies of a rare version of the PCSK9 gene (about 3 in 10,000 people of European ancestry
          do) that makes the protein work less and lowers LDL cholesterol, the "bad" cholesterol, by about a fifth.
          In large studies each copy went with less heart disease and, weakly, with parents who lived a little
          longer; too few people carry two copies to say more. This is early evidence, not a settled finding: a
          tendency, not destiny. A standard cholesterol test your doctor can order shows your actual LDL level,
          which matters far more than this DNA result. It says nothing about whether any medicine is right for you.
