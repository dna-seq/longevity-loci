# The seed list's locus 39, ILRUN (6p21.31). Curated 2026-11-11, after the Figure 5 sweep. Lead rs6907508 (Rosoff
# 2023's mvAge, Table 1), the seed's only rsID here: an intron variant of ILRUN (C6orf106 in the paper). Wright 2019's
# Supplemental Table 9 holds two SNPs on the lead's haplotype (rs9462007, r² 0.79; rs9462014, r² 0.73), read as one
# signal. Open Targets 26.09: 705 credible sets hold the lead, mvAge's among them; it leads 205, most of them lipids,
# apolipoproteins, height and lean mass. The GWAS Catalog (2026-10-29) holds 42 associations for it and 146 for the 25
# of its 35 proxies at r² ≥ 0.8 that have records.
locus_id: 39
locus_name: ILRUN
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: a genome-wide multivariate result with a co-occurring lifespan study (§4.5 as D16
  reads it); a multivariate result does not meet tier A's first criterion (D18.3), whatever its replication.
  Genome-wide significant only in Rosoff 2023's mvAge, the common factor behind healthspan, frailty, exceptional
  longevity, parental lifespan and epigenetic age (P 1.9e-9, A raising the factor, so G, the minor allele at 10 % in
  Europeans, is on the less healthy side); Rosoff lists it as novel. Timmers 2019's million parents' lives are the
  co-occurring lifespan study: A lengthens life at P 6.9e-5, nominal, UK Biobank and LifeGen on the same side.
  Healthspan agrees nominally: A delays the end of healthspan in Zenin 2019's UK Biobank (P 3.4e-5). Exceptional
  survival is 0: Deelen 2019's summary statistics lean to A at the 90th (P 0.070) and 99th percentiles (P 0.055) and
  pass at neither two-sided (one-sided about 0.035 and 0.027). All three are inputs to mvAge, the same samples.
  Outside them, Wright 2019's AncestryDNA mothers support the signal at rs9462007, 123 kb away on the lead's haplotype
  (r² 0.79, D′ 1): its minor T, which travels with G, shortens mothers' lives at raw P 0.016 (one-sided 0.008); the
  genomic-control P is not printed (the SNP is not in the per-cohort table, so it is above 0.003 there). The counted
  allele is derived, not printed: the UK Biobank arm carries the same sign (heterogeneity P 0.79) and agrees with
  Timmers' UK Biobank at the lead only on G's haplotype. rs9462014 (r² 0.73) agrees at raw P 0.012; one signal, read
  once (D17.1); the fathers lean the same way (raw P 0.083). FinnGen's death endpoint leans the same way and does not
  pass (G toward more death, P 0.11). The Q test (P 0.095) finds no sign that the SNP acts off the common factor.
  Mechanism: ageing in general (D25.7). The lead tops 205 credible sets, mostly lipids: per G it lowers
  apolipoprotein B (P 2e-17), LDL (1e-20) and total cholesterol (1e-28), and also apolipoprotein A-I (2e-22) and HDL
  particles (2e-37); it raises height (1.5e-109, PIP 0.44) and lean mass (PIP 0.997 in that set), and multisite pain.
  On the proxies, the G haplotype goes with heart failure (two European studies, P 3e-10 and 2e-11), venous
  thromboembolism (5e-9) and chronic lymphocytic leukaemia (2e-8); coronary disease records exist there too, from
  studies whose ancestry the catalog does not report, so not read. No one route is shown to carry the lifespan
  effect, so no single system is named. A trade-off (D18.1): the longer-life A raises LDL and apolipoprotein B, an
  established risk factor, quoted at the lead itself, while the same haplotype has less heart failure and
  thrombosis; on lifespan A's side wins, so the net direction is resolved and the states are not neutral.
  Actionability is descriptive, as a trade-off makes it. Causal confidence C3: rs6907508 leads mvAge's credible set
  (PICS, 96 members) at PIP 0.085, the next at 0.055. Effector E2, ILRUN: 86 of the set's 102 QTL colocalisations
  (H4 ≥ 0.8) are ILRUN's expression and exon-level QTLs, ILRUN-AS1 holds 8 (under D24's tenth), BLTP3A 4, and no gene
  passes locus-to-gene (SNRPC 0.20, ILRUN 0.10), so the call rests on colocalisation alone. Hospital frailty's set
  (Mak 2025) holds the lead at PIP 0.011 behind a neighbour, named only (D25.5). The GWAS Catalog's NMR-metabolite
  lines (GCST90501xxx) print G "increase" where Open Targets' sets for the same accessions give a decrease per G;
  those lines are not read for direction. The protection is the absence of the risk allele: G shortens life and A is
  the common one. Age of action is unknown: no cached source gives this locus's own age bands.
