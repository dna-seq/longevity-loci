variants:
  - rsid: rs6907508
    gene: ILRUN
    phenotype: ILRUN region, blood fats and heart
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: 0.0102
    effect_measure: beta
    stat_significance: significant
    direction: protective
    negatives: >-
      The longer-life version, A, goes with slightly higher LDL ("bad") cholesterol and apolipoprotein B, a risk
      factor for heart disease, though it also goes with less heart failure and fewer blood clots; across whole
      lives its side comes out ahead.
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA region (about 81 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. The region, on chromosome 6,
          near the ILRUN gene, is linked to blood fats, heart failure, blood clots and body size. The finding comes
          from people of European ancestry; less is known elsewhere.
      - genotype: A/G
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 18 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, this version went with slightly less healthy ageing, and parents of carriers lived a
          little less long. Nearby versions that travel with it go with a somewhat higher risk of heart failure and
          of blood clots in the veins. The same version goes with slightly lower LDL ("bad") cholesterol, which
          would usually count in its favour, so it is a mixed picture. It is a likely finding, not a settled one.
          The effect is small and it is a tendency, not destiny.
      - genotype: G/G
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 1 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, each copy went with slightly less healthy ageing, and parents of carriers lived a
          little less long. Nearby versions that travel with it go with a somewhat higher risk of heart failure and
          of blood clots in the veins. The same version goes with slightly lower LDL ("bad") cholesterol, which
          would usually count in its favour, so it is a mixed picture. It is a likely finding, not a settled one.
          The effect is small and it is a tendency, not destiny.
