variants:
  - rsid: rs11065979
    gene: SH2B3
    phenotype: Blood pressure, heart and autoimmunity
    trait_efo_id: EFO_0007796
    effect_allele: C
    effect_size: 0.2798
    effect_measure: beta
    stat_significance: significant
    direction: protective
    negatives: >-
      The longer-life version, C, goes with less heart disease, lower blood pressure and less autoimmune disease,
      but with somewhat less protection against some cancers other than lung cancer; across whole lives the heart
      side outweighs it.
    genotypes:
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of each of the two common versions of this DNA region, the most common combination
          (about half of people of European ancestry have it). It is the reference the other combinations are
          compared with, so it neither raises nor lowers your expected lifespan here. The region, around the SH2B3
          gene, affects blood cells, blood pressure and the immune system. The finding comes from people of
          European ancestry; outside Europe one of the versions is rare and this result says little.
      - genotype: C/C
        state: protective
        conclusion: >-
          You carry two copies of the version of this DNA region that goes with lower blood pressure, less heart
          disease and less autoimmune disease (about 3 in 10 people of European ancestry do). In large British
          and European studies each copy went with parents living on average about three months longer, though a
          large American study saw a much smaller effect. The same version goes with slightly less protection
          against some cancers, but over a whole life the heart effect is the larger one. It is a likely finding,
          not a settled one, and a tendency, not a guarantee. Your blood pressure matters more than this DNA
          result.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of the version of this DNA region that goes with higher blood pressure, more heart
          disease and more autoimmune disease (about 2 in 10 people of European ancestry do). In large British and
          European studies each copy went with parents living on average about three months less, though a large
          American study saw a much smaller effect. The same version goes with slightly more protection against
          some cancers, but over a whole life the heart effect is the larger one. It is a likely finding, not a
          settled one, and a tendency, not destiny. Your blood pressure matters more than this DNA result.
