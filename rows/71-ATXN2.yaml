variants:
  - rsid: rs11065979
    gene: ""
    phenotype: Blood pressure, heart and autoimmunity
    trait_efo_id: EFO_0007796
    effect_allele: C
    effect_size: 0.2798
    effect_measure: beta
    stat_significance: significant
    direction: protective
    negatives: >-
      The longer-life version, C, goes with less type 1 diabetes and autoimmune disease and with less protection
      against some cancers other than lung cancer; across whole lives its effect on lifespan is still positive.
    genotypes:
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of each of the two common versions of this DNA region, the most common combination
          (about half of people of European ancestry have it). It is the reference the other combinations are
          compared with, so it neither raises nor lowers your expected lifespan here. The region, around the SH2B3
          and ATXN2 genes, affects blood cells, blood pressure and the immune system. The finding comes from people of
          European ancestry; outside Europe one of the versions is rare and this result says little.
      - genotype: C/C
        state: protective
        conclusion: >-
          You carry two copies of the version of this DNA region that goes with a longer life (about 3 in 10
          people of European ancestry do). The region, around the SH2B3 and ATXN2 genes, is linked to heart and blood vessel
          disease, blood pressure and the immune system, and this version goes with less type 1 diabetes and
          autoimmune disease. In large British and European studies each copy went with parents living on average
          nearly two months longer, though a large American study did not confirm it. The same version goes with
          less protection against some cancers, but over a whole life its effect on lifespan is still a gain. It
          is a likely finding, not a settled one, and a tendency, not a guarantee. Your blood pressure matters
          more than this DNA result.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of the version of this DNA region that goes with a shorter life (about 2 in 10
          people of European ancestry do). The region, around the SH2B3 and ATXN2 genes, is linked to heart and blood vessel
          disease, blood pressure and the immune system, and this version goes with more type 1 diabetes and
          autoimmune disease. In large British and European studies each copy went with parents living on average
          nearly two months less, though a large American study did not confirm it. The same version goes with
          more protection against some cancers, but over a whole life its effect on lifespan is still a loss. It
          is a likely finding, not a settled one, and a tendency, not destiny. Your blood pressure matters more
          than this DNA result.
