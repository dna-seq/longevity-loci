# The seed list's locus 71, ATXN2 (12q24.12, the ATXN2/BRAP/SH2B3 block; SH2B3's missense rs3184504, R262W, in LD
# with the lead). Curated 2026-11-10, the pilot's fourth row. Lead rs11065979 (Timmers 2019); rs7137828 (Pilling
# 2017) and rs10774625 (Wright 2019) sit in its credible set and appear only as proxies on their studies.
locus_id: 71
locus_name: ATXN2
verdict: kept
verdict_reason: >-
  Tier B, down from the seed's A. Genome-wide significant for parental lifespan (Timmers 2019, P 1.0e-12; Pilling
  2017, P 3.4e-14) and confirmed in Joshi 2017's candidate look-up, all of them UK Biobank and LifeGen. Outside them
  the replication is weak: in AncestryDNA's fathers, the one large sample outside UK Biobank, the effect has the
  same sign but is about a quarter of the UK one and not significant (Wright 2019, P 0.10), with heterogeneity
  between the two arms (P 2.6e-3, its supplement) and nothing at all in mothers; Deelen 2019's percentiles are
  nominal only (P 0.027 at the 90th, 0.023 at the 99th, its supplement; named among the nominal loci in its text).
  §4.1's tier B "replication with a much smaller effect" fits better than A's "no red-flag heterogeneity". A
  trade-off: the lifespan-raising allele goes with less autoimmune and cardiovascular disease and with less
  protection against non-lung cancers (Timmers 2019); on lifespan the cardiovascular side wins, so the net
  direction is resolved. The lifespan-lowering haplotype is almost absent outside Europe.
