# The seed list's locus 108, POM121C (7q11.23). Curated 2026-11-14. Lead rs113160991, the seed's only rsID (Timmers
# 2019's integrated-analysis locus): an intron of POM121C, GRCh38 7:75,465,064 A/G (A the reference), GRCh37 7:75,094,329, G
# the common allele (0.78 in non-Finnish Europeans) and the longer-lived. Open Targets 26.09 holds it in 103 credible sets, none
# lifespan-class; the GWAS Catalog (2026-10-29) holds nothing at it and six associations at its CEU proxy rs6944634 (r² 1.00).
locus_id: 108
locus_name: POM121C
verdict: kept
verdict_reason: >-
  Tier B, the seed's; row 101's shape, on Timmers 2019's own genome-wide call (D28.7): its integrated scan, with BMI
  and insulin as priors, gives a Bayes-factor permutation P of 7.5e-9 under its 2.5e-8 (conventional P 2.8e-7, G +0.25
  years per copy in self, "--" in UK Biobank and LifeGen); never A. The window's strongest line, rs62477737 68 kb away
  (P 1.4e-7), is the same signal (r² 0.93). No independent replication and no flag: Timmers' own Figure 4 look-up at
  rs6944634 (r² 1.00 in CEU) leans the same way, flat (one-sided 0.18; power 0.74, heterogeneity P 0.21); Deelen 2019's 90th
  percentile G's way, flat (one-sided 0.28), the 99th flat, a flag under APOE's factor only (at the 99th's factor 6.22,
  D31.4: power 0.99, heterogeneity P 0.0016; the mean factor's power 0.49), so none (D25.3); FinnGen R11's death endpoint leans against G (P
  0.48, one-sided 0.24), at one-sided power 0.79 and heterogeneity P 0.0044: a database line, which states its test
  and sets no D (D30.12); under D21's line (power 0.8) it is no flag either. Wright 2019's AncestryDNA has no line at the lead or any of its 39 CEU variants at r² 0.5 or more;
  within 500 kb Table 8 holds rs1179625 (161 kb, unable to tag it, r² at most 0.35 by frequency, Timmers flat there)
  and Table 9 rs10247961 (215 kb, named, not counted, D29.18), so AncestryDNA is untested. Foote 2025's frailty
  deposits hold neither the lead nor a proxy at r² 0.8; at rs55923716 (r² 0.61 in CEU, D′ 1.00) G is less frail on three
  factors (metabolic P 1.8e-5, unhealthy lifestyle 4.9e-4, multimorbidity 0.0010), which fills the healthspan cell at
  that proxy, its r² named (D31.4). Rosoff 2023's mvAge tables hold neither. The rsID literature search (Europe PMC, OpenAlex, PubMed, Crossref, preprints; Semantic Scholar
  answered 429, its part unchecked) finds Timmers and a review citing it, no other lifespan study. Within UK Biobank
  the rest agrees, co-occurring, not independent: Pilling 2017's parents' attained age G longer (P 3.3e-4; mothers
  1.8e-5, fathers 0.052) and both parents in the top 10 % (G raising the chance, P 1.5e-4); Park 2025's own survival G
  with fewer deaths (P 0.072, its allele columns swapped). Lifespan + (the discovery, Pilling), exceptional survival +
  (Pilling's top 10 %, one-sided for G, D26.2; Deelen flat, not against), healthspan + (Foote's metabolic factor at rs55923716, r² 0.61, P 1.8e-5, D31.4; Zenin G's way, flat, P 0.70).
  Mechanism ageing in general (D25.7, as row 101 beside its education prior; nothing shows the effect runs
  through weight): the scan's own priors were BMI and insulin, and at the proxy rs6944634 the longer-lived C (with
  the lead's G) lowers body mass index (P 8e-25), heart failure (P 9e-12) and serum urate (P 3e-12); in FinnGen R12's disease sets that hold the lead,
  at small posteriors, the lead's own lines have G with less hypertension, atrial fibrillation and knee arthrosis (P
  5e-5 to 1e-7, none genome-wide). POM121C is named
  in prose; a fasting-insulin study names it a candidate for adipogenesis at a nearby SNP, rs1167800, which is not this
  signal (r² 0.09). Protection is the absence of risk: the common G is heart failure's non-risk allele, genome-wide at
  a perfect proxy (D30.6). Descriptive: the proxy's BMI effect is small (0.02 SD per allele) and no source shows the lifespan effect
  runs through weight (row 12's reading, not row 4's). Causal C4 and effector E4, no gene named: no lifespan-class set
  holds it (D17.2); locus-to-gene names POM121C in one knee arthrosis set. Age of action unknown: Timmers' bands show A raising the hazard from 50 to 90 in both sexes and turning over at
  90 to 120, flat there (a flipped band, read as at row 101); the age moderator is null (P 0.33). The sex interaction (P 0.034, Q
  0.62) does not survive correction; Pilling's mothers carry more of it. The evidence is European.
