variants:
  - rsid: rs113160991
    gene: ""
    phenotype: POM121C region, parental lifespan
    trait_efo_id: EFO_0007796
    effect_allele: G
    effect_size: 0.2541
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 61 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome 7,
          lies in the POM121C gene; which gene matters here is not known.
      - genotype: A/G
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 34 in 100 people of European
          ancestry do). In a study of about a million parents' lives, parents of people with it lived a little
          shorter lives; scaled to a person's own life that is about a quarter of a year per copy. The same version
          goes with slightly higher body weight and heart failure. The finding leaned on links to body weight and
          insulin to reach significance and has not been confirmed in a separate study: a likely finding, not a
          settled one, and a tendency, not destiny.
      - genotype: A/A
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 5 in 100 people of European
          ancestry do). In a study of about a million parents' lives, each copy went with parents living a little
          shorter lives, about a quarter of a year per copy scaled to a person's own life. The same version goes with
          slightly higher body weight and heart failure. The finding has not been confirmed in a separate study: a
          likely finding, not a settled one, and a tendency, not destiny.
