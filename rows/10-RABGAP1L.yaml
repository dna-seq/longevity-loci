# The seed list's locus 10, RABGAP1L (1q25.1). Curated 2026-11-11, the ten-row run's tenth row. Lead rs10798302 (the
# seed's lead); the seed's second rsID, rs16847402 (727 kb away), is the same signal more weakly tagged (r² 0.53,
# D′ 0.99, its C with the lead's G; db-ensembl-116#q18, pmid-31484785#q30), named, not scored. Both come from Wright
# 2019's GWAS of AncestryDNA customers' own current age (Supplemental Table 8), not the parental-lifespan
# meta-analysis the seed names: neither is in Supplemental Table 9. Open Targets 26.09 has no lifespan set holding
# either; the GWAS Catalog (2026-10-29) holds one association for each, both that study's.
locus_id: 10
locus_name: RABGAP1L
verdict: re-tiered
verdict_reason: >-
  Tier C, from the seed's B. The only genome-wide result is Wright 2019's GWAS of the current age of 482,068
  AncestryDNA customers, a cross-sectional design that reads survival from who is still alive at older ages
  (VIABILITY_AF, which §4.5 admits as confirmation only, so it cannot carry A or B alone). There G, the minor allele
  (18 % in Europeans), is commoner among older customers: raw P 1.7e-8, the GWAS Catalog's "Longevity" record of 2e-8;
  after genomic control (λ 1.374, the largest of the paper's analyses) 1.5e-6, past the suggestive line only. The
  paper itself names only APOE and MAP2K6 from this analysis. The seed reads the study as a parental-lifespan
  meta-analysis with UK Biobank; it is not. In the same customers' fathers (born 1886-1940) G goes with longer life,
  nominally (P 7.5e-4), but those are the same people's genotypes, not a replication. The independent test is
  Timmers 2019's million parental lives: G on the same side, P 0.19, not significant. Healthspan is null (Zenin 2019,
  P 0.85). Exceptional survival is untested: no cached longevity case-control reports the lead or a proxy. C, not D:
  suggestive in a scoring class, nothing contradicts it, and nothing independent confirms it. The mechanism is
  unknown from any cached test; filed as general ageing. In Open Targets 26.09 the lead itself leads a credible set
  for blood IGF-1 levels in UK Biobank (P 1.7e-18) and sits in sets for white cell and neutrophil counts and
  hypothyroidism, with no allele or direction in the records: association with the variant, not a mediator.
  Causal confidence is C4 (no set of the seven lifespan, healthspan and longevity studies, nor of Wright's age study,
  holds either seed SNP); with no longevity set there is no locus-to-gene score, so no gene is named (§4.2), and the
  locus keeps the seed's label. The protection is a presence, the minor G. Age of action is unknown.
