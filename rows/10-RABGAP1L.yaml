# The seed list's locus 10, RABGAP1L (1q25.1). Curated 2026-11-11, the ten-row run's tenth row. Lead rs10798302 (the
# seed's lead); the seed's second rsID, rs16847402 (727 kb away), is the same signal more weakly tagged (r² 0.53,
# D′ 0.99, its C with the lead's G; db-ensembl-116#q18, pmid-31484785#q30), named, not scored. Both come from Wright
# 2019's GWAS of AncestryDNA customers' own current age (Supplemental Table 8), not the parental-lifespan
# meta-analysis the seed names: neither is in Supplemental Table 9. Open Targets 26.09 has no lifespan set holding
# either; the GWAS Catalog (2026-10-29) holds one association for each, both that study's. A third age-GWAS SNP, rs12088073
# (1:174,497,642, C, raw P 4.6e-8, genomic control 3.1e-6; pmid-31484785#q42), is named, not scored.
locus_id: 10
locus_name: RABGAP1L
verdict: re-tiered
verdict_reason: >-
  Tier C, from the seed's B. The region's strongest result is Wright 2019's GWAS of the current age of 482,068
  AncestryDNA customers, a cross-sectional design that reads survival from who is still alive at older ages
  (VIABILITY_AF, which §4.5 admits as confirmation only, so it cannot carry A or B alone). There G, the minor allele
  (18 % in Europeans), is commoner among older customers, and it is suggestive, not genome-wide, at the P the paper
  uses for its own significance call (D17.3): genomic control (λ 1.374) gives 1.5e-6, against the paper's
  Bonferroni line of 9.3e-8; uncorrected it is 1.7e-8, the GWAS Catalog's "Longevity" record of 2e-8. The paper
  names only APOE and MAP2K6 from this analysis. The region holds two more SNPs below 5e-8 only uncorrected:
  rs16847402 (727 kb away, r² 0.53 to the lead, its C with G; raw 1.6e-8, genomic control 1.4e-6) and rs12088073
  (1:174,497,642, C; raw 4.6e-8, genomic control 3.1e-6). The seed reads the study as a parental-lifespan
  meta-analysis with UK Biobank; it is not. In the same customers' fathers (born 1886-1940) G goes with longer life,
  nominally (genomic control P 0.0019), but those are the same people's genotypes, not a replication. Timmers 2019's
  million parental lives give G on the same side, P 0.19, not significant. At the oldest ages Deelen 2019's summary
  statistics lean the same way: the lead is not significant (G on the long-lived side, P 0.49 at the 90th
  percentile, 0.071 at the 99th), and the proxy rs16847402 is nominal at both (C on the long-lived side, P 0.026
  and 0.023). That is the only support outside the age GWAS, and it is weak: nominal, at a proxy that tags the lead
  at r² 0.53, with no genome-wide scoring-class anchor, so it does not lift the row to B, and exceptional survival is filed 0 on the lead's own null. Healthspan is null (Zenin
  2019, P 0.85). C, not D: suggestive in a confirmation class, with nominal support at the oldest ages and nothing
  contradicting it. The mechanism is unknown from any cached test; filed as general ageing. In Open Targets 26.09
  the lead itself leads a credible set for blood IGF-1 levels in UK Biobank (P 1.7e-18) and sits in sets for white
  cell and neutrophil counts and hypothyroidism, with no allele or direction in the records: association with the
  variant, not a mediator. It also sits in expression sets of ENSG00000152061, which is RABGAP1L itself; with no
  colocalisation read, that is not E2. Causal confidence is C4 (no set of the seven lifespan, healthspan and
  longevity studies, nor of Wright's age study, holds either seed SNP); with no longevity set there is no
  locus-to-gene score, so effector E4 and no gene named (§4.2), and the locus keeps the seed's label. The protection
  is a presence, the minor G. Age of action is unknown.
