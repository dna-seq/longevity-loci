variants:
  - rsid: rs10798302
    gene: ""
    phenotype: RABGAP1L region, survival to older age
    trait_efo_id: OBA_VT0005372
    effect_allele: G
    effect_size: 0.01511
    effect_measure: beta
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 67 in 100). It is the reference the other combinations are compared with. The region, on
          chromosome 1, holds the RABGAP1L gene among others; which gene matters is not known. The finding comes
          from people of European ancestry; less is known elsewhere.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 30 in 100 people of European
          ancestry do). In one large study of genealogy-site customers, this version was a little more common among
          older people. This is early evidence: a much larger study of parents'
          lifespans did not clearly confirm it. The region is also linked to blood levels of IGF-1, a growth
          hormone signal. The effect, if real, is small: a tendency, not destiny.
      - genotype: G/G
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 3 in 100 people of European
          ancestry do). In one large study of genealogy-site customers, each copy was a little more common among
          older people. This is early evidence: a much larger study of parents'
          lifespans did not clearly confirm it. The region is also linked to blood levels of IGF-1, a growth
          hormone signal. The effect, if real, is small: a tendency, not destiny.
