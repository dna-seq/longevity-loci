# The seed list's locus 43, FOXO3 (6q21). Curated 2026-11-11. Lead rs2802292, the seed's only rsID: the
# candidate-gene longevity SNP of Willcox 2008 and its replications, intronic in FOXO3, GRCh38 6:108,587,315
# (GRCh37 108,908,518), G ancestral and the longer-life allele, 0.39 in Europeans and 0.32 in East Asians. Timmers
# 2020's multivariate FOXO3 locus is led by rs1159806 (r² 0.40, D′ 0.68), whose life-extending T travels with G.
# Wright 2019's AncestryDNA table holds rs6911407 (r² 0.98, its A with G). Flachsbart's rs3800231 (r² 0.60) is read in
# Timmers 2019's Figure 2 source data, named in prose. Open Targets 26.09 puts the lead in 214 credible sets, none of
# a lifespan-class study; the GWAS Catalog (2026-10-29) holds one association for it, platelet distribution width.
# Literature searches on the rsID and the founding papers return the candidate-gene line (five services answered;
# Semantic Scholar was rate-limited, so its part is unchecked).
locus_id: 43
locus_name: FOXO3
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it. The genome-wide result at the locus is Timmers 2020's multivariate one, and a
  multivariate result does not meet tier A's first criterion (D18.3), so the shape is row 27's, now with an
  independent replication. That test of healthspan, parental lifespan and 90th-percentile longevity gives P 1e-8 at
  rs1159806, its T (0.35) on the longer-lived side in all three columns (healthspan P 5e-3, lifespan 2e-4, longevity
  3e-6). The authors say no input is genome-wide alone, and that FOXO3 had until then been found only in
  candidate-gene studies, never at genome-wide significance. The seed's rs2802292 is a tag of that signal (r² 0.40),
  outside its credible set, which is §4.1's B clause too. Its G travels with rs1159806's T: at these frequencies
  opposite coupling would cap r² at about 0.34 (derived). That study sits in `studies` at an r² 0.40 proxy, where
  rows 41 and 42 kept weaker tags out, because rs1159806 is the locus's own genome-wide lead, which Timmers ties to
  rs2802292, and the tag clause is what the row is tiered on. The variant's effect size is Timmers 2019's at the lead
  (nominal); its significance is the multivariate test's: the two are split. Timmers 2019's million parents' lives are
  the co-occurring lifespan study (D16): G lengthens life at P 1.9e-4 at the lead itself, UK Biobank and LifeGen on
  the same side; an input of the multivariate test, not a replication. The independent replication is Wright 2019's
  AncestryDNA parents, who share no one with UK Biobank or LifeGen: at rs6911407 (r² 0.98, its A with G) A
  lengthens both parents' lives, β +0.0096, P 1.1e-4 after Wright's genomic control (one-sided about 5e-5, derived),
  the same allele and direction. It does not lift the tier, as the anchor is still multivariate (D18.3). Broer 2015's
  P 1.85e-10 for rs2802292 (G, OR 1.17) is not a genome-wide GWAS result: it is a candidate look-up pooled with the
  published candidate-gene samples (10,574 cases against the GWAS's 6,036), so it holds the discovery and its
  replications together, and Broer reports no new genome-wide association. It is a candidate meta-analysis, not a
  genome-wide discovery (Timmers 2020: never genome-wide in a scan), so it does not anchor A (D26.6). Deelen 2019 favours G at the
  90th percentile (OR 1.08, P 6.8e-5) and more at the 99th (OR 1.13, P 8.3e-5), but its 90th is the multivariate
  test's longevity input, and it shares many cohorts with Broer's CHARGE in its own words. The candidate-gene line
  runs from Willcox 2008 (men of Japanese ancestry in Honolulu, minor homozygotes against major, OR 2.75, P 9e-5)
  through Flachsbart 2009 (German centenarians, stronger in centenarians than nonagenarians); Timmers 2019's Figure 2
  replicates Flachsbart's rs3800231 (r² 0.60, its A with G) in the full sample at one-sided P 2.2e-5, with about a
  third of the discovery's effect, the "smaller effect sizes" Timmers notes for FOXO3. Those are candidate-gene
  results and the Figure 2 sample holds the multivariate test's inputs, so none is counted. FinnGen's death endpoint
  leans G's way and is flat (T β +0.0069, P 0.36); under APOE's factor its power is about 0.62, heterogeneity P
  0.36, so no red flag. Healthspan is 0, because the evidence is mixed (D26.6): at the lead G leans to a later end of healthspan in Zenin 2019
  (P 0.060, one-sided 0.030, D26.2), and Timmers 2020's healthspan column at rs1159806 gives P
  5e-3, both inputs of the same test; but Foote 2025's frailty factor 5 ("Poorer Cognition", P 4.3e-10) puts G's side
  on the frailer side (its set's lead rs6911407, r² 0.98; the sign Open Targets' harmonisation, the catalog printing no
  allele). Foote's factor is healthspan-class (D25.8) and genome-wide, so a + would tell a reader the opposite of it. Lifespan +, exceptional
  survival + (Deelen, above). Mechanism: ageing in general, because nothing shows the effect runs through one system.
  The lead sits in sets for body mass and weight, cognition and education, kidney function and menarche (Open
  Targets); rs6911407's A goes with lower fluid intelligence (P 7e-14), and Timmers 2020 says the protective variants
  go with less metabolic syndrome but lower cognitive ability, later menarche and smaller intracranial volume: broad.
  Timmers 2020 also finds them with more macular degeneration, a quoted harm on the life-extending side (D18.1), so the
  row carries `tradeoff` and is descriptive; that finding is at rs1159806's allele, and no credible set of either SNP
  is for macular degeneration. Abdi 2026, the seed's source, finds G carriers with angina died less often in older
  Australian men, with no difference in hypertension or diabetes: a subgroup result, context only. Causal confidence
  C4: the lead is in no lifespan-class set, and Foote's frailty set (lead PIP 0.065) is healthspan-class, so it sets
  nothing (D23, D25.5). Effector E3: Timmers 2020's colocalisation puts two cis genes on the multivariate signal,
  FOXO3 and LINC00222 (each meets E2's colocalisation on its own, D24), and FOXO3's locus-to-gene score on the set is
  0.42, under 0.5; the tissue counts behind Timmers' line and the set's Open Targets colocalisations are not read. The
  life-extending allele goes with lower FOXO3 expression in blood there, so the row does not say G raises FOXO3.
  `gene` is empty. G/T, the most common genotype in Europeans (G 0.388 in gnomAD's non-Finnish Europeans: T/T about
  37 in 100, G/T 47, G/G 15), is the reference, with no PROTECT token, the split too even (as at 21, 24 and 27). Age
  of action is unknown. Joshi 2017 sees a larger effect after 75 and Deelen's 99th exceeds its 90th, but Timmers
  2019's age moderator is flat (P 0.64), and Timmers 2020's fading with parental age is collective across nine loci.
  No sex dimorphism (Timmers 2020). The counted evidence is European, so `eur_only_evidence`; the candidate-gene
  discovery is in men of Japanese ancestry, where G is the minor allele too (0.32), and is not counted.
