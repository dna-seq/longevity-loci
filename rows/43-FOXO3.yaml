variants:
  - rsid: rs2802292
    gene: ""
    phenotype: FOXO3 region, ageing
    trait_efo_id: EFO_0007796
    effect_allele: G
    effect_size: 0.0148
    effect_measure: beta
    stat_significance: significant
    direction: protective
    negatives: >-
      The longer-life version, G, goes with slightly lower fluid intelligence at a marker that travels with it, and
      a nearby marker on the same side is tied by Timmers 2020 to more age-related macular degeneration, lower
      cognitive ability and smaller intracranial volume. How these weigh against the longer life is not measured.
    genotypes:
      - genotype: G/G
        state: protective
        conclusion: >-
          You carry two copies of a version of this DNA region that about 15 in 100 people of European ancestry
          carry twice. The region, on chromosome 6, lies within the FOXO3 gene, long studied in research on ageing;
          it is not settled which gene the effect runs through. In very large European studies that combined
          healthspan, long life and reaching very old age, each copy of this version leaned to the better side,
          parents of carriers lived a little longer, and carriers were a little more likely to reach the oldest
          ages. Studies of the years lived in good health alone disagree with each other. The same region has been linked to longer life in older men of Japanese ancestry and in German
          centenarians, and it was seen again in a separate group of people. It is a likely finding, not a settled
          one. A nearby marker on the same side has been tied to more age-related macular degeneration, an eye
          disease, and to slightly lower scores on thinking tests. The effect is small and it is a tendency, not
          destiny.
      - genotype: G/T
        state: neutral
        conclusion: >-
          You carry one copy each of the two common versions of this DNA region, the most common combination (about
          47 in 100 people of European ancestry). It is the reference the other combinations are compared with. The
          region, on chromosome 6, lies within the FOXO3 gene, long studied in research on ageing; it is not settled
          which gene the effect runs through.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of the more common version of this DNA region (about 37 in 100 people of European
          ancestry carry it twice). In very large European studies that combined healthspan, long life and reaching
          very old age, each copy of this version leaned to the worse side, and parents of carriers lived a little
          less long; studies of the years lived in good health alone disagree with each other. It is a likely finding, not a settled one. The effect is small and it is a
          tendency, not destiny.
