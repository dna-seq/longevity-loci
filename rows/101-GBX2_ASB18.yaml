# The seed list's locus 101, GBX2/ASB18 (2q37.2). Curated 2026-11-14. Lead rs10211471, the seed's only rsID (Timmers
# 2019's integrated-analysis SNP): intronic, between GBX2 and ASB18, GRCh38 2:236,173,211, GRCh37 2:237,081,854, C/T, C
# ancestral, 0.80 in non-Finnish Europeans and the longer-lived allele.
locus_id: 101
locus_name: GBX2/ASB18
verdict: kept
verdict_reason: >-
  Tier B, the seed's, on Timmers 2019's own genome-wide call (D28.7), row 59's shape. Timmers' integrated scan, whose
  prior here is educational attainment, calls the locus genome-wide at a Bayes-factor permutation P of 2.3e-8, under
  its 2.5e-8, and reports it genome-wide for the first time; the conventional P in its million parental lives is
  1.1e-6 (C +0.24 years per copy, UK Biobank and LifeGen on the same side). So a genome-wide locus by the paper's call,
  never A, part of the call's evidence being the education GWAS behind the prior. Outside UK Biobank and LifeGen,
  Wright 2019's AncestryDNA fathers born 1886-1918 lean the discovery's way at rs6753712 (r² 0.84 in CEU, its G with
  the lead's T, G shorter-lived, P 0.0019 after genomic control, one-sided about 0.001; Supplemental Table 8, which
  lists only lines under P 0.003, so selected on its own P): counted as an independent replication, as row 40 counted
  its Table 8 line, and the tier stays B by D28.7 either way; whether a Table 8 line counts is put to the lead. Nothing
  powered contradicts it: Timmers' own Figure 4 look-up in the earlier longevity sample, at rs6757542
  (r² 0.83), is flat (one-sided 0.44, Alpha 0.08); Deelen 2019 leans C's way (90th one-sided 0.16, 99th 0.10), a flag
  under APOE's factor at the 90th only (power 1.00, heterogeneity P 0.0073; the 99th power 0.92, P 0.14; the mean
  factor power 0.63), so none
  (D25.3); FinnGen R11's death endpoint leans C's way (one-sided 0.10; power 0.87, heterogeneity P 0.19), no flag, a
  database line. Wright's other fathers' line nearby, rs6752442 (r² 0.54), leans the same way, named. Pilling 2017's
  deposits returned no line at the lead or in the window, unread rather than absent. The GWAS Catalog holds no
  association for the lead; Rosoff 2023's tables hold no line; the rsID literature search (all six sources answered)
  finds Timmers 2019 alone. Within UK Biobank,
  Park 2025's own survival co-occurs (C fewer deaths, P 0.011, its allele columns swapped). Lifespan + (Timmers);
  healthspan 0 (Zenin 2019 C's way, P 0.37; Foote 2025's general frailty factor C less frail, P 0.035, and four of
  six factors its way, none genome-wide: a multivariate factor fills the healthspan cell only when genome-wide beside a
  co-occurring lifespan study, as at 91 and 99, D16); exceptional survival 0 (Deelen and Figure 4 flat).
  Foote at the lead is read (D27.3's GBX2/ASB18 check): every deposit holds the line, none genome-wide. Mechanism
  general ageing: the lead's only other sets are educational attainment and its kin (C with more schooling, posterior
  0.01 to 0.22) and smoking initiation, none colocalising with a lifespan set here, and education is a prior, not a
  shown route (D17.7). Pleiotropy mech:education, as rows 29 and 95 carry their routes beside general ageing;
  descriptive. Causal C4 and effector E4, no gene named: no lifespan-class
  credible set holds the lead; GBX2 and ASB18 are named in prose. C/C, about 65 in 100 Europeans, is the reference
  (§6.2); C/T and T/T risk. No PROTECT token: no disease is known at the locus (D30.6). Age of action unknown: Timmers' age
  moderator at the lead is null (P 0.85; Figure 5 source data), but the fathers' 40-50 band prints the other sign and
  the mothers' bands are unread, so not lifelong (as 67 and 51). The evidence is European.
