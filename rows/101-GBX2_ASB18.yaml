variants:
  - rsid: rs10211471
    gene: ""
    phenotype: GBX2/ASB18 region, parental lifespan
    trait_efo_id: EFO_0007796
    effect_allele: C
    effect_size: 0.2401
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 65 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome 2,
          lies between the GBX2 and ASB18 genes; which gene matters, if either, is not known.
      - genotype: C/T
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 31 in 100 people of European
          ancestry do). In a study of about a million parents' lives, parents of people with it lived a little
          shorter lives, about a quarter of a year per copy. The finding leaned on links to education to reach
          significance and no separate study has confirmed it: a likely finding, not a settled one.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 4 in 100 people of European
          ancestry do). In a study of about a million parents' lives, each copy went with parents living about a
          quarter of a year less. The finding leaned on links to education to reach significance and no separate
          study has confirmed it: a likely finding, not a settled one.
