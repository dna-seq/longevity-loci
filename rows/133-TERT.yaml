# The seed list's locus 133, TERT (5p15.33): a marker of biological ageing (D32, D36.3), curated on D37.12 with 23
# TERC as the pattern. Curated 2026-11-16. Lead rs2853677, the seed's rsID (Li 2020's second conditionally independent
# TERT telomere-length signal): intronic in TERT's MANE transcript (a 3′ UTR variant on another), GRCh38 5:1,287,079,
# GRCh37 5:1,287,194, multi-allelic G/A/T, the row meaning A/G; A at 57.7 % in gnomAD's non-Finnish European genomes. A
# is the shorter-telomere allele. Row 30's rs2736100 is a partial tag (r² 0.47), row 153's rs7705526 another (r² 0.21).
locus_id: 133
locus_name: TERT
verdict: kept
verdict_reason: >-
  Tier A on the marker's own evidence (D37.12; the seed gives none): the tier grades the association with leukocyte
  telomere length, not longevity, and this row is unscored (D32). Codd 2021's 472,174 UK Biobank participants
  (Supplementary Table 1) print rs2853677 with A1 G at 0.424, β +0.055 SD (0.051 to 0.059), P 1.1e-160, N_imp
  464,716, Europeans the same, and its own credible set holds it at PP 1: A shorter. Li 2020's meta-analysis (78,592
  Europeans of ENGAGE, EPIC-CVD and EPIC-InterAct, no UK Biobank) prints it as its second, conditionally independent
  TERT signal, A (EA) at 0.59, β −0.064 SD (SE 0.006), P 3.35e-31: the same allele and side. D21's test: Li −0.064
  (SE 0.006) against Codd 2021 −0.055 (SE 0.0020), heterogeneity P 0.16, Codd's power at Li's effect 1.00: no red flag. Read as §4.1's A pair (D39.7), Codd 2021 is the anchor and Li 2020 its replication at 1.16 times its effect, so the smaller-effect clause does not fire.
  A study of 100k or more, genome-wide, replicated independently on the same allele: §4.1's A. The seed's other TERT
  loci are partial tags of it (30's rs2736100 r² 0.47, 153's rs7705526 0.21, CEU); Li and Codd 2021 hold 133 and 153 as
  separate conditional signals; 132's IEAA set holds it at PIP 0.31, named. Lifespan look-ups, unscored and read for A,
  two-sided at 0.05 (D38.6): Timmers 2019 A beta1 −0.0061 (SE 0.0040), P 0.13; Pilling 2017's parents P 0.12 to 0.86;
  Park 2025's own survival P 0.47 (men 0.12, women 0.48); Deelen 2019 90th P 0.72, 99th P 0.98; all flat. FinnGen R11's
  deaths have A with more deaths, β +0.0180 (SE 0.0077), P 0.019, a database line that fills a cell and lifts nothing
  (D29.1, D35.1). Zenin 2019's healthspan has A with the later end, −0.0233 (SE 0.0049), P 2.2e-6. Foote 2025's
  deposits hold no line (untested). The literature search (the rsID, 2026-11-16; Semantic Scholar answered 429, its
  part unchecked) finds telomere-length and cancer GWASs, no test of lifespan. Every genotype neutral, each conclusion
  a tendency of the marker with no colour (D32, D37.12); `direction: unknown`. Outcome cells read for A: exceptional
  survival 0 (Deelen flat); lifespan − (FinnGen two-sided 0.019, A with more deaths; Timmers the same way at 0.13);
  healthspan + (Zenin two-sided 2.2e-6, A the later end). Mechanism: markers of biological ageing. Pleiotropy
  `mech:cancer`: G, the longer-telomere allele, raises lung cancer (A OR 0.84, P 1e-75), renal cell carcinoma (A OR
  0.93, P 7e-12) and clonal haematopoiesis with DNMT3A mutation (A OR 0.76, P 1e-115), as at 30; no `tradeoff`, the row
  naming no longevity-favoured allele. Causal C1 (PIP 1.00 in the telomere-length set; PP 1 in Codd's). Effector E2,
  TERT: locus-to-gene 0.65 (CLPTM1L 0.05), the variant intronic in TERT. Descriptive. Age of action unknown. The
  evidence is European.
