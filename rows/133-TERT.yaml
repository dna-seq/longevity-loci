    direction: unknown
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the A version of this DNA position (about 33 in 100 people of European ancestry do).
          Large studies link each copy of A with slightly shorter telomeres in white blood cells, under a tenth of the
          usual spread between people per copy. That is a tendency in a marker whose reading only means something
          against your calendar age, which this report does not have, so it carries no score.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy each of the two versions of this DNA position, the most common combination (about 49 in
          100 people of European ancestry). It is the reference the other combinations are compared with. The position
          lies inside TERT, the gene for the enzyme that rebuilds telomeres, the protective caps at the ends of
          chromosomes. Telomere length is a marker whose reading only means something against your calendar age, which
          this report does not have, so this result carries no score.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the G version of this DNA position (about 18 in 100 people of European ancestry do).
          Large studies link each copy of G with slightly longer telomeres in white blood cells. That is a tendency in a
          marker whose reading only means something against your calendar age, which this report does not have, so it
          carries no score.
