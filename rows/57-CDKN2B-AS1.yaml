# The seed list's locus 57, CDKN2B-AS1 (9p21.3, ANRIL; the CDKN2A/CDKN2B tumour suppressors beside it). Curated
# 2026-11-10, the pilot's third row. Lead rs1556516 (Timmers 2019, Pilling 2017); rs1333042 (Wright 2019) and
# rs7859727 (Zenin 2019, Timmers 2020) sit in its credible set and appear only as proxies on their studies.
locus_id: 57
locus_name: CDKN2B-AS1
verdict: kept
verdict_reason: >-
  Tier A confirmed. Genome-wide significant for parental lifespan in about one million lives (Timmers 2019, P 7.5e-11)
  and for healthspan (Zenin 2019, P 7.4e-10, replicated in 96,313 other UK Biobank participants at P 1.5e-6);
  replicated outside UK Biobank and LifeGen in AncestryDNA's fathers at genome-wide significance (Wright 2019, P
  7.0e-15) and in Deelen 2019's survival to the 90th and 99th percentile, the only published lifespan locus besides
  FOXO3 to pass its Bonferroni threshold (P 6e-4 at the 90th in Timmers 2020's tabulation). A trade-off: the
  lifespan-raising allele protects against heart disease and goes with less protection against non-lung cancers
  (Timmers 2019); on lifespan the heart side wins, so the net direction is resolved and the states are not neutral.
  Age of action is read as lifelong: no significant age difference in Joshi 2017, and a larger effect at the 99th
  than the 90th percentile in Deelen 2019, though Timmers 2019 sees the hazard-ratio effect tend to decline after 60.
  Deelen's own CDKN2A/B discovery variant (rs7039467) is in none of the lead's credible sets and is not scored here.
  CDKN2B is named at E1 (requirements §4.2, §6.2): on all six lifespan-class sets the only cis-QTL colocalisation at
  H4 ≥ 0.8 is CDKN2B's (one TwinsUK adipose exon-expression QTL, H4 0.94 to 0.96), and CDKN2B tops locus-to-gene on
  each, passing 0.5 only on Pilling 2017's combined-parents set (0.53; Timmers 2019's 0.36, CDKN2A 0.21). E1 by the
  letter on one set, on a single tissue's QTL: a thin basis. Timmers 2020 names CDKN2B by SMR too.
  The seed's other rsIDs: rs1333042, rs7859727, rs6475609 (r² 0.93) and rs1333049 (the CAD tag, r² 0.83) are in the
  lead's set, the same signal; rs1063192 (a German candidate study) was not read.
