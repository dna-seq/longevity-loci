variants:
  - rsid: rs1556516
    gene: CDKN2B
    phenotype: 9p21 heart disease region
    trait_efo_id: EFO_0007796
    effect_allele: G
    effect_size: 0.2510
    effect_measure: beta
    stat_significance: significant
    direction: protective
    negatives: >-
      The longer-life version, G, goes with less coronary heart disease but with somewhat less protection against
      some cancers other than lung cancer; across whole lives the heart side outweighs it.
    genotypes:
      - genotype: C/G
        state: neutral
        conclusion: >-
          You carry one copy of each of the two common versions of this DNA region, the most common combination
          (about half of people of European ancestry have it). It is the reference the other combinations are
          compared with, so it neither raises nor lowers your expected lifespan here. The region, on chromosome 9,
          is the best-known genetic signal for coronary heart disease. The finding comes from people of European
          ancestry; less is known elsewhere.
      - genotype: G/G
        state: protective
        conclusion: >-
          You carry two copies of the version of this DNA region that goes with less coronary heart disease (about
          1 in 4 people of European ancestry do). In very large studies each copy went with parents living on
          average about a month and a half longer, and with better odds of reaching very old age. The same version goes
          with slightly less protection against some cancers, but over a whole life the heart effect is the
          larger one. The finding is well established; it is a tendency, not a guarantee. Your blood pressure,
          cholesterol and smoking matter more for your heart than this DNA result.
      - genotype: C/C
        state: risk
        conclusion: >-
          You carry two copies of the version of this DNA region that goes with more coronary heart disease (about
          1 in 4 people of European ancestry do). In very large studies each copy went with parents living on
          average about a month and a half less. The same version goes with slightly more protection against some
          cancers, but over a whole life the heart effect is the larger one. The finding is well established; it
          is a tendency, not destiny. Your blood pressure, cholesterol and smoking matter more for your heart than
          this DNA result.
