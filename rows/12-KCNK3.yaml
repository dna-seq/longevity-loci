# The seed list's locus 12, KCNK3 (2p23.3). Curated 2026-11-11, the second run's second row. Lead rs1275922 (Timmers
# 2019, Table 1), the seed's only rsID here. rs11126666 (Pilling 2017; Timmers' Figure 4 proxy) is the same signal,
# r² 0.99, and appears in prose only. Wright 2019's AncestryDNA mothers' rs2891519 (22 kb away) is not a tag (CEU r²
# 0.06); its fathers' rs11126491 and rs4513249 (S9) have no LD Ensembl returns: unknown, not read. Open Targets 26.09:
# Timmers 2019's and Rosoff 2023's credible sets, both led by rs1275922; the GWAS Catalog (2026-10-29) holds three
# associations for it, ten for rs11126666 and one for rs1731248.
locus_id: 12
locus_name: KCNK3
verdict: kept
verdict_reason: >-
  Tier A, up from the seed's B, on §4.1's letter. Genome-wide significant for parental lifespan in about one million
  lives (Timmers 2019, P 6.0e-9, past its own 2.5e-8 threshold; G, the common allele at 73 %, adding 0.26 years per
  copy, UK Biobank and LifeGen on the same side), a locus first found there; in UK Biobank alone it is only suggestive
  (Pilling 2017, rs11126666 at r² 0.99, P 4.5e-6). Independent replication, same allele: Deelen 2019's survival to the
  90th percentile in cohorts holding no UK Biobank data, OR 1.06 per G, P 0.013, and its text names KCNK3 first among
  the parental-lifespan loci with nominal support; heterogeneity there is moderate (I² 36 %, P 0.071), not a red flag.
  That replication is one look-up, and thin. Deelen's cohorts share the Rotterdam Study with LifeGen, a small part of
  its cases (by D19.1's read, 6.9 % of the 90th-percentile cases, with a cross-study covariance Timmers puts at about
  0.01; neither number is quoted here), which D19.1 counts as independent. Its 99th percentile leans the same way and passes only
  read one-sided (OR 1.07, two-sided P 0.089, one-sided 0.044, D25.13; power about 0.2 by D19.1's read). Timmers 2019's own look-up in earlier longevity
  studies, at rs11126666, is not nominal (P 0.16 one-sided, same side; power about 0.7 by D19.1's read), and it is not
  a second test: its sources, the CHARGE and Deelen 2014 meta-analyses, are mostly inside Deelen 2019's, which
  includes many CHARGE cohorts. Neither null is a powered failure. AncestryDNA gives nothing at the lead: Wright
  2019's nearest SNP, rs2891519 in the mothers (genomic-control P 1.5e-3), is not a tag (CEU r² 0.06), and its
  fathers' two SNPs in the window have no LD Ensembl returns. The later multivariate results reuse the same parents:
  Timmers 2020 (P 2e-8, no effect size) and Rosoff 2023's mvAge (P 3e-9 in the GWAS Catalog, a decrease per A, where a
  higher factor is healthier ageing by Rosoff's coding). Healthspan is 0: Zenin 2019's summary statistics give P 0.53
  at the lead, G leaning later. Exceptional survival is +, on the same single Deelen look-up the replication rests on.
  Mechanism: Timmers 2019 files the locus as cardiometabolic and reads it as pleiotropic, with moderate effects on
  several risk factors rather than one; at rs11126666, whose G pairs with the lead's G in Timmers' own proxy table, G
  lowers BMI and A raises it (four GWAS Catalog records), and A raises the use of calcium channel blockers (P 7e-31);
  at rs1731248 (r² 0.97 in Europeans, C with G by frequency), C lowers essential hypertension (OR 0.90, P 5e-9) in
  what its frequency marks as an East Asian sample; that C travels with G there too is inference, with no East Asian
  LD cached. Filed under heart and vessels, with body weight beside it: the lifespan-shortening A goes with more
  calcium-channel-blocker use, more hypertension and higher BMI, association on one haplotype, not a mediator test.
  Actionability is descriptive: the locus does not act mainly through weight (Timmers names several risk factors, and
  the strongest record is calcium-channel-blocker use, not BMI), so D18.2's weight label is not applied, and no
  measured blood-pressure effect is cached for §4.2's preventable label. The trade-off was looked for (D18.1) in the
  catalog's records at the lead, rs11126666 and rs1731248: no harm on the G side, none detected. Causal confidence C2:
  rs1275922 leads Timmers 2019's credible set (PICS) at PIP 0.31, with rs1731247, rs11126666 and rs1731248 at r² 0.97
  to 0.98 holding about 0.18 each, one signal whose causal variant is not resolved; mvAge's set has the same shape
  (0.32). Timmers 2019 counts KCNK3 among its most allelically heterogeneous loci (at least 25 independent variants),
  so a single SNP captures only part of the region. The effector is KCNK3, E1: locus-to-gene 0.85, and the only gene
  whose expression colocalises with the signal (five cis eQTL sets, H4 up to 0.996). The protection is the absence of
  the risk allele: A shortens life and G is the common one. Age of action is unknown: in Timmers 2019's Figure 5
  source data the effect keeps one sign from 60 to 90 in both parents (fathers 0.006, 0.015, 0.029; mothers 0.018,
  0.039, 0.022) and the age moderator is null (P 0.39), but fathers' 80-90 band sits above their 60-80 mean (z −1.09),
  short of the sweep's |z| below 1 for one size.
