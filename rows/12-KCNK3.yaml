variants:
  - rsid: rs1275922
    gene: KCNK3
    phenotype: KCNK3 region, blood pressure and weight
    trait_efo_id: EFO_0007796
    effect_allele: G
    effect_size: 0.2579
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 53 in 100). It is the reference the other combinations are compared with. The region, on
          chromosome 2, lies at the KCNK3 gene and is linked to blood pressure and body weight. The finding comes
          from people of European ancestry; less is known elsewhere.
      - genotype: A/G
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 40 in 100 people of European
          ancestry do). In very large British and European studies, people with this version tended to have parents
          who lived about a month and a half less. The same version goes with slightly more use of some heart and blood-pressure medicines
          and a slightly higher BMI. The finding is well
          established, though its confirmation in a separate group is a single, modest one; the effect is small and
          it is a tendency, not destiny.
      - genotype: A/A
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 7 in 100 people of European
          ancestry do). In very large British and European studies, each copy went with parents living about a
          month and a half less. The same version goes with slightly more use of some heart and blood-pressure medicines and a slightly higher
          BMI. The finding is well established, though its
          confirmation in a separate group is a single, modest one; the effect is small and it is a tendency, not
          destiny.
