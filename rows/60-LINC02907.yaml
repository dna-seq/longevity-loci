variants:
  - rsid: rs75824829
    gene: ""
    phenotype: 9q34.3 region, long-lived parents
    trait_efo_id: OBA_VT0005372
    effect_allele: A
    effect_size: 0.01326
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 92 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome 9,
          lies between genes, and which gene it might affect, if any, is not known. A link between this position and
          having a very long-lived parent was reported once, and the study's own authors doubted it.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 7 in 100 people of European
          ancestry do). One large British study reported it as more common in people with a parent who lived to 95
          or more, but the study's own authors thought the signal might be an artefact, no independent study has
          confirmed it, and a Finnish study leaned the other way. It says nothing about your own lifespan.
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of a less common version of this DNA position (fewer than 2 in 1,000 people of
          European ancestry do). One large British study reported this version as more common in people with a
          parent who lived to 95 or more, but the study's own authors thought the signal might be an artefact, no
          independent study has confirmed it, and a Finnish study leaned the other way. It says nothing about your
          own lifespan.
