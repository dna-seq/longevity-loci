# The seed list's locus 60, LINC02907 (9q34.3, the GWAS Catalog's mapped gene; Pilling names C9orf62, about 50 kb
# away). Curated 2026-11-12. Lead rs75824829, the seed's only rsID, an intergenic G/A at GRCh38 9:135,376,756 (GRCh37
# 138,268,602), 1.87 kb from the lncRNA ENSG00000296725; A is the minor and the ancestral allele, 0.042 in gnomAD's
# non-Finnish Europeans, 0.014 in Finns. Entered by track B from Pilling 2016's parental extreme-longevity scan
# (GCST003395), the paper's second hit beside row 47's AP5Z1. Deelen 2019's files hold neither the lead nor its best
# proxy rs113450114 (r² 0.49).
locus_id: 60
locus_name: LINC02907
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's B (D28.13, the lead's ruling): a hit its own authors call anomalous is an overfit source,
  as at 41, 44 and 48, and nothing independent stands for it. The curator's B on §4.1's letter, as row 47, was
  rejected: 47's authors call it suggestive, not anomalous, and Deelen replicates it. Pilling 2016 ran BOLT-LMM on 42,273 'white'
  British UK Biobank participants aged 55 to 70, 1,339 of them with a parent in the top 1 % of age at death. The
  minor A raised the chance of a long-lived parent by 0.0133 per copy (SE 0.0024, P 4.0e-8, INFO 0.87; the scan
  kept variants above INFO 0.4 and frequency 1 %), about 5.8 times APOE ε4's 0.0023 on the same phenotype. The
  authors doubt it themselves: it "may be anomalous as it is not in a “peak” of associations expected of robust
  results", read off their ±250 kb plot; no other variant of the table's top 1,000 lies within 1.17 Mb (derived),
  and its best 1000 Genomes proxy reaches only r² 0.49. A is out on size and on replication: 1,339 cases, and no independent
  study. Deelen 2019, the one independent extreme-survival look, has no line for the lead or its proxy. LifeGen's
  parental lifespan meta leans the same way (A beta1 +0.0155, P 0.18, one-sided 0.089), but its signs read "+-":
  the lean is UK Biobank's arm, Pilling's own people, and LifeGen's independent cohorts lean against, their size
  unprinted. FinnGen R11's death endpoint, independent, leans against: A log OR +0.044 for death (SE 0.030,
  P 0.14), A only 1.4 % in Finns. Pilling's APOE line (factor about 46 to LifeGen's scale) makes both look-ups red
  flags; the flag holds at any factor of 3.22 or more for LifeGen and 5.74 or more for FinnGen, but the mean factor
  (D25.3) is undefined for this phenotype, so whether they are red flags is unknown and the row carries no
  replication_failed (D26.3); the tier rests on the authors' own doubt, not on a flag. Zenin 2019's healthspan leans the same way, P 0.47. Lifespan 0,
  healthspan 0, exceptional survival 0: on a D row the discovery gives no `+` (D28.10). Age of action UNKNOWN: the top-1 % contrast is about how
  extreme the survival is, not when the allele acts. Open Targets holds no record of the variant (no credible set,
  no locus-to-gene), and an overfit source sets no level anyway (D28.12): causal C4 and effector E4, no gene named; the GWAS Catalog maps it to LINC02907 and records
  no other trait, so mechanism general ageing and no pleiotropy. The evidence is European; A is 0.052 in South
  Asians and 0.0014 in East Asians, untested there, so eur_only_evidence. Descriptive. Pilling's lean is the minor A's (a
  presence), but a D row carries no protection token.
