# The seed list's locus 127, CGAS (p.D452V) (6q13). Curated 2026-11-16. Lead rs200818241, the seed's only rsID (Putter
# 2025's long-lived families, a bioRxiv preprint): a CGAS missense on its MANE Select transcript (NM_138441.3), D452V,
# SIFT deleterious and PolyPhen probably damaging; GRCh38 6:73,425,441 T/A, GRCh37 6:74,135,164, A the rare allele
# (0.026 % in gnomAD's non-Finnish European genomes, 0.031 % in its exomes, absent in the Finnish genomes) and the
# preprint's longevity candidate. Open Targets 26.09 has no record of it; the GWAS Catalog (2026-10-29) holds no
# association.
locus_id: 127
locus_name: CGAS (p.D452V)
verdict: kept
verdict_reason: >-
  Tier D, the seed's: a candidate with no adequately powered test (§4.1's D), from a familial design the requirements
  hold as annotation only (FAMILIAL), in a preprint. Putter 2025 (bioRxiv; not peer-reviewed) ran affected sib-pair
  linkage in 212 Leiden Longevity Study sibships and found four regions at LOD 3 or more, 6q14.3 among them; under the
  peaks it kept rare (gnomAD NFE under 0.2 %), high-impact protein-altering variants shared by siblings and absent from
  100 Dutch controls, then dropped any more frequent in German controls than in German long-lived individuals: twelve
  variants in seven genes. rs200818241 is in two of the sibships. No association statistic is printed for it. The one
  look-up is the German long-lived cohort (1,265 aged 94 or over against 4,195 younger controls): A at a MAF of 3.95e-4
  against 1.19e-4, that is about one copy in 2,530 alleles against one in 8,390 (derived), which the text reads as more
  frequent in the long-lived (Fisher's exact about 0.4, derived); and that comparison was selected, since the authors
  dropped every variant richer in the controls than in the long-lived, so a long-lived excess was guaranteed by the
  filter and the comparison tests nothing. The German long-lived are the Kiel cohort behind Kolbe 2025's rows (D34.7);
  against gnomAD's exomes (0.031 %) one copy in 2,530 is about what is expected (0.8). The paper contradicts itself on
  the German cohort: the methods give 602 centenarians and controls of mean age 50.5, Table 3's legend 643
  centenarians and controls of mean age 68; and Table 3's MAF is over all 1,265 long-lived while the text speaks of
  centenarians (were the one copy in a centenarian, their MAF would be about 8.3e-4, derived); named. In human and mouse cells the variant lowers cGAS protein
  and the cGAS-STING pathway's activation, dampening inflammation and delaying senescence, a mechanism, not a test of
  survival. A is too rare for any deposit: Deelen 2019, Timmers 2019, Park 2025 (all three files), Pilling 2017, Zenin
  2019, Foote 2025 and FinnGen R11 were each looked up (2026-11-16, GRCh37 6:74,135,164) and hold no line: untested.
  §4.1's preprint clause caps a finding and never lifts one, so the seed's D is kept (D38.11). The literature search (the rsID, 2026-11-16) finds Putter
  alone. Every genotype neutral (D25.2). Exceptional survival untested: the one German comparison was selected by the authors' filter (D38.11);
  lifespan untested; healthspan untested. Mechanism general ageing (D25.7, D38.11; as 120, 124, 126): no lifespan effect is shown to run through a
  pathway; cGAS is the cytosolic DNA sensor of the cGAS-STING innate immune pathway, and the variant reduces its
  activation in cells, a cell assay, named. Causal C4 (no fine-mapping);
  effector E1 CGAS, a coding change on the MANE transcript (§4.2). Descriptive. Age of action unknown. The evidence is
  Dutch and German.
