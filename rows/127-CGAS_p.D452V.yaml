variants:
  - rsid: rs200818241
    gene: CGAS
    phenotype: CGAS D452V missense, familial longevity
    trait_efo_id: OBA_VT0005372
    effect_allele: A
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as nearly everyone does. It is the
          reference the other combinations are compared with. The position lies inside the CGAS gene on chromosome 6,
          which senses stray DNA inside cells and switches on an immune alarm.
      - genotype: A/T
        state: neutral
        conclusion: >-
          You carry one copy of a rare version of this DNA position that changes one building block of the CGAS
          protein (fewer than 1 in 1,000 people carry it). It was found in two Dutch families with many long-lived
          members, and in cells it dampens the immune alarm, but no study has tested whether carriers live longer, so it
          is not counted for or against lifespan.
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of a rare version of this DNA position, which is very unusual. Single copies were found
          in two long-lived Dutch families, but no study has tested whether carriers live longer, so nothing can be said
          about two copies.
