variants:
  - rsid: rs2736100
    gene: TERT
    phenotype: TERT intron, leukocyte telomere length
    trait_efo_id: OBA_0003784
    effect_allele: A
    effect_size: -0.078
    effect_measure: beta
    stat_significance: significant
    direction: unknown
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the C version of this DNA position (about 25 in 100 people of European ancestry do).
          It is the reference the other combinations are compared with. The position lies inside TERT, the gene for
          the enzyme that rebuilds telomeres, the protective caps at the ends of chromosomes. Telomere length is a
          marker of cellular ageing that only means something against your age, so this result carries no score.
      - genotype: A/C
        state: neutral
        conclusion: >-
          You carry one copy of the A version of this DNA position (about 50 in 100 people of European ancestry do).
          Large studies link each copy of A with slightly shorter telomeres in white blood cells, a little under a
          tenth of the usual spread between people. That is a small tendency in a marker, not a verdict on ageing:
          studies of lifespan and of healthy ageing point in different directions here, so it carries no score.
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the A version of this DNA position (about 25 in 100 people of European ancestry do).
          Large studies link each copy of A with slightly shorter telomeres in white blood cells, a little under a
          tenth of the usual spread between people per copy. That is a small tendency in a marker, not a verdict on
          ageing: studies of lifespan and of healthy ageing point in different directions here, so it carries no score.
