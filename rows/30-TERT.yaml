# The seed list's locus 30, TERT (5p15.33): a marker of biological ageing (D32, D36.3), curated on D37.12 with 23
# TERC as the pattern. Curated 2026-11-16. Lead rs2736100, the seed's rsID (the requirements' own example for the
# section): intronic in TERT's MANE transcript, GRCh38 5:1,286,401 C/A, GRCh37 5:1,286,516, A ancestral; A at 49.7 %
# in gnomAD's non-Finnish European genomes, 58.8 % in East Asians, 53.9 % in Africans. A is the shorter-telomere
# allele. The seed's other TERT loci (132, 133, 153) are separate signals with rows of their own (r² 0.21 to 0.49).
locus_id: 30
locus_name: TERT
verdict: kept
verdict_reason: >-
  Tier B, the seed's, on the marker's own evidence (D37.12): the tier grades the association with leukocyte telomere
  length, not longevity, and this row is unscored (D32). Codd 2013's genome-wide meta-analysis of mean leukocyte
  telomere length puts A with shorter telomeres, β −0.078 SD per A (SE 0.009), P 4.4e-19, in 25,842 Europeans of the
  ENGAGE cohorts; its replication lines cover only its suggestive variants, not TERT. The GWAS Catalog records Taub
  2022's TOPMed whole genomes (109,122, outside ENGAGE) at rs2736100 at P 5e-79, its allele unrecorded, so its side
  is not read and it is cited on the tier with no study entry (§6.3; 23's reading, the lead's Q2 (a) there); Liu 2014's
  line (C longer, P 4e-6) is sub-genome-wide. So §4.1's A, a study of 100k or more replicated on the same allele, is not
  met on what is read, and the row is B: genome-wide in one study. Lifespan look-ups, unscored and read for A: Timmers
  2019 A beta1 −0.0066 (SE 0.0039), P 0.088, one-sided 0.044 with shorter-lived parents; FinnGen R11's deaths have A
  with more deaths, β +0.0166 (SE 0.0074), P 0.025, one-sided 0.012, a database line that fills a cell and lifts
  nothing (D29.1, D35.1, D37.7); Pilling 2017's parents, inside Timmers' pool, C's way and flat (P 0.31 to 0.85); Park
  2025's own survival flat (P 0.40; men 0.50, women 0.57; its columns swapped); Deelen 2019 flat (90th A −0.022, P
  0.27; 99th −0.0065, P 0.83); Zenin 2019's healthspan has A with the lower hazard, P 0.0064; Foote 2025's deposits
  hold no line (untested). The literature search (the rsID with longevity or lifespan, 2026-11-16) finds a 2011
  candidate-gene abstract on TERT and longevity in Xinjiang Uygurs (no PMID or abstract to read) and studies of cancer,
  scarring and Alzheimer's disease, none a test of this variant on lifespan; the seed's GenAge mouse entry (Tert,
  lifespan increase) is named, not carried. Every genotype neutral, each conclusion a tendency of the marker with no
  colour (D32, D37.12); `direction: unknown`. Outcome cells read for A: exceptional survival 0 (Deelen flat); lifespan
  − (Timmers one-sided 0.044 against A, FinnGen's release line the same way); healthspan + (Zenin, P 0.0064 for A).
  Mechanism: markers of biological ageing; A also lowers intrinsic epigenetic age acceleration (McCartney 2021, P
  3e-11; Lin 2022's set holds it at PIP 0.76), another marker, named. Pleiotropy `mech:cancer` and `mech:lung`, on
  both alleles, as Codd notes: C, the longer-telomere allele, raises lung carcinoma (OR 1.27, P 1e-27), glioma (1.27,
  P 2e-12) and clonal haematopoiesis (1.22, P 3e-13); A, the shorter, raises testicular germ cell tumour (1.29, P
  8e-20), idiopathic pulmonary fibrosis (2.11, P 3e-8) and interstitial lung disease (1.37, P 2e-19); no `tradeoff`,
  since the row names no longevity-favoured allele. Causal C3: of the telomere-length credible sets in Open Targets
  26.09 only the naive T-cell one holds it, at PIP 0.036. Effector E2, TERT: locus-to-gene 0.74 on that set (and 0.87
  on the epigenetic set), the variant intronic in TERT. Descriptive. Age of action unknown. The evidence is European,
  with TOPMed's multi-ancestry line unread for its allele.
