# The seed list's locus 159, HLA-DQB1 (6p21.32, the HLA class II region). Curated 2026-11-16. Lead rs9275160, the seed's
# only rsID (Atkins 2021's frailty-index locus): between HLA-DQB1 and HLA-DQA2, 4.7 kb downstream of a lncRNA, GRCh38
# 6:32,684,843 G/A, GRCh37 6:32,652,620, A at 35.7 % in gnomAD's non-Finnish European genomes, A the frailer allele and G
# the healthier. A separate signal from row 103's rs1049053 (r² 0.20 in CEU). Open Targets 26.09 has no record of it;
# the GWAS Catalog (2026-10-29) holds five associations, all on A: Atkins' frailty, prostate cancer (twice) and
# complement C4 levels.
locus_id: 159
locus_name: HLA-DQB1
verdict: kept
verdict_reason: >-
  Tier C: a genome-wide healthspan locus with no co-occurring lifespan study at P < 0.05 (D16, D23; row 103's
  reading). Atkins 2021's frailty index in 164,610 UK Biobank participants aged 60 to 70 and 10,616 Swedish TwinGene
  participants puts A on the frailer side, +0.038 (SE 0.0035) per A on the quantile-normalised index, P 7.2e-28, past
  even the paper's stricter 1e-9 line, both cohorts the same way (heterogeneity P 0.03). A frailty index is
  healthspan-class (D23), which scores only beside a scoring-class lifespan study on the same allele and side at P <
  0.05 (D16). The lifespan looks all lean G's way and none printed reaches 0.05: Timmers 2019 A beta1 −0.0040 (SE
  0.0043), P 0.35; Pilling 2017's parents, inside Timmers' pool, G longer throughout (mothers P 0.058, one-sided
  0.029; both parents 0.36; fathers 0.52; top 10 % 0.20); Park 2025's own survival G with fewer deaths, P 0.21 (men
  0.39, women 0.35). FinnGen R11's deaths have A with more deaths, β +0.0173 (SE 0.0082), P 0.033, G's way, but a
  curator-read release line fills a cell and lifts no row (D29.1, D35.1). Zenin 2019's healthspan agrees (A the higher
  hazard, P 0.0017) in the same UK Biobank people, so it is no independent replication. Deelen 2019's 90th percentile,
  in a reduced set of cohorts here (effective N 6,328), leans A's way, +0.041 (SE 0.030), P 0.18, flat; its 99th file
  holds no line. Foote 2025's deposits hold no line (untested). The literature search (the rsID, 2026-11-16;
  Semantic Scholar answered 429, its part unchecked) finds Mendelian randomisation papers using Atkins' frailty
  instruments, none a test of this variant on lifespan. Genotypes: A/A the reference; G carriers protective, as weak early evidence.
  Exceptional survival 0 (Deelen flat); lifespan + (FinnGen, P 0.033, a release line filling the cell, D35.1; Timmers,
  Pilling and Park on the same side); healthspan + (Atkins, genome-wide). Mechanism immune and inflammation: the HLA
  class II region; A also raises complement C4 levels (Thareja, P 1e-19). Pleiotropy `mech:cancer`: A raises prostate
  cancer risk (Wang, OR 1.05, P 2e-16; Conti, P 9e-8), the same allele as frailty, so no trade-off. Causal C4 and
  effector E4: no Open Targets record, and the HLA region's long haplotypes make any gene call here ambiguous.
  Descriptive. Age of action unknown. The evidence is European.
