    direction: protective
    negatives: >-
      The other version, A, also comes with a slightly higher risk of prostate cancer in large studies.
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the less common version of this DNA position (about 13 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. The position lies in the
          immune-system gene region on chromosome 6, between HLA-DQB1 and HLA-DQA2.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of the more common G version of this DNA position (about 46 in 100 people of European
          ancestry do). A large UK study linked G with less frailty in people in their 60s, and studies of lifespan
          lean the same way without being clear. This is early evidence: a possible tendency, not destiny.
      - genotype: G/G
        state: protective
        conclusion: >-
          You carry two copies of the G version of this DNA position (about 41 in 100 people of European ancestry do).
          A large UK study linked each copy of G with slightly less frailty in people in their 60s; studies of lifespan
          lean the same way without being clear. This is early evidence: a possible tendency, not destiny.
