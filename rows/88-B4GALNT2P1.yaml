# The seed list's locus 88, B4GALNT2P1 (17q21.32; the seed's genes B4GALNT2P1 and IGF2BP1). Curated 2026-11-13. Lead
# rs940088, the seed's only rsID (Rosoff 2023's novel mvAge lead): intergenic between IGF2BP1 and B4GALNT2P1, GRCh38
# 17:49,068,486 T/C, GRCh37 17:47,145,848, C the minor allele (0.32 in non-Finnish Europeans, 0.05 in East Asians) and
# the healthier, longer-lived side. Open Targets 26.09 holds it in 66 credible sets and it tops none; the GWAS Catalog
# (2026-10-29) holds one association, Rosoff's.
locus_id: 88
locus_name: B4GALNT2P1
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: genome-wide only in a multivariate result, with a co-occurring lifespan study (D16,
  D18.3); row 52's shape. Rosoff 2023's mvAge is genome-wide at the lead, a novel locus: C (the minor allele) on the
  healthier side, T β −0.0063 (SE 0.0011), P 2.3e-8, heterogeneity across its inputs Q P 0.86 (Supplementary Tables 6
  and 7, Table 1). The inputs lean to C: Timmers 2019's million parents' lives, C longer, P 3.8e-5 ("--" for T in UK
  Biobank and LifeGen), the co-occurring lifespan study; nothing within 1 Mb in Timmers reaches 10⁻⁶, so no stronger
  lifespan line to condition on (D30.2). Zenin 2019's healthspan, C healthier, P 1.5e-4 (2.2e-4 after genomic
  control); frailty (reverse coded) P 0.0030, read in Rosoff's table only; Deelen, itself an input, flat on C's side.
  In UK Biobank the rest agrees: Pilling's parents C longer, P 0.0024 (inside Timmers); Park 2025's own survival C
  with fewer deaths, P 0.035 (its allele columns swapped, as the frequencies show), co-occurring. Outside it, Wright
  2019 has no line at the lead. Its Table 9 mothers hold rs9899580, 39 kb away and r² 0.98 (the lead's C rides with
  its longer-lived G on 68 of 69 C haplotypes in CEU), AncestryDNA arm P 0.0021, one-sided 0.0018 after genomic
  control on C's side; but with that arm at z = 0 the deflated meta is P 0.0059, above the table's 2.5e-3, so the line
  was selected by its own AncestryDNA arm and is named, not counted (D30.1). Table 8, filtered on AncestryDNA alone,
  holds rs11079849 (r² 0.65, its T with the lead's C), mothers, P 6.4e-4 after genomic control, the same way: a proxy
  at r² 0.65, named, not counted. FinnGen R11's death endpoint leans C's way, flat (one-sided 0.096); Deelen's 90th
  and 99th lean C's way, flat (one-sided 0.21, 0.26). The red flag is unknown (D29.11): D21 scales from the
  discovery's own effect, and mvAge's has no conversion to Deelen's or FinnGen's scales (scaled from Timmers' β
  instead, the 90th would flag under APOE's factor only, power 0.99, heterogeneity P 0.025; the mean factor power 0.49,
  P 0.45). Foote 2025's frailty factors lean C's way and are not genome-wide in the window read (multimorbidity T
  frailer, P 3.3e-6; cognition P 1.7e-6), multivariate, scoring nothing (D27.3). Healthspan + (Zenin, beside the
  co-occurring lifespan study, D16), lifespan + (Timmers), exceptional survival 0 (Deelen flat). Mechanism ageing in
  general (D25.7): the lead sits in 66 Open Targets credible sets and tops none (posterior at most 0.04), most of them
  adiposity and cardiometabolic. Phased in CEU against eight of their lead variants, the lead's C rides with the
  allele that lowers BMI (P 7.6e-21), type 2 diabetes (P 2.3e-9), HbA1c, coronary disease (P 2.8e-9), heart failure,
  ischaemic heart disease, peripheral vascular disease, C-reactive protein, blood pressure and insomnia, and raises
  intelligence and walking pace; the one set the other way, FinnGen's cardiovascular diseases (rs35929648, 143 kb
  away, r² about 0.05), is a separate signal, named. Nothing shows the lifespan effect runs through weight. Pleiotropy
  mech:adiposity, mech:diabetes, mech:cvd and broad, as row 29 reads a lead inside sets it does not top; no harm on
  C's side (D18.1), so no trade-off. Descriptive: D18.2's `modifiable` is for a locus acting through weight, and here
  the weight association is shown, the mediation is not; put to the lead. Causal C4 and effector E4, no gene named: no
  lifespan-class or mvAge credible set holds the lead in Open Targets, and Rosoff's own fine-mapping gives it SuSiE
  0.157 and FINEMAP 0.119 outside both credible sets; locus-to-gene names IGF2BP1 (0.48 to 0.72) in the adiposity and
  cardiometabolic sets, named in prose. T/T, about 46 in 100 Europeans, is the commonest genotype and the reference
  (§6.2); C/T and C/C protective, PROTECT:PRESENCE. Age of action unknown. The evidence is European.
