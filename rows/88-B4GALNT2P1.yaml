variants:
  - rsid: rs940088
    gene: ""
    phenotype: IGF2BP1 region, ageing, parents' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: C
    effect_size: 0.006339843
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 46 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome 17,
          lies between the IGF2BP1 gene and a gene copy that no longer works. The finding comes from people of
          European ancestry; less is known elsewhere.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 44 in 100 people of European
          ancestry do). In very large studies it went with slightly healthier ageing and parents living a little
          longer, and a separate study of mothers' lifespans pointed the same way. The same stretch of DNA goes with
          slightly lower body weight and less heart disease. It is a likely finding, not a settled one, and the effect
          is small: a tendency, not destiny.
      - genotype: C/C
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 10 in 100 people of European
          ancestry do). Each copy went with slightly healthier ageing and parents living a little longer in very
          large studies, and a separate study of mothers' lifespans pointed the same way. The same stretch of DNA
          goes with slightly lower body weight and less heart disease. It is a likely finding, not a settled one, and
          the effect is small: a tendency, not destiny.
