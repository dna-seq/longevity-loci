# The seed list's locus 64, BET1L (11p15.5). Curated 2026-11-12. Lead rs76612380, the seed's only rsID, a T/C 139 bp
# downstream of BET1L at 11:202,785 on both GRCh37 and GRCh38; C is ancestral and the minor allele: 0.09 in gnomAD's
# East Asians (0.10 in the discovery), 0.019 in its non-Finnish Europeans, 0.008 in Finns. Entered by track B from
# Akiyama 2023's survival GWAS of BioBank Japan (GCST90270909). Ensembl holds no 1000 Genomes genotypes for the lead, so
# its LD is unknown there; the paper's genotyped proxy rs2280543 (r² 0.98 in BBJ) is one haplotype with rs79902640,
# the BET1L eQTL's top variant (r² 1.00 in CEU and JPT). LifeGen holds the proxies but not the lead; Deelen, Park and
# FinnGen hold the lead; Zenin's healthspan file holds nothing in chromosome 11's first megabase (its lines start at
# 1.24 Mb, rs35705950), so healthspan is untested.
locus_id: 64
locus_name: BET1L
verdict: kept
verdict_reason: >-
  Tier B, the seed's, on §4.1: one genome-wide study, replicated only in another ancestry, at a proxy, and with a much
  smaller effect. The allele is the seed's reversed: T, the common allele, is the longer-lived, C the shorter. Akiyama
  2023 followed 137,693 Japanese patients of BioBank Japan for a mean 7.44 years (31,324 deaths), in a Cox model by sex
  adjusted for age, sex, ten components and each person's baseline diseases: rs76612380 HR 0.92 (0.89–0.95), P
  5.89e-9, alike in men and women (heterogeneity P 0.77). Table 1's footnote calls the HR the alternative allele's, C;
  the row reads it as T's, because the paper's main text quotes its APOE HRs per the reference allele (rs429358 0.95,
  rs7412 1.07, the reciprocals of Supplementary Data 2's ε4 C 1.05 and ε2 T 0.93, which print the effect allele), and
  because everything else in the paper reads the minor haplotype as the shorter-lived: the genotyped proxy rs2280543
  (r² 0.98; its minor T pairs with the lead's minor C, as an r² that high requires) has T homozygotes faring worse in
  both sexes, T 0.36 years younger at death, and T's shorter parental lifespan in Timmers 2019 quoted as support; the
  discussion names C homozygotes as the carriers of the effect. The GWAS Catalog records no allele ("?"), and Open
  Targets' beta copies the Catalog's, so neither tells. As a HR per C, 1.09. The combined P is printed once; from the
  sexes' SPACox Ps (2.15e-6 and 2.84e-3) a z-score meta gives about 2e-8 (derived), still genome-wide. The cohort is
  hospital-based, so the authors ask for the general population; the effect holds across baseline diseases and without
  the cardiovascular deaths (P 1.4e-7, HR 0.92), with no cause of death standing out. Replication: Timmers 2019's
  parental lifespan has no line for the lead, which is rare in Europe, but at the proxy rs2280543 gives T, the C
  haplotype, a shorter life, β −0.0266 (P 0.0051, one-sided 0.0026 in BBJ's direction; both arms), and the same at
  rs79902640 (P 0.0075): an independent study, another ancestry, a third of the effect on the log-hazard scale
  (0.027 against 0.083). How well the proxy tags the lead in Europeans is unknown: Ensembl has no 1000 Genomes
  genotypes for the lead, the paper prints r² 0.89 between the lead and rs79902640 in 1000 Genomes Europeans, while
  the allele frequencies cap the proxy's r² at about 0.50 in gnomAD's Europeans, 0.62 in FinnGen and 0.74 in Deelen
  (derived). At the lead itself every European look-up leans C's way, none nominal: Deelen's 90th percentile c −0.085
  (P 0.17) and 99th −0.148 (P 0.18) on the log odds of long life, FinnGen R11's any death C +0.020 (P 0.57), Park
  2025's UK Biobank own survival C +0.0020 on the Martingale residual (P 0.43; the deposit's columns swapped as at
  13 and 61 to 63). D21's red flag is unknown, so no `replication_failed` (D26.3), and A would be barred anyway
  (D25.12): calibrated by APOE, BBJ's ε4 (log HR 0.049) against each study's own ε4 line, the lead's 0.083 expects
  +0.18 in FinnGen (power 1.00, heterogeneity P 8e-4), +0.022 in Park (P 8e-6) and −0.87 at Deelen's 90th (P 1e-6),
  each a flag, but BBJ's ε4 is weaker than in Europeans (its CI misses theirs), which inflates every factor taken
  from it, and no source prints a second calibration for this scale (D25.3, D28.1). Uncalibrated, FinnGen's death
  endpoint gives power 0.75, heterogeneity P 0.10, no flag. Outcomes: lifespan +, exceptional survival 0 (Deelen
  leans, P 0.17 and 0.18), healthspan untested (no Zenin line). Mechanism general ageing: the authors find the effect
  independent of disease status and cause of death. Pleiotropy at the proxy in BBJ (Supplementary Table 5, read per T
  by the Catalog's T for aneurysm and its major-allele risk for fibroids): the shorter-lived haplotype has more
  cerebral aneurysm, stable angina and myocardial infarction, fewer uterine fibroids and less colorectal cancer; the
  longer-lived T haplotype thus carries more fibroids and colorectal cancer, a trade-off, so descriptive; every
  lifespan look-up leans the same way, so the net direction is read as resolved and the genotypes keep their states.
  The proxy's effect is non-additive (P 0.02). Open Targets: one PICS set, the lead at PIP 0.944, C1 on §4.2's letter,
  a PIP from one summary P with no 1000 Genomes LD for the lead behind it; locus-to-gene 0.24 at best (BET1L), and of
  25 QTL colocalisations at H4 ≥ 0.8, SIRT3 holds 14 and BET1L 7, two genes each past a tenth: E3 (D24), no gene named;
  the authors too leave the gene open. Context: East Asian discovery, C rare elsewhere. Age of action unknown.
