variants:
  - rsid: rs76612380
    gene: ""
    phenotype: BET1L region, survival in Japanese
    trait_efo_id: OBA_VT0005372
    effect_allele: T
    effect_size: 0.92
    effect_measure: HR
    stat_significance: significant
    direction: protective
    negatives: >-
      The longer-life version, T, travels with a stretch of DNA that in Japanese people goes with more uterine fibroids
      and somewhat more colorectal cancer; the shorter-life version goes with more heart disease and brain aneurysms.
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 96 in 100 people of European
          ancestry and about 83 in 100 people of East Asian ancestry do. It is the reference the other combinations
          are compared with. The position, on chromosome 11, lies next to the BET1L gene; which gene it acts
          through is not known. The finding comes from a large Japanese study.
      - genotype: C/T
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 4 in 100 people of European
          ancestry and about 16 in 100 people of East Asian ancestry do). In a large Japanese study of hospital
          patients, people with this version tended to die somewhat earlier, whatever illness they had, and studies of
          Europeans lean the same way, more weakly. The same stretch of DNA goes with more heart disease but fewer
          uterine fibroids. It is a likely finding, not a settled one. It is a tendency, not destiny.
      - genotype: C/C
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 1 in 100 people of East Asian
          ancestry, and far fewer of European ancestry, do). In a large Japanese study of hospital patients, people
          with two copies of this stretch of DNA tended to die earlier, more clearly than those with one, and
          studies of Europeans lean the same way, more weakly. The same stretch goes with more heart disease but
          fewer uterine fibroids. It is a likely finding, not a settled one. It is a tendency, not destiny.
