# A second, independent signal at the seed's locus 52, LPL (8p21.3), its own row under D25.6 and D39.14. Curated
# 2026-11-16. Lead rs15285, the seed's second rsID at 52 (Wright 2019's fathers' lead): LPL 3′ UTR, GRCh38
# 8:19,967,156 C/T, GRCh37 8:19,824,667, T ancestral; T at 29.2 % in gnomAD's non-Finnish European genomes. 11 kb from
# row 52's lead rs268 (LPL Asn318Ser), r² 0.004 in 1000 Genomes EUR. T is the longer-life allele.
locus_id: 166
locus_name: LPL-3UTR
second_signal_of: 52
verdict: kept
verdict_reason: >-
  Tier B: genome-wide in one study, Wright 2019's AncestryDNA–UK Biobank fathers' meta-analysis (P 8.46e-10, 696,000;
  AncestryDNA P 2.4e-5 raw, 1.04e-4 after genomic control, UK Biobank 1.2e-7, heterogeneity P 0.83), with no independent replication outside it (D28.7,
  D39.17: the AncestryDNA arm sits inside the anchor and replicates nothing). Both arms put T with longer-lived fathers: AncestryDNA's Table 8 T
  +0.0119 on the lifespan scale, UK Biobank C +0.0127 on Pilling's attained-age scale, Pilling's fathers' line digit
  for digit. Independence (D39.14): Aragam 2022's coronary disease fine-mapping in Open Targets holds rs268
  alone in one set (PIP 1.00) and rs15285 in another that rs268 is not in, the signals' own sets; from 1000 Genomes'
  phased EUR haplotypes r is −0.063 (r² 0.004), so conditioning on rs268 leaves the meta's z of 6.14 at 5.6 or more for
  any rs268 z up to 8 (its largest lifespan z read, Timmers', is 4.5) (derived), genome-wide in either coupling
  (D39.15). The other looks lean T's way and none passes outside: Timmers 2019's pooled parents T longer, beta1
  +0.0176 (SE 0.0043), P 3.5e-5, "++", UK Biobank inside; Pilling 2017 both parents P 2.3e-5, mothers 0.0052, the top
  10 % flat (P 0.80); Deelen 2019's 90th one-sided 0.065, the 99th flat, a flag under APOE's factor only, so none
  (D26.3); FinnGen R11's deaths T fewer, one-sided 0.16, a database line; Park 2025's own survival flat (P 0.61). Outcome
  cells read for T: lifespan + (Wright, Pilling, Timmers); exceptional survival 0 (Pilling's top 10 % and Deelen flat);
  healthspan + (Zenin 2019, T the later end, P 0.009; Foote 2025's deposits hold no line). Mechanism heart and vessels, as row 52: LPL's 3′ UTR, T lowering triglycerides (Catalog, P 3e-72) and coronary disease (Aragam, β −0.0061
  per T). Pleiotropy `mech:lipids` and `mech:cvd`: C raises disorders of lipid metabolism and cholesterol medication,
  T lowers triglycerides and coronary disease, so the longer-life allele is the healthier on each, no `tradeoff`;
  platelet count lines named. Causal C3 (PIP 0.066 in Wright's fathers' set, PICS over 84 members; Open Targets
  flags it: the study has flags, no in-sample LD reference, a curated top hit; Aragam's set holds 68 with the first
  two flags). Effector E2, LPL:
  locus-to-gene 0.98 on that set, the variant in LPL's 3′ UTR; its colocalisations not read. The literature search (the rsID, 2026-11-16) finds Shen 2023 (PMID 37036527), a Chinese case-control study of 888 gastric cancers whose abstract puts the T allele with higher risk (OR 1.48) and higher LPL expression, and a 2026 clinical-obesity preprint (no PMID) whose abstract does not say which allele its carriers carry; both named, abstract only, and a single candidate-gene study in another ancestry sets no `tradeoff` against T. Descriptive. Age of action
  unknown. The evidence is European (UK Biobank, AncestryDNA's European-ancestry group).
