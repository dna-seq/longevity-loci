variants:
  - rsid: rs15285
    locus: {chrom: "8", start: 19967156, ref: C, cites: [db-ensembl-116#q1191]}
    gene: LPL
    phenotype: LPL 3′ UTR, fathers' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: T
    effect_size: -0.0126518
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (about 50 in 100 people of European ancestry
          do). It is the reference the other combinations are compared with. The position lies at the end of the LPL
          gene, which makes the enzyme that clears fats from the blood. The finding comes from people of European
          ancestry; less is known elsewhere.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of the T version of this DNA position (about 41 in 100 people of European ancestry do).
          In a very large study of British and American families, fathers of people with this version lived a little
          longer. The same version goes with lower blood fats and a slightly lower risk of heart disease. It is a
          likely finding, not a settled one: it has not been confirmed in a separate group of people. The effect is
          small and it is a tendency, not a guarantee.
      - genotype: T/T
        state: protective
        conclusion: >-
          You carry two copies of the T version of this DNA position (about 9 in 100 people of European ancestry do).
          In a very large study of British and American families, fathers of people with this version lived a little
          longer, per copy. The same version goes with lower blood fats and a slightly lower risk of heart disease. It
          is a likely finding, not a settled one: it has not been confirmed in a separate group of people. The effect
          is small and it is a tendency, not a guarantee.
