# The seed list's locus 161, BLNK/DNTT (10q24.1): a marker of biological ageing (D32, D36.3), curated on D37.12 with 23
# TERC as the pattern. Curated 2026-11-16. Lead rs941997, the seed's rsID (McCartney 2021's European Hannum locus):
# between genes, 1.6 kb upstream of a lncRNA, GRCh38 10:96,287,079 A/T, GRCh37 10:98,046,836, A ancestral; T at 21.1 %
# in gnomAD's non-Finnish European genomes. T is the allele with slower Hannum age.
locus_id: 161
locus_name: BLNK/DNTT
verdict: kept
verdict_reason: >-
  Tier B on the marker's own evidence (D37.12; the seed gives none): the tier grades the association with Hannum age
  acceleration, a DNA methylation clock read against calendar age, not longevity, and this row is unscored (D32).
  McCartney 2021's GWAS of epigenetic clocks in 34,710 Europeans and 6,195 African Americans prints rs941997 in its
  European Hannum analysis: Table S4 has T, the effect allele (the legend's refA), at 0.22, Hannum age acceleration
  0.35 years lower per T (SE 0.036), P 8.8e-22, effective n 29,905 in 24 cohorts, I² 44 %, two cohorts the other way;
  the joint estimate the same. The GWAS Catalog's record (T 0.3481 decrease, P 9e-22) is the same line, the only one it
  holds. Genome-wide in one study of under 100k, unreplicated in a sample of its own (none found): §4.1's B. Lifespan
  look-ups, unscored and read for T, two-sided at 0.05 (D38.6), all flat: Timmers 2019 A beta1 −0.0037 (SE 0.0048), P
  0.44; Pilling 2017's parents P 0.2 to 0.76; Park 2025's own survival P 0.86 (men 0.37, women 0.42); Deelen 2019 90th
  P 0.17, 99th P 0.084; FinnGen R11's deaths P 0.42, a database line; Zenin 2019's healthspan P 0.84; Foote 2025's
  general factor and factors 1, 2, 3, 5 and 6 P 0.27 to 0.82 (factor 4 holds no line). The literature search (the
  rsID, 2026-11-16) finds nothing. Every genotype neutral, each conclusion a tendency of the marker with no colour
  (D32, D37.12); `direction: unknown`. Outcome cells read for T: exceptional survival 0 (Deelen flat); lifespan 0
  (Timmers, Pilling, Park and FinnGen flat); healthspan 0 (Zenin and Foote flat). Mechanism: markers of biological
  ageing. No pleiotropy read: the Catalog holds the clock line alone. Causal C4: no clock's credible set in Open
  Targets holds it, its one set a brain splicing QTL at PIP 0.08. Effector E4: no gene named; BLNK and DNTT are the
  seed's names for the region. Descriptive. Age of action unknown. The evidence is European.
