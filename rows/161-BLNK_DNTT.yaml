      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (about 62 in 100 people of European ancestry
          do). It is the reference the other combinations are compared with. The position lies between genes on
          chromosome 10. Epigenetic clocks estimate age from chemical marks on DNA; a clock's reading only means
          something against your calendar age, which this report does not have, so this result carries no score.
      - genotype: A/T
        state: neutral
        conclusion: >-
          You carry one copy of the T version of this DNA position (about 33 in 100 people of European ancestry do).
          Large studies link it with a Hannum epigenetic clock reading about a third of a year lower than expected for
          your age. That is a tendency in a marker whose reading only means something against your calendar age, which
          this report does not have, so it carries no score.
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the T version of this DNA position (about 4 in 100 people of European ancestry do).
          Large studies link each copy of T with a Hannum epigenetic clock reading about a third of a year lower than
          expected for your age. That is a tendency in a marker whose reading only means something against your
          calendar age, which this report does not have, so it carries no score.
