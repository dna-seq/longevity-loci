# The seed list's locus 144, POT1 (7q31.33): a marker of biological ageing (D32, D36.3), curated on D37.12 with 23
# TERC as the pattern. Curated 2026-11-16. Lead rs59294613, the seed's rsID (Li 2020's POT1 telomere-length lead):
# intronic in POT1's MANE transcript, GRCh38 7:124,914,213 C/A, GRCh37 7:124,554,267, C ancestral; A at 29.3 % in
# gnomAD's non-Finnish European genomes. A is the shorter-telomere allele.
locus_id: 144
locus_name: POT1
verdict: kept
verdict_reason: >-
  Tier A on the marker's own evidence (D37.12; the seed gives none): the tier grades the association with leukocyte
  telomere length, not longevity, and this row is unscored (D32). Li 2020's meta-analysis (78,592 Europeans of
  ENGAGE, EPIC-CVD and EPIC-InterAct, no UK Biobank) prints rs59294613 with A (EA) at 0.29, β −0.041 SD (SE 0.006), P
  1.17e-13. Codd 2021's 472,174 UK Biobank participants print the POT1 locus at its sentinel rs7790856, A1 C at 0.711,
  β +0.044 (0.039 to 0.048), P 1.8e-87, N_imp 464,345, Europeans the same; rs59294613 sits in that locus's credible
  set (PP 0.08) and is in LD with the sentinel at r² 1.00 (D′ 1.00, CEU), the minor alleles travelling together
  (rs59294613 A 0.29, rs7790856 T 0.289), so Codd's shorter T is Li's A: the same side. D21's test: Li −0.041 (SE
  0.006) against Codd −0.044 for T (SE about 0.0023), heterogeneity P 0.64, Li's power at Codd's effect 1.00: no red
  flag. A study of 100k or more, genome-wide, with an independent replication on the same allele: §4.1's A, the lead
  inside Codd's set (D38.5). Lifespan look-ups, unscored and read for A, two-sided at 0.05 (D38.6): Deelen 2019's
  90th percentile has A less often among the long-lived, −0.0509 (SE 0.021), P 0.016, the 99th the same side, P
  0.089; Timmers 2019 A beta1 −0.0080 (SE 0.0043), P 0.061; Pilling 2017's parents P 0.064 to 0.62; Park 2025's own
  survival P 0.37 (men 0.97, women 0.15); FinnGen R11's deaths P 0.66, a database line. Zenin 2019's healthspan is
  flat (P 0.29); Foote 2025's factors put A on the frailer side for unhealthy lifestyle (C −0.0060, SE 0.0018, P
  0.00086) and disability (C −0.0061, SE 0.0025, P 0.015), multimorbidity the other way short of 0.05 (C +0.0035, P
  0.061), the general factor and factors 1 and 5 flat, factor 4's deposit holding no line. The literature search
  (the rsID, 2026-11-16) finds the telomere-length and cancer GWASs, no test of lifespan. Every genotype neutral,
  each conclusion a tendency of the marker with no colour (D32, D37.12); `direction: unknown`. Outcome cells read
  for A: exceptional survival − (Deelen's 90th two-sided 0.016, A the side less often long-lived, D38.6); lifespan 0
  (Timmers, Pilling, Park and FinnGen flat); healthspan − (Foote's factors 2 and 6, two-sided 0.00086 and 0.015, A
  the frailer; factor 3 the other way only at 0.061, so not both ways at nominal P, D31.4, D37.4; Zenin flat).
  Mechanism: markers of biological ageing; POT1 binds the single-stranded telomere end in the shelterin complex. No
  pleiotropy token: the Catalog's renal cell carcinoma line (Scelo 2017, OR 1.098, P 8e-8) is short of genome-wide
  and prints no allele, and Open Targets' nevus or melanoma set holds the variant at PIP 0.006; named. Most of its 49 Open Targets sets are blood-cell traits, red-cell size and haemoglobin (mean corpuscular volume and haemoglobin, sphered cell volume) and eosinophil counts and fractions, each holding it at PIP 0.07 or less (the highest mean corpuscular volume, 0.066, and eosinophil count, 0.056; db-opentargets-26.09#q1476 to q1479): named, no token, the variant's part in each unshown. Causal C3 (D39.12: Open Targets' sets, PIP 0.035 in Li's and 0.018 in the telomere PC1 set; Codd 2021's own set at PP 0.08, named). Effector E2, POT1: locus-to-gene
  0.72 on the PC1 set and 0.59 on Li's, GPR37 at 0.22 and 0.46, no rival at 0.5. Descriptive. Age of action unknown.
  The evidence is European.
