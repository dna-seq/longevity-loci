variants:
  - rsid: rs59294613
    gene: POT1
    phenotype: POT1 intron, leukocyte telomere length
    trait_efo_id: OBA_0003784
    effect_allele: A
    effect_size: -0.041
    effect_measure: beta
    stat_significance: significant
    direction: unknown
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common C version of this DNA position (about 50 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. The position lies inside POT1, a
          gene for a protein that caps and protects the telomere ends of chromosomes. Telomere length is a marker whose
          reading only means something against your calendar age, which this report does not have, so this result
          carries no score.
      - genotype: A/C
        state: neutral
        conclusion: >-
          You carry one copy of the A version of this DNA position (about 41 in 100 people of European ancestry do).
          Large studies link it with slightly shorter telomeres in white blood cells, under a twentieth of the usual
          spread between people. That is a tendency in a marker whose reading only means something against your
          calendar age, which this report does not have, so it carries no score.
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the A version of this DNA position (about 9 in 100 people of European ancestry do).
          Each copy is linked in large studies with slightly shorter telomeres in white blood cells. That is a
          tendency in a marker whose reading only means something against your calendar age, which this report does
          not have, so it carries no score.
