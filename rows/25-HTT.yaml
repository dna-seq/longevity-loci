# The seed list's locus 25, HTT (4p16.3), with locus 158, HTT (Atkins 2021's frailty lead rs82334), folded in (D14):
# rs82334 is r² 0.66 to the lead and its lifespan signal is the lead's shadow (db-ensembl-116#q119,
# pmid-30642433#q69). Curated 2026-11-11, the third run's third row. Lead rs61348208 (Timmers 2019, Table 1).
# rs16843836 (Rosoff 2023's mvAge lead, r² 0.70) and rs362273 (Timmers 2022's aging-GIP1 lead, r² 0.67 EUR, 0.76
# EAS) are the same signal. The seed's other two rsIDs here, rs16843603 (ADD1, r² 0.095) and rs114298671 (MSANTD1,
# r² 0.08), are separate mvAge signals, named and not read. Wright 2019's AncestryDNA SNPs in the window are no tag
# (best r² 0.43). Open Targets 26.09: Timmers 2019's credible set holds the lead, rs16843836 and rs82334; mvAge's set
# holds rs16843836 and rs82334, not the lead. The GWAS Catalog (2026-10-29) holds three associations for rs61348208.
locus_id: 25
locus_name: HTT
also_loci: [158]
verdict: kept
verdict_reason: >-
  Tier A, up from the seed's B, on §4.1's letter. Genome-wide significant for parental lifespan in about one million
  lives (Timmers 2019, P 5.8e-9, past its own 2.5e-8 threshold; T, the minor allele at 39 %, adding 0.23 years per
  copy, UK Biobank and LifeGen on the same side), a locus first found there. Replicated twice in samples outside it,
  same side. First, own survival in FinnGen and Biobank Japan (Timmers 2022's look-up of its aging-GIP1 leads, 346,737
  people, 46,128 deaths): at rs362273, whose G rides with the lead's T (r² 0.67 in Europeans, 0.76 in East Asians; the
  phase shown from frequency and r² in Europeans, where the opposite phase would cap r² near 0.30, and in East Asians,
  where it would cap r² near 0.32 against 0.76; assumed in Finns, where T 0.54 and G 0.46 allow either), 0.21 years
  per G, one-sided P 0.001, 0.025 after Bonferroni over 23 SNPs; the abstract calls it independent evidence for the
  loci near HTT and MAML3. A weak proxy, but the lead's own signal: rs82334, at r² 0.98 to rs362273, carries the
  lead's shadow in Timmers' data. Second, Deelen 2019's survival to the 99th percentile in cohorts holding no UK
  Biobank data, OR 1.09 per T, P 0.0093 (I² 0); its 90th percentile leans the same way and does not pass (OR 1.03, P
  0.19), and the 99th's cases are a subset of the 90th's, so this is one look, not two. Timmers 2019's own look-up in
  the earlier longevity meta-analyses, at rs2285086 (r² 0.83), leans the same way and does not pass (P 0.23
  one-sided); its sources are mostly inside Deelen's, and at its power (about 0.6) and heterogeneity with the
  discovery (P about 0.28) it is no red flag (D21). Deelen's 90th percentile leans the right way (z 1.31) and does not
  pass; under both of Timmers' calibrations (D25.3) it is no red flag. By the APOE factor (Deelen's ε4 log OR over
  Timmers' ε4 β, 4.84) the expected log OR is 0.111, power about 1.00 and heterogeneity P 0.0025, a flag; by the
  loci's mean factor (0.42 of that) power is 0.74 and heterogeneity P 0.37, none. APOE's effect grows with age and
  overstates what this locus should show at the oldest ages. Deelen's cohorts overlap LifeGen's in at least the
  Rotterdam Study (79 of the 3,484 cases at the 99th percentile; D19.1); other overlap is unknown, and whether LifeGen
  holds a Finnish cohort is unknown too (Joshi 2017, cached, names none). Park 2025's own-survival GWAS of UK Biobank
  gives P 0.02 at the lead, with no direction printed, in the children of Timmers' UK Biobank parents: not
  independent, not scored. AncestryDNA gives nothing at the lead: Wright 2019's clumped SNPs in the window are no tag
  (best r² 0.43). The multivariate results reuse the same parents: Timmers 2020 (P 3e-8 at the lead, no effect size),
  Rosoff 2023's mvAge at rs16843836 (r² 0.70, P 7.2e-13, its A the healthier and the lead's partner) and aging-GIP1
  itself; cited here, not scored. Healthspan is +: Zenin 2019's summary statistics give P 0.030 at the lead, T going
  with a later end of healthspan, and Atkins 2021's frailty index is genome-wide at rs82334 (P 3.1e-10, UK Biobank and
  TwinGene the same way), whose C, the lead's partner by frequency and r², goes with less frailty (HEALTHSPAN-class,
  D23; the UK Biobank part is the same people). Atkins' text puts rs61348208 itself at P 3e-7 for frailty but labels
  it "RBM6 locus", a chromosome-3 gene, so that value is not read. Exceptional survival is +, on the single Deelen
  look. Mechanism: general ageing. Timmers 2019 assigns HTT no disease class and reads it as pleiotropic, with
  moderate effects on several risk factors; the signal colocalises with white-cell counts, lipid fractions, eGFR,
  depression and waist-hip ratio, none of them a disease that leads it. At rs362273's proxies, G (with the lead's T)
  goes with a lower waist-hip ratio and BMI, fewer white cells and less depression, and a slightly lower eGFR. The
  Huntington's disease record (a haplotype study of the HD gene region) prints no effect: common SNPs there mark the
  haplotypes the disease's repeat expansion arose on, and this variant is not that expansion. The trade-off was looked
  for (D18.1): the lower eGFR on the longer-lived side is a small biomarker shift at a proxy two LD steps from the
  lead (r² 0.63 to rs362273), no disease, so not flagged. Actionability is descriptive: nothing shows the locus acts
  mainly through weight. Causal confidence C2, at its edge: rs61348208 leads Timmers 2019's PICS set at PIP 0.108
  among 70 variants, the next at 0.029; aging-GIP1's fine-mapping puts it at 0.017 behind rs16843836 (0.22), so the
  causal variant is not resolved. The effector is E3, no gene named (D25.4): with 158 folded in, every lifespan-class
  set holding the lead or rs82334 counts. In Timmers' set no gene passes locus-to-gene (MSANTD1 0.17, HTT 0.17) and
  HTT holds 37 of its 40 cis-QTL colocalisations (H4 ≥ 0.8), HTT-AS the other 3; but in mvAge's set, the same signal,
  holding rs82334, MSANTD1 passes locus-to-gene (0.55) and RGS12 holds 4 of its 18 colocalisations (HTT 13, MSANTD1
  1), so the call is ambiguous (D24). The SNP lies in HTT, but nothing shows HTT is the gene that acts. The protective
  allele is T, the less common one; the most common genotype, C/T, is the reference (§6.2). Age of action is lifelong,
  from age bands (DIRECT_WEAK): in Timmers 2019's Figure 5 source data the effect keeps one sign and about one size
  from 60 to 90 in both parents (fathers 0.002, 0.020, 0.025; mothers 0.040, 0.014, 0.020), and the age moderator is
  null (P 0.61); each parent's 80-90 band is within one standard error of its 60-80 mean (fathers z −0.91, mothers
  0.28). Evidence is not European only: the FinnGen and Biobank Japan look-up spans both.
