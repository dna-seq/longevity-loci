variants:
  - rsid: rs61348208
    gene: HTT
    phenotype: HTT region, ageing and frailty
    trait_efo_id: EFO_0007796
    effect_allele: T
    effect_size: 0.2299
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: protective
        conclusion: >-
          You carry two copies of the less common version of this DNA region (about 15 in 100 people of European
          ancestry do). In very large British and European studies, each copy went with parents living about a
          month and a half longer, and separate studies in Finland and Japan, and of very long-lived Europeans,
          agreed. The same version goes with slightly less frailty in later life. The finding is well established;
          the effect is small and it is a tendency, not destiny. The region, on chromosome 4, lies in the HTT gene.
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of each version of this DNA region (about 48 in 100 people of European ancestry do, the
          most common combination). It is the reference the other combinations are compared with. The region, on
          chromosome 4, lies in the HTT gene and is linked to how people age in general rather than to one disease.
      - genotype: C/C
        state: risk
        conclusion: >-
          You carry two copies of the more common version of this DNA region (about 37 in 100 people of European
          ancestry do). In very large British and European studies, each copy went with parents living about a
          month and a half less, and separate studies in Finland and Japan, and of very long-lived Europeans,
          agreed. The same version goes with slightly more frailty in later life. The finding is well established;
          the effect is small and it is a tendency, not destiny.
