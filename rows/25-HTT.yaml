# The seed list's locus 25, HTT (4p16.3), with locus 158, HTT (Atkins 2021's frailty lead rs82334), folded in (D14):
# rs82334 is r² 0.66 to the lead and its lifespan signal is the lead's shadow (db-ensembl-116#q119,
# pmid-30642433#q69). Curated 2026-11-11, the third run's first row. Lead rs61348208 (Timmers 2019, Table 1).
# rs16843836 (Rosoff 2023's mvAge lead, r² 0.70) and rs362273 (Timmers 2022's aging-GIP1 lead, r² 0.67 EUR, 0.76
# EAS) are the same signal. The seed's other two rsIDs here, rs16843603 (ADD1, r² 0.095) and rs114298671 (MSANTD1,
# r² 0.08), are separate mvAge signals, named and not read. Wright 2019's AncestryDNA SNPs in the window are no tag
# (best r² 0.43). Open Targets 26.09: Timmers 2019's credible set holds the lead; mvAge's set holds rs16843836 and
# rs82334, not the lead. The GWAS Catalog (2026-10-29) holds three associations for rs61348208.
locus_id: 25
locus_name: HTT
also_loci: [158]
verdict: kept
verdict_reason: >-
  Tier A, up from the seed's B, on §4.1's letter. Genome-wide significant for parental lifespan in about one million
  lives (Timmers 2019, P 5.8e-9, past its own 2.5e-8 threshold; T, the minor allele at 39 %, adding 0.23 years per
  copy, UK Biobank and LifeGen on the same side), a locus first found there. Replicated twice in samples outside it,
  same side. First, own survival in FinnGen and Biobank Japan (Timmers 2022's look-up of its aging-GIP1 leads, 346,737
  people, 46,128 deaths): at rs362273, whose G rides with the lead's T (r² 0.67 in Europeans, 0.76 in East Asians;
  the phase derived from direction and frequency, not read), 0.21 years per G, one-sided P 0.001, 0.025 after
  Bonferroni over 23 SNPs; the abstract calls it independent evidence for the loci near HTT and MAML3. A weak proxy,
  but the lead's own signal: rs82334, at r² 0.98 to rs362273, carries the lead's shadow in Timmers' data. Second,
  Deelen 2019's survival to the 99th percentile in cohorts holding no UK Biobank data, OR 1.09 per T, P 0.0093
  (I² 0); its 90th percentile leans the same way and does not pass (OR 1.03, P 0.19), and the 99th's cases are a
  subset of the 90th's, so this is one look, not two. Deelen shares the Rotterdam Study with LifeGen, a small part
  (D19.1). Park 2025's own-survival GWAS of UK Biobank gives P 0.02 at the lead, with no direction printed, in the
  children of Timmers' UK Biobank parents: not independent, not scored. AncestryDNA gives nothing at the lead: Wright
  2019's clumped SNPs in the window are no tag (best r² 0.43). The multivariate results reuse the same parents:
  Timmers 2020 (P 3e-8 at the lead, no effect size), Rosoff 2023's mvAge at rs16843836 (r² 0.70, P 7.2e-13, its A
  the healthier and the lead's partner) and aging-GIP1 itself; cited here, not scored. Healthspan is +: Zenin 2019's
  summary statistics give P 0.030 at the lead, T going with a later end of healthspan, and Atkins 2021's frailty
  index is genome-wide at rs82334 (P 3.1e-10, UK Biobank and TwinGene the same way), whose C, the lead's partner,
  goes with less frailty (HEALTHSPAN-class, D23; the UK Biobank part is the same people). Atkins' text puts
  rs61348208 itself at P 3e-7 for frailty but labels it "RBM6 locus", a chromosome-3 gene, so that value is not read.
  Exceptional survival is +, on the single Deelen look. Mechanism: general ageing. Timmers 2019 assigns HTT no disease
  class and reads it as pleiotropic, with moderate effects on several risk factors; the signal colocalises with
  white-cell counts, lipid fractions, eGFR, depression and waist-hip ratio, none of them a disease that leads it. At
  rs362273's proxies, G (with the lead's T) goes with a lower waist-hip ratio and BMI, fewer white cells and less
  depression, and a slightly lower eGFR; the Huntington's disease record prints no effect. The trade-off was looked
  for (D18.1): the lower eGFR on the longer-lived side is a small biomarker shift at a proxy two LD steps from the
  lead (r² 0.63 to rs362273), no disease, so not flagged. Actionability is descriptive: nothing shows the locus acts
  mainly through weight. Causal confidence C2, at its edge: rs61348208 leads Timmers 2019's PICS set at PIP 0.108 among
  70 variants, the next at 0.029; aging-GIP1's fine-mapping puts it at 0.017 behind rs16843836 (0.22), so the causal
  variant is not resolved. The effector is HTT, E2: no gene passes locus-to-gene in Timmers' set (MSANTD1 0.17, HTT
  0.17), and HTT holds 37 of its 40 cis-QTL colocalisations (H4 ≥ 0.8), HTT-AS the other 3, under a tenth (D24),
  counting the one lifespan-class set that holds the lead. mvAge's set, the same signal but not holding the lead,
  would make it E3: MSANTD1 passes locus-to-gene there (0.55). The protective allele is T, the less common one; the
  most common genotype, C/T, is the reference (§6.2). Age of action is unknown: no cached source gives this locus's
  own age bands. Evidence is not European only: the FinnGen and Biobank Japan look-up spans both.
