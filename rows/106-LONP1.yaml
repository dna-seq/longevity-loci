# The seed list's locus 106, LONP1 (19p13.3): a marker of biological ageing (D32, D36.3), curated on D37.12 with 23
# TERC as the pattern. Curated 2026-11-16. Lead rs11085147, the seed's rsID (Gupta 2023's mtDNA copy-number locus): a
# LONP1 missense on its MANE transcript, R241Q, GRCh38 19:5,711,919 C/T, GRCh37 19:5,711,930, C ancestral; T at 9.2 %
# in gnomAD's non-Finnish European genomes. T is the higher-copy-number allele.
locus_id: 106
locus_name: LONP1
verdict: kept
verdict_reason: >-
  Tier B on the marker's own evidence (D37.12; the seed gives none): the tier grades the association with
  mitochondrial DNA copy number in blood, not longevity, and this row is unscored (D32). Gupta 2023 measured mtDNA
  copy number from the whole genomes of 274,832 people of UK Biobank and All of Us and names LONP1 among its loci with
  fine-mapped missense variation; the GWAS Catalog's record of its adjusted copy-number GWAS puts C at 0.905 with copy
  number 0.137 SD lower per C, so T higher, P 1e-109, and Open Targets fine-maps the variant there at PIP 1.00. Chong
  2022's UK Biobank copy-number GWAS (395,718) has T higher too, P 2e-95, PIP 1.00, but it is the same UK Biobank
  people, so it is no independent replication. That is genome-wide in a study of 100k or more, unreplicated outside
  its sample: §4.1's B. Lifespan look-ups, unscored and read for T: Timmers 2019 T beta1 −0.0101 (SE 0.0067), P 0.13;
  Pilling 2017's parents, inside Timmers' pool, flat except the fathers (C with longer-lived fathers, P 0.0088, a
  stratum); Park 2025's own survival flat (P 0.87; men 0.84, women 0.96); FinnGen R11's deaths flat (P 0.94), a
  database line; Deelen 2019 T's way and flat (90th +0.055, P 0.11; 99th +0.087, P 0.12); Zenin 2019 flat (P 0.41);
  Foote 2025's factor 1 puts T on the less frail side, C +0.0080 (SE 0.0032), P 0.012, one-sided 0.006, with factors 2,
  3, 5 and 6 flat (P 0.31 to 0.93; the general factor and factor 4 hold no line). The literature search (the rsID,
  2026-11-16) finds the copy-number GWASs alone. Every genotype neutral, each conclusion a tendency of the marker with
  no colour (D32, D37.12); `direction: unknown`. Outcome cells read for T: exceptional survival 0 (Deelen flat);
  lifespan 0 (Timmers, Park and FinnGen flat; Pilling's fathers a stratum); healthspan + (Foote's factor 1, one-sided
  0.006, the others flat, so not "both ways at nominal P", D31.4, D37.4; Zenin flat). Mechanism: markers of biological
  ageing; LONP1 is the mitochondrial Lon protease. No disease pleiotropy in the Catalog, whose other lines are blood
  protein levels (MRPL58, GADD45GIP1, NGRN, T higher), named. Causal C1 (PIP 1.00 in both copy-number sets). Effector
  E1, LONP1: a missense on the MANE transcript (§4.2). Descriptive. Age of action unknown. The evidence is mostly
  European (UK Biobank), with All of Us's diverse sample in Gupta's meta-analysis.
