# The seed list's locus 106, LONP1 (19p13.3): a marker of biological ageing (D32, D36.3), curated on D37.12 with 23
# TERC as the pattern. Curated 2026-11-16. Lead rs11085147, the seed's rsID (Gupta 2023's mtDNA copy-number locus): a
# LONP1 missense on its MANE transcript, R241Q, GRCh38 19:5,711,919 C/T, GRCh37 19:5,711,930, C ancestral; T at 9.2 %
# in gnomAD's non-Finnish European genomes. T is the higher-copy-number allele.
locus_id: 106
locus_name: LONP1
verdict: kept
verdict_reason: >-
  Tier B on the marker's own evidence (D37.12; the seed gives none; A from 114's reading until D38.1, 2026-11-16):
  the tier grades the association with mitochondrial DNA copy number in blood, not longevity, and this row is
  unscored (D32). Gupta 2023's adjusted copy-number GWAS is UK Biobank's own, six ancestry groups (Supplementary
  Table 1; All of Us is not in it), and its Table 2 prints rs11085147 with C, the reference allele, at 0.905, β −0.137
  SD (SE 0.0062), P 1.1e-109, N 162,414, fine-mapped at PIP 1 as a missense (Table 3): T higher; the legend names
  AF_Allele2 the reference allele's frequency, so the β is per C, and the GWAS Catalog's record agrees. Chong 2022's
  UK Biobank copy-number GWAS (395,718) has T higher too, P 2e-95, PIP 1.00, but it is the same UK Biobank people.
  Two samples outside UK Biobank pass on the same side, each at a much smaller effect, on the scale both print beside
  Longchamps 2022's estimate (UK Biobank with CHARGE, C −0.0915): Koller 2024 (GCKD, CHRIS, AugUR; 16,130 Europeans,
  qPCR) C −0.0529 (SE 0.0178), P 0.0029, 0.58 times it, heterogeneity P 0.034 at power 1.00; Zaidi 2023 (Penn
  Medicine BioBank, 22,068 Europeans, exome) C −0.0357 (SE 0.0142, the power table's), one-sided P about 0.006, 0.39
  times it, heterogeneity P 1.4e-4 at power 1.00, and not among Zaidi's three replicating variants; Koller's text
  says the variant was not significant there. TFAM's lines in the same two tables do not shrink (0.89 and 0.92), so
  the platform does not explain it. Genome-wide in a study of 100k or more, replicated with a much smaller effect:
  §4.1's B (D38.1, D25.13), and no `replication_failed`, since both pass. Koller's 0.5 SD equivalence test shows
  nothing about effect size and is not used (D38.2). Lifespan look-ups, unscored and read for T: Timmers 2019 T beta1 −0.0101 (SE 0.0067), P 0.13;
  Pilling 2017's parents, inside Timmers' pool, flat except the fathers (C with longer-lived fathers, P 0.0088, a
  stratum); Park 2025's own survival flat (P 0.87; men 0.84, women 0.96); FinnGen R11's deaths flat (P 0.94), a
  database line; Deelen 2019 T's way and flat (90th +0.055, P 0.11; 99th +0.087, P 0.12); Zenin 2019 flat (P 0.41);
  Foote 2025's factor 1 puts T on the less frail side, C +0.0080 (SE 0.0032), two-sided P 0.012, with factors 2,
  3, 5 and 6 flat (P 0.31 to 0.93; the general factor and factor 4 hold no line). The literature search (the rsID,
  2026-11-16) finds the copy-number GWASs alone; Koller 2024 and Zaidi 2023 came from row 114's search and its review. Every genotype neutral, each conclusion a tendency of the marker with
  no colour (D32, D37.12); `direction: unknown`. Outcome cells read for T: exceptional survival 0 (Deelen flat);
  lifespan 0 (Timmers, Park and FinnGen flat; Pilling's fathers a stratum); healthspan + (Foote's factor 1, two-sided
  0.012, the side named, D38.6; the others flat, so not "both ways at nominal P", D31.4, D37.4; Zenin flat). Mechanism: markers of biological
  ageing; LONP1 is the mitochondrial Lon protease. No disease pleiotropy in the Catalog, whose other lines are blood
  protein levels (MRPL58, GADD45GIP1, NGRN, T higher), named. Causal C1 (PIP 1.00 in both copy-number sets). Effector
  E1, LONP1: a missense on the MANE transcript (§4.2). Descriptive. Age of action unknown. The evidence is mostly
  European (UK Biobank's own groups, Koller's three studies and the Penn Medicine BioBank's Europeans).
