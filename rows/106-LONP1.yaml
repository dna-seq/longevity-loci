variants:
  - rsid: rs11085147
    gene: LONP1
    phenotype: LONP1 R241Q, mtDNA copy number
    trait_efo_id: EFO_0006312
    effect_allele: T
    effect_size: 0.137
    effect_measure: beta
    stat_significance: significant
    direction: unknown
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (about 82 in 100 people of European ancestry
          do). It is the reference the other combinations are compared with. The position changes one building block
          of LONP1, a protease that keeps the cell's power stations, the mitochondria, in order. The number of
          mitochondrial DNA copies in blood is a marker whose reading only means something against your calendar age,
          which this report does not have, so this result carries no score.
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of the T version of this DNA position (about 17 in 100 people of European ancestry do).
          Large studies link it with slightly more copies of mitochondrial DNA in blood cells, a little over a tenth of
          the usual spread between people. That is a tendency in a marker whose reading only means something against
          your calendar age, which this report does not have, so it carries no score.
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the T version of this DNA position (about 1 in 100 people of European ancestry do).
          Each copy is linked in large studies with slightly more copies of mitochondrial DNA in blood cells. That is a
          tendency in a marker whose reading only means something against your calendar age, which this report does
          not have, so it carries no score.
