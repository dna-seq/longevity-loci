# The seed list's locus 122, LOC105377527 (4q32.3). Curated 2026-11-15. Lead rs1732444170, the seed's only rsID (Hsieh
# 2026's 95-and-over Taiwanese locus), which Ensembl holds as a T/A SNV with no frequency; the variant Hsieh tests is
# the two-base deletion TTC>T at GRCh38 4:169,071,078 (FinnGen's alleles; Ensembl's rs10610954, TCT/T one base on, the
# same deletion in a TC repeat), GRCh37 4:169,992,229, the deletion T at 0.18 in gnomAD's East Asian genomes and 0.25
# in the non-Finnish, the discovery's shorter-lived allele. Open Targets 26.09 has no record under either form; the
# GWAS Catalog (2026-10-29) holds no association.
locus_id: 122
locus_name: LOC105377527
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's C: a sub-genome-wide East Asian discovery that Deelen 2019 contradicts on the same scale at
  the variant itself (D31.13's Hsieh bullet, D26.11, D22.3; row 113's shape). Hsieh 2026 compared 248 Taiwanese
  hospital patients who died at 95 or over with 873 who died at 65 to 75 at the same hospital: the deletion T (0.174,
  pooled) OR 0.36 per T, P 1.7e-6, under the paper's suggestive line of 1e-5 (log OR −1.02, SE 0.213 from its P,
  derived). The seed's rsID names a T/A SNV in Ensembl; Hsieh's alleles (T, TTC) are FinnGen's deletion at the same
  position, Ensembl's rs10610954 one base on in the repeat, and the row means that deletion. Solved from the OR and
  the counts (per Alt, the pooled frequency, as rows 113 and 119 read the tables), the controls carry T at about 0.200
  and the long-lived at about 0.083; against gnomAD's East Asian genomes (0.183, the reference D31.13 fixes) the
  controls fit (P 0.12 with its error), so the discovery is read as printed (D31.10 not met); Taiwan Biobank's printed
  0.187 agrees. Its validation cohort gives OR 0.483, P 0.009, the same direction, but its controls are not its own
  (Fig. 2 sets its cases against controls aged 65 to 75), so it is not an independent replication (D19.1). Deelen 2019
  tests the deletion itself (d at 0.24): 90th percentile +0.0186 (SE 0.0255), P 0.47, and 99th +0.0385 (SE 0.0397), P
  0.33, the deletion a little longer-lived; against Hsieh's log OR on the same scale, two log odds of long-lived status,
  heterogeneity P 1.3e-6 and 1.0e-6, power 1.00, holding down to 0.07 and 0.10 of Hsieh's effect (derived): a D21 red
  flag, `replication_failed`. Hsieh's own APOE line is null (ε4 OR 0.96, P 0.82), so no conversion to a lifespan
  scale is its own (D31.13): Park 2025 at the deletion has T with more deaths by a hair (P 0.62; its columns swapped,
  UK Biobank), flat, stated without a calibrated test; Timmers 2019 holds no line at the indel, and at rs62332690, two
  bases away with A at the deletion's frequency in CEU and gnomAD (Ensembl gives no LD for the indel, so the pairing
  is unknown), A is flat (P 0.81); FinnGen R11's death endpoint has the deletion with fewer deaths (P 0.009), against
  Hsieh's direction, a database line that neither replicates nor sets D (D29.1, D30.12). Zenin 2019 at rs62332690 flat
  (P 0.92), the pairing unknown, so healthspan is untested; Pilling 2017 and Foote 2025 hold no line, and Wright 2019
  none within 500 kb: untested. Deelen's and Timmers' strongest lines within 500 kb were not read. The literature
  search (the rsID; Semantic Scholar answered 429, its part unchecked) finds nothing; Hsieh is found by its PMID, and
  its one citing paper is a Finnish polygenic lifespan score, with no single-variant test. The ancestry is named here,
  not as a context token (D30.15). Every genotype neutral (D25.2). Exceptional survival 0 (Deelen leans against at
  one-sided 0.17 and 0.23, short of nominal, and a D row's discovery gives no +, D28.10); lifespan 0 (Park flat;
  FinnGen a database line); healthspan untested. Mechanism ageing in general (D25.7): intronic in a lncRNA
  (LOC105377527), nothing recorded at the variant. Causal C4 and effector E4: no Open Targets record. Descriptive.
  Age of action unknown.
