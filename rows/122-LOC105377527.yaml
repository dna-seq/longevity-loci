    effect_allele: TTC
    effect_size: 2.78
    effect_measure: OR
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: TTC/TTC
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA position, as about 56 in 100 people of European
          ancestry and 67 in 100 of East Asian ancestry do. It is the reference the other combinations are compared
          with. The position, a short repeat on chromosome 4, lies in a stretch of DNA that makes no protein. One
          Taiwanese study linked the other, shorter version to dying before 95, but a large European study of
          long-lived people found the opposite lean, so it is not counted for or against lifespan.
      - genotype: T/TTC
        state: neutral
        conclusion: >-
          You carry one copy of a shorter version of this DNA position (about 38 in 100 people of European ancestry
          do). One Taiwanese study found it less often among people who lived to 95, but a large European study of
          long-lived people found it slightly more often among them, so it is not counted for or against lifespan.
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of a shorter version of this DNA position (about 6 in 100 people of European ancestry
          do). One Taiwanese study found it less often among people who lived to 95, but a large European study of
          long-lived people did not bear that out, so it is not counted for or against lifespan.
