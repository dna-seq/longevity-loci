# The seed list's locus 50, FOXP2 (7q31.1). Curated 2026-11-11. Lead rs12705966 (Rosoff 2023's mvAge, Supplementary
# Table 6, filed as known through frailty; GRCh38 7:114,608,796 A/G, GRCh37 7:114,248,851), the seed's only rsID here,
# intronic in FOXP2. It is also Timmers 2022's own aging-GIP1 lead at FOXP2. Atkins 2021's frailty lead rs2396766 lies
# 69 kb away at r² 0.21 (mostly another signal, named only). Wright 2019's tables hold no SNP within 600 kb. Open
# Targets 26.09: 34 credible sets hold the lead, one lifespan-class (mvAge's, the lead on top); the rest ADHD, pain,
# sleep, smoking, substance use and education. The GWAS Catalog (2026-10-29) holds three associations for it.
locus_id: 50
locus_name: FOXP2
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: a genome-wide multivariate result with a co-occurring lifespan study (§4.5 as D16 reads
  it), never genome-wide in a lifespan, longevity or healthspan study of its own (D18.3), and not replicated outside
  its inputs. Genome-wide twice, both multivariate and sharing their inputs, so one discovery: Rosoff 2023's mvAge
  (P 9.1e-9; A lowers the factor, so G, the minor allele at about 34 % in Europeans, is on the healthier-ageing side;
  Table 7 and the GWAS Catalog's record anchor it) and Timmers 2022's aging-GIP1, where the lead is the locus's own
  lead (G raising it, P 7e-10; an "adjusted" estimate beside it halves the β, P 7.9e-4, the adjustment unstated).
  Timmers 2019's million parents' lives are the co-occurring lifespan study (D16): G lengthens life, P 0.0016, UK
  Biobank and LifeGen on the same side. Every input leans G's way: frailty P 1.8e-7, healthspan P 0.022 after the
  deposit's genomic control (one-sided 0.011), Deelen 2019's 90th percentile P 0.10 (one-sided 0.050, just short) and
  99th 0.32. Outside the inputs, nothing replicates and the one powered look goes against. FinnGen's death endpoint
  puts G on the side of more deaths, P 0.035. Carried into FinnGen by APOE's factor (0.99), Timmers' effect predicts
  G −0.013 on the log odds of death: heterogeneity P about 9e-4 (both SEs), but one-sided power only 0.50, so by D21
  (power at least 0.8 and heterogeneity P below 0.05) it is no red flag, and Figure 4's smaller mean factor gives less
  (power 0.17, heterogeneity P 0.006).
  Timmers 2022's survival look-up in FinnGen with Biobank Japan, mostly the same Finns, agrees in sign (G −0.086
  years, SE 0.122, one-sided P 0.76 for aging-GIP1's direction). Its SE is about 1.8 times that of look-ups at a like
  frequency, since G is 0.02 in East Asians and Biobank Japan adds almost nothing. Scaled by the mean over the other
  look-ups that hold up there (D25.12; 7.0 years per unit), the expected gain is 0.16 years at power 0.38; APOE is not
  among them. No red flag under any factor computed, so no `replication_failed` and not D: D25.1 and D26.8 both need a D21 red
  flag, and the one powered-looking result here is half-powered. The Finnish data lean against G and the row says so. Wright 2019's AncestryDNA tables print only SNPs below about 2.5e-3
  and hold none within 600 kb, so that look-up is unread, not null. Atkins 2021's frailty hit nearby (rs2396766, P
  1.2e-9) is r² 0.21 to the lead and colocalises with aging-GIP1 at H4 0.76 only: a healthspan-class result on mostly
  another signal, named and not counted (D22.2). Mechanism: ageing in general (D25.7). Every Open Targets set at the
  locus is behavioural or psychiatric, or pain: per G, less ADHD (the lead tops the ADuLT sets, β −0.026, PIP 0.20)
  and a lower pain factor (Tsepilov's, led by the lead); at proxies in Timmers 2022's look-ups (r² 0.67 to 0.94),
  less ADHD or cannabis use, shorter sleep, fewer sexual partners, lower risk tolerance, a higher household income
  and fewer years of education. Nothing shows the lifespan effect runs through one of them, so the pleiotropy is broad
  and actionability descriptive. No trade-off (D18.1): no disease runs with G, and fewer years of education is not a
  harm quoted for G. Causal confidence C2: in mvAge's PICS set the lead is the top variant at PIP 0.148. Effector E2
  FOXP2: locus-to-gene 0.92 (MDFIC 0.07, no rival), and no QTL colocalises with that set. The longer-life G is the less
  common allele, so the most common genotype, A/G (about 45 in 100 at gnomAD's non-Finnish European frequency, A/A 43),
  is the reference, with no PROTECT token, as at row 29. Healthspan + (Zenin, one-sided 0.011), lifespan + (Timmers,
  0.0016; FinnGen's opposite lean named, nominal against nominal, weaker than D26.6's genome-wide opposite), exceptional
  survival 0 (Deelen one-sided 0.050 and 0.16). No context token: the survival look-up spans Biobank Japan, as at rows
  25 and 29, though at G 0.02 Japan adds almost nothing, so in substance the support is European. Age of action is
  unknown.
