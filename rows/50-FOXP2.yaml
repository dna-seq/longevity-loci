variants:
  - rsid: rs12705966
    gene: FOXP2
    phenotype: FOXP2 region, ageing and behaviour
    trait_efo_id: EFO_0007796
    effect_allele: G
    effect_size: 0.0060
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: protective
        conclusion: >-
          You carry two copies of the less common version of this DNA region (about 12 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, each copy went with slightly healthier ageing, and parents of carriers lived a
          little longer. A large Finnish study of deaths did not confirm it and leaned the other way, so this is a
          likely finding, not a settled one. The region, in the FOXP2 gene, is also linked to attention, sleep, pain
          and risk-taking. The effect is small and it is a tendency, not destiny.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy of each version of this DNA region (about 45 in 100 people of European ancestry do,
          the most common combination). It is the reference the other combinations are compared with. The region,
          on chromosome 7, lies in the FOXP2 gene and is linked to attention, sleep, pain and risk-taking as well
          as to how people age in general. The finding comes from people of European ancestry; less is known
          elsewhere.
      - genotype: A/A
        state: risk
        conclusion: >-
          You carry two copies of the more common version of this DNA region (about 43 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, this version went with slightly less healthy ageing than the other, and parents of
          carriers lived a little less long. A large Finnish study of deaths did not confirm it, so this is a
          likely finding, not a settled one. The effect is small and it is a tendency, not destiny.
