variants:
  - rsid: rs17782313
    gene: MC4R
    phenotype: MC4R region, body weight, frailty
    trait_efo_id: EFO_0007796
    effect_allele: T
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 58 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome 18,
          lies near the MC4R gene, a brain receptor that helps control appetite and body weight. The findings come
          from people of European ancestry; less is known elsewhere.
      - genotype: C/T
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 36 in 100 people of European
          ancestry do). It goes with slightly higher body weight, and in a very large study with a little more
          frailty and disability in later life; it also goes with slightly more diabetes and heart disease. Its link
          to lifespan itself is only suggestive. Body weight is something you can act on, and the effect of this
          version is small next to that.
      - genotype: C/C
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 6 in 100 people of European
          ancestry do). Each copy goes with slightly higher body weight, and in a very large study with a little more
          frailty and disability in later life, and slightly more diabetes and heart disease. Its link to lifespan
          itself is only suggestive. Body weight is something you can act on, and the effect of this version is
          small next to that.
