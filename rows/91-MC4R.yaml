# The seed list's locus 91, MC4R (18q21.32). Curated 2026-11-14. Lead rs17782313, the seed's only rsID (entered by the
# pleiotropy track alone, as MC4R's body-mass variant): intergenic, about 188 kb downstream of MC4R, GRCh38
# 18:60,183,864 T/C, GRCh37 18:57,851,097; C the higher-BMI allele (0.235 in non-Finnish Europeans), T the longer-lived
# side. Open Targets 26.09: 597 credible sets hold the lead, one of them Foote 2025's frailty factor 6, led by rs476828
# (r² 0.97).
locus_id: 91
locus_name: MC4R
verdict: kept
verdict_reason: >-
  Tier C, the seed's (row 83's shape, short of its B). Foote 2025's frailty factor 6, disability, is genome-wide at the
  locus: rs476828, 1.5 kb away and r² 0.97 with the lead (D′ 1.00, its T on the lead's T in CEU), T less frail, β
  −0.0176, P 8.1e-11 (Q P 0.34); factor 3, multimorbidity, nominal (P 1.1e-4). Foote's deposits hold no line at the
  lead (the four that returned the window; three returned the header alone, unread), so the proxy stands in (D29.3).
  A Genomic SEM factor is multivariate (D27.3) and scores at B only beside a co-occurring lifespan study at P < 0.05
  on the same allele (D16, D18.3) that survives conditioning on the stronger lifespan lines in its window, jointly
  (D30.2). The one candidate is Deelen 2019's 99th percentile: T more often long-lived, β +0.0933, P 0.0079 (one-sided
  0.0039; the 90th leans the same way, P 0.19). Its window (GRCh37 18:57.3-58.4 Mb) holds stronger lines in two
  regions: rs17066892, 220 kb away, P 3.3e-4, with lines of six other frequencies around it (P 0.0013 to 0.0041), and
  a cluster at 57.38-57.47 Mb (P about 0.006), plus rs752720 (P 0.0023). Conditioned on the peak alone the lead keeps
  one-sided 0.029 to 0.035; conditioned jointly on thirteen lines spanning them (rs752720 through a neighbour at like
  frequency, it having no genotypes in Ensembl), it falls to 0.090 to 0.160, on CEU and on all 503 Europeans, by
  haplotypes and by dosages. So the 99th-percentile line is not the locus's own signal and no co-occurring lifespan
  study stands: C (D16). No other lifespan study reaches P < 0.05: Timmers 2019's deposit has only one arm at this
  locus (every line in the window "?+" or "?-", n about 302,000; its standard error, scaled from row 90's, reads as
  LifeGen), T longer, P 0.47; Pilling's UK Biobank parents flat (P 0.71, read at the lead only); Park 2025's own
  survival flat (P 0.93, columns swapped); FinnGen R11's death endpoint T fewer deaths, P 0.24; Zenin 2019's healthspan
  T later, P 0.17. Wright 2019's nearby AncestryDNA lines (72 to 680 kb away) have no CEU LD pair to the lead that
  Ensembl reports, so AncestryDNA is untested. Nothing is genome-wide for a univariate lifespan phenotype, the GWAS
  Catalog holds no lifespan association, and the rsID literature search (Europe PMC, OpenAlex, PubMed, Crossref,
  preprints; Semantic Scholar answered 429, so its part is unchecked) finds obesity studies only. The seed's ground is
  Joshi 2017's Mendelian randomisation over many BMI loci (one BMI unit about 7 months of life), a polygenic
  instrument, not a per-variant result here. Nothing contradicts the locus, so not D. Healthspan + (Foote's factors,
  read for the healthspan cell as at 83); exceptional survival 0 (Deelen's 99th-percentile line, not the locus's own
  once conditioned); lifespan 0 (no study under one-sided 0.05). Red flag unknown (D29.11). Mechanism metabolism,
  through body weight (D30.9, as at 82, whose colocalisations also hang on its multivariate anchor): Foote's factor-6
  set colocalises at H4 ≥ 0.8 with about 300 body-composition sets (86 of them BMI; BMI H4 0.978, C raising BMI with
  frailty), and the lead tops 43 sets, mostly body-composition, BMI and diet (UK Biobank BMI, C +0.056, P 1.5e-45).
  Diseases colocalising run with C where a sign is printed: coronary artery disease (H4 0.969; its own set genome-wide
  at rs476828, C raising it, P 1.3e-10), type 2 diabetes (H4 0.956; two other diabetes sets print the other sign, most
  none), heart failure and gout. T goes with higher HDL cholesterol, eGFR and SHBG, and with more self-reported worry
  and nervous feelings (worry H4 0.970): no disease or established risk factor on the longer-lived side, so no
  tradeoff; worry named. Pleiotropy mech:adiposity and broad. Modifiable through weight (D18.2, D30.9). Causal C3: in
  Foote's set the lead sits at posterior 0.035. Effector E2, MC4R: locus-to-gene 0.609 on Foote's set (PMAIP1 0.081
  next), no QTL colocalisation. C is the minor allele at 24 %, so T/T, the commonest genotype, is the reference; the
  protection is the absence of the higher-BMI allele's risk (PROTECT:ABSENCE_OF_RISK, D30.6: coronary artery disease
  genome-wide at the proxy and colocalising): T/C and C/C risk. Age of action unknown. The evidence is European.
