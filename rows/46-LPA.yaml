# The seed list's locus 46, LPA (6q26). Curated 2026-11-10 from the full texts of five articles; the first curated
# row, shown to the lead as the format's first real use. Lead rs10455872; rs55730499 (r² 0.97, Joshi 2017) is the
# same signal and appears only as a proxy on the studies that reported it. The seed's other LPA-region rsIDs
# (rs111333005, rs186696265, ...) are secondary signals not read here: see the verdict reason.
locus_id: 46
locus_name: LPA
verdict: kept
verdict_reason: >-
  Tier A confirmed. Genome-wide significant for parental lifespan in about one million lives (Timmers 2019, P 8.5e-25)
  and for healthspan (Zenin 2019); replicated in subjects' own survival past 90 in CHARGE-EU 90+ at the lead itself,
  same allele and direction (Joshi 2017, P 0.002, nominal, no effect size given), and nominal at the 90th percentile
  in Deelen 2019's data (via Timmers 2020, P 0.007). The caveat on independence: the parental-lifespan GWAS (Joshi,
  Pilling, Timmers 2019) share UK Biobank and the LifeGen cohorts, and the text does not say whether CHARGE-EU 90+'s
  cohorts overlap the 26 discovery cohorts; the phenotype differs (own survival past 90 against parents' survival).
  Secondary LPA-region signals (rs186696265, rs111333005, ...) need a conditional analysis to be rows of their own and
  are not scored here. Timmers 2019's Figure 5 source data lean with the mid-life reading: fathers' effect halves
  after 60 (0.137 and 0.136 at 40-60, 0.072 to 0.053 at 60-90) while mothers' holds (0.083, 0.083, 0.058), and the age
  moderator is nominal (P 0.040) and fails the paper's 5 % FDR (Q 0.76), so DIRECT_WEAK stays.
