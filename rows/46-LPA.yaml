variants:
  - rsid: rs10455872
    gene: LPA
    phenotype: Lp(a) and heart disease
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: 0.7639
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 85 in 100). It is the reference the other versions are compared with, so it neither raises
          nor lowers your expected lifespan here. The region controls how much lipoprotein(a), or Lp(a), the
          liver makes; high Lp(a) raises the risk of heart attack. A standard blood test your doctor can order
          shows your actual Lp(a) level, which matters more than this DNA result. The finding is well
          established in people of European ancestry and less is known elsewhere.
      - genotype: A/G
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 15 in 100 people of European
          ancestry do). This version tends to raise lipoprotein(a), or Lp(a), a blood fat that raises the risk of
          heart attack, and in very large studies its carriers' parents lived on average about four to five months less
          per copy, mostly through heart disease before about 80. The finding is well established, but it is a
          tendency, not destiny: most carriers live ordinary lifespans. A standard blood test your doctor can
          order shows your actual Lp(a) level, which matters more than this DNA result.
      - genotype: G/G
        state: risk
        conclusion: >-
          You carry two copies of a rare version of this DNA region (fewer than 1 in 100 people of European
          ancestry do). This version tends to raise lipoprotein(a), or Lp(a), a blood fat that raises the risk of
          heart attack, and in very large studies each copy went with parents living on average about four to
          five months less, mostly through heart disease before about 80. The finding is well established, but it is
          a tendency, not destiny. A standard blood test your doctor can order shows your actual Lp(a) level,
          which matters more than this DNA result.
