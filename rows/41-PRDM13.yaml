# The seed list's locus 41, PRDM13 (6q16.2; the seed's genes "PRDM13;TSTD3", the paper's CCNC, PRDM13). Curated
# 2026-11-11. Lead rs114658003 (GRCh38 6:99,603,424, GRCh37 6:100,051,300; the seed's only rsID), Gurinovich
# 2021's NECS centenarian SNP (Supplement Table 1, main Table 2). A is common in Europeans (about 0.10) but nearly
# absent in the paper's samples. The deletion rs66927770 one base before it travels with A
# (r² 1.00) and stands in for it where a file lacks the SNP. No other seed locus lies near it.
locus_id: 41
locus_name: PRDM13
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's B: a genome-wide centenarian result that the larger European tests contradict, which §4.1
  files as "explicitly contradicted" (D25.1). Gurinovich 2021 compared 1,320 New England Centenarian Study
  centenarians (median age 104) with 2,899 controls, HRC-imputed. A was in 0.67 % of the centenarians' alleles and
  0.04 % of the controls': score Z +5.51, P 3.58e-8, just past genome-wide (Supplement Table 1). The paper prints no
  effect size. The crude odds ratio from the two frequencies is about 16.9, derived, and rests on about 2 expected
  copies among the controls. The paper doubts it itself. Its table footnote and Discussion say the imputed frequency
  is far from dbSNP's European one, "lowering the confidence that this association is a true positive". Every
  reference sample puts A near 0.10 in Europeans: gnomAD's non-Finnish Europeans 0.097, 1000 Genomes EUR 0.11, Finns
  0.17. NECS's controls' 0.0004 is two orders of magnitude lower. The Ashkenazi replication (LGP, 312 centenarians,
  638 controls) prints A at 0 and 0.000002, where gnomAD's Ashkenazi Jews have 0.13, so it held no carrier, and its
  Z −1, P 0.6 tests nothing. That is untested, not failed. The deletion rs66927770 one base before the SNP has the
  same count in gnomAD and r² 1.00 in CEU, and dbSNP also lists the two as one CG>A record. A plausible cause is that
  the imputation called A apart from its deletion, but that is derived: the panel's site list is not read. Either
  way the result does not hold for the A a genome file reports. If the NECS A is that A, the European tests are
  D21's powered test. Deelen 2019 types it through the deletion: at the 99th percentile the deletion with A gives
  β +0.027 (SE 0.056), P 0.63, NECS's way but flat. Against NECS's crude log odds ratio 2.83 (SE about 0.51),
  one-sided power is about 1.00 and heterogeneity z about 5.4. Both conditions hold down to about a twentieth of
  NECS's effect (factor 0.055), so the flag needs no calibration between the two extreme-survival scales. Deelen's
  90th percentile is the same (P 0.28). FinnGen's death endpoint is null at the lead, leaning the other way (A 0.17,
  P 0.49). If the NECS A is something else, nothing measures the A a genome file reports. Neither reading leaves A
  protective. One thing leans NECS's way: Timmers 2019's parental lifespan has no line for the SNP or the deletion,
  but its r² 0.61 proxies, whose minor alleles ride with A, give one-sided P about 0.02 to 0.03 (rs12660804 P 0.040
  two-sided). At r² 0.6, below the 0.8 the rows use, with the phase derived, and with FinnGen leaning the other way
  at the same proxies and Deelen flat, it is named, not counted as D25.1's independent support; that reading is put
  to the lead, and C (as row 19) is the alternative. Healthspan is untested: Zenin 2019's file has no line for the
  SNP or the deletion, and the r² 0.61 proxies are flat (P about 0.39). Lifespan is 0 (FinnGen at the lead) and
  exceptional survival 0 (Deelen through the deletion). The GWAS Catalog records no other trait, so the mechanism is
  unknown, filed as general ageing as row 26 is. Open Targets 26.09 has no record of the SNP or of the deletion, and
  none of Gurinovich's five sets lies here, so causal and effector confidence are C4 and E4 and no gene is named. Age
  of action is unknown.
