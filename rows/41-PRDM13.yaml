    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one most people of European ancestry
          have (about 81 in 100). It is the reference the other combinations are compared with. The region, on
          chromosome 6, lies between genes, near PRDM13, and no gene is known to matter here. A link between this
          region and reaching 100 was reported once, and the study's own authors doubted it.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy of a version of this DNA region that about 18 in 100 people of European ancestry carry.
          One American study of people who reached 100 reported it as rare and more common among them, but it
          measured this version far less often than it really occurs, and its authors doubted the result. Larger
          studies found no link. It says nothing about your own lifespan.
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of a version of this DNA region (about 1 in 100 people of European ancestry do). One
          American study of people who reached 100 reported it as rare and more common among them, but it measured
          this version far less often than it really occurs, and its authors doubted the result. Larger studies
          found no link. It says nothing about your own lifespan.
