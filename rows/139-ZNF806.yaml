    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (nearly everyone of European ancestry, and
          about 79 in 100 people of East Asian ancestry, do). It is the reference the other combinations are compared
          with. The position lies on chromosome 2, in a stretch of non-coding RNA.
      - genotype: G/T
        state: risk
        conclusion: >-
          You carry one copy of a version of this DNA position found mainly in people of East Asian ancestry (about 20
          in 100 carry it, and almost no one elsewhere). One Taiwanese study found it less often among people who
          lived past 85, in one hospital; its check at a second hospital is unclear, and it has not been confirmed
          independently. This is weak, early evidence: a possible tendency, not destiny.
      - genotype: G/G
        state: risk
        conclusion: >-
          You carry two copies of a version of this DNA position found mainly in people of East Asian ancestry (about 1
          in 100 of them do). One Taiwanese study found single copies less often among people who lived past 85, a
          finding not yet confirmed, so nothing separate can be said about two copies.
