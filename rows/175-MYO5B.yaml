      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as almost everyone of European ancestry
          does. It is the reference the other combinations are compared with. The position lies in the MYO5B gene on
          chromosome 18.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of a rare T version of this DNA position (about 6 in 10,000 people of European ancestry
          do, and it is much more common in people of African ancestry). One American study found it more often among
          people who reached 100 than among younger people. No other study has been able to check it, so it is a
          single early finding and a tendency, not a guarantee.
      - genotype: T/T
        state: protective
        conclusion: >-
          You carry two copies of a rare T version of this DNA position, which is very uncommon in people of European
          ancestry. One American study found the T version more often among people who reached 100 than among younger
          people, but no one with two copies was studied separately and no other study has checked it. It is a single
          early finding and a tendency, not a guarantee.
