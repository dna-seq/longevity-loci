    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as nearly everyone does. It is the
          reference the other combinations are compared with. The position lies at the start of the PRAC2 gene on
          chromosome 17.
      - genotype: T/TG
        state: protective
        conclusion: >-
          You carry one copy of a version of this DNA position with one extra DNA letter, very rare in people of
          European ancestry (about 1 in 1,000) and more common in people of African ancestry (about 3 in 100). One German study found it five times among 1,245 very long-lived people and
          never among 4,105 younger people. Little is known about the PRAC2 gene. It rests on a handful of carriers and
          has not been confirmed, so this is weak, early evidence: a possible tendency, not destiny.
      - genotype: TG/TG
        state: protective
        conclusion: >-
          You carry two copies of a version of this DNA position that is very rare in people of European ancestry; the one study
          of it found no one with two copies. One German study found single copies a few times among very long-lived
          people, a finding not yet confirmed, so nothing can be said about two copies.
