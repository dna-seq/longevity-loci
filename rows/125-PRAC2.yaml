# The seed list's locus 125, PRAC2 (17q21.32). Curated 2026-11-15. Lead rs199607933, the seed's only rsID (Kolbe
# 2025's German exome study): a one-base G insertion, T/TG at GRCh38 17:48,724,360 as the paper prints it (Ensembl's
# G/GG one base on, the same event; GRCh37 17:46,801,723), multi-allelic (G/GG/GGG). On PRAC2's MANE Select transcript
# it is a 5′ UTR variant; only on another PRAC2 transcript (ENST00000432056) is it the frameshift the paper names.
# HOXB13 lies 402 bases away. TG is rare in Europeans (0.047 % in gnomAD's non-Finnish European exomes) but not
# elsewhere (African 1.7 %, East and South Asian and admixed American 0.3 to 0.4 %); the discovery's longer-lived side. Open Targets 26.09 has no record under either form; the GWAS Catalog (2026-10-29)
# holds no association.
locus_id: 125
locus_name: PRAC2
verdict: kept
verdict_reason: >-
  Tier C, the seed's: a sub-genome-wide discovery in one sample, old against young (R-TIER-2), unreplicated (§4.1's
  C). Kolbe 2025 sequenced the exomes of 1,245 German long-lived individuals (past the 95th age-at-death percentile
  of their birth cohort) and 4,105 younger controls; TG was at 0.20 % among the long-lived and in no control, OR 36.3
  (Haldane-corrected), P 8.1e-7, FDR-adjusted 0.025 under the paper's exploratory false-discovery rate of 0.05, its
  own exome-wide call, not a genome-wide one (R-TIER-4, D31.13). On 2,490 and 8,210 alleles that is 5 copies against
  none (the Haldane OR from 5 and 0 is 36.3, derived). The calls were merged jointly and variants missing in over
  5 % of samples dropped, so the controls' zero is a call, not a gap; principal-component outliers were removed and
  the single-variant test shows no population structure, which argues against long-lived people of other ancestry
  supplying the copies, though the insertion's higher frequency outside Europe (African 1.7 %) leaves that open. The reference D31.13 fixes for an exome study is gnomAD's
  non-Finnish European exomes (0.047 %, 435 copies): the controls expect 3.9 copies and show none, P 0.021, a fit,
  though a close one (against the genomes, 0.057 %, 4.7 and P 0.009, or 0.012 counting the reference's own sampling
  error, a branch named), so the paper is read as printed (D31.10 not met). Pooled over rows 120, 124 and 125, whose controls each fit,
  Kolbe's controls show 1 copy where 8.3 are expected (P 0.0024, derived): a paper-level pattern the per-row 0.01
  line cannot see, named and put to the lead with the per-row reading as the default. Against the exomes the long-lived show 5
  where 1.2 are expected (exact Poisson P 0.0072, derived); the paper's own OR against gnomAD is 4.19, with its caveat
  that gnomAD's non-Finnish Europeans are mostly British. By the printed percentages and the long-lived's 2.7:1 women to
  men, about 2 copies in 336 men and 3 in 909 women (derived): both sexes here, though men's share (2 of 5) is above
  their 27 % of the long-lived, and pooled over Kolbe's rows 107, 120, 121, 124, 125 and 126 about 24 of 35 long-lived
  copies are in men (derived), named, no token. No
  look-up tests it: the Ashkenazi sample holds only three of the seven variants, not this one, and none of the Leiden
  carriers named is this one (179 long-lived and 98 controls expect 0.17 and 0.09 copies). At 0.05 % the insertion is
  absent from every large sample read here: FinnGen R11's deaths, Deelen 2019 (whose 17:46,801,724 line is a
  neighbouring SNV, not this insertion, and whose strongest window lines, 17:46,831,261 at 0.01 and 17:47,164,186 at
  0.04, P 0.0017 and 5.6e-4, cannot tag it), Timmers 2019, Pilling 2017, Zenin 2019, Park 2025 and Foote 2025; Wright
  2019's strongest line within 500 kb, the mothers' rs9899580 305 kb away (P 5.6e-6), is common and cannot tag it:
  untested, not negative. The literature search (the rsID; Semantic Scholar answered 429, its part unchecked) finds
  Kolbe alone; the five papers citing Kolbe (Semantic Scholar, 2026-11-15) are two reviews, an
  unrelated study, a machine-learning study of GenAge and the 2026 bioRxiv functional study read for row 120, which
  edits variants in other genes; none tests this one. Exceptional survival + (the discovery, read as printed; against the exome reference
  too); lifespan untested; healthspan untested. Mechanism ageing in general (D25.7): the authors know of no prior
  link of PRAC2 to mTOR signalling or longevity; nothing recorded at the variant. Causal C4: no Open Targets record.
  Effector E4, put to the lead (default): the paper calls it a frameshift, but on the MANE transcript it is a 5′ UTR
  change and the frameshift is on a minor isoform, so §4.2's coding clause is not plainly met; the alternative is E1
  PRAC2. Descriptive. Age of action unknown. The evidence is European (German).
