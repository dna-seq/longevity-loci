variants:
  - rsid: rs62127362
    gene: ""
    phenotype: CEP89 region, longevity
    trait_efo_id: OBA_VT0005372
    effect_allele: G
    effect_size: 1.15
    effect_measure: OR
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 77 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome 19,
          lies within the CEP89 gene.
      - genotype: C/G
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 21 in 100 people of European
          ancestry do). In a large international study it was a little less common among people who lived to very old
          ages. The finding fell short of the strictest statistical bar, and a much larger study of parents' lifespans
          found a smaller effect than expected, so this is an uncertain finding: a slight tendency, not destiny.
      - genotype: C/C
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 2 in 100 people of European
          ancestry do). In a large international study each copy went with slightly lower odds of living to very old
          ages. The finding fell short of the strictest statistical bar and a larger study found a smaller effect, so
          this is an uncertain finding: a slight tendency, not destiny.
