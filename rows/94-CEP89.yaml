# The seed list's locus 94, CEP89 (19q13.11). Curated 2026-11-14. Lead rs62127362, the seed's only rsID (Deelen 2019's
# trans-ethnic 90th percentile table, a tier C vote): intronic in CEP89, GRCh38 19:32,967,573, GRCh37 19:33,458,479,
# G/C, G ancestral and common (C 0.12 in non-Finnish Europeans, 0.28 in East Asians); G the longer-lived allele.
locus_id: 94
locus_name: CEP89
verdict: kept
verdict_reason: >-
  Tier C, the seed's: a suggestive longevity association never genome-wide, with `replication_failed`. Deelen 2019's
  trans-ethnic meta-analysis of the 90th percentile age against all controls (Table 4, every locus at P ≤ 1e-6) has C
  lowering the odds, OR 0.87 (0.82–0.93), P 4.3e-7, heterogeneity P 0.19; the authors find no new genome-wide locus in
  it besides APOE and IL6. The European deposit alone is as strong: C β −0.156 (SE 0.030), P 1.7e-7, effective N
  11,615; the 99th percentile C −0.219, P 2.3e-6, its cases a subset of the 90th's, so confirming nothing. Suggestive,
  §4.1's C; R-TIER-4 keeps a sub-genome-wide hit off A and B. Timmers 2019's parental lifespan (639,111 lives, UK
  Biobank and LifeGen, some LifeGen cohorts among Deelen's, D19.1) leans G's way, C −0.0087 (SE 0.0060), P 0.15,
  one-sided 0.074, not nominal. Against Deelen's European 90th effect carried to that scale (D21 under both of
  D25.3's calibrations, row 45's arithmetic) it is powered and the two differ: APOE's factor 4.84 predicts +0.032 per
  G, one-sided power 1.00, heterogeneity P 0.006; the loci's mean factor +0.077, power 1.00, P 2e-5. A red flag
  under both, so `replication_failed`, as at 45. It is not D (D26.8): Pilling 2017's UK Biobank parents' attained age,
  outside Deelen's samples, gives G longer at one-sided 0.038 (P 0.076), an independent scoring-class p < 0.05 in the
  discovery's direction, D25.1's exception (as 74). Those parents are also inside Timmers' meta-analysis, which fails
  the effect size: read together, a smaller effect than Deelen's, or a chance lean. Flat elsewhere: Park 2025's own
  survival (P 0.73, its allele columns swapped), Zenin 2019's healthspan (P 0.78), Foote 2025's five readable frailty
  factors (P 0.086 to 0.56; the general and metabolic factors' deposits returned the header alone, unread). FinnGen
  R11's death endpoint has no line at the lead. Wright 2019's nearest AncestryDNA line is a viability one, rs745961
  (88 kb, r² 0.055 in CEU), which does not tag the lead and would only confirm (D23); no parental line within 500 kb.
  Rosoff 2023's mvAge lead tables hold no line. The rsID literature search (Europe PMC, PubMed, OpenAlex, Crossref,
  preprints; Semantic Scholar 429, its part unchecked) finds Deelen 2019 alone. Exceptional survival + (Deelen's
  discovery); lifespan + (Pilling, one-sided 0.038, nominal, with Timmers leaning the same way); healthspan 0 (Zenin).
  Mechanism general ageing: Open Targets holds the lead in five sets, all CEP89 expression or transcript QTLs
  (posterior 0.07 to 0.14), and in no GWAS set, so nothing ties the longevity signal to a gene or a trait; CEP89 is
  named in prose. Pleiotropy empty, descriptive. Causal C4 and effector E4, no gene: no lifespan-class set holds
  the lead. G/G, about 77 in 100 Europeans, is the reference (§6.2); C/G and C/C carry the lower odds. No PROTECT
  token: no disease is known at the locus (D30.6). Age of action unknown. The evidence is mostly European:
  the European deposit alone carries the signal.
