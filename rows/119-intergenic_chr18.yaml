variants:
  - rsid: rs1468966
    gene: ""
    phenotype: 18q12.1 intergenic lncRNA, longevity, Taiwanese
    trait_efo_id: OBA_VT0005372
    effect_allele: A
    effect_size: 1.17
    effect_measure: OR
    stat_significance: nominal
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA position in Europeans (about 58 in 100 people of
          European ancestry and 28 in 100 of East Asian ancestry have this). It is the reference the other
          combinations are compared with. The position lies far from any gene on chromosome 18. One Taiwanese study
          linked the other version to living past 90, but large European studies found no such link, so it is not
          counted for or against lifespan.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy of a version of this DNA position that about 36 in 100 people of European ancestry and
          half of people of East Asian ancestry carry once. One Taiwanese study found it more often among people who
          lived past 90, but large European studies did not confirm it, so it is not counted for or against lifespan.
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of a version of this DNA position (about 6 in 100 people of European ancestry and 22 in
          100 of East Asian ancestry do). One Taiwanese study found the version more often among people who lived past
          90, but large European studies did not confirm it, so it is not counted for or against lifespan.
