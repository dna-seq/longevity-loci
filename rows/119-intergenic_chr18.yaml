# The seed list's locus 119, "intergenic chr18" (18q12.1). Curated 2026-11-15. Lead rs1468966, the seed's only rsID
# (Hsieh 2026's Taiwanese suggestive locus at 90 and over, the paper of row 113): intronic in a lncRNA in a gene desert,
# GRCh38 18:29,092,290 G/A, GRCh37 18:26,672,254, A 0.47 in East Asians and 0.24 in Europeans, the discovery's
# longer-lived allele (the seed's pro allele). Open Targets 26.09 has no record of the variant under either allele
# order; the GWAS Catalog (2026-10-29) holds no association.
locus_id: 119
locus_name: intergenic chr18
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's C: a sub-genome-wide East Asian discovery whose controls misfit the reference, read against
  the reference (D31.10), and contradicted there by powered European tests at the lead itself (D22.3, row 113's shape;
  113's controls misfit only gnomAD's East Asians, within East Asian spread, while these are short of every
  reference; D21's red flag on Deelen's same-scale lines, D26.11, D31.13). Hsieh 2026 compared 922 Taiwanese hospital patients who died at 90 or over with 871
  who died at 65 to 75 at the same hospital: A (0.466) OR 1.49 per A, P 1.6e-6, under the paper's suggestive line of
  1e-5. Solved from the OR and the counts, reading the printed frequency as pooled over cases and controls (the column
  moves with the case group: rs75737809 0.023 at 85, 0.026 at 90, the controls shared), the controls carry A at about
  0.415 and the long-lived at about 0.514, against the paper's own Taiwan Biobank 0.474: the controls short (P 9e-7),
  the long-lived over (P 6e-4; derived). So the case-control OR is named, not read (D31.10): against Taiwan Biobank
  the long-lived give A OR 1.17 (log 0.160, SE 0.047), P 6e-4 (gnomAD's East Asians 1.22, 1000 Genomes' 1.15), a
  nominal signal, not an overfit source (D31.11 not reached). The validation cohort's OR 1.578 (P 0.003) shares the
  controls problem of row 113 (Fig. 2 sets its 85-and-over cases against controls aged 65 to 75 not its own): not
  counted as independent (D19.1; put to the lead); pooled with the discovery it would reach P 1.6e-8 (derived), still
  D under D22.3. The European tests at the lead: Deelen 2019's 90th percentile A (0.25) +0.0016 (SE 0.022), P 0.94,
  and 99th +0.0059, P 0.86; against the reference read, power 1.00 and heterogeneity P 0.002 (90th), 0.008 (99th;
  derived), two log odds of long-lived status (D26.11), which carry `replication_failed` and hold down to 0.35
  (90th) and 0.58 (99th) of the reference read (derived). Timmers 2019 at the lead flat: A +0.0023 per self (SE
  0.0046), P 0.62. Hsieh's own APOE line is null (ε4 OR 0.96, P 0.82, Table S5), so D25.3, which is study-specific,
  gives no factor for a Hsieh discovery (D31.13): on Deelen's borrowed factors the reference read would predict A
  +0.033 or +0.079 there (heterogeneity P 0.0038 and 0.0010; under the printed OR 6.6e-6 and 2.5e-6, derived),
  stated as approximate, and it sets no flag. The LD differs by ancestry: the lead's best European partners reach r² 0.80, and fourteen of its Han
  Chinese partners at r² 0.8 sit below 0.5 in Europeans; Timmers at the two strongest of them, rs9952328 and rs7243508
  (r² 0.98 and 0.96 in CHB, 0.45 in CEU), is as flat (P 0.65, 0.71); of the fourteen, ten are in Timmers' window, all
  flat (P 0.31 to 1.00, none at one-sided 0.15), and four have no line there, untested. So the European null covers
  the haplotype the Taiwanese study tested as far as its partners show. Outside Timmers: Park 2025's own survival has
  A with more deaths, flat (P 0.18, one-sided 0.094 against; columns swapped, as at APOE; UK Biobank; on the
  borrowed factor it would flag, P 3.7e-4, approximate and no flag, D31.13); FinnGen R11's
  death endpoint flat (P 0.75), a database line; Pilling 2017 flat (P 0.45 to 0.93, inside Timmers); Zenin 2019's
  healthspan flat (P 0.63); Foote 2025 mixed: the general factor puts A frailer (P 0.0017), factors 3 and 4
  (multimorbidity, metabolic) less frail (P 0.0027, 0.0024); they do not keep the row off D as row 18's healthspan
  lean did, since the general factor runs the other way and a healthspan result replicates nothing on its own (D22.2;
  put to the lead). Wright 2019's one line within 500 kb, rs1692526 (422 kb), has no CEU pair: AncestryDNA untested.
  Timmers' strongest line within 500 kb is P 0.0032, Deelen's 5.6e-4: nothing suggestive. The literature search finds
  nothing for the rsID (every source answered); Hsieh is found by its PMID, and its one citing paper is a polygenic
  score. The claim is Taiwanese; the ancestry is named here, not as a context token (D30.15), and its view waits on
  D7. Every genotype neutral (D25.2). Outcome cells 0: exceptional survival and lifespan, nothing passes either way at
  one-sided 0.05 (Park 0.094 against), and a D row's discovery gives no + (D28.10); healthspan 0 on Foote's
  factors pointing both ways at nominal P (D31.13), Zenin flat. Mechanism ageing in general (D25.7): intronic in a lncRNA, CDH2 the only protein-coding
  gene within 1 Mb (about 914 kb), nothing recorded at the variant. Causal C4 and effector E4: no Open Targets record
  either way. Descriptive. Age of action unknown.
