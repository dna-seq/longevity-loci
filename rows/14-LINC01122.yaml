variants:
  - rsid: rs980183
    gene: ""
    phenotype: LINC01122 region, blood sugar and weight
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: 0.0063
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA region (about 38 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. The region, on chromosome 2,
          is linked to blood sugar, type 2 diabetes and body weight. The finding comes from people of European
          ancestry; less is known elsewhere.
      - genotype: A/G
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 47 in 100 people of European
          ancestry do, the most common combination). In very large European studies that combined healthspan,
          frailty, long life and biological age into one measure, this version went with slightly less healthy
          ageing, and parents of carriers lived a little less long. The same version goes with slightly higher
          blood sugar, a slightly higher risk of type 2 diabetes and a slightly higher BMI. It is a likely finding,
          not a settled one: it has not yet been confirmed in a separate group of people. The effect is small and
          it is a tendency, not destiny.
      - genotype: G/G
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 15 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, each copy went with slightly less healthy ageing, and parents of carriers lived a
          little less long. The same version goes with slightly higher blood sugar, a slightly higher risk of type
          2 diabetes and a slightly higher BMI. It is a likely finding, not a settled one: it has not yet been
          confirmed in a separate group of people. The effect is small and it is a tendency, not destiny.
