# The seed list's locus 14, LINC01122 (2p16.1). Curated 2026-11-11, the second run's fourth row. Lead rs980183
# (Rosoff 2023's mvAge, Table 1), the seed's only rsID here: an intron variant of the LINC01122 transcript. Wright
# 2019's tables hold four AncestryDNA mothers' SNPs within 0.5 Mb (rs7593324, 0.25 Mb away, genomic-control P 4.5e-5;
# rs10210385, rs1796435, rs13416859), none in Ensembl's EUR window around the lead and none with a pairwise LD
# Ensembl returns in EUR or CEU, floor off: unknown, not read; its current-age SNPs (confirmation only) are not read
# either. Open Targets 26.09: mvAge's and type 2 diabetes's credible sets, both led by rs980183, and 268 more sets
# at the locus; the GWAS Catalog (2026-10-29) holds 13 associations for it.
locus_id: 14
locus_name: LINC01122
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: a genome-wide multivariate result with a co-occurring lifespan study (§4.5 as D16
  reads it), and no independent replication (§4.1's single-study clause). Genome-wide significant only in Rosoff
  2023's mvAge, the common factor behind healthspan, frailty, exceptional longevity, parental lifespan and
  epigenetic age (P 1.8e-9, G lowering the factor, so A, the major allele at 62 % in Europeans, is on the
  healthier-ageing side); Rosoff lists it as novel, more than 1 Mb from every locus of the five input studies.
  Timmers 2019's million parents' lives are the co-occurring lifespan study: A lengthens life at P 2.3e-5, nominal,
  UK Biobank and LifeGen on the same side. Healthspan agrees nominally: A delays the end of healthspan in Zenin
  2019's UK Biobank (P 0.033). Exceptional survival is 0: Deelen 2019's summary statistics lean to A at the 90th
  (P 0.18) and 99th percentiles (P 0.060) and pass at neither. All three are inputs to mvAge (Deelen through its 90th, whose cases hold the 99th's), so
  nothing here replicates it; Wright 2019's AncestryDNA mothers have a SNP 0.25 Mb away at genomic-control P 4.5e-5,
  but no LD to the lead is known, so it is not read. The Q test (P 0.56) finds no sign that the SNP acts off the
  common factor. Mechanism: metabolism. At the lead itself the longer-life A lowers type 2 diabetes (β −0.036 per
  A, P 1e-14, a credible set rs980183 leads), blood glucose (P 4e-12) and triglycerides (P 1e-8); through
  rs6545714, the lead of a UK Biobank BMI set at r² 0.97 whose A travels with the lead's A by frequency (derived,
  not phased), it lowers BMI (P 9e-21). Across the locus's 270 credible sets, diabetes and glycaemia (to 3e-31,
  HbA1c 3e-28) are at least as strong as adiposity (fat mass 8e-26, BMI 1.5e-23), with blood pressure, lipids and
  CRP beside them. Rosoff's own list runs the same way. That is association on one haplotype, not a mediator test.
  Actionability is descriptive: the locus does not act mainly through weight, since glycaemia is as strong and the
  lead itself leads the diabetes and glucose sets, so D18.2's weight label is not applied; and no HbA1c effect is
  cached at the lead for §4.2's preventable label. The trade-off was looked for (D18.1) in the catalog's 13 records
  at rs980183 and the 270 sets' trait list: no harm on the A side, and no bone-density set; most sets are led by
  neighbours whose phase is not read, so none detected is not none. Causal confidence C2, at its floor: rs980183
  leads mvAge's credible set (PICS) at PIP 0.107, with 14 others at 0.056 to 0.069, one signal whose causal variant
  is not resolved; the diabetes set has the same shape (0.13). No locus-to-gene score is given on either set or on
  the BMI set (effector E4, no flag, `gene` empty); LINC01122 names the locus, not an effector. The protection is
  the absence of the risk allele: G shortens life and A is the common one. Age of action is unknown: no cached source
  gives this locus's own age bands.
