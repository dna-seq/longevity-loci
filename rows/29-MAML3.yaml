# The seed list's locus 29, MAML3 (4q31.1). Curated 2026-11-11, the third ten-row run's seventh row. Lead rs36072649
# (Rosoff 2023's mvAge, Table 1; GRCh38 4:140,017,956 T/A, GRCh37 4:140,939,110), the seed's only rsID here, intronic
# in MAML3. Timmers 2022's aging-GIP1 lead rs56172573 is the same signal (r² 0.96 EUR, 0.91 EAS). Wright 2019's
# tables hold two mothers' SNPs in the window: rs769673 (r² 0.70, read) and rs6840907 (no LD returned to the lead, not
# read). Open Targets 26.09: 69 credible sets hold the lead, three led by it, all smoking; none of the eight
# lifespan-class studies has one. The GWAS Catalog (2026-10-29) holds two associations for it (mvAge, smoking
# initiation).
locus_id: 29
locus_name: MAML3
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it, with an independent replication that D18.3 does not let lift it.
  Genome-wide twice, both multivariate and sharing their inputs, so one discovery: Rosoff 2023's mvAge (P 2.0e-8,
  novel; A, the minor allele at 37 %, the healthier one; Table 7 and Table 1 anchor it, Table 6 prints it reversed) and
  Timmers 2022's aging-GIP1 at rs56172573 (r² 0.96, its C with the lead's A; P 7e-9, past the paper's own 5e-8/6).
  Timmers 2019's parental lifespan is the co-occurring lifespan study (D16): A on the longer-lived side, P 3.3e-4, ++
  in UK Biobank and LifeGen. The replication: Timmers 2022 looked its aging-GIP1 leads up in own survival in FinnGen
  and Biobank Japan, 346,726 people with 46,128 deaths, outside UK Biobank, LifeGen and Deelen's cohorts. At
  rs56172573, C adds 0.21 years per copy (SE 0.073), one-sided P 0.002, Bonferroni P 0.049 over 23 SNPs; the abstract
  names MAML3 with HTT as the loci this sample supports. The phase holds in East Asians too (r² 0.91, C 0.33 with A
  0.31). That is §4.1's replication, same allele and direction. It does not make the row A: §4.1's first criterion
  wants a genome-wide lifespan, longevity or healthspan study, and both genome-wide results here are multivariate
  (D18.3); none of the §4.1-class inputs is genome-wide (lifespan 3.3e-4, healthspan 4.7e-4, frailty 0.0025, Deelen's
  90th percentile 0.020). aging-GIP1's self-rated health input reaches z about 6, not a scoring class. Its sheet of
  leads prints an adjusted estimate beside the original (β 0.014 against 0.021, P 2.5e-5), the adjustment not stated
  in the cached text; the signal stays. Row 25 (HTT), replicated in the same look-up, is A because Timmers 2019 had it genome-wide. A further outside look agrees: AncestryDNA mothers at rs769673 (r² 0.70, D′ 0.96; its A with the lead's A),
  P 0.067 (one-sided 0.033, D25.13; 0.041 after Wright's genomic control, derived), heterogeneity with UK Biobank's arm P 0.68, so no red flag (D21); the counted allele is read from Wright's
  own tables at rs6840907, as LifeGen has no row for rs769673. Healthspan is +: Zenin 2019, A delays the end of
  healthspan, P 4.8e-4 (an mvAge input). Exceptional survival is +: Deelen 2019's 90th percentile P 0.020 and 99th
  0.049, A on the long-lived side, one look and an mvAge input. Mechanism: general ageing (D25.7), a mechanism being named only when something shows the effect runs through it.
  The smoking link is real but not shown to carry the effect: the lead itself leads three credible sets, all smoking (ever smoked P 3.7e-9, maternal smoking around birth 4.7e-11, smoking initiation
  1e-9, where A lowers initiation, OR 0.978). The other 66 sets at the locus span smoking again, type 2 diabetes and
  glucose, COPD, coronary disease, depression, pain, visceral fat, walking pace, CRP and lipid fractions. At
  aging-GIP1's lead, the allele with A goes with less smoking (initiation P 6e-24), less type 2 diabetes (2e-12), a
  lower BMI (3e-15), waist-hip ratio and visceral fat, less depression and chronic pain, lower CRP, less reflux and
  more years of education. Every association is on the healthier side, so no trade-off is found (D18.1). It is
  broad: smoking, weight and diabetes are all strong, and nothing shows the lifespan effect runs mainly through one.
  So actionability is descriptive. Unlike CHRNA3/5 (row 80), no smoking-stratified result here says the effect needs
  smoking. Causal and effector confidence are C4 and E4, with no gene named (§4.2). No lifespan-class set holds the
  variant, mvAge's 26 sets in Open Targets include none on 4q31, and aging-GIP1's own fine-mapping prints NA for the
  locus. Locus-to-gene puts MAML3 first in all 69 trait sets (0.66 to 0.87), in prose only, as KLF3 at row 27. The
  protective allele A is the less common one, so the most common genotype, A/T (about 46 in 100), is the reference,
  with no PROTECT token (as at row 25). Age of action is unknown. The evidence is not European only: the FinnGen and
  Biobank Japan look-up spans both.
