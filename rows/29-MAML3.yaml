variants:
  - rsid: rs36072649
    gene: ""
    phenotype: MAML3 region, ageing
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: 0.0060
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of the less common version of this DNA region (about 13 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, each copy went with slightly healthier ageing, and parents of carriers lived a
          little longer. A separate study of people in Finland and Japan agreed: each copy went with about two and
          a half months more life. The same version goes with being less likely to start smoking, a slightly lower
          BMI and a slightly lower risk of type 2 diabetes. The effect is small and it is a tendency, not destiny.
      - genotype: A/T
        state: neutral
        conclusion: >-
          You carry one copy of each version of this DNA region (about 46 in 100 people of European ancestry do,
          the most common combination). It is the reference the other combinations are compared with. The region,
          on chromosome 4, lies in the MAML3 gene and is linked to smoking, body weight and type 2 diabetes as well
          as to how people age in general.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of the more common version of this DNA region (about 40 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, this version went with slightly less healthy ageing than the other, and a separate
          study in Finland and Japan agreed. The same version goes with being a little more likely to start
          smoking, a slightly higher BMI and a slightly higher risk of type 2 diabetes. The effect is small and it
          is a tendency, not destiny.
