variants:
  - rsid: rs76888380
    gene: PLN
    phenotype: PLN region (6q22.31), own survival
    trait_efo_id: OBA_VT0005372
    effect_allele: C
    effect_size: -0.333
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, the one almost everyone of European
          ancestry has, and about 87 in 100 people of African ancestry. It is the reference the other combinations
          are compared with. The position, on chromosome 6, lies in a region near the PLN gene.
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of a version of this DNA position that about 12 in 100 people of African ancestry carry
          and fewer than 1 in 1,000 people of European ancestry. A large British study's published data hint that
          the few European carriers in it died somewhat earlier, but the study's authors did not count it as a
          finding, it rests on a few dozen people, and no other study could check it. Nothing was studied in people
          of African ancestry. It says nothing about your own lifespan.
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of a version of this DNA position (about 4 in 1,000 people of African ancestry do;
          it is almost never seen in people of European ancestry). A large British study's published data hint that
          carriers of one copy died somewhat earlier, but the authors did not count it as a finding, it rests on a
          few dozen people, and no one with two copies was studied. Nothing was studied in people of African
          ancestry. It says nothing about your own lifespan.
