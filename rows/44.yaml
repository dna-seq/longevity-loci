# The seed list's locus 44, unnamed (6q22.31; the seed's gene and name columns empty, PLN its l2g_top). Curated 2026-11-11.
# Lead rs76888380 (GRCh38 6:118,368,937; GRCh37 6:118,690,100, the deposits' build, the 321,163 offset checked on
# rs9320648, quoted at 118,690,014 in LifeGen and Zenin and at 118,368,851 in FinnGen), the seed's only rsID, entered by the methodology
# track from Open Targets' fine-mapping of Park 2025's whole-cohort deposit (GCST90551884), with no tier vote. C
# ancestral and the reference; T is an African-ancestry allele (0.064 in gnomAD's African genomes, 0.00016 in
# non-Finnish Europeans, absent in 1000 Genomes EUR and in Finns). Park's paper names no locus here; the catalog holds
# no association; a literature search on the rsID found nothing (PubMed, Europe PMC, Crossref, OpenAlex and the
# preprint index answered 0; Semantic Scholar was rate-limited, unchecked).
locus_id: 44
locus_name: ""
verdict: re-tiered
verdict_reason: >-
  Tier D, "overfit source" (D26.7); the seed gave none. The only evidence is a line in Park 2025's deposited summary statistics that the paper
  itself does not report. Park's whole-cohort own-survival scan of 393,833 UK Biobank participants of European
  ancestry tested variants at MAF 0.1 % or more and found two genome-wide loci, APOE and ZSCAN23 (row 36). The
  deposit also holds rs76888380 at P 8.9e-9, with T, the minor allele, at about 3.5 in 100,000 (under the deposit's
  swapped allele columns, row 36): about 28 copies of T among 393,833 people (derived), some thirty times below the
  paper's own threshold. Each T goes with a Martingale residual 0.33 higher (more deaths than expected), about 25
  times APOE ε4's per-allele effect, from a linear mixed model run on a few dozen carriers. Nine variants within 101
  kb pass 5e-8 together, all at the same frequency and effect; three of them read in gnomAD (rs78528818, rs73768654,
  rs73768634) are, like the lead, African-ancestry alleles (5 to 7 in 100 there, 1 or 2 in 10,000 in Europeans): one
  rare African haplotype carried by a few dozen of the cohort's European-ancestry participants. Open Targets
  fine-maps the deposit to a 21-variant set led by the lead (PIP 0.12, P 7.7e-9), flagged for quality and fine-mapped
  without an in-sample LD reference; the set's β (−0.0088) is about 40 times smaller than the deposit's and its
  allele unstated, so it is read for nothing. Park's second sex scan (GCST90551886, n 212,863: the whole
  cohort less the men's 180,970, so the women, derived) gives the lead P 3.5e-8 at a similar effect, a subset and no
  replication. Past 5e-8 in that window lie at least three groups of rare variants (major allele at 0.999967, 0.99991
  and 0.999865) over about 330 kb; only the first group's ancestry was read, and whether the carriers overlap is
  unknown. Its Open Targets set is led by the second group's insertion 270 kb away (P 3.5e-9). The men's deposit is
  not read. A genome-wide P that the paper's own filter excludes is no discovery: the line is not a suggestive test but an invalid
  one, so §4.1's "overfit source", tier D (D26.7; C rejected, as C is "suggestive"). Locus 75, KLF12, comes from the
  same deposit and will be read the same way. Nothing can test it: Deelen 2019's 90th and 99th
  percentiles (rarest variant 0.01 here), Zenin 2019's healthspan (down to 0.0011), FinnGen r11's death endpoint and
  LifeGen hold no line for the lead or its haplotype, and T is absent in Finns. Untested, not null, so not
  replication_failed. Every genotype is neutral: a tier D row carries no weight (D25.2), and the people who carry T are mostly of African ancestry (about 12 in 100 there carry one copy), where
  nothing was studied (R-TIER-3). Causal C2 by the letter (in a 95 % set, PIP 0.12), on a set built without the
  study's own LD. Effector E2, PLN, by locus-to-gene alone (0.77), with no QTL colocalisation for either set and no
  rival gene passing a criterion (D24), so `gene` is PLN by §4.2's letter (L2G ≥ 0.5 alone), on a set this weak (D26.7). Lifespan is untested:
  its one test is the excluded line (D26.7). Healthspan and exceptional survival are untested (absent from Zenin and
  Deelen). Mechanism general ageing, nothing pointing
  elsewhere; descriptive; age of action unknown.
