    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 95 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome 7,
          lies inside the AP5Z1 gene, in a stretch that does not code for protein.
      - genotype: T/TC
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA position, one extra letter in a short repeat (about
          5 in 100 people of European ancestry carry it). In a large British study, people with a parent who lived to
          95 or more carried it more often, and a European study of people who reached the oldest ages leaned the
          same way. Studies of parents' lifespan in general found no effect. It is a likely finding, not a settled
          one, and it may matter only for reaching very old age.
      - genotype: TC/TC
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA position, one extra letter in a short repeat
          (fewer than 1 in 1,000 people of European ancestry do). In a large British study, people with a parent
          who lived to 95 or more carried this version more often, and a European study of people who reached the
          oldest ages leaned the same way. Studies of parents' lifespan in general found no effect, and no one with
          two copies was studied on their own. It is a likely finding, not a settled one.
