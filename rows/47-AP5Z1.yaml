# The seed list's locus 47, AP5Z1 (7p22.3). Curated 2026-11-11. Lead rs528161076, the seed's only rsID, now a
# synonym of rs371933919 (db-ensembl-116#q311), the id this row carries: a one-base C insertion in a run of eight Cs
# in an AP5Z1 intron, GRCh38 7:4,787,884-4,787,891, GRCh37 4,827,515-4,827,522, written T>TC at 4,787,883 (GRCh38)
# or 4,827,514 (GRCh37). The insertion is 0.028 in gnomAD's non-Finnish Europeans, 0.09 in its African genomes, 0.009
# in Finns. Entered by track B (common-variant GWAS) from Pilling 2016's parental extreme-longevity scan (GCST003395), tier vote B.
# Deelen's files lack the insertion; its proxy rs79109928 (r² 0.943 in UK Biobank, Pilling's own) carries the
# look-ups and appears only in the notes and the studies' proxy_rsid.
locus_id: 47
locus_name: AP5Z1
verdict: kept
verdict_reason: >-
  Tier B, the seed's, kept. A is out on the discovery's size alone (below); two lifespan look-ups lean against it,
  and whether they are red flags is unknown (D26.3). Pilling 2016 ran BOLT-LMM
  on 42,273 'white' British UK Biobank participants aged 55 to 70, 1,339 of them with a parent in the top 1 % of age
  at death (mothers 98 or older, fathers 95 or older). The insertion's TC allele raised the chance of a long-lived
  parent by 0.0158 per copy (SE 0.0029, P 3.4e-8) from a 3.2 % baseline: carried by 6.3 % of cases and 4.39 % of
  controls, a crude carrier odds ratio of 1.46 (derived from those counts). That is about seven times APOE ε4's
  effect on the same phenotype in the same model (rs429358 0.0023, P 0.053). The authors call it suggestive, "less
  robust", and caution that the same people's continuous parental age-at-death scans are flat at it (P 0.65, 0.47,
  0.96). The P passes 5e-8, so the locus is §4.1's genome-wide locus. A is out on size: 1,339 cases and 42,273 people
  are below §4.1's 100,000 lives or 3,000 cases. Deelen 2019's 99th percentile, whose discovery holds no UK Biobank
  data, replicates at the proxy rs79109928 (r² 0.943; its minor A is the long-lived parents' allele in Pilling):
  OR 1.44, P 0.0025 (one-sided about 0.0013), effective N 3,692. Two more of the haplotype's markers give P 0.0018
  and 0.011 there; their r² is unquoted, so they are named, not counted. The 90th percentile, which contains those
  cases, leans the same way at a fifth of the effect (P 0.35). So the row is not D (D25.1). Two lifespan look-ups
  lean against. LifeGen's parental lifespan at the proxy gives A beta1 −0.0067 (SE 0.0131, P 0.61, the shorter-life
  side), but LifeGen contains UK Biobank, so it is not independent of Pilling. FinnGen r11's death endpoint, which is
  independent, holds the insertion itself: log OR +0.034 for death (SE 0.039, P 0.38), at 0.9 % in Finns. Pilling's
  APOE line gives a factor of about 46 to LifeGen's scale (0.1056 over 0.0023), and that line is itself only P 0.053.
  At that factor both look-ups are red flags (power 1.00, heterogeneity P about 3e-8). The loci's mean factor (D25.3)
  is defined against Deelen's 90th percentile, not this phenotype, so it is not at hand. The flag holds at any factor
  of 2.13 or more for LifeGen and 6.2 or more for FinnGen, a twentieth and a seventh of APOE's; at the APOE line's
  upper 95 % bound (0.0047) the factor is still about 23. D25.3 asks both calibrations, and the second cannot be
  computed here, so whether the look-ups are red flags is unknown and the row carries no replication_failed (D26.3:
  unknown sets no token). The row stays B. If the effect is real, it seems confined to the oldest ages:
  the 99th percentile shows it, the 90th barely, and parental lifespan not at all. Zenin 2019's healthspan is null
  at the proxy (P 0.93). Lifespan is filed 0, healthspan 0, exceptional survival + on Pilling and Deelen's 99th.
  Age of action is UNKNOWN (D26.9): both contrasts (Pilling's top 1 % against its continuous scans; Deelen's 99th
  against its 90th percentile) contrast how extreme the survival is, not the age at which the allele acts. The evidence is European; the insertion is
  three times commoner in African-ancestry genomes (0.09), where nothing was studied (R-TIER-3), so
  eur_only_evidence. Every one of Open Targets' sixteen credible sets holding the insertion is a molecular QTL, for
  ENSG00000242802's transcripts, exons and splice junctions; it leads four of them (a blood transcript QTL at PIP
  0.32). No GWAS set holds it, so causal C4 and effector E4, and no gene is named (D24), though the insertion lies in
  AP5Z1; the proxy rs79109928's twenty-one sets are QTLs too. Mechanism general ageing: the GWAS Catalog records no
  other trait under the old id, and nothing under the surviving id or the proxy. Descriptive. The protection is a
  presence: the minor TC goes with long-lived parents.
