# The seed list's locus 22, KALRN (3q21.2). Curated 2026-11-15. Lead rs3830412, the seed's only rsID (Deelen 2019's
# European 99th-percentile locus): a poly-T indel in a non-coding KALRN transcript exon, GRCh38 3:124,678,474 AT/A
# (FinnGen's alleles), GRCh37 3:124,397,321, Deelen's A/AT; A, the deletion, 0.22 in Deelen's cohorts and the
# discovery's longer-lived allele. Open Targets 26.09 holds it in 31 credible sets, mostly KALRN expression and
# transcript-usage QTLs, with blood-count and IGF-1 sets, none lifespan-class; the GWAS Catalog (2026-10-29) holds
# Deelen's longevity association alone.
locus_id: 22
locus_name: KALRN
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's C: a suggestive discovery that fails a powered test (D30.11, a fortiori of D25.1), row 1's
  shape. Deelen 2019's European meta-analysis of survival to the 99th percentile against all controls gives A OR 1.21
  (1.12 to 1.30), P 4.3e-7, I² 0 (Table 2); trans-ethnic the same OR at P 8.2e-7; its deposits A +0.192 (SE 0.038) at
  the 99th and +0.082 (SE 0.024, P 5.2e-4) at the 90th, the same cohorts. Timmers 2019's million parents' lives, with
  no UK Biobank in Deelen and at least the Rotterdam Study shared, hold no line for the indel; at rs12631364 (r² 1.00
  in CEU, its T with the lead's A by frequency) they are flat: A +0.0009 per self (SE 0.0048), P 0.85. Carried to that
  scale by D25.3's 99th-percentile calibrations, the discovery predicts A +0.031 (APOE's factor, 6.22) or +0.074 (the
  loci's mean, 2.60): one-sided power 1.00 under both, heterogeneity P 1.1e-4 and 2e-6, a D21 red flag under both (at half the effect 0.011 and 4e-5). Timmers' "+-" is
  per rs12631364's A: for the lead's A, UK Biobank leans against and LifeGen for. The
  looks that lean A's way are UK Biobank's parents, inside Timmers, the failing sample (D30.11, D30.16): Deelen's own
  UK Biobank parental validation (Table 3, OR 1.11, 0.99 to 1.24, P 0.081, one-sided about 0.04; per offspring allele against half the discovery's
  effect, underpowered, 0.51, and in agreement, heterogeneity P 0.89, derived; the parents are the ones Timmers pools, and whether that look counts
  is put to the lead) and Pilling 2017's mothers at
  rs10755078 (r² 1.00; one-sided 0.029), while Pilling's fathers lean the other way (P 0.095, one-sided 0.048 against) and both parents and the
  top 10 % are flat (P 0.90, 0.52). Nothing independent passes: FinnGen R11's death endpoint has A with slightly more
  deaths (P 0.67), a database line (D12, D30.12); Park 2025's own survival A with slightly more deaths (P 0.43, its
  allele columns swapped), UK Biobank. Wright 2019's AncestryDNA holds one Table 8 line within 500 kb, mothers born
  1886-1918 at rs573186 (219 kb), not among the lead's 65 CEU variants at r² 0.5 and with no CEU pair, and Table 9
  nothing: untested. Zenin 2019's healthspan at rs10755078 flat (the lead's A a little less healthy, P 0.48); Foote
  2025's factors at the same proxy point both ways at nominal P (the lead's A more frail on cognition, P 3.1e-4,
  one-sided 1.5e-4 against; less disabled, P 0.044, one-sided 0.022 for), so healthspan is 0 (D31.13);
  Rosoff 2023 holds no line. Timmers' strongest line within 500 kb is a rare variant (rs796791765, 1.4 %) at P 0.0011:
  nothing suggestive.
  The literature search (the rsID, and KALRN with longevity terms; Semantic Scholar answered 429, its part unchecked)
  finds Deelen alone among lifespan studies; a brain expression study finds two KALRN isoforms rising with age, no
  lifespan test. Every genotype neutral (D25.2); outcome cells 0 (D28.10; healthspan by D31.13, Foote's opposed
  factors). Mechanism ageing in general (D25.7): KALRN,
  a Rho guanine-exchange factor of neuronal dendrites, named in prose; at the lead's own line in an IGF-1 set the
  deletion raises IGF-1 slightly (posterior 0.021), named, no route shown. Causal C4 and effector E4: no lifespan-class
  set holds it; its expression and splicing QTL sets name KALRN, which a lifespan set would need to carry. Descriptive.
  Age of action unknown. The discovery and every test of it are European.
