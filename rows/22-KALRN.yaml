    genotypes:
      - genotype: AT/AT
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA position, as about 61 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, a short repeat on
          chromosome 3, lies in the KALRN gene. One study of long-lived people linked the other version to reaching
          very old age, but a much larger study of a million parents' lives did not confirm it, so it is not counted
          for or against lifespan.
      - genotype: A/AT
        state: neutral
        conclusion: >-
          You carry one copy of a shorter version of this DNA position (about 34 in 100 people of European ancestry
          do). It lies in the KALRN gene on chromosome 3. One large study of long-lived people found it a little more
          often among them, but a much larger study of a million parents' lives did not confirm it, so it is not
          counted for or against lifespan.
      - genotype: A/A
        state: neutral
        conclusion: >-
