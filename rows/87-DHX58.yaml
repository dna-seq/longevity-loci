# The seed list's locus 87, DHX58 (17q21.2). Curated 2026-11-13. Lead rs34891485, the seed's only rsID (Rosoff 2023's
# mvAge lead): a missense variant of DHX58 (threonine 76 to alanine), GRCh38 17:42,111,440 T/C, GRCh37 17:40,263,458,
# C the minor allele (0.049 in non-Finnish Europeans, absent in East Asians), T the healthier and longer-lived side.
# Open Targets 26.09 holds it in one credible set, mvAge's own; the GWAS Catalog (2026-10-29) holds two associations.
locus_id: 87
locus_name: DHX58
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: genome-wide only in a multivariate result, with a co-occurring lifespan study (D16,
  D18.3), and not replicated outside its inputs; row 52's shape. Rosoff 2023's mvAge is genome-wide at the lead, T
  (the common allele) on the healthier-ageing side, β +0.0145 (SE 0.0023), P 5.0e-10, heterogeneity across its five
  inputs Q P 0.68 (Supplementary Tables 6 and 7); filed "No (Lifespan)", within 1 Mb of a lifespan locus already
  reported. Every readable input leans to T: Timmers 2019's million parents' lives, T longer, P 3.9e-7 (suggestive,
  "++" in UK Biobank and LifeGen; nothing in GRCh37 17:39.8-40.7 Mb reaches 2.5e-8, the window's peak 245 kb away at
  P 2.1e-7), the co-occurring lifespan study; Zenin 2019's healthspan, T healthier, P 0.0014 after genomic control;
  frailty (reverse coded) P 3.0e-4, read in Rosoff's table only. In UK Biobank the rest agrees: Pilling's parents T
  longer, P 7.4e-6 (inside Timmers); Park 2025's own survival T with fewer deaths, P 0.033 (its allele columns
  swapped, as the frequencies show), co-occurring. Nothing replicates and nothing contradicts: Deelen 2019, itself an
  mvAge input, is flat (90th percentile T one-sided 0.089, 99th P 0.84); FinnGen R11's death endpoint leans
  against T, flat (one-sided 0.24). Calibrated from Timmers' β (D25.3), each of the three flags under APOE's factor
  (powers 1.00, 0.91, 0.91; heterogeneity P 0.014, 0.0058, 0.0016) and none under the mean factor (powers 0.63, 0.35,
  0.34): a flag under one calibration only is none, so no red flag (D21). Wright 2019 has no line at the lead; its
  fathers' Table 9 holds rs12600570 1.9 kb away (r² 0.65 in CEU, D′ 1; the lead's C rides with its T on all 17 C
  haplotypes), UK arm P 0.0013 so the line counts by D29.18, its AncestryDNA arm leaning to the lead's T (one-sided
  about 0.031 raw); a proxy, named, and the tier does not rest on it (mvAge caps at B, D18.3). Foote 2025's seven
  frailty deposits hold no line at the lead and nothing below P 0.01 within 50 kb. Healthspan + (Zenin, nominal,
  beside the co-occurring lifespan study, D16), lifespan + (Timmers), exceptional survival 0 (Deelen flat).
  Mechanism ageing in general (D25.7): the only other association is coronary artery disease (van der Harst 2017, T
  lowering it, P 3e-7, short of genome-wide), and nothing shows the lifespan effect runs through it; mech:cvd as
  pleiotropy, no trade-off (no harm on T's side). Descriptive. Causal C1: a coding variant at posterior 0.863 in the
  mvAge PICS set (Open Targets), the paper's own SuSiE 0.750 and FINEMAP 0.745 (both credible-set columns 0, so the
  PICS set carries it). Effector E1, DHX58: the variant changes DHX58's protein (VEP, SIFT tolerated, PolyPhen
  benign, so the effect is read from the association data), §4.2's coding clause; locus-to-gene names DHX58 alone
  (0.776) and no QTL colocalises. DHX58 (LGP2) is a RIG-I-like receptor of innate antiviral sensing, named, not a
  mechanism shown. T/T, about 90 in 100 Europeans, is the reference; C is the risk allele at a disease locus
  (coronary disease), so PROTECT:ABSENCE_OF_RISK (D26.5). Age of action unknown. The evidence is European.
