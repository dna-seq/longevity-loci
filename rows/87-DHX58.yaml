# The seed list's locus 87, DHX58 (17q21.2). Curated 2026-11-13. Lead rs34891485, the seed's only rsID (Rosoff 2023's
# mvAge lead): a missense variant of DHX58 (threonine 76 to alanine), GRCh38 17:42,111,440 T/C, GRCh37 17:40,263,458,
# C the minor allele (0.049 in non-Finnish Europeans, absent in East Asians), T the healthier and longer-lived side.
# Open Targets 26.09 holds it in one credible set, mvAge's own; the GWAS Catalog (2026-10-29) holds two associations.
locus_id: 87
locus_name: DHX58
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: genome-wide only in a multivariate result, with a co-occurring lifespan study (D16,
  D18.3), and not replicated outside its inputs; row 52's shape. Rosoff 2023's mvAge is genome-wide at the lead, T
  (the common allele) on the healthier-ageing side, β +0.0145 (SE 0.0023), P 5.0e-10, heterogeneity across its five
  inputs Q P 0.68 (Supplementary Tables 6 and 7). Every input leans to T: Timmers 2019's million parents' lives, T
  longer, P 3.9e-7 (suggestive, "++" in UK Biobank and LifeGen), the co-occurring lifespan study; Zenin 2019's
  healthspan, T healthier, P 0.0010 (0.0014 after genomic control); frailty (reverse coded) P 3.0e-4, PhenoAge P 0.67,
  read in Rosoff's table only. Rosoff files the locus "No (Lifespan)", within 1 Mb of an input's lifespan locus. Read 1
  Mb either side, Timmers holds no line past its own 2.5e-8; its strongest, rs1011157 in BECN1 700 kb away (T shorter,
  P 3.6e-8, past 5e-8), is r² 0.28 to the lead, and the peak nearer the lead, rs76611716 in STAT3's region (P 2.1e-7),
  r² 0.37: neither is the lead's signal, so the lead's own lifespan evidence stays suggestive. rs1011157 is named and
  offered to the scout's queue (D25.6). In UK Biobank the rest agrees: Pilling's parents T longer, P 7.4e-6 (inside
  Timmers); Park 2025's own survival T with fewer deaths, P 0.033 (its allele columns swapped, as the frequencies
  show), co-occurring. Nothing replicates and nothing contradicts: Deelen 2019, itself an mvAge input, is flat (90th
  percentile T one-sided 0.089, 99th P 0.84); FinnGen R11's death endpoint leans against T, flat (one-sided 0.24).
  Calibrated from Timmers' β (D25.3), each of the three flags under APOE's factor (powers 1.00, 0.91, 0.91;
  heterogeneity P 0.014, 0.0058, 0.0016) and none under the mean factor (powers 0.63, 0.35, 0.34): a flag under one
  calibration only is none, so no red flag (D21). Wright 2019 has no line at the lead; its fathers' Table 9 holds
  rs12600570 1.9 kb away (r² 0.65 in CEU, D′ 1; the lead's C rides with its T on all 17 C haplotypes), UK arm P 0.0013,
  so not selected by the table's filter (D29.18), its AncestryDNA arm leaning to the lead's T, one-sided 0.031 raw,
  0.044 after AncestryDNA's genomic control (λ 1.182): a proxy at r² 0.65, named and not counted; it could not lift
  the tier, which mvAge caps at B (D18.3). Foote 2025's seven frailty deposits hold no line at the lead and nothing
  below P 0.01 within 50 kb. Healthspan + (Zenin, nominal, beside the co-occurring lifespan study, D16), lifespan +
  (Timmers), exceptional survival 0 (Deelen flat). Mechanism ageing in general (D25.7); pleiotropy none counted: the
  lead's one other association is coronary artery disease (van der Harst 2017, T lowering it, P 3e-7, short of
  genome-wide, with no Open Targets set), named here. Descriptive. Causal C1: a coding variant at posterior 0.863 in
  the mvAge PICS set (Open Targets); the paper's own SuSiE 0.750 and FINEMAP 0.745, both credible-set columns 0.
  Effector E1, DHX58: the variant changes DHX58's protein, threonine 76 to alanine (VEP; SIFT tolerated, PolyPhen
  benign, so the effect is read from the association data), §4.2's coding clause; locus-to-gene names DHX58 alone
  (0.776) and no QTL colocalises. Timmers' nearby peaks (STAT3's region, BECN1) are not the lead's signal (r² 0.37,
  0.28), so they do not make the call ambiguous by D24; put to the lead. DHX58 (LGP2) is a RIG-I-like receptor of
  innate antiviral sensing, named, not a mechanism shown. T is the common allele, about 95 in 100 European
  chromosomes, so T/T (about 90 in 100) is the reference (§6.2) and C, the shorter-lived side, makes C/T and C/C risk:
  PROTECT:ABSENCE_OF_RISK, as rows 79 and 85. Age of action unknown. The evidence is European (C absent in East
  Asians).
