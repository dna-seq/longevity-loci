variants:
  - rsid: rs34891485
    gene: DHX58
    phenotype: DHX58 Thr76Ala, multivariate ageing, parents' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: T
    effect_size: 0.014460757
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the usual version of this spot in the gene DHX58 on chromosome 17, as about 90 in
          100 people of European ancestry do. DHX58 helps cells sense viruses. This is the reference the other
          combinations are compared with: you do not carry the rarer version that changes one building block of the
          DHX58 protein.
      - genotype: C/T
        state: risk
        conclusion: >-
          You carry one copy of a rarer version of this spot in the gene DHX58 on chromosome 17 (about 9 in 100 people
          of European ancestry do). It changes one building block of the DHX58 protein, which helps cells sense
          viruses. In very large European studies it went with slightly less healthy ageing and parents living a
          little less long. It is a likely finding, not a settled one, and the effect is small: a tendency, not
          destiny. The finding comes from people of European
          ancestry; this version is rare or absent elsewhere.
      - genotype: C/C
        state: risk
        conclusion: >-
          You carry two copies of a rare version of this spot in the gene DHX58 on chromosome 17 (about 2 or 3 in
          1,000 people of European ancestry do). It changes one building block of the DHX58 protein, which helps
          cells sense viruses. In very large European studies each copy went with slightly less healthy ageing and
          parents living a little less long. Too few people carry two copies to say what two copies do beyond that.
          It is a likely finding, not a settled one: a tendency, not destiny.
