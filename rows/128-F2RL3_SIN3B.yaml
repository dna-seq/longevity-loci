    trait_efo_id: EFO_0022597
    effect_allele: G
    effect_size: -1.3482
    effect_measure: beta
    stat_significance: significant
    direction: unknown
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the A version of this DNA position, found in about 4 in 100 people of African
          ancestry and almost no one of European ancestry. One study of African American adults linked each copy of
          A with a GrimAge epigenetic clock reading more than a year older than in people of the same age without A. That is a tendency in a
          marker whose reading only means something against your calendar age, which this report does not have, so it
          carries no score.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy of the A version of this DNA position (about 33 in 100 people of African ancestry do,
          almost no one of European ancestry). One study of African American adults linked it with a GrimAge
          epigenetic clock reading about one year older, on average, than in people of the same age without A. That is a tendency in a marker
          whose reading only means something against your calendar age, which this report does not have, so it carries
          no score.
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as nearly everyone of European ancestry and
          about 62 in 100 people of African ancestry do. It is the reference the other combinations are compared with.
          The position lies just before the F2RL3 gene on chromosome 19. Epigenetic clocks estimate age from chemical
          marks on DNA; a clock's reading only means something against your calendar age, which this report does not
          have, so this result carries no score.
