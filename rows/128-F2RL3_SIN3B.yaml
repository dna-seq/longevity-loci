# The seed list's locus 128, F2RL3/SIN3B (19p13.11): a marker of biological ageing (D32, D36.3), curated on D37.12
# with 23 TERC as the pattern. Curated 2026-11-16. Lead rs2227341, the seed's rsID (McCartney 2021's African American
# GrimAge locus): 110 bp upstream of F2RL3's MANE transcript (a 5′ UTR variant on other F2RL3 transcripts), GRCh38
# 19:16,888,889, GRCh37 19:16,999,700, G/A/C, G ancestral, the row meaning G/A; A at 20.9 % in gnomAD's
# African/African American genomes and 0.06 % in the non-Finnish Europeans. G is the allele with slower GrimAge.
locus_id: 128
locus_name: F2RL3/SIN3B
verdict: kept
verdict_reason: >-
  Tier B on the marker's own evidence (D37.12; the seed gives none): the tier grades the association with GrimAge
  acceleration, a DNA methylation clock read against calendar age, not longevity, and this row is unscored (D32).
  McCartney 2021's GWAS of epigenetic clocks in 34,710 Europeans and 6,195 African Americans finds rs2227341 in the
  African American analysis alone: its Table S4 prints G, the effect allele (the legend's refA), at 0.82, GrimAge
  acceleration 1.35 years lower per G (SE 0.13), P 6.0e-25, effective n 5,017 in six cohorts, I² 67 %, one cohort the
  other way. Genome-wide in one sample, unreplicated in a sample of its own (none found): §4.1's B. GrimAge holds a
  methylation estimate of smoking pack-years, the paper's GrimAge loci overlap genetic variation at smoking methylation
  sites, and F2RL3 holds the best-known smoking CpG, so this line may move the clock through that site's methylation
  rather than through ageing; named, not read for this SNP (the literature search, the rsID, 2026-11-16, finds Jhun
  2017's African American study of F2RL3 methylation, abstract only, which does not name it; Semantic Scholar answered
  429, its part unchecked). A is all but absent in Europeans, so the European deposits hold no line: Deelen 2019,
  Timmers 2019, Pilling 2017, Zenin 2019, Foote 2025 and FinnGen R11 (by rsID and GRCh37 19:16,999,700): untested.
  Park 2025's white British survival deposit holds it: G with more deaths, β +0.053 (SE 0.025), P 0.037 (men
  0.028, women 0.51), from about 175 carriers of A; but A, at 0.022 % in that deposit (q170), is under Park's own 0.1 % filter (q58), so the line is named, not read (D31.13, D26.7, D39.11). Every genotype neutral, each conclusion a tendency
  of the marker with no colour (D32, D37.12); `direction: unknown`. Outcome cells read for G: lifespan untested (Park's line under its own frequency filter, named above); healthspan and exceptional survival untested. Mechanism: markers of biological
  ageing; F2RL3 is a thrombin receptor on platelets (the author). No pleiotropy in the Catalog, which holds this line
  alone. Causal C1 (PIP 0.60 in McCartney's GrimAge set). Effector E1, F2RL3: locus-to-gene 0.78, and its lymphoblastoid expression set (the variant at PIP up to 1.00, A with higher expression) colocalises with McCartney's GrimAge set at H4 0.9993 (db-opentargets-26.09#q1480 to q1483, cached and quoted, D39.9); the variant upstream of F2RL3. Descriptive. Age of action unknown. The evidence is African American, as `ancestry_specific:afr`, which here reflects A's near-absence in Europeans, not a tested difference between ancestries (D39.11).
