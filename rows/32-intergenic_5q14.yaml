# The seed list's locus 32, intergenic 5q14 (5q14.1). Curated 2026-11-11, the third run's ninth row. Lead rs138499810
# (Chang 2022's healthy-ageing GWAS in Singapore Chinese, Table 1), the seed's only rsID here, the sister of row 16
# (the same paper's second hit): intergenic by the paper, an intron of a lncRNA by VEP, 10 kb from XRCC4, VCAN and
# TMEM167A. T 0.022 in East Asians, but also 0.023 in Finns and 0.028 in admixed Americans (gnomAD), near-absent in
# other Europeans (0.0008). Not in Timmers 2019's, Zenin 2019's or Deelen 2019's summary statistics. The GWAS Catalog
# (2026-10-29) holds Chang's association alone; Open Targets 26.09 has its one-variant PICS set.
locus_id: 32
locus_name: intergenic 5q14
verdict: re-tiered
verdict_reason: >-
  Tier C, down from the seed's single-track B: a genome-wide healthspan result with no co-occurring lifespan study,
  so it cannot score (§4.5 as D16 reads it) and stays in the research view, as row 16 from the same paper. Chang 2022
  compared 1,618 Singapore Chinese aged 65 or more who had aged healthily (no major chronic disease, no cognitive
  impairment, no depression, no limitation in daily activities, good physical function and self-rated health, no
  limiting pain) with 6,221 survivors who had not: a healthspan contrast among the living, HEALTHSPAN in §4.5. The
  rare T (2 % in the cohort) went with healthy ageing, OR 3.16 per allele, meta P 4.94e-9; the paper's "risk T
  allele" is its test allele, on the healthy side. Discovery alone is only just past the threshold (P 4.82e-8), and an
  OR above 3 at 2 % invites winner's curse. Unlike row 16's, this replication arm leans the same way at P 0.034 (OR
  3.67, CI 1.10 to 12.2, Cochran's Q P 0.80): 129 healthy agers and 500 others from the same cohort, genotyped later,
  separate people the paper keeps apart, so independent by D19.1, though thin. It would make the healthspan side a
  replicated result; it does not change the tier, which waits on a lifespan study (D16). With lifestyle covariates the
  meta P is 8.21e-9. The lifespan side is untested, not null: LifeGen, Zenin and both Deelen percentiles hold no line
  for the variant (T 0.08 % in non-Finnish Europeans), the SNPs that track it in 99 Finns do not tag it in those mostly
  British samples, and no East Asian or Finnish lifespan result for it was found. Exceptional survival is untested for
  the same reason. The evidence is East Asian only (R-ANC-4, ancestry_specific:eas): not to be scored outside East
  Asian ancestry, and in the research view without inferred ancestry. The allele is as common in Finns and admixed
  Americans, where it is untested. Of the seven domains, T passes adjustment only for good self-perceived health (P
  7.8e-3), a component of the same outcome; the mechanism is filed as general ageing, the paper's XRCC4 and DNA-repair
  link being a hypothesis it says needs study. Open Targets has one credible set, PICS from the reported hit, the lead
  alone at PIP 1, which is so by construction (no East Asian proxy above r² 0.13): C1 on §4.2's letter, said as
  meaningless, as at row 19. Locus-to-gene names XRCC4 (0.85; TMEM167A 0.46), with no colocalisation of any kind, so
  no rival under D24: effector E2, XRCC4, the model's call on a one-variant set. The protection is a presence: the rare
  allele goes with healthier ageing. Age of action is unknown.
