variants:
  - rsid: rs138499810
    gene: XRCC4
    phenotype: XRCC4 region, East Asian healthy ageing
    trait_efo_id: EFO_0009762
    effect_allele: T
    effect_size: 3.158
    effect_measure: OR
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region, the one almost everyone has (about 96 in
          100 people of East Asian ancestry). It is the reference the other combinations are compared with. The
          region, on chromosome 5, lies between genes; the nearest likely gene is XRCC4, which helps repair broken
          DNA, though that link is not proven. The finding comes from Singapore Chinese.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of a rare version of this DNA region (about 4 in 100 people of East Asian ancestry do,
          and about as many people of Finnish or Latin American ancestry; it is very rare in other Europeans). In
          one study of older Singapore Chinese, people with this version were more often still free of major
          disease and disability, and rated their own health better, in their seventies. A smaller group from the
          same study pointed the same way. This is early evidence: the result was only just strong enough to
          count, the size of the effect is likely overstated, and whether it lengthens life is unknown. It may not
          apply to people of other ancestries, where it has not been studied. It is a tendency, not a guarantee.
      - genotype: T/T
        state: protective
        conclusion: >-
          You carry two copies of a rare version of this DNA region (about 5 in 10,000 people of East Asian
          ancestry do). In one study of older Singapore Chinese, each copy of this version went with being more
          often free of major disease and disability in their seventies. This is early evidence: almost no one
          carries two copies, so how they fare was not measured directly, and whether it lengthens life is
          unknown. It may not apply to people of other ancestries, where it has not been studied. It is a
          tendency, not a guarantee.
