variants:
  - rsid: rs28637671
    gene: ""
    phenotype: RNU1-63P region, ageing
    trait_efo_id: EFO_0007796
    effect_allele: T
    effect_size: 0.0063
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA region (about 51 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. The region, on chromosome 4,
          lies between genes, and what it does is not known. The finding comes from people of European ancestry;
          less is known elsewhere.
      - genotype: G/T
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 41 in 100 people of European
          ancestry do). In a very large European study that combined healthspan, long life and other measures of
          ageing, this version went with slightly less healthy ageing, and parents of carriers lived a little less
          long. It is a likely finding, not a settled one: it has not yet been confirmed in a separate group of
          people. What the region does is not known. The effect is small and it is a tendency, not destiny.
      - genotype: G/G
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 8 in 100 people of European
          ancestry do). In a very large European study that combined healthspan, long life and other measures of
          ageing, each copy went with slightly less healthy ageing, and parents of carriers lived a little less
          long. It is a likely finding, not a settled one: it has not yet been confirmed in a separate group of
          people. What the region does is not known. The effect is small and it is a tendency, not destiny.
