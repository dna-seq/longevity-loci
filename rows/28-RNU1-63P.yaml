# The seed list's locus 28, RNU1-63P (4q13.2). Curated 2026-11-11, the third ten-row run's sixth row. Lead rs28637671
# (4:66,914,674 in GRCh38, 4:67,780,392 in GRCh37; the seed's lead), T/G, T at 0.71 in Europeans and 0.94 in East
# Asians. A novel lead of Rosoff 2023's mvAge (Table 1, Supplementary Tables 6 and 7, locus 13). In Timmers 2019's,
# Zenin 2019's and Deelen 2019's summary statistics at the lead itself; in Wright 2019's tables only through
# rs1481245 (r² 0.51). The seed's second rsID, rs13141210 (111 kb away, r² 0.095), is a separate mvAge signal in the
# same Rosoff locus; it is not read into this row's axes, it waits in the scout's queue as a candidate row (D25.6).
locus_id: 28
locus_name: RNU1-63P
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: a genome-wide multivariate result with a co-occurring lifespan study (§4.5 as D16
  reads it), and no independent replication counted; a multivariate result does not meet tier A's
  first criterion (D18.3). Genome-wide only in Rosoff 2023's mvAge: T raises the factor (healthier ageing), P
  1.95e-8, a lead new to the GWAS Catalog and more than 1 Mb from every input's loci. Timmers 2019's million parents'
  lives are the co-occurring lifespan study: T lengthens life at P 5.8e-4, UK Biobank and LifeGen on the same side,
  an mvAge input and not a replication. That result is the lead's own, not the shadow of rs13141210, the locus's
  other mvAge signal: at r² 0.095 rs13141210's lifespan z of 4.4 could give the lead at most about 1.4, against the
  3.4 observed. The one look outside mvAge's inputs is AncestryDNA in Wright 2019, through rs1481245, a weak proxy
  (r² 0.51, D′ 0.99; its A rides with the lead's T by frequency and r²): fathers put A on the longer-lived side at
  raw P 0.016, mothers the same side at 0.065, and UK Biobank's arm agrees (heterogeneity P 0.69), so no red flag.
  That supports the direction, no more: it is nominal, at a weak proxy where the lead predicts a z of about 2.5
  (its LifeGen z 3.4 is higher), and rs1481245 also carries some of rs13141210 (r² 0.23), whose tags could supply
  about 1.6 of its AncestryDNA z of 2.4. It cannot lift the tier, and under D30.1 (corrected 2026-11-13) the fathers' Table 9 line would not count anyway: with the AncestryDNA arm at z = 0 the deflated meta is P 0.016, above 2.5e-3 (derived). Wright's other SNPs near the lead tag it weakly
  (rs17799404 r² 0.39, rs987811 0.26, rs12506243 0.21), and the strongest here (rs11947612, rs923994) have r² below
  0.05 to the lead and belong to rs13141210's side. Healthspan agrees: T delays the end of healthspan in Zenin 2019 (P 0.010)
  and lowers frailty (P 2.7e-5), both mvAge inputs, healthspan-class (D17.1). Exceptional survival is +: Deelen
  2019's summary statistics favour T at the 90th (P 0.0030) and the 99th percentile (P 0.0082, a subset of the
  90th's cases), the 90th an mvAge input, so neither replicates it. The mechanism is unknown, filed as general
  ageing: Rosoff finds no earlier genome-wide association for the SNP, the GWAS Catalog records only mvAge, and Open
  Targets 26.09 has no record of the variant. Its 54 proxies at r² 0.8 or more have no genome-wide record either
  (one sub-threshold catalog record, lumbar disc herniation at P 2e-6; none found in Open Targets' search), and the
  nearest genome-wide trait, paracetamol use, is led by rs13109040 at r² 0.39. So no other trait is known and no
  trade-off can be read (D18.1);
  nothing at the lead can be acted on, so descriptive. Causal and effector confidence are C4 and E4, with no gene
  (§4.2): Open Targets has no record of the variant under either allele order, so no lifespan-class set holds it, and
  mvAge's set nearby is led by rs13141210. RNU1-63P and RNU6-699P are small-RNA pseudogenes that name the locus,
  not an effector. G is the minor allele (0.29) and goes with less healthy ageing, so T/T, the most common genotype (about 51 in
  100), is the reference (§6.2), as at rows 14 and 20. No PROTECT token: no disease is known at the locus whose
  absence T would mark (D26.5, as rows 21 and 42).
  Age of action is unknown: no cached source gives this locus's own age bands. The evidence is European; T is common
  in East Asians (0.94), untested there.
  rs13141210, the seed's second rsID here, looks like a B of its own under D16 (mvAge 1.5e-8, T healthier; lifespan
  T P 9e-6), nominal in AncestryDNA at good tags (rs2164300 r² 0.94, rs12506221 r² 0.86; raw P 0.0005 to 0.001 in
  fathers and mothers, direction not read), with its own traits (education, body fat, smoking): a candidate row in the scout's queue (D25.6).
  Timmers 2022's aging-GIP1 is genome-wide here through rs10434248 (P 8e-9), rs13141210's tag (r² 0.84 EUR, 0.15
  EAS, its A with T), not the lead's (r² 0.13): a second multivariate scan for rs13141210, whose own-survival look-up
  in FinnGen and Biobank Japan does not pass (A 0.092 years, one-sided P 0.089), a weak test of rs13141210: Japan
  carries about two thirds of its information (estimated, not printed) and there the tag holds r² 0.15 only. The same paper's fine-mapping prints
  one set at 4q13.2, 44 variants, with this row's lead at its top (PIP 0.068) and rs10434248 outside it (the lead's own aging-GIP1 P is not
  in the cached files); a
  multivariate set, not a lifespan-class one, so C4 stands.
