# The seed list's locus 77, APBA2 (15q13.1). Curated 2026-11-13. Lead rs77184423, the seed's only rsID (Gurinovich
# 2021's NECS centenarian SNP, intronic in APBA2), the sister of rows 19, 31, 41 and 58 from the same paper. G is rare
# in NECS (1.4 % of centenarians' alleles, 0.45 % of controls') and in Park's HRC-imputed UK Biobank (about 0.08 %),
# but common in the sequenced panels (0.115 in 1000 Genomes Europeans, 0.064 in ALFA's); gnomAD has no frequency.
locus_id: 77
locus_name: APBA2
verdict: re-tiered
verdict_reason: >-
  Tier C, from the seed's B, under R-TIER-2 (put to the lead, with D as the alternative). Gurinovich 2021's GWAS of
  1,320 NECS centenarians against 2,899 controls finds G more common among the centenarians (1.44 % against 0.45 % of
  alleles, score Z 5.72, P 1.08e-8): genome-wide at the paper's threshold, in one old-against-young case-control,
  which R-TIER-2 caps at C until an independent sample replicates it (D22.1). None does. The paper's own replication
  in 480 Ashkenazi centenarians and about 800 controls (LGP) is on the same side and flat (0.03 against 0.02, P 0.4),
  and the paper says LGP's carriers of rare variants were too few to test. The frequency depends on the source, as at
  row 19: the HRC-imputed samples see a rare allele (NECS's controls 0.45 %, Park's UK Biobank about 0.08 %), the
  sequenced panels a common one (1000 Genomes Europeans 11.5 %, ALFA's Europeans 6.4 %, LifeGen's imputed cohorts
  about 10 %), and gnomAD carries no frequency for the site, which lies among the segmental duplications of 15q13
  (GOLGA6L7 is the second gene by locus-to-gene). Unlike row 41, the authors do not question the frequency and the
  references disagree with each other, so the source is not shown to be overfit (D26.10 needs the reference
  frequencies to agree against it); D is the alternative put to the lead. The other looks: LifeGen's LifeGen-only
  line, at the common frequency, is flat (P 0.78); Park 2025's own survival in UK Biobank puts the rare allele with
  more deaths, P 0.064, one-sided 0.032 against NECS's side (the allele read by the deposit's swap convention, q32);
  Deelen 2019, Zenin 2019 and FinnGen r11 hold no line. Power cannot be computed against NECS's effect on a site whose
  frequency is source-dependent, so no red flag is set (D28.1). Lifespan `−` on Park (D28.3: it reads against
  one-sided and no lifespan-class look reads for), with the caveat that which allele Park's carriers carry rests on
  the swap convention; exceptional survival `+` on NECS; healthspan untested. Causal C1: Gurinovich's PICS set is the
  lead alone (posterior 1), as at row 19; effector E3, no gene: locus-to-gene gives APBA2 0.42, under 0.5, and
  GOLGA6L7 0.20. The authors find APBA2 potentially very interesting (it stabilises the amyloid precursor protein),
  but nothing shows the effect runs through it: mechanism general ageing. PROTECT:PRESENCE (the rarer G protects in
  NECS). Neutral, protective and protective genotypes, as row 19; the genotype shares are NECS controls' (G 0.45 %),
  the frequency the claim was made at, and are uncertain given the panels.
