        conclusion: >-
          You carry two copies of the common version of this DNA position. It is the reference the other combinations
          are compared with. The position, on chromosome 15, lies within the APBA2 gene, and how common the other version is depends on how it was measured.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of a version of this DNA position that one American study of people who reached 100
          found more often among them than among younger people. A smaller study of centenarians leaned the same way
          without confirming it. How common this version is differs a lot between measurements, so this is an
          uncertain finding, and it says little about your own lifespan.
