    trait_efo_id: OBA_VT0005372
    effect_allele: G
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position. It is the reference the other combinations
          are compared with. The position, on chromosome 15, lies within the APBA2 gene, in a stretch of DNA that is
          hard to read reliably, and how common the other version is depends on how it was measured.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of a version of this DNA position that one American study of people who reached 100
          found more often among them than among younger people. A smaller study of centenarians leaned the same way
          without confirming it, and a large British study leaned the other way. The position is hard to measure
          reliably, so this is an uncertain finding, and it says little about your own lifespan.
      - genotype: G/G
        state: protective
        conclusion: >-
          You carry two copies of a version of this DNA position that one American study of people who reached 100
          found more often among them than among younger people. A smaller study of centenarians leaned the same way
          without confirming it, and a large British study leaned the other way. The position is hard to measure
          reliably, so this is an uncertain finding, and few people carrying two copies were studied.
