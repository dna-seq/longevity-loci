# The seed list's locus 77, APBA2 (15q13.1). Curated 2026-11-13. Lead rs77184423, the seed's only rsID (Gurinovich
# 2021's NECS centenarian SNP, intronic in APBA2), the sister of rows 19, 31, 41 and 58 from the same paper. G is rare
# in NECS (1.4 % of centenarians' alleles, 0.45 % of controls') and in Park's HRC-imputed UK Biobank (about 0.08 %),
# but common in the sequenced panels (0.115 in 1000 Genomes Europeans, 0.064 in ALFA's); gnomAD has no frequency.
locus_id: 77
locus_name: APBA2
verdict: re-tiered
verdict_reason: >-
  Tier C, from the seed's B, under R-TIER-2 (put to the lead, with D and with neutral states as the alternatives).
  Gurinovich 2021's GWAS of 1,320 NECS centenarians against 2,899 controls finds G more common among the centenarians
  (1.44 % against 0.45 % of alleles, score Z 5.72, P 1.08e-8): genome-wide at the paper's threshold, in one
  old-against-young case-control, which R-TIER-2 caps at C until an independent sample replicates it (D22.1). None
  does. The paper's own replication in 480 Ashkenazi centenarians and about 800 controls (LGP) is on the same side
  and not significant (0.03 against 0.02, P 0.4; "did not reach statistical significance"). Read as a test of NECS
  (crude log OR 1.17, Woolf SE 0.26, from the printed frequencies), LGP's crude OR 1.52 has power about 1.00 and
  heterogeneity P 0.038 at the printed digits, but across the one-digit rounding of LGP's frequencies the
  heterogeneity P runs from 0.001 to 0.41 (derived), so whether it is a red flag is unknown and it sets nothing
  (D26.3). The frequency depends on the source, as at row 19: NECS's controls (0.45 %), Park's HRC-imputed UK
  Biobank (about 0.08 %) and gnomAD's non-Finnish Europeans (0.27 %; Ashkenazi Jews 0.08 %) see a rare allele;
  1000 Genomes' Europeans (11.5 %), ALFA's (6.4 %) and LifeGen's imputed cohorts (about 10 %) a common one. With the
  references disagreeing among themselves and the authors not questioning it, the source is not shown to be overfit
  (D26.10's ground is reference samples agreeing against it); D is the alternative put to the lead. Lifespan 0:
  LifeGen's LifeGen-only line (at the common frequency) is flat, P 0.78. Park 2025's own-survival deposit has a line
  (the rare allele with more deaths, P 0.064), but at about 0.08 % it is below Park's own MAF 0.1 % filter, an
  excluded line (D26.7, as rows 44 and 75), so it reads nothing. Deelen 2019, Zenin 2019 and FinnGen r11 hold no line.
  Exceptional survival + on NECS; healthspan untested. Causal C1: Gurinovich's PICS set is the lead alone
  (posterior 1), as at row 19. Effector E3, no gene named: locus-to-gene gives APBA2 0.42, under 0.5 (GOLGA6L7 0.20),
  with no colocalisation and no pQTL (the SNP is not among the paper's 56 pQTL variants); every source names APBA2,
  which is named in prose. The authors find APBA2 potentially very interesting (it stabilises the amyloid precursor
  protein), but nothing shows the effect runs through it: mechanism general ageing. PROTECT:PRESENCE (the rarer G
  protects in NECS). Neutral, protective and protective genotypes, as row 19; the genotype shares are NECS
  controls' (G 0.45 %), the frequency the claim was made at. By 1000 Genomes about one European in five would carry
  a "protective" G, which is why neutral states are offered to the lead.
