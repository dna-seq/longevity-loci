variants:
  - rsid: rs2228145
    gene: IL6R
    phenotype: IL6R Asp358Ala, interleukin-6 signalling
    trait_efo_id: EFO_0007796
    effect_allele: C
    effect_size: 0.01145
    effect_measure: beta
    stat_significance: nominal
    direction: protective
    negatives: >-
      The longer-life version, C, also goes with more allergic disease: eczema (atopic dermatitis), hay fever and
      asthma.
    genotypes:
      - genotype: A/A
        state: risk
        conclusion: >-
          You carry two copies of the more common version of this DNA change, in the IL6R gene (about 41 in 100
          people of European ancestry do). IL6R makes the receptor for interleukin-6, a signal that drives
          inflammation, and this version keeps that signal at its usual strength. Compared with people who carry
          one copy of the other version, it went in large studies with slightly higher rates of rheumatoid
          arthritis and heart disease and, weakly, with parents who lived a little less long, and with somewhat
          less eczema, hay fever and asthma. This is early evidence, not a settled finding, and the difference is
          small: a tendency, not destiny. The finding comes mostly from people of European ancestry.
      - genotype: A/C
        state: neutral
        conclusion: >-
          You carry one copy of each version of this DNA change, in the IL6R gene, the most common combination
          (about 46 in 100 people of European ancestry). IL6R makes the receptor for interleukin-6, a signal that
          drives inflammation. This is the reference the other combinations are compared with. The finding comes
          mostly from people of European ancestry; less is known elsewhere.
      - genotype: C/C
        state: protective
        conclusion: >-
          You carry two copies of a version of the IL6R gene (about 13 in 100 people of European ancestry do) that
          dampens interleukin-6, an inflammation signal. In large studies each copy went with slightly lower rates
          of rheumatoid arthritis and heart disease, and, weakly, with parents who lived a little longer. The same
          version goes with somewhat more eczema, hay fever and asthma. This is early evidence, not a settled
          finding: a large study of older women with two copies found no difference in reaching age 90. It is a
          tendency, not destiny, and it says nothing about whether any medicine is right for you.
