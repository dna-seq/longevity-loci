# The seed list's locus 8, IL6R Asp358Ala (1q21.3), with locus 157, IL6R (p.Asp358Ala), folded in (D14): the seed's
# rs2228145 and rs8192284 are one variant, rs8192284 merged into rs2228145 in dbSNP (db-ensembl-116#q7, q8). Curated
# 2026-11-11, the ten-row run's ninth row. No genome-wide lifespan result exists at this variant; the seed's tier B
# rests on Rosa 2019's cis-MR. Wright 2019's clumped SNPs nearby were read by LD to the lead (Ensembl 116, 1000
# Genomes EUR): rs7518199 (fathers, r² 0.93) read, rs12568083 (mothers, r² 0.33) not. Pilling 2017's suggestive IL6R
# SNP rs6689306 (r² 0.40) is named, not scored. Open Targets 26.09 has no lifespan credible set holding the variant;
# the GWAS Catalog (2026-10-29) holds 36 associations for rs2228145 and 6 for rs8192284, none for lifespan.
locus_id: 8
locus_name: IL6R Asp358Ala
also_loci: [157]
verdict: re-tiered
verdict_reason: >-
  Tier C, from the seed's B: nothing at this variant reaches genome-wide significance, and §4.1's R-TIER-4 keeps an
  MR-only result out of A and B. The lifespan evidence at the variant itself is nominal and points one way: in
  Timmers 2019's summary statistics C, the minor allele (40 % in Europeans, the 358Ala of the receptor), goes with
  longer-lived parents (P 0.0034, the same side in UK Biobank and LifeGen); in Wright 2019's AncestryDNA fathers, the
  one sample outside UK Biobank and LifeGen, a close proxy (rs7518199, r² 0.93, its C riding with the lead's C by
  frequency) does the same in fathers (P 0.0011, born 1886-1918; 0.0043 born 1886-1940) and mothers (0.0051); and in
  Zenin 2019 C delays the end of healthspan (P 0.017), in UK Biobank. No clause of C fits the lead literally: nothing
  at it is suggestive (P < 1e-5), though Pilling 2017's IL6R SNP rs6689306, only partly correlated with it (r² 0.40),
  reaches 1.5e-6 on the same side. C is a judgement: B's first condition (genome-wide) fails, the nominal results
  agree in direction in two independent samples, and nothing contradicts them, so D does not fit either.
  The seed's B came from Rosa 2019's cis-MR: genetically higher soluble IL6R, that is less IL-6 signalling, lengthens
  fathers' and mothers' age at death (P 3.8e-5 and 2.1e-5) over 34 instruments that do not include the variant, in
  UK Biobank parents; it points the same way (C raises soluble IL6R) but is annotation, not a per-allele result. The
  Women's Health Initiative, the seed's locus 157, found no difference in survival to 90 between women with two C
  alleles and none (OR 1.00, 0.91 to 1.09; 23,464 women of several ancestries; abstract only): a null, but one whose
  interval does not exclude an effect of the size seen in the parental studies, so it does not contradict them (not
  D). The supporting evidence is European (eur_only_evidence); the one multi-ancestry study is the null. The mechanism is immune and inflammation: C is the reduced-signalling allele (lower CRP, higher soluble IL6R
  and IL-6, the pattern of tocilizumab), and it lowers rheumatoid arthritis and coronary heart disease (OR 0.95 per
  allele at a tag, r² 0.94) and tuberculosis (OR 0.94). The trade-off is detected: the same C raises allergic
  disease and atopic dermatitis. Causal confidence is C4 for longevity (no set of the seven lifespan, healthspan and
  longevity studies in Open Targets 26.09 holds it, of the 286 sets it is in); the variant is missense in IL6R, so the effector is IL6R by
  §4.2's coding clause (E1). The protection is a presence, the minor C. Not a treatment indication (R-VOICE-4). Age
  of action is unknown.
