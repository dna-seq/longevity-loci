# The seed list's locus 92, FBXO15 (18q22.3; the seed's genes "FBXO15; RN7SL401P"). Curated 2026-11-14. Lead
# rs77546126, the seed's only rsID (Gurinovich 2021's NECS centenarian SNP), intronic in a lncRNA near FBXO15, GRCh38
# 18:73,851,283, GRCh37 18:71,518,518, T/G. G is rare in NECS (1.07 % of centenarians' alleles, 0.19 % of controls')
# and in gnomAD's non-Finnish Europeans (0.15 %), but common in 1000 Genomes' Europeans (9.2 %) and ALFA's (5.5 %): the
# sister of rows 19 and 77 from the same paper.
locus_id: 92
locus_name: FBXO15
verdict: re-tiered
verdict_reason: >-
  Tier C, from the seed's B, under R-TIER-2 (D30.5, row 77's shape). Gurinovich 2021's GWAS of 1,320 NECS
  centenarians against 2,899 controls finds G more common among the centenarians (1.07 % against 0.19 % of alleles,
  score Z 5.92, P 3.3e-9, Supplement Table 1): genome-wide at the paper's threshold, in one old-against-young
  case-control, which R-TIER-2 caps at C until an independent sample replicates it (D22.1). None does. The paper's own
  replication in the Longevity Genes Project (Table 2; 312 Ashkenazi centenarians, 638 controls, Table 1) is flat (G
  0.007 against 0.006, printed score 0, P 0.9). Taken at face value it is a D21 red flag: on the discovery's own
  scale (crude log odds ratios, no conversion; NECS 1.74, SE 0.36, LGP about 0.16, SE 0.60) one-sided power about
  0.89 and heterogeneity P about 0.024 (0.87 to 0.91 and 0.014 to 0.041 over the printed frequencies' rounding), with
  no independent scoring-class study at P < 0.05 for G, which by D25.1's letter would make the row D. It is held at C,
  the null named and never counted (D30.10, D30.5 generalised): LGP's controls carry G at about a third of gnomAD's Ashkenazi
  frequency (0.006 against 0.0166; about 8 copies where 21 are expected, P about 0.001), so its calls at this rare
  variant are not shown reliable; the frequencies are printed to one figure, and NECS's crude odds ratio rests on
  about 11 control copies, a winner's curse inflating the power. No replication_failed. The frequency depends on the source, as at 19 and 77: NECS's controls (0.19 %) and gnomAD's
  non-Finnish Europeans (0.15 %) see a rare allele, 1000 Genomes (9.2 %) and ALFA (5.5 %) a common one, and Deelen
  2019's files hold not the SNP but two insertion-deletions two and six bases from it at 0.10 and 0.11 (flat, P 0.56
  to 0.94), the common frequency on an indel beside the rare SNP, as at 19. gnomAD agrees with NECS's controls, so the
  source is not shown overfit (D26.10): not D. Nothing else tests the lead: Timmers 2019's deposit, Pilling 2017's,
  Zenin 2019's healthspan, FinnGen R11's death endpoint (G absent in gnomAD's Finns) and Foote 2025's frailty deposits hold no
  line; Park 2025's line is at about 0.04 %, below its own MAF 0.1 % filter, an excluded line (D26.7, as 77); Wright
  2019's three nearest AncestryDNA lines (89 to 503 kb away) have no CEU LD pair to the lead; Rosoff 2023's mvAge
  tables hold no line. The rsID literature search (Europe PMC, PubMed, OpenAlex, Crossref, preprints; Semantic Scholar
  429, its part unchecked) finds this paper alone. Exceptional survival + on NECS; lifespan and healthspan untested.
  Causal C1 by §4.2's threshold, with little meaning: Gurinovich's PICS set is the lead alone at posterior 1, by
  construction for a rare variant, as at 19 and 77. Effector E2 by locus-to-gene alone: TIMM21 0.76 (FBXO15 0.34),
  with no colocalisation of any kind, on a set built from the reported top hit; the paper and the GWAS Catalog name
  FBXO15, so the gene cell is TIMM21 (as 91's at E2 by locus-to-gene) and FBXO15 is named in prose. The authors call the region
  intragenic with little annotation: mechanism general ageing, pleiotropy empty, descriptive. PROTECT:PRESENCE (the
  rarer G goes with reaching 100). Neutral, protective and protective genotypes, as 19 and 77, the shares NECS
  controls' (G 0.19 %), the frequency the claim was made at. Age of action unknown. The evidence is European.
