variants:
  - rsid: rs6902687
    gene: ""
    phenotype: ZSCAN23 upstream region (6p22.1), lifespan
    trait_efo_id: OBA_VT0005372
    effect_allele: T
    effect_size: -0.004
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA position, as about 47 in 100 people of
          European ancestry do. It is the reference the other combinations are compared with. The position, on
          chromosome 6, lies just upstream of the ZSCAN23 gene; which gene it acts through is not known. The finding comes
          from people of European ancestry; less is known elsewhere.
      - genotype: C/T
        state: risk
        conclusion: >-
          You carry one copy of a version of this DNA position that about 43 in 100 people of European ancestry
          carry. In a large British study, people with this version tended to die slightly earlier, and in a
          separate European study of long-lived people it was less common among those who reached old age. A large
          Finnish study did not confirm it, so it is a likely finding, not a settled one. The effect is small, and
          it is a tendency, not destiny. How it acts is not known; the same region is also linked to celiac disease.
      - genotype: C/C
        state: risk
        conclusion: >-
          You carry two copies of a version of this DNA position, as about 10 in 100 people of European ancestry
          do. In a large British study, each copy went with a slightly earlier death, and in a separate European
          study of long-lived people this version was less common among those who reached old age. A large Finnish
          study did not confirm it, so it is a likely finding, not a settled one. The effect is small, and it is a
          tendency, not destiny. How it acts is not known; the same region is also linked to celiac disease.
