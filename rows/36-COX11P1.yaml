# The seed list's locus 36, COX11P1 (6p22.1; the seed's genes "COX11P1;ZSCAN23"). Curated 2026-11-11, the fourth
# run's second row. Lead rs6902687 (GRCh38 6:28,445,714, GRCh37 6:28,413,491), the seed's only rsID: intergenic, 2.2 kb
# upstream of ZSCAN23, C 0.31 in Europeans, in the extended MHC about 2.7 Mb from row 37's leads and 4 Mb from row 38's
# (Ensembl's pairwise LD answers nothing for the triallelic lead, so its tag rs13190937, r² 1.0 to rs13215804,
# stands in: r² 0.06 to row 37's rs3130507; no pair returned for rs3131621 or row 38's rs34967069, unknown). Park 2025's whole-cohort
# own-survival GWAS of UK Biobank. Park's deposited summary statistics swap their allele columns (pmid-40021682 note);
# directions are read from the paper. Open Targets 26.09 has no record of the lead or its tags; the GWAS Catalog
# (2026-10-29) holds Park's association and a red-cell factor.
locus_id: 36
locus_name: COX11P1
verdict: kept
verdict_reason: >-
  Tier B, the seed's, kept, and capped there by a powered null. Genome-wide in one study: Park 2025's own-survival
  GWAS of 393,833 UK Biobank participants (35,551 dead), where rs6902687's C goes with a shorter life (β 0.004 on
  the Martingale residual, P 2.7e-8, at the paper's 5.0e-8). It replicates nominally in a sample with no UK Biobank
  data: Deelen 2019's 90th-percentile survival, T with reaching the age, β 0.077 (SE 0.021), P 2.2e-4; the 99th
  percentile leans the same way (P 0.30). Calibrated from LifeGen's beta1 (D25.3), the 90th percentile shows the
  size expected under the APOE factor (expected 0.073, heterogeneity P 0.90) and a larger one under the mean factor
  (0.031, power 0.43): no flag. But Park's own validation in FinnGen's "Any death" (50,511 deaths, 403,222 alive)
  fails: C β −0.0113 (SE 0.0089), P 0.20, leaning to less death. There is no Timmers calibration for this pair of
  scales (a Martingale residual against a binary death endpoint), so the expected effect is scaled within FinnGen
  by two variants Park also reports, counting each factor's own error in the heterogeneity P. APOE's ε4 is 8.1
  (SE 0.9) times larger in FinnGen than in Park: expected C β 0.031, one-sided power 0.97, heterogeneity P 1e-4, a
  red flag (D21). MUC5B's rs35705950 is 6.7 (SE 2.8) times larger: expected 0.026, power 0.90 and heterogeneity P
  0.012 at the point estimate, a flag there; but power 0.8 needs a factor of at least 5.8, and about a third of
  that factor's uncertainty lies below it. So the flag is firm under APOE, the late-acting variant whose factor
  D25.3 says overstates what other loci should show, and holds under MUC5B only at its point estimate. The
  discovery also sits just past the threshold (P 2.7e-8), where its β is likely inflated, which overstates the
  expected effect. Default B with replication_failed, put to the lead: under D25.3's reading (a flag one
  calibration raises is no flag), the row is A on §4.1's letter, Deelen the replication. It is not D either way
  (D25.1), because Deelen's independent 90th percentile gives P 2.2e-4 in the discovery's direction. Lifespan +:
  LifeGen with UK Biobank gives T a longer parental life (P 1.7e-4, ++), but its UK Biobank part is Park's people's
  parents, so it co-occurs and does not replicate. Healthspan 0: Zenin 2019 leans C earlier, raw P 0.0496, but 0.056 after the
  genomic control of 1.053 its own results take (D17.3); the same UK Biobank people. Exceptional survival +: Deelen's 90th. Wright 2019's AncestryDNA mothers hold no tag of the
  lead (rs1029328, 34 kb away, r² 0.33 to the tag rs13190937): untested there, not null. Mechanism:
  general ageing. Park's PheWAS of the tag rs13190937 is led by celiac disease and intestinal malabsorption (P
  1.8e-57), filed as mech:autoimmune; nothing shows the lifespan effect runs through it (D25.7), and whether that
  celiac signal is this one or a shadow of HLA-DQ (row 38) is unknown: Ensembl returns no pair with row 38's lead. The paper's
  "pancreatic tumors" rests on a pancreatic eQTL alone and is not filed. Causal: C4, since no Open Targets credible
  set holds the lead or its three R² > 0.99 tags. Effector: E4, gene empty. Park colocalises the signal with a
  ZSCAN23 eQTL in pancreas, PP4 0.934 (H4 ≥ 0.8), which §4.2's "coloc alone" would make E2 ZSCAN23; but it is one
  tissue and one gene the paper chose, with no locus-to-gene score, and D24's rival test cannot run (it counts over
  credible sets, and there are none), so the call is unassessed, not passed. E2 ZSCAN23 is put to the lead. Actionability is descriptive. The protection is the absence of risk: T, the common allele (0.69), is the
  reference. European only; C is rarer in Finns (0.22) and East Asians (0.14). Age of action is unknown.
