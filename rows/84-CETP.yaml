# The seed list's locus 84, CETP (16q13). Curated 2026-11-13. Lead rs3764261, the seed's lead (entered by the
# pleiotropy track alone, as CETP's HDL variant): upstream of CETP, C/A, A the minor allele (0.29 in Europeans), the
# HDL-raising and longer-lived side. The seed's second rsID, rs5882 (CETP I405V, the legacy candidate of Barzilai
# 2003), is a separate variant with no European LD to the lead that Ensembl reports. Open Targets 26.09: 1,707
# credible sets hold the lead, none of a lifespan study.
locus_id: 84
locus_name: CETP
verdict: re-tiered
verdict_reason: >-
  Tier C, from the seed's B, by R-TIER-4, row 83's shape: nothing at the lead reaches genome-wide significance for a
  lifespan or healthspan phenotype, nothing in Timmers 2019's window (GRCh37 16:56.7-57.2 Mb) even reaches suggestive
  (its strongest line P 4.8e-4), the lead is not even the window's peak, and Timmers' risk-factor-informed Bayesian scan (Table 2) does not
  list the locus (D28.7). Sub-genome-wide, it is out of A and B (R-TIER-4); the seed's B was the pleiotropy track's
  (MR:drug_target_proxy, CETP read as an HDL drug target), which no note here holds as a per-variant result. The variant's own lifespan evidence is
  nominal and points one way. Timmers 2019's million parents' lives: A longer-lived, P 0.0012, UK Biobank and LifeGen
  both on that side (Pilling's UK Biobank parents P 1.6e-4). Park 2025's own survival in UK Biobank: A with fewer
  deaths, P 0.015 (its allele columns swapped, as the frequencies show), the same biobank, co-occurring. Outside UK
  Biobank: Deelen 2019's 90th percentile, A one-sided 0.038 (its 99th, a subset of the same cases, leans the same way,
  P 0.23); FinnGen R11's death endpoint, A with fewer deaths, one-sided 0.044, a database line (D29.1). Wright 2019's
  only nearby line, rs2278490 in the fathers' Table 9, has no LD to the lead that Ensembl reports in CEU or GBR, so
  AncestryDNA is untested here. Zenin 2019's healthspan leans A's way, flat (P 0.23 after its genomic control, D26.1). B's first condition fails, the
  nominal results agree in independent samples, and nothing contradicts them, so not D. Lifespan +, exceptional
  survival + (Deelen's one look-up, one-sided), healthspan 0. The seed's B was the pleiotropy track's; the seed's
  second rsID, rs5882 (I405V), is Barzilai 2003's candidate: 213 Ashkenazi probands with exceptional longevity, whose
  large-particle lipoprotein phenotype the abstract ties to homozygosity for the variant (V, the G allele), a small
  single-sample candidate-gene result (§4.1's C clause; the cached abstract breaks before its genotype P), and in the large
  samples it is flat (Timmers P 0.35, its V leaning longer; Pilling 0.11; Deelen 0.87 and 0.25; FinnGen 0.28; Zenin
  0.69). It is a separate variant from the lead, named here and not a variant of this row. Mechanism: ageing in
  general (D25.7). The lead tops 434 of its 1,707 sets, 408 of them lipid, fatty-acid or lipoprotein traits: A
  raises HDL cholesterol in every HDL-cholesterol-level set it tops (UK Biobank, posterior 0.96, P 1e-322; one
  case-control "low HDL" set runs the other way on an unnamed scale) and lowers the VLDL and LDL fractions, and A goes
  with less statin use (P 7e-9); but nothing shows the lifespan effect runs through HDL, and no coronary set with a β is
  topped by the lead. The one ageing-named set at CETP, He 2016's pleiotropic analysis of age-related diseases and
  endophenotypes in 9,618 people (GCST004045, P 1e-149, the lead at posterior 0.08), counts lipids among its
  endophenotypes, so at CETP it reads as the lipid signal, not a scoring class (§4.5): named and not counted (put to
  the lead). Two disease sets run against it, both macular degeneration, A raising it (P 7e-9 and 8e-12), as
  every macular-degeneration set at the locus has its alt allele raising it: a quoted harm on the longer-lived side
  (D18.1), tradeoff, so descriptive. Pleiotropy mech:lipids and tradeoff. Causal C4 and effector E4, no gene
  named: no credible set of a lifespan-class study holds the lead (none of eleven longevity studies queried); CETP is
  named in prose. A is the minor allele at 29 %, so C/C, the commonest genotype, is the reference (§6.2): A/C and A/A
  protective, PROTECT:PRESENCE. Age of action unknown. The evidence is European.
