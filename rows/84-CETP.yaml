variants:
  - rsid: rs3764261
    gene: ""
    phenotype: CETP, HDL cholesterol, parents' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: 0.01341945
    effect_measure: beta
    stat_significance: nominal
    direction: protective
    negatives: >-
      The longer-life version, A, also goes with a slightly higher risk of age-related macular degeneration, an eye
      disease of later life.
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 50 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome
          16, lies just before the CETP gene, which handles cholesterol in the blood. The finding comes from people
          of European ancestry; less is known elsewhere.
      - genotype: A/C
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 41 in 100 people of European
          ancestry do). It raises "good" HDL cholesterol, and in large studies parents of carriers lived a little
          longer, with a separate study of people who reached old ages leaning the same way. No single study found
          it beyond doubt, so this is a possible finding, not a settled one. The same version goes with a slightly
          higher risk of age-related macular degeneration. The effect is small and it is a tendency, not destiny.
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 9 in 100 people of European
          ancestry do). Each copy raises "good" HDL cholesterol, and in large studies parents of carriers lived a
          little longer, with a separate study of people who reached old ages leaning the same way. No single study
          found it beyond doubt, so this is a possible finding, not a settled one. The same version goes with a
          slightly higher risk of age-related macular degeneration. The effect is small and it is a tendency, not
          destiny.
