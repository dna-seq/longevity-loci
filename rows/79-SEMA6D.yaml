# The seed list's locus 79, SEMA6D (15q21.1). Curated 2026-11-13. Lead rs74011415, the seed's only rsID (Pilling
# 2017's fathers' lead, an intron variant of SEMA6D): G, the common allele (0.88 in Europeans), goes with longer-lived
# fathers. Wright 2019's own SEMA6D lead rs4774495, 8.8 kb away, is at r² 1.0 (CEU, GBR) and carries the locus in
# AncestryDNA. Open Targets 26.09 holds the lead in two sets, neither of a lifespan study; the GWAS Catalog holds
# Pilling's and Wright's records.
locus_id: 79
locus_name: SEMA6D
verdict: re-tiered
verdict_reason: >-
  Tier A, up from the seed's B, on §4.1's letter (put to the lead, with B the alternative). Genome-wide in Pilling
  2017's fathers (UK Biobank; the GWAS Catalog gives the fathers' study 415,311 people, the paper 389,166 meeting
  any analysis's criteria; P 1.4e-8, under the paper's per-GWAS 5e-8): G (0.88) with longer-lived fathers, β −0.0192
  on the Martingale residual. A stratum's genome-wide hit is a genome-wide study, read at the paper's own threshold
  (D19.2); Pilling ran five GWAS and did not correct across them (five times 1.4e-8 is 7e-8), which is the case for B. Independent replication, same allele, in the study's own chosen SNP: Wright 2019's AncestryDNA fathers,
  outside UK Biobank, at rs4774495 (r² 1.00, D′ 1.00 in CEU and GBR, its T with the lead's G), which Wright's Table 3
  lists in its meta-significant block, above "Not Replicated" (meta-analysis P 4.9e-8); the replication rests on the
  AncestryDNA arm's own P. The AncestryDNA arm puts T on the longer-lived
  side, P 0.0043 (one-sided 0.0021 raw, about 0.0043 after the fathers' genomic control, λ 1.182, derived), and agrees
  with the UK arm (heterogeneity P 0.20). The UK arm is Pilling's fathers' line digit for digit, which fixes the
  allele; it alone is P 3.3e-8, far under Table 9's 2.5e-3 filter, so D29.18 does not touch the line; Wright has no
  line at Pilling's lead, so its own lead stands in (D29.3). No red flag (D21). Timmers 2019's LifeGen fathers with
  UK Biobank's lives removed (Figure 2 source data, sample b) are on the same side and not nominal (G +0.0105, SE
  0.0167, against the discovery's +0.0439, SE 0.0077 on Timmers' sheet; one-sided P 0.26): power 0.84, heterogeneity
  P 0.069 (both errors, derived), short of the flag, which it would reach only from about 1.07 times the printed
  discovery effect. Unlike row 6, where D28.9 rebuilt UK Biobank's effect from Timmers' pooled β, the claim here is
  the fathers' and Timmers' pooled β is both parents', so the sheet's own discovery effect is the comparison. Deelen
  2019 leans G's way at both percentiles (90th one-sided 0.082, 99th 0.34). Calibrated from the discovery (D27.9,
  D28.2) in its both-parents form, backed out of Pilling's P 7.0e-6 at the fathers' sheet SE over √2 (G +0.024, SE
  0.0054; derived), the 90th is powered under APOE's factor (0.99) at heterogeneity P 0.053 and under the mean factor
  unpowered (0.51); the 99th 0.82 at P 0.062, and 0.28. From the fathers' own +0.0439 the APOE factor flags (power
  1.00, heterogeneity P 0.0003 and 0.0011) and the mean factor does not (power 0.91 and 0.61, P 0.16 and 0.15). A flag
  under one calibration only, so none (D25.3). The
  rest of the evidence agrees or is flat: Timmers' pooled parents G longer, P 1.4e-4 (UK Biobank inside); Park 2025's
  own survival, the UK Biobank participants themselves (its allele columns swapped, as the frequencies show), G with
  fewer deaths, P 0.017, co-occurring, not a replication (row 36's reading); FinnGen R11's death endpoint G with
  slightly fewer deaths, P 0.87; Zenin 2019's healthspan G later, P 0.17 after its genomic control. The effect is the
  fathers': Pilling's mothers give G −0.0067 (SE 0.0034, P 0.05), and fathers against mothers is heterogeneity P
  0.0089 with both errors counted (D29.16, D29.6; derived), so sex_specific:m. Wright's mothers' Table 9 holds three SNPs 60 to 80 kb away (rs1378214, AncestryDNA P
  0.0037), none a tag (r² 0.14 to 0.18 in CEU and GBR). Lifespan +, healthspan 0, exceptional
  survival 0. Mechanism general ageing: the GWAS Catalog holds only lifespan records at the lead and its proxy, and
  Open Targets' two sets holding the lead (education age, ever smoking, locus-to-gene SEMA6D) are led by other
  variants with the lead at a posterior of 0.005 or less, named only; pleiotropy empty, descriptive. Causal C4 and
  effector E4, no gene named: none of Pilling's five deposits nor the nine longevity studies has a credible set here;
  the lead sits in SEMA6D's introns, named in prose. G is the common allele at 88 %, so G/G is the reference (§6.2)
  and A, the minor allele, the risk: PROTECT:ABSENCE_OF_RISK, as row 63. Age of action unknown: Timmers' age bands do
  not include the locus. The evidence is European (UK Biobank, AncestryDNA's European-ancestry group, LifeGen).
