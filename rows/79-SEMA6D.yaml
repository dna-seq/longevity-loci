variants:
  - rsid: rs74011415
    gene: ""
    phenotype: SEMA6D region, fathers' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: G
    effect_size: -0.0192
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 78 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position, on chromosome 15,
          lies inside the SEMA6D gene; which gene matters, if any, is not known. The finding comes from people of
          European ancestry; less is known elsewhere.
      - genotype: A/G
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 21 in 100 people of European
          ancestry do). In a very large British study, fathers of carriers lived a little less long, an effect seen
          in fathers and much more weakly in mothers, and a large American study confirmed it in fathers. It is a
          well-supported finding, but the effect is small: a few months of life on average, and a tendency, not
          destiny.
      - genotype: A/A
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 1 in 100 people of European
          ancestry do). In a very large British study each copy went with fathers living a little less long, an
          effect seen in fathers and much more weakly in mothers, and a large American study confirmed it in fathers.
          Few people carry two copies, so how they fare was not measured directly. The effect is small and it is a
          tendency, not destiny.
