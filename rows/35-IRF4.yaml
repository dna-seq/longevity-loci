# The seed list's locus 35, IRF4 (6p25.3; the seed's genes "IRF4; IRF4/EXOC2"). Curated 2026-11-11, the fourth run's
# first row. Lead rs12203592 (Zenin 2019's healthspan SNP, Table 2), the seed's only rsID here: an intron variant of
# IRF4, at the same coordinate in GRCh37 and GRCh38. T 0.21 in the British samples, 0.12 in 1000 Genomes Europeans,
# 0.03 in Finns and Africans, 0.08 in admixed Americans, almost absent in East and South Asians. In Zenin's, Timmers 2019's and Deelen 2019's summary
# statistics at the lead itself; in Rosoff 2023's mvAge tables. No other row's lead lies near it.
locus_id: 35
locus_name: IRF4
verdict: re-tiered
verdict_reason: >-
  Tier A, up from the seed's B, on D16's reading of §4.1 (with a co-occurring lifespan study "a genome-wide
  healthspan locus is tiered by §4.1 as any other", and D16 names this locus), put to the lead. Each criterion: (1) genome-wide for healthspan in 300,447 British UK Biobank
  participants: C, the common allele, delays the end of healthspan (Zenin 2019, T β 0.063 on the log hazard per
  allele, P 1.8e-25 after genomic control, the paper's own call, D17.3). (2) Independent replication, the same allele
  and direction: in 96,313 other UK Biobank participants, checked for no kinship with the discovery set, β 0.043,
  P 2.1e-5, under the paper's 0.05/12; that sample is the one D17.1 read as an independent test at row 103. (3) No
  red flag: with replication power 0.9987 (Zenin's formula), the two estimates differ at heterogeneity P 0.094
  (D21); the replicated effect is about two thirds of the discovery's, not "much smaller". (4) The co-occurring
  lifespan study (D16): Timmers 2019's summary statistics give C the longer parental life, beta1 0.0157 per C, P
  0.0016, both UK Biobank and LifeGen on that side, and Zenin's own parents'-death test agrees (P 0.006). Its UK
  Biobank part is the same people as Zenin's, so it co-occurs but does not replicate; it is this locus's own (D17.1):
  the lead is the healthspan set's only member, and no other row's lead is near. D22.2's "replicates nothing on its
  own" is read as met: the healthspan replication sits beside a lifespan study. If the lead reads D22.2 to ask a
  scoring-class replication outside UK Biobank for A, the row is B: of those, only Deelen tested the lead, short of
  0.05 (below); LifeGen's own arm leans to C (the file's "--") but prints no P of its own, and AncestryDNA's mothers
  (Wright 2019) hold no tag of the lead (the nearest, rs11242982, r² 0.15), so untested there, not null. The
  oldest ages lean to C and do not pass: Deelen 2019's 90th and 99th percentiles, OR per C 1.05 and 1.07 (P 0.13,
  0.15). Calibrated from LifeGen's beta1 (D25.3), the 90th has one-sided power 0.77 by the APOE factor
  (heterogeneity P 0.48) and 0.26 by the mean factor (0.63): no red flag either way, and exceptional survival is 0.
  Rosoff 2023's mvAge (C, P 6.9e-12) and Timmers 2020's multivariate ageing scan (P 8e-26, no direction printed) pool
  these same samples and add nothing independent. A literature search on the rsID found no further lifespan study
  (OpenAlex and Semantic Scholar unchecked, HTTP 429). By component, T's healthspan effect is mostly cancer (P 3e-39),
  but not cancer alone: the other diseases together P 0.017, own death 0.037, uncorrected across nine components; the
  variant is among the strongest skin-colour, tanning and skin-cancer signals known (C lowers squamous and basal cell
  carcinoma and melanoma), and Zenin names pigmentation and non-melanoma skin cancer. The mechanism is filed as skin
  and sun with mech:cancer; whether Zenin's cancer outcome holds non-melanoma skin cancer is not stated, and the route
  of the lifespan effect is not shown (D25.7). Actionability is modifiable, act_screen:skin: §4.2's label names sun,
  and the risk allele's route is low tanning and skin cancer; that sun care changes this locus's effect is not
  itself tested. The seed's trade-off has no quoted harm of C (D18.1): puberty-timing sets are no harm, and
  progressive supranuclear palsy's allele is unstated. Causal C1: Zenin's SuSiE-inf healthspan set holds the lead
  alone at PIP 1.00 (the multivariate sets, PICS, likewise). Effector E1, IRF4: locus-to-gene 0.79 and 109 of 114 QTL
  colocalisations of the healthspan set are IRF4's (eQTL, sQTL, transcript usage); the other five are single pQTLs, each
  under D24's tenth. The protection is the absence of the risk allele T
  (the common C protects). Age of action is unknown. Evidence is European only; T is commonest in north-west Europe,
  0.08 in admixed Americans, and almost absent in East and South Asians.
