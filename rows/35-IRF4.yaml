variants:
  - rsid: rs12203592
    gene: IRF4
    phenotype: IRF4 region, healthspan (mostly skin cancer)
    trait_efo_id: EFO_0009762
    effect_allele: C
    effect_size: -0.063
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region (about 62 in 100 people of British ancestry
          do, and nearly everyone of East or South Asian ancestry). It is the reference the other combinations
          are compared with. The region lies in the IRF4 gene on chromosome 6, and this region is linked to skin, hair and eye
          colour and to how well the skin tans. The finding comes from people of European ancestry.
      - genotype: C/T
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 34 in 100 people of British ancestry
          do, and about 15 in 100 of Latin American ancestry; it is rarer elsewhere in Europe and almost absent in
          East and South Asia). This version goes with more freckling, tanning less, and more skin cancer. In a very large British study, confirmed in a
          second group, it went with a slightly earlier first major disease, mostly cancer; this finding is well
          established. The parents of carriers lived slightly shorter lives, a smaller result pointing the same
          way. Protecting your skin from the sun and having changing moles or skin spots checked are sensible. It
          is a tendency, not a verdict.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 5 in 100 people of British ancestry
          do). This version goes with more freckling, tanning less, and more skin cancer. In a very
          large British study, confirmed in a second group, each copy went with a slightly earlier first major
          disease, mostly cancer; this finding is well established. The parents of carriers lived slightly shorter
          lives, a smaller result pointing the same way. Protecting your skin from the sun and having changing
          moles or skin spots checked are sensible. It is a tendency, not a verdict.
