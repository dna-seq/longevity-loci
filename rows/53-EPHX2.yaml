# The seed list's locus 53, EPHX2 (8p21.1, between EPHX2 and CLU, Wright 2019's "EPHX2..CLU"). Curated 2026-11-11.
# Lead rs7844965 (the seed's only rsID; GRCh38 8:27,584,547, GRCh37 8:27,442,064), G/A, A at 0.23 in Europeans and
# 0.15 in East Asians, in an intron of the unitary pseudogene GULOP by Ensembl's VEP (the papers' label is EPHX2).
# In Pilling 2017's Table 2, Timmers 2019's summary statistics and Figure 2 source data, Wright 2019's Table 3 and
# Supplemental Tables 8 and 9, Deelen 2019's Supplementary Data 1, Zenin 2019's and FinnGen R11's summary statistics,
# all at the lead itself.
locus_id: 53
locus_name: EPHX2
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it, on red-flag heterogeneity, row 67's shape. Genome-wide in Pilling 2017's 389,166 UK
  Biobank participants (both parents' attained age, P 7.7e-9; fathers 2.2e-7), the rarer A (0.23 in Europeans, about
  41 in 100 carry it) on the longer-lived side, and replicated outside UK Biobank: in AncestryDNA's fathers (Wright
  2019, n 309,383, A +0.013 z-units, P 9.1e-6, one-sided 4.5e-6; heterogeneity with UK Biobank P 0.998), AncestryDNA's
  mothers (one-sided 0.029) and FinnGen R11's death endpoint (A fewer deaths, one-sided 0.011; under APOE's factor
  power 0.96, heterogeneity P 0.33). But LifeGen with UK Biobank's lives removed, Timmers 2019's Figure 2 replication
  sample, gives A +0.0073 (SE 0.0094) against Pilling's +0.0303 (SE 0.0053), one-sided P 0.22: at power about 0.94
  the heterogeneity P is about 0.033, a D21 red flag on the same scale. Deelen 2019's 90th percentile, flat (OR 1.005
  per G, P 0.83), flags too, under both D25.3 calibrations from Pilling's effect (APOE's factor: power 1.00,
  heterogeneity P 9e-6; the mean factor: 0.85, 0.0085); the 99th (P 0.79) flags under APOE's only. A powered sample
  that fails caps the row at B (§4.1, D21) and carries `replication_failed` (D25.13), though three others replicate.
  Timmers 2019's million-life pool, which holds Pilling's UK Biobank and the weaker LifeGen arm, gives P 7.2e-8, A
  +0.025 (suggestive, the window's smallest P its tag rs6558008's 5.8e-8, r² 0.97); Wright's fathers' meta P 5.8e-10
  pools UK Biobank and is not counted. Healthspan +: Zenin 2019 has A delaying the end of healthspan, one-sided P 0.037
  (about 0.041 after its genomic control, D26.1). Lifespan +, exceptional survival 0 (Deelen flat at both
  percentiles; Pilling's both-parents-in-the-top-10 % P 6.0e-4 is the discovery's own UK Biobank). Wright ties EPHX2/CLU to Alzheimer's disease, but Ensembl's CEU LD gives no pair above r² 0.05 with
  CLU's Alzheimer SNPs rs11136000 and rs9331896 (empty answers, uncached), so the lead is not that signal. Mechanism is
  ageing in general (D25.7): the Catalog holds only the four parental-longevity records at the lead; Open Targets puts
  it in lung cancer (or family history of it: C at its tag rs6558008, riding with A, OR 0.928, P 8e-12), hematocrit,
  hemoglobin (A lower) and white-cell sets, broad. Two never-smoking sets with the lead at posterior 1.0 and 0.12 come
  from UK Biobank's African (6,532 people) and East Asian (2,649) subsets at P near 1e-13, sizes too small for such P
  at a SNP with no European smoking record, so they are named and not read as a smoking route; the family-history half
  of the lung-cancer phenotype is parents' disease, close to the lifespan phenotype itself. No trade-off: no record
  puts a harm on A's side. Descriptive. Causal C1: the lead tops Pilling's set, the one the tier rests on, at posterior
  0.66 (rs6558008 0.23, so which of the two acts is open), and Wright's set at 0.42. Pilling's set was fine-mapped
  without in-sample LD. Effector E2 GULOP by
  colocalisation alone, put to the lead as a default: a single-cell eQTL of the pseudogene GULOP in enterocyte
  progenitors (IBDverse) colocalises with both lifespan-class sets at H4 0.98 and 0.99, the only colocalisations at
  H4 ≥ 0.8; but that eQTL study has 303 samples and a QC flag, its own set is led by another SNP (0.57, the row's
  lead 0.058), and the CLPP is about 0.05, so the call stands on H4 by §4.2's letter and little else; CHRNA2, the top locus-to-gene gene (0.23, under 0.5), colocalises in cerebellum at H4 0.52 only, so it
  does not make the call ambiguous (D24). EPHX2, the papers' label, meets no criterion and is not named. G/G, about 59
  in 100 Europeans, is the reference; A carriers are the protected (PROTECT:PRESENCE; the paper names A the rare,
  lifespan-raising allele). Age of action is unknown: the lead is not in Timmers' Figure 5 sheets. rs11780471, 97 kb
  away and 3.6 kb upstream of EPHX2, is genome-wide in Wright's fathers' meta-analysis (P 3.2e-8) and tags the lead at
  r² 0.13 (D′ 0.66): not this signal's proxy, its independence untested. It is a smoking locus (its A, longer-lived in
  Wright, lowers smoking initiation, P 5e-110, and lung cancer, P 2e-8), which is why `smoking_lungs` is put to the
  lead beside `general_ageing`, the default; named here and queued for the scout (D25.6), none of its
  evidence cited for this row's cells. The evidence is European; A is at 0.15 in East Asians, untested there.
