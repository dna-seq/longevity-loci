variants:
  - rsid: rs7844965
    gene: GULOP
    phenotype: parental lifespan
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: 0.0247
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region on chromosome 8, the one most people of
          European ancestry have (about 59 in 100). It is the reference the other versions are compared with, so it
          neither raises nor lowers your expected lifespan here. What the region does is not known: it lies between
          genes, and no route to health has been shown. The finding comes from people of European ancestry; less is
          known elsewhere.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA region on chromosome 8 (about 35 in 100 people of
          European ancestry do). In large British and American studies, people with this version had parents who
          lived a little longer, on average about six weeks per copy, and in a British study its carriers stayed
          free of major disease slightly longer. One other large study did not see the effect, so it is a likely
          finding rather than a settled one. How the region acts is not known. The effect is small: a tendency, not
          a guarantee.
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA region on chromosome 8 (about 5 in 100 people of
          European ancestry do). In large British and American studies, each copy went with parents living a little
          longer, on average about six weeks, and in a British study with staying free of major disease slightly
          longer. One other large study did not see the effect, so it is a likely finding rather than a settled one.
          How the region acts is not known. The effect is small: a tendency, not a guarantee.
