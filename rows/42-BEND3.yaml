# The seed list's locus 42, BEND3 (6q21). Curated 2026-11-11. Lead rs1627804 (Pilling 2017, Table 2, one of two
# variants genome-wide only in the parents' age-at-death analysis; the other is row 5's), the seed's only rsID here:
# intronic in BEND3, GRCh38 6:107,079,224, C ancestral, A at 0.32 in Europeans. Wright 2019's fathers' table holds
# rs9384641 1.1 kb away (r² 0.34, D′ 1.00), named and not counted. Open Targets 26.09 has no record of the variant;
# the GWAS Catalog (2026-10-29) holds Pilling's two associations and nothing for the lead's eleven proxies at
# r² ≥ 0.8. A literature search on the rsID returns Pilling and a review (five services answered; Semantic Scholar
# was rate-limited, so its part is unchecked).
locus_id: 42
locus_name: BEND3
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: genome-wide significant in one study, with no independent replication (§4.1's
  single-study clause), and no powered failure (D21, D25.1), so not D. The one genome-wide result is Pilling 2017's
  analysis of parents' age at death in the 208,118 UK Biobank participants whose parents had both died: C, the
  common allele (0.68), goes with older parents at death, β +0.0197, P 4e-8, a candidate for follow-up in the
  authors' words. That analysis sums the z-scored ages at death, so a positive β is a longer life, and Timmers
  2019's lifespan meta-analysis puts C on the longer-life side too (A β −0.0157, P 1.6e-4, UK Biobank and LifeGen
  agreeing), short of genome-wide and not a replication, since it contains the same UK Biobank parents. In the same
  people Pilling's main analysis, parents' attained age, gives P 1.1e-4; fathers 2.4e-4, mothers 5.7e-3; both
  parents in the top 10 % 4.5e-6, a result with no direction in the text or the catalog. Outside UK Biobank, nothing
  replicates and nothing fails with power. LifeGen without UK Biobank's lives (Timmers' Figure 2 source data, sample
  b) leans C's way at one-sided P 0.138; against Pilling's attained-age β, the discovery column there, its power is
  about 0.71 and heterogeneity P about 0.34, so no red flag. Deelen 2019's percentiles lean C's way and are flat
  (90th P 0.49, 99th P 0.29; one-sided about 0.24 and 0.14); calibrated from Pilling's attained-age β (0.0185, the
  discovery's effect on Timmers' scale, Figure 2's column; the genome-wide age-at-death β is on another scale; D27.9),
  the 90th flags by APOE's factor (power 1.00, heterogeneity P 0.015) and not by the loci's mean factor (power 0.56, P
  0.32), and a flag that only one calibration raises is no flag (D25.3); the 99th flags under neither (power 0.86, P
  0.17; 0.31, P 0.94). From the genome-wide age-at-death β itself the answer changes: carried to Timmers' scale by Table
  1's SD of the summed z-scores (1 unit, 7.79 years of the parents' average age at death; 0.0197 × 7.79 × 2 / 10, about
  0.031, derived), LifeGen without UK Biobank fails on power 0.98 and heterogeneity P 0.033, and Deelen's 90th flags
  under both factors (mean factor power 0.91, P 0.044), which with no replication would make the row D (D22.3). The
  conversion is mine, not printed, and the attained-age β is Timmers' own column for this SNP, so the flag rests on a
  conversion no source prints and is unknown, and B holds (D28.1, the lead's ruling on D27.9's edge: a discovery whose
  genome-wide analysis is on another scale) (its APOE factor borrowed from the 90th's ε4
  line, as at row 37; no 99th ε4 line is cached). FinnGen's death endpoint is null and leans the other
  way (A β −0.0035, P 0.64); under APOE's factor within FinnGen, from the same β, its power is about 0.79, short of 0.8
  (heterogeneity P 0.013), and under the mean factor 0.27, so it is no red flag. Wright 2019's AncestryDNA fathers,
  at rs9384641 1.1 kb away, lean C's way (its C travels with the lead's C by the frequencies, derived; raw P 0.077,
  one-sided 0.038, about 0.052 after Wright's genomic control): not counted, as the tag's r² to the lead is 0.34 and
  it does not pass after genomic control. Healthspan is flat (Zenin 2019, P 0.95), so 0; exceptional survival is 0
  on Deelen. Mechanism: ageing in general, because nothing assesses one; Open Targets has no record of the variant
  and Pilling's two studies' credible sets (six and two) lie elsewhere, so causal confidence C4 and effector E4, and the catalog records no other trait for it or its proxies. BEND3's
  role in repressing ribosomal DNA is the authors' gene-level remark, not evidence at this SNP; `gene` is empty.
  Pleiotropy is not assessed. C/C is the reference: the most common genotype at gnomAD's non-Finnish European
  frequency (A 0.317: C/C about 47 in 100, A/C 43, A/A 10), so A/C and A/A carry the risk side. No PROTECT token (D26.5), as
  at row 21: no disease is known at the locus whose absence C would mark, and C is no rare protective allele. Age
  of action is unknown.
