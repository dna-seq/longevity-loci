variants:
  - rsid: rs1627804
    gene: ""
    phenotype: BEND3 region, parental lifespan
    trait_efo_id: EFO_0007796
    effect_allele: C
    effect_size: 0.0197
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA region (about 47 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. The region, on chromosome 6,
          lies within the BEND3 gene, and it is not known which gene matters. The finding comes from people of
          European ancestry; less is known elsewhere.
      - genotype: A/C
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 43 in 100 people of European
          ancestry do). In a very large British study, people with this version tended to have parents who died a
          little younger. It is a likely finding, not a settled one: it was strong enough to count in one analysis of
          one study, and has not been confirmed in a separate group of people. The effect is small and
          it is a tendency, not destiny.
      - genotype: A/A
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 10 in 100 people of European
          ancestry do). In a very large British study, each copy of this version went with parents who died a little
          younger. It is a likely finding, not a settled one: it was strong enough to count in one analysis of one
          study, and has not been confirmed in a separate group of people. The effect is small and it
          is a tendency, not destiny.
