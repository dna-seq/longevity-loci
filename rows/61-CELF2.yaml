variants:
  - rsid: rs547541271
    gene: ""
    phenotype: CELF2 intron, lifespan in women
    trait_efo_id: OBA_VT0005372
    effect_allele: C
    effect_size: -0.0369
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the usual version of this DNA position, the one nearly everyone of European
          ancestry has (more than 99 in 100). It is the reference the other combinations are compared with. The
          position, on chromosome 10, lies inside the CELF2 gene. The finding comes from women of European
          ancestry; less is known elsewhere.
      - genotype: C/T
        state: risk
        conclusion: >-
          You carry one copy of a rare version of this DNA position (about 6 in 1,000 people of European ancestry
          do). In one large British study, women with this version tended to die somewhat earlier; no such link was
          seen in men, and a Finnish study, where this version is about ten times rarer still, did not confirm it. It is a likely
          finding, not a settled one: it rests on a single study and has not been confirmed in a separate group of
          people. It is a tendency, not destiny.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of a rare version of this DNA position. This is extremely uncommon (fewer than 1 in
          100,000 people), too rare to have been studied on its own. In one large British study, women with one copy
          tended to die somewhat earlier; no such link was seen in men, and a Finnish study, where this version is far
          rarer, did not confirm it. What
          two copies mean is not known. It is a tendency, not destiny.
