# The seed list's locus 61, CELF2 (10p14). Curated 2026-11-12. Lead rs547541271, the seed's only rsID, a rare C/T in
# a CELF2 intron at GRCh38 10:11,118,452 (GRCh37 11,160,415); T is the minor and derived allele, 0.0029 in gnomAD's
# non-Finnish Europeans, 0.00019 in Finns, absent from 1000 Genomes' Europeans, so no LD tag is known. Entered by
# tracks B and E from Park 2025's women's own-survival GWAS of UK Biobank (GCST90551886), row 13's counterpart in the
# men. Timmers 2019's LifeGen summary statistics and Deelen 2019's two percentile files hold no line for it (untested,
# not null). Park's women's window holds one more rare variant 30 kb away at P 2.2e-7, LD unknown.
locus_id: 61
locus_name: CELF2
verdict: kept
verdict_reason: >-
  Tier B, the seed's, kept on §4.1's single-study clause, as row 13 under D19.2: a genome-wide hit in one stratum
  of one study, read at the paper's own threshold. Park 2025's own-survival GWAS of UK Biobank's 212,863 women
  (14,492 of them dead) gives rs547541271's T reduced lifespan: β +0.0369 per copy on the Martingale residual of a
  Cox model (SE 0.0067; more deaths than expected), P 3.1e-8, past the paper's 5.0e-8, which it applies to each of
  its three GWAS (whole cohort, men, women) without correcting for running three. The variant is rare (MAF 0.3 %),
  from imputed array data filtered at imputation quality 0.3; its own quality is not printed. The discussion names the hit without a caveat of its own; the paper's only caveat is study-wide: no
  independent external replication. Unlike row 60's lone line, the women's window holds a second rare variant 30 kb
  away at P 2.2e-7 (LD not known). The signal is the women's: the whole cohort gives T +0.0147 (P 0.0096) and the
  men −0.0117 (P 0.22), the two sexes 4.2 standard errors apart (P 3e-5, derived; the men's file swaps its columns as the others do, by
  its own APOE line), so the context is
  sex_specific:f. The one independent look-up is Park's own in FinnGen R11's any-death endpoint, both sexes:
  T log OR −0.018 (SE 0.21), P 0.93, T only 0.03 % there. That is no red flag under D21: like for like, the
  whole-cohort +0.0147 under APOE's Park-to-FinnGen factor (8.1) expects +0.12, power 0.14; even the women's
  +0.0369 expects only +0.30, power 0.42, heterogeneity P 0.13 (MUC5B's factor, 6.7, gives less); 80 % power needs
  a factor of 14. No calibration raises a flag, so D25.3's mean factor is not needed, and the row carries no
  replication_failed. Nothing else tests it: LifeGen and Deelen have no
  line, no tag is known, so exceptional survival is untested. Healthspan 0: Zenin 2019 gives T an earlier end of
  healthspan, P 0.31, in the same UK Biobank people. Lifespan +. Mechanism general ageing: the authors' PheWAS ties
  T to myositis at P 1.0e-5 (OR 1.003), short of genome-wide and in the same sample, so no pleiotropy; their
  discussion names CELF2's neurological and cancer links from the literature, not from this variant. The GWAS
  Catalog holds Park's association alone, mapped to CELF2. Open Targets holds no record of the variant and none of
  the women's 17 credible sets lies on chromosome 10: causal C4, effector E4, no gene named; the intron names the
  locus, not an effector. Descriptive. The protection is the absence of the risk allele: T is rare and shortens
  life; C, which nearly everyone carries, is the reference. Context: women only, European (T is 0.0017 in South
  Asians and unseen in East Asians). Age of action unknown.
