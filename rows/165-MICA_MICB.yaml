# A second, independent signal at the seed's locus 37, HCP5 (6p21.33), its own row under D25.6 and D39.14. Curated
# 2026-11-16. Lead rs3131621, the seed's second rsID at 37 (Pilling 2017's fathers' lead): between MICA and MICB in the
# MHC class I region, GRCh38 6:31,457,722 A/G, GRCh37 6:31,425,499; A at 67.2 % in gnomAD's non-Finnish European
# genomes. 278 kb from row 37's lead rs3130507, r² 0.051 in 1000 Genomes EUR. A is the longer-life allele.
locus_id: 165
locus_name: MICA/MICB
second_signal_of: 37
verdict: kept
verdict_reason: >-
  Tier B (D39.18, D40.4); A waits on the mothers' test. In Pilling 2017's UK Biobank fathers rs3131621 is the stronger
  line (z 5.51 against row 37's lead's 1.14), so it is read at its marginal: A −0.0124 on attained age (SE 0.0022), P
  3.6e-8, Table 2, the paper's own call (both parents 8.9e-8). AncestryDNA's fathers in Wright 2019 are outside that
  anchor, and their line is Wright's Supplemental Table 8, filtered on their own arm (D29.18): A on the longer-lived
  side, −0.0106 for G on Table 8's scale (A +0.0106), P 7.7e-4 raw and 0.002 after genomic control (D26.1), an
  independent replication on the same allele. The smaller-effect clause does not fire (0.86 times the anchor's
  effect, heterogeneity P 0.65). No father–mother difference is shown (every test P 0.06 or more after correction),
  so no sex token, and AncestryDNA's mothers then test the same effect: flat (−0.0012, P 0.72), and Wright prints the
  mothers' heterogeneity as P 0.031 (Table 9), a D21 flag at power 0.86. That flag holds A back: the readings that
  clear it (0.049 from the raw arms, 0.058 after genomic control, 0.22 with UK Biobank's mothers conditioned on 37's
  lead) do not reproduce the printed figure, and conditioning AncestryDNA's mothers needs 37's lead's AncestryDNA arm,
  which no source prints (D39.9, D39.15). A, once a quoted figure clears the mothers' test. Independence (D39.14): no
  article prints a conditional analysis and Open Targets has no record of the variant; from 1000 Genomes' phased EUR
  haplotypes its A travels with rs3130507's longer-life G (r +0.226, r² 0.051), and conditioned on 37's lead it keeps z
  5.39 in Pilling's fathers (derived): no tag. Wright's AncestryDNA–UK Biobank fathers' meta is genome-wide too (P
  8.9e-9, Table 3), named; it holds the replication, so it is not the anchor here (D40.4 amends D39.17 for this row).
  Timmers 2019's pooled parents agree (A beta1 +0.0202, SE 0.0042, P 1.9e-6, "++"), UK Biobank inside. Deelen 2019 is
  flat (90th OR 1.0004, P 0.99; 99th 0.998, P 0.96), a flag under APOE's factor only (mean factor power about 0.65),
  so none (D26.3). Park 2025's own survival leans A's way, flat (P 0.16; men 0.50, women 0.17); FinnGen R11's deaths
  A fewer, one-sided 0.08, a database line. Outcome cells read for A: lifespan + (Pilling, AncestryDNA's fathers,
  Timmers); exceptional survival 0 (Deelen flat; Pilling's top 10 % flat, P 0.48); healthspan 0 (D40.4: in Zenin 2019
  37's lead is the stronger line, z 2.19 against 1.90, and rs3131621 conditioned on it is z 1.44, one-sided 0.075,
  derived; Foote 2025's deposits hold no line). HLA caveats: A's frequency differs by sample (0.629 in UK Biobank,
  0.627 in Park's file, 0.672 in gnomAD's non-Finnish genomes, 0.696 in FinnGen, 0.719 in 1000 Genomes EUR), and the
  imputation quality at this MHC site is unknown. Mechanism general ageing, as row 37. No pleiotropy token: the
  Catalog's rheumatoid arthritis or IBD line (P 2e-13) prints no allele, so no side can be read, named. Causal C4 and
  effector E4: Open Targets 26.09 has no record of the variant; MICA and MICB name the region. The literature search
  (the rsID, 2026-11-16; Semantic Scholar answered 429, its part unchecked) finds Pilling, Wright and reviews, and Wang
  2023 (PMID 37440754), whose abstract names rs3131621 among three HLA SNPs with a two- to threefold risk of primary
  sclerosing cholangitis in ulcerative colitis, its allele not given there: named, abstract only, no side read.
  Descriptive. Age of action unknown. The evidence is European.
