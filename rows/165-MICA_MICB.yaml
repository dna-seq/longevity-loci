variants:
  - rsid: rs3131621
    locus: {chrom: "6", start: 31457722, ref: A, cites: [db-ensembl-116#q1186]}
    gene: ""
    phenotype: MICA/MICB region, fathers' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: -0.0123669
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA region (about 45 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. The region, on chromosome 6,
          lies between the MICA and MICB genes among the immune-system genes, and what it does is not known. The
          finding comes from people of European ancestry; less is known elsewhere.
      - genotype: A/G
        state: risk
        conclusion: >-
          You carry one copy of the less common G version of this DNA region (about 44 in 100 people of European
          ancestry do). In a very large British study, fathers of people with this version lived a little less long,
          and a separate American study saw the same in fathers. It is an early finding: part of it may be shared
          with a nearby signal, and what is left sits just short of the usual bar. The effect is small and it is a
          tendency, not destiny.
      - genotype: G/G
        state: risk
        conclusion: >-
          You carry two copies of the less common G version of this DNA region (about 11 in 100 people of European
          ancestry do). In a very large British study, fathers of people with this version lived a little less long
          per copy, and a separate American study saw the same in fathers. It is an early finding: part of it may be
          shared with a nearby signal, and what is left sits just short of the usual bar. The effect is small and it
          is a tendency, not destiny.
