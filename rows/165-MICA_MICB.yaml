# A second, independent signal at the seed's locus 37, HCP5 (6p21.33), its own row under D25.6 and D39.14. Curated
# 2026-11-16. Lead rs3131621, the seed's second rsID at 37 (Pilling 2017's fathers' lead): between MICA and MICB in the
# MHC class I region, GRCh38 6:31,457,722 A/G, GRCh37 6:31,425,499; A at 67.2 % in gnomAD's non-Finnish European
# genomes. 278 kb from row 37's lead rs3130507, r² 0.051 in 1000 Genomes EUR. A is the longer-life allele.
locus_id: 165
locus_name: MICA/MICB
second_signal_of: 37
verdict: kept
verdict_reason: >-
  Tier C (D39.15), its tier on the phased conditional put to the lead: genome-wide in Pilling 2017's UK Biobank
  fathers at the marginal (A −0.0124 on attained age, SE 0.0022, P 3.6e-8; both parents 8.9e-8), but conditioned on row
  37's lead in the coupling the phase gives it falls just short (z 5.51 to 5.39, P 7e-8, derived), so the discovery's
  own independent part is sub-genome-wide (R-TIER-4). Independence (D39.14, D39.15): no article prints a conditional
  analysis and Open Targets has no record of the variant; from 1000 Genomes' phased EUR haplotypes its A travels with
  rs3130507's longer-life G (r +0.226, r² 0.051), and in the fathers rs3130507 is weak (z 1.14), so the signal survives
  conditioning almost whole: no tag of 37's lead. It replicates in an independent sample: AncestryDNA's fathers in
  Wright 2019 put A on the longer-lived side, −0.0106 (SE 0.0032), P 7.7e-4, the UK Biobank arm the same side
  (heterogeneity P 0.35), meta P 8.9e-9 (Table 3); AncestryDNA's mothers are flat (P 0.72). The UK Biobank conditional
  and AncestryDNA together come to about z 6.3 (derived), which would read B; the letter of D39.15, which tiers on the
  discovery's conditional, reads C, the default while the lead decides. Timmers 2019's pooled parents agree (A beta1
  +0.0202, SE 0.0042, P 1.9e-6, "++"), UK Biobank inside. Deelen 2019 is flat (90th OR 1.0004, P 0.99; 99th 0.998, P
  0.96), a flag under APOE's factor only (mean factor power about 0.65), so none (D26.3). Park 2025's own survival leans
  A's way, flat (P 0.16; men 0.50, women 0.17); FinnGen R11's deaths A fewer, one-sided 0.08, a database line. The
  fathers carry it in Pilling (mothers P 3.5e-5 the same side), but no test of the difference is read and AncestryDNA's
  mothers are flat: named, no token. Outcome cells read for A: lifespan + (Pilling, Timmers, AncestryDNA's fathers);
  exceptional survival 0 (Deelen flat; Pilling's top 10 % flat, P 0.48); healthspan + (Zenin 2019, A the later end,
  one-sided 0.029; Foote 2025's deposits hold no line). Mechanism general ageing, as row 37. No pleiotropy token: the
  Catalog's rheumatoid arthritis or IBD line (P 2e-13) prints no allele, so no side can be read, named. Causal C4 and
  effector E4: Open Targets 26.09 has no record of the variant; MICA and MICB name the region. The literature search (the rsID, 2026-11-16; Semantic Scholar answered 429, its part unchecked) finds Pilling, Wright and reviews, and Wang 2023 (PMID 37440754), whose abstract names rs3131621 among three HLA SNPs with a two- to threefold risk of primary sclerosing cholangitis in ulcerative colitis, its allele not given there: named, abstract only, no side read. Descriptive. Age of action unknown. The evidence is
  European.
