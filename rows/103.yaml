# The seed list's locus 103, unnamed (6p21.32, the HLA class II region at HLA-DQB1, as Zenin 2019 calls it).
# Curated 2026-11-11, the ten-row run's fourth row; re-tiered C to B the same day under D16, and to C under D17.1. Lead rs1049053 (Zenin 2019's healthspan SNP), 43 kb from row 38's
# lead rs34967069 (EUR r² 0.32). rs3135006 (Wright 2019) is its close proxy (r² 0.80) and appears only as a proxy on
# its study; rs3129720 likewise (r² 0.80).
locus_id: 103
locus_name: ""
verdict: re-tiered
verdict_reason: >-
  Tier C, down from the seed's single-track A (§12): a genome-wide healthspan result that failed its replication,
  with no lifespan signal of its own (§4.1, D17.1). In 300,447 British UK Biobank participants C delays the end of
  healthspan (Zenin 2019, P 1.4e-11; T, the common allele at 0.67, ends it earlier), and that signal is its own, not
  an echo of row 38's lead (LD alone would give z 2.9 here, against 6.9 observed). The replication failed: in 96,313
  other UK Biobank participants, unrelated to the discovery set, it leans the same way at P 0.146, with β 0.013 ±
  0.009 against the discovery's 0.037; by Zenin's own power formula the expected z there is about 3.7 against a
  threshold of 2.88 (power about 0.8), and the two estimates differ at P about 0.02, the red-flag heterogeneity of
  the 71/67 rule, which would cap the row at B even with a lifespan signal (the lead's computation, D17.1). The
  lifespan results do not score here: Timmers 2019's P 1.4e-4 at rs1049053 is about what LD with row 38's
  genome-wide lead predicts (r² 0.15 to 0.32, conditional z about 0.6 to 1.7), and AncestryDNA's mothers' tag
  rs3135006 (P 3.3e-4, r² 0.80 to rs1049053) tags 38's lead too, so both co-occur with row 38, where the one
  lifespan signal is scored once (D17.1). Lifespan is filed 0 on that reason: tested, with no effect shown that
  is this locus's own. Exceptional survival is untested: Timmers 2019's longevity look-up at rs3129720 (P 0.056,
  one-sided, the same side) was chosen for row 38's lead, and Deelen 2019 has no row for rs1049053 or a close proxy.
  Zenin finds the locus associated with COPD, diabetes, cancer and dementia together and reads it as a possible
  part of a genetic signature of ageing, so the mechanism is filed as general ageing, pending a mediator. No gene
  is named (§4.2, §6.2: a gene only at E1/E2): Open Targets 26.09 has no record of rs1049053 and no credible set of
  the lifespan, healthspan or longevity studies holding it, so causal and effector confidence are C4 and E4. Age
  of action is unknown: no cached source gives this locus's own age bands.
