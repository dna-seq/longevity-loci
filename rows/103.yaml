variants:
  - rsid: rs1049053
    gene: ""
    phenotype: HLA-DQB1 region, healthspan
    trait_efo_id: EFO_0009762
    effect_allele: C
    effect_size: -0.037
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA region (about 45 in 100 people of British ancestry
          do). It is the reference the other combinations are compared with. The region, on chromosome 6, holds
          immune-system genes (the HLA genes), and it is not yet clear which gene matters. The finding comes from
          people of European ancestry; less is known elsewhere.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 44 in 100 people of British ancestry
          do). The region holds immune-system genes (the HLA genes). In a very large British study this version
          went with staying free of major diseases such as cancer, diabetes and dementia slightly longer. This is
          early evidence: it was not confirmed in a second group, and whether it also lengthens life is not known. The
          effect is small and it is a tendency, not a guarantee.
      - genotype: C/C
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 11 in 100 people of British
          ancestry do). The region holds immune-system genes (the HLA genes). In a very large British study each copy
          went with staying free of major diseases such as cancer, diabetes and dementia slightly longer. This is
          early evidence: it was not confirmed in a second group, and whether it also lengthens life is not known. The
          effect is small and it is a tendency, not a guarantee.
