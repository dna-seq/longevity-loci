variants:
  - rsid: rs61978928
    gene: ""
    phenotype: PROX2 region, parents' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: C
    effect_size: -0.0136
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, the one about half of people of European
          ancestry carry twice (about 49 in 100). It is the reference the other combinations are compared with, so it
          neither raises nor lowers your expected lifespan here. The position, on chromosome 14, lies at the end of
          the PROX2 gene; which gene matters is not known. The finding comes from people of European ancestry.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 42 in 100 people of European
          ancestry do). In a very large British study, people with this version tended to have parents who lived a
          little longer, and a large American study leaned the same way for fathers. But a large European study and a
          study of people who reached old age did not see it, so it is a possible finding, not a settled one. The
          effect is small and it is a tendency, not destiny.
      - genotype: C/C
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 9 in 100 people of European
          ancestry do). In a very large British study, each copy went with parents who lived a little longer, and a
          large American study leaned the same way for fathers. But a large European study and a study of people who
          reached old age did not see it, so it is a possible finding, not a settled one. The effect is small and it
          is a tendency, not destiny.
