# The seed list's locus 76, PROX2 (14q24.3). Curated 2026-11-13. Lead rs61978928, the seed's only rsID (Pilling 2017's
# both-parents attained-age lead, in the 3′ UTR of PROX2 and within YLPM1 transcripts). C, the minor allele at 0.30 in
# Europeans, goes with longer-lived parents. Wright 2019's fathers' SNP rs929579, 9 kb away, is at r² 0.97 in CEU and
# stands in for the lead in AncestryDNA.
locus_id: 76
locus_name: PROX2
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it, with `replication_failed` (put to the lead). Genome-wide in Pilling 2017's combined
  parents' attained age (UK Biobank, P 2.0e-8; fathers 1.9e-7, mothers 1.0e-4, both parents in the top 10 % 3.3e-7):
  C, the minor allele (0.30 in Europeans), goes with longer-lived parents. Two independent European samples fail it
  with power. LifeGen with UK Biobank's lives removed, Timmers 2019's own replication of the lead (Figure 2 source
  data, sample b), puts C on the wrong side: −0.05 years against +0.27 at discovery, one-sided P 0.73. Against the
  discovery's effect at that SE the one-sided power is 0.93 and the heterogeneity P 0.0011, both on Timmers' one scale
  (derived): D21's red flag. Deelen 2019's 90th percentile is flat the other way (C −0.0071, SE 0.021, P 0.73), and
  calibrated from the discovery's both-parents effect (D25.3, D27.9) it flags under both factors (APOE factor power
  1.00, heterogeneity P below 1e-4; mean factor power 0.84, P 0.007). The 99th leans the discovery's way (C +0.016, P
  0.62), flagging under the APOE factor only (borrowed from the 90th's ε4 line; power 0.99, P 0.0037; mean factor
  0.52, P 0.24). So `replication_failed` (D25.13, D26.11). It bars A. It does not make D: D25.1 needs no independent
  scoring-class study to pass, and one does. Wright 2019's AncestryDNA fathers at rs929579 (r² 0.97, D′ 1, its T with
  the lead's C) lean the discovery's way, β +0.0050 (SE 0.0027) on the UK arm's sign, P 0.063, one-sided 0.032 raw and
  0.044 after Wright's genomic control (λ 1.182; derived), heterogeneity with the UK arm P 0.13. Wright has no line
  at the lead, so the proxy stands in (D29.3, D13). Its UK Biobank arm alone is P 2.3e-6, under Table 9's 2.5e-3
  filter, so the line counts (D29.18). The rest is flat. LifeGen with UK Biobank (P 3.2e-5, −+: UK Biobank T
  shorter-lived, LifeGen the other way) co-occurs with the discovery and does not replicate. FinnGen r11's death
  endpoint has C with slightly more deaths (β +0.010, SE 0.0077, P 0.18), its flag unknown (D28.1, D26.3). Park
  2025's UK Biobank own survival has C with fewer deaths (P 0.15; the deposit's columns swapped, as at APOE). Zenin
  2019's healthspan has C toward a later end (P 0.59). Healthspan 0, lifespan +, exceptional survival 0 (no look
  passes one-sided, and none reads against at p < 0.05). The Catalog holds Pilling's three lines alone. Open Targets
  26.09 places the lead in 102 credible sets (amino-acid levels, neuroticism and mood, blood counts, lung function,
  molecular QTLs) at small posterior probabilities (0.005 to 0.03 in those read), leading none of them, so no route
  is shown: mechanism general ageing (D25.7), no pleiotropy token. No longevity set holds it, so C4 and E4 with no
  gene named; VEP places it in PROX2's 3′ UTR, named in prose. PROTECT:PRESENCE: the minor C protects (as rows 5 and
  74). The genotype shares are 1000 Genomes Europeans' (C 0.30: 49, 42 and 9 in 100). Not sex-specific (fathers and
  mothers both lean C's way at discovery); age of action unknown (Timmers' Figure 5 sheets do not hold the lead). C is
  0.21 in East Asians, untested there.
