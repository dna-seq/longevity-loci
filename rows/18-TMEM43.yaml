# The seed list's locus 18, TMEM43 (3p25.1; the seed's genes "TMEM43; TMEM43/XPC"). Curated 2026-11-11, the second
# run's eighth row. Lead rs1043943 (Liu 2021's longevity SNP in Chinese, Table 1), the seed's only rsID here: a 3' UTR
# variant of TMEM43, in LD (r² 0.94 in CEU and CHB) with XPC's missense rs2228001; T 0.40 in Europeans, 0.32 in East
# Asians. In Timmers 2019's, Zenin 2019's and Deelen 2019's summary statistics at the lead itself; not in Wright 2019's
# S8 or S9. Liu's supplementary tables were listed by Europe PMC but not reachable by script (S2, S16 unread).
locus_id: 18
locus_name: TMEM43
verdict: re-tiered
verdict_reason: >-
  Tier C, down from the seed's B: an unreplicated case-control comparison of the very old against younger controls,
  which R-TIER-2 caps at C. Liu 2021 compared Chinese of the CLHLS survey aged 90 or more (4,662) with controls under
  75 (3,828) in dataset 1, and centenarians (1,105) with controls under 65 (1,450) in dataset 2, the paper's earlier
  GWAS less its overlap with dataset 1. T, the minor allele, goes with reaching old age: dataset 1 β 0.165 on the log
  odds (P 4.2e-7), dataset 2 β 0.081 (printed P 0.016), meta-analysis β 0.146, P 3.59e-8, the paper's genome-wide
  call (D17.3). Dataset 2 is inside that meta-analysis, so it is part of the genome-wide result, not a replication of
  it; and dataset 1's custom chip took its first component, 11,893 SNPs, from dataset 2's own GWAS (whether the lead
  entered that way is not read). Table 1's row does not agree with itself: its β and SE give P about 0.054 for
  dataset 2 and about 5e-7 for the meta-analysis, so the genome-wide call rests on the printed P alone; the same
  table's other loci reconcile (said to the lead). Outside China it does not replicate, and the null is
  informative: the variant is as common in Europeans (T 0.40) and tags XPC's missense variant as well, yet Deelen
  2019's 90th percentile gives β +0.007 (P 0.73; its confidence interval excludes both Liu's 0.146 and dataset 2's
  0.081) and the 99th +0.005 (P 0.88). Timmers 2019's parental lifespan leans to T at P 0.057, short of 0.05, the
  paper's own look-up saying the same; Zenin 2019's healthspan favours T at P 0.0035, nominal, in the same UK
  Biobank. Neither lifts the cap: the same-class test is flat. Lifespan is filed 0; healthspan +, nominal;
  exceptional survival + in Chinese only. The context is East Asian evidence (R-ANC-4). Liu's own survival analysis
  of dataset 1 found nothing genome-wide beyond BRAF and BMPER; its value here (Table S16) is not read. Mechanism
  general ageing: the paper points to XPC, a DNA-repair gene, and Parkinson's disease at P 0.045 is one uncorrected
  test, no trade-off. Causal C4 and effector E4, no gene named: no longevity, lifespan or healthspan credible set
  holds the lead in Open Targets (its 5 GWAS sets are arm impedance, hypertension and a repeat count, each led by
  another variant), so there is no set for fine-mapping, L2G or colocalisation. XPC is the likely effector in
  prose only: the lead tags XPC's missense variant and sits in 321 of XPC's expression and splicing QTL sets,
  leading 43, and in none of TMEM43's. The protection is a presence: the minor T goes with longevity. Age of action
  is unknown.
