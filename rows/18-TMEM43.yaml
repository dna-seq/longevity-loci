variants:
  - rsid: rs1043943
    gene: ""
    phenotype: TMEM43/XPC region, longevity in Chinese
    trait_efo_id: OBA_VT0005372
    effect_allele: T
    effect_size: 0.146
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the more common version of this DNA region (about 46 in 100 people of East Asian
          ancestry and 36 in 100 of European ancestry). It is the reference the other combinations are compared
          with. The region, on chromosome 3, lies at the end of the TMEM43 gene, beside XPC, a DNA-repair gene, and it
          is not yet settled which gene matters.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 44 in 100 people of East Asian
          ancestry and 48 in 100 of European ancestry do). In a Chinese study, people who reached 90 or 100 carried
          this version a little more often than younger people. A very large European study of parents' lifespans
          leaned the same way, weakly, while large European studies of the very old found no difference. The
          evidence is likely but mixed: a tendency, not a verdict.
      - genotype: T/T
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 10 in 100 people of East Asian
          ancestry and 16 in 100 of European ancestry do). In a Chinese study, people who reached 90 or 100 carried
          this version a little more often than younger people. A very large European study of parents' lifespans
          leaned the same way, weakly, while large European studies of the very old found no difference. The
          evidence is likely but mixed: a tendency, not a verdict.
