        conclusion: >-
          You carry two copies of the more common version of this DNA position, as about 46 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position lies on chromosome 7
          between the POR and MDH2 genes. One large American study linked the other version to fathers living longer,
          but a large British study did not confirm it, so it is not counted for or against lifespan.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy of the less common A version of this DNA position (about 43 in 100 people of European
          ancestry do). It lies on chromosome 7 between the POR and MDH2 genes. One large American study found fathers
          of people with this version lived a little longer, but a large British study did not confirm it, so it is
          not counted for or against lifespan.
