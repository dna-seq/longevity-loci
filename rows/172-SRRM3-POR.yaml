# A locus outside the seed list, from the scout's GWAS Catalog entry (the 2015–2026 backfill, D41), its own row under
# the next free id. Curated 2026-11-18. The Catalog's line is rs17685 (POR 3′ UTR, Wright 2019's fathers, P 5e-8); the
# row's lead is Wright's own imputed lead for the locus, rs28689051 (bp75763624), GRCh38 7:76,134,306 G/A, GRCh37
# 7:75,763,624, in a non-coding transcript near the RABGEF1P3 pseudogene between POR and MDH2; A at 31.8 % in gnomAD's
# non-Finnish European genomes. r² 0.57 with rs17685 in 1000 Genomes CEU. A is the allele the discovery puts with
# longer life.
locus_id: 172
locus_name: SRRM3-POR
verdict: kept
verdict_reason: >-
  Tier D (D25.1, D21): a genome-wide discovery in one arm that fails a powered test in an independent sample, its own
  authors' "Not Replicated", and passed nowhere else. Wright 2019's AncestryDNA fathers, 1886-1940, put A longer: the
  imputed lead +0.42 years (SE 0.07), P 2.64e-9, 4.39e-8 after genomic control; the genotyped rs17685, the Catalog's line,
  P 5.41e-8, 5.73e-7 after genomic control, not significant there (pmid-31484785 q184, q185). UK Biobank's fathers, the
  meta's other arm and Pilling 2017's fathers digit for digit, put A a little shorter, P 0.26; meta P 3.4e-3, and Wright
  files the locus under "Not Replicated" (q186, q12). On the two arms' one printed scale (Supplemental Table 9, q187,
  q188) the discovery's +0.0163 at UK Biobank's SE gives one-sided power 1.00 (0.97 at half the effect, for the winner's
  curse) against Wright's heterogeneity P 1.6e-6 (derived): D21's red flag, `replication_failed`. No independent
  scoring-class study passes one-sided the discovery's way: Pilling's mothers 0.055 (P 0.11, q320), both parents 0.22
  (q318), top 10 % flat (q319); Timmers 2019 A longer, one-sided 0.20 (q434), which holds both arms' UK Biobank parents;
  Deelen 2019's 90th A against (P 0.20) and 99th flat (P 0.69) (pmid-31413261 q380, q381); Park 2025's own survival A
  more deaths, one-sided 0.14 against (q241); FinnGen R11's deaths flat (P 0.97, q137). So D. Outcome cells read for A
  (D28.10, D28.3: the discovery gives no `+`; each later look read one-sided): lifespan 0 (Pilling, Timmers, Park, none
  nominal either way); exceptional survival 0 (Deelen); healthspan 0 (Zenin 2019 A the earlier end, flat, P 0.71,
  q197). Foote 2025's seven deposits print the effect allele G at frequency 0.345 where every other source has G at 0.68,
  so which allele their β is for is unsettled and no direction is read (q232 to q238; F3, F4 and F6 nominal, one sign).
  Mechanism ageing in general: rs17685 is a coffee, caffeine and fatty-acid locus in the Catalog (db-gwascatalog-2026.10.29
  q829, q830; POR is the cytochrome P450 reductase), but the lifespan signal is not established, so no `mech:` token.
  Open Targets' 137 sets at rs28689051 are mostly MDH2, POR and STYXL1 expression and splicing QTLs and platelet count,
  none of a lifespan class, highest PIP 0.15 (db-opentargets-26.09 q1584). Causal C4 (D39.12). Effector E4: no QTL or
  colocalisation read for the row's phenotype. The literature search (2026-11-18): rs28689051 finds Wright 2019 alone (OpenAlex and Semantic Scholar answered 429,
  their part unchecked); rs17685 (all six services answered) finds caffeine pharmacogenetics, among them an ALS caffeine
  study that genotypes it (Huin 2024, PMID 39002811) and a systematic review naming POR among caffeine genes (Low 2024,
  PMID 39438936), no lifespan study; named, nothing more read.
  Descriptive. Age of action unknown. The evidence is European.
