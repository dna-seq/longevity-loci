    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (about 81 in 100 people of European
          ancestry do). It is the reference the other combinations are compared with. The position lies at the end
          of the RDH5 gene on chromosome 12. One European study linked the other version to lower odds of reaching
          very old age, but the same study's check in UK Biobank found no difference, so it is not counted for or
          against lifespan.
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 18 in 100 people of European
          ancestry do). One European study found it less often among people who reached very old age, but its own
          check in a larger group found no difference, so it is not counted for or against lifespan.
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 1 in 100 people of European
          ancestry do). One European study found it less often among people who reached very old age, but its own
          check in a larger group found no difference, so it is not counted for or against lifespan.
