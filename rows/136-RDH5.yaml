# The seed list's locus 136, RDH5 (12q13.2). Curated 2026-11-15. Lead rs3138136, the seed's only rsID (Deelen 2019's
# 90th percentile suggestive locus): in RDH5's 3′ UTR on its MANE transcript, GRCh38 12:55,723,786 C/T, GRCh37
# 12:56,117,570, T at 0.10 in gnomAD's non-Finnish Europeans and 0.0008 in East Asians, T the discovery's shorter-lived
# allele and C the longer-lived. Open Targets 26.09 holds it only in GTEx splicing QTL sets of TMEM198B, a
# pseudogene; the GWAS Catalog (2026-10-29) holds no association at it.
locus_id: 136
locus_name: RDH5
verdict: re-tiered
verdict_reason: >-
  Tier D, from the seed's C: a sub-genome-wide discovery that fails a powered test in its own ancestry (D26.8, a
  fortiori of D25.1; row 26's shape). In Deelen 2019's European meta-analysis (no UK Biobank data) T lowers the odds
  of reaching the 90th percentile age, OR 0.83 (0.77–0.89), P 5.4e-7, under genome-wide, I² 14.5; the 99th
  percentile line (P 0.0056) draws on the same cases and is not independent, and the de novo replication covered
  APOE only. Deelen's own validation in UK Biobank, which the discovery does not include, does not replicate it:
  parents past the 90th percentile give T OR 1.00 (0.95–1.04), P 0.86 (its parental-lifespan line is Timmers 2019's
  own figure, told below). At half the discovery's effect for a parent's genotype (the authors state power even at
  half; only APOE validated) that is power 0.99, heterogeneity P 0.0026, holding down to 0.62 of that halved effect,
  and at the full effect P 3.1e-5 (derived from the printed OR and P, the validation's β taken from its printed P
  0.863 and signed the discovery's way, the conservative choice since the printed 1.00 hides the sign): a D21 red flag,
  `replication_failed`, with no independent scoring-class P under 0.05 its way. Timmers 2019's parental lifespan (UK
  Biobank and LifeGen; it overlaps that validation, and LifeGen shares cohorts such as Rotterdam with Deelen's
  discovery, so it is not independent) leans the discovery's way, T beta1 −0.0093 (SE 0.0062), P 0.135,
  one-sided 0.067, not a pass (D25.13); carried to its scale it flags under both calibrations, by APOE's factor (4.84; power
  1.00, heterogeneity P 0.0031) and by the loci's mean factor, which divides (D27.2; 4.84 × 0.4175, power 1.00,
  heterogeneity P 0.0039 counting the factor's own error, about 2e-5 without), yet it adds nothing to the flag,
  being UK Biobank's parents again and not independent of the validation (D34.15). FinnGen R11's deaths put T
  with more deaths, flat (P 0.72), a database line (D29.1); Park 2025 flat (P 0.98); Pilling 2017's four parental
  scans flat (P 0.28 to 0.77); Zenin 2019 puts T a little later in healthspan, flat (P 0.31); Foote 2025's deposits
  hold no line. Wright 2019's AncestryDNA tables list nothing at the lead under their P 0.003 cut, so AncestryDNA is
  unknown above it; their one line within 500 kb, the current-age scan's rs11171681 76 kb away (P 1.9e-6), is a
  viability line that does not tag the lead (r² under 0.05). T is all but absent in East Asians (0.08 %), so no East
  Asian sample tests it. The literature search (the rsID, 2026-11-15; Semantic Scholar answered 429, its part unchecked) finds
  Deelen alone. Every genotype neutral
  (D25.2). Exceptional survival 0 (the discovery is contradicted by the powered parental 90th percentile test, and a
  D row's discovery gives no +, D28.10); lifespan 0 (Timmers leans its way, short of nominal; FinnGen and Park
  flat); healthspan 0 (Zenin flat). Mechanism ageing in general (D25.7): the variant sits in RDH5's 3′ UTR and
  is a splicing QTL of the neighbouring TMEM198B pseudogene in GTEx; nothing recorded ties either to lifespan. Causal C4
  and effector E4: no lifespan-class credible set. Descriptive. Age of action unknown.
