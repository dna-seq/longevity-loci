# A locus outside the seed list, from the scout's GWAS Catalog entry (the 2015–2026 backfill, D41; D42.10, one of the
# two Yashin 2015 SNPs the authors' own QC kept), its own row under the next free id. Curated 2026-11-19. Lead
# rs7894051, intronic in ECHS1 (10q26.3), GRCh38 10:133,370,917 C/G, GRCh37 10:135,184,421. G is the common allele; C is
# about 5 % in Europeans (gnomAD v4's non-Finnish European genomes 5.1 %, 1000 Genomes' CEU 5.0 %), but 20 to 25 % in
# Yashin's Framingham genotypes. G is the allele the discovery puts with longer life (its minor allele with shorter).
locus_id: 176
locus_name: ECHS1
verdict: kept
verdict_reason: >-
  Tier D, on §4.1's "overfit source" (D26.10, D31.11). Yashin 2015's lifespan GWAS
  of 679 Framingham original-cohort women (EMMAX, 20 principal components; pmid-25918517 q3) puts the minor allele
  with 3.52 years less life per copy, P 2.52e-10, minor allele frequency 0.2031 (Supplement Table S1, q4, caption q6);
  the cohort's 432 men agree, −4.41 years, P 2.87e-7, frequency 0.2539 (Table S2, q9, q7), and the authors' Cox model of
  survival past 80 in the same people gives HR 1.55 per minor allele (log HR 0.439, SE 0.068, P 9.4e-11, Table S3,
  q10, q12). Genome-wide by the paper's own call (q1); one of the two the authors' extra QC kept (q2, q14), so a row
  under D42.10. The Catalog prints the same line (risk frequency 0.203, P 3e-10, no allele; db-gwascatalog-2026.10.29
  q841, q842). No letter is printed for the minor allele. The source is overfit on its frequency, which is what the verdict rests on
  (D43.6): every reference puts the minor allele, C, near 5 % in Europeans (gnomAD v4's non-Finnish European genomes
  3,436 non-G of 68,010 alleles, db-gnomad-4 q17, C itself 5.0 % in 1000 Genomes' Europeans, db-ensembl-116 q1259;
  gnomAD's 1000 Genomes subset CEU 12 of 238 and GBR 8 of 174, q18, q19), so the women's 0.203 is 276 copies in 1,358
  alleles against about 69 expected, z 25.7 (derived), the shape a genotyping error leaves; and within the one cohort
  the women's and men's frequencies differ (0.203 against 0.254, z 2.8, P 0.005, derived, relatedness ignored), which an
  autosomal allele should not. The authors' own checks passed it: Mendelian errors "relatively small for all eight"
  (q31), and HWE passed under the founders option their QC used (q32); whether it is among the six SNPs marked FAIL in
  the relaxed Affymetrix files is not printed, unknown (q33). They say only that early original-cohort genotypes are the
  error-prone ones (q17) and found the minor alleles more frequent in the original cohort than in the offspring (q28).
  The offspring cohort's Cox model (Table S7, HR 1.71, P 0.00079, q13, caption q15) rescues nothing: the same table
  gives effects as strong at SNPs the authors set aside, CYP51A1's possible genotyping error HR 2.39, P 7.1e-5 (q36,
  q18), ICAM1's HR 4.01, P 2.4e-12 (q37). If the Framingham minor allele is C, Timmers 2019's parental lifespan, on the
  same log-hazard scale per allele in self, has C at β1 −0.000018 (SE 0.0088), P 0.998, n 638,086 (pmid-30642433
  q437); against the discovery's log HR 0.439 (survival past 80; the paper says the effect "became pronounced only
  after age 80", q34, so an all-age hazard dilutes it) the heterogeneity z is about 6.4 (P about 2e-10), and one-sided
  power is 1.00 at the full effect and at a tenth of it, about 0.80 at a twentieth (derived from the printed SEs). That
  describes Timmers' flat line; it sets no `replication_failed`, since a flag scaled from an overfit effect tests the
  artefact, not the locus (D31.11, D43.6). If it is not C, nothing measures the C a genome file reports at the
  discovery's frequency. Neither reading leaves G protective. The other large looks are flat: Pilling 2017's four
  deposits are mixed, none nominal (C longer in mothers P 0.11, both parents 0.32; C against in the top 10 %, 0.69, and fathers, 0.89; pmid-29227965
  q336 to q339); Park 2025's own survival leans C to fewer deaths (both sexes P 0.21, men 0.72, women 0.14;
  pmid-40021682 q253 to q255, columns as q39); FinnGen R11's deaths G P 0.42 (db-finngen-r11 q139); Deelen 2019 leans C
  toward reaching the 90th and 99th percentiles (P 0.18, 0.11; pmid-31413261 q384, q385). Outcome cells read for G
  (D28.10: the contradicted discovery gives no `+`): lifespan 0 (Timmers, Pilling, Park, FinnGen, none nominal);
  exceptional survival 0 (Deelen, against G, not nominal); healthspan + at nominal P in its direction, as rows 69 and 70
  read Zenin: Zenin 2019 puts G at a later end of healthspan, P 0.042, about 0.047 after its 1.053 genomic control
  (one-sided about 0.024, derived, D26.1; pmid-30729179 q199, q59), Foote 2025's seven factors flat (P 0.29 to 0.86,
  pmid-40759756 q246 to q252), so one nominal look, none against.
  Open Targets 26.09 holds eight sets (db-opentargets-26.09 q1594): seven ECHS1 expression, exon or splicing QTLs (a
  testis splicing set at PIP 1.00, q1596) and Yashin's own Catalog line (PIP 0.17, q1595), no other lifespan,
  longevity or healthspan set: causal C4 (D39.12); effector E4, the QTLs not shown to colocalise with a lifespan
  signal there is none of. Mechanism general ageing: the paper names ECHS1's role in mitochondrial oxidation and
  apoptosis (q27), but no route to lifespan is shown. Ensembl 116, read once it answered again (2026-11-20), puts the
  variant in an intron of ECHS1 (db-ensembl-116 q1261) at gnomAD v4's position (q1258, db-gnomad-4 q16), and 1000
  Genomes' Europeans' C at 5.0 % (q1259; its Africans' 32.5 %, q1260). The literature search on the rsID (2026-11-19; OpenAlex 503, Semantic Scholar 429, their part
  unchecked) finds this paper and the same group's 2016 follow-up (PMID 27773987), named, not read. Genotypes neutral,
  as 41. Descriptive. Age of action unknown (the paper's late-life effect rests on the same overfit genotypes). The
  evidence is European.
