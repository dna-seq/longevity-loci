    phenotype: ECHS1 region, lifespan
    trait_efo_id: OBA_VT0005372
    effect_allele: G
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 9 in 10 people of European ancestry
          do. It is the reference the other combinations are compared with. The position lies inside the ECHS1 gene on
          chromosome 10, which works in the cell's energy production. One small study linked the other version to a
          shorter life, but very large studies found no link.
      - genotype: C/G
        state: neutral
        conclusion: >-
          You carry one copy of the less common C version of this DNA position (about 1 in 10 people of European
          ancestry do). One small American study linked it to a shorter life, but that study measured this version far
          more often than it really occurs, and very large studies found no link. It says nothing about your own
          lifespan.
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the less common C version of this DNA position (about 1 in 400 people of European
          ancestry do). One small American study linked it to a shorter life, but that study measured this version far
          more often than it really occurs, and very large studies found no link. It says nothing about your own
          lifespan.
