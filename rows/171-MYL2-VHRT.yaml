# A second signal at the seed's locus 71, ATXN2 (12q24.12), its own row under D25.6 and D39.14, from the scout's GWAS
# Catalog entry (the 2015–2026 backfill, D41). Curated 2026-11-18. Lead rs4426183, the Catalog's line for Pilling 2017's
# combined parents (GCST006697, P 2e-11): intronic, 1 kb from the VHRT lncRNA (LINC01405) near MYL2, GRCh38
# 12:110,935,600 T/C, GRCh37 12:111,373,404, C ancestral; T at 43.3 % in gnomAD's non-Finnish European genomes. 511 kb
# from row 71's rs3184504 and 559 kb from rs7137828, r² 0.16 with rs7137828 in 1000 Genomes EUR (0.32 in CEU), the two
# shorter-life alleles together. C is the longer-life allele.
locus_id: 171
locus_name: MYL2-VHRT
second_signal_of: 71
verdict: kept
verdict_reason: >-
  Tier C at most (D39.15, D40.3, R-TIER-4), with `replication_failed`: genome-wide at the marginal in Pilling 2017's UK
  Biobank parents (T shorter, P 1.7e-11, the top line of its own peak, pmid-29227965 q307, q309), but conditioned on row
  71's lead in the coupling the phase gives, the independent part is sub-genome-wide. From 1000 Genomes' phased EUR
  haplotypes (the panel rows 162 to 169 use) T travels with rs7137828's shorter-life C (r +0.400, r² 0.160) and with
  rs11065979's shorter-life T (r +0.361); with rs7137828's own line in the same scan (P 3.4e-14, q308) T conditions to z
  4.05 (P 5e-5), and in Timmers 2019's pooled parents (P 2.0e-8, q431) on rs11065979 (q432) to 3.26 (P 0.001) (derived).
  On CEU (phased r +0.53; Ensembl's own CEU r² 0.32) the low ends are 2.96 in Pilling and 2.62 in Timmers. Nothing in
  the window between the two is stronger than 1e-9 until row 71's block at 111.83 Mb (q310), so row 71's lead is the
  whole conditioning set. No printed conditional is read: Pilling's loci are the lowest P in a 1 Mb region (q314), so
  its Table 1 holds rs7137828 alone; the Catalog's line is Supplementary Table 1's (q315, q316), a list of every
  marginal P < 5e-8, and none of the seven supplementary files (read through Europe PMC's service) prints a conditional
  or joint analysis, nor holds it among Supplementary Table 3's Cox leads (q317) (D42). No tag of 71's lead (D39.14): something survives conditioning in each scan, and none of rs4426183's
  130 Open Targets sets is a lifespan set. Timmers holds UK Biobank's parents, so it is not a replication. Wright
  2019's AncestryDNA arms, outside UK Biobank, at rs12828640 (r² 0.92 with rs4426183, G with its longer-life C; q182,
  q183): the fathers are flat (G P 0.87) against UK Biobank's fathers (P 5e-7), Wright's own heterogeneity P 0.0041, and
  conditioned on row 71's rs10774625 in the same arm (q17) they lean against (one-sided 0.71, derived); at AncestryDNA's
  SE the UK Biobank fathers' marginal effect has one-sided power 0.997, and the share left after conditioning
  (about 0.6 of it) 0.83 (derived), so D21's red flag, `replication_failed`,
  as row 71 carries for its own AncestryDNA fathers. The mothers pass: G longer, P 0.056 (one-sided 0.028), and
  conditioned on rs10774625 (q18) one-sided 0.018 (derived). Deelen 2019, also outside UK Biobank, puts T against the
  90th (P 0.0092) and 99th percentiles (P 0.0065) (pmid-31413261 q378, q379), a tie with row 71's lead there (z 2.60 and
  2.72 against 2.22 and 2.28, q9; D40.3), so row 71 keeps its marginal and this line is read conditioned on it: one-sided
  0.027 (90th) and 0.021 (99th) (EUR r; 0.038 and 0.030 on CEU), derived. Those two independent passes keep the row off
  D (D25.1). FinnGen R11's deaths C fewer, flat (P 0.22, q136), a database line; Park 2025's own survival flat (P 0.75,
  q238). Outcome cells read for C: lifespan + (Pilling and Timmers conditioned, AncestryDNA's mothers); exceptional
  survival + (Deelen, conditioned); healthspan + (D31.4): Foote 2025's F2 has T frailer, P 0.013 (q228), tied with
  rs7137828 there (q231), and conditioned on it one-sided 0.041 on EUR haplotypes (0.061 on CEU), derived; Zenin 2019
  flat (P 0.38, q196); F1, F5, F6 flat; the general factor's, F3's and F4's deposits hold no line.
  Mechanism heart and vessels: C lowers systolic (P 1.5e-16) and diastolic blood pressure (P 4.8e-18) in Open Targets'
  sets (db-opentargets-26.09 q1577 to q1580), so `mech:cvd` as at row 27, and many of its sets are blood counts
  (haemoglobin among them, q1581), `mech:blood_count`; it leads none (highest PIP 0.16), so this is the 12q24 block's
  biology shared, not shown as this signal's own route. Causal C4 (D39.12: no set of a lifespan class holds it, and no
  article sets it). Effector E4: near MYL2, intronic to VHRT, a GTEx splicing set for VHRT in the heart's left ventricle
  at PIP 0.015 (q1583), no colocalisation read. The literature search (the rsID, 2026-11-18) found nothing in the five
  services that answered; Semantic Scholar answered 429, its part unchecked. Descriptive. Age of action unknown. The
  evidence is European.
