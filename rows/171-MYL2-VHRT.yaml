variants:
  - rsid: rs4426183
    locus: {chrom: "12", start: 110935600, ref: T, cites: [db-ensembl-116#q1220]}
    gene: ""
    phenotype: MYL2–VHRT region, parents' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: C
    effect_size: -0.0153237
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of each of the two common versions of this DNA position, the most common combination
          (about half of people of European ancestry have it). It is the reference the other combinations are compared
          with. The position lies on chromosome 12 near the MYL2 gene, in a stretch that affects blood pressure and
          blood cells. The finding comes from people of European ancestry; less is known elsewhere.
      - genotype: C/C
        state: protective
        conclusion: >-
          You carry two copies of the C version of this DNA position (about 3 in 10 people of European ancestry do).
          In very large British studies, parents of people with this version lived a little longer, and a European
          study of people reaching very old age agreed. The same version goes with slightly lower blood pressure. Much
          of the signal is shared with a stronger one nearby, and what is left is weak, so this is an early finding.
          The effect is small and it is a tendency, not a guarantee. Your blood pressure matters more than this DNA
          result.
      - genotype: T/T
        state: risk
        conclusion: >-
          You carry two copies of the T version of this DNA position (about 2 in 10 people of European ancestry do). In
          very large British studies, parents of people with this version lived a little less long, and a European
          study of people reaching very old age agreed. The same version goes with slightly higher blood pressure. Much
          of the signal is shared with a stronger one nearby, and what is left is weak, so this is an early finding.
          The effect is small and it is a tendency, not destiny. Your blood pressure matters more than this DNA result.
