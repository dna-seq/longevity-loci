# The seed list's locus 135, HLA-DRB1*15:01 tag (6p21.32). Curated 2026-11-14. Lead rs3135388, the seed's only rsID:
# near HLA-DRA, GRCh38 6:32,445,274 A/G, GRCh37 6:32,413,051, A the minor allele (0.139 in gnomAD's non-Finnish
# Europeans), the tag of HLA-DRB1*15:01 (r² 0.97); G, the common allele, the longer-lived side of the discovery. Open
# Targets 26.09 has no record of the variant under either allele order; the GWAS Catalog (2026-10-29) holds four
# associations, multiple sclerosis among them, none for lifespan. r² 0.50 to row 103's lead, rs1049053.
locus_id: 135
locus_name: HLA-DRB1*15:01 tag
verdict: re-tiered
verdict_reason: >-
  Tier C, from the seed's B: a sub-genome-wide, sex-stratified association replicated only in the same group's
  samples (§4.1's C), old against young besides (R-TIER-2). Mendoza-Mejía 2025 imputed HLA alleles in a German
  longevity cohort and tested each by sex: in men (388 long-lived against 3,150 younger controls) DRB1*15:01:01 OR
  0.63 (0.48 to 0.82), raw P 7.0e-4, Bonferroni-adjusted 0.028; women OR 0.97, P 0.74; both sexes OR 0.87, P 0.04,
  adjusted 0.82. The same authors' follow-ups lean the same way: Danish men by the tag, OR 0.74, P 0.07 (one-sided
  about 0.035); UK Biobank, by imputed DRB1*15:01, a father reaching 95 OR 0.92 (adjusted P 0.023), a mother OR 0.94
  (0.010). German and Danish agree (Q P 0.40); adding UK Biobank, heterogeneity Q 9.27, P 0.01, I² 78 %: UK Biobank
  replicates with a much smaller effect (D25.13), not a failure. Nothing near genome-wide. In the large samples at
  the tag: Timmers 2019 flat (A −0.0055 per self, P 0.34), with no flag against the whole German sample's OR 0.87
  under D25.3's 99th-percentile calibrations (power 0.99 and 1.00, heterogeneity P 0.15 and 0.058); Pilling 2017's
  fathers flat and leaning the other way (P 0.49), the male effect carried there only through two stacked conversions,
  whose flag the row reads as unknown (D26.3, put to the lead), and the paper's own UK Biobank fathers lean the
  discovery's way; both parents, mothers
  and the top 10 % flat; Deelen 2019 flat (90th P 0.93, 99th 0.55), and it holds the Danish longevity studies; FinnGen
  R11's death endpoint has A with fewer deaths (P 0.12), a database line; Park 2025 flat (P 0.98). Wright 2019's
  AncestryDNA tags disagree and none is counted: fathers (1886-1940) at rs9268199 (r² 0.79, its G with the lead's A)
  give the lead's A longer-lived fathers (genomic-control P 0.0021), a weak tag; at rs3130279 (r² 0.82, 301 kb) Table
  9's fathers' meta gives A shorter-lived fathers (AncestryDNA P 0.0014), a Table 9 line (D29.18); rs3130287 (r² 0.78)
  phase unread. Foote 2025's disability factor at rs9271423 (r² 1.00) gives A less disability (P 1.1e-7),
  multivariate. Zenin 2019's healthspan flat (A a little healthier, P 0.14). The literature
  search by the tag (Europe PMC, OpenAlex, PubMed, Crossref, preprints; Semantic Scholar answered 429) and by the allele
  name (OpenAlex answered 400, Semantic Scholar 429) finds this paper alone among longevity tests of DRB1*15:01; the
  1990s serotype reports it cites went unreplicated, and a 2026 Dutch preprint names the DRB1*15:01 haplotype for brain
  microglial activation, not longevity. Exceptional survival + (the discovery and its Danish and UK Biobank long-lived-parent
  follow-ups, the latter one-sided under 0.05), lifespan 0 (Timmers and Pilling flat), healthspan 0. The paper calls it male-specific: in the German sample men and women differ (P 0.0057, derived from the two
  intervals, within the stratum the scan picked), while UK Biobank's fathers and mothers do not (P 0.55); no sex token,
  the token put to the lead. Mechanism ageing in general (D25.7, as row 37's HLA locus): the authors propose a route
  through Alzheimer's disease and an immune response to an APOB-100 epitope, untested here; A is multiple sclerosis's risk
  allele (OR 2.75, P 4e-225), so G's protection is the absence of that risk (D30.6), `mech:autoimmune`. Not row 103's
  signal (r² 0.50; 103 is a healthspan row); its LD to row 38's lead is unknown (no CEU line in Ensembl's pair record). Causal C4 and effector E4: no Open Targets
  record either way. Descriptive. Age of action unknown. The evidence is European.
