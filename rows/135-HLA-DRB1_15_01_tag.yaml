variants:
  - rsid: rs3135388
    gene: ""
    phenotype: HLA-DRB1*15:01 tag, longevity in men
    trait_efo_id: OBA_VT0005372
    effect_allele: A
    effect_size: 0.63
    effect_measure: OR
    stat_significance: nominal
    direction: risk
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as about 74 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The position lies in the HLA
          region of chromosome 6, which shapes how the immune system recognises what is foreign. The finding comes
          from people of European ancestry.
      - genotype: A/G
        state: risk
        conclusion: >-
          You carry one copy of a less common version of this DNA position (about 24 in 100 people of European
          ancestry do). It marks an immune-system type, HLA-DRB1*15:01, which one research group found less often in
          men who reached very old age, with a weaker hint in British fathers and mothers. Other large studies did not
          show a clear difference, so this is early evidence, not a settled finding. The same type
          raises the risk of multiple sclerosis.
      - genotype: A/A
        state: risk
        conclusion: >-
          You carry two copies of a less common version of this DNA position (about 2 in 100 people of European
          ancestry do). It marks an immune-system type, HLA-DRB1*15:01, which one research group found less often in
          men who reached very old age; too few people carry two copies to say more. Other large studies did not show
          a clear difference, so this is early evidence, not a settled finding. The same type
          raises the risk of multiple sclerosis.
