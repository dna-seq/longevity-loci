variants:
  - rsid: rs472103
    gene: NLGN1
    phenotype: NLGN1, body weight, healthy ageing
    trait_efo_id: EFO_0007796
    effect_allele: A
    effect_size: 0.0059
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of the slightly less common version of this DNA region (about 20 in 100 people of
          European ancestry do). In very large European studies that combined healthspan, frailty, long life and
          biological age into one measure, each copy went with slightly healthier ageing, and parents of carriers
          lived a little longer. The same version goes with slightly lower body weight and less frailty in other
          studies. The region lies inside NLGN1, a gene for connections between nerve cells. It is a likely
          finding, not a settled one: it rests on one combined analysis, with only weak support from a separate
          group of people. The effect is small and it is a tendency, not a guarantee.
      - genotype: A/C
        state: neutral
        conclusion: >-
          You carry one copy of each common version of this DNA region (about 50 in 100 people of European
          ancestry do, the most common combination). It is the reference the other combinations are compared with.
          The region, on chromosome 3, lies inside the NLGN1 gene. The finding comes from people of European
          ancestry; less is known elsewhere.
      - genotype: C/C
        state: risk
        conclusion: >-
          You carry two copies of the more common version of this DNA region (about 30 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, each copy went with slightly less healthy ageing, and parents of carriers lived a
          little less long. The same version goes with slightly higher body weight in other studies, so keeping a
          healthy weight is the part within reach. It is a likely finding, not a settled one: it rests on one
          combined analysis, with only weak support from a separate group of people. The effect is small and it is
          a tendency, not destiny.
