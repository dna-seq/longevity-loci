# The seed list's locus 24, NLGN1 (3q26.31). Curated 2026-11-11, the third run's second row. Lead rs472103 (Rosoff
# 2023's mvAge SNP, Supplementary Tables 6, 7 and 10), the seed's only rsID here: an intron variant of NLGN1, A/C, A the
# minor allele in Europeans (0.45 to 0.47). In Timmers 2019's, Zenin 2019's and Deelen 2019's summary statistics at the
# lead itself; Wright 2019's own-age GWAS at rs247975 (r² 0.93); Atkins 2021's frailty locus at rs583514 (r² 0.86).
# Open Targets 26.09: 180 credible sets, one of a scoring class (mvAge's); the GWAS Catalog (2026-10-29) holds mvAge's
# record alone at the lead.
locus_id: 24
locus_name: NLGN1
verdict: kept
verdict_reason: >-
  Tier B, as the seed has it: a genome-wide multivariate result with a co-occurring lifespan study (§4.5 as D16 reads
  it); a multivariate result does not meet tier A's first criterion (D18.3). Rosoff 2023's mvAge, the common factor
  behind healthspan, frailty, exceptional longevity, parental lifespan and epigenetic age, is genome-wide at rs472103:
  A on the healthier-ageing side, β +0.0059 (SE 0.0010), P 7.4e-9 (Supplementary Tables 6 and 7, fetched now that the
  publisher no longer refuses the file). Timmers 2019's million parents' lives is the co-occurring lifespan study: A
  longer, P 6.1e-4, both UK Biobank and LifeGen leaning the same way; it is an input of mvAge, not a replication.
  Rosoff calls the locus known through frailty and lifespan. Frailty is genome-wide here on its own: Atkins 2021's
  frailty index (n 175,226, UK Biobank and TwinGene) at rs583514 (r² 0.86), T less frail, P 2e-9, T riding with the
  lead's A (derived from frequencies), and Rosoff's look-up at the lead gives P 3.2e-9. Whether that opens tier A is
  put to the lead, B meanwhile: if a frailty index is a HEALTHSPAN-class phenotype (the outcome profile counts
  frailty there), §4.1 asks for an independent replication in a scoring class (D22.2). Zenin 2019's healthspan (A
  delays its end, P 0.030) replicates nothing on its own and shares UK Biobank; the only candidate is Wright's
  viability result below, outside UK Biobank and TwinGene, nominal on the same allele but at a proxy whose strand
  and phase are derived, and §4.5 takes viability as confirmation only. The lifespan side of Rosoff's label is not identified: Timmers'
  rows within 0.5 Mb hold nothing below P 5.2e-4. Wright 2019's AncestryDNA customers, a sample outside mvAge's
  inputs, lean the same way: at rs247975 (r² 0.93, its T the lead's A, derived) A is commoner among older customers,
  P 1.0e-5 after genomic control (raw 2.3e-7), nominal, a viability confirmation; the locus is in neither of Wright's
  parental tables (rows below P 0.003 only). Deelen 2019's 90th and 99th percentiles are null (P 0.87, 0.29,
  opposite leanings), at these effect sizes no test. Lifespan +, healthspan + (frailty genome-wide, Zenin nominal),
  exceptional survival 0. Mechanism metabolism, through body weight: the locus's 180 credible sets are dominated by
  adiposity and body composition, and the mvAge set colocalises (H4 ≥ 0.8) with BMI, weight, waist, hip and fat-mass
  sets above all, with type 2 diabetes, reticulocytes, lipoprotein fractions, smoking initiation and insomnia. The
  direction is read from the sets' leads: rs529200-A rides with the lead's A (r² 0.94, derived from frequencies), and
  32 of 37 body-size and composition sets led by rs529200, rs583514 or rs247975 give the lead's C the higher value,
  3 print no β and Harris 2024's two run the other way. So the longer-lived A goes with lower weight, and with less
  type 2 diabetes (a set led by rs247975, β +0.025 for the C side), with one catalog record dissenting (Saito's at
  rs529200, G lowering it, which would put the A side higher): no trade-off detected (D18.1), and the label is
  modifiable through weight (D18.2), the smoking and insomnia sets unphased and not read for direction. Causal C2:
  the lead tops mvAge's PICS set at 0.14 of 16 members, the next 0.095 (Rosoff's own SuSiE and FINEMAP give 0.17).
  Effector E1, NLGN1: locus-to-gene 0.92 on the mvAge set, which colocalises with NLGN1's expression in the brain's
  prefrontal cortex (gene and transcript, H4 0.97); queried with the QTL study types, those are its only QTL
  partners. A is the minor allele at 45 % against 55 %, so A/C, the most common genotype, is the reference (§6.2): A/A
  protective, C/C risk; no PROTECT token, the split too even to call A rare or C a risk version others lack. Age of
  action unknown. The evidence is European.
