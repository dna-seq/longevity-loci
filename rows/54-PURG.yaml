variants:
  - rsid: rs11783562
    gene: ""
    phenotype: 8p12 region, survival to older age
    trait_efo_id: OBA_VT0005372
    effect_allele: G
    effect_size: 0.01177
    effect_measure: beta
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of one of the two common versions of this DNA region (about 23 in 100 people of
          European ancestry do). It is the reference the other combinations are compared with. The region, on
          chromosome 8, holds several genes; which one matters, if any, is not settled. The finding comes from
          people of European ancestry; less is known elsewhere.
      - genotype: G/T
        state: protective
        conclusion: >-
          You carry one copy of each common version of this DNA region (about half of people of European ancestry
          do). In one large study of genealogy-site customers, the G version was a little more common among older
          people, and in a Finnish study it went with slightly fewer deaths. This is early evidence: a much larger
          study of parents' lifespans did not clearly confirm it. The effect, if real, is small: a tendency, not
          destiny.
      - genotype: G/G
        state: protective
        conclusion: >-
          You carry two copies of the G version of this DNA region (about 27 in 100 people of European ancestry
          do). In one large study of genealogy-site customers, each copy was a little more common among older
          people, and in a Finnish study it went with slightly fewer deaths. This is early evidence: a much larger
          study of parents' lifespans did not clearly confirm it. The effect, if real, is small: a tendency, not
          destiny.
