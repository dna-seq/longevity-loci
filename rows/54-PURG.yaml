# The seed list's locus 54, PURG (8p12, PURG / TEX15 / WRN). Curated 2026-11-12. Lead rs11783562 (the seed's lead),
# from Wright 2019's GWAS of AncestryDNA customers' own current age (Supplemental Table 8), as at row 10, not the
# parental-lifespan meta-analysis the seed names: the lead has no line in Supplemental Table 9, where three neighbours
# within 19 kb are nominal in fathers (P 8.4e-4 to 0.0014). The age-GWAS neighbours rs1362910 (raw P 7.7e-8, genomic
# control 4.5e-6) and rs10954771 are named, not scored; LD to the lead not read. Not in Timmers 2019's Figure 2 sheet.
locus_id: 54
locus_name: PURG
verdict: re-tiered
verdict_reason: >-
  Tier C, from the seed's B. The region's strongest result is Wright 2019's GWAS of the current age of 482,068
  AncestryDNA customers (VIABILITY_AF, confirmation only under §4.5, so it cannot carry A, D23). There G,
  about half of European chromosomes (0.52), is commoner among older customers, and it is suggestive, not
  genome-wide, at the P the paper uses for its own call (D17.3): genomic control (λ 1.374) gives 8.7e-7 against the
  paper's Bonferroni line of 9.3e-8; uncorrected it is 8.1e-9. The paper names only APOE and MAP2K6 from this
  analysis, and the GWAS Catalog holds no other association for the lead. The seed reads the study as a parental-lifespan meta-analysis with UK Biobank: the lead is not in it,
  and the region's lines there, at three neighbours, are nominal (fathers' meta P 8.4e-4 to 0.0014). The one
  independent support is FinnGen R11's any-death endpoint: G with fewer deaths, P 0.0010 (one-sided 0.0005), in
  50,511 deaths, outside AncestryDNA and UK Biobank, nominal. Timmers 2019's million parental lives lean the same way
  (P 0.16, one-sided 0.080, its two arms opposite in sign); Zenin 2019's healthspan leans the same way, P 0.18. Deelen
  2019 is flat at both percentiles (P 0.82 and 0.32); the discovery's effect, on z-scored current age, has no factor
  to Deelen's scale, so D21's power is not computable, and Timmers' own β under APOE's factor would give only about
  0.39, so the flat result is no red flag. A suggestive confirmation-class result with one nominal independent
  replication: C, as row 10, not B (R-TIER-4, no genome-wide scoring-class anchor), not D (nothing powered
  contradicts it). Open Targets 26.09 holds the lead in one credible set of the eight studies, Wright's age study's
  (PICS, 29 variants), where its posterior probability, the set's highest, is 0.0988. That set is built at the
  uncorrected 8e-9 the row does not read as genome-wide, so it sets no causal or effector level (D28.5, the lead's
  ruling; the previous commits' C3 and E2 rejected): C4, E4, no gene named. On that set, named in prose only, locus-to-gene gives WRN
  0.591, PURG 0.499 (0.001 under the bar, not a rival by D24's letter) and TEX15 0.247, and its 24 colocalisations are
  all with other GWAS, none with a QTL study: WRN would lead by L2G alone. The lead's own 19 sets add one expression
  set, PURG's in GTEx caudate (lead probability 0.045, QC-flagged by its source): a membership, not a colocalisation,
  so no rival criterion (D24) and not row 53's flagged colocalisation (D27.7). The seed's WRN:0.59 is the same record.
  The set colocalises (H4 above 0.9) with type 2 diabetes, HDL cholesterol,
  triglycerides, body mass index, insomnia and intelligence, with no direction for G in any record: shared signal,
  not a mediator, so the mechanism is general ageing with lipid, diabetes, adiposity and cognition pleiotropy. The
  protection is a presence, the derived G. Age of action is unknown. G is 0.68 in East Asians, untested there.
