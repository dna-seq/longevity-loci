variants:
  - rsid: rs55686423
    gene: ""
    phenotype: PRPF40B region, healthier ageing
    trait_efo_id: EFO_0007796
    effect_allele: T
    effect_size: 0.010
    effect_measure: beta
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: A/A
        state: neutral
        conclusion: >-
          You carry two copies of the usual version of this DNA region, as about 82 in 100 people of European
          ancestry do. It is the reference the other combinations are compared with. The region, on chromosome 12,
          lies inside the PRPF40B gene; which gene matters, if any, is not known. The finding comes from people of
          European ancestry; less is known elsewhere.
      - genotype: A/T
        state: protective
        conclusion: >-
          You carry one copy of a less common version of this DNA region (about 17 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, this version went with slightly healthier ageing, and parents of carriers lived a
          little longer, which a separate American study also saw. The same version goes with a lower chance of
          ever taking up smoking, slightly lower blood pressure and slightly higher scores on thinking tests. It is a likely finding, not a settled one. The effect is small and it is a
          tendency, not destiny.
      - genotype: T/T
        state: protective
        conclusion: >-
          You carry two copies of a less common version of this DNA region (about 1 in 100 people of European
          ancestry do). In very large European studies that combined healthspan, frailty, long life and biological
          age into one measure, each copy went with slightly healthier ageing, and parents of carriers lived a
          little longer, which a separate American study also saw. The same version goes with a lower chance of
          ever taking up smoking, slightly lower blood pressure and slightly higher scores on thinking tests. It is a likely finding, not a settled one. The effect is small and it is a
          tendency, not destiny.
