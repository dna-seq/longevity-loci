# The seed list's locus 124, RPS6 (9p22.1). Curated 2026-11-15. Lead rs189871470, the seed's only rsID (Kolbe 2025's
# German exome study): synonymous in RPS6 (leucine 15, CTC to CTT, on the MANE Select transcript ENST00000380394),
# GRCh38 9:19,379,580 G/A, GRCh37 9:19,379,578, A the rare allele (0.043 % in gnomAD's non-Finnish European exomes)
# and the discovery's longer-lived side. Open Targets 26.09 has no record under either allele order; the GWAS Catalog
# (2026-10-29) holds no association.
locus_id: 124
locus_name: RPS6
verdict: kept
verdict_reason: >-
  Tier C, the seed's: a sub-genome-wide discovery in one sample, old against young (R-TIER-2), unreplicated (§4.1's
  C). Kolbe 2025 sequenced the exomes of 1,245 German long-lived individuals (past the 95th age-at-death percentile
  of their birth cohort) and 4,105 younger controls; A was at 0.28 % among the long-lived and 0.01 % among the
  controls, OR 16.5 (Haldane-corrected), P 1.7e-7, FDR-adjusted 6.4e-3 under the paper's exploratory false-discovery
  rate of 0.05, its own exome-wide call, not a genome-wide one (R-TIER-4, D31.13). On 2,490 and 8,210 alleles that is
  7 copies against 1 (the Haldane OR from 7 and 1 is 16.53, derived). The controls fit the reference D31.13 fixes,
  gnomAD's non-Finnish European exomes (0.043 %): 3.5 copies expected, 1 seen, Poisson P 0.135 (genomes, 0.054 %:
  4.5 and P 0.063), so the paper is read as printed (D31.10 not met). Against the same reference the long-lived show
  7 where 1.1 are expected (exact Poisson P 1.2e-4, derived); the paper's own OR against gnomAD is 6.49, with its
  caveat that gnomAD's non-Finnish Europeans are mostly British. The excess is the men's: from the printed
  percentages and the long-lived's 2.7:1 women to men, about 5 copies in 336 long-lived men (0.29 expected from
  gnomAD, P 1.3e-5) and 2 in 909 women (0.78 expected, P 0.18), the one control copy a man's (derived); no sex
  token on a C row's one sample, named. RPS6's gene-based synonymous test (6 variants, P 7.4e-7, adjusted 0.014) is
  driven mainly by this variant, so it is the same signal, not a second one. No look-up tests it: the Ashkenazi
  sample holds only three of the seven variants, not this one (gnomAD's Ashkenazi exomes show no A either), and the
  Leiden sample (179 long-lived, 98 controls) expects 0.15 and 0.08 copies, so its absence says nothing. FinnGen R11's
  deaths hold it (A at 0.048 %, as in gnomAD): β +0.043 (SE 0.161), P 0.79, flat, a database line (D29.1); carried by
  Kolbe's own APOE ε4 line against FinnGen's (an APOE-only calibration, approximate) the printed OR expects β −0.37,
  power 0.74, heterogeneity P 0.039 counting the discovery's own error, and the reference read expects −0.25,
  power 0.46: below D21's power, and an
  APOE-only calibration sets no flag (D31.12, D31.13). At 0.04 % the variant is absent from Deelen 2019 (no line in
  its ±500 kb windows; the strongest, the 90th's 9:19,486,525 at 0.03 and 9:19,586,463 at 0.18, P 1.5e-4 and
  2.9e-4, and the 99th's 9:19,209,591 at 0.61, P 7.4e-4, cannot tag a 0.04 % variant), Timmers 2019, Pilling 2017, Zenin 2019, Park 2025 and Foote 2025: untested, not
  negative. Wright 2019's nearest line, rs10114375 9.5 kb away (fathers, P 0.0016; minor allele 9.6 %), and its
  AncestryDNA fathers' lines 469 kb away (P 0.0014) cannot tag it either (r² at most about 0.004, derived). The literature search (the rsID; Semantic Scholar answered 429, its part unchecked) finds Kolbe alone; the
  five papers citing Kolbe (Semantic Scholar, 2026-11-15) are two reviews, an unrelated study, a machine-learning
  study of GenAge and the 2026 bioRxiv functional study read for row 120, which edits variants in other genes; none
  tests this one. Exceptional survival + (the discovery, read as printed; against gnomAD too); lifespan untested (FinnGen holds it, flat,
  but a database line neither replicates nor contradicts, D30.12, and it is short of a powered test); healthspan untested. Mechanism ageing in general (D25.7): RPS6 is a
  ribosomal protein downstream of mTOR, and the authors suggest the synonymous change may lower its expression
  (a rarer codon, an altered mRNA fold, from web tools; RPS6 expression non-significantly lower in Leiden's
  long-lived, P 0.055), a route not tested here; named. Causal C4: no Open Targets record. Effector E4: a synonymous
  change meets no coding clause (§4.2; row 121's way), so no gene is named as acting; RPS6 is the gene it sits in.
  Descriptive. Age of action unknown. The evidence is European (German).
