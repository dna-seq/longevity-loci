variants:
  - rsid: rs189871470
    gene: ""
    phenotype: RPS6 synonymous, longevity
    trait_efo_id: OBA_VT0005372
    effect_allele: A
    effect_size: 16.5
    effect_measure: OR
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position, as nearly everyone does. It is the
          reference the other combinations are compared with. The position lies in the RPS6 gene on chromosome 9.
      - genotype: A/G
        state: protective
        conclusion: >-
          You carry one copy of a very rare version of this DNA position (about 9 in 10,000 people of European
          ancestry do). It does not change the RPS6 protein, which helps build the cell's protein-making machinery;
          the study's authors suggest it might lower how much of it is made, which is untested. One German study found
          it seven times among 1,245 very long-lived people and once among 4,105 younger people, nearly all of the
          excess in men. It rests on a handful of
          carriers and has not been confirmed, so this is weak, early evidence: a possible tendency, not destiny.
      - genotype: A/A
        state: protective
        conclusion: >-
          You carry two copies of a very rare version of this DNA position, which is extremely unusual; the one study
          of it found no one with two copies. One German study found single copies a few times among very long-lived
          people, a finding not yet confirmed, so nothing can be said about two copies.
