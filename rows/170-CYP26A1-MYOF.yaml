variants:
  - rsid: rs1927465
    locus: {chrom: "10", start: 93236765, ref: C, cites: [db-ensembl-116#q1213]}
    gene: ""
    phenotype: CYP26A1–MYOF region, longevity
    trait_efo_id: OBA_VT0005372
    effect_allele: T
    effect_size: 1.52
    effect_measure: OR
    stat_significance: suggestive
    direction: protective
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (about 73 in 100 people of European ancestry
          do). It is the reference the other combinations are compared with. The position lies on chromosome 10
          between the CYP26A1 and MYOF genes, and what it does there is not known. The finding comes from people of
          European ancestry; less is known elsewhere.
      - genotype: C/T
        state: protective
        conclusion: >-
          You carry one copy of the less common T version of this DNA position (about 25 in 100 people of European
          ancestry do). In one American and Danish study of long-lived families, people who reached 96 carried this
          version more often, and a second, smaller study agreed. Much larger studies of how long people's parents
          lived did not find it, and one leaned the other way, so this is early and uncertain evidence. It is a
          tendency at most, not a guarantee.
      - genotype: T/T
        state: protective
        conclusion: >-
          You carry two copies of the less common T version of this DNA position (about 2 in 100 people of European
          ancestry do). In one American and Danish study of long-lived families, people who reached 96 carried this
          version more often, per copy, and a second, smaller study agreed. Much larger studies of how long people's
          parents lived did not find it, and one leaned the other way, so this is early and uncertain evidence. It is a
          tendency at most, not a guarantee.
