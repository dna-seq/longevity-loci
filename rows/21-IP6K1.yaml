variants:
  - rsid: rs9872864
    gene: ""
    phenotype: IP6K1 region (3p21.31), mothers' lifespan
    trait_efo_id: EFO_0007796
    effect_allele: G
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: protective
        conclusion: >-
          You carry two copies of the slightly more common version of this DNA region (about 26 in 100 people of
          European ancestry do). In very large American and British studies, each copy of it went with mothers
          living a little longer, and a separate European study of very long-lived people agreed, weakly. The
          finding is well established, though its confirmation in a separate group is a single, modest one; the
          effect is small and it is a tendency, not destiny. The region, on chromosome 3, is crowded with genes, and
          which one matters here is not known.
      - genotype: A/G
        state: neutral
        conclusion: >-
          You carry one copy of each common version of this DNA region (about 50 in 100 people of European ancestry
          do, the most common combination). It is the reference the other combinations are compared with. The
          finding comes from people of European ancestry; less is known elsewhere.
      - genotype: A/A
        state: risk
        conclusion: >-
          You carry two copies of the slightly less common version of this DNA region (about 24 in 100 people of
          European ancestry do). In very large American and British studies, each copy went with mothers living a
          little less long, and a separate European study of very long-lived people agreed, weakly. The finding is
          well established, though its confirmation in a separate group is a single, modest one; the effect is
          small and it is a tendency, not destiny.
