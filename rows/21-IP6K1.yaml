# The seed list's locus 21, IP6K1 (3p21.31; the seed's genes IP6K1 and TRAIP). Curated 2026-11-11, the third run's
# first row. Lead rs9872864 (the seed's lead), an intron variant, A/G, G the major allele in Europeans by a hair
# (0.512). The seed's second rsID, rs2271961 (86 kb away, Rosoff 2023's mvAge SNP), is the same signal: r² 0.99,
# D′ 1.00 in 1000 Genomes EUR, its T riding with the lead's G (derived from East Asian frequencies;
# db-ensembl-116#q100), and each SNP lies in the other's credible set; named, scored only through the lead. Wright
# 2019's maternal-lifespan meta-analysis locus (Table 3, Supplemental Tables 8 and 9); in Timmers 2019's, Zenin
# 2019's and Deelen 2019's summary statistics at both SNPs. Open Targets 26.09: 538 and 431 credible sets hold
# them, two of a scoring class; the GWAS Catalog (2026-10-29) holds two and three associations.
locus_id: 21
locus_name: IP6K1
verdict: kept
verdict_reason: >-
  Tier A, up from the seed's B, on §4.1's letter, with the replication thin. Wright 2019's meta-analysis of
  AncestryDNA customers' and UK Biobank's mothers (N 660,000) is genome-wide at rs9872864, P 6.9e-10 (Table 3,
  Supplemental Table 9; GWAS Catalog GCST009449), G lengthening mothers' lives. The meta-analysis is METAL's
  sample-size scheme with genomic control in each dataset and 5.0e-8 its threshold (q56, q57); neither arm is
  genome-wide alone (AncestryDNA P 1.3e-4 after genomic control, UK Biobank P 1.3e-7), both arms' z-score effects
  are −0.011 per A, heterogeneity P 0.90, and the paper prints no pooled effect, so the study is scored on allele,
  direction and P (D20). Mothers and fathers were separate meta-analyses, not corrected across the two (q58); the
  fathers lean the same way, not genome-wide (meta P 8.0e-5). Deelen 2019's survival to the 90th percentile replicates it in a sample
  sharing nothing with Wright's (no UK Biobank, no AncestryDNA): G at P 0.020, same allele, same direction; the 99th
  percentile, its cases a subset of the 90th's, leans the same way and does not pass (P 0.13). Timmers 2019's
  million parents' lives (G longer, P 4.4e-4) holds UK Biobank and replicates nothing. Its direction at the lead
  reads "-+", LifeGen against UK Biobank as this row reads the string's order (no cached text defines it), but
  LifeGen's sign is not stable: at rs9855505, in perfect LD 135 bp
  away, it reads "--", at the proxy rs2271961 "++", and across the 57 SNPs there at P < 0.005 with the lead's
  frequency it disagrees with UK Biobank at 23 and agrees at 34. LifeGen, independent of Wright's samples, so does
  not replicate, its estimate indistinguishable from zero. The file prints no per-arm β: backing LifeGen (taken as
  about zero) out of the pooled β leaves UK Biobank at about −0.0176 per A, which at LifeGen's SE at other loci
  (about 0.008) expects z about 2.2, one-sided power 0.6 to 0.7 (0.2 to 0.35 after winner's curse), heterogeneity
  P about 0.055. Below D21's line (power 0.8 and heterogeneity P below 0.05), so no red flag. Rosoff
  2023's mvAge is genome-wide at rs2271961, the lead's near-perfect proxy (r² 0.99, its T with the lead's G; T,
  P 3e-9, the GWAS Catalog's record), the same signal pooled from overlapping samples, cited here and not scored.
  Lifespan +, exceptional survival + (Deelen's 90th percentile, nominal), healthspan 0 (Zenin 2019, G on the
  healthier side at P 0.105). Mechanism general ageing: the region, 3p21.31, is gene-dense and pleiotropic, and both
  scoring sets colocalise (H4 ≥ 0.8) with blood pressure and hypertension, intelligence and education, vitamin D,
  lung function and HDL lipids, but colocalisation gives no direction. The GWAS Catalog holds dental caries, anxiety
  and tea drinking at the two SNPs. The paper knew of no life-shortening disease at IP6K1. Causal
  C3: both scoring sets are PICS sets of about 80 variants with flat posteriors (the lead 0.020 and 0.023), which
  mark a region and pick no variant. Effector E3, no gene named: L2G's top genes are MST1R (0.11) and GMPPB (0.19),
  IP6K1 0.06; both scoring sets colocalise (H4 ≥ 0.8) with expression, splicing and transcript QTLs of a dozen
  genes, RNF123 (311 each) and UBA7 (117) most, IP6K1 twice, so no single gene stands out (an earlier query, GWAS
  partners only, had missed them). G is the major allele
  at 51 % against 49 %, so A/G, the most common genotype, is the reference (§6.2): G/G protective, A/A risk; no
  PROTECT token, the split too even and no disease known at the locus to be absent (q51). Age of action unknown. The evidence is European.
