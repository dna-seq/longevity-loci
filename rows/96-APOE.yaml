# The seed list's locus 96, APOE (19q13.32). Curated 2026-11-15. Scored once, as the ε pair read from rs429358 and
# rs7412 (R-APOE-1, D33): rs429358 C changes cysteine 130 to arginine and rs7412 T arginine 176 to cysteine on the MANE
# transcript ENST00000252486 (residues 112 and 158 of the mature protein in the usual numbering); ε2 is T at both, ε3
# T and C, ε4 C at both. The two SNPs carry their studies and no genotypes; the six pairs carry the results, each
# once for lifespan and once for Alzheimer's disease. ε1 (C at rs429358 with T at rs7412), very rare, is not defined.
# The seed's proxies rs2075650, rs4420638 and rs769449 tag ε4 in part (CEU r² 0.55, 0.72, 0.80; rs2075650 0.81 in
# CHB, 0.83 in CHS, 0.68 in the pooled East Asian panel); rs405509 and rs449647 tag neither SNP (r² 0.05 to 0.12) and are Rosoff 2023's further mvAge leads in the
# locus. None is scored. The separate APOE module is `apoe_epsilon` (the registry's prod catalog, 2026-11-15).
locus_id: 96
locus_name: APOE
verdict: kept
verdict_reason: >-
  Tier A, the seed's: genome-wide in independent samples on more than one scale, at both ε-defining SNPs, and the
  locus Timmers 2019 calls the most often discovered in lifespan GWAS. Deelen 2019's European meta-analysis (no UK
  Biobank data): ε4's rs429358 C OR 0.60 per allele at the 90th percentile (P 1.3e-56) and 0.52 at the 99th (P
  3.9e-34), ε2's rs7412 T 1.28 (P 2.4e-11) and 1.47 (P 3.2e-12); both replicated by de novo genotyping in two
  further cohorts (ε4 OR 0.45, P 5.2e-36; ε2 1.32, P 2.4e-6), and a conditional analysis in two cohorts found the
  locus explained by these two variants. Timmers 2019's parental lifespan (UK Biobank and LifeGen): each ε4 copy
  about 1.06 years shorter (P 3.1e-83), each ε2 copy about 0.61 years longer (P 7.6e-17; ten times beta1, derived).
  Park 2025's own survival in UK Biobank: ε4 P 3.9e-45, ε2 the other way, P 0.013. FinnGen R11's deaths, outside UK
  Biobank: ε4 more deaths (P 1.3e-27), ε2 fewer (P 3.5e-4), a database line (D29.1). Kolbe 2025's German exome
  study: ε4 OR 0.45 (P 1.6e-25), ε2 1.34 (P 5.4e-4), its overlap with Deelen's German arm unread. Bae 2022's
  centenarian mega-analysis (NECS, LLFS, LGP, SICS) and Gurinovich 2021's NECS GWAS: ε4 P 1.9e-36 and 2.9e-28,
  overlapping Sebastiani 2019's studies. Rosoff 2023's mvAge: ε2's T P 1.5e-20 (multivariate, not a replication).
  Each of these is per allele of one SNP: the ε4 C against T (ε2 and ε3 together) and the ε2 T against C (ε3 and ε4
  together), so the ε2 figure, whose reference includes ε4, overstates ε2 against ε3 somewhat. No read here prints a
  pair against ε3/ε3 with numbers. Sebastiani 2019 (seven studies, 28,297 people, abstract only) says ε4 lowers the
  odds of extreme longevity with excess death past the 99th percentile age, and that carrying ε2/ε2 or ε2/ε3 raises
  the odds against ε3/ε3, the two pairs pooled, not ε2/ε3 alone. So every pair figure is derived, ε2/ε3's included,
  never a printed pair effect: each version against ε3 is solved jointly from the two per-allele effects and the
  allele frequencies (gnomAD's non-Finnish European genomes, rs429358 C 0.138 and rs7412 T 0.079, under
  Hardy–Weinberg, which also gives the pair frequencies the texts state; D34.11), ε2 against ε3 OR 1.19 at the 90th
  percentile and 1.34 at the 99th and +0.46 years a copy, ε4 0.61, 0.53 and −1.01 years (derived). Against ε3/ε3 at
  the 90th percentile ε2/ε2 about 1.41, ε2/ε3 1.19, ε2/ε4 0.72, ε3/ε4 0.61, ε4/ε4 0.37; in years about +0.9, +0.46,
  −0.56, −1.01, −2.0 (derived). ε2/ε2's own figures are weak: Kuo
  2020 (UK Biobank, aged 40 to 70) gives its own death HR 1.06 (0.87–1.30), a null, and triglycerides up 0.41 SD; its
  derived hazard on the texts' derivation, about 0.91 (ε2's +0.46 years a copy as Timmers' log hazard −0.046,
  doubled), sits inside that interval, so the derived
  state stands (D34.3); ε2/ε3's
  HR is 0.96 (0.91–1.01). Kuo's sentence on a four-cohort parental meta-analysis (ε2/ε3 OR 1.34, ε2/ε2 1.26 with an
  interval spanning 1) cites a reference not read here: named, not counted. The Alzheimer's results use Belloy 2023's
  odds in White individuals (n 34,021), each pair against ε3/ε3: ε2/ε2 0.39, ε2/ε3 0.53, ε2/ε4 2.23, ε3/ε4 3.46,
  ε4/ε4 13.04; odds in case-control samples, not lifetime risks; ε3/ε4's odds higher in East Asians (4.54) and lower
  in Black and Hispanic samples; ε2 shows no protection in East Asians. Outside Europe, against Deelen's 90th percentile on the same scale (two log odds of long-lived
  status; derived): Hsieh 2026's Taiwanese 90-and-over GWAS (922 cases, 871 controls) gives ε4 OR 0.96 (P 0.82),
  one-sided power 0.88, heterogeneity P 0.011, a powered non-replication; beside it, Liu 2021's independent Chinese
  CLHLS longevity study replicates genome-wide at rs2075650's G (β −0.293, P 6.2e-10), a P that is its
  meta-analysis's of two sets (each alone short of genome-wide, 6.8e-7 and 7.3e-5; dataset 1's custom chip was
  partly chosen from dataset 2's earlier GWAS, the overlapping samples removed), which counts. rs2075650 tags ε4 at
  r² 0.81 in CHB and 0.83 in CHS, clearing 0.8 narrowly (the pooled East Asian panel 0.68). Hsieh prints Liu's own
  SNP, G OR 0.99, P 0.97 (Table S5): against Liu heterogeneity P 0.13 and power at Liu's size 0.49 (derived, its SE
  0.18 taken from the same table's rs429358 line at the same frequency, since a P near 1 fixes none; with the SE
  from its own P, 0.30 and 0.29). So Hsieh's null fails Deelen's European size, not the East Asian one, and is not
  shown to contradict the replication in its own ancestry: under D34.1, as D34.10 reads it, no
  `replication_failed` is set. Hsieh's ε2 line (OR 0.85, P 0.28) is unpowered (0.50). Its 95-and-over (ε4 0.63, P
  0.12; ε2 0.71, P 0.21) and 85-and-over (ε4 1.03, ε2 0.85) tables are named only, not grounds (D34.1).
  The Calabrian GWAS (299 cases) has ε4's C at OR 0.66, P 0.12, the same side, power 0.61, heterogeneity P 0.72, no
  contradiction, though its authors call APOE not associated. Exceptional survival + (Deelen); lifespan + (Timmers,
  Park, FinnGen); healthspan + (Zenin 2019: ε2 later end of healthspan, P 0.0029; ε4 earlier, P 0.041). Age of
  action late, direct: Timmers' ε4 log hazard ratio over 70 is about three times that at 40 to 70 (age moderation P
  2.2e-14), as Joshi 2017's age-split hazard ratios (1.06 at 40 to 75, 1.14 over 75) show too; context
  `age_dependent`; APOE's effect is also larger in women by 0.036 log hazard, named. Mechanism brain and memory:
  Alzheimer's disease is ε4's and ε2's largest disease effect; pleiotropy `mech:cvd` (Timmers' disease column
  cardiometabolic and neuropsychiatric; ε2/ε3 coronary OR 0.87 in Kuo) and `tradeoff` (D18.1): Timmers 2020 finds
  the life-extending alleles near APOE with more macular degeneration, and Kuo lists ε2 with macular degeneration,
  renal disease, type III hyperlipidaemia and cerebral amyloid angiopathy with lobar haemorrhage. Causal C1:
  rs429358 tops all seven lifespan-class credible sets that hold it, at PIP 0.92 to 1.00 (Timmers 2019, Pilling
  2017, Park 2025's three, Timmers 2020's multivariate, GCST006702); rs7412 is in none, its place resting on the
  conditional analysis. Effector E1 APOE: both are missense in APOE, and locus-to-gene gives APOE 0.973 (next APOC2
  0.174); the colocalisation listing (1,825 rows) is not read. PROTECT:PRESENCE: ε2 is a protective version, not the
  absence of a risk one. Descriptive. `also_in:apoe_epsilon`: the link D33 (the person's D2) asks for, to the module
  antonkulaga/apoe_epsilon (1.1.1 in the registry's prod catalog, read 2026-11-16), whose Alzheimer's odds are
  Belloy 2023's as here; this row speaks of lifespan first. Proxies (D34.4): R-APOE-1's five are positions folded into APOE, not scored; three
  tag ε4 and share one `ld_proxy_of:rs429358` token (D34.12), which below r² 0.8 means folded into APOE, never a
  countable proxy (rs2075650 0.55 in CEU, 0.81 in CHB and 0.83 in CHS, rs4420638 0.72, rs769449 0.80); rs405509 and rs449647, Rosoff's further
  leads, tag neither ε SNP: named, no token. The seed's other sources: Pilling 2017 (UK Biobank, inside Timmers' sample) and
  Wright 2019 (AncestryDNA with UK Biobank) find APOE genome-wide in parents; Timmers 2020 finds APOE's effect does not fade with parental age; Joshi
  2016 (PMID 27029810) is not read. The scout's 2015–2026 backfill (D41) adds corroboration, none of it moving a
  cell: own survival against ε3/ε3 in 105,949 Danes (Rasmussen 2019, ε4/ε4 HR 1.43, ε4/ε3 1.10; pmid-31236578), in
  Whitehall II with Three-City (Régy 2024, ε4 homozygotes 1.59; pmid-38824957) and in UK Biobank's statin users and All
  of Us (Asiimwe 2025, ε4/ε4 1.54, inside UK Biobank; pmid-40763922); survival to 90 in the Women's Health Initiative's
  white women (Shadyab 2017; pmid-27707806), in Danish nonagenarians (Tan 2020, ε4 RR 1.16; pmid-31971580) and ε2
  enriched, ε4 depleted in Ashkenazi centenarians (Ryu 2016; pmid-26930295); ε4 against longevity in 3,703 Russians
  aged 90 and over, OR 0.67, P 4.8e-10, the scan's one genome-wide line (Kashtanova 2026; pmid-41701878); a TOMM40–APOC1
  modifier of ε4's survival effect (Kulminski 2022; pmid-36330582). East Asian looks: Koreans' ε2 HR 0.84 (0.74 to
  0.96) with ε4 1.08 (0.97 to 1.20), not significant (Choi 2019; pmid-31625294), and ε4 against survival in very old
  Japanese men only (Sasaki 2020; pmid-31603980); an Israeli cohort's men, ε4 HR 1.47 (0.95 to 2.26) (Dankner 2020;
  pmid-31585002). Two preprints, never a replication: in the Million Veteran Program's 137,593 veterans ε4 raises
  dementia-or-death combined, HR 1.19 per allele, not mortality alone (Ma 2026; doi-10.64898_2026.06.18.26355781 q1
  to q3); in admixed Brazilians ε2 homozygotes on African local ancestry are in excess among the deceased, a
  Hardy-Weinberg test with no genotype effect printed (Santos 2026; doi-10.64898_2026.06.20.733520 q3). All but
  Rasmussen read at the abstract. Literature searches (APOE genotype and Alzheimer's odds; APOE genotypes and
  extreme longevity; rs7412 and longevity since 2023; Semantic Scholar answered 429 and the preprint index timed out,
  their part unchecked) found Belloy, Kuo and Sebastiani, read here, and Gurinovich 2019's European-ancestry clusters
  (weaker ε4 and ε2 effects in a Southern Italian cluster), not read. The seed's GenAge mouse note is not carried (no
  corpus note; R-ANIMAL-3).
