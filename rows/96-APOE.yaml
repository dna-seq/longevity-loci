# The seed list's locus 96, APOE (19q13.32). Curated 2026-11-15. Scored once, as the ε pair read from rs429358 and
# rs7412 (R-APOE-1, D33): rs429358 C changes cysteine 130 to arginine and rs7412 T arginine 176 to cysteine on the MANE
# transcript ENST00000252486 (residues 112 and 158 of the mature protein in the usual numbering); ε2 is T at both, ε3
# T and C, ε4 C at both. The two SNPs carry their studies and no genotypes; the six pairs carry the results, each
# once for lifespan and once for Alzheimer's disease. ε1 (C at rs429358 with T at rs7412), very rare, is not defined.
# The seed's proxies rs2075650, rs4420638 and rs769449 tag ε4 in part (CEU r² 0.55, 0.72, 0.80; rs2075650 0.81 in
# CHB); rs405509 and rs449647 tag neither SNP (r² 0.05 to 0.12) and are Rosoff 2023's further mvAge leads in the
# locus. None is scored. The separate APOE module is `apoe_epsilon` (the registry's prod catalog, 2026-11-15).
locus_id: 96
locus_name: APOE
verdict: kept
verdict_reason: >-
  Tier A, the seed's: genome-wide in independent samples on more than one scale, at both ε-defining SNPs, and the
  locus Timmers 2019 calls the most often discovered in lifespan GWAS. Deelen 2019's European meta-analysis (no UK
  Biobank data): ε4's rs429358 C OR 0.60 per allele at the 90th percentile (P 1.3e-56) and 0.52 at the 99th (P
  3.9e-34), ε2's rs7412 T 1.28 (P 2.4e-11) and 1.47 (P 3.2e-12); both replicated by de novo genotyping in two
  further cohorts (ε4 OR 0.45, P 5.2e-36; ε2 1.32, P 2.4e-6), and a conditional analysis in two cohorts found the
  locus explained by these two variants. Timmers 2019's parental lifespan (UK Biobank and LifeGen): each ε4 copy
  about 1.06 years shorter (P 3.1e-83), each ε2 copy about 0.61 years longer (P 7.6e-17; ten times beta1, derived).
  Park 2025's own survival in UK Biobank: ε4 P 3.9e-45, ε2 the other way, P 0.013. FinnGen R11's deaths, outside UK
  Biobank: ε4 more deaths (P 1.3e-27), ε2 fewer (P 3.5e-4), a database line (D29.1). Kolbe 2025's German exome
  study: ε4 OR 0.45 (P 1.6e-25), ε2 1.34 (P 5.4e-4), its overlap with Deelen's German arm unread. Bae 2022's
  centenarian mega-analysis (NECS, LLFS, LGP, SICS) and Gurinovich 2021's NECS GWAS: ε4 P 1.9e-36 and 2.9e-28,
  overlapping Sebastiani 2019's studies. Rosoff 2023's mvAge: ε2's T P 1.5e-20 (multivariate, not a replication).
  Each of these is per allele of one SNP: the ε4 C against T (ε2 and ε3 together) and the ε2 T against C (ε3 and ε4
  together), so the ε2 figure, whose reference includes ε4, overstates ε2 against ε3 somewhat. No read here prints a
  pair against ε3/ε3 with numbers. Sebastiani 2019 (seven studies, 28,297 people, abstract only) says ε4 lowers the
  odds of extreme longevity with excess death past the 99th percentile age, and that carrying ε2/ε2 or ε2/ε3 raises
  the odds against ε3/ε3. So the pair results are worded from the per-allele effects added on the log scale
  (derived: against ε3/ε3 at the 90th percentile ε2/ε2 about 1.6, ε2/ε3 1.28, ε2/ε4 0.77, ε3/ε4 0.60, ε4/ε4 0.36;
  in years about +1.2, +0.6, −0.45, −1.06, −2.1), never as printed pair effects. ε2/ε2's own figures are weak: Kuo
  2020 (UK Biobank, aged 40 to 70) gives its own death HR 1.06 (0.87–1.30) and triglycerides up 0.41 SD; ε2/ε3's
  HR is 0.96 (0.91–1.01). Kuo's sentence on a four-cohort parental meta-analysis (ε2/ε3 OR 1.34, ε2/ε2 1.26 with an
  interval spanning 1) cites a reference not read here: named, not counted. The Alzheimer's results use Belloy 2023's
  odds in White individuals (n 34,021), each pair against ε3/ε3: ε2/ε2 0.39, ε2/ε3 0.53, ε2/ε4 2.23, ε3/ε4 3.46,
  ε4/ε4 13.04; odds in case-control samples, not lifetime risks; ε3/ε4's odds higher in East Asians (4.54) and lower
  in Black and Hispanic samples; ε2 shows no protection in East Asians. Outside Europe, scripted against Deelen's
  90th percentile on the same scale (two log odds of long-lived status; derived): Hsieh 2026's Taiwanese 90-and-over
  GWAS (922 cases, 871 controls) gives ε4 OR 0.96 (P 0.82), one-sided power 0.88, heterogeneity P 0.011, a D21 red
  flag; its ε2 line (OR 0.85, P 0.28) is unpowered (0.50). Its 95-and-over table leans Deelen's way for ε4 (OR 0.63,
  P 0.12, one-sided 0.06, heterogeneity P 0.87) and not for ε2 (0.71, P 0.21, power 0.23), and its 85-and-over table
  prints ε4 1.03 and ε2 0.85. Liu 2021's Chinese CLHLS meta-analysis has rs2075650's G, which tags ε4 at r² 0.81 in
  CHB, at β −0.293 (P 6.2e-10): a genome-wide East Asian replication in ε4's direction. D21's letter and row 18's
  precedent (D26.11) would make Hsieh's powered ε4 null `replication_failed` and cap the row at B under the 71/67
  rule; the curator's default departs from them and is put to the lead: no flag, A, since an independent East Asian
  sample at the 0.8 tag replicates genome-wide and Hsieh's ε4 line is null at 85 and 90 yet leans at 95. The
  Calabrian GWAS (299 cases) has ε4's C at OR 0.66, P 0.12, the same side, power 0.61, heterogeneity P 0.72, no
  contradiction, though its authors call APOE not associated. Exceptional survival + (Deelen); lifespan + (Timmers,
  Park, FinnGen); healthspan + (Zenin 2019: ε2 later end of healthspan, P 0.0029; ε4 earlier, P 0.041). Age of
  action late, direct: Timmers' ε4 log hazard ratio over 70 is about three times that at 40 to 70 (age moderation P
  2.2e-14), as Joshi 2017's age-split hazard ratios (1.06 at 40 to 75, 1.14 over 75) show too; context
  `age_dependent`; APOE's effect is also larger in women by 0.036 log hazard, named. Mechanism brain and memory:
  Alzheimer's disease is ε4's and ε2's largest disease effect; pleiotropy `mech:cvd` (Timmers' disease column
  cardiometabolic and neuropsychiatric; ε2/ε3 coronary OR 0.87 in Kuo) and `tradeoff` (D18.1): Timmers 2020 finds
  the life-extending alleles near APOE with more macular degeneration, and Kuo lists ε2 with macular degeneration,
  renal disease, type III hyperlipidaemia and cerebral amyloid angiopathy with lobar haemorrhage. Causal C1:
  rs429358 tops all seven lifespan-class credible sets that hold it, at PIP 0.92 to 1.00 (Timmers 2019, Pilling
  2017, Park 2025's three, Timmers 2020's multivariate, GCST006702); rs7412 is in none, its place resting on the
  conditional analysis. Effector E1 APOE: both are missense in APOE, and locus-to-gene gives APOE 0.973 (next APOC2
  0.174); the colocalisation listing (1,825 rows) is not read. PROTECT:PRESENCE: ε2 is a protective version, not the
  absence of a risk one. Descriptive. `also_in:apoe_epsilon`: the pairs' Alzheimer's results overlap that module;
  this row speaks of lifespan first. Proxies: R-APOE-1 names five; three are `ld_proxy_of` (all under the 0.8 used
  elsewhere in CEU, rs2075650 at 0.81 in CHB), and rs405509 and rs449647, Rosoff's further leads, tag neither ε SNP:
  named, not scored, put to the lead. The seed's other sources: Pilling 2017 (UK Biobank, inside Timmers' sample) and
  Wright 2019 (AncestryDNA with UK Biobank) find APOE genome-wide in parents; Timmers 2020 finds APOE's effect does not fade with parental age; Joshi
  2016 (PMID 27029810) is not read. Literature searches (APOE genotype and Alzheimer's odds; APOE genotypes and
  extreme longevity; rs7412 and longevity since 2023; Semantic Scholar answered 429 and the preprint index timed out,
  their part unchecked) found Belloy, Kuo and Sebastiani, read here, and Gurinovich 2019's European-ancestry clusters
  (weaker ε4 and ε2 effects in a Southern Italian cluster), not read. The seed's GenAge mouse note is not carried (no
  corpus note; R-ANIMAL-3).
