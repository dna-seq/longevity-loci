variants:
  - rsid: rs429358
    gene: APOE
    phenotype: APOE ε4-defining, shorter life
    trait_efo_id: OBA_VT0005372
    effect_allele: C
    effect_size: 0.60
    effect_measure: OR
    stat_significance: significant
    direction: risk
    negatives: >-
      The longer-lived allele here, T (not ε4), comes with more age-related macular degeneration (Timmers 2020's
      life-extending SNP near APOE).
  - rsid: rs7412
    gene: APOE
    phenotype: APOE ε2-defining, longer life
    trait_efo_id: OBA_VT0005372
    effect_allele: T
    effect_size: 1.28
    effect_measure: OR
    stat_significance: significant
    direction: protective
    negatives: >-
      ε2, the longer-lived version, has been linked to age-related macular degeneration, kidney disease, type III
      hyperlipidaemia and high triglycerides, and bleeding strokes from amyloid in brain vessels (Kuo 2020's summary);
      two copies raise triglycerides by about 0.4 standard deviations in UK Biobank.
haplotypes:
  - {name: ε2, gene: APOE, alleles: [{rsid: rs429358, allele: T}, {rsid: rs7412, allele: T}]}
  - {name: ε3, gene: APOE, alleles: [{rsid: rs429358, allele: T}, {rsid: rs7412, allele: C}]}
  - {name: ε4, gene: APOE, alleles: [{rsid: rs429358, allele: C}, {rsid: rs7412, allele: C}]}
diplotypes:
  - gene: APOE
    pair: [ε2, ε2]
    state: protective
    conclusion: >-
      You carry two copies of APOE ε2, the rarest common version of this gene; about 1 in 160 people of European
      ancestry have this pair. Each ε2 copy is linked to a longer life: about 28 % higher odds of reaching the top 10 %
      of ages in a large European study, and about 7 months more lifespan per copy in UK and European family data. A
      study of long-lived people found higher odds of extreme old age for people with ε2/ε2 or ε2/ε3 than with the
      common ε3/ε3. The figure for two copies is an estimate built from single copies, and direct data on this rare
      pair are thin and uncertain. ε2/ε2 also has downsides, below. For Alzheimer's disease, see the second result
      for this pair and the separate APOE module. A tendency, not destiny.
    negatives: >-
      Two ε2 copies raise blood triglycerides (about 0.4 standard deviations in UK Biobank), and ε2 has been linked to
      a rare blood-fat disorder (type III hyperlipidaemia), age-related macular degeneration and bleeding strokes; in
      UK Biobank, deaths among people aged 40 to 70 were not lower than with ε3/ε3 (an uncertain result).
  - gene: APOE
    pair: [ε2, ε2]
    state: protective
    trait_efo_id: MONDO_0004975
    phenotype: Alzheimer's disease
    conclusion: >-
      Alzheimer's disease: in studies of people of European ancestry, two ε2 copies came with about 0.4 times the
      odds of Alzheimer's disease of the common ε3/ε3. These are odds compared between patient and control groups,
      not a lifetime risk. The protection was weaker in Black and Hispanic samples and absent in East Asian ones. The
      separate APOE module covers this in more detail.
  - gene: APOE
    pair: [ε2, ε3]
    state: protective
    conclusion: >-
      You carry one copy of APOE ε2 and one of the common ε3 (about 12 in 100 people of European ancestry). The ε2
      copy is linked to a longer life: about 28 % higher odds of reaching the top 10 % of ages, and 47 % higher of the
      top 1 %, in a large European study, and about 7 months more lifespan in UK and European family data; a study of
      long-lived people found higher odds of extreme old age for ε2/ε3 than for ε3/ε3. In UK Biobank it also came
      with lower LDL cholesterol and slightly less heart disease. For Alzheimer's disease, see the second result for
      this pair and the separate APOE module. A tendency, not destiny.
    negatives: >-
      ε2 has been linked to age-related macular degeneration, kidney disease and bleeding strokes from amyloid in
      brain vessels.
  - gene: APOE
    pair: [ε2, ε3]
    state: protective
    trait_efo_id: MONDO_0004975
    phenotype: Alzheimer's disease
    conclusion: >-
      Alzheimer's disease: in studies of people of European ancestry, ε2/ε3 came with about half the odds of
      Alzheimer's disease of ε3/ε3 (0.53). These are odds compared between patient and control groups, not a lifetime
      risk. The protection was weaker in Black and Hispanic samples and absent in East Asian ones. The separate APOE
      module covers this in more detail.
  - gene: APOE
    pair: [ε2, ε4]
    state: risk
    conclusion: >-
      You carry one copy of APOE ε2 and one of ε4 (about 2 in 100 people of European ancestry). The two pull in
      opposite directions: ε4 is linked to a shorter life and ε2 to a longer one. Added together from single-copy
      effects (an estimate; no study read here printed this pair), ε4's larger effect wins: a little under half a year
      shorter on average than ε3/ε3, and lower odds of reaching very old age. ε4's effect grows with age. For
      Alzheimer's disease, see the second result for this pair and the separate APOE module. A tendency, not destiny.
  - gene: APOE
    pair: [ε2, ε4]
    state: risk
    trait_efo_id: MONDO_0004975
    phenotype: Alzheimer's disease
    conclusion: >-
      Alzheimer's disease: in studies of people of European ancestry, ε2/ε4 came with about twice the odds of
      Alzheimer's disease of ε3/ε3 (2.2), less than ε3/ε4. These are odds compared between patient and control
      groups, not a lifetime risk. The separate APOE module covers this in more detail.
  - gene: APOE
    pair: [ε3, ε3]
    state: neutral
    conclusion: >-
      You carry two copies of APOE ε3, the most common version (about 6 in 10 people of European ancestry). It is the
      reference the other pairs are compared with: average for lifespan, as far as this gene goes. For Alzheimer's
      disease, see the second result for this pair and the separate APOE module.
  - gene: APOE
    pair: [ε3, ε3]
    state: neutral
    trait_efo_id: MONDO_0004975
    phenotype: Alzheimer's disease
    conclusion: >-
      Alzheimer's disease: ε3/ε3 is the reference pair, with average odds as far as this gene goes. Being average for
      APOE does not mean free of Alzheimer's disease: many other genes and factors play a part. The separate APOE
      module covers this in more detail.
  - gene: APOE
    pair: [ε3, ε4]
    state: risk
    conclusion: >-
      You carry one copy of APOE ε4 and one of the common ε3 (about 22 in 100 people of European ancestry). APOE is
      the gene most often found in genetic studies of lifespan, and ε4 is its shorter-lived version: about 40 % lower
      odds of reaching the top 10 % of ages and 48 % lower of the top 1 % in a large European study, and about one
      year less lifespan per copy in UK and European family data. Its effect is small in midlife and grows after 70.
      ε4 is also linked to Alzheimer's disease and to heart and blood-vessel disease. For Alzheimer's disease, see the
      second result for this pair and the separate APOE module. A tendency, not destiny.
  - gene: APOE
    pair: [ε3, ε4]
    state: risk
    trait_efo_id: MONDO_0004975
    phenotype: Alzheimer's disease
    conclusion: >-
      Alzheimer's disease: in studies of people of European ancestry, ε3/ε4 came with about 3.5 times the odds of
      Alzheimer's disease of ε3/ε3; higher in East Asian samples (4.5), lower in Black and Hispanic ones. These are
      odds compared between patient and control groups, not a lifetime risk. The separate APOE module covers this in
      more detail.
  - gene: APOE
    pair: [ε4, ε4]
    state: risk
    conclusion: >-
      You carry two copies of APOE ε4 (about 2 in 100 people of European ancestry). Each ε4 copy is linked to a
      shorter life, about one year per copy in UK and European family data, so roughly two years for this pair on
      average (an estimate added from single copies), with much lower odds of reaching very old age. The effect is
      small in midlife and grows after 70. ε4 is also linked to Alzheimer's disease and to heart and blood-vessel
      disease. For Alzheimer's disease, see the second result for this pair and the separate APOE module. A tendency,
      not destiny.
  - gene: APOE
    pair: [ε4, ε4]
    state: risk
    trait_efo_id: MONDO_0004975
    phenotype: Alzheimer's disease
    conclusion: >-
      Alzheimer's disease: in studies of people of European ancestry, ε4/ε4 came with about 13 times the odds of
      Alzheimer's disease of ε3/ε3; lower in Black and Hispanic samples. This is the largest odds of any common pair.
      These are odds compared between patient and control groups, not a lifetime risk. The separate APOE module
      covers this in more detail, and a genetic counsellor or doctor can help with what it means for you.
