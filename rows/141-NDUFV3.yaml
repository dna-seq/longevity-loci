variants:
  - rsid: rs4148974
    gene: NDUFV3
    phenotype: NDUFV3 R200* (stop-gain), mtDNA copy number
    trait_efo_id: EFO_0006312
    effect_allele: T
    effect_size: -0.10863
    effect_measure: beta
    stat_significance: significant
    direction: unknown
    genotypes:
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the common version of this DNA position (about 89 in 100 people of European ancestry
          do). It is the reference the other combinations are compared with. The position lies in NDUFV3, a part of
          the first enzyme of the energy chain in the cell's power stations, the mitochondria. The number of
          mitochondrial DNA copies in blood is a marker whose reading only means something against your calendar age,
          which this report does not have, so this result carries no score.
      - genotype: C/T
        state: neutral
        conclusion: >-
          You carry one copy of the T version of this DNA position (about 11 in 100 people of European ancestry do). T
          cuts the NDUFV3 protein short. Large studies link it with slightly fewer copies of mitochondrial DNA in blood
          cells, about a tenth of the usual spread between people. That is a tendency in a marker whose reading only
          means something against your calendar age, which this report does not have, so it carries no score.
      - genotype: T/T
        state: neutral
        conclusion: >-
          You carry two copies of the T version of this DNA position (about 1 in 300 people of European ancestry do).
          Each copy is linked in large studies with slightly fewer copies of mitochondrial DNA in blood cells. That is
          a tendency in a marker whose reading only means something against your calendar age, which this report does
          not have, so it carries no score.
