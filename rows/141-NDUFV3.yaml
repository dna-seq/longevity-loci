# The seed list's locus 141, NDUFV3 (21q22.3): a marker of biological ageing (D32, D36.3), curated on D37.12 with 23
# TERC as the pattern. Curated 2026-11-16. Lead rs4148974, the seed's rsID (Gupta 2023's mtDNA copy-number locus): a
# stop-gain in NDUFV3's MANE transcript, R200*, GRCh38 21:42,903,610 C/T, GRCh37 21:44,323,720, C ancestral; T at
# 5.8 % in gnomAD's non-Finnish European genomes. T is the lower-copy-number allele.
locus_id: 141
locus_name: NDUFV3
verdict: kept
verdict_reason: >-
  Tier B on the marker's own evidence (D37.12; the seed gives none): the tier grades the association with
  mitochondrial DNA copy number in blood, not longevity, and this row is unscored (D32). Gupta 2023's adjusted
  copy-number GWAS is UK Biobank's own, six ancestry groups (Supplementary Table 1; All of Us is not in it), and its
  Table 2 prints rs4148974 with C, the reference allele, at 0.940, β +0.109 SD (SE 0.0075), P 4.6e-48, N 161,234,
  heterogeneity P 0.56 across the groups: T, the stop-gain, lower; the legend names AF_Allele2 the reference allele's
  frequency, so the β is per C, and the GWAS Catalog's record (C, 0.10863 increase) agrees. Table 3 fine-maps it at
  PIP 1, annotated pLoF. No second sample prints it: Koller 2024's and Zaidi 2023's supplements hold no line for it
  (by rsID and both builds' positions), and the Catalog and Open Targets hold Gupta's two lines alone (adjusted and
  raw copy number, the same people). Genome-wide in a study of 100k or more, unreplicated: §4.1's B. Lifespan
  look-ups, unscored and read for T, two-sided at 0.05 (D38.6): Timmers 2019 T beta1 +0.0022 (SE 0.0082), P 0.79;
  Pilling 2017's parents P 0.58 to 1; Park 2025's own survival P 0.89 (men 0.53, women 0.53); Deelen 2019 90th P
  0.73, 99th P 0.25; FinnGen R11's deaths P 0.96 (T at 8.2 % in Finns), a database line; Zenin 2019's healthspan P
  0.47; all flat. Foote 2025's deposits hold no line (untested). The literature search (the rsID, 2026-11-16) finds
  Ye 2014's PheWAS of stop-gain variants in Marshfield Clinic patients (abstract only, which names no NDUFV3 result)
  and a sequencing-method paper, no test of lifespan. Every genotype neutral, each conclusion a tendency of the marker
  with no colour (D32, D37.12); `direction: unknown`. Outcome cells read for T: exceptional survival 0 (Deelen flat);
  lifespan 0 (Timmers, Pilling, Park and FinnGen flat); healthspan 0 (Zenin flat). Mechanism: markers of biological
  ageing; NDUFV3 is a subunit of complex I of the mitochondrial respiratory chain. No disease pleiotropy: the Catalog
  holds only Gupta's two lines. Causal C1 (PIP 1 in Gupta's own Table 3 and in Open Targets' adjusted set). Effector
  E1, NDUFV3: a stop-gain on the MANE transcript (§4.2); locus-to-gene 0.92, the only gene listed, and T lowers
  NDUFV3's expression in blood (GTEx v10 PIP 1.00, P 1.0e-22; Lepik 2017 P 1.7e-46), Gupta's Table 4 colocalising
  the copy-number signal with that expression at PIP 1 in whole blood. Descriptive. Age of action unknown. The
  evidence is mostly European (UK Biobank's own groups, 155,998 of 163,372 European).
