    gene: ""
    phenotype: NRDE2 region, lifespan
    trait_efo_id: OBA_VT0005372
    effect_allele: G
    stat_significance: significant
    direction: protective
    genotypes:
      - genotype: G/G
        state: neutral
        conclusion: >-
          You carry two copies of the common G version of this DNA position, as almost everyone of European ancestry
          does (about three in four people of African ancestry). It is the reference the other combinations are
          compared with. The position lies inside the NRDE2 gene on chromosome 14. One small study linked the other
          version to a shorter life, but it measured that version far more often than it really occurs.
      - genotype: C/G
        state: neutral
        conclusion: >-
          You carry one copy of the C version of this DNA position, which is very rare in people of European ancestry
          (about 2 in 1,000) and more common in people of African ancestry (about 1 in 5). One small American study
          linked it to a shorter life, but that study measured this version about a hundred times more often than it
          really occurs in Europeans, and no larger study has tested it. It says nothing about your own lifespan.
      - genotype: C/C
        state: neutral
        conclusion: >-
          You carry two copies of the C version of this DNA position, which almost no one of European ancestry has
          (and about 1 or 2 in 100 people of African ancestry do). One small American study linked it to a shorter
          life, but that study measured this version far more often than it really occurs, and no larger study has
          tested it. It says nothing about your own lifespan.
