[repo]
# The repo's channel takes this name too; the seats talk there, in agent-chat and in announcements (D104).
id = "longevity-loci"
# Where the liaison files a defect of the module tooling through the kit's report-to-kit --to: the plugin's
# repository, which keeps no consumer inbox. The compiler and the registry are filed through their inboxes.
producers = "dna-seq/just-module-creator"
pace = "full-forward"

# The seats run on the cluster (the person, 2026-11-04: "due to large volume of texts and databases"). Its facts
# (partition, nodes, job prefix) are the machine file ~/.config/agent-seat-blueprints/slurm.toml, never this file:
# the repository is public. Each seated session's digest opens with this repository's jobs in the queue.
[digest.jobs]
cmd = "sh kit:drivers/slurm/digest-jobs.sh"
pinned = true

[seat.lead]
# The person's coding sessions here (docs/seats/LEAD.md): the repository's code, built for the three research
# seats; the plan; the releases. The compiler's, the registry's and the module-creator's leads may wake it (upstream lead
# to lead).
wake_from = "longevity-loci/curator longevity-loci/scout longevity-loci/module longevity-loci/liaison longevity-loci/runner just-dna-compiler/lead just-dna-registry/lead just-module-creator/lead */secretary"
# The person, 2026-11-14: "Some waker for both of you if no activity for hours with nonempty queue" (kit D200).
queue = "uv run python -I scripts/dashboard.py --left"

[seat.lead.watch.desk]
cmd = "sh kit:bin/py.sh kit:classes/desk/watch-answers.py longevity-loci lead"

# The plan's items whose state asks the lead to act (a waits-until date come, the person leaving with unattended
# items, an item left unbuilt two nights): the kit's lead role, "The plan's states".
[seat.lead.watch.plan]
cmd = "sh kit:bin/py.sh kit:classes/lead/plan-watch.py --plan docs/ROADMAP.md"

# The curation dashboard, one message kept up to date in #dashboards > longevity-loci curation every 10 minutes (the person,
# 2026-11-11: "a dashboard in respective zu channel to track progress visually"). Silent unless a refresh fails.
[seat.lead.watch.dashboard]
cmd = "sh scripts/dashboard-loop.sh kit:bin/py.sh"

[seat.lead.zulip]
pool = "~/.config/agent-seat-blueprints/zulip/pool"

[seat.curator]
# Re-curates the module's evidence row by row (docs/seats/CURATOR.md): each locus's studies read, the extended
# row and its evidence written. The scout hands it new papers; the module seat asks it about a row.
wake_from = "longevity-loci/lead longevity-loci/scout longevity-loci/module longevity-loci/runner */secretary"
# The person, 2026-11-14: "Some waker for both of you if no activity for hours with nonempty queue" (kit D200).
queue = "uv run python -I scripts/dashboard.py --left"

[seat.curator.watch.desk]
cmd = "sh kit:bin/py.sh kit:classes/desk/watch-answers.py longevity-loci curator"

# The scout's queue pushed to the trunk: new papers waiting for a row.
[seat.curator.watch.queue]
cmd = "sh kit:drivers/git/watch-remote.sh --path scout/queue.md"

[seat.curator.zulip]
pool = "~/.config/agent-seat-blueprints/zulip/pool"

[seat.scout]
# Watches the literature (docs/seats/SCOUT.md): searches of recent years, track by track, each new paper that
# bears on a locus queued for the curator, a locus the module lacks proposed to the module seat.
wake_from = "longevity-loci/lead longevity-loci/curator longevity-loci/module longevity-loci/runner */secretary"
# A quiet seat (kit D159): its sweeps are unattended by design, so the person away or back tells it nothing it
# needs (the seat-builder's handout, 2026-11-10; the person: "b - yes").
presence = false

[seat.scout.watch.desk]
cmd = "sh kit:bin/py.sh kit:classes/desk/watch-answers.py longevity-loci scout"

[seat.scout.zulip]
pool = "~/.config/agent-seat-blueprints/zulip/pool"

[seat.module]
# Builds the annotation module from the curated rows (docs/seats/MODULE.md), on the module-creator plugin's
# tools; rehearses each version on the registry's test instance. The curator and the scout talk to it.
wake_from = "longevity-loci/lead longevity-loci/curator longevity-loci/scout longevity-loci/liaison longevity-loci/runner */secretary"

[seat.module.watch.desk]
cmd = "sh kit:bin/py.sh kit:classes/desk/watch-answers.py longevity-loci module"

# Curated rows pushed to the trunk: the module's next increment.
[seat.module.watch.rows]
cmd = "sh kit:drivers/git/watch-remote.sh --path rows/"

[seat.module.zulip]
pool = "~/.config/agent-seat-blueprints/zulip/pool"

# The runner (docs/seats/RUNNER.md): this repository's batch jobs on the cluster, for the research seats (the
# person, 2026-11-10: "I suggest you add a runner seat to this repo and keep to your set").
[seat.runner]
roles = "runner"
presence = false
wake_from = "longevity-loci/lead longevity-loci/scout longevity-loci/curator longevity-loci/module */rigger */secretary"

[seat.runner.watch.desk]
cmd = "sh kit:bin/py.sh kit:classes/desk/watch-answers.py longevity-loci runner"

# No nodes watcher: the kit's watches the GPU partition, which a CPU-only runner never uses (the runner, 2026-11-11).
# Every ll- job of the repository, followed by its prefix: start, requeue, end with state and log (kit #380).
[seat.runner.slurm]
job_prefix = "ll-"

[seat.runner.watch.jobs]
cmd = "bash kit:drivers/slurm/watch-jobs.sh"

[seat.runner.zulip]
pool = "~/.config/agent-seat-blueprints/zulip/pool"

[seat.liaison]
# What the module stands on and does not own (docs/seats/LIAISON.md): the module-creator plugin, the compiler's
# packages, the registry. Their seats reach it: their leads (upstream lead to downstream liaison), their liaisons.
wake_from = "longevity-loci/lead longevity-loci/module longevity-loci/curator just-dna-compiler/lead just-dna-registry/lead just-module-creator/lead */liaison */upstream-liaison */secretary"

[seat.liaison.watch.desk]
cmd = "sh kit:bin/py.sh kit:classes/desk/watch-answers.py longevity-loci liaison"

# The upstreams' new tags, one watcher each, from clones outside the repository named by their lines in the
# liaison state file (kit classes/liaison/watch-upstream.sh): the ledgers docs/UPSTREAM_<NAME>.md.
[seat.liaison.watch.plugin]
cmd = "sh kit:classes/liaison/watch-upstream.sh plugin --tags"

[seat.liaison.watch.compiler]
cmd = "sh kit:classes/liaison/watch-upstream.sh compiler --tags"

[seat.liaison.watch.registry]
cmd = "sh kit:classes/liaison/watch-upstream.sh registry --tags"

# The key upstreams' releases from the package index (the kit's L136, L143; duty upstream-index): the compiler's
# three packages, which uv.lock carries; final releases only (--final, kit #470), the clone watchers say tags. Not polars or duckdb: their caps move with the plugin's lock, not a release.
[seat.liaison.watch.upstream-index]
cmd = "sh kit:bin/py.sh kit:drivers/pypi/watch-pypi.py --upstream --final just-dna-format just-dna-compiler just-dna-enricher"

# The weekly dependency bump of uv.lock, while the person is away (kit classes/liaison/LIAISON.md).
[seat.liaison.watch.nightly]
cmd = "sh kit:bin/py.sh kit:classes/base/nightly.py deps"

[seat.liaison.zulip]
pool = "~/.config/agent-seat-blueprints/zulip/pool"
