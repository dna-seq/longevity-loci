[project]
name = "longevity-loci"
version = "0.1.0"
description = "Formats and checks for the re-curation of the longevity module: curated rows, evidence notes, the article cache."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Capped below 0.8, the liaison's (docs/UPSTREAM_COMPILER.md, "Caps"): 0.8 moves this machine's shared Ensembl
    # cache to a new snapshot repository, which the module-creator plugin's 0.7 enricher reads in the same
    # directory. Lifted with the plugin's move to 0.8.
    "just-dna-enricher>=0.7.3,<0.8",
    # Capped below 2, the liaison's (docs/UPSTREAM_COMPILER.md, "Caps"): the module-creator plugin's server runs
    # duckdb 1.5.5 and polars 1.44.2 and shares this machine's enricher cache. A .duckdb written by 2.0 crashes a
    # 1.x enricher (the compiler's RM344), and polars 2 writes other parquet bytes, so a module compiled here
    # would not match its digest there. Lifted when the plugin's lock moves to 2.
    "duckdb<2",
    "polars<2",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
loci = "longevity_loci.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/longevity_loci"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
