[project]
name = "longevity-loci"
version = "0.1.0"
description = "Formats and checks for the re-curation of the longevity module: curated rows, evidence notes, the article cache."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
loci = "longevity_loci.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/longevity_loci"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
